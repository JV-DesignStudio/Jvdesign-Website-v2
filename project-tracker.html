<!DOCTYPE html>
<html lang="en">
<head>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#BC4749">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-3JBXCCNY4C"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-3JBXCCNY4C');</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Project Tracker JVDesignStudio</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#1a1714; --bg2:#211e1b; --bg3:#2a2622; --bg4:#322e29;
  --border:rgba(255,255,255,.07); --border2:rgba(255,255,255,.12);
  --text:#f0ead6; --muted:rgba(240,234,214,.45); --muted2:rgba(240,234,214,.25);
  --rose:#BC4749; --rose-dk:#9b3a3c; --rose-lt:#fdf0f0;
  --teal:#70A3A7; --teal-lt:#9dc4c8;
  --gold:#f5c842; --gold-lt:#fada7a;
  --green:#22c55e; --green-lt:#4ade80;
  --blue:#60a5fa; --blue-lt:#93c5fd;
  --purple:#a78bfa; --purple-lt:#c4b5fd;
  --orange:#fb923c;

  /* Column colours */
  --col-ideas:   #7c3aed;
  --col-todo:    #0284c7;
  --col-doing:   #d97706;
  --col-review:  #dc2626;
  --col-done:    #16a34a;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
a{text-decoration:none;color:inherit}

/* ── HEADER ── */
.header{position:sticky;top:0;z-index:200;background:rgba(26,23,20,.97);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);padding:0 24px;height:58px;display:flex;align-items:center;gap:16px}
.header-logo{display:flex;align-items:center;gap:10px;font-family:'Bebas Neue',cursive;font-size:1.15rem;letter-spacing:.05em;margin-right:auto}
.header-logo img{height:30px;border-radius:7px}
.header-title{font-family:'Bebas Neue',cursive;font-size:1.1rem;letter-spacing:.08em;color:var(--muted);border-left:1px solid var(--border);padding-left:16px}
.btn{font-family:'Nunito',sans-serif;font-size:.8rem;font-weight:800;padding:7px 14px;border-radius:8px;border:none;cursor:pointer;transition:filter .15s,transform .1s;display:inline-flex;align-items:center;gap:6px}
.btn:hover{filter:brightness(1.1);transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
.btn-rose{background:var(--rose);color:#fff;box-shadow:0 3px 0 var(--rose-dk)}
.btn-ghost{background:rgba(255,255,255,.06);color:var(--muted);border:1px solid var(--border)}
.btn-ghost:hover{background:rgba(255,255,255,.1);color:var(--text)}
.btn-sm{font-size:.72rem;padding:5px 10px;border-radius:6px}

/* ── BOARD AREA ── */
.board-wrap{padding:20px 20px 40px;min-height:calc(100vh - 58px);overflow-x:auto}
.board{display:flex;gap:16px;align-items:flex-start;min-height:calc(100vh - 120px);width:max-content;min-width:100%}

/* ── COLUMN ── */
.column{width:290px;flex-shrink:0;display:flex;flex-direction:column;gap:0;background:var(--bg2);border-radius:14px;border:1px solid var(--border);overflow:hidden}
.column.drag-over{border-color:var(--gold);background:rgba(245,200,66,.05)}
.col-header{padding:13px 14px 11px;display:flex;align-items:center;gap:9px;border-bottom:1px solid var(--border);cursor:default}
.col-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.col-title{font-family:'Bebas Neue',cursive;font-size:1rem;letter-spacing:.06em;flex:1}
.col-count{font-family:'JetBrains Mono',monospace;font-size:.6rem;font-weight:700;padding:2px 7px;border-radius:10px;background:rgba(255,255,255,.07);color:var(--muted)}
.col-add{background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:2px 4px;border-radius:5px;transition:color .15s,background .15s;line-height:1}
.col-add:hover{color:var(--text);background:rgba(255,255,255,.08)}
.col-cards{padding:10px 10px;display:flex;flex-direction:column;gap:8px;min-height:60px;flex:1}

/* ── CARD ── */
.card{background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:12px 13px;cursor:grab;transition:box-shadow .15s,transform .15s,border-color .15s;position:relative;user-select:none}
.card:hover{border-color:var(--border2);box-shadow:0 4px 20px rgba(0,0,0,.4);transform:translateY(-1px)}
.card.dragging{opacity:.4;cursor:grabbing}
.card.drag-placeholder{background:rgba(255,255,255,.03);border:2px dashed rgba(255,255,255,.15);border-radius:10px;height:60px}
.card-tags{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:7px}
.card-tag{font-family:'JetBrains Mono',monospace;font-size:.55rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 7px;border-radius:4px}
.card-title{font-size:.88rem;font-weight:800;color:var(--text);line-height:1.4;margin-bottom:6px}
.card-desc{font-size:.75rem;color:var(--muted);line-height:1.55;margin-bottom:8px}
.card-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.card-date{font-family:'JetBrains Mono',monospace;font-size:.6rem;color:var(--muted2)}
.card-priority{font-size:.58rem;font-weight:700;padding:2px 7px;border-radius:4px;text-transform:uppercase;letter-spacing:.06em}
.pri-high{background:rgba(239,68,68,.15);color:#fca5a5;border:1px solid rgba(239,68,68,.2)}
.pri-med{background:rgba(245,158,11,.12);color:#fcd34d;border:1px solid rgba(245,158,11,.18)}
.pri-low{background:rgba(34,197,94,.1);color:#86efac;border:1px solid rgba(34,197,94,.15)}
.card-actions{position:absolute;top:8px;right:8px;display:none;gap:4px}
.card:hover .card-actions{display:flex}
.card-action-btn{background:rgba(0,0,0,.5);border:1px solid var(--border);border-radius:5px;color:var(--muted);font-size:.7rem;padding:3px 6px;cursor:pointer;transition:color .15s,background .15s}
.card-action-btn:hover{background:rgba(255,255,255,.1);color:var(--text)}
.card-comments{margin-top:8px;padding-top:8px;border-top:1px solid var(--border);display:none;flex-direction:column;gap:5px}
.card-comments.open{display:flex}
.comment{background:var(--bg4);border-radius:6px;padding:7px 9px;font-size:.73rem;color:var(--muted);line-height:1.5;position:relative}
.comment-meta{font-family:'JetBrains Mono',monospace;font-size:.55rem;color:var(--muted2);margin-bottom:3px}
.comment-del{position:absolute;top:5px;right:6px;background:none;border:none;color:var(--muted2);cursor:pointer;font-size:.7rem;opacity:0;transition:opacity .15s}
.comment:hover .comment-del{opacity:1}
.comment-input-row{display:flex;gap:6px;margin-top:4px}
.comment-input{flex:1;background:var(--bg4);border:1px solid var(--border);border-radius:6px;color:var(--text);font-family:'Nunito',sans-serif;font-size:.75rem;padding:6px 9px;outline:none;resize:none;transition:border-color .15s}
.comment-input:focus{border-color:var(--teal)}
.comment-submit{background:var(--teal);color:#fff;border:none;border-radius:6px;padding:6px 10px;font-size:.7rem;font-weight:700;cursor:pointer;transition:filter .15s;flex-shrink:0}
.comment-submit:hover{filter:brightness(1.1)}

/* ── ADD COLUMN ── */
.add-column-btn{width:260px;flex-shrink:0;background:rgba(255,255,255,.03);border:2px dashed rgba(255,255,255,.1);border-radius:14px;padding:20px;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;color:var(--muted);font-weight:700;font-size:.85rem;transition:background .15s,border-color .15s,color .15s;align-self:flex-start}
.add-column-btn:hover{background:rgba(255,255,255,.06);border-color:rgba(255,255,255,.2);color:var(--text)}

/* ── MODAL ── */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
.modal-overlay.open{display:flex}
.modal{background:var(--bg2);border:1px solid var(--border2);border-radius:16px;padding:28px;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
.modal-title{font-family:'Bebas Neue',cursive;font-size:1.4rem;letter-spacing:.04em;color:var(--text)}
.modal-field{display:flex;flex-direction:column;gap:6px}
.modal-label{font-size:.75rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.modal-input,.modal-textarea,.modal-select{background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Nunito',sans-serif;font-size:.88rem;padding:10px 13px;outline:none;transition:border-color .2s;width:100%}
.modal-input:focus,.modal-textarea:focus,.modal-select:focus{border-color:var(--teal)}
.modal-textarea{resize:vertical;min-height:80px;line-height:1.55}
.modal-select option{background:var(--bg3)}
.modal-row{display:flex;gap:10px}
.modal-row .modal-field{flex:1}
.tag-input-row{display:flex;gap:7px;flex-wrap:wrap;align-items:center;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:7px 10px;cursor:text}
.tag-input-row:focus-within{border-color:var(--teal)}
.tag-pill{font-family:'JetBrains Mono',monospace;font-size:.62rem;font-weight:700;padding:3px 8px;border-radius:4px;display:flex;align-items:center;gap:5px;cursor:default}
.tag-pill-del{background:none;border:none;color:inherit;cursor:pointer;font-size:.7rem;opacity:.6;padding:0 1px}
.tag-pill-del:hover{opacity:1}
.tag-input-bare{background:none;border:none;outline:none;color:var(--text);font-family:'Nunito',sans-serif;font-size:.82rem;min-width:80px;flex:1}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;padding-top:4px}
.colour-row{display:flex;gap:8px;flex-wrap:wrap}
.colour-swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:border-color .15s,transform .15s}
.colour-swatch:hover,.colour-swatch.selected{border-color:white;transform:scale(1.15)}

/* ── SEARCH/FILTER BAR ── */
.toolbar{display:flex;gap:10px;padding:12px 20px;border-bottom:1px solid var(--border);align-items:center;flex-wrap:wrap;background:var(--bg2)}
.toolbar-search{background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:'Nunito',sans-serif;font-size:.83rem;padding:7px 12px;outline:none;width:220px;transition:border-color .2s}
.toolbar-search:focus{border-color:var(--teal)}
.toolbar-filter{display:flex;gap:6px;flex-wrap:wrap}
.filter-chip{font-size:.72rem;font-weight:700;padding:5px 11px;border-radius:6px;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--muted);cursor:pointer;transition:all .15s}
.filter-chip:hover,.filter-chip.active{background:var(--teal);border-color:var(--teal);color:#fff}
.toolbar-right{margin-left:auto;display:flex;gap:8px;align-items:center}
.stat-pill{font-family:'JetBrains Mono',monospace;font-size:.62rem;padding:4px 10px;border-radius:6px;background:rgba(255,255,255,.05);border:1px solid var(--border);color:var(--muted);white-space:nowrap}

/* ── TOAST ── */
.toast{position:fixed;bottom:24px;right:24px;z-index:999;background:var(--bg3);border:1px solid var(--border2);border-radius:10px;padding:12px 18px;font-size:.82rem;font-weight:700;color:var(--text);box-shadow:0 8px 30px rgba(0,0,0,.5);transform:translateY(20px);opacity:0;transition:transform .3s,opacity .3s;pointer-events:none}
.toast.show{transform:translateY(0);opacity:1}

/* ── EMPTY STATE ── */
.col-empty{padding:16px 10px;text-align:center;color:var(--muted2);font-size:.75rem;border:2px dashed rgba(255,255,255,.06);border-radius:8px;display:none}
.col-cards:empty + .col-empty,.col-cards.empty-vis + .col-empty{display:block}
</style>
</head>
<body>

<header class="header">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#BC4749">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-3JBXCCNY4C"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-3JBXCCNY4C');</script>
  <div class="header-logo">
    <img loading="lazy" src="logo.png" alt="JV" onerror="this.onerror=null;this.style.display='none'">
    JVDesignStudio
  </div>
  <span class="header-title">Project Tracker</span>
  <button class="btn btn-ghost btn-sm" onclick="exportData()">📤 Export</button>
  <button class="btn btn-ghost btn-sm" onclick="importData()">📥 Import</button>
  <button class="btn btn-rose btn-sm" onclick="openCardModal()">+ New Card</button>
</header>

<div class="toolbar">
  <input class="toolbar-search" type="text" id="searchInput" placeholder="🔍 Search cards…" oninput="filterCards()">
  <div class="toolbar-filter" id="priorityFilters">
    <span class="filter-chip active" data-filter="all" onclick="setPriorityFilter('all',this)">All</span>
    <span class="filter-chip" data-filter="high" onclick="setPriorityFilter('high',this)">🔴 High</span>
    <span class="filter-chip" data-filter="med" onclick="setPriorityFilter('med',this)">🟡 Med</span>
    <span class="filter-chip" data-filter="low" onclick="setPriorityFilter('low',this)">🟢 Low</span>
  </div>
  <div class="toolbar-right">
    <span class="stat-pill" id="statTotal">0 cards</span>
    <span class="stat-pill" id="statDone">0 done</span>
  </div>
</div>

<div class="board-wrap">
  <div class="board" id="board"></div>
</div>

<!-- ADD/EDIT CARD MODAL -->
<div class="modal-overlay" id="cardModal">
  <div class="modal">
    <div class="modal-title" id="modalTitle">New Card</div>

    <div class="modal-field">
      <label class="modal-label">Title</label>
      <input class="modal-input" id="cardTitle" placeholder="What needs doing?">
    </div>

    <div class="modal-field">
      <label class="modal-label">Description</label>
      <textarea class="modal-textarea" id="cardDesc" placeholder="More details, links, notes…"></textarea>
    </div>

    <div class="modal-row">
      <div class="modal-field">
        <label class="modal-label">Column</label>
        <select class="modal-select" id="cardColumn"></select>
      </div>
      <div class="modal-field">
        <label class="modal-label">Priority</label>
        <select class="modal-select" id="cardPriority">
          <option value="high">🔴 High</option>
          <option value="med" selected>🟡 Medium</option>
          <option value="low">🟢 Low</option>
        </select>
      </div>
    </div>

    <div class="modal-field">
      <label class="modal-label">Due Date</label>
      <input class="modal-input" id="cardDate" type="date">
    </div>

    <div class="modal-field">
      <label class="modal-label">Tags (press Enter to add)</label>
      <div class="tag-input-row" id="tagInputRow" onclick="document.getElementById('tagInput').focus()">
        <input class="tag-input-bare" id="tagInput" placeholder="e.g. workshop, urgent…" onkeydown="handleTagKey(event)">
      </div>
    </div>

    <div class="modal-field">
      <label class="modal-label">Tag Colour</label>
      <div class="colour-row" id="colourRow">
        <div class="colour-swatch selected" style="background:#7c3aed" data-col="#7c3aed" onclick="selectColour(this)"></div>
        <div class="colour-swatch" style="background:#0284c7" data-col="#0284c7" onclick="selectColour(this)"></div>
        <div class="colour-swatch" style="background:#d97706" data-col="#d97706" onclick="selectColour(this)"></div>
        <div class="colour-swatch" style="background:#dc2626" data-col="#dc2626" onclick="selectColour(this)"></div>
        <div class="colour-swatch" style="background:#16a34a" data-col="#16a34a" onclick="selectColour(this)"></div>
        <div class="colour-swatch" style="background:#0891b2" data-col="#0891b2" onclick="selectColour(this)"></div>
        <div class="colour-swatch" style="background:#be185d" data-col="#be185d" onclick="selectColour(this)"></div>
        <div class="colour-swatch" style="background:#b45309" data-col="#b45309" onclick="selectColour(this)"></div>
      </div>
    </div>

    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeCardModal()">Cancel</button>
      <button class="btn btn-rose" onclick="saveCard()">Save Card</button>
    </div>
  </div>
</div>

<!-- ADD COLUMN MODAL -->
<div class="modal-overlay" id="colModal">
  <div class="modal" style="max-width:360px">
    <div class="modal-title">New Column</div>
    <div class="modal-field">
      <label class="modal-label">Column Name</label>
      <input class="modal-input" id="colName" placeholder="e.g. In Review…">
    </div>
    <div class="modal-field">
      <label class="modal-label">Colour</label>
      <div class="colour-row" id="colColourRow">
        <div class="colour-swatch selected" style="background:#7c3aed" data-col="#7c3aed" onclick="selectColColour(this)"></div>
        <div class="colour-swatch" style="background:#0284c7" data-col="#0284c7" onclick="selectColColour(this)"></div>
        <div class="colour-swatch" style="background:#d97706" data-col="#d97706" onclick="selectColColour(this)"></div>
        <div class="colour-swatch" style="background:#dc2626" data-col="#dc2626" onclick="selectColColour(this)"></div>
        <div class="colour-swatch" style="background:#16a34a" data-col="#16a34a" onclick="selectColColour(this)"></div>
        <div class="colour-swatch" style="background:#0891b2" data-col="#0891b2" onclick="selectColColour(this)"></div>
        <div class="colour-swatch" style="background:#be185d" data-col="#be185d" onclick="selectColColour(this)"></div>
        <div class="colour-swatch" style="background:#b45309" data-col="#b45309" onclick="selectColColour(this)"></div>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeColModal()">Cancel</button>
      <button class="btn btn-rose" onclick="saveColumn()">Add Column</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ══════════════════════════════════════
   DATA MODEL
══════════════════════════════════════ */
const STORAGE_KEY = 'jvds-tracker-v2';

    { id: 'done',     title: '✅ Done',            colour: '#404040' },

  cards: [
    // ── READY TO DEPLOY ──

    { id:'d10', colId:'deploy', title:'Saving_guests.png',            desc:'Cover image for OpenRCT2 Swim Rescue workshop card.',                          tags:[{text:'Asset',col:'#be185d'}],    priority:'med',  date:'', comments:[] },
    { id:'d11', colId:'deploy', title:'project-tracker.html',         desc:'This board! Kanban tracker with comments, drag/drop, persistent storage.',    tags:[{text:'New',col:'#0284c7'}],      priority:'med',  date:'', comments:[] },
    { id:'d12', colId:'deploy', title:'about.html + 9 others',        desc:'Copyright 2025→2026 fixed across 10 pages.',                                   tags:[{text:'Updated',col:'#f5c842'}],  priority:'med',  date:'', comments:[] },

function save() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch(e){}
}

function load() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) state = JSON.parse(raw);
  } catch(e) {}
}

/* ══════════════════════════════════════
   RENDER
══════════════════════════════════════ */
let dragCard = null;
let dragPlaceholder = null;
let activeFilter = 'all';

function render() {
  const board = document.getElementById('board');
  const search = document.getElementById('searchInput')?.value?.toLowerCase() || '';
  board.innerHTML = '';

  state.columns.forEach(col => {
    const cards = state.cards.filter(c => {
      if (c.colId !== col.id) return false;
      if (activeFilter !== 'all' && c.priority !== activeFilter) return false;
      if (search && !c.title.toLowerCase().includes(search) && !c.desc.toLowerCase().includes(search) &&
          !c.tags.some(t => t.text.toLowerCase().includes(search))) return false;
      return true;
    });

    const colEl = document.createElement('div');
    colEl.className = 'column';
    colEl.dataset.colId = col.id;

    colEl.addEventListener('dragover', e => { e.preventDefault(); colEl.classList.add('drag-over'); insertPlaceholder(e, colEl.querySelector('.col-cards')); });
    colEl.addEventListener('dragleave', e => { if (!colEl.contains(e.relatedTarget)) colEl.classList.remove('drag-over'); });
    colEl.addEventListener('drop', e => { e.preventDefault(); colEl.classList.remove('drag-over'); dropCard(col.id, colEl.querySelector('.col-cards')); });

    colEl.innerHTML = `
      <div class="col-header">
        <div class="col-dot" style="background:${col.colour}"></div>
        <div class="col-title" style="color:${col.colour}">${col.title}</div>
        <div class="col-count">${cards.length}</div>
        <button class="col-add" title="Add card" onclick="openCardModal('${col.id}')">+</button>
        ${col.id !== 'ideas' && col.id !== 'todo' && col.id !== 'doing' && col.id !== 'review' && col.id !== 'done' ?
          `<button class="col-add" title="Delete column" onclick="deleteColumn('${col.id}')">×</button>` : ''}
      </div>
      <div class="col-cards" id="cards-${col.id}"></div>
      <div class="col-empty">No cards here yet</div>`;

    const cardsEl = colEl.querySelector('.col-cards');
    if (cards.length === 0) cardsEl.classList.add('empty-vis');

    cards.forEach(card => {
      const cardEl = buildCard(card);
      cardsEl.appendChild(cardEl);
    });

    board.appendChild(colEl);
  });

  // Add column button
  const addColBtn = document.createElement('div');
  addColBtn.className = 'add-column-btn';
  addColBtn.innerHTML = '+ Add Column';
  addColBtn.onclick = () => document.getElementById('colModal').classList.add('open');
  board.appendChild(addColBtn);

  updateStats();
  populateColumnSelect();
}

function buildCard(card) {
  const el = document.createElement('div');
  el.className = 'card';
  el.dataset.cardId = card.id;
  el.draggable = true;

  el.addEventListener('dragstart', e => { dragCard = card; el.classList.add('dragging'); e.dataTransfer.effectAllowed = 'move'; });
  el.addEventListener('dragend', () => { el.classList.remove('dragging'); removePlaceholder(); });

  const priClass = {high:'pri-high',med:'pri-med',low:'pri-low'}[card.priority] || 'pri-med';
  const priLabel = {high:'High',med:'Medium',low:'Low'}[card.priority] || 'Med';
  const tagsHtml = card.tags.map(t =>
    `<span class="card-tag" style="background:${t.col}22;color:${t.col};border:1px solid ${t.col}44">${t.text}</span>`
  ).join('');
  const dateHtml = card.date ? `<span class="card-date">📅 ${card.date}</span>` : '';
  const commentCount = card.comments.length;
  const commentsHtml = card.comments.map((c,ci) => `
    <div class="comment">
      <div class="comment-meta">${c.date}</div>
      <div>${escHtml(c.text)}</div>
      <button class="comment-del" onclick="deleteComment('${card.id}',${ci})">✕</button>
    </div>`).join('');

  el.innerHTML = `
    <div class="card-actions">
      <button class="card-action-btn" onclick="openCardModal(null,'${card.id}')" title="Edit">✏️</button>
      <button class="card-action-btn" onclick="deleteCard('${card.id}')" title="Delete">🗑</button>
    </div>
    ${tagsHtml ? `<div class="card-tags">${tagsHtml}</div>` : ''}
    <div class="card-title">${escHtml(card.title)}</div>
    ${card.desc ? `<div class="card-desc">${escHtml(card.desc)}</div>` : ''}
    <div class="card-meta">
      <span class="card-priority ${priClass}">${priLabel}</span>
      ${dateHtml}
      <button class="card-action-btn" style="margin-left:auto;display:inline-flex;align-items:center;gap:4px" onclick="toggleComments('${card.id}',this)">
        💬 ${commentCount}
      </button>
    </div>
    <div class="card-comments" id="comments-${card.id}">
      ${commentsHtml}
      <div class="comment-input-row">
        <textarea class="comment-input" id="ci-${card.id}" rows="2" placeholder="Add a comment…"></textarea>
        <button class="comment-submit" onclick="addComment('${card.id}')">Post</button>
      </div>
    </div>`;

  return el;
}

/* ══════════════════════════════════════
   DRAG AND DROP
══════════════════════════════════════ */
function insertPlaceholder(e, cardsEl) {
  if (!dragCard) return;
  removePlaceholder();
  dragPlaceholder = document.createElement('div');
  dragPlaceholder.className = 'card drag-placeholder';

  const cards = [...cardsEl.querySelectorAll('.card:not(.dragging)')];
  let inserted = false;
  for (const c of cards) {
    const box = c.getBoundingClientRect();
    if (e.clientY < box.top + box.height / 2) {
      cardsEl.insertBefore(dragPlaceholder, c);
      inserted = true;
      break;
    }
  }
  if (!inserted) cardsEl.appendChild(dragPlaceholder);
}

function removePlaceholder() {
  if (dragPlaceholder) { dragPlaceholder.remove(); dragPlaceholder = null; }
}

function dropCard(colId, cardsEl) {
  if (!dragCard) return;
  dragCard.colId = colId;

  // Work out position from placeholder
  const cards = [...cardsEl.querySelectorAll('.card:not(.dragging)')];
  const phIdx = dragPlaceholder ? [...cardsEl.children].indexOf(dragPlaceholder) : cards.length;

  // Reorder state.cards
  const others = state.cards.filter(c => c.id !== dragCard.id);
  const colCards = others.filter(c => c.colId === colId);
  const beforeCard = cards[phIdx];
  const insertIdx = beforeCard ? others.indexOf(others.find(c => c.id === beforeCard.dataset.cardId)) : others.length;

  state.cards = state.cards.filter(c => c.id !== dragCard.id);
  const globalIdx = insertIdx >= 0 ? insertIdx : state.cards.length;
  state.cards.splice(globalIdx, 0, dragCard);

  removePlaceholder();
  dragCard = null;
  save();
  render();
}

/* ══════════════════════════════════════
   CARD MODAL
══════════════════════════════════════ */
let editingCardId = null;
let currentTags = [];
let currentTagColour = '#7c3aed';

function openCardModal(defaultColId, editId) {
  editingCardId = editId || null;
  currentTags = [];

  const modal = document.getElementById('cardModal');
  document.getElementById('modalTitle').textContent = editId ? 'Edit Card' : 'New Card';

  if (editId) {
    const card = state.cards.find(c => c.id === editId);
    if (!card) return;
    document.getElementById('cardTitle').value = card.title;
    document.getElementById('cardDesc').value = card.desc;
    document.getElementById('cardPriority').value = card.priority;
    document.getElementById('cardDate').value = card.date || '';
    document.getElementById('cardColumn').value = card.colId;
    currentTags = [...card.tags];
  } else {
    document.getElementById('cardTitle').value = '';
    document.getElementById('cardDesc').value = '';
    document.getElementById('cardPriority').value = 'med';
    document.getElementById('cardDate').value = '';
    if (defaultColId) document.getElementById('cardColumn').value = defaultColId;
  }

  renderTagPills();
  modal.classList.add('open');
  setTimeout(() => document.getElementById('cardTitle').focus(), 100);
}

function closeCardModal() {
  document.getElementById('cardModal').classList.remove('open');
  editingCardId = null;
  currentTags = [];
}

function saveCard() {
  const title = document.getElementById('cardTitle').value.trim();
  if (!title) { showToast('Please add a title!'); return; }

  const colId = document.getElementById('cardColumn').value;
  const priority = document.getElementById('cardPriority').value;
  const date = document.getElementById('cardDate').value;
  const desc = document.getElementById('cardDesc').value.trim();

  if (editingCardId) {
    const card = state.cards.find(c => c.id === editingCardId);
    if (card) { Object.assign(card, { title, desc, colId, priority, date, tags: [...currentTags] }); }
  } else {
    state.cards.push({ id: 'c' + (++state.nextId), colId, title, desc, priority, date, tags: [...currentTags], comments: [] });
  }

  save(); render(); closeCardModal();
  showToast(editingCardId ? '✅ Card updated!' : '✅ Card added!');
}

function deleteCard(id) {
  if (!confirm('Delete this card?')) return;
  state.cards = state.cards.filter(c => c.id !== id);
  save(); render(); showToast('🗑 Card deleted');
}

/* ══════════════════════════════════════
   TAGS
══════════════════════════════════════ */
function handleTagKey(e) {
  if (e.key === 'Enter' || e.key === ',') {
    e.preventDefault();
    const val = e.target.value.trim().replace(/,$/, '');
    if (val) { currentTags.push({ text: val, col: currentTagColour }); e.target.value = ''; renderTagPills(); }
  }
  if (e.key === 'Backspace' && !e.target.value && currentTags.length) {
    currentTags.pop(); renderTagPills();
  }
}

function renderTagPills() {
  const row = document.getElementById('tagInputRow');
  const input = document.getElementById('tagInput');
  row.querySelectorAll('.tag-pill').forEach(p => p.remove());
  currentTags.forEach((t, i) => {
    const pill = document.createElement('span');
    pill.className = 'tag-pill';
    pill.style.cssText = `background:${t.col}22;color:${t.col};border:1px solid ${t.col}44`;
    pill.innerHTML = `${escHtml(t.text)}<button class="tag-pill-del" onclick="removeTag(${i})">×</button>`;
    row.insertBefore(pill, input);
  });
}

function removeTag(i) { currentTags.splice(i, 1); renderTagPills(); }

function selectColour(el) {
  document.querySelectorAll('#colourRow .colour-swatch').forEach(s => s.classList.remove('selected'));
  el.classList.add('selected');
  currentTagColour = el.dataset.col;
}

/* ══════════════════════════════════════
   COMMENTS
══════════════════════════════════════ */
function toggleComments(cardId, btn) {
  const el = document.getElementById('comments-' + cardId);
  el.classList.toggle('open');
  if (el.classList.contains('open')) document.getElementById('ci-' + cardId)?.focus();
}

function addComment(cardId) {
  const input = document.getElementById('ci-' + cardId);
  const text = input?.value?.trim();
  if (!text) return;
  const card = state.cards.find(c => c.id === cardId);
  if (!card) return;
  card.comments.push({ text, date: new Date().toLocaleDateString('en-GB', {day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}) });
  save(); render();
  // Re-open comments section after re-render
  setTimeout(() => { const el = document.getElementById('comments-' + cardId); if(el) el.classList.add('open'); }, 10);
}

function deleteComment(cardId, idx) {
  const card = state.cards.find(c => c.id === cardId);
  if (!card) return;
  card.comments.splice(idx, 1);
  save(); render();
  setTimeout(() => { const el = document.getElementById('comments-' + cardId); if(el) el.classList.add('open'); }, 10);
}

/* ══════════════════════════════════════
   COLUMNS
══════════════════════════════════════ */
let currentColColour = '#7c3aed';

function saveColumn() {
  const name = document.getElementById('colName').value.trim();
  if (!name) { showToast('Please add a column name'); return; }
  const id = 'col_' + Date.now();
  state.columns.push({ id, title: name, colour: currentColColour });
  save(); render(); closeColModal();
  showToast('✅ Column added!');
}

function closeColModal() {
  document.getElementById('colModal').classList.remove('open');
  document.getElementById('colName').value = '';
}

function deleteColumn(id) {
  if (!confirm('Delete this column and all its cards?')) return;
  state.columns = state.columns.filter(c => c.id !== id);
  state.cards = state.cards.filter(c => c.colId !== id);
  save(); render(); showToast('🗑 Column deleted');
}

function selectColColour(el) {
  document.querySelectorAll('#colColourRow .colour-swatch').forEach(s => s.classList.remove('selected'));
  el.classList.add('selected');
  currentColColour = el.dataset.col;
}

function populateColumnSelect() {
  const sel = document.getElementById('cardColumn');
  const current = sel.value;
  sel.innerHTML = state.columns.map(c => `<option value="${c.id}">${c.title}</option>`).join('');
  if (current) sel.value = current;
}

/* ══════════════════════════════════════
   FILTER / SEARCH
══════════════════════════════════════ */
function filterCards() { render(); }

function setPriorityFilter(val, el) {
  activeFilter = val;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  render();
}

function updateStats() {
  const total = state.cards.length;
  const done = state.cards.filter(c => c.colId === 'done').length;
  document.getElementById('statTotal').textContent = total + ' card' + (total !== 1 ? 's' : '');
  document.getElementById('statDone').textContent = done + ' done';
}

/* ══════════════════════════════════════
   EXPORT / IMPORT
══════════════════════════════════════ */
function exportData() {
  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'jvds-tracker-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  showToast('📤 Board exported!');
}

function importData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = e => {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
      try {
        state = JSON.parse(ev.target.result);
        save(); render();
        showToast('📥 Board imported!');
      } catch(err) { showToast('❌ Invalid file'); }
    };
    reader.readAsText(file);
  };
  input.click();
}

/* ══════════════════════════════════════
   UTILS
══════════════════════════════════════ */
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// Close modals on overlay click
document.getElementById('cardModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeCardModal(); });
document.getElementById('colModal').addEventListener('click', e => { if (e.target === e.currentTarget) closeColModal(); });

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { closeCardModal(); closeColModal(); }
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') { e.preventDefault(); openCardModal(); }
});

/* ══════════════════════════════════════
   INIT
══════════════════════════════════════ */
load();
render();
</script>
