<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Sky High Squirt &amp; Friends</title>
<style>
  /* ============================================================
     SKY HIGH SQUIRT — v0.2
     Adds: localStorage persistence, character unlocks at height
     milestones, full shop screen with hats/skins/auras, equipped
     loadouts per character, trail particles, achievement unlocks.
     ============================================================ */

  :root {
    --ui-bg: rgba(20, 14, 38, 0.78);
    --ui-bg-solid: #1a1140;
    --ui-bg-dark: #0d0726;
    --ui-stroke: rgba(255, 255, 255, 0.18);
    --ui-text: #fdf6e3;
    --accent: #ffd23f;
    --accent-2: #ff7eb9;
    --accent-3: #5cdbff;
    --locked: #4a3d6b;
    --owned: #4caf50;
    --equipped: #ffd23f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: #0a0617;
    color: var(--ui-text);
    font-family: 'Trebuchet MS', 'Lucida Sans', sans-serif;
    overflow: hidden;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  #wrap {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
  }

  canvas {
    display: block;
    background: #87ceeb;
    box-shadow: 0 30px 80px rgba(0,0,0,0.6);
    border-radius: 6px;
    image-rendering: auto;
    touch-action: none;
    width: 420px;
    height: 700px;
    max-width: 100vw;
    max-height: 100vh;
  }

  .hud {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 5;
    pointer-events: none;
  }
  .hud .pill {
    background: var(--ui-bg);
    border: 1px solid var(--ui-stroke);
    border-radius: 999px;
    padding: 8px 16px;
    font-weight: 700;
    letter-spacing: 0.5px;
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    font-size: 14px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.4);
  }
  .hud .pill .label { opacity: 0.6; font-weight: 500; margin-right: 6px; font-size: 11px; text-transform: uppercase; }
  .hud .pill.coins { color: var(--accent); }

  .overlay {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    background: radial-gradient(ellipse at center, rgba(10,6,23,0.75), rgba(10,6,23,0.95));
    z-index: 10;
    pointer-events: auto;
    overflow-y: auto;
    padding: 20px;
  }
  .overlay.hidden { display: none; }

  .panel {
    background: linear-gradient(180deg, var(--ui-bg-solid), var(--ui-bg-dark));
    border: 1px solid var(--ui-stroke);
    border-radius: 18px;
    padding: 28px 32px;
    text-align: center;
    max-width: 460px;
    width: 100%;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.08);
  }
  .panel.shop-panel {
    max-width: 540px;
    text-align: left;
  }
  .panel h1 {
    font-size: 30px;
    margin-bottom: 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent-2));
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    letter-spacing: 0.5px;
    text-align: center;
  }
  .panel h2 {
    font-size: 22px;
    margin-bottom: 12px;
    text-align: center;
  }
  .panel p { opacity: 0.75; font-size: 14px; line-height: 1.5; margin-bottom: 18px; text-align: center; }

  .char-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin: 18px 0 10px;
  }
  .char-btn {
    width: 64px;
    height: 64px;
    border-radius: 14px;
    border: 2px solid transparent;
    background: rgba(255,255,255,0.06);
    cursor: pointer;
    font-size: 32px;
    display: grid;
    place-items: center;
    transition: transform 0.15s, border-color 0.15s, background 0.15s;
    position: relative;
  }
  .char-btn:hover:not(.locked) { transform: translateY(-2px); background: rgba(255,255,255,0.1); }
  .char-btn.active {
    border-color: var(--accent);
    background: rgba(255, 210, 63, 0.15);
    box-shadow: 0 0 20px rgba(255, 210, 63, 0.3);
  }
  .char-btn.locked {
    cursor: not-allowed;
    opacity: 0.4;
    filter: grayscale(0.8);
  }
  .char-btn .lock {
    position: absolute;
    bottom: -2px;
    right: -2px;
    background: var(--locked);
    color: #fff;
    font-size: 9px;
    font-weight: 700;
    padding: 2px 5px;
    border-radius: 6px;
    border: 1px solid rgba(0,0,0,0.4);
  }
  .char-name {
    font-size: 13px;
    opacity: 0.8;
    margin-bottom: 4px;
    height: 16px;
    text-align: center;
  }
  .char-unlock-hint {
    font-size: 11px;
    color: var(--accent-3);
    height: 14px;
    margin-bottom: 14px;
    text-align: center;
  }

  .btn {
    background: linear-gradient(180deg, var(--accent), #f0a500);
    color: #2a1a00;
    border: none;
    padding: 14px 32px;
    border-radius: 999px;
    font-weight: 800;
    font-size: 16px;
    letter-spacing: 0.5px;
    cursor: pointer;
    text-transform: uppercase;
    box-shadow: 0 6px 0 #a86f00, 0 10px 20px rgba(0,0,0,0.3);
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn:active { transform: translateY(3px); box-shadow: 0 3px 0 #a86f00, 0 5px 10px rgba(0,0,0,0.3); }
  .btn.secondary {
    background: linear-gradient(180deg, #6b4ba8, #483078);
    color: #fff;
    box-shadow: 0 6px 0 #2e1a4e, 0 10px 20px rgba(0,0,0,0.3);
  }
  .btn.secondary:active { box-shadow: 0 3px 0 #2e1a4e, 0 5px 10px rgba(0,0,0,0.3); }

  .btn-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-top: 8px;
  }

  .stats {
    display: flex;
    gap: 24px;
    justify-content: center;
    margin: 18px 0;
  }
  .stat .v { font-size: 28px; font-weight: 800; color: var(--accent); }
  .stat .l { font-size: 11px; opacity: 0.6; text-transform: uppercase; letter-spacing: 1px; }

  .controls-hint {
    margin-top: 16px;
    font-size: 12px;
    opacity: 0.55;
    line-height: 1.6;
    text-align: center;
  }
  .key { display: inline-block; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); border-radius: 4px; padding: 1px 6px; font-family: monospace; font-size: 11px; }

  /* ----- Shop ----- */
  .shop-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding-bottom: 14px;
    border-bottom: 1px solid var(--ui-stroke);
  }
  .shop-header h1 { text-align: left; font-size: 24px; }
  .shop-coins {
    background: rgba(255, 210, 63, 0.15);
    border: 1px solid rgba(255, 210, 63, 0.4);
    color: var(--accent);
    padding: 8px 16px;
    border-radius: 999px;
    font-weight: 800;
    font-size: 14px;
  }

  .shop-tabs {
    display: flex;
    gap: 6px;
    margin-bottom: 16px;
  }
  .shop-tab {
    flex: 1;
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--ui-stroke);
    color: var(--ui-text);
    padding: 10px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    transition: all 0.15s;
  }
  .shop-tab:hover { background: rgba(255,255,255,0.1); }
  .shop-tab.active {
    background: rgba(255, 210, 63, 0.15);
    border-color: var(--accent);
    color: var(--accent);
  }

  .shop-char-select {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-bottom: 16px;
    padding: 10px;
    background: rgba(0,0,0,0.25);
    border-radius: 10px;
  }
  .shop-char-select .char-btn { width: 48px; height: 48px; font-size: 24px; }

  .shop-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    max-height: 280px;
    overflow-y: auto;
    padding: 4px 4px 4px 0;
  }
  .shop-grid::-webkit-scrollbar { width: 6px; }
  .shop-grid::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }

  .shop-item {
    background: rgba(255,255,255,0.05);
    border: 2px solid var(--ui-stroke);
    border-radius: 12px;
    padding: 12px 8px;
    text-align: center;
    cursor: pointer;
    transition: all 0.15s;
    position: relative;
  }
  .shop-item:hover { background: rgba(255,255,255,0.1); transform: translateY(-2px); }
  .shop-item.owned { border-color: var(--owned); }
  .shop-item.equipped {
    border-color: var(--equipped);
    background: rgba(255, 210, 63, 0.1);
    box-shadow: 0 0 16px rgba(255, 210, 63, 0.25);
  }
  .shop-item.locked { cursor: not-allowed; opacity: 0.5; }
  .shop-item.cant-afford { opacity: 0.7; }

  .shop-item-preview {
    width: 56px;
    height: 56px;
    margin: 0 auto 8px;
    background: rgba(0,0,0,0.3);
    border-radius: 10px;
    display: grid;
    place-items: center;
  }
  .shop-item-name {
    font-size: 11px;
    font-weight: 700;
    margin-bottom: 4px;
    line-height: 1.2;
    min-height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .shop-item-price {
    font-size: 11px;
    color: var(--accent);
    font-weight: 800;
  }
  .shop-item-status {
    font-size: 9px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    padding: 2px 6px;
    border-radius: 4px;
    display: inline-block;
  }
  .shop-item.owned .shop-item-status { background: var(--owned); color: #fff; }
  .shop-item.equipped .shop-item-status { background: var(--equipped); color: #2a1a00; }
  .shop-item.locked .shop-item-status { background: var(--locked); color: #fff; }

  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: var(--ui-bg-solid);
    border: 1px solid var(--accent);
    color: var(--accent);
    padding: 12px 24px;
    border-radius: 999px;
    font-weight: 700;
    z-index: 100;
    transition: transform 0.4s cubic-bezier(.2,1.5,.5,1);
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  .touch-zone {
    position: fixed;
    bottom: 0;
    width: 50%;
    height: 50%;
    z-index: 3;
    display: none;
  }
  .touch-zone.left { left: 0; }
  .touch-zone.right { right: 0; }
  @media (hover: none) and (pointer: coarse) {
    .touch-zone { display: block; }
    .controls-hint { display: none; }
  }
</style>
</head>
<body>

<div id="wrap">
  <canvas id="game" width="420" height="700"></canvas>
</div>

<div class="hud">
  <div class="pill"><span class="label">Height</span><span id="hud-height">0m</span></div>
  <div class="pill coins"><span class="label">Coins</span><span id="hud-coins">0</span></div>
</div>

<div class="touch-zone left"></div>
<div class="touch-zone right"></div>

<div class="toast" id="toast"></div>

<!-- ===== START MENU ===== -->
<div class="overlay" id="menu">
  <div class="panel">
    <h1>Sky High Squirt</h1>
    <p>Bounce as high as you can. Collect coins. Don't fall.</p>

    <div class="char-name" id="char-name">Squirt the Turtle</div>
    <div class="char-unlock-hint" id="char-unlock-hint"></div>
    <div class="char-row" id="char-row"></div>

    <div class="stats">
      <div class="stat"><div class="v" id="menu-best">0m</div><div class="l">Best</div></div>
      <div class="stat"><div class="v" id="menu-coins">0</div><div class="l">Coins</div></div>
    </div>

    <div class="btn-row">
      <button class="btn" id="play-btn">Play</button>
      <button class="btn secondary" id="shop-btn">Shop</button>
    </div>

    <div class="controls-hint">
      <span class="key">←</span> <span class="key">→</span> or <span class="key">A</span> <span class="key">D</span> to move<br>
      Wraps around screen edges
    </div>
  </div>
</div>

<!-- ===== SHOP ===== -->
<div class="overlay hidden" id="shop">
  <div class="panel shop-panel">
    <div class="shop-header">
      <h1>The Sky Shop</h1>
      <div class="shop-coins">🪙 <span id="shop-coin-count">0</span></div>
    </div>

    <div class="shop-char-select" id="shop-char-select"></div>

    <div class="shop-tabs">
      <button class="shop-tab active" data-tab="hat">Hats</button>
      <button class="shop-tab" data-tab="skin">Skins</button>
      <button class="shop-tab" data-tab="aura">Auras</button>
    </div>

    <div class="shop-grid" id="shop-grid"></div>

    <div class="btn-row" style="margin-top: 18px;">
      <button class="btn secondary" id="shop-back-btn">Back</button>
    </div>
  </div>
</div>

<!-- ===== GAME OVER ===== -->
<div class="overlay hidden" id="gameover">
  <div class="panel">
    <h2>You Fell!</h2>
    <div class="stats">
      <div class="stat"><div class="v" id="go-height">0m</div><div class="l">Height</div></div>
      <div class="stat"><div class="v" id="go-coins">0</div><div class="l">Coins</div></div>
      <div class="stat"><div class="v" id="go-best">0m</div><div class="l">Best</div></div>
    </div>
    <div class="btn-row">
      <button class="btn" id="retry-btn">Retry</button>
      <button class="btn secondary" id="menu-btn">Menu</button>
    </div>
  </div>
</div>

<script>
/* ============================================================================
   SKY HIGH SQUIRT v0.2
   ============================================================================ */

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width;
const H = canvas.height;

const PHYS = {
  gravity: 0.42,
  jumpVel: -13.2,
  superJumpVel: -19,
  moveAccel: 0.7,
  moveMax: 6.5,
  friction: 0.86,
  cameraLerp: 0.12,
  scoreScale: 0.1,
};

const CHARS = {
  turtle:  { body: '#4caf50', accent: '#2e7d32', eye: '#fff', name: 'Squirt the Turtle',  emoji: '🐢', unlockM: 0 },
  fox:     { body: '#ff5722', accent: '#bf360c', eye: '#fff', name: 'Ember the Fox',      emoji: '🦊', unlockM: 1000 },
  tiger:   { body: '#ff9800', accent: '#e65100', eye: '#fff', name: 'Roar the Tiger',     emoji: '🐯', unlockM: 3000 },
  axolotl: { body: '#f48fb1', accent: '#ad1457', eye: '#fff', name: 'Bubble the Axolotl', emoji: '🦎', unlockM: 5000 },
};
const CHAR_ORDER = ['turtle', 'fox', 'tiger', 'axolotl'];

const COSMETICS = {
  hat: [
    { id: 'none',      name: 'No Hat',     price: 0, draw: null },
    { id: 'cap',       name: 'Cap',        price: 50,  draw: drawHatCap },
    { id: 'crown',     name: 'Crown',      price: 200, draw: drawHatCrown },
    { id: 'wizard',    name: 'Wizard Hat', price: 350, draw: drawHatWizard },
    { id: 'party',     name: 'Party Hat',  price: 150, draw: drawHatParty },
    { id: 'bow',       name: 'Big Bow',    price: 100, draw: drawHatBow },
    { id: 'halo',      name: 'Halo',       price: 500, draw: drawHatHalo },
  ],
  skin: [
    { id: 'default',   name: 'Default',    price: 0,    tint: null },
    { id: 'shadow',    name: 'Shadow',     price: 250,  tint: '#222' },
    { id: 'ice',       name: 'Ice',        price: 300,  tint: '#9fdfff' },
    { id: 'rose',      name: 'Rose',       price: 300,  tint: '#ff6b9d' },
    { id: 'gold',      name: 'Gold Skin',  price: 0,    tint: '#ffd23f', achievement: 'reach10000' },
  ],
  aura: [
    { id: 'none',      name: 'No Aura',    price: 0, color: null },
    { id: 'sparkle',   name: 'Sparkle',    price: 150, color: '#ffd23f' },
    { id: 'fire',      name: 'Fire Trail', price: 250, color: '#ff5722' },
    { id: 'frost',     name: 'Frost',      price: 250, color: '#5cdbff' },
    { id: 'rainbow',   name: 'Rainbow',    price: 600, color: 'rainbow' },
  ],
};

const SAVE_KEY = 'skyHighSquirt:save:v1';

function defaultSave() {
  return {
    bestHeight: 0,
    lifetimeCoins: 0,
    coins: 0,
    unlockedChars: ['turtle'],
    owned: { hat: ['none'], skin: ['default'], aura: ['none'] },
    equipped: {
      turtle:  { hat: 'none', skin: 'default', aura: 'none' },
      fox:     { hat: 'none', skin: 'default', aura: 'none' },
      tiger:   { hat: 'none', skin: 'default', aura: 'none' },
      axolotl: { hat: 'none', skin: 'default', aura: 'none' },
    },
    achievements: [],
  };
}

let save = loadSave();

function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return defaultSave();
    const parsed = JSON.parse(raw);
    const def = defaultSave();
    return Object.assign(def, parsed, {
      owned: Object.assign(def.owned, parsed.owned || {}),
      equipped: Object.assign(def.equipped, parsed.equipped || {}),
    });
  } catch (e) {
    console.warn('Save load failed', e);
    return defaultSave();
  }
}

function persist() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(save)); }
  catch (e) { console.warn('Save failed', e); }
}

const state = {
  mode: 'menu',
  character: 'turtle',
  player: null,
  platforms: [],
  coins: [],
  cameraY: 0,
  highestY: 0,
  runCoins: 0,
  heightM: 0,
  zone: 0,
  particles: [],
  trailTimer: 0,
};

const ZONES = [
  { name: 'Meadow',    minM: 0,    sky: ['#87ceeb', '#b3e5fc'], plat: '#66bb6a', platEdge: '#2e7d32' },
  { name: 'Dusk',      minM: 1000, sky: ['#5d3a82', '#ff7043'], plat: '#8d6e63', platEdge: '#3e2723' },
  { name: 'Night Sky', minM: 5000, sky: ['#0d0633', '#1a0a4a'], plat: '#7e57c2', platEdge: '#311b92' },
];

function getZone(m) {
  for (let i = ZONES.length - 1; i >= 0; i--) if (m >= ZONES[i].minM) return i;
  return 0;
}

function makePlayer() {
  return { x: W / 2, y: H - 120, vx: 0, vy: 0, w: 34, h: 34, squish: 0, facing: 1 };
}

function makePlatform(y) {
  const w = 70;
  const x = Math.random() * (W - w);
  return { x, y, w, h: 14, type: 'static', bounced: false };
}

function seedPlatforms() {
  state.platforms.length = 0;
  state.platforms.push({ x: W/2 - 50, y: H - 60, w: 100, h: 14, type: 'static', bounced: false });
  let y = H - 140;
  while (y > -200) {
    state.platforms.push(makePlatform(y));
    y -= 60 + Math.random() * 40;
  }
}

function maybeSpawnCoins(plat) {
  if (Math.random() < 0.35) {
    const n = 3 + Math.floor(Math.random() * 3);
    const cx = plat.x + plat.w / 2;
    const cy = plat.y - 28;
    for (let i = 0; i < n; i++) {
      state.coins.push({ x: cx + (i - (n-1)/2) * 16, y: cy, r: 7, collected: false, bob: Math.random() * Math.PI * 2 });
    }
  }
}

const keys = { left: false, right: false };
window.addEventListener('keydown', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = true;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = true;
});
window.addEventListener('keyup', e => {
  if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.left = false;
  if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.right = false;
});
document.querySelector('.touch-zone.left').addEventListener('touchstart', e => { e.preventDefault(); keys.left = true; });
document.querySelector('.touch-zone.left').addEventListener('touchend',   e => { e.preventDefault(); keys.left = false; });
document.querySelector('.touch-zone.right').addEventListener('touchstart',e => { e.preventDefault(); keys.right = true; });
document.querySelector('.touch-zone.right').addEventListener('touchend',  e => { e.preventDefault(); keys.right = false; });

function spawnParticles(x, y, color, n = 6) {
  for (let i = 0; i < n; i++) {
    state.particles.push({
      x, y,
      vx: (Math.random() - 0.5) * 4,
      vy: (Math.random() - 0.5) * 4 - 1,
      life: 1,
      color,
    });
  }
}

function spawnTrailParticle() {
  const p = state.player;
  const eq = save.equipped[state.character];
  const aura = COSMETICS.aura.find(a => a.id === eq.aura);
  if (!aura || !aura.color) return;
  let color = aura.color;
  if (color === 'rainbow') {
    const hues = ['#ff0066','#ff9900','#ffd23f','#66dd44','#5cdbff','#9966ff'];
    color = hues[Math.floor(Math.random() * hues.length)];
  }
  state.particles.push({
    x: p.x + p.w/2 + (Math.random() - 0.5) * 10,
    y: p.y + p.h/2 + (Math.random() - 0.5) * 6,
    vx: (Math.random() - 0.5) * 1.5,
    vy: 1 + Math.random() * 1,
    life: 1,
    color,
  });
}

function update() {
  if (state.mode !== 'playing') return;
  const p = state.player;

  if (keys.left)  { p.vx -= PHYS.moveAccel; p.facing = -1; }
  if (keys.right) { p.vx += PHYS.moveAccel; p.facing = 1; }
  if (!keys.left && !keys.right) p.vx *= PHYS.friction;
  p.vx = Math.max(-PHYS.moveMax, Math.min(PHYS.moveMax, p.vx));

  p.vy += PHYS.gravity;
  p.x += p.vx;
  p.y += p.vy;

  if (p.x < -p.w) p.x = W;
  if (p.x > W) p.x = -p.w;

  if (p.vy > 0) {
    for (const plat of state.platforms) {
      const hit = p.x + p.w > plat.x && p.x < plat.x + plat.w && p.y + p.h > plat.y && p.y + p.h < plat.y + plat.h + 10;
      if (hit) {
        p.y = plat.y - p.h;
        p.vy = PHYS.jumpVel;
        p.squish = 1;
        spawnParticles(p.x + p.w/2, p.y + p.h, '#ffffff', 4);
        break;
      }
    }
  }

  p.squish *= 0.82;

  state.trailTimer++;
  if (state.trailTimer % 3 === 0) spawnTrailParticle();

  for (const c of state.coins) {
    if (c.collected) continue;
    const dx = (p.x + p.w/2) - c.x;
    const dy = (p.y + p.h/2) - c.y;
    if (dx*dx + dy*dy < (c.r + 16) * (c.r + 16)) {
      c.collected = true;
      state.runCoins++;
      save.lifetimeCoins++;
      spawnParticles(c.x, c.y, '#ffd23f', 8);
    }
    c.bob += 0.08;
  }

  const targetCam = p.y - H * 0.45;
  if (targetCam < state.cameraY) state.cameraY += (targetCam - state.cameraY) * PHYS.cameraLerp;

  if (p.y < state.highestY) state.highestY = p.y;
  state.heightM = Math.max(0, Math.floor((H - 120 - state.highestY) * PHYS.scoreScale));
  state.zone = getZone(state.heightM);

  const topMost = Math.min(...state.platforms.map(pl => pl.y));
  if (topMost > state.cameraY - 200) {
    let y = topMost - (60 + Math.random() * 40);
    while (y > state.cameraY - 400) {
      const newP = makePlatform(y);
      state.platforms.push(newP);
      maybeSpawnCoins(newP);
      y -= 60 + Math.random() * 40;
    }
  }
  state.platforms = state.platforms.filter(pl => pl.y < state.cameraY + H + 100);
  state.coins = state.coins.filter(c => !c.collected && c.y < state.cameraY + H + 100);

  if (p.y > state.cameraY + H) die();

  for (const pt of state.particles) {
    pt.x += pt.vx;
    pt.y += pt.vy;
    pt.vy += 0.15;
    pt.life -= 0.04;
  }
  state.particles = state.particles.filter(pt => pt.life > 0);

  document.getElementById('hud-height').textContent = state.heightM + 'm';
  document.getElementById('hud-coins').textContent = state.runCoins;
}

function drawSky() {
  const z = ZONES[state.zone];
  const zNext = ZONES[Math.min(state.zone + 1, ZONES.length - 1)];
  const zoneRange = (zNext.minM - z.minM) || 1;
  const t = state.zone < ZONES.length - 1 ? Math.min(1, (state.heightM - z.minM) / zoneRange) : 0;
  const sky1 = lerpColor(z.sky[0], zNext.sky[0], t);
  const sky2 = lerpColor(z.sky[1], zNext.sky[1], t);
  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, sky1);
  grad.addColorStop(1, sky2);
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  if (state.heightM > 800) {
    const starAlpha = Math.min(1, (state.heightM - 800) / 1200);
    ctx.fillStyle = `rgba(255,255,255,${starAlpha * 0.8})`;
    for (let i = 0; i < 30; i++) {
      const sx = (i * 73) % W;
      const sy = ((i * 131 + state.cameraY * 0.2) % H + H) % H;
      ctx.fillRect(sx, sy, 2, 2);
    }
  }
}

function drawPlatforms() {
  const z = ZONES[state.zone];
  for (const plat of state.platforms) {
    const y = plat.y - state.cameraY;
    if (y < -20 || y > H + 20) continue;
    ctx.fillStyle = 'rgba(0,0,0,0.2)';
    ctx.fillRect(plat.x + 2, y + 4, plat.w, plat.h);
    ctx.fillStyle = z.plat;
    ctx.fillRect(plat.x, y, plat.w, plat.h);
    ctx.fillStyle = z.platEdge;
    ctx.fillRect(plat.x, y + plat.h - 4, plat.w, 4);
  }
}

function drawCoins() {
  for (const c of state.coins) {
    if (c.collected) continue;
    const y = c.y - state.cameraY + Math.sin(c.bob) * 2;
    if (y < -20 || y > H + 20) continue;
    ctx.fillStyle = 'rgba(255, 210, 63, 0.3)';
    ctx.beginPath(); ctx.arc(c.x, y, c.r + 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#ffd23f';
    ctx.beginPath(); ctx.arc(c.x, y, c.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff5c4';
    ctx.beginPath(); ctx.arc(c.x - 2, y - 2, c.r * 0.4, 0, Math.PI * 2); ctx.fill();
  }
}

/* ---------- Hat draw functions ----------
   Each takes (ctx, x, y, w, h) — the player body box */
function drawHatCap(ctx, x, y, w, h) {
  ctx.fillStyle = '#d32f2f';
  roundRect(ctx, x + 2, y - 8, w - 4, 10, 4); ctx.fill();
  ctx.fillStyle = '#b71c1c';
  ctx.fillRect(x + w * 0.55, y - 4, w * 0.4, 4);
}

function drawHatCrown(ctx, x, y, w, h) {
  ctx.fillStyle = '#ffd23f';
  ctx.beginPath();
  ctx.moveTo(x + 4, y);
  ctx.lineTo(x + 4, y - 6);
  ctx.lineTo(x + w * 0.25, y - 2);
  ctx.lineTo(x + w * 0.4, y - 10);
  ctx.lineTo(x + w * 0.55, y - 2);
  ctx.lineTo(x + w * 0.7, y - 10);
  ctx.lineTo(x + w * 0.85, y - 2);
  ctx.lineTo(x + w - 4, y - 6);
  ctx.lineTo(x + w - 4, y);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#ff5722';
  ctx.beginPath(); ctx.arc(x + w * 0.4, y - 8, 1.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(x + w * 0.7, y - 8, 1.5, 0, Math.PI*2); ctx.fill();
}

function drawHatWizard(ctx, x, y, w, h) {
  ctx.fillStyle = '#3949ab';
  ctx.beginPath();
  ctx.moveTo(x + 2, y + 1);
  ctx.lineTo(x + w - 2, y + 1);
  ctx.lineTo(x + w/2 + 2, y - 18);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#ffd23f';
  ctx.fillRect(x + 2, y - 2, w - 4, 3);
  ctx.fillStyle = '#ffd23f';
  ctx.beginPath(); ctx.arc(x + w/2, y - 10, 1.5, 0, Math.PI*2); ctx.fill();
}

function drawHatParty(ctx, x, y, w, h) {
  ctx.fillStyle = '#ff7eb9';
  ctx.beginPath();
  ctx.moveTo(x + w * 0.2, y + 1);
  ctx.lineTo(x + w * 0.8, y + 1);
  ctx.lineTo(x + w/2, y - 16);
  ctx.closePath();
  ctx.fill();
  ctx.fillStyle = '#ffd23f';
  ctx.fillRect(x + w * 0.3, y - 4, 2, 2);
  ctx.fillRect(x + w * 0.55, y - 8, 2, 2);
  ctx.fillStyle = '#5cdbff';
  ctx.beginPath(); ctx.arc(x + w/2, y - 16, 2, 0, Math.PI*2); ctx.fill();
}

function drawHatBow(ctx, x, y, w, h) {
  ctx.fillStyle = '#ff5722';
  ctx.beginPath();
  ctx.ellipse(x + w * 0.3, y + 2, 5, 4, -0.3, 0, Math.PI*2); ctx.fill();
  ctx.beginPath();
  ctx.ellipse(x + w * 0.7, y + 2, 5, 4, 0.3, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#bf360c';
  ctx.fillRect(x + w/2 - 2, y, 4, 5);
}

function drawHatHalo(ctx, x, y, w, h) {
  ctx.strokeStyle = '#ffd23f';
  ctx.lineWidth = 3;
  ctx.shadowColor = '#ffd23f';
  ctx.shadowBlur = 8;
  ctx.beginPath();
  ctx.ellipse(x + w/2, y - 2, w * 0.55, 3, 0, 0, Math.PI*2);
  ctx.stroke();
  ctx.shadowBlur = 0;
  ctx.lineWidth = 1;
}

function drawPlayer() {
  const p = state.player;
  const baseChar = CHARS[state.character];
  const eq = save.equipped[state.character];
  const skin = COSMETICS.skin.find(s => s.id === eq.skin);
  const hat = COSMETICS.hat.find(h => h.id === eq.hat);

  const bodyColor = skin && skin.tint ? skin.tint : baseChar.body;
  const accentColor = skin && skin.tint ? darken(skin.tint, 0.3) : baseChar.accent;

  const y = p.y - state.cameraY;
  const sx = 1 + p.squish * 0.35;
  const sy = 1 - p.squish * 0.35;
  const drawW = p.w * sx;
  const drawH = p.h * sy;
  const drawX = p.x + (p.w - drawW) / 2;
  const drawY = y + (p.h - drawH);

  ctx.fillStyle = 'rgba(0,0,0,0.25)';
  ctx.beginPath();
  ctx.ellipse(p.x + p.w/2, y + p.h + 2, drawW/2, 4, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = bodyColor;
  roundRect(ctx, drawX, drawY, drawW, drawH, 8); ctx.fill();
  ctx.fillStyle = accentColor;
  roundRect(ctx, drawX + 2, drawY + drawH * 0.55, drawW - 4, drawH * 0.4, 6); ctx.fill();

  const eyeY = drawY + drawH * 0.32;
  const eyeOffset = p.facing * 2;
  ctx.fillStyle = baseChar.eye;
  ctx.beginPath(); ctx.arc(drawX + drawW * 0.32 + eyeOffset, eyeY, 3.5, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(drawX + drawW * 0.68 + eyeOffset, eyeY, 3.5, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.arc(drawX + drawW * 0.32 + eyeOffset + 0.5, eyeY, 1.8, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(drawX + drawW * 0.68 + eyeOffset + 0.5, eyeY, 1.8, 0, Math.PI * 2); ctx.fill();

  if (hat && hat.draw) hat.draw(ctx, drawX, drawY, drawW, drawH);
}

function drawParticles() {
  for (const pt of state.particles) {
    ctx.fillStyle = pt.color;
    ctx.globalAlpha = Math.max(0, pt.life);
    ctx.fillRect(pt.x - 2, pt.y - state.cameraY - 2, 4, 4);
  }
  ctx.globalAlpha = 1;
}

function render() {
  drawSky();
  if (state.mode === 'playing' || state.mode === 'dead') {
    drawPlatforms();
    drawCoins();
    drawParticles();
    if (state.player) drawPlayer();
  }
}

function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function lerpColor(a, b, t) {
  const pa = parseInt(a.slice(1), 16);
  const pb = parseInt(b.slice(1), 16);
  const ar = (pa >> 16) & 255, ag = (pa >> 8) & 255, ab = pa & 255;
  const br = (pb >> 16) & 255, bg = (pb >> 8) & 255, bb = pb & 255;
  const r = Math.round(ar + (br - ar) * t);
  const g = Math.round(ag + (bg - ag) * t);
  const bl = Math.round(ab + (bb - ab) * t);
  return `rgb(${r},${g},${bl})`;
}

function darken(hex, amt) {
  const p = parseInt(hex.slice(1), 16);
  let r = (p >> 16) & 255, g = (p >> 8) & 255, b = p & 255;
  r = Math.round(r * (1 - amt));
  g = Math.round(g * (1 - amt));
  b = Math.round(b * (1 - amt));
  return `rgb(${r},${g},${b})`;
}

function startGame() {
  state.mode = 'playing';
  state.player = makePlayer();
  state.coins.length = 0;
  state.particles.length = 0;
  state.cameraY = 0;
  state.highestY = state.player.y;
  state.runCoins = 0;
  state.heightM = 0;
  state.zone = 0;
  state.trailTimer = 0;
  seedPlatforms();
  for (const plat of state.platforms) maybeSpawnCoins(plat);

  document.getElementById('menu').classList.add('hidden');
  document.getElementById('gameover').classList.add('hidden');
  document.getElementById('shop').classList.add('hidden');
}

function die() {
  state.mode = 'dead';

  save.coins += state.runCoins;
  if (state.heightM > save.bestHeight) save.bestHeight = state.heightM;

  const newlyUnlocked = [];
  for (const charId of CHAR_ORDER) {
    const c = CHARS[charId];
    if (!save.unlockedChars.includes(charId) && save.bestHeight >= c.unlockM) {
      save.unlockedChars.push(charId);
      newlyUnlocked.push(c.name);
    }
  }

  if (save.bestHeight >= 10000 && !save.achievements.includes('reach10000')) {
    save.achievements.push('reach10000');
    if (!save.owned.skin.includes('gold')) save.owned.skin.push('gold');
    newlyUnlocked.push('Gold Skin!');
  }

  persist();

  document.getElementById('go-height').textContent = state.heightM + 'm';
  document.getElementById('go-coins').textContent = state.runCoins;
  document.getElementById('go-best').textContent = save.bestHeight + 'm';
  document.getElementById('gameover').classList.remove('hidden');

  if (newlyUnlocked.length) {
    setTimeout(() => showToast('Unlocked: ' + newlyUnlocked.join(', ')), 400);
  }
}

function returnToMenu() {
  state.mode = 'menu';
  document.getElementById('gameover').classList.add('hidden');
  document.getElementById('shop').classList.add('hidden');
  document.getElementById('menu').classList.remove('hidden');
  refreshMenu();
}

let toastTimer = null;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
}

function refreshMenu() {
  document.getElementById('menu-best').textContent = save.bestHeight + 'm';
  document.getElementById('menu-coins').textContent = save.coins;

  const row = document.getElementById('char-row');
  row.innerHTML = '';
  for (const id of CHAR_ORDER) {
    const c = CHARS[id];
    const unlocked = save.unlockedChars.includes(id);
    const btn = document.createElement('button');
    btn.className = 'char-btn' + (state.character === id ? ' active' : '') + (unlocked ? '' : ' locked');
    btn.dataset.char = id;
    btn.innerHTML = c.emoji + (unlocked ? '' : `<span class="lock">${c.unlockM}m</span>`);
    btn.addEventListener('click', () => {
      if (!unlocked) {
        showToast(`Reach ${c.unlockM}m to unlock ${c.name}`);
        return;
      }
      state.character = id;
      refreshMenu();
    });
    row.appendChild(btn);
  }

  const c = CHARS[state.character];
  document.getElementById('char-name').textContent = c.name;
  const hint = document.getElementById('char-unlock-hint');
  if (c.unlockM > 0 && save.unlockedChars.includes(state.character)) {
    hint.textContent = `Unlocked at ${c.unlockM}m`;
  } else {
    hint.textContent = '';
  }
}

let shopTab = 'hat';
let shopChar = 'turtle';

function openShop() {
  shopChar = state.character;
  if (!save.unlockedChars.includes(shopChar)) shopChar = 'turtle';
  document.getElementById('menu').classList.add('hidden');
  document.getElementById('shop').classList.remove('hidden');
  refreshShop();
}

function closeShop() {
  document.getElementById('shop').classList.add('hidden');
  document.getElementById('menu').classList.remove('hidden');
  refreshMenu();
}

function refreshShop() {
  document.getElementById('shop-coin-count').textContent = save.coins;

  const sel = document.getElementById('shop-char-select');
  sel.innerHTML = '';
  for (const id of CHAR_ORDER) {
    const c = CHARS[id];
    const unlocked = save.unlockedChars.includes(id);
    const btn = document.createElement('button');
    btn.className = 'char-btn' + (shopChar === id ? ' active' : '') + (unlocked ? '' : ' locked');
    btn.innerHTML = c.emoji + (unlocked ? '' : `<span class="lock">🔒</span>`);
    btn.addEventListener('click', () => {
      if (!unlocked) { showToast(`Reach ${c.unlockM}m to unlock ${c.name}`); return; }
      shopChar = id;
      refreshShop();
    });
    sel.appendChild(btn);
  }

  document.querySelectorAll('.shop-tab').forEach(t => {
    t.classList.toggle('active', t.dataset.tab === shopTab);
  });

  const grid = document.getElementById('shop-grid');
  grid.innerHTML = '';
  const items = COSMETICS[shopTab];
  const ownedList = save.owned[shopTab];
  const equippedId = save.equipped[shopChar][shopTab];

  for (const item of items) {
    const owned = ownedList.includes(item.id);
    const equipped = equippedId === item.id;
    const lockedByAchievement = item.achievement && !save.achievements.includes(item.achievement);
    const canAfford = save.coins >= item.price;

    const div = document.createElement('div');
    div.className = 'shop-item';
    if (equipped) div.classList.add('equipped');
    else if (owned) div.classList.add('owned');
    if (lockedByAchievement && !owned) div.classList.add('locked');
    if (!owned && !canAfford && !lockedByAchievement) div.classList.add('cant-afford');

    const previewWrap = document.createElement('div');
    previewWrap.className = 'shop-item-preview';
    const pcanvas = document.createElement('canvas');
    pcanvas.width = 56; pcanvas.height = 56;
    previewWrap.appendChild(pcanvas);
    drawShopPreview(pcanvas, shopChar, shopTab, item);

    const name = document.createElement('div');
    name.className = 'shop-item-name';
    name.textContent = item.name;

    const status = document.createElement('div');
    if (equipped) {
      status.className = 'shop-item-status';
      status.textContent = 'Equipped';
    } else if (owned) {
      status.className = 'shop-item-status';
      status.textContent = 'Tap to equip';
    } else if (lockedByAchievement) {
      status.className = 'shop-item-status';
      status.textContent = 'Reach 10000m';
    } else {
      status.className = 'shop-item-price';
      status.textContent = '🪙 ' + item.price;
    }

    div.appendChild(previewWrap);
    div.appendChild(name);
    div.appendChild(status);

    div.addEventListener('click', () => handleShopItemClick(item, owned, equipped, lockedByAchievement));
    grid.appendChild(div);
  }
}

function handleShopItemClick(item, owned, equipped, lockedByAchievement) {
  if (lockedByAchievement && !owned) {
    showToast('Reach 10000m to unlock!');
    return;
  }
  if (equipped) return;
  if (owned) {
    save.equipped[shopChar][shopTab] = item.id;
    persist();
    refreshShop();
    return;
  }
  if (save.coins < item.price) {
    showToast('Not enough coins!');
    return;
  }
  save.coins -= item.price;
  save.owned[shopTab].push(item.id);
  save.equipped[shopChar][shopTab] = item.id;
  persist();
  showToast(`Bought ${item.name}!`);
  refreshShop();
}

function drawShopPreview(canvas, charId, tab, item) {
  const pctx = canvas.getContext('2d');
  const w = canvas.width, h = canvas.height;
  const baseChar = CHARS[charId];

  const px = 12, py = 12, pw = 32, ph = 32;

  let bodyColor = baseChar.body;
  let accentColor = baseChar.accent;
  if (tab === 'skin' && item.tint) {
    bodyColor = item.tint;
    accentColor = darken(item.tint, 0.3);
  }

  if (tab === 'aura' && item.color) {
    const c = item.color === 'rainbow' ? '#ff7eb9' : item.color;
    pctx.fillStyle = c;
    pctx.globalAlpha = 0.4;
    pctx.beginPath(); pctx.arc(w/2, h/2, 22, 0, Math.PI*2); pctx.fill();
    pctx.globalAlpha = 1;
  }

  pctx.fillStyle = bodyColor;
  roundRect(pctx, px, py, pw, ph, 8); pctx.fill();
  pctx.fillStyle = accentColor;
  roundRect(pctx, px + 2, py + ph * 0.55, pw - 4, ph * 0.4, 6); pctx.fill();

  pctx.fillStyle = '#fff';
  pctx.beginPath(); pctx.arc(px + pw * 0.32, py + ph * 0.32, 3.5, 0, Math.PI*2); pctx.fill();
  pctx.beginPath(); pctx.arc(px + pw * 0.68, py + ph * 0.32, 3.5, 0, Math.PI*2); pctx.fill();
  pctx.fillStyle = '#000';
  pctx.beginPath(); pctx.arc(px + pw * 0.32, py + ph * 0.32, 1.8, 0, Math.PI*2); pctx.fill();
  pctx.beginPath(); pctx.arc(px + pw * 0.68, py + ph * 0.32, 1.8, 0, Math.PI*2); pctx.fill();

  if (tab === 'hat' && item.draw) {
    item.draw(pctx, px, py, pw, ph);
  }
}

document.getElementById('play-btn').addEventListener('click', startGame);
document.getElementById('shop-btn').addEventListener('click', openShop);
document.getElementById('shop-back-btn').addEventListener('click', closeShop);
document.getElementById('retry-btn').addEventListener('click', startGame);
document.getElementById('menu-btn').addEventListener('click', returnToMenu);

document.querySelectorAll('.shop-tab').forEach(t => {
  t.addEventListener('click', () => {
    shopTab = t.dataset.tab;
    refreshShop();
  });
});

function resize() {
  const maxH = window.innerHeight - 20;
  const maxW = window.innerWidth - 20;
  const aspect = W / H;
  let dispH = maxH;
  let dispW = dispH * aspect;
  if (dispW > maxW) {
    dispW = maxW;
    dispH = dispW / aspect;
  }
  canvas.style.width = dispW + 'px';
  canvas.style.height = dispH + 'px';
}
window.addEventListener('resize', resize);
resize();

refreshMenu();

function loop() {
  update();
  render();
  requestAnimationFrame(loop);
}
loop();
</script>
