<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Workshop preview</title>
<meta name="robots" content="noindex">
<style>
html,body{margin:0;height:100%;background:#0f1220;overflow:hidden}
#cw-stage{border:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<!-- A same-origin preview host so learner game code can run. A srcdoc/blob
     frame would inherit the page Content-Security-Policy and block the inline
     game scripts, leaving a blank canvas. This document is served with no CSP
     of its own, so the sandboxed stage inside it can execute inline scripts.
     allow-same-origin is required so that blob: URLs created inside the stage
     can be loaded as <script src="blob:..."> by cwBlobWrap (A1786). Without it
     the stage has an opaque origin and treats its own blob: URLs as cross-origin.
     This host has no CSP of its own, so same-origin access from the stage is
     limited to this null-body document: learner code cannot reach cookies or
     storage that belong to the workshop page. -->
<iframe id="cw-stage" sandbox="allow-scripts allow-same-origin" title="Workshop preview"></iframe>
<script>
(function () {
  'use strict';
  var stage = document.getElementById('cw-stage');
  window.addEventListener('message', function (e) {
    if (!e.data || typeof e.data.cwPreview !== 'string') return;
    stage.srcdoc = e.data.cwPreview;
  });
})();
</script>
</body>
</html>
