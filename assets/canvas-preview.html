<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Workshop preview</title>
<meta name="robots" content="noindex">
<style>
html,body{margin:0;height:100%;background:#0f1220;overflow:hidden}
#cw-stage{border:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<!-- A separate preview host so learner code is not loaded in the workshop
     page. This document is served with no CSP of its own, so the stage can run
     the bootstrap in canvas-preview-host.js. The stage is sandboxed with
     allow-scripts only, which gives it an opaque origin: learner code cannot
     reach the workshop page cookies or storage. The bootstrap runs inside that
     origin and loads each code part as a blob: script, which works without
     allow-same-origin (A2122). -->
<iframe id="cw-stage" sandbox="allow-scripts" title="Workshop preview"></iframe>
<script src="/assets/js/canvas-preview-host.js"></script>
</body>
</html>
