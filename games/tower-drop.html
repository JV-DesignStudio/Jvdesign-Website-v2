<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'sha256-z+p+Pqq7u63F/PJ26mNdIjPWzwBxYfacKuyyh0sKbQ0=' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
<title>Tower Drop | JVDS Arcade</title>
<meta name="description" content="Tower Drop is a one-button stacking game. Tap to drop the swinging platform and build the tallest tower you can. Starring Pip.">
<link rel="canonical" href="https://jvdesignstudio.co.uk/games/tower-drop.html">
<link rel="icon" href="../logo.png" type="image/png">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:#12122a;color:#f5efe0;font-family:Inter,system-ui,-apple-system,sans-serif;display:flex;justify-content:center;overflow:hidden}
  #wrap{display:flex;flex-direction:column;width:100%;height:100vh;height:100dvh;max-width:720px}
  header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 14px;background:rgba(0,0,0,.35);border-bottom:1px solid rgba(168,85,247,.25)}
  header a{color:#c4b5fd;text-decoration:none;font-weight:700;font-size:14px;padding:6px 4px;border-radius:8px}
  header a:hover{color:#fff}
  .hud{display:flex;gap:18px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:#a5b4fc}
  .hud b{color:#fff;font-size:16px;margin-left:4px;letter-spacing:0}
  #stage{position:relative;flex:1;min-height:0;padding:8px}
  canvas{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:16px;touch-action:none;background:#1a1a2e;box-shadow:0 18px 50px rgba(0,0,0,.5),0 0 0 1px rgba(168,85,247,.22)}
  .overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px;gap:12px;background:rgba(18,18,42,.93);backdrop-filter:blur(3px);z-index:2}
  .overlay.hidden{display:none}
  .overlay h1{margin:0;font-size:34px;line-height:1.1;color:#c4b5fd;font-family:Fredoka,Inter,system-ui,sans-serif}
  .overlay h2{margin:0;font-size:30px;color:#c4b5fd;font-family:Fredoka,Inter,system-ui,sans-serif}
  .overlay p{margin:0;max-width:330px;font-size:15px;line-height:1.5;color:#b9b4d8}
  .overlay .big{margin:4px 0 0;font-size:52px;font-weight:800;color:#4ade80;line-height:1}
  .overlay .label{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#a5b4fc}
  .overlay .pip{font-size:13px;color:#a5b4fc}
  .overlay .best{font-size:14px;color:#f5efe0}
  .overlay .pip-start{width:82px;height:auto;margin-bottom:-8px;filter:drop-shadow(0 10px 24px rgba(74,222,128,.28))}
  button{background:#7c3aed;color:#fff;border:none;border-radius:999px;padding:14px 36px;font:inherit;font-weight:800;font-size:17px;cursor:pointer;box-shadow:0 6px 0 #4c1d95;transition:transform .08s,box-shadow .08s;margin-top:6px}
  button:active{transform:translateY(4px);box-shadow:0 2px 0 #4c1d95}
  button:focus-visible{outline:3px solid #4ade80;outline-offset:3px}
  @media (max-height:520px){.overlay h1{font-size:26px}.overlay .big{font-size:38px}.overlay .pip-start{width:58px}button{padding:10px 28px;font-size:15px}}
</style>
</head>
<body>
<div id="wrap">
  <header>
    <a href="../arcade.html">&larr; Back to Arcade</a>
    <div class="hud">
      <span>Floor <b id="score">0</b></span>
      <span>Best <b id="best">0</b></span>
    </div>
  </header>
  <div id="stage">
    <canvas id="game" aria-label="Tower Drop game area" role="img"></canvas>

    <div class="overlay" id="overlay">
      <img class="pip-start" src="chars/pip.png" width="170" height="219" alt="Pip the turtle">
      <h1>🐾 Tower Drop</h1>
      <p>Tap, click or press space to drop the swinging platform. Line it up, keep the overlap and build as high as you can.</p>
      <button id="startBtn" type="button">Play</button>
    </div>

    <div class="overlay hidden" id="end">
      <h2>Game Over</h2>
      <p class="label">Floors</p>
      <p class="big" id="finalScore">0</p>
      <p class="best" id="bestLine">Best: 0</p>
      <p class="pip">Pip says: how high can you go?</p>
      <button id="againBtn" type="button">Try Again</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var VW = 400;
  var VH = 680;
  var FLOOR_H = 26;
  var BASE_Y = VH - 70;
  var GAP = 92;
  var DROP_SPEED = 560;
  var PERFECT_PX = 4;
  var KEY = 'jvds-tower-drop-best';
  var PALETTE = ['#a855f7', '#7c3aed', '#4ade80', '#22c55e', '#c084fc', '#34d399'];
  var canvas = document.getElementById('game');
  var ctx = canvas.getContext('2d');
  var stage = document.getElementById('stage');
  var scoreEl = document.getElementById('score');
  var bestEl = document.getElementById('best');
  var overlay = document.getElementById('overlay');
  var endScreen = document.getElementById('end');
  var finalScore = document.getElementById('finalScore');
  var bestLine = document.getElementById('bestLine');
  var startBtn = document.getElementById('startBtn');
  var againBtn = document.getElementById('againBtn');

  var scale = 1;
  var dpr = 1;
  var floors = [];
  var platform = { cx: VW / 2, w: 150, y: 0 };
  var phase = 0;
  var dropOffset = 0;
  var cam = 0;
  var camTarget = 0;
  var state = 'ready';
  var score = 0;
  var best = 0;
  var debris = [];
  var popups = [];
  var shake = 0;
  var overTimer = 0;
  var clock = 0;
  var stars = [];
  var motes = [];
  var puffs = [];
  var bursts = [];
  var sparks = [];
  var trail = [];
  var clouds = [];
  var pipMood = 'idle';
  var pipTimer = 0;
  var pipImg = new Image();
  pipImg.src = 'chars/pip.png';
  var bgLayer = document.createElement('canvas');
  var bgCtx = bgLayer.getContext('2d');

  function makeGlow(rgb) {
    var c = document.createElement('canvas');
    c.width = c.height = 256;
    var g = c.getContext('2d');
    var rg = g.createRadialGradient(128, 128, 4, 128, 128, 128);
    rg.addColorStop(0, 'rgba(' + rgb + ',0.55)');
    rg.addColorStop(1, 'rgba(' + rgb + ',0)');
    g.fillStyle = rg;
    g.fillRect(0, 0, 256, 256);
    return c;
  }
  var glowPurple = makeGlow('168,85,247');
  var glowGreen = makeGlow('74,222,128');

  function drawGlow(img, x, y, size, alpha) {
    ctx.globalAlpha = alpha;
    ctx.drawImage(img, x - size / 2, y - size / 2, size, size);
    ctx.globalAlpha = 1;
  }

  function paintBackground() {
    bgLayer.width = VW * 2;
    bgLayer.height = VH * 2;
    var g = bgCtx;
    g.setTransform(2, 0, 0, 2, 0, 0);

    var sky = g.createLinearGradient(0, 0, 0, VH);
    sky.addColorStop(0, '#0d0b22');
    sky.addColorStop(0.45, '#1a1a2e');
    sky.addColorStop(0.8, '#2a1d4a');
    sky.addColorStop(1, '#3a2550');
    g.fillStyle = sky;
    g.fillRect(0, 0, VW, VH);

    var aurora = g.createRadialGradient(VW * 0.18, 30, 8, VW * 0.18, 30, 230);
    aurora.addColorStop(0, 'rgba(74,222,128,0.10)');
    aurora.addColorStop(1, 'rgba(74,222,128,0)');
    g.fillStyle = aurora;
    g.fillRect(0, 0, VW, 380);

    var mx = VW - 74, my = 96;
    var halo = g.createRadialGradient(mx, my, 8, mx, my, 84);
    halo.addColorStop(0, 'rgba(245,239,224,0.28)');
    halo.addColorStop(0.36, 'rgba(245,239,224,0.12)');
    halo.addColorStop(1, 'rgba(245,239,224,0)');
    g.fillStyle = halo;
    g.beginPath();
    g.arc(mx, my, 84, 0, Math.PI * 2);
    g.fill();

    g.globalAlpha = 0.88;
    g.fillStyle = '#f5efe0';
    g.beginPath();
    g.arc(mx, my, 26, 0, Math.PI * 2);
    g.fill();
    g.globalAlpha = 0.45;
    g.fillStyle = '#d9cbb2';
    g.beginPath();
    g.arc(mx - 8, my - 6, 5, 0, Math.PI * 2);
    g.arc(mx + 9, my + 5, 3.5, 0, Math.PI * 2);
    g.arc(mx + 2, my - 11, 3, 0, Math.PI * 2);
    g.fill();
    g.globalAlpha = 1;

    var v = g.createRadialGradient(VW / 2, VH * 0.46, VH * 0.3, VW / 2, VH * 0.5, VH * 0.8);
    v.addColorStop(0, 'rgba(8,6,20,0)');
    v.addColorStop(1, 'rgba(8,6,20,0.52)');
    g.fillStyle = v;
    g.fillRect(0, 0, VW, VH);
  }

  for (var s = 0; s < 42; s++) stars.push({ x: Math.random() * VW, y: Math.random() * VH, r: Math.random() * 1.4 + 0.4, p: Math.random() * 6.28 });
  for (var mo = 0; mo < 26; mo++) motes.push({ x: Math.random() * VW, y: Math.random() * VH, r: Math.random() * 1.8 + 0.6, s: Math.random() * 9 + 4, p: Math.random() * 6.28, c: Math.random() > 0.4 ? '#a7f3d0' : '#fcd34d' });
  for (var cl = 0; cl < 5; cl++) clouds.push({ x: Math.random() * VW, y: 50 + Math.random() * 260, s: 0.55 + Math.random() * 0.9, sp: 3 + Math.random() * 6, a: 0.035 + Math.random() * 0.05 });

  try { best = Number(localStorage.getItem(KEY)) || 0; } catch (e) { best = 0; }
  bestEl.textContent = best;

  function resize() {
    var w = Math.max(120, stage.clientWidth - 16);
    var h = Math.max(120, stage.clientHeight - 16);
    scale = Math.min(w / VW, h / VH);
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.round(VW * scale * dpr);
    canvas.height = Math.round(VH * scale * dpr);
    canvas.style.width = Math.round(VW * scale) + 'px';
    canvas.style.height = Math.round(VH * scale) + 'px';
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    paintBackground();
  }

  function roundRect(x, y, w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }
  function shade(hex, amount) {
    var n = parseInt(hex.slice(1), 16), f = amount < 0 ? 0 : 255, t = Math.abs(amount);
    var mix = function (c) { return Math.round((f - c) * t + c); };
    return 'rgb(' + mix((n >> 16) & 255) + ',' + mix((n >> 8) & 255) + ',' + mix(n & 255) + ')';
  }

  function reset() {
    floors = [{ cx: VW / 2, w: 150, color: '#6d28d9', flash: 0, land: 0 }];
    platform.cx = VW / 2;
    platform.w = 150;
    phase = -Math.PI / 2;
    dropOffset = 0;
    cam = 0;
    camTarget = 0;
    score = 0;
    debris = [];
    popups = [];
    puffs = [];
    bursts = [];
    sparks = [];
    trail = [];
    shake = 0;
    overTimer = 0;
    pipMood = 'idle';
    pipTimer = 0;
    scoreEl.textContent = '0';
  }

  function startGame() {
    reset();
    state = 'swing';
    overlay.classList.add('hidden');
    endScreen.classList.add('hidden');
  }

  function addDebris(x0, x1, worldTop, color, up) {
    debris.push({
      x: x0, w: Math.max(2, x1 - x0), y: worldTop,
      vx: (Math.random() - 0.5) * 150, vy: up ? -70 : 30,
      rot: 0, vr: (Math.random() - 0.5) * 7,
      life: 1.5, max: 1.5, color: color
    });
  }

  function addPuffs(cx, worldTop, perfect) {
    var n = perfect ? 10 : 6;
    for (var i = 0; i < n; i++) {
      puffs.push({
        x: cx + (Math.random() - 0.5) * 34,
        y: worldTop + (Math.random() - 0.5) * 8,
        vx: (Math.random() - 0.5) * 90,
        vy: -18 - Math.random() * 44,
        r: 2 + Math.random() * 3.5,
        life: 0.45 + Math.random() * 0.3,
        max: 0.75,
        c: perfect ? '#4ade80' : '#cbb8ff'
      });
    }
  }

  function addBurst(cx, worldTop) {
    bursts.push({ x: cx, y: worldTop, life: 0.7, max: 0.7 });
    for (var i = 0; i < 14; i++) {
      var a = (Math.PI * 2 * i) / 14 + Math.random() * 0.25;
      var sp = 55 + Math.random() * 95;
      sparks.push({
        x: cx, y: worldTop,
        vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 20,
        life: 0.5 + Math.random() * 0.35, max: 0.85,
        c: i % 3 === 0 ? '#fcd34d' : '#4ade80'
      });
    }
  }

  function resolveDrop() {
    var top = floors[floors.length - 1];
    var w = platform.w;
    var cx = platform.cx;
    var left = Math.max(cx - w / 2, top.cx - top.w / 2);
    var right = Math.min(cx + w / 2, top.cx + top.w / 2);
    var overlap = right - left;

    if (overlap <= 0) {
      state = 'fall';
      overTimer = 0;
      shake = 0.55;
      pipMood = 'worried';
      pipTimer = 0;
      addDebris(cx - w / 2, cx + w / 2, BASE_Y - floors.length * FLOOR_H, '#a855f7', false);
      return;
    }

    var diff = Math.abs(cx - top.cx);
    var perfect = diff <= PERFECT_PX;
    var newW = perfect ? top.w : overlap;
    var newCx = perfect ? top.cx : (left + right) / 2;
    var worldTop = BASE_Y - floors.length * FLOOR_H;
    var color = PALETTE[floors.length % PALETTE.length];

    if (!perfect) {
      if (left > cx - w / 2 + 0.5) addDebris(cx - w / 2, left, worldTop, color, true);
      else if (right < cx + w / 2 - 0.5) addDebris(right, cx + w / 2, worldTop, color, true);
    }

    floors.push({ cx: newCx, w: newW, color: color, flash: perfect ? 1 : 0, land: 0.45 });
    score = floors.length - 1;
    scoreEl.textContent = score;
    platform.cx = newCx;
    platform.w = newW;
    dropOffset = 0;
    state = 'swing';
    pipMood = 'cheer';
    pipTimer = perfect ? 1 : 0.38;
    addPuffs(newCx, worldTop, perfect);

    if (perfect) {
      addBurst(newCx, worldTop);
      popups = [{ text: 'PERFECT!', x: newCx, y: worldTop, life: 1, max: 1 }];
    }
  }

  function endGame() {
    state = 'over';
    finalScore.textContent = score;
    var isNew = score > best;
    if (isNew) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem(KEY, String(best)); } catch (e) { /* storage may be blocked */ }
    }
    bestLine.textContent = isNew ? 'New best!' : 'Best: ' + best;
    overlay.classList.add('hidden');
    endScreen.classList.remove('hidden');
  }

  function tap() {
    if (state === 'swing') {
      dropOffset = 0;
      state = 'drop';
    } else if (state === 'ready' || state === 'over') {
      startGame();
    }
  }

  function update(dt) {
    clock += dt;

    if (state === 'swing' || state === 'ready') {
      var placed = Math.max(0, floors.length - 1);
      var period = Math.max(0.8, 2 - placed * 0.06);
      phase += dt * Math.PI * 2 / period;
    }

    if (state === 'drop') {
      dropOffset += DROP_SPEED * dt;
      if (dropOffset >= GAP) resolveDrop();
    }

    if (state === 'fall') {
      overTimer += dt;
      if (overTimer > 0.7) endGame();
    }

    var top = floors[floors.length - 1];
    camTarget = Math.max(0, VH * 0.4 - (BASE_Y - floors.length * FLOOR_H));
    cam += (camTarget - cam) * Math.min(1, dt * 5);

    platform.y = BASE_Y - floors.length * FLOOR_H + cam - GAP + dropOffset;

    if (state === 'swing' || state === 'ready') {
      var amp = Math.max(40, (VW - top.w) / 2 - 14);
      platform.cx = VW / 2 + amp * Math.sin(phase);
      platform.w = top.w;
    }

    for (var i = 0; i < floors.length; i++) {
      if (floors[i].flash > 0) floors[i].flash = Math.max(0, floors[i].flash - dt * 1.8);
      if (floors[i].land > 0) floors[i].land = Math.max(0, floors[i].land - dt * 3.2);
    }

    pipTimer = Math.max(0, pipTimer - dt);
    if (pipMood !== 'worried' && pipTimer <= 0) pipMood = 'idle';

    for (var pf = puffs.length - 1; pf >= 0; pf--) {
      var pu = puffs[pf];
      pu.x += pu.vx * dt;
      pu.y += pu.vy * dt;
      pu.vy += 70 * dt;
      pu.r += 16 * dt;
      pu.life -= dt;
      if (pu.life <= 0) puffs.splice(pf, 1);
    }

    for (var b = bursts.length - 1; b >= 0; b--) {
      bursts[b].life -= dt;
      if (bursts[b].life <= 0) bursts.splice(b, 1);
    }

    for (var sp = sparks.length - 1; sp >= 0; sp--) {
      var k = sparks[sp];
      k.vy += 230 * dt;
      k.x += k.vx * dt;
      k.y += k.vy * dt;
      k.life -= dt;
      if (k.life <= 0) sparks.splice(sp, 1);
    }

    trail.push({ x: platform.cx, y: platform.y, w: platform.w, life: 0.26 });
    if (trail.length > 7) trail.shift();
    for (var tr = trail.length - 1; tr >= 0; tr--) {
      trail[tr].life -= dt;
      if (trail[tr].life <= 0) trail.splice(tr, 1);
    }

    for (var d = debris.length - 1; d >= 0; d--) {
      var p = debris[d];
      p.vy += 1400 * dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.rot += p.vr * dt;
      p.life -= dt;
      if (p.life <= 0 || p.y + cam > VH + 240) debris.splice(d, 1);
    }

    for (var q = popups.length - 1; q >= 0; q--) {
      popups[q].life -= dt * 0.9;
      if (popups[q].life <= 0) popups.splice(q, 1);
    }

    if (shake > 0) shake = Math.max(0, shake - dt);
  }

  function drawBackground() {
    ctx.drawImage(bgLayer, 0, 0, VW, VH);

    for (var i = 0; i < stars.length; i++) {
      var st = stars[i];
      ctx.globalAlpha = 0.2 + 0.35 * (0.5 + 0.5 * Math.sin(clock * 1.6 + st.p));
      ctx.fillStyle = '#e9d5ff';
      ctx.beginPath();
      ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    for (var c = 0; c < clouds.length; c++) drawCloud(clouds[c]);

    drawGlow(glowPurple, VW / 2, BASE_Y + cam, 700, 0.6);
    drawHill(VH - 24 + cam * 0.16, '#241a3f', 24, 88, 0);
    drawHill(VH + 8 + cam * 0.3, '#1b1430', 32, 68, 44);
    drawMotes();
  }

  function drawCloud(c) {
    var span = VW + 180;
    var x = ((c.x + clock * c.sp) % span) - 90;
    var y = c.y + cam * 0.04;
    if (y < -90 || y > VH + 90) return;
    ctx.save();
    ctx.globalAlpha = c.a;
    ctx.fillStyle = '#c4b5fd';
    ctx.beginPath();
    ctx.ellipse(x, y, 48 * c.s, 15 * c.s, 0, 0, Math.PI * 2);
    ctx.ellipse(x + 30 * c.s, y - 9 * c.s, 28 * c.s, 13 * c.s, 0, 0, Math.PI * 2);
    ctx.ellipse(x - 30 * c.s, y - 4 * c.s, 22 * c.s, 11 * c.s, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawHill(base, color, amp, step, phase) {
    if (base > VH + 90) return;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(0, VH);
    for (var x = 0; x <= VW; x += 10) {
      var y = base - Math.sin((x + phase) / step) * amp - Math.cos((x + phase) / (step * 2.2)) * amp * 0.45;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(VW, VH);
    ctx.closePath();
    ctx.fill();
  }

  function drawMotes() {
    for (var i = 0; i < motes.length; i++) {
      var m = motes[i];
      var y = ((m.y + cam * 0.22 + clock * m.s) % (VH + 60)) - 30;
      var x = m.x + Math.sin(clock * 0.6 + m.p) * 12;
      var a = 0.16 + 0.3 * (0.5 + 0.5 * Math.sin(clock * 1.8 + m.p));
      ctx.fillStyle = m.c;
      ctx.globalAlpha = a * 0.16;
      ctx.beginPath();
      ctx.arc(x, y, m.r * 3.6, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = a;
      ctx.beginPath();
      ctx.arc(x, y, m.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawFloor(fl, i) {
    var y = BASE_Y - (i + 1) * FLOOR_H + cam;
    if (y > VH + 40 || y + FLOOR_H < -40) return;
    var h = FLOOR_H - 4;
    var x = fl.cx - fl.w / 2;

    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    roundRect(x + 1, y + 3, fl.w, h, 6);
    ctx.fill();

    var grd = ctx.createLinearGradient(0, y, 0, y + h);
    grd.addColorStop(0, shade(fl.color, 0.18));
    grd.addColorStop(1, shade(fl.color, -0.22));
    ctx.fillStyle = grd;
    roundRect(x, y, fl.w, h, 6);
    ctx.fill();

    ctx.strokeStyle = 'rgba(0,0,0,0.22)';
    ctx.lineWidth = 1;
    roundRect(x + 0.5, y + 0.5, fl.w - 1, h - 1, 6);
    ctx.stroke();

    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    roundRect(x + 4, y + 3, Math.max(4, fl.w - 8), 3, 2);
    ctx.fill();

    if (fl.flash > 0) {
      ctx.globalAlpha = fl.flash * 0.75;
      ctx.fillStyle = '#4ade80';
      roundRect(x, y, fl.w, h, 6);
      ctx.fill();
      ctx.globalAlpha = 1;
    }

    if (fl.land > 0) {
      ctx.globalAlpha = fl.land * 0.35;
      ctx.fillStyle = '#ffffff';
      roundRect(x, y, fl.w, h, 6);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function drawPlatform() {
    var h = FLOOR_H - 4;
    var x = platform.cx - platform.w / 2;
    var y = platform.y;

    for (var t = 0; t < trail.length; t++) {
      var g = trail[t];
      ctx.globalAlpha = (g.life / 0.26) * 0.07;
      ctx.fillStyle = '#a855f7';
      roundRect(g.x - g.w / 2, g.y, g.w, h, 6);
      ctx.fill();
    }
    ctx.globalAlpha = 1;

    drawGlow(glowPurple, platform.cx, y + h / 2, Math.max(110, platform.w * 1.5), 0.55);

    ctx.save();
    ctx.shadowColor = 'rgba(168,85,247,0.55)';
    ctx.shadowBlur = 16;
    var grd = ctx.createLinearGradient(0, y, 0, y + h);
    grd.addColorStop(0, '#d8b4fe');
    grd.addColorStop(1, '#a855f7');
    ctx.fillStyle = grd;
    roundRect(x, y, platform.w, h, 6);
    ctx.fill();
    ctx.restore();

    ctx.strokeStyle = 'rgba(255,255,255,0.55)';
    ctx.lineWidth = 1.2;
    roundRect(x + 1, y + 1, platform.w - 2, h - 2, 5);
    ctx.stroke();

    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    roundRect(x + 5, y + 3, Math.max(4, platform.w - 10), 3, 2);
    ctx.fill();
  }

  function drawDebris() {
    for (var i = 0; i < debris.length; i++) {
      var p = debris[i];
      var alpha = Math.max(0, Math.min(1, p.life / 0.6));
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.translate(p.x + p.w / 2, p.y + cam + (FLOOR_H - 4) / 2);
      ctx.rotate(p.rot);
      var grd = ctx.createLinearGradient(0, -12, 0, 12);
      grd.addColorStop(0, shade(p.color, 0.12));
      grd.addColorStop(1, shade(p.color, -0.25));
      ctx.fillStyle = grd;
      roundRect(-p.w / 2, -(FLOOR_H - 4) / 2, p.w, FLOOR_H - 4, 6);
      ctx.fill();
      ctx.restore();
    }
  }

  function drawPuffs() {
    for (var i = 0; i < puffs.length; i++) {
      var p = puffs[i];
      ctx.globalAlpha = Math.max(0, p.life / p.max) * 0.55;
      ctx.fillStyle = p.c;
      ctx.beginPath();
      ctx.arc(p.x, p.y + cam, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawBursts() {
    for (var i = 0; i < bursts.length; i++) {
      var b = bursts[i];
      var t = 1 - b.life / b.max;
      var r = 10 + t * 74;
      ctx.globalAlpha = (1 - t) * 0.85;
      ctx.strokeStyle = '#4ade80';
      ctx.lineWidth = 3 - t * 2;
      ctx.beginPath();
      ctx.arc(b.x, b.y + cam + 10, r, 0, Math.PI * 2);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  function drawSparks() {
    for (var i = 0; i < sparks.length; i++) {
      var k = sparks[i];
      ctx.globalAlpha = Math.max(0, k.life / k.max);
      ctx.fillStyle = k.c;
      ctx.beginPath();
      ctx.arc(k.x, k.y + cam, 2.2, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawPip() {
    if (!pipImg.complete || !pipImg.naturalWidth) return;
    var h = 84;
    var w = h * pipImg.naturalWidth / pipImg.naturalHeight;
    var x = 56;
    var base = VH - 26;
    var hop = 0, tilt = 0, sx = 1, sy = 1;
    if (pipMood === 'cheer') {
      var t = Math.min(1, pipTimer * 2.2);
      hop = Math.abs(Math.sin(clock * 15)) * 11 * t;
      sy = 1 + 0.05 * t;
    } else if (pipMood === 'worried') {
      tilt = Math.sin(clock * 24) * 0.05;
    } else {
      hop = Math.sin(clock * 2) * 1.5;
    }

    ctx.globalAlpha = 0.34;
    ctx.fillStyle = '#000000';
    ctx.beginPath();
    ctx.ellipse(x, base + 4, w * 0.34, 6, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;

    drawGlow(glowGreen, x, base - h * 0.5, h * 1.7, 0.7);

    ctx.save();
    ctx.translate(x, base - hop);
    ctx.rotate(tilt);
    ctx.scale(sx, sy);
    ctx.drawImage(pipImg, -w / 2, -h, w, h);
    ctx.restore();

    if (pipMood === 'cheer') {
      ctx.globalAlpha = Math.min(1, pipTimer * 2) * 0.9;
      ctx.fillStyle = '#4ade80';
      ctx.beginPath();
      ctx.arc(x + w * 0.52, base - h + 12 - hop, 2.4, 0, Math.PI * 2);
      ctx.arc(x + w * 0.7, base - h + 24 - hop, 1.7, 0, Math.PI * 2);
      ctx.fill();
      ctx.globalAlpha = 1;
    }
  }

  function drawPopups() {
    for (var i = 0; i < popups.length; i++) {
      var p = popups[i];
      var t = 1 - p.life / p.max;
      var pop = Math.min(1, t * 5);
      ctx.save();
      ctx.translate(p.x, p.y + cam - 18 - t * 34);
      ctx.scale(0.6 + pop * 0.4, 0.6 + pop * 0.4);
      ctx.globalAlpha = Math.min(1, p.life * 1.6);
      ctx.fillStyle = '#4ade80';
      ctx.shadowColor = 'rgba(74,222,128,0.7)';
      ctx.shadowBlur = 12;
      ctx.font = '800 20px Inter, system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(p.text, 0, 0);
      ctx.restore();
    }
  }

  function draw() {
    ctx.save();
    if (shake > 0) {
      var s = shake * 9;
      ctx.translate((Math.random() * 2 - 1) * s, (Math.random() * 2 - 1) * s);
    }
    drawBackground();

    var top = floors[floors.length - 1];
    var topY = BASE_Y - floors.length * FLOOR_H + cam;
    drawGlow(glowPurple, top.cx, topY + 12, 340, 0.42);

    for (var i = 0; i < floors.length; i++) drawFloor(floors[i], i);

    if (state !== 'over' && state !== 'fall') drawPlatform();
    drawDebris();
    drawPuffs();
    drawBursts();
    drawSparks();
    drawPopups();
    drawPip();
    ctx.restore();
  }

  var last = 0;
  function frame(now) {
    if (!last) last = now;
    var dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    requestAnimationFrame(frame);
  }

  canvas.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    tap();
  });

  window.addEventListener('keydown', function (e) {
    if (e.code === 'Space' || e.key === ' ' || e.key === 'Enter') {
      e.preventDefault();
      tap();
    }
  });

  startBtn.addEventListener('click', startGame);
  againBtn.addEventListener('click', startGame);

  window.addEventListener('resize', resize);
  if (window.ResizeObserver) new ResizeObserver(resize).observe(stage);

  window.__towerDrop = {
    snapshot: function () { var t = floors[floors.length - 1]; return { state: state, score: score, best: best, floors: floors.length, width: platform.w, topCx: t.cx, platformCx: platform.cx }; },
    aim: function (cx) { if (state === 'swing') platform.cx = cx; },
    drop: tap,
    start: startGame
  };

  reset();
  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
