    <meta name="twitter:image" content="https://jvdesignstudio.co.uk/og/hub-games.png"><link rel="manifest" href="../manifest.json"><meta name="theme-color" content="#3d285f"><meta name="description" content="Build a clue web and solve logic mysteries with Echo."><script src="../game-system.js"></script><link rel="stylesheet" href="../game-system.css"><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#241637;color:#fff}.wrap{max-width:1150px;margin:auto;padding:16px 12px 80px}.top{display:flex;gap:10px;flex-wrap:wrap}.pill{color:#fff;background:#0006;border:1px solid #fff4;border-radius:8px;padding:9px 12px;text-decoration:none;font-weight:900}.hero{border-bottom:3px solid #f2a541;margin:12px 0;padding-bottom:14px}.hero h1{font-size:clamp(2rem,7vw,4.4rem);margin:0}.hud,.game{display:grid;gap:10px}.hud{grid-template-columns:repeat(6,1fr)}.stat,.panel{background:#fff8f4;color:#20172f;border:1px solid #decbd2;border-radius:8px;padding:10px}.stat b{display:block;font-size:1.1rem}.stat span{font-size:.72rem;color:#6f6072;font-weight:900;text-transform:uppercase}.game{grid-template-columns:1fr .9fr;margin-top:10px}.places,.suspects,.links,.accuse{display:grid;gap:8px}.places{grid-template-columns:repeat(2,1fr)}button{font:inherit;font-weight:900;cursor:pointer;border-radius:8px;min-height:42px}.place,.suspect,.clue,.link,.choice{background:#fff;border:1px solid #decbd2;color:#20172f;padding:9px;text-align:left}.place.done,.suspect.done,.clue.sel,.choice.right{background:#eef7df}.choice.wrong{background:#fff0ef}.board{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.clue{min-height:82px}.actions{display:flex;gap:8px;flex-wrap:wrap}.primary{border:0;background:#3d285f;color:#fff;padding:9px 12px}.secondary{border:1px solid #decbd2;background:#fff;color:#20172f;padding:9px 12px}.log{max-height:210px;overflow:auto;color:#58465f}.result{display:none;background:#eef7df;border-radius:8px;padding:10px}.result.show{display:block}@media(max-width:820px){.game{grid-template-columns:1fr}.hud{grid-template-columns:repeat(3,1fr)}}@media(max-width:520px){.hud,.places,.board{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><a class="pill" href="../arcade.html">Back to Arcade</a><a class="pill" href="../games">All games</a></div><section class="hero"><p>Logic mystery</p><h1>Echo's Casebook</h1><p>Collect clues from places, interview suspects, connect two clues into a theory, then accuse only when the evidence web makes sense.</p></section><section class="hud"><div class="stat"><b id="score"></b><span>Score</span></div><div class="stat"><b id="caseNo"></b><span>Case</span></div><div class="stat"><b id="clueNo"></b><span>Clues</span></div><div class="stat"><b id="linksNo"></b><span>Links</span></div><div class="stat"><b id="focus"></b><span>Focus</span></div><div class="stat"><b id="best"></b><span>Best</span></div></section><main class="game"><section class="panel"><h2 id="title"></h2><p id="brief"></p><h3>Places</h3><div class="places" id="places"></div><h3>Clue Web</h3><div class="board" id="board"></div><div class="actions"><button class="primary" id="linkBtn">Link Selected Clues</button><button class="secondary" id="restart">Restart</button></div></section><aside class="panel"><h3>Suspects</h3><div class="suspects" id="suspects"></div><h3>Theories</h3><div class="links" id="links"></div><h3>Accuse</h3><div class="accuse" id="accuse"></div><button class="primary" id="next" disabled>Next Case</button><div class="result" id="result"></div><h3>Notebook</h3><div class="log" id="log"></div></aside></main></div><script>
const GAME_ID='echo-casebook',runKey='jvds_echo_reset_run',metaKey='jvds_echo_reset_meta',gs=new GameSystem(GAME_ID,"Echo's Casebook",'echo');
const cases=[{t:'The Moon Badge',b:'Pip lost a silver badge before the show.',a:'Mara',places:[['Stage','Silver dust near poster paint'],['Coat Rack','Pip still has the badge pin'],['Poster Table','Crescent outline in wet paint'],['Window','Mara practised moon shapes']],sus:['Pip','Mara','Theo'],need:['Silver dust near poster paint','Crescent outline in wet paint']},{t:'The Silent Music Box',b:'The music box stopped during practice.',a:'Theo',places:[['Gear Tray','One spring is missing'],['Toy Bench','Toy drummer has a fresh spring'],['Piano','Ember heard ticking nearby'],['Shelf','Lumo only polished the lid']],sus:['Ember','Theo','Lumo'],need:['One spring is missing','Toy drummer has a fresh spring']},{t:'The Star Map',b:'A hand drawn map vanished from the library.',a:'Lumo',places:[['Library Table','Leaf bookmark on the table'],['Window','Tape marks on the glass'],['Art Stack','Mara never moved the map'],['Sky Nook','Lines match tonight stars']],sus:['Lumo','Stardust','Mara'],need:['Leaf bookmark on the table','Tape marks on the glass']}];
let meta=read(metaKey,{best:0,goals:{}}),s=read(runKey,null)||fresh(),sel=[];function fresh(){return{case:0,score:0,focus:9,clues:[],used:{},links:[],solved:0,wrong:0,ended:false,log:['Echo opens the notebook. Evidence first, accusation later.']}}function read(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch(e){return f}}function save(){localStorage.setItem(runKey,JSON.stringify(s));localStorage.setItem(metaKey,JSON.stringify(meta))}function cur(){return cases[Math.min(s.case,2)]}function best(){try{return Math.max(meta.best,JSON.parse(localStorage.getItem('jvds_game_'+GAME_ID)||'{}').highScore||0)}catch(e){return meta.best}}function note(m){s.log.unshift(m);s.log=s.log.slice(0,10)}
function search(i){if(s.ended||s.focus<=0)return;const p=cur().places[i];s.used[s.case+':'+i]=true;if(!s.clues.includes(p[1])){s.clues.push(p[1]);s.score+=100;note(p[0]+': '+p[1])}s.focus--;render()}function pick(c){sel=sel.includes(c)?sel.filter(x=>x!==c):sel.concat(c).slice(-2);render()}function link(){if(sel.length<2)return;const ok=cur().need.every(n=>sel.includes(n));s.links.push((ok?'Strong theory: ':'Weak theory: ')+sel.join(' + '));s.score+=ok?220:45;if(ok)meta.goals.theory=true;note(ok?'Echo underlines the real connection.':'The link is noted, but it feels thin.');sel=[];render()}function accuse(name){if(s.ended)return;const has=cur().need.every(n=>s.clues.includes(n));if(name===cur().a&&has){s.solved++;s.score+=650+s.focus*40;meta.goals.solve=true;note('Solved: '+name+' fits the clue web.');document.getElementById('next').disabled=false}else{s.wrong++;s.score=Math.max(0,s.score-120);s.focus=Math.max(0,s.focus-1);note(name+' does not survive the clue check.')}render()}function next(){if(s.case>=2){finish();return}s.case++;s.focus=9;s.clues=[];s.used={};s.links=[];sel=[];note('New case: '+cur().t);render()}function finish(){s.ended=true;meta.goals.all=true;const final=s.score+s.solved*500-s.wrong*100;meta.best=Math.max(meta.best,final);s.score=final;save();gs.addScore(final);gs.recordGamePlay(Date.now());try{gs.saveState({best:meta.best,solved:s.solved})}catch(e){}window.jvdsCheckNewBest&&window.jvdsCheckNewBest();note('Casebook closed. Score '+final+' saved.')}function restart(){s=fresh();sel=[];render()}
function render(){document.getElementById('score').textContent=s.score;document.getElementById('caseNo').textContent=s.ended?'Done':(s.case+1)+'/3';document.getElementById('clueNo').textContent=s.clues.length;document.getElementById('linksNo').textContent=s.links.length;document.getElementById('focus').textContent=s.focus;document.getElementById('best').textContent=best();document.getElementById('title').textContent=cur().t;document.getElementById('brief').textContent=cur().b;document.getElementById('places').innerHTML=cur().places.map((p,i)=>'<button class="place '+(s.used[s.case+':'+i]?'done':'')+'" data-place="'+i+'"><b>'+p[0]+'</b><br><small>'+(s.used[s.case+':'+i]?p[1]:'Search for evidence')+'</small></button>').join('');document.getElementById('board').innerHTML=s.clues.map(c=>'<button class="clue '+(sel.includes(c)?'sel':'')+'" data-clue="'+c+'">'+c+'</button>').join('')||'<div class="clue">No clues yet</div>';document.getElementById('suspects').innerHTML=cur().sus.map(x=>'<button class="suspect" data-sus="'+x+'">'+x+'</button>').join('');document.getElementById('links').innerHTML=s.links.map(l=>'<div class="link">'+l+'</div>').join('')||'<div class="link">No theories yet</div>';document.getElementById('accuse').innerHTML=cur().sus.map(x=>'<button class="choice" data-sus="'+x+'">Accuse '+x+'</button>').join('');document.getElementById('log').innerHTML=s.log.map(x=>'<p>'+x+'</p>').join('');document.getElementById('result').className='result'+(s.ended?' show':'');document.getElementById('result').textContent=s.ended?'Final score '+s.score+' - best '+meta.best:'';save()}document.body.onclick=e=>{let b=e.target.closest('[data-place]');if(b)search(+b.dataset.place);b=e.target.closest('[data-clue]');if(b)pick(b.dataset.clue);b=e.target.closest('[data-sus]');if(b&&!b.classList.contains('suspect'))accuse(b.dataset.sus)};document.getElementById('linkBtn').onclick=link;document.getElementById('next').onclick=next;document.getElementById('restart').onclick=restart;render();
</script><script src="../cookie-consent.js" defer></script></body></html>
