<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0d0d12">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../logo.png" type="image/png">
<script src="../analytics-loader.js"></script>
<title>Game Template | JVDesignStudio</title>
<style>
:root {
  --beige: #F0EAD6;
  --tan: #D2B48C;
  --tan-dk: #b8956a;
  --rose: #BC4749;
  --rose-dk: #9b3a3c;
  --teal: #70A3A7;
  --teal-dk: #4e7d80;
  --charcoal: #403B33;
  --charcoal-lt: #5a5449;
  --bg-dark: #0d0d12;
  --bg-darker: #08080c;
  --surface-1: rgba(255, 255, 255, 0.04);
  --surface-2: rgba(255, 255, 255, 0.08);
  --surface-hover: rgba(255, 255, 255, 0.12);
  --border: rgba(255, 255, 255, 0.08);
  --border-hover: rgba(255, 255, 255, 0.15);
  --text-primary: #FFFFFF;
  --text-secondary: rgba(255, 255, 255, 0.7);
  --text-tertiary: rgba(255, 255, 255, 0.4);
  --success: #34D399;
  --error: #F87171;
  --echo: #3EC9A7;
  --pip: #F5A623;
  --lumo: #818CF8;
  --squirt: #FFB6C1;
  --stardust: #A78BFA;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }
body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: linear-gradient(180deg, var(--bg-dark) 0%, var(--bg-darker) 100%);
  color: var(--text-primary);
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

.game-container {
  width: 100%;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

.game-canvas {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  min-height: 0;
  overflow: hidden;
}

.game-canvas canvas {
  max-width: 100%;
  max-height: 100%;
  display: block;
  border-radius: 12px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  image-rendering: pixelated;
  image-rendering: -moz-crisp-edges;
  image-rendering: crisp-edges;
}

/* HUD */
.game-hud {
  position: fixed;
  top: 16px;
  left: 16px;
  right: 16px;
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
}

.hud-group {
  display: flex;
  gap: 8px;
  align-items: center;
}

.hud-pill {
  background: rgba(20, 14, 38, 0.8);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 8px 16px;
  font-size: 0.875rem;
  font-weight: 700;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
  transition: all 150ms;
}

.hud-pill:hover {
  background: rgba(30, 24, 48, 0.9);
  border-color: var(--border-hover);
}

.hud-label {
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  opacity: 0.6;
}

.hud-value {
  font-size: 1.1rem;
  font-weight: 800;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 24px;
  border-radius: 10px;
  font-size: 0.95rem;
  font-weight: 700;
  transition: all 150ms;
  border: none;
  cursor: pointer;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  user-select: none;
}

.btn:disabled { opacity: 0.5; cursor: not-allowed; }

.btn-primary {
  background: linear-gradient(135deg, var(--teal), var(--teal-dk));
  color: white;
  box-shadow: 0 4px 12px rgba(112, 163, 167, 0.3);
}

.btn-primary:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(112, 163, 167, 0.4);
}

.btn-secondary {
  background: var(--surface-2);
  color: var(--text-primary);
  border: 1px solid var(--border);
}

.btn-secondary:hover:not(:disabled) {
  background: var(--surface-hover);
  border-color: var(--border-hover);
}

.btn-icon {
  width: 48px;
  height: 48px;
  padding: 0;
  border-radius: 10px;
  font-size: 1.5rem;
}

/* Modal */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(8, 8, 12, 0.85);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  padding: 20px;
  opacity: 0;
  pointer-events: none;
  transition: opacity 300ms;
}

.modal-overlay.open {
  opacity: 1;
  pointer-events: auto;
}

.modal-content {
  background: var(--bg-dark);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 32px 28px;
  max-width: 500px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: 0 25px 50px rgba(0, 0, 0, 0.6);
  animation: slideUp 300ms ease-out;
}

@keyframes slideUp {
  from {
    opacity: 0;
    transform: translateY(20px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.modal-title {
  font-family: 'Fredoka', cursive;
  font-size: 1.75rem;
  font-weight: 700;
  margin-bottom: 24px;
}

.modal-body {
  margin-bottom: 24px;
  font-size: 0.95rem;
  line-height: 1.6;
  color: var(--text-secondary);
}

.modal-footer {
  display: flex;
  gap: 12px;
  justify-content: flex-end;
  margin-top: 24px;
}

/* Achievement Notification */
.achievement-notification {
  position: fixed;
  top: 80px;
  left: 50%;
  transform: translateX(-50%) translateY(-20px);
  background: linear-gradient(135deg, rgba(52, 211, 153, 0.2), rgba(129, 140, 248, 0.2));
  border: 1px solid rgba(52, 211, 153, 0.4);
  border-radius: 12px;
  padding: 16px 20px;
  backdrop-filter: blur(8px);
  z-index: 300;
  opacity: 0;
  transition: all 300ms ease-out;
  pointer-events: none;
  display: flex;
  gap: 12px;
  align-items: center;
}

.achievement-notification.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.achievement-notification-icon {
  font-size: 2rem;
}

.achievement-notification-text {
  color: #fff;
}

.achievement-notification-title {
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  opacity: 0.7;
}

.achievement-notification-name {
  font-size: 1rem;
  font-weight: 700;
}

/* Responsive */
@media (max-width: 768px) {
  .game-hud {
    top: 12px;
    left: 12px;
    right: 12px;
    font-size: 0.85rem;
  }

  .hud-pill {
    padding: 6px 12px;
    font-size: 0.75rem;
  }

  .btn {
    padding: 10px 16px;
    font-size: 0.85rem;
  }

  .modal-content {
    padding: 20px 16px;
  }
}

@media (max-width: 480px) {
  .game-canvas {
    padding: 8px;
  }

  .game-hud {
    flex-direction: column;
    align-items: flex-start;
  }

  .hud-group {
    width: 100%;
  }

  .hud-pill {
    flex: 1;
    justify-content: space-between;
  }

  .btn {
    padding: 10px 14px;
    font-size: 0.8rem;
  }

  .btn-icon {
    width: 40px;
    height: 40px;
    font-size: 1.2rem;
  }
}
</style>
</head>
<body>
<div class="game-container">
  <!-- HUD -->
  <div class="game-hud">
    <div class="hud-group">
      <div class="hud-pill">
        <span class="hud-label">Score</span>
        <span class="hud-value" data-stat="score">0</span>
      </div>
      <div class="hud-pill">
        <span class="hud-label">Level</span>
        <span class="hud-value" data-stat="level">1</span>
      </div>
      <div class="hud-pill">
        <span class="hud-label">Coins</span>
        <span class="hud-value" data-stat="coins">0</span>
      </div>
    </div>
    <div class="hud-group">
      <button class="btn btn-icon btn-secondary" id="pauseBtn">⏸</button>
      <button class="btn btn-icon btn-secondary" id="settingsBtn">⚙️</button>
      <button class="btn btn-icon btn-secondary" id="homeBtn">🏠</button>
    </div>
  </div>

  <!-- Game Canvas -->
  <div class="game-canvas">
    <canvas id="gameCanvas" width="420" height="700"></canvas>
  </div>
</div>

<!-- Pause Modal -->
<div class="modal-overlay" id="pauseModal">
  <div class="modal-content">
    <div class="modal-title">Game Paused</div>
    <div class="modal-body">
      <p>Resume your game whenever you're ready.</p>
    </div>
    <div class="modal-footer">
      <button class="btn btn-secondary" id="resumeBtn">Resume</button>
      <button class="btn btn-secondary" id="quitBtn">Quit</button>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div class="modal-overlay" id="settingsModal">
  <div class="modal-content">
    <div class="modal-title">Settings</div>
    <div class="modal-body">
      <label style="display: flex; gap: 12px; margin-bottom: 12px; align-items: center;">
        <input type="checkbox" id="soundToggle" checked>
        <span>Sound Effects</span>
      </label>
      <label style="display: flex; gap: 12px; margin-bottom: 12px; align-items: center;">
        <input type="checkbox" id="musicToggle" checked>
        <span>Music</span>
      </label>
    </div>
    <div class="modal-footer">
      <button class="btn btn-primary" id="closeSettingsBtn">Done</button>
    </div>
  </div>
</div>

<script src="../game-system.js"></script>
<script>
// Template initialization script
document.addEventListener('DOMContentLoaded', () => {
  // Initialize game system (override in actual games)
  const gameSystem = new GameSystem('template-game', 'Template Game', 'squirt');

  // HUD button handlers
  document.getElementById('pauseBtn').addEventListener('click', () => {
    document.getElementById('pauseModal').classList.add('open');
  });

  document.getElementById('settingsBtn').addEventListener('click', () => {
    document.getElementById('settingsModal').classList.add('open');
  });

  document.getElementById('homeBtn').addEventListener('click', () => {
    if (confirm('Are you sure you want to leave? Progress is automatically saved.')) {
      window.location.href = '/games/mobile-games.html';
    }
  });

  document.getElementById('resumeBtn').addEventListener('click', () => {
    document.getElementById('pauseModal').classList.remove('open');
  });

  document.getElementById('quitBtn').addEventListener('click', () => {
    if (confirm('Your progress is saved. Leave the game?')) {
      window.location.href = '/games/mobile-games.html';
    }
  });

  document.getElementById('closeSettingsBtn').addEventListener('click', () => {
    document.getElementById('settingsModal').classList.remove('open');
  });

  document.getElementById('soundToggle').addEventListener('change', (e) => {
    gameSystem.updateSetting('soundEnabled', e.target.checked);
  });

  document.getElementById('musicToggle').addEventListener('change', (e) => {
    gameSystem.updateSetting('musicEnabled', e.target.checked);
  });

  // Update HUD
  const updateHUD = () => {
    const stats = gameSystem.getStats();
    document.querySelector('[data-stat="score"]').textContent = stats.score;
    document.querySelector('[data-stat="level"]').textContent = stats.level;
    document.querySelector('[data-stat="coins"]').textContent = stats.coins;
  };

  updateHUD();
});
</script>
<script src="../cookie-consent.js"></script>
</body>
</html>
