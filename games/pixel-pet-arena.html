<!DOCTYPE html>
<html lang="en">
<head>

<style>
:root{--ink:#10242d;--panel:#fff9f3;--line:#d7c8c7;--muted:#6e6971;--teal:#073b4c;--pink:#ef476f;--gold:#ffd166;--green:#6a994e;--blue:#315d73;--red:#bc4749;--shadow:0 16px 36px rgba(7,59,76,.22)}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 20% 0,#ffd166 0,#ef476f 38%,#073b4c 100%);color:#fff}button,a{font:inherit}.wrap{width:min(1180px,100%);margin:0 auto;padding:16px 14px 88px}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.pill{display:inline-flex;align-items:center;justify-content:center;min-height:38px;color:#fff;text-decoration:none;font-weight:950;background:rgba(0,0,0,.34);border:1px solid rgba(255,255,255,.25);border-radius:8px;padding:8px 12px}.hero{margin:14px 0;display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end;border-bottom:3px solid var(--gold);padding:10px 0 16px}.kicker{color:#fff0ba;font-size:.78rem;font-weight:950;text-transform:uppercase}.hero h1{font-size:clamp(2rem,6vw,4.25rem);line-height:.98;margin:4px 0 7px;letter-spacing:0}.hero p{max-width:790px;color:rgba(255,255,255,.84);line-height:1.55;margin:0}.emoji{font-size:4.1rem;filter:drop-shadow(0 10px 12px rgba(0,0,0,.25))}.hud{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}.stat,.panel{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}.stat{padding:10px}.stat b{display:block;font-size:1.18rem}.stat span{display:block;color:var(--muted);font-size:.72rem;font-weight:950;text-transform:uppercase}.game{display:grid;grid-template-columns:minmax(0,1.08fr) minmax(330px,.92fr);gap:12px;margin-top:12px}.panel{padding:12px}.palette{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:10px}.swatch{border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);min-height:56px;font-weight:950;cursor:pointer}.swatch.active{outline:3px solid rgba(7,59,76,.22);border-color:var(--teal)}.canvas{display:grid;grid-template-columns:repeat(6,minmax(34px,1fr));gap:5px;aspect-ratio:1/1;max-height:480px}.pixel{border:1px solid #cebfc1;border-radius:6px;background:#fff;color:var(--ink);font-weight:950;cursor:pointer;min-width:0}.pixel small{display:block;font-size:.48rem;color:#4b5960}.c-0{background:#222;color:#fff}.c-1{background:#ef476f}.c-2{background:#ffd166}.c-3{background:#83d483}.c-4{background:#8ecae6}.arena{background:#fff1dc;border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px;font-weight:850}.actions,.moves{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}button.primary,button.secondary,.move{border-radius:8px;font-weight:950;min-height:44px;cursor:pointer}.primary{border:0;background:var(--teal);color:#fff}.secondary,.move{border:1px solid var(--line);background:#fff;color:var(--ink)}button:disabled{opacity:.5;cursor:not-allowed}.sideGrid{display:grid;gap:10px}.abilities,.goals{display:grid;gap:8px}.ability,.goal{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--muted);padding:8px;font-weight:850}.ability{cursor:pointer}.ability.active,.goal.done{background:#eef7df;border-color:#8eb36d;color:var(--ink)}.bars{display:grid;gap:8px}.bar label{display:flex;justify-content:space-between;color:var(--muted);font-size:.76rem;font-weight:950;text-transform:uppercase}.track{height:10px;border-radius:999px;background:#eadde0;overflow:hidden}.track i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red),var(--gold),var(--green));transition:width .25s}.log{min-height:142px;max-height:220px;overflow:auto;color:#594f57;line-height:1.45;font-size:.95rem}.log p{margin:0 0 8px}.result{display:none;padding:10px;border-radius:8px;background:#edf7f1;border:1px solid #b4d3c0;font-weight:850}.result.show{display:block}@media(max-width:900px){.hero,.game{grid-template-columns:1fr}.hud{grid-template-columns:repeat(3,1fr)}.emoji{font-size:3rem}}@media(max-width:560px){.wrap{padding-inline:10px}.hud{grid-template-columns:repeat(2,1fr)}.palette{grid-template-columns:repeat(3,1fr)}.actions,.moves{grid-template-columns:1fr}.hero h1{font-size:2.25rem}.pill{flex:1}.canvas{max-height:none}}
</style>
</head>
<body>
<div class="wrap"><div class="top"><a class="pill" href="../arcade.html">Back to Arcade</a><a class="pill" href="../games">All games</a><a class="pill" href="../tools/arcade-game-maker.html">Make your own</a></div><section class="hero"><div><div class="kicker">Drawing-to-game - pet league</div><h1>Pixel Pet Arena</h1><p>Paint a tiny pet, train its strongest colours into stats, pick two abilities, and battle friendly rivals through the league.</p></div><div class="emoji" aria-hidden="true">🐾</div></section><section class="hud"><div class="stat"><b id="score">0</b><span>Score</span></div><div class="stat"><b id="league">1/5</b><span>League</span></div><div class="stat"><b id="hp">24</b><span>Health</span></div><div class="stat"><b id="wins">0</b><span>Wins</span></div><div class="stat"><b id="badges">0</b><span>Badges</span></div><div class="stat"><b id="best">0</b><span>Best</span></div></section><main class="game"><section class="panel"><div class="palette" id="palette"></div><div class="arena" id="arenaText"></div><div class="canvas" id="canvas" aria-label="Pixel pet canvas"></div><div class="actions"><button class="primary" id="trainBtn">Train Pet</button><button class="primary" id="battleBtn">Battle</button><button class="secondary" id="restartBtn">Restart</button></div></section><aside class="panel sideGrid"><div><h2 style="margin:0 0 8px">Abilities</h2><div class="abilities" id="abilities"></div></div><div class="bars"><div class="bar"><label><span>Power</span><span id="powerText">0</span></label><div class="track"><i id="powerBar"></i></div></div><div class="bar"><label><span>Style</span><span id="styleText">0</span></label><div class="track"><i id="styleBar"></i></div></div></div><div><h2 style="margin:0 0 8px">Arena Goals</h2><div class="goals" id="goals"></div></div><div class="result" id="resultBox"></div><div><h2 style="margin:0 0 8px">Arena Log</h2><div class="log" id="log"></div></div></aside></main></div>
<script>
const GAME_ID="pixel-pet-arena";
const runKey="jvds_pixel_pet_arena_v2_run";
const metaKey="jvds_pixel_pet_arena_v2_meta";
const profile=new GameSystem(GAME_ID,"Pixel Pet Arena","ember");
const colors=[{id:0,name:"Ink",icon:"⬛"},{id:1,name:"Power",icon:"🟥"},{id:2,name:"Spark",icon:"🟨"},{id:3,name:"Agility",icon:"🟩"},{id:4,name:"Guard",icon:"🟦"}];
const rivals=[{name:"Button Pup",power:18,style:12},{name:"Glow Kit",power:24,style:18},{name:"Moss Moth",power:30,style:24},{name:"Turbo Turtle",power:38,style:28},{name:"Crown Sprite",power:48,style:36}];
const abilityDefs=[{id:"dash",icon:"💨",name:"Dash",text:"Agility adds bonus power"},{id:"spark",icon:"✨",name:"Spark",text:"Style scores extra"},{id:"shell",icon:"🛡️",name:"Shell",text:"Guard blocks damage"},{id:"roar",icon:"📣",name:"Roar",text:"Power doubles on rivals"}];
const goals=[{id:"draw",text:"Paint 18 pixels",test:s=>s.grid.filter(x=>x>0).length>=18},{id:"train",text:"Train 3 times",test:s=>s.trains>=3},{id:"wins",text:"Win 3 battles",test:s=>s.wins>=3},{id:"badge",text:"Earn a badge",test:s=>s.badges>=1},{id:"champ",text:"Win the league",test:s=>s.ended&&s.wins>=5}];
let meta=read(metaKey,{best:0,goals:{},champions:0});let state=read(runKey,null)||fresh();let selected=1;
function fresh(){return{score:0,league:0,hp:24,maxHp:24,wins:0,badges:0,trains:0,power:0,style:0,abilities:["dash","shell"],ended:false,grid:Array(36).fill(0),log:["Paint your pet, train the colours, then enter the friendly league."]};}
function read(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch(e){return f}}function save(){localStorage.setItem(runKey,JSON.stringify(state));localStorage.setItem(metaKey,JSON.stringify(meta));}
function best(){try{return Math.max(meta.best,JSON.parse(localStorage.getItem("jvds_game_"+GAME_ID)||"{}").highScore||0)}catch(e){return meta.best}}
function log(m){state.log.unshift(m);state.log=state.log.slice(0,12)}function counts(){return colors.map(c=>state.grid.filter(x=>x===c.id).length)}
function stats(){const c=counts();let power=c[1]*2+c[2]+state.trains*3,style=c[2]*2+c[3]+c[4]+state.badges*3,guard=c[4]*2+c[0];if(state.abilities.includes("dash"))power+=c[3];if(state.abilities.includes("spark"))style+=8;if(state.abilities.includes("shell"))guard+=7;if(state.abilities.includes("roar"))power+=Math.floor(c[1]*1.5);return{power,style,guard,total:power+style+guard};}
function paint(i){if(state.ended)return;state.grid[i]=selected;state.score+=2;checkGoals();save();render();}
function toggleAbility(id){if(state.ended)return;if(state.abilities.includes(id))state.abilities=state.abilities.filter(x=>x!==id);else{if(state.abilities.length>=2)state.abilities.shift();state.abilities.push(id);}save();render();}
function train(){if(state.ended)return;state.trains++;const st=stats();state.power=st.power;state.style=st.style;state.score+=80+st.total;state.hp=Math.min(state.maxHp,state.hp+2);log("Training read your pixel colours: power "+st.power+", style "+st.style+", guard "+st.guard+".");if(state.trains===2&&!state.abilities.includes("spark"))log("New ability idea unlocked: Spark pairs with yellow pixels.");checkGoals();save();render();}
function battle(){if(state.ended)return;const rival=rivals[state.league],st=stats();const petPower=st.power+Math.round(st.style/2);const rivalPower=rival.power+Math.round(rival.style/2);const margin=petPower-rivalPower;state.score+=Math.max(60,petPower*8+st.style*4);if(margin>=0){state.wins++;state.badges+=margin>14?1:0;state.hp=Math.min(state.maxHp,state.hp+3);state.score+=300+state.wins*100+(margin>14?180:0);log("Win over "+rival.name+". "+(margin>14?"Badge earned.":"Close but clean."));state.league++;}else{const damage=Math.max(2,Math.abs(margin)-st.guard);state.hp-=damage;state.score+=80;log(rival.name+" wins the round. Your pet takes "+damage+" strain.");if(state.hp<=0){finish();return;}}if(state.league>=rivals.length)finish();checkGoals();save();render();}
function finish(){state.ended=true;if(state.wins>=rivals.length)meta.champions++;checkGoals();const cleared=Object.keys(meta.goals).length;const finalScore=Math.max(0,Math.round(state.score+state.wins*350+state.badges*260+state.hp*25+cleared*150));state.score=finalScore;meta.best=Math.max(meta.best,finalScore);save();profile.addScore(finalScore);profile.recordGamePlay(Date.now());try{profile.saveState({best:meta.best,wins:state.wins,badges:state.badges});}catch(e){}if(window.jvdsCheckNewBest)window.jvdsCheckNewBest();log("League run complete. Final score "+finalScore+" saved to your Arcade profile.");render();}
function restart(){state=fresh();selected=1;save();render();}function checkGoals(){goals.forEach(g=>{if(g.test(state))meta.goals[g.id]=true;});}
function render(){checkGoals();const st=stats(),rival=rivals[Math.min(state.league,rivals.length-1)];document.getElementById('score').textContent=state.score;document.getElementById('league').textContent=state.ended?'Done':(state.league+1)+'/'+rivals.length;document.getElementById('hp').textContent=Math.max(0,state.hp)+'/'+state.maxHp;document.getElementById('wins').textContent=state.wins;document.getElementById('badges').textContent=state.badges;document.getElementById('best').textContent=best();document.getElementById('palette').innerHTML=colors.map(c=>'<button class="swatch '+(selected===c.id?'active':'')+'" data-color="'+c.id+'">'+c.icon+'<br><small>'+c.name+'</small></button>').join('');document.getElementById('arenaText').textContent=state.ended?'League complete. Restart to paint a stronger pet.':'Next rival: '+rival.name+' needs power '+rival.power+' and style '+rival.style+'.';document.getElementById('canvas').innerHTML=state.grid.map((v,i)=>'<button class="pixel c-'+v+'" data-i="'+i+'">'+colors[v].icon+'<small>'+(i+1)+'</small></button>').join('');document.getElementById('abilities').innerHTML=abilityDefs.map(a=>'<button class="ability '+(state.abilities.includes(a.id)?'active':'')+'" data-ability="'+a.id+'"><strong>'+a.icon+'</strong><span>'+a.name+'<br><small>'+a.text+'</small></span></button>').join('');document.getElementById('powerText').textContent=st.power;document.getElementById('powerBar').style.width=Math.min(100,st.power*2)+'%';document.getElementById('styleText').textContent=st.style;document.getElementById('styleBar').style.width=Math.min(100,st.style*2)+'%';document.getElementById('goals').innerHTML=goals.map(g=>'<div class="goal '+(meta.goals[g.id]?'done':'')+'"><strong>'+(meta.goals[g.id]?'✓':'○')+'</strong><span>'+g.text+'</span></div>').join('');document.getElementById('log').innerHTML=state.log.map(m=>'<p>'+m+'</p>').join('');const result=document.getElementById('resultBox');result.className='result'+(state.ended?' show':'');result.textContent=state.ended?'Final score '+state.score+' - wins '+state.wins+' - best '+meta.best:'';save();}
document.getElementById('palette').addEventListener('click',e=>{const b=e.target.closest('[data-color]');if(b){selected=Number(b.dataset.color);render();}});document.getElementById('canvas').addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b)paint(Number(b.dataset.i));});document.getElementById('abilities').addEventListener('click',e=>{const b=e.target.closest('[data-ability]');if(b)toggleAbility(b.dataset.ability);});document.getElementById('trainBtn').addEventListener('click',train);document.getElementById('battleBtn').addEventListener('click',battle);document.getElementById('restartBtn').addEventListener('click',restart);window.addEventListener('beforeunload',()=>{if(state.score>0)profile.recordGamePlay(Date.now());});save();render();
</script>
<script src="../cookie-consent.js" defer></script>
</body>
</html>
