<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Pixel Pet Arena | JVDesignStudio</title><link rel="manifest" href="../manifest.json"><meta name="theme-color" content="#073b4c"><meta name="description" content="Draw a pixel pet whose shape and colours become battle stats."><script src="../game-system.js"></script><link rel="stylesheet" href="../game-system.css"><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#073b4c;color:#fff}.wrap{max-width:1150px;margin:auto;padding:16px 12px 80px}.pill{color:#fff;background:#0006;border-radius:8px;padding:9px 12px;text-decoration:none;font-weight:900}.top{display:flex;gap:10px}.hero{border-bottom:3px solid #ffd166;margin:12px 0}.hero h1{font-size:clamp(2rem,7vw,4.2rem);margin:0}.hud,.game{display:grid;gap:10px}.hud{grid-template-columns:repeat(6,1fr)}.stat,.panel{background:#fff9f3;color:#10242d;border:1px solid #d7c8c7;border-radius:8px;padding:10px}.game{grid-template-columns:1fr .85fr}.canvas{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}.px{aspect-ratio:1;border:1px solid #cebfc1;border-radius:4px;background:#fff;cursor:pointer}.c1{background:#ef476f}.c2{background:#ffd166}.c3{background:#83d483}.c4{background:#8ecae6}.pal,.abilities,.goals{display:grid;gap:8px}.pal{grid-template-columns:repeat(5,1fr);margin-bottom:10px}.sw,.ab,.goal{border:1px solid #d7c8c7;background:#fff;color:#10242d;border-radius:8px;padding:9px;font-weight:900;cursor:pointer}.sw.active,.ab.active,.goal.done{background:#eef7df}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}button{font:inherit;font-weight:900;min-height:42px;border-radius:8px;cursor:pointer}.primary{border:0;background:#073b4c;color:#fff}.secondary{border:1px solid #d7c8c7;background:#fff;color:#10242d}.arena{background:#fff1dc;border-radius:8px;padding:10px}.log{max-height:220px;overflow:auto;color:#594f57}.result{display:none;background:#eef7df;border-radius:8px;padding:10px}.result.show{display:block}@media(max-width:820px){.game{grid-template-columns:1fr}.hud{grid-template-columns:repeat(3,1fr)}}@media(max-width:520px){.hud,.actions{grid-template-columns:1fr}.pal{grid-template-columns:repeat(3,1fr)}}</style></head><body><div class="wrap"><div class="top"><a class="pill" href="../arcade.html">Back to Arcade</a><a class="pill" href="../games">All games</a></div><section class="hero"><p>Drawing-to-battle</p><h1>Pixel Pet Arena</h1><p>Your drawing is the build. Red pixels make power, yellow makes spark, green makes speed, blue makes guard, and connected shapes earn style.</p></section><section class="hud"><div class="stat"><b id="score"></b><span>Score</span></div><div class="stat"><b id="round"></b><span>Round</span></div><div class="stat"><b id="power"></b><span>Power</span></div><div class="stat"><b id="style"></b><span>Style</span></div><div class="stat"><b id="wins"></b><span>Wins</span></div><div class="stat"><b id="best"></b><span>Best</span></div></section><main class="game"><section class="panel"><div class="pal" id="pal"></div><div class="canvas" id="canvas"></div><div class="actions"><button class="primary" id="battle">Battle</button><button class="secondary" id="mirror">Mirror Pet</button><button class="secondary" id="restart">Restart</button></div></section><aside class="panel"><div class="arena" id="arena"></div><h2>Abilities</h2><div class="abilities" id="abilities"></div><h2>Goals</h2><div class="goals" id="goals"></div><div class="result" id="result"></div><h2>Arena Log</h2><div class="log" id="log"></div></aside></main></div><script>
const GAME_ID='pixel-pet-arena',runKey='jvds_pet_draw_run',metaKey='jvds_pet_draw_meta',gs=new GameSystem(GAME_ID,'Pixel Pet Arena','ember');const cols=['Blank','Power','Spark','Speed','Guard'],emoji=['□','🟥','🟨','🟩','🟦'];const rivals=[['Patch Pup',18,10],['Glow Cat',25,16],['Sprint Moth',34,22],['Crown Sprite',46,30]];const abs=[['dash','Dash','Speed counts twice'],['shell','Shell','Guard blocks loss'],['spark','Spark','Style becomes score'],['roar','Roar','Power bonus']];const goals=[['draw','Paint 24 pixels',s=>s.grid.filter(Boolean).length>=24],['shape','Make one connected body',s=>connected()>12],['champ','Win the league',s=>s.ended&&s.wins>=4]];let meta=read(metaKey,{best:0,goals:{}}),s=read(runKey,null)||fresh(),color=1;function fresh(){return{grid:Array(64).fill(0),round:0,score:0,wins:0,abilities:['dash','shell'],ended:false,log:['Draw a pet shape first. The arena reads the pixels.']}}function read(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch(e){return f}}function save(){localStorage.setItem(runKey,JSON.stringify(s));localStorage.setItem(metaKey,JSON.stringify(meta))}function best(){try{return Math.max(meta.best,JSON.parse(localStorage.getItem('jvds_game_'+GAME_ID)||'{}').highScore||0)}catch(e){return meta.best}}function log(m){s.log.unshift(m);s.log=s.log.slice(0,10)}function counts(){return[0,1,2,3,4].map(c=>s.grid.filter(x=>x===c).length)}function connected(){const start=s.grid.findIndex(Boolean);if(start<0)return 0;const seen=new Set([start]),q=[start];while(q.length){const i=q.pop();[i-8,i+8,i%8?i-1:-1,i%8<7?i+1:-1].forEach(n=>{if(n>=0&&n<64&&s.grid[n]&& !seen.has(n)){seen.add(n);q.push(n)}})}return seen.size}function stats(){const c=counts(),body=connected();let p=c[1]*2+c[2],st=c[2]*2+body,sp=c[3]*2,gd=c[4]*2;if(s.abilities.includes('dash'))sp*=2;if(s.abilities.includes('roar'))p+=8;if(s.abilities.includes('spark'))st+=10;if(s.abilities.includes('shell'))gd+=8;return{p,st,sp,gd,total:p+st+sp+gd}}function paint(i){s.grid[i]=color;scoreGoals();render()}function mirror(){for(let y=0;y<8;y++)for(let x=0;x<4;x++)s.grid[y*8+7-x]=s.grid[y*8+x];log('Pet mirrored. Symmetry boosts connected style.');render()}function tog(id){s.abilities=s.abilities.includes(id)?s.abilities.filter(x=>x!==id):(s.abilities.concat(id).slice(-2));render()}function battle(){if(s.ended)return;const r=rivals[s.round],t=stats(),mine=t.p+t.st+t.sp+t.gd,them=r[1]+r[2];s.score+=mine*6;if(mine>=them){s.wins++;s.score+=350+s.wins*100;log('Win over '+r[0]+'. The drawing build worked.');s.round++}else{const block=s.abilities.includes('shell')?t.gd:0;s.score=Math.max(0,s.score-80);log(r[0]+' wins this bout. Add stronger colours or a bigger body.');if(block<10)s.round++}if(s.round>=rivals.length)finish();scoreGoals();render()}function finish(){s.ended=true;scoreGoals();const final=s.score+s.wins*400+connected()*20+Object.keys(meta.goals).length*180;meta.best=Math.max(meta.best,final);s.score=final;save();gs.addScore(final);gs.recordGamePlay(Date.now());try{gs.saveState({best:meta.best,wins:s.wins})}catch(e){}window.jvdsCheckNewBest&&window.jvdsCheckNewBest();log('League finished. Score '+final+' saved.')}function restart(){s=fresh();color=1;render()}function scoreGoals(){goals.forEach(([id,,fn])=>{if(fn(s))meta.goals[id]=true})}
function render(){scoreGoals();const t=stats(),r=rivals[Math.min(s.round,rivals.length-1)];document.getElementById('score').textContent=s.score;document.getElementById('round').textContent=s.ended?'Done':(s.round+1)+'/'+rivals.length;document.getElementById('power').textContent=t.p;document.getElementById('style').textContent=t.st;document.getElementById('wins').textContent=s.wins;document.getElementById('best').textContent=best();document.getElementById('pal').innerHTML=cols.map((c,i)=>'<button class="sw '+(color===i?'active':'')+'" data-c="'+i+'">'+emoji[i]+'<br><small>'+c+'</small></button>').join('');document.getElementById('canvas').innerHTML=s.grid.map((v,i)=>'<button class="px c'+v+'" data-i="'+i+'"></button>').join('');document.getElementById('arena').textContent=s.ended?'League complete. Restart to draw a new build.':'Next rival: '+r[0]+' power '+r[1]+' style '+r[2]+'. Connected body: '+connected();document.getElementById('abilities').innerHTML=abs.map(a=>'<button class="ab '+(s.abilities.includes(a[0])?'active':'')+'" data-a="'+a[0]+'"><b>'+a[1]+'</b><br><small>'+a[2]+'</small></button>').join('');document.getElementById('goals').innerHTML=goals.map(([id,t])=>'<div class="goal '+(meta.goals[id]?'done':'')+'"><b>'+(meta.goals[id]?'✓':'○')+'</b><span>'+t+'</span></div>').join('');document.getElementById('log').innerHTML=s.log.map(x=>'<p>'+x+'</p>').join('');document.getElementById('result').className='result'+(s.ended?' show':'');document.getElementById('result').textContent=s.ended?'Final score '+s.score+' - best '+meta.best:'';save()}document.getElementById('pal').onclick=e=>{const b=e.target.closest('[data-c]');if(b){color=+b.dataset.c;render()}};document.getElementById('canvas').onclick=e=>{const b=e.target.closest('[data-i]');if(b)paint(+b.dataset.i)};document.getElementById('abilities').onclick=e=>{const b=e.target.closest('[data-a]');if(b)tog(b.dataset.a)};document.getElementById('battle').onclick=battle;document.getElementById('mirror').onclick=mirror;document.getElementById('restart').onclick=restart;render();
</script><script src="../cookie-consent.js" defer></script></body></html>
