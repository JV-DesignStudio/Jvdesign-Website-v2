<script>
const gameSystem = new GameSystem('pastry-match', 'Pastry Match', 'squirt');
const audioEffects = new AudioEffects(0.6);
if (localStorage.getItem('soundEnabled') === 'false') audioEffects.setMasterVolume(0);

const PASTRIES = ['🥐', '🧁', '🍪', '🍰', '�-', '🍩', '🧆', '🥯', '🍫', '🍬', '🥞', '🍮'];
const MODES = [
  { id: 'easy', cols: 4, rows: 3, pairs: 6,  label: '🧒 Little Baker' },
  { id: 'std',  cols: 4, rows: 4, pairs: 8,  label: '🧑 Baker' },
  { id: 'hard', cols: 6, rows: 4, pairs: 12, label: '🔥 Head Chef' },
];
const PM_KEY = 'pastryMatch:v2';
function toggleSound() {
  const current = localStorage.getItem('soundEnabled') !== 'false';
  localStorage.setItem('soundEnabled', current ? 'false' : 'true');
  audioEffects.setMasterVolume(current ? 0 : 0.6);
  document.getElementById('soundBtn').textContent = current ? '🔇' : '🔊';
}
function loadModes() {
  try { return JSON.parse(localStorage.getItem(PM_KEY)) || {}; } catch (e) { return {}; }
}
function saveModes(m) { try { localStorage.setItem(PM_KEY, JSON.stringify(m)); } catch (e) {} }
let chosenMode = 'std';
let cards = [];
let cardEls = [];
let state = 'menu';
let score = 0, moves = 0, best = 0, streak = 0, maxMoves = 0;
let flipped = [];
let matched = 0;
let startTime = 0;
let timerInterval = null;

function currentMode() { return MODES.find(m => m.id === chosenMode) || MODES[1]; }
function initCards() {
  const mode = currentMode();
  const deck = [];
  for (let i = 0; i < mode.pairs; i++) { deck.push(PASTRIES[i % PASTRIES.length]); deck.push(PASTRIES[i % PASTRIES.length]); }
  // Fisher-Yates: the old sort-by-random shuffle was biased, letting sharp
  // players predict pair positions from earlier deals.
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  cards = deck.map((emoji, i) => ({ id: i, emoji, state: 'hidden' }));
  matched = 0;
  flipped = [];
  score = 0;
  moves = 0;
  streak = 0;
  maxMoves = mode.pairs * 3; // move limit = 3x pairs
  const boardEl = document.getElementById('board');
  boardEl.classList.toggle('cols6', currentMode().cols === 6);
  boardEl.style.gridTemplateColumns = 'repeat(' + currentMode().cols + ', 1fr)';
}

function buildBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  cardEls = cards.map((c, i) => {
    const btn = document.createElement('button');
    btn.className = 'card-btn';
    btn.textContent = '?';
    btn.onclick = () => flipCard(i);
    board.appendChild(btn);
    return btn;
  });
  updateHud();
}

function updateCard(i, animate) {
  const c = cards[i], btn = cardEls[i];
  const shown = c.state !== 'hidden';
  btn.className = 'card-btn' + (shown ? ' flipped' : '') + (c.state === 'matched' ? ' matched' : '');
  btn.disabled = c.state === 'matched';
  btn.textContent = shown ? c.emoji : '?';
  if (animate) {
    btn.classList.add('reveal');
    setTimeout(() => btn.classList.remove('reveal'), 300);
  }
}

function updateHud() {
  document.getElementById('scoreHud').textContent = score;
  document.getElementById('movesHud').textContent = moves;
}

function floatText(txt, big) {
  const div = document.createElement('div');
  div.className = 'float-pop' + (big ? ' big' : '');
  div.textContent = txt;
  document.getElementById('wrapper').appendChild(div);
  setTimeout(() => div.remove(), 900);
}

function flipCard(i) {
  if (state !== 'playing' || cards[i].state !== 'hidden' || flipped.length >= 2 || moves >= maxMoves) return;
  audioEffects.playTap(600);
  cards[i].state = 'flipped';
  flipped.push(i);
  updateCard(i, true);

  if (flipped.length === 2) {
    moves++;
    updateHud();
    setTimeout(checkMatch, 550);
  }
}

function checkMatch() {
  const [a, b] = flipped;
  flipped = [];
  if (cards[a].emoji === cards[b].emoji) {
    cards[a].state = 'matched';
    cards[b].state = 'matched';
    matched++;
    streak++;
    const mult = streak >= 10 ? 3 : streak >= 5 ? 2 : streak >= 3 ? 1.5 : 1;
    const bonus = Math.round((streak - 1) * 25 * mult);
    score += Math.round((Math.max(100 - moves * 2, 10)) * mult) + bonus;
    updateCard(a);
    updateCard(b);
    ParticleSystem.sparkle(cardEls[a], 5);
    ParticleSystem.sparkle(cardEls[b], 5);
    if (streak >= 2) {
      const comboEl = document.getElementById('comboDisplay');
      if (comboEl) { comboEl.textContent = '�-' + mult + ' COMBO!'; comboEl.classList.add('show'); setTimeout(() => comboEl.classList.remove('show'), 1500); }
      floatText('STREAK �-' + streak + '  +' + bonus, streak >= 3);
      audioEffects.playCombo(streak);
    } else {
      audioEffects.playSuccess(750);
    }
    updateHud();
    if (matched === currentMode().pairs) endGame();
  } else {
    cards[a].state = 'hidden';
    cards[b].state = 'hidden';
    streak = 0;
    updateCard(a, true);
    updateCard(b, true);
    audioEffects.playError();
    // Peek: when moves are low (<5), briefly reveal all unmatched cards
    if (maxMoves - moves <= 5 && matched < currentMode().pairs - 1) {
      setTimeout(() => {
        cards.forEach((c, i) => { if (c.state === 'hidden') { c.state = 'peek'; updateCard(i); } });
        setTimeout(() => {
          cards.forEach((c, i) => { if (c.state === 'peek') { c.state = 'hidden'; updateCard(i); } });
        }, 1200);
      }, 400);
    }
    if (moves >= maxMoves) { setTimeout(() => endGame(false), 600); return; }
  }
}

function startGame() {
  document.getElementById('startModal').classList.remove('show');
  document.getElementById('winModal').classList.remove('show');
  initCards();
  buildBoard();
  clearInterval(timerInterval);
  document.getElementById('timeHud').textContent = 0;
  document.getElementById('movesHud').textContent = '0/' + maxMoves;

  // sneak peek: show every pastry briefly, then flip back and start
  state = 'peek';
  floatText('👀 Memorise!', true);
  cardEls.forEach((btn, i) => {
    btn.classList.add('flipped', 'reveal');
    btn.textContent = cards[i].emoji;
  });
  setTimeout(() => {
    cardEls.forEach((btn, i) => updateCard(i, true));
    state = 'playing';
    startTime = performance.now();
    timerInterval = setInterval(() => {
      document.getElementById('timeHud').textContent = Math.round((performance.now() - startTime) / 1000);
    }, 500);
  }, 1600);
}

function endGame(didWin = true) {
  state = didWin ? 'won' : 'lost';
  clearInterval(timerInterval);
  const time = Math.round((performance.now() - startTime) / 1000);
  const timeBonus = Math.max(0, 90 - time) * 2;
  score += timeBonus;
  updateHud();
  gameSystem.addScore(score);
  const mode = currentMode();
  const modes = loadModes();
  modes[mode.id] = Math.max(modes[mode.id] || 0, score);
  saveModes(modes);
  gameSystem.addXP(Math.max(5, Math.floor(score / 20)));
  gameSystem.unlockAchievement('firstPlay');
  if (moves <= 16) gameSystem.unlockAchievement('perfectMemory');
  gameSystem.recordGamePlay(time * 1000);
  gameSystem.saveState();

  best = Math.max(best, score);
  document.getElementById('bestStart').textContent = best;
  ParticleSystem.confetti(window.innerWidth / 2, window.innerHeight / 3, 18);
  audioEffects.playLevelUp();
  const won = matched === currentMode().pairs;
  document.getElementById('winSub').textContent = (won ? (moves <= 16 ? 'Perfect memory! 🧠' : 'Great match!') : 'Out of moves!') + (timeBonus > 0 ? ' ⏱ Time bonus +' + timeBonus : '');
  document.getElementById('finalScore').textContent = score.toLocaleString();
  GameUI.countUp(document.getElementById('finalScore'), score);
  document.getElementById('finalMoves').textContent = moves;
  document.getElementById('finalBest').textContent = Math.max(best, modes[mode.id] || 0);
  document.getElementById('winModeTag').textContent = mode.label;
  const par = mode.pairs * 2;
  GameUI.showMedal(document.getElementById('finalScore').closest('.stats'), score,
    [[par * 40, '🥉', 'Bronze Baker'], [par * 70, '🥈', 'Silver Baker'], [par * 100, '🥇', 'Gold Baker']]);
  document.getElementById('winModal').classList.add('show');
}

best = gameSystem.state.highScore || 0;
function renderModeRow() {
  const row = document.getElementById('modeRow');
  const modes = loadModes();
  row.innerHTML = MODES.map(m =>
    '<button type="button" class="' + (m.id === chosenMode ? 'sel' : '') + '" data-mode="' + m.id + '">' + m.label + '</button>').join('');
  row.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
    chosenMode = b.dataset.mode;
    const m = currentMode();
    best = Math.max(gameSystem.state.highScore || 0, modes[chosenMode] || 0);
    document.getElementById('bestModeLabel').textContent = m.label.replace(/^\S+\s*/, '');
    document.getElementById('bestStart').textContent = modes[chosenMode] || 0;
    renderModeRow();
  }));
  const m = currentMode();
  document.getElementById('bestModeLabel').textContent = m.label.replace(/^\S+\s*/, '');
  document.getElementById('bestStart').textContent = modes[chosenMode] || 0;
}
renderModeRow();
document.getElementById('gamesStart').textContent = gameSystem.state.gamesPlayed || 0;
</script>
<script defer src="../cookie-consent.js"></script>
</body>
</html>
