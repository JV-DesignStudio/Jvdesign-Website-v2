<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, follow">
<title>Play | JVDS Arcade</title>
<meta name="description" content="The JVDS Arcade cover page for a game. Read a little about it, then press Play to jump in full screen.">
<link rel="icon" href="../logo.png" type="image/png">
<!-- Shared security fallbacks (A781): keep in sync with _headers. -->
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' blob: https://www.googletagmanager.com https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https://placehold.co https://img.itch.zone https://img.youtube.com https://unavatar.io https://labs.phaser.io https://www.googletagmanager.com https://www.google-analytics.com; media-src 'self' blob:; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com; frame-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<link rel="stylesheet" href="../style-play.css?v=1">
</head>
<body class="play-cover-page">

<div class="play-bg" id="playBg" aria-hidden="true"></div>

<div class="play-wrap">
  <header class="play-top">
    <a class="play-back" href="../arcade.html">← Back to Arcade</a>
    <div class="play-brand"><span class="cab">🕹️</span> <span><b>JVDS</b> Arcade</span></div>
  </header>

  <main id="playMain">
    <section class="play-hero">
      <div class="play-cover" id="playCover"></div>
      <div class="play-copy">
        <div class="play-eyebrow" id="playEyebrow">Now playing</div>
        <h1 class="play-title" id="playTitle">Loading…</h1>
        <p class="play-desc" id="playDesc"></p>
        <div class="play-badges" id="playBadges"></div>
        <div class="play-actions">
          <button type="button" class="play-btn" id="playBtn">▶ Play</button>
          <a class="play-secondary" href="../arcade.html">All games</a>
        </div>
      </div>
    </section>

    <div class="play-info" id="playInfo"></div>
  </main>
</div>

<!-- Full screen play stage -->
<div class="play-stage" id="playStage" role="region" aria-label="Game">
  <div class="play-loading" id="playLoading"><span class="dots">🎮</span> Loading the game…</div>
  <iframe id="playFrame" title="Game" allow="fullscreen; autoplay; gamepad; accelerometer; gyroscope" allowfullscreen scrolling="no"></iframe>
</div>
<button type="button" class="play-exit" id="playExit">✕ Exit game</button>

<script defer src="../games-registry.js"></script>
<script defer src="../player-profile.js"></script>
<script>
(function () {
  'use strict';

  var GAMES = [];
  var game = null;

  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }

  function param(name) {
    try { return new URLSearchParams(location.search).get(name); }
    catch (e) {
      var m = new RegExp('[?&]' + name + '=([^&]+)').exec(location.search);
      return m ? decodeURIComponent(m[1]) : null;
    }
  }

  function artSrc(g) {
    if (g.cover) return '../' + g.cover;
    if (g.thumb) return '../' + g.thumb;
    return '';
  }

  function guideBadge(name) {
    var n = String(name || '').toLowerCase();
    return '/assets/mascots/' + n + '-badge.webp';
  }

  function fmt(n) { return (n || 0).toLocaleString(); }

  function bestOf(id) {
    try {
      var raw = localStorage.getItem('jvds_game_' + id);
      if (!raw) return 0;
      var s = JSON.parse(raw);
      return (s && s.highScore) || 0;
    } catch (e) { return 0; }
  }

  function showMissing() {
    document.getElementById('playMain').innerHTML =
      '<div class="play-missing">' +
        '<div class="ic">🎮</div>' +
        '<h1>Pick a game first</h1>' +
        '<p>This is the Arcade cover page. Choose a game to see its cover.</p>' +
        '<a class="play-btn" href="../arcade.html" style="text-decoration:none">Browse the Arcade</a>' +
      '</div>';
    document.getElementById('playTitle') && (document.getElementById('playTitle').textContent = 'Play');
  }

  function hydrate() {
    var id = param('g');
    GAMES = window.JVDS_GAMES || [];
    game = GAMES.filter(function (x) { return x.id === id; })[0] || null;

    if (!game) { showMissing(); return; }

    document.title = game.title + ' | JVDS Arcade';
    var md = document.querySelector('meta[name="description"]');
    if (md) md.setAttribute('content', game.desc || game.description || ('Play ' + game.title + ' in the JVDS Arcade.'));

    var src = artSrc(game);
    if (src) {
      document.getElementById('playBg').innerHTML =
        '<img src="' + esc(src) + '" alt="" onerror="this.style.display=\'none\'">';
      document.getElementById('playCover').innerHTML =
        '<img src="' + esc(src) + '" alt="' + esc(game.title) + ' cover">';
    } else {
      document.getElementById('playCover').innerHTML =
        '<div class="ph" style="background:' + esc(game.bg || '#1b1e2a') + '">' + (game.emoji || '🎮') + '</div>';
    }

    var best = bestOf(game.id);
    if (best > 0) {
      document.getElementById('playCover').insertAdjacentHTML('beforeend',
        '<div class="done">★ ' + fmt(best) + ' best</div>');
    }

    document.getElementById('playEyebrow').textContent = game.tag || 'Arcade game';
    document.getElementById('playTitle').textContent = game.title;
    document.getElementById('playDesc').textContent =
      game.desc || game.description || game.playPromise || '';

    var badges = [];
    if (game.character) badges.push('<span class="play-badge guide"><img src="' + esc(guideBadge(game.character)) + '" alt="" loading="lazy" width="18" height="18">' + esc(game.character) + ' guides</span>');
    if (game.session || game.arcadeSession) badges.push('<span class="play-badge session">' + esc(game.arcadeSession || game.session) + '</span>');
    if (game.age) badges.push('<span class="play-badge">' + esc(game.age) + '</span>');
    if (game.controlType) badges.push('<span class="play-badge">' + esc(game.controlType) + '</span>');
    document.getElementById('playBadges').innerHTML = badges.join('');

    var info = [];
    if (game.objective) info.push(['Goal', game.objective]);
    if (game.finishLine) info.push(['Finish', game.finishLine]);
    if (game.controls) info.push(['Controls', game.controls]);
    info.push(['Your best', best > 0 ? fmt(best) : 'Not played yet']);
    document.getElementById('playInfo').innerHTML = info.map(function (r) {
      return '<div class="play-card"><b>' + esc(r[0]) + '</b><span>' + esc(r[1]) + '</span></div>';
    }).join('');

    // Clean-URL nicety: /games/<file> used to open the game directly. When the
    // cover is opened from such a link with ?g= only, keep the bar on play.html.
    try { history.replaceState({ g: game.id }, '', 'play.html?g=' + encodeURIComponent(game.id)); } catch (e) {}

    window.__play = { game: game, enter: enter, leave: leave };
  }

  /* ── Full screen play ─────────────────────────────────────── */
  var stage = document.getElementById('playStage');
  var frame = document.getElementById('playFrame');
  var loading = document.getElementById('playLoading');

  function enter() {
    if (!game) return;
    loading.style.display = 'grid';
    frame.addEventListener('load', function onLoad() {
      frame.removeEventListener('load', onLoad);
      loading.style.display = 'none';
    });
    frame.setAttribute('src', game.file);
    document.body.classList.add('playing');
    window.scrollTo(0, 0);
    try {
      var el = document.documentElement;
      if (el.requestFullscreen) el.requestFullscreen().catch(function () {});
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    } catch (e) { /* iOS Safari: the fixed overlay still fills the screen */ }
  }

  function leave() {
    document.body.classList.remove('playing');
    try { frame.setAttribute('src', 'about:blank'); } catch (e) {}
    loading.style.display = 'grid';
    try {
      if (document.fullscreenElement && document.exitFullscreen) document.exitFullscreen().catch(function () {});
      else if (document.webkitFullscreenElement && document.webkitExitFullscreen) document.webkitExitFullscreen();
    } catch (e) {}
  }

  document.getElementById('playBtn').addEventListener('click', enter);
  document.getElementById('playExit').addEventListener('click', leave);
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && document.body.classList.contains('playing')) leave();
  });
  document.addEventListener('fullscreenchange', function () {
    if (!document.fullscreenElement && document.body.classList.contains('playing')) leave();
  });

  function boot() {
    if (window.JVDS_GAMES && window.JVDS_GAMES.length) { hydrate(); return; }
    var tries = 0;
    var t = setInterval(function () {
      if (window.JVDS_GAMES && window.JVDS_GAMES.length) { clearInterval(t); hydrate(); }
      else if (++tries > 20) { clearInterval(t); hydrate(); }
    }, 50);
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
  else boot();
})();
</script>
</body>
</html>
