<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0c1222;color:#e2e8f0;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;height:100dvh}
.game-wrap{display:flex;flex-direction:column;height:100dvh;max-width:900px;margin:0 auto;position:relative}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;background:rgba(0,0,0,.5);z-index:10}
.top-bar a{color:#94a3b8;text-decoration:none;font-size:14px}
.top-bar .title{font-weight:800;font-size:16px;color:#a78bfa}
.hud{display:flex;justify-content:space-around;padding:6px 12px;background:rgba(0,0,0,.35);font-size:13px;z-index:10}
.hud div{text-align:center}
.hud b{display:block;font-size:18px;color:#c4b5fd}
canvas{flex:1;width:100%;display:block;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.72);z-index:20;gap:16px;padding:24px;text-align:center}
.overlay h1,.overlay #endTitle{font-size:32px;color:#a78bfa}
.overlay p{color:#94a3b8;max-width:360px;line-height:1.5}
.overlay .stats{display:flex;gap:24px;margin:12px 0}
.overlay .stats div{text-align:center}
.overlay .stats b{display:block;font-size:22px;color:#c4b5fd}
.overlay .stats small{color:#94a3b8;font-size:12px}
.btn{background:#7c3aed;color:#fff;border:none;padding:12px 32px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer}
.btn:hover{background:#8b5cf6}
.btn-ghost{background:transparent;border:2px solid #475569;color:#94a3b8;padding:10px 24px;border-radius:12px;font-size:14px;cursor:pointer}
.hidden{display:none}
.toast{position:absolute;top:40%;left:50%;transform:translate(-50%,-50%);background:rgba(139,92,246,.9);color:#fff;padding:8px 20px;border-radius:8px;font-weight:700;font-size:18px;z-index:15;opacity:0;transition:opacity .15s;pointer-events:none}
.toast.show{opacity:1}
.controls-hint{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:12px;z-index:12}
.controls-hint button{background:rgba(124,58,237,.45);border:2px solid rgba(124,58,237,.6);color:#e9d5ff;width:72px;height:52px;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none}
.controls-hint button:active{background:rgba(139,92,246,.7)}
/* Story HUD lives inside the game shell so it never pushes the play area off-screen. */
.game-wrap .storyrun{width:100%;margin:0;padding:6px 10px 0}
.game-wrap .storyrun .sr-story{margin-top:6px;padding:6px 10px}
.game-wrap .storyrun .sr-open,
.game-wrap .storyrun .sr-objective{display:none}
/* Game-over modal must sit above the fullscreen game shell (game-shell.js uses z-index 99990). */
.storyrun.sr-modal{z-index:100050}
</style>
</head>
<body>
<div class="game-wrap" data-jvds-root data-storyrun-host>
  <div class="top-bar">
    <a href="../arcade.html">&larr; Arcade</a>
    <span class="title">Lumo's Dash</span>
    <button class="btn-ghost" id="soundBtn" style="padding:4px 10px;font-size:13px">🔊</button>
  </div>
  <div class="hud">
    <div><small>Score</small><b id="scoreHud">0</b></div>
    <div><small>Distance</small><b id="distHud">0m</b></div>
    <div><small>Stardust</small><b id="dustHud">0</b></div>
    <div><small>Goal</small><b id="goalHud">50m</b></div>
    <div><small>Best</small><b id="bestHud">0</b></div>
  </div>
  <canvas id="game"></canvas>
  <div class="toast" id="toast"></div>

  <div class="controls-hint" id="touchControls" style="display:none">
    <button id="jumpBtn">⬆ Jump</button>
    <button id="slideBtn">⬇ Slide</button>
  </div>

  <div class="overlay" id="startScreen">
    <h1>🦊 Lumo's Dash</h1>
    <p>Lumo the purple fox is dashing through the enchanted forest. Jump over gaps and rocks, slide under low branches, and collect stardust to keep the glow alive.</p>
    <p style="font-size:13px;color:#64748b">Space/Up/Tap to jump. Down/Swipe down to slide.</p>
    <button class="btn" id="playBtn">Start Dashing</button>
    <button class="btn-ghost" data-go="../arcade.html">Back to Games</button>
  </div>

  <div class="overlay hidden" id="endScreen">
    <h2 id="endTitle">Run Over</h2>
    <div class="stats" id="endStats"></div>
    <button class="btn" id="againBtn">Dash Again</button>
    <button class="btn-ghost" data-go="../arcade.html">Back to Games</button>
  </div>
</div>

<script src="../story-run.js"></script>
