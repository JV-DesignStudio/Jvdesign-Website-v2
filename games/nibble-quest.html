<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="manifest" href="../manifest.json">
<link rel="icon" href="../logo.png" type="image/png">
<meta name="theme-color" content="#BC4749">
<link rel="canonical" href="https://jvdesignstudio.co.uk/games/nibble-quest.html">
<meta name="robots" content="index, follow">
<meta name="description" content="Play Nibble Quest — a free browser snake game by JVDesignStudio. Eat, grow, and beat your high score. Swipe or arrow keys.">
<title>Nibble Quest | JVDesignStudio</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('consent','default',{analytics_storage:'denied'});gtag('js',new Date());gtag('config','G-3JBXCCNY4C');</script>
<style>
:root{--beige:#F0EAD6;--rose:#BC4749;--rose-dk:#9b3a3c;--teal:#70A3A7;--teal-dk:#4e7d80;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Inter',sans-serif;background:linear-gradient(160deg,#0f2a26,#08201d 70%,#04100e);color:var(--beige);min-height:100vh;overflow-x:hidden;-webkit-tap-highlight-color:transparent;user-select:none;}
a{text-decoration:none;color:inherit;}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;}
.topbar a.back{font-weight:700;font-size:.9rem;background:rgba(0,0,0,.3);padding:8px 14px;border-radius:10px;}
.topbar .brand{font-family:'Fredoka',cursive;font-weight:700;font-size:1.05rem;}
.wrap{max-width:520px;margin:0 auto;padding:6px 16px 40px;text-align:center;}
h1{font-family:'Fredoka',cursive;font-size:clamp(1.7rem,6vw,2.4rem);margin:6px 0;color:#fff;}
.hud{display:flex;gap:12px;justify-content:center;margin:8px 0 14px;}
.hud .stat{background:rgba(0,0,0,.3);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:8px 18px;}
.hud .label{font-size:.6rem;text-transform:uppercase;letter-spacing:.1em;opacity:.7;font-weight:700;}
.hud .val{font-size:1.4rem;font-weight:800;font-family:'Fredoka',cursive;}
#board{background:#0c2420;border:3px solid rgba(112,163,167,.4);border-radius:14px;touch-action:none;width:100%;max-width:420px;aspect-ratio:1;display:block;margin:0 auto;box-shadow:0 10px 40px rgba(0,0,0,.4);}
.pad{display:grid;grid-template-columns:repeat(3,60px);grid-template-rows:repeat(3,60px);gap:6px;justify-content:center;margin:18px auto 0;}
.pad button{background:rgba(112,163,167,.18);border:1px solid rgba(112,163,167,.35);color:var(--beige);font-size:1.4rem;border-radius:12px;cursor:pointer;}
.pad button:active{background:rgba(112,163,167,.4);}
.pad .sp{visibility:hidden;}
@media(min-width:760px){.pad{display:none;}}
.overlay{position:fixed;inset:0;background:rgba(5,18,15,.93);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;text-align:center;padding:24px;z-index:50;}
.overlay h2{font-family:'Fredoka',cursive;font-size:2rem;color:#fff;}
.overlay p{max-width:330px;opacity:.9;line-height:1.6;font-size:.95rem;}
.btn{background:var(--rose);color:#fff;font-weight:800;font-size:1.05rem;padding:15px 38px;border:none;border-radius:14px;cursor:pointer;box-shadow:0 5px 0 var(--rose-dk);transition:transform .1s,box-shadow .1s;font-family:inherit;}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--rose-dk);}
.btn.teal{background:var(--teal);box-shadow:0 5px 0 var(--teal-dk);}
.best{font-size:.85rem;opacity:.8;}
.hidden{display:none!important;}
</style>
<link rel="stylesheet" href="../style-shared.css">
</head>
<body>
<div class="topbar">
  <a class="back" href="../pages/games.html">← All Games</a>
  <span class="brand">JVDesignStudio</span>
  <span style="width:80px"></span>
</div>

<div class="wrap">
  <h1>🐍 Nibble Quest</h1>
  <div class="hud">
    <div class="stat"><div class="label">Score</div><div class="val" id="score">0</div></div>
    <div class="stat"><div class="label">Best</div><div class="val" id="best">0</div></div>
  </div>
  <canvas id="board" width="420" height="420"></canvas>
  <div class="pad">
    <div class="sp"></div><button data-dir="up">▲</button><div class="sp"></div>
    <button data-dir="left">◀</button><div class="sp"></div><button data-dir="right">▶</button>
    <div class="sp"></div><button data-dir="down">▼</button><div class="sp"></div>
  </div>
</div>

<div class="overlay" id="startScreen">
  <div style="font-size:3.2rem">🐍🍎</div>
  <h2>Nibble Quest</h2>
  <p>Guide the snake to eat fruit and grow. Use <b>arrow keys / WASD</b>, <b>swipe</b>, or the on-screen pad. Don't hit the walls or yourself!</p>
  <button class="btn" id="startBtn">▶ Start Game</button>
  <p class="best" id="bestStart"></p>
</div>

<div class="overlay hidden" id="endScreen">
  <div style="font-size:3rem" id="endEmoji">🍎</div>
  <h2 id="endTitle">Game Over</h2>
  <p id="endMsg"></p>
  <button class="btn teal" id="againBtn">↻ Play Again</button>
  <a class="back" href="../pages/games.html" style="margin-top:4px">← Back to Games</a>
</div>

<script>
(function(){
  const cv=document.getElementById('board'),ctx=cv.getContext('2d');
  const GRID=20,CELL=cv.width/GRID;
  const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
  const startScreen=document.getElementById('startScreen'),endScreen=document.getElementById('endScreen');
  let snake,dir,nextDir,food,score,running,tickT,speed;
  let best=+(localStorage.getItem('nibbleQuestBest')||0);
  bestEl.textContent=best;document.getElementById('bestStart').textContent=best?('Best: '+best):'';

  function placeFood(){
    do{food={x:Math.floor(Math.random()*GRID),y:Math.floor(Math.random()*GRID)};}
    while(snake.some(s=>s.x===food.x&&s.y===food.y));
  }
  function reset(){
    snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];dir={x:1,y:0};nextDir={x:1,y:0};
    score=0;speed=140;running=true;scoreEl.textContent=0;placeFood();
  }
  function setDir(nx,ny){
    if(!running)return;
    if(nx===-dir.x&&ny===-dir.y)return; // no reverse
    nextDir={x:nx,y:ny};
  }
  const keyMap={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],KeyW:[0,-1],KeyS:[0,1],KeyA:[-1,0],KeyD:[1,0]};
  addEventListener('keydown',e=>{if(keyMap[e.code]){e.preventDefault();setDir(...keyMap[e.code]);}});
  document.querySelectorAll('.pad button').forEach(b=>{
    const m={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[b.dataset.dir];
    b.addEventListener('click',()=>setDir(...m));
  });
  let tsx,tsy;
  cv.addEventListener('touchstart',e=>{tsx=e.touches[0].clientX;tsy=e.touches[0].clientY;},{passive:true});
  cv.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-tsx,dy=e.changedTouches[0].clientY-tsy;
    if(Math.abs(dx)<20&&Math.abs(dy)<20)return;
    if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?1:-1,0);else setDir(0,dy>0?1:-1);
  },{passive:true});

  function step(){
    if(!running)return;
    dir=nextDir;
    const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
    if(head.x<0||head.y<0||head.x>=GRID||head.y>=GRID||snake.some(s=>s.x===head.x&&s.y===head.y))return end();
    snake.unshift(head);
    if(head.x===food.x&&head.y===food.y){score+=10;scoreEl.textContent=score;placeFood();if(speed>65)speed-=4;}
    else snake.pop();
    draw();
    tickT=setTimeout(step,speed);
  }

  function draw(){
    ctx.fillStyle='#0c2420';ctx.fillRect(0,0,cv.width,cv.height);
    // subtle grid
    ctx.strokeStyle='rgba(255,255,255,.03)';
    for(let i=1;i<GRID;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,cv.height);ctx.moveTo(0,i*CELL);ctx.lineTo(cv.width,i*CELL);ctx.stroke();}
    // food
    ctx.font=(CELL*0.9)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText('🍎',food.x*CELL+CELL/2,food.y*CELL+CELL/2+1);
    // snake
    snake.forEach((s,i)=>{
      const pad=i===0?1:2;
      ctx.fillStyle=i===0?'#9dd4d7':`hsl(180,35%,${48-Math.min(i*1.1,26)}%)`;
      roundRect(s.x*CELL+pad,s.y*CELL+pad,CELL-pad*2,CELL-pad*2,5);ctx.fill();
      if(i===0){ctx.fillStyle='#062018';const ex=dir.x,ey=dir.y;
        ctx.beginPath();ctx.arc(s.x*CELL+CELL/2+ex*4-3,s.y*CELL+CELL/2+ey*4-3,2,0,7);
        ctx.arc(s.x*CELL+CELL/2+ex*4+3,s.y*CELL+CELL/2+ey*4+3,2,0,7);ctx.fill();}
    });
  }
  function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

  function startGame(){reset();startScreen.classList.add('hidden');endScreen.classList.add('hidden');draw();clearTimeout(tickT);tickT=setTimeout(step,speed);}
  function end(){
    running=false;clearTimeout(tickT);
    if(score>best){best=score;localStorage.setItem('nibbleQuestBest',best);bestEl.textContent=best;}
    document.getElementById('bestStart').textContent='Best: '+best;
    document.getElementById('endEmoji').textContent=score>=best&&score>0?'🌟':'🍎';
    document.getElementById('endTitle').textContent=score>=200?'Mega Nibbler!':'Game Over';
    document.getElementById('endMsg').textContent='You scored '+score+'.'+(score>=best&&score>0?' New best! 🎉':' Best: '+best);
    endScreen.classList.remove('hidden');
  }
  document.getElementById('startBtn').addEventListener('click',startGame);
  document.getElementById('againBtn').addEventListener('click',startGame);
  // initial idle draw
  snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];dir={x:1,y:0};food={x:13,y:10};draw();
})();
</script>
</body>
</html>
