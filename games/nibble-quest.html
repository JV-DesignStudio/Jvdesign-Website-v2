<body>
<div class="topbar">
  <a class="back" href="/games">← All Games</a>
  <span class="brand">JVDesignStudio</span>
  <span style="display:flex;gap:8px;align-items:center"><button class="iconbtn" id="muteBtn" aria-label="Mute" style="background:rgba(0,0,0,.3);border:none;color:var(--beige);padding:8px 12px;border-radius:10px;cursor:pointer;font-size:1rem">🔊</button><button class="iconbtn" id="pauseBtn" aria-label="Pause" style="background:rgba(0,0,0,.3);border:none;color:var(--beige);padding:8px 12px;border-radius:10px;cursor:pointer;font-size:1rem">⏸</button></span>
</div>

<div class="wrap">
  <h1>🐍 Nibble Quest</h1>
  <div class="hud">
    <div class="stat"><div class="label">Score</div><div class="val" id="score">0</div></div>
    <div class="stat"><div class="label">Length</div><div class="val" id="len">3</div></div><div class="stat"><div class="label">Best</div><div class="val" id="best">0</div></div>
  </div>
  <div class="hud-row2"><span class="combo-pill" id="comboPill">x1 Combo</span><span class="power-pill" id="powerPill"></span></div>
  <div id="goldBar" style="height:4px;background:linear-gradient(90deg,#ffd23f,#ff8c00);border-radius:4px;width:0%;margin:6px auto 0;max-width:420px;transition:width .1s linear;display:none"></div><canvas id="board" width="420" height="420"></canvas>
  <div class="pad">
    <div class="sp"></div><button data-dir="up">▲</button><div class="sp"></div>
    <button data-dir="left">▲</button><div class="sp"></div><button data-dir="right">▲</button>
    <div class="sp"></div><button data-dir="down">▲</button><div class="sp"></div>
  </div>
</div>

<div class="overlay" id="startScreen">
  <div style="font-size:3.2rem">🐍🍎</div>
  <h2>Nibble Quest</h2>
  <p>Guide the snake to eat fruit and grow. Use <b>arrow keys / WASD</b>, <b>swipe</b>, or the on-screen pad. Don't hit the walls or yourself!</p>
  <button class="btn" id="startBtn">▶ Start Game</button>
  <p class="best" id="bestStart"></p>
</div>

<div class="overlay hidden" id="endScreen">
  <div style="font-size:3rem" id="endEmoji">🍎</div>
  <h2 id="endTitle">Game Over</h2>
  <p id="endMsg"></p>
  <div id="go-score" style="font-size:2rem;font-weight:800;margin:4px 0">0</div>
  <div id="go-medal" style="font-size:1.5rem"></div>
  <button class="btn teal" id="againBtn">↻ Play Again</button>
  <a class="back" href="/games" style="margin-top:4px">← Back to Games</a>
</div>

<script>
(function(){
  const cv=document.getElementById('board'),ctx=cv.getContext('2d');
  const GRID=20,CELL=cv.width/GRID;
  const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
  const startScreen=document.getElementById('startScreen'),endScreen=document.getElementById('endScreen');
  let snake,dir,nextDir,food,score,running,tickT,speed;
  let paused=false, pauseOverlay=null, goldInt=null;
  let golden=false,goldenTimer=null,apples=0;
  let powers={shield:false,slowmo:false,magnet:false};
  let powerTimer=null;
  let combo=0, comboTimer=0;
  let best=+(localStorage.getItem('nibbleQuestBest')||0);
  const fx=new AudioEffects(0.6);
  let muted=localStorage.getItem('nibbleMuted')==='1';
  function updateGoldBar(isGold){ const bar=document.getElementById('goldBar'); if(!bar) return; if(isGold){ bar.style.display='block'; bar.style.width='100%'; let pct=100; clearInterval(goldInt); goldInt=setInterval(()=>{ pct-=1.65; bar.style.width=Math.max(0,pct)+'%'; if(pct<=0){clearInterval(goldInt); bar.style.display='none';}},100); } else { // non-golden, hide bar if not golden
    if(!golden){ bar.style.display='none'; clearInterval(goldInt); }
  }}
  function setMuted(v){ muted=v; localStorage.setItem('nibbleMuted', v?'1':'0'); const b=document.getElementById('muteBtn'); if(b) b.textContent=v?'🔇':'🔊'; fx.setMuted&&fx.setMuted(v); }
  bestEl.textContent=best;document.getElementById('bestStart').textContent=best?('Best: '+best):'';

  let powerFood=null;
  function placeFood(){
    do{food={x:Math.floor(Math.random()*GRID),y:Math.floor(Math.random()*GRID)};}
    while(snake.some(s=>s.x===food.x&&s.y===food.y));
    apples++;
    clearTimeout(goldenTimer);
    golden=apples>1&&apples%5===0;           // every 5th apple is golden
    if(golden)goldenTimer=setTimeout(()=>{golden=false;},6000);  // grab it quickly!
  }
  function foodScreenPos(){
    const r=cv.getBoundingClientRect();
    return {x:r.left+(food.x+0.5)*r.width/GRID,y:r.top+(food.y+0.5)*r.height/GRID};
  }
  function togglePause(){ if(!running&&!paused) return; if(paused){ paused=false; running=true; if(pauseOverlay) pauseOverlay.style.display='none'; document.getElementById('pauseBtn').textContent='⏸'; tickT=setTimeout(step,speed); return; } if(!running) return; paused=true; running=false; clearTimeout(tickT); clearInterval(goldInt); document.getElementById('pauseBtn').textContent='▶'; if(!pauseOverlay){ pauseOverlay=document.createElement('div'); pauseOverlay.style.cssText='position:fixed;inset:0;background:rgba(5,18,15,.93);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:16px;z-index:60;text-align:center;padding:24px'; pauseOverlay.innerHTML='<div style="font-size:2rem">⏸ Paused</div><button id="resumeBtn" class="btn teal">▶ Resume</button>'; document.body.appendChild(pauseOverlay); pauseOverlay.querySelector('#resumeBtn').addEventListener('click', togglePause); } else pauseOverlay.style.display='flex'; }
  function reset(){
    snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];dir={x:1,y:0};nextDir={x:1,y:0};
    score=0;speed=140;running=true;combo=0;comboTimer=0;powers={shield:false,slowmo:false,magnet:false};powerFood=null;clearInterval(powerTimer);document.getElementById('comboPill').className='combo-pill';document.getElementById('powerPill').className='power-pill';
    if(typeof GameUI!=='undefined')GameUI.autoPause({pause:()=>{if(!running||paused)return false;running=false;clearTimeout(tickT);clearInterval(goldInt);return true;},resume:()=>{if(!running&&!paused){running=true;tickT=setTimeout(step,speed);}}});scoreEl.textContent=0;document.getElementById('len').textContent='3';apples=0;golden=false;clearInterval(goldInt);document.getElementById('goldBar').style.display='none';placeFood();
  }
  function setDir(nx,ny){
    if(!running)return;
    if(nx===-dir.x&&ny===-dir.y)return; // no reverse
    nextDir={x:nx,y:ny};
  }
  const keyMap={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0],KeyW:[0,-1],KeyS:[0,1],KeyA:[-1,0],KeyD:[1,0]};
  addEventListener('keydown',e=>{if(keyMap[e.code]){e.preventDefault();setDir(...keyMap[e.code]);}});
  document.querySelectorAll('.pad button').forEach(b=>{
    const m={up:[0,-1],down:[0,1],left:[-1,0],right:[1,0]}[b.dataset.dir];
    b.addEventListener('click',()=>setDir(...m));
  });
  let tsx,tsy;
  cv.addEventListener('touchstart',e=>{tsx=e.touches[0].clientX;tsy=e.touches[0].clientY;},{passive:true});
  cv.addEventListener('touchend',e=>{
    const dx=e.changedTouches[0].clientX-tsx,dy=e.changedTouches[0].clientY-tsy;
    if(Math.abs(dx)<20&&Math.abs(dy)<20)return;
    if(Math.abs(dx)>Math.abs(dy))setDir(dx>0?1:-1,0);else setDir(0,dy>0?1:-1);
  },{passive:true});

function activatePower(ptype){
    if(ptype==='shield'||ptype==='slowmo'||ptype==='magnet'){
      if(powerTimer)clearTimeout(powerTimer);
      powers={shield:false,slowmo:false,magnet:false};
      powers[ptype]=true;
      const pill=document.getElementById('powerPill');
      pill.textContent={shield:'\uD83D\uDEE1\uFE0F Shield',slowmo:'\uD83D\uDC0C Slow-Mo',magnet:'\uD83E\uDDF2 Magnet'}[ptype];
      pill.className='power-pill show '+ptype;
      powerTimer=setTimeout(()=>{powers[ptype]=false;pill.classList.remove('show');},8000);
    }
  }
  function step(){
    if(!running)return;
    if(powers.magnet && food){
      const dx=snake[0].x-food.x, dy=snake[0].y-food.y;
      const dist=Math.abs(dx)+Math.abs(dy);
      if(dist>1 && dist<6){
        if(Math.abs(dx)>Math.abs(dy)) food.x+=dx>0?1:-1;
        else food.y+=dy>0?1:-1;
        food.x=Math.max(0,Math.min(food.x,GRID-1));
        food.y=Math.max(0,Math.min(food.y,GRID-1));
      }
    }
    dir=nextDir;
    const head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};
    if(head.x<0||head.y<0||head.x>=GRID||head.y>=GRID||snake.some(s=>s.x===head.x&&s.y===head.y)){if(powers.shield){powers.shield=false;document.getElementById('powerPill').className='power-pill';return;}return end();}
    snake.unshift(head);
    if(powerFood && head.x===powerFood.x && head.y===powerFood.y){
      activatePower(powerFood.ptype);
      const pos=foodScreenPos();
      ParticleSystem.burst(pos.x,pos.y,'\u2728',6);
      fx.playPowerup();
      powerFood=null;
    }
    if(head.x===food.x&&head.y===food.y){
      const pos=foodScreenPos();
      if(golden){
        score+=Math.round(30*(powers.multiplier?2:1));speed=Math.max(55,speed-3.5);fx.playCombo(4); updateGoldBar(true);
        ParticleSystem.burst(pos.x,pos.y,'⭐',8);
      }else{
        score+=Math.round(10*(powers.multiplier?2:1));speed=Math.max(55,speed-1.5);fx.playSuccess(600+Math.min(snake.length*8,500)); updateGoldBar(false);
        ParticleSystem.burst(pos.x,pos.y,'✨',4);
      }
      combo++;comboTimer=2;const comboPill=document.getElementById('comboPill');if(combo>=3){comboPill.className='combo-pill show';comboPill.textContent='x'+combo+' Combo!';}scoreEl.textContent=score;document.getElementById('len').textContent=snake.length;placeFood();
    }
    else snake.pop();
    if(comboTimer>0){comboTimer-=speed/1000;if(comboTimer<=0){combo=0;document.getElementById('comboPill').className='combo-pill';}}
    if(powers.slowmo) speed=Math.max(speed,120);
    draw();
    tickT=setTimeout(step,speed);
  }

  function draw(){
    ctx.fillStyle='#0c2420';ctx.fillRect(0,0,cv.width,cv.height);
    // subtle grid
    ctx.strokeStyle='rgba(255,255,255,.03)';
    for(let i=1;i<GRID;i++){ctx.beginPath();ctx.moveTo(i*CELL,0);ctx.lineTo(i*CELL,cv.height);ctx.moveTo(0,i*CELL);ctx.lineTo(cv.width,i*CELL);ctx.stroke();}
    // food (golden apples pulse)
    ctx.font=(CELL*0.9)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
    if(golden){
      const pulse=0.75+0.25*Math.sin(performance.now()*0.012);
      ctx.save();ctx.globalAlpha=pulse;
      ctx.shadowColor='#ffd23f';ctx.shadowBlur=14;
      ctx.fillText('🌟',food.x*CELL+CELL/2,food.y*CELL+CELL/2+1);
      ctx.restore();
    }else{
      ctx.fillText('🍎',food.x*CELL+CELL/2,food.y*CELL+CELL/2+1);
    }
    if(powerFood){
      const pulse=0.7+0.3*Math.sin(performance.now()*0.008);
      ctx.save();ctx.globalAlpha=pulse;
      ctx.shadowColor='#00c878';ctx.shadowBlur=12;
      ctx.font=(CELL*0.85)+'px serif';ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText(powerFood.emoji,powerFood.x*CELL+CELL/2,powerFood.y*CELL+CELL/2+1);
      ctx.restore();
    }
    // snake
    snake.forEach((s,i)=>{
      const pad=i===0?1:2;
      ctx.fillStyle=i===0?'#9dd4d7':`hsl(180,35%,${48-Math.min(i*1.1,26)}%)`;
      roundRect(s.x*CELL+pad,s.y*CELL+pad,CELL-pad*2,CELL-pad*2,5);ctx.fill();
      if(i===0){ctx.fillStyle='#062018';const ex=dir.x,ey=dir.y;
        ctx.beginPath();ctx.arc(s.x*CELL+CELL/2+ex*4-3,s.y*CELL+CELL/2+ey*4-3,2,0,7);
        ctx.arc(s.x*CELL+CELL/2+ex*4+3,s.y*CELL+CELL/2+ey*4+3,2,0,7);ctx.fill();}
    });
  }
  function roundRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}

  function startGame(){ if(pauseOverlay) pauseOverlay.style.display='none'; paused=false; reset();startScreen.classList.add('hidden');endScreen.classList.add('hidden');draw();clearTimeout(tickT);tickT=setTimeout(step,speed);}
  function end(){
    clearInterval(goldInt); document.getElementById('goldBar').style.display='none';
    running=false;clearTimeout(tickT); paused=false;
    fx.playError();ScreenShake.shake(cv,9,280);
    window.__gsScore=(window.__gsScore||0)+score;
    window.__gsBestRun=Math.max(window.__gsBestRun||0,score);
    if(typeof gameSystem!=='undefined'){
      // Feed the shared save so the Arcade hub's best-scores list sees us
      // (the private nibbleQuestBest key alone is invisible to the hub).
      gameSystem.addScore(score);
      gameSystem.recordGamePlay(Date.now());
    }
    var isNewBest=score>best;
    if(isNewBest){best=score;localStorage.setItem('nibbleQuestBest',best);bestEl.textContent=best;}
    document.getElementById('bestStart').textContent='Best: '+best;
    document.getElementById('endEmoji').textContent=isNewBest&&score>0?'🌟':'🍎';
    document.getElementById('endTitle').textContent=score>=200?'Mega Nibbler!':'Game Over';
    document.getElementById('endMsg').textContent=(isNewBest&&score>0?'New best! 🎉':'Your best: '+best);
    GameUI.countUp(document.getElementById('go-score'), score);
    GameUI.showMedal(document.getElementById('go-medal'), score, [[5,'🐍','Snake Charmer'],[25,'🥈','Python Pro'],[100,'🏆','Serpent King']]);
    endScreen.classList.remove('hidden');
  }
  document.getElementById('startBtn').addEventListener('click',startGame);
  document.getElementById('pauseBtn').addEventListener('click', togglePause);
  document.getElementById('muteBtn').addEventListener('click', ()=> setMuted(!muted));
  setMuted(muted);
  document.getElementById('againBtn').addEventListener('click',startGame);
  // initial idle draw
  snake=[{x:9,y:10},{x:8,y:10},{x:7,y:10}];dir={x:1,y:0};food={x:13,y:10};draw();
})();
</script>

<script>
// ══ GAME SYSTEM INTEGRATION ══
const gameSystem = new GameSystem('nibble-quest', 'Nibble Quest', 'pip');
const soundManager = new SoundManager(gameSystem);

// Score → XP + score-tier achievements, handled reactively by the engine
// (replaces the two setInterval pollers this used to copy-paste).
gameSystem.trackScore({ xpDivisor: 5, tiers: [[1, 'firstNibble'], [30, 'score30'], [100, 'score100'], [200, 'score200']] });

window.addEventListener('beforeunload', () => {
  gameSystem.recordGamePlay(Date.now());
  gameSystem.saveState();
});
</script>
<script defer src="../cookie-consent.js"></script>
