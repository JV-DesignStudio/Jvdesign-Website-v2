<script>(function(){try{var t=localStorage.getItem('jvds-theme');if(t==='dark')document.documentElement.setAttribute('data-theme','dark');}catch(e){}})();</script><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Creature Rescue Clinic | JVDesignStudio</title>

    <meta name="twitter:image" content="https://jvdesignstudio.co.uk/og/hub-games.png"><link rel="manifest" href="../manifest.json"><meta name="theme-color" content="#2f6f5e"><meta name="description" content="Manage a creature clinic queue with urgency, symptoms, supplies and upgrades."><script src="../game-system.js"></script><link rel="stylesheet" href="../game-system.css"><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#2f6f5e;color:#fff}.wrap{max-width:1150px;margin:auto;padding:16px 12px 80px}.pill{color:#fff;background:#0005;border-radius:8px;padding:9px 12px;text-decoration:none;font-weight:900}.top{display:flex;gap:10px}.hero{border-bottom:3px solid #f2a541;margin:12px 0}.hero h1{font-size:clamp(2rem,7vw,4.2rem);margin:0}.hud,.game{display:grid;gap:10px}.hud{grid-template-columns:repeat(6,1fr)}.stat,.panel{background:#fffaf1;color:#17342d;border:1px solid #c9dacd;border-radius:8px;padding:10px}.game{grid-template-columns:1fr .85fr}.queue{display:grid;gap:8px}.patient{display:grid;grid-template-columns:auto 1fr auto;gap:8px;align-items:center;background:#fff;border:1px solid #c9dacd;border-radius:8px;padding:9px}.patient.active{outline:3px solid #4fb28655}.meter{height:8px;background:#dce8df;border-radius:99px;overflow:hidden}.meter i{display:block;height:100%;background:#bc4749}.treats,.upgrades,.goals{display:grid;gap:8px}.treats{grid-template-columns:repeat(2,1fr)}button{font:inherit;font-weight:900;cursor:pointer;border-radius:8px;min-height:42px}.treat,.upgrade{background:#fff;color:#17342d;border:1px solid #c9dacd;padding:9px;text-align:left}.primary{border:0;background:#2f6f5e;color:#fff;padding:9px}.secondary{border:1px solid #c9dacd;background:#fff;color:#17342d;padding:9px}.goal{display:grid;grid-template-columns:auto 1fr;gap:8px;background:#fff;border:1px solid #c9dacd;border-radius:8px;padding:8px;color:#60746b}.goal.done{background:#eef7df;color:#17342d}.log{max-height:220px;overflow:auto;color:#4f6258}.result{display:none;background:#eef7df;border-radius:8px;padding:10px}.result.show{display:block}@media(max-width:820px){.game{grid-template-columns:1fr}.hud{grid-template-columns:repeat(3,1fr)}}@media(max-width:520px){.hud,.treats{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><a class="pill" href="../arcade.html">Back to Arcade</a><a class="pill" href="../games">All games</a></div><section class="hero"><p>Triage management</p><h1>Creature Rescue Clinic</h1><p>Choose who to treat first. Urgency rises while patients wait, supplies are limited, and upgrades change the clinic flow.</p></section><section class="hud"><div class="stat"><b id="score"></b><span>Score</span></div><div class="stat"><b id="day"></b><span>Shift</span></div><div class="stat"><b id="sup"></b><span>Supplies</span></div><div class="stat"><b id="calm"></b><span>Calm</span></div><div class="stat"><b id="ok"></b><span>Treated</span></div><div class="stat"><b id="best"></b><span>Best</span></div></section><main class="game"><section class="panel"><h2>Waiting Room</h2><div class="queue" id="queue"></div><div class="actions"><button class="primary" id="tick">Call Next Minute</button><button class="secondary" id="restart">Restart</button></div></section><aside class="panel"><h2>Treatment Tray</h2><div class="treats" id="treats"></div><h2>Upgrades</h2><div class="upgrades" id="upgrades"></div><h2>Goals</h2><div class="goals" id="goals"></div><div class="result" id="result"></div><h2>Clinic Log</h2><div class="log" id="log"></div></aside></main></div><script>
const GAME_ID='creature-rescue-clinic',runKey='jvds_clinic_reset_run',metaKey='jvds_clinic_reset_meta',gs=new GameSystem(GAME_ID,'Creature Rescue Clinic','pip');
const pool=[['🐶','Moss Pup','warmth',35],['🐱','Cloud Kit','snack',28],['🐢','Pebble Turtle','bandage',18],['🐳','Pocket Whale','water',22],['🐰','Sprout Bunny','comfort',30],['🦋','Moon Moth','bandage',24]];const treats={bandage:['🩹',2],snack:['🥣',2],warmth:['🧣',3],water:['💧',3],comfort:['🧸',1]};const ups=[['desk','Fast Desk',12],['cup','Cupboard',16],['quiet','Quiet Mat',14]];const goals=[['triage','Treat urgent patient first',s=>s.triage],['six','Treat 6 patients',s=>s.done>=6],['calm','End with 50 calm',s=>s.ended&&s.calm>=50]];
let meta=read(metaKey,{best:0,goals:{}}),s=read(runKey,null)||fresh(),active=0;function fresh(){return{score:0,min:1,sup:12,calm:70,coins:0,done:0,queue:spawn(3),up:[],triage:false,ended:false,log:['The waiting room opens. Pick the most urgent creature before calm drops.']}}function spawn(n){return Array.from({length:n},()=>{const p=pool[Math.floor(Math.random()*pool.length)];return{e:p[0],n:p[1],need:p[2],urg:p[3]+Math.floor(Math.random()*18)}})}function read(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch(e){return f}}function save(){localStorage.setItem(runKey,JSON.stringify(s));localStorage.setItem(metaKey,JSON.stringify(meta))}function best(){try{return Math.max(meta.best,JSON.parse(localStorage.getItem('jvds_game_'+GAME_ID)||'{}').highScore||0)}catch(e){return meta.best}}function log(m){s.log.unshift(m);s.log=s.log.slice(0,10)}function scoreGoals(){goals.forEach(([id,,fn])=>{if(fn(s))meta.goals[id]=true})}
function minute(){if(s.ended)return;s.min++;s.queue.forEach(p=>p.urg+=s.up.includes('quiet')?4:7);s.calm=Math.max(0,s.calm-3);if(s.queue.length<4)s.queue=s.queue.concat(spawn(1));if(s.calm<=0||s.done>=8)finish();render()}function select(i){active=i;render()}function treat(id){if(s.ended||!s.queue[active])return;const cost=treats[id][1];if(s.sup<cost){log('Supplies too low.');return render()}const p=s.queue[active],urgent=Math.max(...s.queue.map(x=>x.urg))===p.urg;if(urgent)s.triage=true;s.sup-=cost;if(id===p.need){s.done++;s.coins+=8;s.calm=Math.min(100,s.calm+8);s.score+=220+Math.max(0,100-p.urg);log(p.n+' recovered with '+id+'.')}else{s.calm=Math.max(0,s.calm-12);s.score=Math.max(0,s.score-60);log(p.n+' needed different care.')}s.queue.splice(active,1);active=0;if(s.queue.length<3)s.queue=s.queue.concat(spawn(1));scoreGoals();render()}function buy(id){const u=ups.find(x=>x[0]===id);if(!u||s.up.includes(id)||s.coins<u[2])return;s.coins-=u[2];s.up.push(id);if(id==='cup')s.sup+=6;if(id==='desk')s.score+=120;log('Upgrade installed: '+u[1]);render()}function finish(){s.ended=true;scoreGoals();const final=s.score+s.done*250+s.calm*8+s.sup*35+Object.keys(meta.goals).length*160;meta.best=Math.max(meta.best,final);s.score=final;save();gs.addScore(final);gs.recordGamePlay(Date.now());try{gs.saveState({best:meta.best,done:s.done})}catch(e){}window.jvdsCheckNewBest&&window.jvdsCheckNewBest();log('Shift finished. Score '+final+' saved.')}function restart(){s=fresh();active=0;render()}
function render(){scoreGoals();document.getElementById('score').textContent=s.score;document.getElementById('day').textContent=s.ended?'Done':s.min;document.getElementById('sup').textContent=s.sup;document.getElementById('calm').textContent=s.calm+'%';document.getElementById('ok').textContent=s.done;document.getElementById('best').textContent=best();document.getElementById('queue').innerHTML=s.queue.map((p,i)=>'<button class="patient '+(i===active?'active':'')+'" data-p="'+i+'"><b>'+p.e+'</b><span>'+p.n+'<br><small>Needs clues: '+(p.need==='warmth'?'shivers':p.need==='snack'?'hungry':p.need==='water'?'dry':p.need==='comfort'?'nervous':'scrape')+'</small><div class="meter"><i style="width:'+p.urg+'%"></i></div></span><strong>'+p.urg+'</strong></button>').join('');document.getElementById('treats').innerHTML=Object.entries(treats).map(([id,t])=>'<button class="treat" data-t="'+id+'">'+t[0]+' '+id+'<br><small>'+t[1]+' supplies</small></button>').join('');document.getElementById('upgrades').innerHTML=ups.map(u=>'<button class="upgrade" data-u="'+u[0]+'" '+(s.up.includes(u[0])?'disabled':'')+'>'+u[1]+'<br><small>'+u[2]+' coins</small></button>').join('');document.getElementById('goals').innerHTML=goals.map(([id,t])=>'<div class="goal '+(meta.goals[id]?'done':'')+'"><b>'+(meta.goals[id]?'✓':'○')+'</b><span>'+t+'</span></div>').join('');document.getElementById('log').innerHTML=s.log.map(x=>'<p>'+x+'</p>').join('');document.getElementById('result').className='result'+(s.ended?' show':'');document.getElementById('result').textContent=s.ended?'Final score '+s.score+' - best '+meta.best:'';save()}document.body.onclick=e=>{let b=e.target.closest('[data-p]');if(b)select(+b.dataset.p);b=e.target.closest('[data-t]');if(b)treat(b.dataset.t);b=e.target.closest('[data-u]');if(b)buy(b.dataset.u)};document.getElementById('tick').onclick=minute;document.getElementById('restart').onclick=restart;render();
</script><script src="../cookie-consent.js" defer></script></body></html>
