<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#1a472a;color:#e2e8f0;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;height:100dvh}
.game-wrap{display:flex;flex-direction:column;height:100dvh;max-width:600px;margin:0 auto;position:relative}
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 16px;background:rgba(0,0,0,.5);z-index:10}
.top-bar a{color:#94a3b8;text-decoration:none;font-size:14px}
.top-bar .title{font-weight:800;font-size:16px;color:#4ade80}
.hud{display:flex;justify-content:space-around;padding:6px 12px;background:rgba(0,0,0,.35);font-size:13px;z-index:10}
.hud div{text-align:center}
.hud b{display:block;font-size:18px;color:#86efac}
canvas{flex:1;width:100%;min-height:0;min-width:0;display:block;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.72);z-index:20;gap:16px;padding:24px;text-align:center}
.overlay h1,.overlay #endTitle{font-size:32px;color:#4ade80}
.overlay p{color:#94a3b8;max-width:340px;line-height:1.5}
.overlay .stats{display:flex;gap:24px;margin:12px 0}
.overlay .stats div{text-align:center}
.overlay .stats b{display:block;font-size:22px;color:#86efac}
.overlay .stats small{color:#94a3b8;font-size:12px}
.btn{background:#16a34a;color:#fff;border:none;padding:12px 32px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer}
.btn:hover{background:#22c55e}
.btn-ghost{background:transparent;border:2px solid #475569;color:#94a3b8;padding:10px 24px;border-radius:12px;font-size:14px;cursor:pointer}
.hidden{display:none}
.toast{position:absolute;top:35%;left:50%;transform:translate(-50%,-50%);background:rgba(34,197,94,.9);color:#fff;padding:8px 20px;border-radius:8px;font-weight:700;font-size:18px;z-index:15;opacity:0;transition:opacity .15s;pointer-events:none}
.toast.show{opacity:1}
.dpad{position:absolute;bottom:16px;left:50%;transform:translateX(-50%);display:grid;grid-template:auto auto auto / auto auto auto;gap:4px;z-index:12}
.dpad button{background:rgba(22,163,74,.45);border:2px solid rgba(34,197,94,.6);color:#bbf7d0;width:56px;height:48px;border-radius:10px;font-size:20px;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;user-select:none}
.dpad button:active{background:rgba(34,197,94,.7)}
.dpad .empty{visibility:hidden}
/* Story HUD lives inside the game shell so it never pushes the board off-screen. */
.game-wrap .storyrun{width:100%;margin:0;padding:6px 10px 0}
.game-wrap .storyrun .sr-story{margin-top:6px;padding:6px 10px}
.game-wrap .storyrun .sr-open,
.game-wrap .storyrun .sr-objective{display:none}
/* Game-over modal must sit above the fullscreen game shell (game-shell.js uses z-index 99990). */
.storyrun.sr-modal{z-index:100050}
</style>
</head>
<body>
<div class="game-wrap" data-jvds-root data-storyrun-host>
  <div class="top-bar">
    <a href="../arcade.html">&larr; Arcade</a>
    <span class="title">Crossy Crew</span>
    <button class="btn-ghost" id="soundBtn" style="padding:4px 10px;font-size:13px">🔊</button>
  </div>
  <div class="hud">
    <div><small>Score</small><b id="scoreHud">0</b></div>
    <div><small>Hops</small><b id="hopsHud">0</b></div>
    <div><small>Coins</small><b id="coinsHud">0</b></div>
    <div><small>Goal</small><b id="goalHud">10</b></div>
    <div><small>Best</small><b id="bestHud">0</b></div>
  </div>
  <canvas id="game"></canvas>
  <div class="toast" id="toast"></div>

  <div class="dpad" id="dpad" style="display:none">
    <button class="empty"></button>
    <button id="dUp">▲</button>
    <button class="empty"></button>
    <button id="dLeft">◀</button>
    <button class="empty"></button>
    <button id="dRight">▶</button>
    <button class="empty"></button>
    <button id="dDown">▼</button>
    <button class="empty"></button>
  </div>

  <div class="overlay" id="startScreen">
    <h1>🐸 Crossy Crew</h1>
    <p>Pip and Echo need to cross busy roads, railways and rushing rivers. Hop forward, dodge traffic and trains, ride the logs, and see how far you can go.</p>
    <p style="font-size:13px;color:#64748b">Tap/Swipe or Arrow keys to hop. Tap the canvas to start.</p>
    <button class="btn" id="playBtn">Start Hopping</button>
    <button class="btn-ghost" data-go="../arcade.html">Back to Games</button>
  </div>

  <div class="overlay hidden" id="endScreen">
    <h2 id="endTitle">Squished!</h2>
    <div class="stats" id="endStats"></div>
    <button class="btn" id="againBtn">Hop Again</button>
    <button class="btn-ghost" data-go="../arcade.html">Back to Games</button>
  </div>
</div>

<script src="../story-run.js"></script>
<script src="../game-showcase.js"></script>
<script src="../assets/js/inline/games-crossy-crew-1.js"></script>
<script defer src="../cookie-consent.js"></script>
<script defer src="../mascots.js"></script>
<script defer src="../game-shell.js"></script>
</body>
</html>
