<style>
  :root {
    --cream:        #FBF4E8;
    --cream-deep:  #F5E9D3;
    --milk:        #FFFDF8;
    --rose:        #F4B6C2;
    --rose-deep:   #E48BA0;
    --mint:        #B8DDC8;
    --mint-deep:   #6FB89A;
    --cocoa:       #4A3528;
    --cocoa-soft:  #6B4F3E;
    --sun:         #F5C76A;
    --lavender:    #C9B8E0;

    --scene-morning:   linear-gradient(180deg, #FFE8D6 0%, #F5C76A 50%, #E8B894 100%);
    --scene-afternoon: linear-gradient(180deg, #F5E0D8 0%, #F4B6C2 50%, #E8C4A8 100%);
    --scene-evening:   linear-gradient(180deg, #C9B8E0 0%, #E48BA0 50%, #6B4F3E 100%);

    --shadow-soft:   0 4px 16px rgba(74, 53, 40, 0.08);
    --shadow-card:   0 8px 28px rgba(74, 53, 40, 0.14);
    --shadow-tile:   0 3px 8px rgba(74, 53, 40, 0.18);

    --safe-top:    env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    font-family: 'Nunito', system-ui, sans-serif;
    color: var(--cocoa);
    background: var(--cream);
    -webkit-user-select: none;
    user-select: none;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(244, 182, 194, 0.10) 0%, transparent 45%),
      radial-gradient(circle at 80% 70%, rgba(184, 221, 200, 0.10) 0%, transparent 45%);
    touch-action: manipulation;
  }

  .app {
    height: 100vh;
    height: 100dvh;
    max-width: 540px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding: calc(var(--safe-top) + 8px) 12px calc(var(--safe-bottom) + 8px);
    position: relative;
  }

  /* TOP BAR */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 4px 10px;
    flex-shrink: 0;
  }
  .brand {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: 22px;
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .brand em { font-style: italic; font-weight: 400; color: var(--rose-deep); }
  .topbar-stats { display: flex; gap: 6px; }
  .stat-pill {
    background: var(--milk);
    border: 2px solid var(--cream-deep);
    padding: 5px 11px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 4px;
    box-shadow: var(--shadow-soft);
  }

  /* GUEST HUD */
  .guest-hud {
    background: var(--milk);
    border: 2px dashed var(--cream-deep);
    border-radius: 18px;
    padding: 12px 14px;
    margin-bottom: 10px;
    box-shadow: var(--shadow-soft);
    flex-shrink: 0;
  }
  .guest-row { display: flex; align-items: center; gap: 12px; }
  .guest-avatar {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--cream-deep);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    flex-shrink: 0;
    border: 3px solid var(--rose);
    transition: border-color 0.4s ease;
    position: relative;
  }
  .guest-avatar.happy { animation: bounce 0.6s ease; border-color: var(--mint-deep); }
  .guest-avatar.sad   { animation: shake 0.4s ease; }
  .guest-avatar.flash { animation: avatarFlash 0.6s ease; }
  @keyframes avatarFlash {
    0%, 100% { box-shadow: 0 0 0 0 rgba(228, 139, 160, 0); }
    50% { box-shadow: 0 0 0 8px rgba(228, 139, 160, 0.5); }
  }
  .guest-hat {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 20px;
    pointer-events: none;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    30%      { transform: translateY(-8px) scale(1.1); }
    60%      { transform: translateY(0) scale(1); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25%      { transform: translateX(-4px) rotate(-3deg); }
    75%      { transform: translateX(4px) rotate(3deg); }
  }
  .guest-info { flex: 1; min-width: 0; }
  .guest-name { font-family: 'Fraunces', serif; font-weight: 700; font-size: 15px; line-height: 1.1; }
  .guest-craving { font-size: 12px; color: var(--cocoa-soft); margin-top: 2px; }
  .guest-craving strong { color: var(--cocoa); }
  .craving-bar {
    margin-top: 6px;
    height: 7px;
    background: var(--cream-deep);
    border-radius: 100px;
    overflow: hidden;
  }
  .craving-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--rose), var(--sun));
    border-radius: 100px;
    width: 0%;
    transition: width 0.4s ease;
  }
  .craving-icon {
    width: 52px;
    height: 52px;
    border-radius: 14px;
    background: var(--cream);
    border: 2px dashed var(--rose);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    animation: pulse 2.5s ease-in-out infinite;
  }
  .craving-icon svg { width: 70%; height: 70%; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.06); }
  }
  .order-board {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--cream-deep);
    align-items: center;
    font-size: 11px;
    color: var(--cocoa-soft);
  }
  .order-label { font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
  .order-queue { display: flex; gap: 6px; flex: 1; }
  .order-chip {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--cream);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    border: 2px solid var(--cream-deep);
  }
  .streak-badge {
    background: var(--sun);
    color: var(--cocoa);
    padding: 3px 9px;
    border-radius: 100px;
    font-weight: 800;
    font-size: 11px;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .streak-badge.active { opacity: 1; }

  /* BOARD */
  .board-wrap {
    flex: 1;
    position: relative;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: var(--shadow-card);
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cafe-scene {
    position: absolute;
    inset: 0;
    background: var(--scene-afternoon);
    z-index: 0;
    transition: background 1.5s ease;
  }
  .cafe-scene.morning   { background: var(--scene-morning); }
  .cafe-scene.afternoon { background: var(--scene-afternoon); }
  .cafe-scene.evening   { background: var(--scene-evening); }
  .cafe-scene svg { width: 100%; height: 100%; display: block; }
  .sparkle-layer { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
  .board {
    position: relative;
    z-index: 2;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 3px;
    padding: 10px;
    background: rgba(251, 244, 232, 0.85);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius: 18px;
    width: min(96%, 96vw);
    max-width: 480px;
    aspect-ratio: 1;
    touch-action: none;
  }
  .tile {
    position: relative;
    background: var(--milk);
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-tile);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    aspect-ratio: 1;
  }
  .tile:hover { transform: translateY(-1px); }
  .tile.selected {
    transform: scale(1.08);
    box-shadow: 0 0 0 3px var(--rose-deep), var(--shadow-tile);
    z-index: 3;
  }
  .tile.matching { animation: pop 0.4s ease forwards; }
  .tile.falling { animation: fall 0.35s ease; }
  @keyframes pop {
    0%   { transform: scale(1); opacity: 1; }
    50%  { transform: scale(1.25) rotate(8deg); }
    100% { transform: scale(0); opacity: 0; }
  }
  @keyframes fall {
    0%   { transform: translateY(-30px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
  }
  .tile svg { width: 72%; height: 72%; pointer-events: none; }
  .tile * { pointer-events: none; }

  /* Subtle breathing on idle tile SVGs (not the tile itself — that would
     conflict with the pop animation when matching). */
  @keyframes breathe {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }
  .tile:not(.matching):not(.selected) > svg {
    animation: breathe 4s ease-in-out infinite;
  }
  .tile:nth-child(3n) > svg { animation-delay: 0.5s; }
  .tile:nth-child(5n) > svg { animation-delay: 1.2s; }
  .tile:nth-child(7n) > svg { animation-delay: 1.9s; }

  /* Floating petals */
  .petal {
    position: absolute;
    font-size: 14px;
    pointer-events: none;
    opacity: 0;
    z-index: 4;
  }
  @keyframes petalDrift {
    0%   { transform: translate(0, 0) rotate(0deg); opacity: 0; }
    10%  { opacity: 0.7; }
    90%  { opacity: 0.7; }
    100% { transform: translate(var(--drift-x, 60px), 110%) rotate(360deg); opacity: 0; }
  }

  /* Rain on the window */
  .rain-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    opacity: 0;
    transition: opacity 2s ease;
  }
  .rain-layer.active { opacity: 1; }
  .raindrop {
    position: absolute;
    width: 1.5px;
    background: linear-gradient(180deg, transparent, rgba(200, 220, 240, 0.6));
    border-radius: 100px;
    animation: raindrop linear infinite;
  }
  @keyframes raindrop {
    0%   { transform: translateY(-20px); }
    100% { transform: translateY(120%); }
  }

  /* Walking cat */
  .cat {
    position: absolute;
    bottom: 12%;
    left: 0;
    font-size: 28px;
    z-index: 3;
    pointer-events: none;
    opacity: 0;
    transform: translateX(-60px);
    will-change: transform;
  }
  @keyframes catWalkRight {
    0%   { transform: translateX(-60px) translateY(0); opacity: 0; }
    5%   { opacity: 1; }
    20%  { transform: translateX(20vw) translateY(0); }
    22%  { transform: translateX(22vw) translateY(-3px); }
    24%  { transform: translateX(24vw) translateY(0); }
    50%  { transform: translateX(50vw) translateY(0); }
    52%  { transform: translateX(52vw) translateY(-3px); }
    54%  { transform: translateX(54vw) translateY(0); }
    95%  { opacity: 1; }
    100% { transform: translateX(calc(100vw + 60px)) translateY(0); opacity: 0; }
  }
  @keyframes catWalkLeft {
    0%   { transform: translateX(calc(100vw + 60px)) scaleX(-1); opacity: 0; }
    5%   { opacity: 1; }
    50%  { transform: translateX(50vw) scaleX(-1) translateY(0); }
    52%  { transform: translateX(50vw) scaleX(-1) translateY(-3px); }
    54%  { transform: translateX(50vw) scaleX(-1) translateY(0); }
    95%  { opacity: 1; }
    100% { transform: translateX(-60px) scaleX(-1); opacity: 0; }
  }
  .cat.active-right { animation: catWalkRight 14s linear; }
  .cat.active-left  { animation: catWalkLeft 14s linear; }

  .tile.striped-h::before, .tile.striped-v::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(90deg, transparent 0, transparent 4px, rgba(255,255,255,0.55) 4px, rgba(255,255,255,0.55) 6px);
    border-radius: 10px;
    pointer-events: none;
  }
  .tile.striped-v::before {
    background: repeating-linear-gradient(0deg, transparent 0, transparent 4px, rgba(255,255,255,0.55) 4px, rgba(255,255,255,0.55) 6px);
  }
  .tile.bomb::after {
    content: '✦';
    position: absolute;
    font-size: 22px;
    color: white;
    text-shadow: 0 0 4px rgba(0,0,0,0.4);
    pointer-events: none;
  }
  .tile.rainbow {
    background: conic-gradient(from 0deg, #F4B6C2, #F5C76A, #B8DDC8, #C9B8E0, #F4B6C2);
  }

  /* BOTTOM BAR */
  .bottombar {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    flex-shrink: 0;
  }
  .bb-btn {
    flex: 1;
    background: var(--milk);
    border: 2px solid var(--cream-deep);
    color: var(--cocoa);
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 11px;
    padding: 10px 6px;
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    box-shadow: var(--shadow-soft);
  }
  .bb-btn:active { transform: scale(0.96); }
  .bb-btn.active { background: var(--cocoa); color: var(--cream); border-color: var(--cocoa); }
  .bb-btn.cant-afford { opacity: 0.45; }
  .bb-icon { font-size: 18px; line-height: 1; }

  /* TOAST */
  .toast {
    position: fixed;
    top: calc(var(--safe-top) + 16px);
    left: 50%;
    transform: translateX(-50%) translateY(-120px);
    background: var(--cocoa);
    color: var(--cream);
    padding: 12px 22px;
    border-radius: 100px;
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 14px;
    box-shadow: var(--shadow-card);
    transition: transform 0.4s ease;
    z-index: 100;
    pointer-events: none;
    max-width: 88vw;
    text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.achievement { background: var(--sun); color: var(--cocoa); }
  .toast.combo { background: var(--rose-deep); color: var(--cream); }

  /* MODAL */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(74, 53, 40, 0.5);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 20px;
  }
  .modal-backdrop.show { display: flex; }
  .modal {
    background: var(--cream);
    border-radius: 24px;
    padding: 24px 22px;
    max-width: 420px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    overscroll-behavior: contain;
    box-shadow: var(--shadow-card);
    border: 2px dashed var(--cream-deep);
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .modal-title { font-family: 'Fraunces', serif; font-size: 24px; font-weight: 900; }
  .modal-title em { font-style: italic; color: var(--rose-deep); font-weight: 400; }
  .modal-close {
    background: var(--milk);
    border: 2px solid var(--cream-deep);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .achievement-list, .shop-list { display: flex; flex-direction: column; gap: 10px; }
  .ach-item, .shop-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: var(--milk);
    border-radius: 14px;
    border: 2px solid var(--cream-deep);
  }
  .ach-item.locked { opacity: 0.5; }
  .ach-item.unlocked { border-color: var(--mint-deep); }
  .ach-item.secret, .shop-item.secret {
    border-style: dashed;
    border-color: var(--lavender);
    background: linear-gradient(135deg, var(--milk), #F0E8F5);
  }
  .ach-item.secret .ach-name, .shop-item.secret .ach-name {
    font-style: italic;
    color: var(--lavender);
  }
  .shop-item.locked-item .ach-name {
    color: var(--cocoa-soft);
  }
  .shop-item.locked-item .shop-icon {
    background: var(--cream-deep);
    opacity: 0.6;
  }
  .ach-icon, .shop-icon {
    font-size: 28px;
    width: 44px;
    height: 44px;
    background: var(--cream);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .ach-text { flex: 1; min-width: 0; }
  .ach-name { font-family: 'Fraunces', serif; font-weight: 700; font-size: 15px; }
  .ach-desc { font-size: 12px; color: var(--cocoa-soft); }
  .shop-buy {
    background: var(--cocoa);
    color: var(--cream);
    border: none;
    padding: 8px 14px;
    border-radius: 100px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 12px;
    cursor: pointer;
  }
  .shop-buy:disabled { background: var(--cream-deep); color: var(--cocoa-soft); cursor: not-allowed; }
  .shop-buy.owned { background: var(--mint-deep); }
  .shop-buy.equipped { background: var(--rose-deep); }

  /* Tutorial */
  .tutorial-modal { max-width: 360px; text-align: center; }
  .tutorial-page h3 {
    font-family: 'Fraunces', serif;
    font-size: 22px;
    font-weight: 900;
    margin-bottom: 10px;
  }
  .tutorial-page h3 em { font-style: italic; color: var(--rose-deep); font-weight: 400; }
  .tutorial-page p {
    font-size: 14px;
    color: var(--cocoa-soft);
    line-height: 1.7;
    margin-bottom: 10px;
  }
  .tutorial-page .tut-icon {
    font-size: 48px;
    margin-bottom: 12px;
    display: block;
  }
  .tutorial-page .tut-step {
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: var(--rose-deep);
    margin-bottom: 8px;
  }

  /* Keyboard cursor */
  .tile.kb-cursor {
    box-shadow: 0 0 0 3px var(--sun), 0 0 0 5px rgba(245, 199, 106, 0.4), var(--shadow-tile) !important;
    z-index: 4;
  }

  /* Seasonal tint overlay */
  .seasonal-tint {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
    opacity: 0.12;
    mix-blend-mode: overlay;
    transition: background 1s ease;
  }
  .seasonal-tint.spring { background: linear-gradient(180deg, #FFB7C5, #C8E6C9); }
  .seasonal-tint.summer { background: linear-gradient(180deg, #B3E5FC, #FFF9C4); }
  .seasonal-tint.autumn { background: linear-gradient(180deg, #FFAB91, #FFE0B2); }
  .seasonal-tint.winter { background: linear-gradient(180deg, #B3E5FC, #E1BEE7); }

  /* Tappable avatar */
  .guest-avatar { cursor: pointer; }

  /* Shop tabs */
  .shop-tabs {
    display: flex;
    gap: 4px;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 2px dashed var(--cream-deep);
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .shop-tab {
    background: var(--milk);
    border: 2px solid var(--cream-deep);
    padding: 8px 6px;
    border-radius: 12px;
    cursor: pointer;
    font-family: 'Nunito', sans-serif;
    font-size: 10px;
    font-weight: 700;
    color: var(--cocoa-soft);

<script>
// ============================================================
// AUDIO ENGINE — procedural Web Audio for music + SFX
// ============================================================
const Audio = (() => {
  let ctx = null;
  let masterGain = null;
  let musicGain = null;
  let sfxGain = null;
  let musicPlaying = false;
  let musicNodes = [];
  let musicTimer = null;
  let fileMusic = null;     // <audio> element if galaxy.mp3 loads
  let fileMusicReady = false;

  function init() {
    if (ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    ctx = new AC();
    masterGain = ctx.createGain();
    masterGain.gain.value = 0.6;
    masterGain.connect(ctx.destination);

    musicGain = ctx.createGain();
    musicGain.gain.value = 0.0;
    musicGain.connect(masterGain);

    sfxGain = ctx.createGain();
    sfxGain.gain.value = 0.5;
    sfxGain.connect(masterGain);

    // Try to load galaxy.mp3 from the same folder. If it works, we use it
    // instead of procedural music. If not, procedural is the fallback.
    fileMusic = new window.Audio('galaxy.mp3');
    fileMusic.loop = true;
    fileMusic.volume = 0.5;
    fileMusic.addEventListener('canplaythrough', () => { fileMusicReady = true; }, { once: true });
    fileMusic.addEventListener('error', () => { fileMusic = null; });
  }

  // ----- SOUND EFFECTS -----
  function playTone({ freq = 440, duration = 0.15, type = 'sine', volume = 0.3, attack = 0.01, decay = 0.1 }) {
    if (!ctx) return;
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, ctx.currentTime);
    gain.gain.setValueAtTime(0, ctx.currentTime);
    gain.gain.linearRampToValueAtTime(volume, ctx.currentTime + attack);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
    osc.connect(gain);
    gain.connect(sfxGain);
    osc.start();
    osc.stop(ctx.currentTime + duration + 0.05);
  }

  function playNoise({ duration = 0.2, volume = 0.3, filterFreq = 2000 }) {
    if (!ctx) return;
    const bufferSize = ctx.sampleRate * duration;
    const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < bufferSize; i++) {
      data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
    }
    const src = ctx.createBufferSource();
    src.buffer = buffer;
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = filterFreq;
    const gain = ctx.createGain();
    gain.gain.value = volume;
    src.connect(filter);
    filter.connect(gain);
    gain.connect(sfxGain);
    src.start();
  }

  function sfxMatch() {
    if (!ctx) return;
    playTone({ freq: 600, duration: 0.12, type: 'sine', volume: 0.18, attack: 0.005 });
    playTone({ freq: 900, duration: 0.10, type: 'triangle', volume: 0.12, attack: 0.005 });
  }

  function sfxCombo(level) {
    if (!ctx) return;
    // Pentatonic ascending notes
    const notes = [523, 587, 659, 784, 880, 987, 1175, 1318];
    const note = notes[Math.min(level - 1, notes.length - 1)];
    playTone({ freq: note, duration: 0.25, type: 'sine', volume: 0.22, attack: 0.005, decay: 0.2 });
    playTone({ freq: note * 1.5, duration: 0.25, type: 'triangle', volume: 0.14, attack: 0.005 });
  }

  function sfxBomb() {
    if (!ctx) return;
    playNoise({ duration: 0.35, volume: 0.35, filterFreq: 600 });
    playTone({ freq: 80, duration: 0.3, type: 'sine', volume: 0.4, attack: 0.005 });
  }

  function sfxRainbow() {
    if (!ctx) return;
    // Whoosh + ascending arpeggio
    playNoise({ duration: 0.5, volume: 0.2, filterFreq: 4000 });
    const notes = [523, 659, 784, 987, 1175, 1318];
    notes.forEach((n, i) => {
      setTimeout(() => playTone({ freq: n, duration: 0.18, type: 'triangle', volume: 0.18 }), i * 60);
    });
  }

  function sfxStriped() {
    if (!ctx) return;
    playNoise({ duration: 0.25, volume: 0.18, filterFreq: 3000 });
    playTone({ freq: 1200, duration: 0.15, type: 'sawtooth', volume: 0.1 });
  }

  function sfxGuestHappy() {
    if (!ctx) return;
    // Soft bell — major triad
    [523, 659, 784].forEach((n, i) => {
      setTimeout(() => playTone({ freq: n, duration: 0.6, type: 'sine', volume: 0.2, attack: 0.01, decay: 0.5 }), i * 80);
    });
  }

  function sfxBadSwap() {
    if (!ctx) return;
    playTone({ freq: 200, duration: 0.1, type: 'square', volume: 0.08 });
  }

  function sfxAchievement() {
    if (!ctx) return;
    [659, 784, 987, 1175].forEach((n, i) => {
      setTimeout(() => playTone({ freq: n, duration: 0.3, type: 'triangle', volume: 0.22 }), i * 90);
    });
  }

  // ----- LOFI MUSIC LOOP -----
  // A gentle 4-chord progression with soft pad + sparse arpeggio
  // Built procedurally so it works with no external files.
  function startMusic() {
    if (!ctx || musicPlaying) return;
    musicPlaying = true;

    // Prefer the real file if it loaded
    if (fileMusic && fileMusicReady) {
      fileMusic.play().catch(() => {
        // If file playback fails, fall through to procedural
        startProceduralMusic();
      });
      return;
    }
    // If file is still loading, give it a brief chance
    if (fileMusic && !fileMusicReady) {
      fileMusic.play().catch(() => startProceduralMusic());
      return;
    }
    startProceduralMusic();
  }

  function startProceduralMusic() {
    if (!musicPlaying) return;
    musicGain.gain.cancelScheduledValues(ctx.currentTime);
    musicGain.gain.setValueAtTime(musicGain.gain.value, ctx.currentTime);
    musicGain.gain.linearRampToValueAtTime(0.35, ctx.currentTime + 1.5);

    const progressions = [
      [261.63, 329.63, 392.00, 493.88], // Cmaj7
      [220.00, 261.63, 329.63, 392.00], // Am7
      [174.61, 220.00, 261.63, 329.63], // Fmaj7
      [196.00, 246.94, 293.66, 349.23]  // G7
    ];

    let chordIdx = 0;
    const beatLen = 2.4;

    function playChord() {
      if (!musicPlaying) return;
      const chord = progressions[chordIdx];
      const startT = ctx.currentTime;

      chord.forEach(freq => {
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        const filter = ctx.createBiquadFilter();
        osc.type = 'sine';
        osc.frequency.value = freq;
        filter.type = 'lowpass';
        filter.frequency.value = 1500;
        gain.gain.setValueAtTime(0, startT);
        gain.gain.linearRampToValueAtTime(0.06, startT + 0.4);
        gain.gain.linearRampToValueAtTime(0.04, startT + beatLen - 0.3);
        gain.gain.linearRampToValueAtTime(0, startT + beatLen);
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(musicGain);
        osc.start(startT);
        osc.stop(startT + beatLen + 0.1);
      });

      chord.forEach((freq, i) => {
        const t = startT + i * (beatLen / 8) + Math.random() * 0.05;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.value = freq * 2;
        gain.gain.setValueAtTime(0, t);
        gain.gain.linearRampToValueAtTime(0.04, t + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
        osc.connect(gain);
        gain.connect(musicGain);
        osc.start(t);
        osc.stop(t + 0.6);
      });

      if (chordIdx % 2 === 0) {
        const kick = ctx.createOscillator();
        const kickGain = ctx.createGain();
        kick.frequency.setValueAtTime(80, startT);
        kick.frequency.exponentialRampToValueAtTime(40, startT + 0.1);
        kickGain.gain.setValueAtTime(0.15, startT);
        kickGain.gain.exponentialRampToValueAtTime(0.001, startT + 0.15);
        kick.connect(kickGain);
        kickGain.connect(musicGain);
        kick.start(startT);
        kick.stop(startT + 0.2);
      }

      chordIdx = (chordIdx + 1) % progressions.length;
      musicTimer = setTimeout(playChord, beatLen * 1000);
    }

    playChord();
  }

  function stopMusic() {
    if (!ctx || !musicPlaying) return;
    musicPlaying = false;
    if (fileMusic && !fileMusic.paused) {
      fileMusic.pause();
      fileMusic.currentTime = 0;
    }
    musicGain.gain.cancelScheduledValues(ctx.currentTime);
    musicGain.gain.setValueAtTime(musicGain.gain.value, ctx.currentTime);
    musicGain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.8);
    if (musicTimer) clearTimeout(musicTimer);
  }

  function isMusicPlaying() { return musicPlaying; }

  return {
    init,
    sfxMatch, sfxCombo, sfxBomb, sfxRainbow, sfxStriped,
    sfxGuestHappy, sfxBadSwap, sfxAchievement,
    startMusic, stopMusic, isMusicPlaying
  };
})();

const VAULT_KEY = 'jvds_player_vault';
const VAULT_SCHEMA = 3;

function defaultVault() {
  return {
    schema: VAULT_SCHEMA,
    coins: 0,
    happiness: 0,
    haptic: true,
    unlocked_items: ['cafe_default', 'trail_petal', 'skin_default'],
    equipped: { background: 'cafe_default', trail: 'trail_petal', skin: 'skin_default' },
    achievements: [],
    stats: {
      matches: 0,
      guests_served: 0,
      max_combo: 0,
      max_streak: 0,
      lifetime_coins: 0,
      powerups_made: 0,
      rainbows_made: 0,
      guests_each: {}
    }
  };
}

function loadVault() {
  try {
    const raw = localStorage.getItem(VAULT_KEY);
    if (!raw) return defaultVault();
    const v = JSON.parse(raw);
    if (!v.schema || v.schema < VAULT_SCHEMA) {
      const fresh = defaultVault();
      fresh.coins = v.coins || 0;
      fresh.happiness = v.happiness || 0;
      // Preserve old hat purchases, add starter items
      const oldItems = v.unlocked_items || [];
      fresh.unlocked_items = [...new Set([...fresh.unlocked_items, ...oldItems])];
      // Preserve old equipped hat if any
      if (v.equipped && v.equipped.hat) fresh.equipped.hat = v.equipped.hat;
      if (v.stats) fresh.stats = { ...fresh.stats, ...v.stats };
      if (v.achievements) fresh.achievements = v.achievements;
      return fresh;
    }
    if (typeof v.haptic === 'undefined') v.haptic = true;
    if (!v.stats) v.stats = defaultVault().stats;
    if (!v.stats.guests_each) v.stats.guests_each = {};
    // Ensure starter items exist (in case vault got corrupted)
    if (!v.unlocked_items) v.unlocked_items = [];
    ['cafe_default', 'trail_petal', 'skin_default'].forEach(id => {
      if (!v.unlocked_items.includes(id)) v.unlocked_items.push(id);
    });
    if (!v.equipped) v.equipped = {};
    if (!v.equipped.background) v.equipped.background = 'cafe_default';
    if (!v.equipped.trail) v.equipped.trail = 'trail_petal';
    if (!v.equipped.skin) v.equipped.skin = 'skin_default';
    return v;
  } catch (e) { return defaultVault(); }
}

let _saveTimer = null;
function saveVault() {
  // Debounce: batch rapid saves into one localStorage write
  if (_saveTimer) return;
  _saveTimer = setTimeout(() => {
    _saveTimer = null;
    try { localStorage.setItem(VAULT_KEY, JSON.stringify(vault)); }
    catch (e) {}
  }, 500);
}
function saveVaultNow() {
  // Immediate save — used on critical actions (shop purchase, etc)
  if (_saveTimer) { clearTimeout(_saveTimer); _saveTimer = null; }
  try { localStorage.setItem(VAULT_KEY, JSON.stringify(vault)); }
  catch (e) {}
}

function randomTileType(exclude = []) {
  const choices = TILE_TYPES.filter(t => !exclude.includes(t));
  return choices[Math.floor(Math.random() * choices.length)];
}

function newCell(type, power = null) { return { type, power }; }

function createBoard() {
  board = [];
  for (let r = 0; r < GRID_SIZE; r++) {
    board[r] = [];
    for (let c = 0; c < GRID_SIZE; c++) {
      const exclude = [];
      if (c >= 2 && board[r][c-1].type === board[r][c-2].type) exclude.push(board[r][c-1].type);
      if (r >= 2 && board[r-1][c].type === board[r-2][c].type) exclude.push(board[r-1][c].type);
      board[r][c] = newCell(randomTileType(exclude));
    }
  }
  if (!hasAnyMove()) createBoard();
}

const boardEl = $('board');

function renderTileSVG(type) {
  const data = TILE_DATA[type];
  const c = data.color;
  switch (data.shape) {
    case 'circle':
      return `<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="15" fill="${c}"/><circle cx="15" cy="15" r="3" fill="white" opacity="0.6"/></svg>`;
    case 'heart':
      return `<svg viewBox="0 0 40 40"><path d="M20 34 C 6 24, 4 14, 12 10 C 16 8, 19 10, 20 13 C 21 10, 24 8, 28 10 C 36 14, 34 24, 20 34 Z" fill="${c}"/><ellipse cx="15" cy="15" rx="2" ry="3" fill="white" opacity="0.5"/></svg>`;
    case 'square':
      return `<svg viewBox="0 0 40 40"><rect x="7" y="7" width="26" height="26" rx="5" fill="${c}"/><circle cx="14" cy="14" r="2" fill="white" opacity="0.5"/><circle cx="26" cy="20" r="2" fill="white" opacity="0.5"/><circle cx="18" cy="28" r="2" fill="white" opacity="0.5"/></svg>`;
    case 'dome':
      return `<svg viewBox="0 0 40 40"><path d="M8 26 Q 20 6, 32 26 Z" fill="${c}"/><rect x="14" y="26" width="12" height="6" rx="2" fill="${c}" opacity="0.7"/><circle cx="16" cy="18" r="2" fill="white" opacity="0.7"/><circle cx="24" cy="22" r="2" fill="white" opacity="0.7"/></svg>`;
    case 'diamond':

}

function buildBoardOnce() {
  boardEl.innerHTML = '';
  for (let r = 0; r < GRID_SIZE; r++) {
    for (let c = 0; c < GRID_SIZE; c++) {
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.dataset.r = r;
      tile.dataset.c = c;
      boardEl.appendChild(tile);
    }
  }
}

function render() {
  // Mutate existing tiles in place instead of rebuilding the whole board.
  // This is the fix for the "whole board resets every combo" bug.
  for (let r = 0; r < GRID_SIZE; r++) {
    for (let c = 0; c < GRID_SIZE; c++) {
      const cell = board[r][c];
      const idx = r * GRID_SIZE + c;
      const tile = boardEl.children[idx];
      if (!tile) continue;

      // Reset only the classes we control, preserve the .tile base class
      const isSelected = selected && selected.r === r && selected.c === c;
      tile.className = 'tile' +
        (cell && cell.power ? ' ' + cell.power : '') +
        (isSelected ? ' selected' : '');

      // Only update innerHTML if the visual content actually changed
      const desiredHTML = (cell && cell.power !== 'rainbow') ? renderTileSVG(cell.type) : '';
      if (tile.dataset.contentKey !== (cell ? cell.type + ':' + (cell.power || '') : 'empty')) {
        tile.innerHTML = desiredHTML;
        tile.dataset.contentKey = cell ? cell.type + ':' + (cell.power || '') : 'empty';
      }
    }
  }
}

let dragStart = null;

boardEl.addEventListener('pointerdown', (e) => {
  if (busy) return;
  Audio.init(); // Wake up audio on first user interaction so SFX work immediately
  const tileEl = e.target.closest('.tile');
  if (!tileEl) return;
  e.preventDefault();
  dragStart = {
    r: parseInt(tileEl.dataset.r),
    c: parseInt(tileEl.dataset.c),
    x: e.clientX, y: e.clientY,
    moved: false
  };
});

boardEl.addEventListener('pointermove', (e) => {
  if (!dragStart || busy) return;
  const dx = e.clientX - dragStart.x;
  const dy = e.clientY - dragStart.y;
  if (Math.hypot(dx, dy) < 18) return;
  dragStart.moved = true;
  let target;
  if (Math.abs(dx) > Math.abs(dy)) {
    target = { r: dragStart.r, c: dragStart.c + (dx > 0 ? 1 : -1) };
  } else {
    target = { r: dragStart.r + (dy > 0 ? 1 : -1), c: dragStart.c };
  }
  if (target.r >= 0 && target.r < GRID_SIZE && target.c >= 0 && target.c < GRID_SIZE) {
    const start = { r: dragStart.r, c: dragStart.c };
    dragStart = null;
    selected = null;
    attemptSwap(start, target);
  }
});

boardEl.addEventListener('pointerup', () => {
  if (!dragStart) return;
  if (!dragStart.moved && !busy) handleTap(dragStart.r, dragStart.c);
  dragStart = null;
});

boardEl.addEventListener('pointercancel', () => { dragStart = null; });

function handleTap(r, c) {
  if (!selected) { selected = { r, c }; render(); return; }
  if (selected.r === r && selected.c === c) { selected = null; render(); return; }
  const dr = Math.abs(selected.r - r);
  const dc = Math.abs(selected.c - c);
  if (dr + dc === 1) {
    const a = selected;
    selected = null;
    attemptSwap(a, { r, c });
  } else {
    selected = { r, c };
    render();
  }
}

async function attemptSwap(a, b) {
  busy = true;
  try {
    swapCells(a, b);
    render();
    await sleep(180);

    const ca = board[a.r][a.c], cb = board[b.r][b.c];

    // Rainbow activation: swapping rainbow with any tile clears all of that type
    if (ca.power === 'rainbow' || cb.power === 'rainbow') {
      const targetType = ca.power === 'rainbow' ? cb.type : ca.type;
      const matches = activateRainbow(a, b, targetType);
      comboCount = 0;
      Audio.sfxRainbow();
      await resolveMatches(matches);
      return;
    }

    // Two power-ups swapped together: combine them into a super-effect.
    // Striped + striped = clear full row AND column. Striped + bomb = clear 3-wide cross.
    // Bomb + bomb = clear 5x5.
    if (ca.power && cb.power) {
      const cells = [];
      const powA = ca.power, powB = cb.power;
      const bothStriped = (powA === 'striped-h' || powA === 'striped-v') && (powB === 'striped-h' || powB === 'striped-v');
      const oneBomb = powA === 'bomb' || powB === 'bomb';
      if (bothStriped) {
        // Clear the row AND column of b
        for (let cc = 0; cc < GRID_SIZE; cc++) cells.push({ r: b.r, c: cc });
        for (let rr = 0; rr < GRID_SIZE; rr++) cells.push({ r: rr, c: b.c });
        Audio.sfxStriped(); Audio.sfxStriped();
      } else if (oneBomb && (powA === 'bomb' && powB === 'bomb')) {
        // 5x5 blast
        for (let rr = Math.max(0, b.r-2); rr <= Math.min(GRID_SIZE-1, b.r+2); rr++) {
          for (let cc = Math.max(0, b.c-2); cc <= Math.min(GRID_SIZE-1, b.c+2); cc++) {
            cells.push({ r: rr, c: cc });
          }
        }
        Audio.sfxBomb();
      } else if (oneBomb) {
        // Bomb + striped: 3-wide row AND column
        for (let rr = Math.max(0, b.r-1); rr <= Math.min(GRID_SIZE-1, b.r+1); rr++) {
          for (let cc = 0; cc < GRID_SIZE; cc++) cells.push({ r: rr, c: cc });
        }
        for (let cc = Math.max(0, b.c-1); cc <= Math.min(GRID_SIZE-1, b.c+1); cc++) {
          for (let rr = 0; rr < GRID_SIZE; rr++) cells.push({ r: rr, c: cc });
        }
        Audio.sfxBomb();
      }
      cells.push(a, b);
      // Consume the power-ups so the resolve loop doesn't re-trigger them endlessly
      board[a.r][a.c] = { ...ca, power: null };
      board[b.r][b.c] = { ...cb, power: null };
      comboCount = 0;
      await resolveMatches([{ cells, dir: 'combo', length: cells.length, type: ca.type }]);
      return;
    }

    const matches = findMatches();
    if (matches.length === 0) {
      swapCells(a, b);
      render();
      buzz(8);
      Audio.sfxBadSwap();
      return;
    }
    comboCount = 0;
    await resolveMatches(matches);
  } catch (err) {
    console.error('swap failed:', err);
  } finally {
    busy = false;
  }
}

function swapCells(a, b) {
  const t = board[a.r][a.c];
  board[a.r][a.c] = board[b.r][b.c];
  board[b.r][b.c] = t;
}

function findMatches() {
  const runs = [];
  for (let r = 0; r < GRID_SIZE; r++) {
    let runStart = 0;
    for (let c = 1; c <= GRID_SIZE; c++) {
      if (c === GRID_SIZE || board[r][c].type !== board[r][runStart].type) {
        if (c - runStart >= 3) {
          const cells = [];
          for (let k = runStart; k < c; k++) cells.push({ r, c: k });
          runs.push({ cells, dir: 'h', length: c - runStart, type: board[r][runStart].type });
        }
        runStart = c;
      }
    }
  }
  for (let c = 0; c < GRID_SIZE; c++) {
    let runStart = 0;
    for (let r = 1; r <= GRID_SIZE; r++) {
      if (r === GRID_SIZE || board[r][c].type !== board[runStart][c].type) {
        if (r - runStart >= 3) {
          const cells = [];
          for (let k = runStart; k < r; k++) cells.push({ r: k, c });
          runs.push({ cells, dir: 'v', length: r - runStart, type: board[runStart][c].type });
        }
        runStart = r;
      }
    }
  }
  return runs;
}

function runsToCellSet(runs) {
  const set = new Set();
  for (const run of runs) {
    for (const cell of run.cells) set.add(`${cell.r},${cell.c}`);
  }
  return set;
}

function activateRainbow(a, b, targetType) {
  const cells = [];
  for (let r = 0; r < GRID_SIZE; r++) {
    for (let c = 0; c < GRID_SIZE; c++) {
      if (board[r][c].type === targetType) cells.push({ r, c });
    }
  }
  cells.push(a, b);
  return [{ cells, dir: 'rainbow', length: cells.length, type: targetType }];
}

async function resolveMatches(runs) {
  comboCount++;
  const cellSet = runsToCellSet(runs);
  const triggered = new Set([...cellSet]);
  let added = true;
  while (added) {
    added = false;
    for (const key of [...triggered]) {
      const [r, c] = key.split(',').map(Number);
      const cell = board[r][c];
      if (!cell || !cell.power) continue;
      const power = cell.power;
      board[r][c] = { ...cell, power: null };
      if (power === 'striped-h') {
        Audio.sfxStriped();
        for (let cc = 0; cc < GRID_SIZE; cc++) {
          const k = `${r},${cc}`; if (!triggered.has(k)) { triggered.add(k); added = true; }
        }
      } else if (power === 'striped-v') {
        Audio.sfxStriped();
        for (let rr = 0; rr < GRID_SIZE; rr++) {
          const k = `${rr},${c}`; if (!triggered.has(k)) { triggered.add(k); added = true; }
        }
      } else if (power === 'bomb') {
        Audio.sfxBomb();
        for (let rr = Math.max(0, r-1); rr <= Math.min(GRID_SIZE-1, r+1); rr++) {
          for (let cc = Math.max(0, c-1); cc <= Math.min(GRID_SIZE-1, c+1); cc++) {
            const k = `${rr},${cc}`; if (!triggered.has(k)) { triggered.add(k); added = true; }
          }
        }
      }
    }
  }

  scoreMatches(triggered);

  const powerSpawns = [];
  for (const run of runs) {
    if (run.dir === 'rainbow' || run.dir === 'combo') continue;
    const spawnCell = run.cells[Math.floor(run.cells.length / 2)];
    if (run.length >= 5) {
      powerSpawns.push({ r: spawnCell.r, c: spawnCell.c, power: 'rainbow', type: run.type });
      vault.stats.rainbows_made = (vault.stats.rainbows_made || 0) + 1;
      vault.stats.powerups_made = (vault.stats.powerups_made || 0) + 1;
    } else if (run.length === 4) {
      const power = run.dir === 'h' ? 'striped-h' : 'striped-v';
      powerSpawns.push({ r: spawnCell.r, c: spawnCell.c, power, type: run.type });
      vault.stats.powerups_made = (vault.stats.powerups_made || 0) + 1;
    }
  }

  triggered.forEach(key => {
    const [r, c] = key.split(',').map(Number);
    const idx = r * GRID_SIZE + c;
    const el = boardEl.children[idx];
    if (el) el.classList.add('matching');
  });
  buzz(20);
  if (comboCount === 1) Audio.sfxMatch();
  else Audio.sfxCombo(comboCount);
  await sleep(380);

  triggered.forEach(key => {
    const [r, c] = key.split(',').map(Number);
    board[r][c] = null;
  });

  // Invalidate the render cache for every triggered cell so new content
  // is actually drawn even if the type happens to match the previous one.
  triggered.forEach(key => {
    const [r, c] = key.split(',').map(Number);
    const idx = r * GRID_SIZE + c;
    const el = boardEl.children[idx];
    if (el) {
      el.classList.remove('matching');
      el.dataset.contentKey = '__forced_refresh__';
    }
  });

  for (const spawn of powerSpawns) {
    if (board[spawn.r][spawn.c] === null) {
      board[spawn.r][spawn.c] = newCell(spawn.type, spawn.power);
    }
  }

  // Figure out which columns had any clear - those columns need full refresh
  const dirtyCols = new Set();
  triggered.forEach(key => {
    const [r, c] = key.split(',').map(Number);
    dirtyCols.add(c);
  });

  for (let c = 0; c < GRID_SIZE; c++) {
    const col = [];
    for (let r = GRID_SIZE - 1; r >= 0; r--) {
      if (board[r][c] !== null) col.push(board[r][c]);
    }
    while (col.length < GRID_SIZE) col.push(newCell(randomTileType()));
    for (let r = GRID_SIZE - 1; r >= 0; r--) {
      board[r][c] = col[GRID_SIZE - 1 - r];
    }
  }

  // Force re-render of every tile in dirty columns so dropped tiles always
  // get fresh DOM content even when types happen to repeat.
  dirtyCols.forEach(c => {
    for (let r = 0; r < GRID_SIZE; r++) {
      const idx = r * GRID_SIZE + c;
      const el = boardEl.children[idx];
      if (el) {
        el.classList.remove('matching', 'falling');
        el.dataset.contentKey = '__forced_refresh__';
      }
    }
  });
  render();
  await sleep(340);

  if (comboCount >= 2) {
    showToast(`Combo x${comboCount}! 💫`, 'combo');
  }

  const next = findMatches();
  if (next.length > 0) {
    await resolveMatches(next);
    return;
  }

  if (comboCount > vault.stats.max_combo) vault.stats.max_combo = comboCount;
  saveVault();
  checkAchievements();

  if (!hasAnyMove()) {
    showToast('No moves — reshuffling ✨');
    await sleep(800);
    do { createBoard(); } while (!hasAnyMove());
    render();
  }
}

function scoreMatches(triggered) {
  vault.stats.matches += triggered.size;

  let coinsEarned = 0;
  let cravingDelta = 0;

  triggered.forEach(key => {
    const [r, c] = key.split(',').map(Number);
    const cell = board[r][c];
    if (!cell) return;
    let coin = 1;
    if (currentGuest) {
      if (cell.type === currentGuest.favourite) {
        coin = 2;
        cravingDelta += 1;
      }
      if (cell.type === currentGuest.hated) {
        cleanServe = false;
        $('guestAvatar').classList.add('sad');
        setTimeout(() => $('guestAvatar').classList.remove('sad'), 500);
      }
    }
    coinsEarned += coin;
  });

  if (comboCount > 1) coinsEarned = Math.round(coinsEarned * (1 + (comboCount - 1) * 0.25));

  vault.coins += coinsEarned;
  vault.stats.lifetime_coins += coinsEarned;
  cravingProgress += cravingDelta;

  if (triggered.size >= 4) burstSparkles();
  if (currentGuest && cravingProgress >= cravingTarget) fulfilGuest();

  saveVault();
  updateHUD();
}

function fulfilGuest() {
  vault.happiness += 1;
  vault.stats.guests_served += 1;
  vault.stats.guests_each[currentGuest.id] = (vault.stats.guests_each[currentGuest.id] || 0) + 1;
  vault.coins += 10;
  vault.stats.lifetime_coins += 10;

  if (cleanServe) {
    currentStreak++;
    if (currentStreak > vault.stats.max_streak) vault.stats.max_streak = currentStreak;
    if (currentStreak >= 3) {
      const bonus = currentStreak * 5;
      vault.coins += bonus;
      vault.stats.lifetime_coins += bonus;
      showToast(`${currentGuest.name} happy! Streak ${currentStreak} → +${10 + bonus} 🪙`);
    } else {
      showToast(`${currentGuest.name} is happy! +10 🪙`);
    }
  } else {
    currentStreak = 0;
    showToast(`${currentGuest.name} is happy! +10 🪙`);
  }
  cleanServe = true;

  $('guestAvatar').classList.add('happy');
  setTimeout(() => $('guestAvatar').classList.remove('happy'), 700);
  burstSparkles();
  Audio.sfxGuestHappy();

  saveVault();
  checkAchievements();
  setTimeout(nextGuest, 1300);
}

// ============ AMBIENT SYSTEMS (chill things) ============
function startAmbientSystems() {
  // Slow day/night cycle: 90 seconds per phase, 3 phases (4.5 min full cycle)
  // Only runs when the default cafe background is equipped
  function cycleTimeOfDay() {
    if ((vault.equipped.background || 'cafe_default') !== 'cafe_default') return;
    const phases = ['morning', 'afternoon', 'evening'];
    const idx = Math.floor(Date.now() / 90000) % phases.length;
    const newTod = phases[idx];
    if (newTod !== timeOfDay) {
      timeOfDay = newTod;
      $('cafeScene').className = 'cafe-scene ' + timeOfDay;
    }
  }
  cycleTimeOfDay();
  setInterval(cycleTimeOfDay, 5000);

  // Floating petals — drift across every 4–8 seconds
  // Uses the equipped trail cosmetic
  const trailEmojis = {
    trail_petal:  ['🌸','🌼','✿','❀'],
    trail_star:   ['⭐','✨','🌟','💫'],
    trail_heart:  ['💗','💕','💖','♡'],
    trail_bubble: ['🫧','○','◯','⚪'],
    trail_leaf:   ['🍃','🌿','☘️','🍀'],
    trail_snow:   ['❄️','❅','❆','✻'],
    trail_fire:   ['🔥','✨','💥','⭐']
  };
  function spawnPetal() {
    const wrap = document.querySelector('.board-wrap');
    if (!wrap) return;
    const trail = vault.equipped.trail || 'trail_petal';
    const emojis = trailEmojis[trail] || trailEmojis.trail_petal;
    const petal = document.createElement('div');
    petal.className = 'petal';
    petal.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    petal.style.left = (Math.random() * 90) + '%';
    petal.style.top = '-20px';
    petal.style.setProperty('--drift-x', (Math.random() * 80 - 40) + 'px');
    petal.style.animation = `petalDrift ${10 + Math.random() * 6}s linear forwards`;
    wrap.appendChild(petal);
    setTimeout(() => petal.remove(), 17000);
  }
  setInterval(spawnPetal, 4000 + Math.random() * 4000);
  spawnPetal();

  // Walking cat — every 25–60 seconds
  const catEl = $('cat');
  function walkCat() {
    catEl.classList.remove('active-right', 'active-left');
    void catEl.offsetWidth;
    catEl.classList.add(Math.random() < 0.5 ? 'active-right' : 'active-left');
  }
  setTimeout(walkCat, 8000);
  setInterval(walkCat, 30000 + Math.random() * 30000);

  // Soft rain — 30% chance every 60 seconds, lasts 20–40 seconds
  const rainLayer = $('rainLayer');
  function buildRain() {
    rainLayer.innerHTML = '';
    for (let i = 0; i < 30; i++) {
      const drop = document.createElement('div');
      drop.className = 'raindrop';
      drop.style.left = (Math.random() * 100) + '%';
      drop.style.height = (12 + Math.random() * 18) + 'px';
      drop.style.animationDuration = (0.6 + Math.random() * 0.6) + 's';
      drop.style.animationDelay = (Math.random() * 1) + 's';
      rainLayer.appendChild(drop);
    }
  }
  function maybeRain() {
    if (Math.random() < 0.3) {
      buildRain();
      rainLayer.classList.add('active');
      setTimeout(() => rainLayer.classList.remove('active'), 20000 + Math.random() * 20000);
    }
  }
  setTimeout(maybeRain, 15000);
  setInterval(maybeRain, 60000);
}

function refillQueue() {
  while (guestQueue.length < 3) {
    const last = guestQueue[guestQueue.length - 1] || currentGuest;
    const others = GUESTS.filter(g => !last || g.id !== last.id);
    guestQueue.push(others[Math.floor(Math.random() * others.length)]);
  }
}

function nextGuest() {
  refillQueue();
  currentGuest = guestQueue.shift();
  cravingTarget = 6 + Math.floor(Math.random() * 6);
  cravingProgress = 0;
  cleanServe = true;
  refillQueue();
  updateHUD();
}

function applyCosmetics() {
  // Background — overrides time-of-day if a custom one is equipped
  const bg = vault.equipped.background || 'cafe_default';
  if (bg === 'cafe_default') {
    // Time-of-day cycle handles it
    $('cafeScene').className = 'cafe-scene ' + timeOfDay;
  } else {
    $('cafeScene').className = 'cafe-scene ' + bg;
  }
  // Tile skin
  const skin = vault.equipped.skin || 'skin_default';
  boardEl.classList.remove('skin_default', 'skin_pastel', 'skin_neon');
  boardEl.classList.add(skin);
}

function updateHUD() {
  if (!currentGuest) return;
  $('guestEmoji').textContent = currentGuest.emoji;
  $('guestName').textContent = currentGuest.name;
  const favLabel = TILE_DATA[currentGuest.favourite].label;
  $('guestCraving').innerHTML = `wants <strong>${cravingProgress} / ${cravingTarget}</strong> ${favLabel}`;
  $('cravingFill').style.width = Math.min(100, (cravingProgress / cravingTarget) * 100) + '%';
  $('cravingIcon').innerHTML = renderTileSVG(currentGuest.favourite);
  $('coinCount').textContent = vault.coins;
  $('happyCount').textContent = vault.happiness;

  const q = $('orderQueue');
  q.innerHTML = '';
  guestQueue.slice(0, 3).forEach(g => {
    const chip = document.createElement('div');
    chip.className = 'order-chip';
    chip.textContent = g.emoji;
    q.appendChild(chip);
  });

  const sb = $('streakBadge');
  if (currentStreak >= 2) {
    sb.textContent = `🔥 ${currentStreak}`;
    sb.classList.add('active');
  } else {
    sb.classList.remove('active');
  }

  const hatItem = SHOP_ITEMS.find(i => i.id === vault.equipped.hat);
  $('guestHat').textContent = hatItem ? hatItem.emoji : '';

  // Reset button dims when you can't afford it
  const resetBtn = $('resetBtn');
  if (resetBtn) {
    resetBtn.classList.toggle('cant-afford', vault.coins < 25);
  }
}

function hasAnyMove() {
  for (let r = 0; r < GRID_SIZE; r++) {
    for (let c = 0; c < GRID_SIZE; c++) {
      if (c < GRID_SIZE - 1) {
        swapCells({r,c}, {r, c: c+1});
        if (findMatches().length > 0) { swapCells({r,c}, {r, c: c+1}); return true; }
        swapCells({r,c}, {r, c: c+1});
      }
      if (r < GRID_SIZE - 1) {
        swapCells({r,c}, {r: r+1, c});
        if (findMatches().length > 0) { swapCells({r,c}, {r: r+1, c}); return true; }
        swapCells({r,c}, {r: r+1, c});
      }
    }
  }
  return false;
}

function checkAchievements() {
  for (const ach of ACHIEVEMENTS) {
    if (vault.achievements.includes(ach.id)) continue;
    if (ach.check(vault)) {
      vault.achievements.push(ach.id);
      saveVault();
      showToast(`${ach.icon} ${ach.name} unlocked!`, 'achievement');
      buzz(40);
      Audio.sfxAchievement();
    }
  }
}

function renderAchievements() {
  const list = $('achList');
  list.innerHTML = '';
  let secretLockedCount = 0;
  for (const ach of ACHIEVEMENTS) {
    const unlocked = vault.achievements.includes(ach.id);
    if (ach.secret && !unlocked) {
      secretLockedCount++;
      continue;
    }
    const item = document.createElement('div');
    item.className = 'ach-item ' + (unlocked ? 'unlocked' : 'locked');
    item.innerHTML = `
      <div class="ach-icon">${unlocked ? ach.icon : '🔒'}</div>
      <div class="ach-text">
        <div class="ach-name">${ach.name}</div>
        <div class="ach-desc">${ach.desc}</div>
      </div>
    `;
    list.appendChild(item);
  }
  // Show a "??? secrets remaining" placeholder for hidden ones
  if (secretLockedCount > 0) {
    const item = document.createElement('div');
    item.className = 'ach-item locked secret';
    item.innerHTML = `
      <div class="ach-icon">❔</div>
      <div class="ach-text">
        <div class="ach-name">??? Secret${secretLockedCount > 1 ? 's' : ''}</div>
        <div class="ach-desc">${secretLockedCount} hidden goal${secretLockedCount > 1 ? 's' : ''} to discover</div>
      </div>
    `;
    list.appendChild(item);
  }
}

let currentShopTab = 'hat';

function renderShop() {
  const list = $('shopList');
  list.innerHTML = '';

  // Tab bar
  const tabs = document.createElement('div');
  tabs.className = 'shop-tabs';
  SHOP_CATEGORIES.forEach(cat => {
    const ownedInCat = SHOP_ITEMS
      .filter(i => i.cat === cat.id && vault.unlocked_items.includes(i.id))
      .length;
    const totalInCat = SHOP_ITEMS.filter(i => i.cat === cat.id).length;
    const tab = document.createElement('button');
    tab.className = 'shop-tab' + (currentShopTab === cat.id ? ' active' : '');
    tab.innerHTML = `<span class="shop-tab-icon">${cat.icon}</span><span class="shop-tab-label">${cat.label}</span><span class="shop-tab-count">${ownedInCat}/${totalInCat}</span>`;
    tab.addEventListener('click', () => { currentShopTab = cat.id; renderShop(); });
    tabs.appendChild(tab);
  });
  list.appendChild(tabs);

  // Items in current category
  const items = SHOP_ITEMS.filter(i => i.cat === currentShopTab);
  let secretCount = 0;
  for (const item of items) {
    const owned = vault.unlocked_items.includes(item.id);
    if (item.secret && !owned) {
      secretCount++;
      continue;
    }
    const equipped = vault.equipped[item.cat] === item.id;
    const canAfford = vault.coins >= item.price;
    const isFree = item.price === 0;
    const row = document.createElement('div');
    row.className = 'shop-item' + (owned ? '' : ' locked-item');
    let btnLabel, btnClass = '', btnDisabled = '';
    if (equipped) { btnLabel = 'Equipped'; btnClass = 'equipped'; }
    else if (owned) { btnLabel = 'Wear'; btnClass = 'owned'; }
    else if (isFree) { btnLabel = 'Free'; }
    else if (canAfford) { btnLabel = `${item.price} 🪙`; }
    else { btnLabel = `${item.price} 🪙`; btnDisabled = 'disabled'; }
    row.innerHTML = `
      <div class="shop-icon">${owned ? item.emoji : '🔒'}</div>
      <div class="ach-text">
        <div class="ach-name">${item.name}</div>
        <div class="ach-desc">${owned ? 'Owned' : item.price >= 500 ? 'Splurge ✨' : 'Cosmetic'}</div>
      </div>
      <button class="shop-buy ${btnClass}" data-id="${item.id}" ${btnDisabled}>${btnLabel}</button>
    `;
    list.appendChild(row);
  }
  // Secret placeholder
  if (secretCount > 0) {
    const row = document.createElement('div');
    row.className = 'shop-item locked-item secret';
    row.innerHTML = `
      <div class="shop-icon">❔</div>
      <div class="ach-text">
        <div class="ach-name">??? Secret</div>
        <div class="ach-desc">${secretCount} mystery item${secretCount > 1 ? 's' : ''}</div>
      </div>
      <button class="shop-buy" disabled>???</button>
    `;
    list.appendChild(row);
  }
  list.querySelectorAll('.shop-buy').forEach(btn => {
    btn.addEventListener('click', () => handleShopAction(btn.dataset.id));
  });
}

function handleShopAction(itemId) {
  const item = SHOP_ITEMS.find(i => i.id === itemId);
  if (!item) return;
  const owned = vault.unlocked_items.includes(itemId);
  const equipped = vault.equipped[item.cat] === itemId;

  if (equipped) {
    // Hats and accessories can be unequipped; backgrounds/trails/skins can't (always one active)
    if (item.cat === 'hat' || item.cat === 'accessory') {
      delete vault.equipped[item.cat];
    }
  } else if (owned) {
    vault.equipped[item.cat] = itemId;
  } else if (vault.coins >= item.price) {
    vault.coins -= item.price;
    vault.unlocked_items.push(itemId);
    vault.equipped[item.cat] = itemId;
    showToast(`${item.name} unlocked!`, 'achievement');
    buzz(30);
    Audio.sfxAchievement();
  }
  saveVaultNow();
  renderShop();
  updateHUD();
  applyCosmetics();
  // Visual flash so you can see the change took effect
  const avatar = $('guestAvatar');
  if (avatar) {
    avatar.classList.remove('flash');
    void avatar.offsetWidth;
    avatar.classList.add('flash');
  }
}

function burstSparkles() {
  const layer = $('sparkleLayer');
  for (let i = 0; i < 12; i++) {
    const s = document.createElement('div');
    s.textContent = ['✨','⭐','💫','🌟'][Math.floor(Math.random()*4)];
    s.style.cssText = `
      position: absolute;
      left: ${20 + Math.random() * 60}%;
      top: ${20 + Math.random() * 60}%;
      font-size: ${16 + Math.random() * 14}px;
      animation: sparkleFloat 1.2s ease-out forwards;
      pointer-events: none;
    `;
    layer.appendChild(s);
    setTimeout(() => s.remove(), 1300);
  }
}

sparkleStyle.textContent = `
  @keyframes sparkleFloat {
    0%   { opacity: 0; transform: translateY(0) scale(0.5) rotate(0deg); }
    20%  { opacity: 1; }
    100% { opacity: 0; transform: translateY(-60px) scale(1.3) rotate(180deg); }

`;

let toastQueue = [];
let toastActive = false;

function showToast(msg, kind = '') {
  // Achievement toasts jump the queue; others append
  if (kind === 'achievement') {
    toastQueue.unshift({ msg, kind });
  } else {
    toastQueue.push({ msg, kind });
  }
  processToastQueue();
}

function processToastQueue() {
  if (toastActive || toastQueue.length === 0) return;
  toastActive = true;
  const { msg, kind } = toastQueue.shift();
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show ' + kind;
  // Achievement toasts linger longer so you can actually read them
  const duration = kind === 'achievement' ? 2800 : 1800;
  setTimeout(() => {
    t.classList.remove('show');
    setTimeout(() => {
      toastActive = false;
      processToastQueue();
    }, 400);
  }, duration);
}

$('resetBtn').addEventListener('click', () => {
  if (busy) return;
  const COST = 25;
  if (vault.coins < COST) {
    showToast(`Need ${COST} 🪙 for a fresh board`);
    Audio.sfxBadSwap();
    return;
  }
  vault.coins -= COST;
  vault.stats.boards_bought = (vault.stats.boards_bought || 0) + 1;
  saveVault();
  createBoard();
  [...boardEl.children].forEach(el => {
    el.className = 'tile';
    el.dataset.contentKey = '';
  });
  render();
  updateHUD();
  checkAchievements();
  showToast('Fresh board ✨ −25 🪙');
});

const audioBtn = $('audioBtn');
audioBtn.addEventListener('click', () => {
  Audio.init();
  if (Audio.isMusicPlaying()) {
    Audio.stopMusic();

// ============ SEASONAL SYSTEM ============
function getSeason() {
  const m = new Date().getMonth();
  if (m >= 2 && m <= 4) return 'spring';
  if (m >= 5 && m <= 7) return 'summer';
  if (m >= 8 && m <= 10) return 'autumn';
  return 'winter';
}

const SEASONAL_DATA = {
  spring: { label: '🌸 Spring' },
  summer: { label: '☀️ Summer' },
  autumn: { label: '🍂 Autumn' },
  winter: { label: '❄️ Winter' }
};

function applySeasonal() {
  const season = getSeason();
  const tint = $('seasonalTint');
  if (tint) tint.className = 'seasonal-tint ' + season;
}

// ============ DAILY BONUS ============
function checkDailyBonus() {
  const today = new Date().toISOString().slice(0, 10);
  if (vault.last_daily !== today) {
    vault.last_daily = today;
    vault.coins += 50;
    vault.stats.lifetime_coins += 50;
    saveVaultNow();
    showToast('☀️ Daily bonus! +50 🪙', 'achievement');
    updateHUD();
  }
}

// ============ SHARE STATS ============
$('shareBtn').addEventListener('click', () => {
  const guestEmojis = GUESTS.map(g => g.emoji).join('');
  const season = getSeason();
  const seasonLabel = SEASONAL_DATA[season].label;
  const text = `☕ My Cozy Cafe ${seasonLabel}\n` +
    `🪙 ${vault.coins} coins · ✨ ${vault.happiness} happy guests\n` +
    `📊 ${vault.stats.guests_served} served · ${vault.stats.matches} matches · ${vault.stats.max_combo}x best combo\n` +
    `🏆 ${vault.achievements.length}/${ACHIEVEMENTS.length} achievements\n` +
    `${guestEmojis}\n` +
    `Play at jvdesignstudio.co.uk`;

  if (navigator.share) {
    navigator.share({ text }).catch(() => {});
  } else if (navigator.clipboard) {
    navigator.clipboard.writeText(text).then(() => {
      showToast('Stats copied to clipboard! 📋');
    }).catch(() => {
      showToast('Couldn\'t copy — try again');
    });
  } else {
    showToast('Sharing not supported on this browser');
  }
});

// ============ GUEST BIO (tap avatar) ============
$('guestAvatar').addEventListener('click', () => {

  html += facts.map(f => `<em>"${f}"</em>`).join('<br><br>');
  html += `</p>`;

// ============ KEYBOARD CONTROLS ============
let kbCursor = null;

document.addEventListener('keydown', (e) => {
  if (document.querySelector('.modal-backdrop.show')) return;
  if (busy) return;
  Audio.init();

  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','w','a','s','d'].includes(e.key)) {
    e.preventDefault();
    if (!kbCursor) {
      kbCursor = { r: 3, c: 3 };
    } else {
      const dir = { ArrowUp: [-1,0], w: [-1,0], ArrowDown: [1,0], s: [1,0],
                    ArrowLeft: [0,-1], a: [0,-1], ArrowRight: [0,1], d: [0,1] };
      const d = dir[e.key];
      if (d) {
        kbCursor.r = Math.max(0, Math.min(GRID_SIZE-1, kbCursor.r + d[0]));
        kbCursor.c = Math.max(0, Math.min(GRID_SIZE-1, kbCursor.c + d[1]));
      }
    }
    renderKBCursor();
    return;
  }

  if ((e.key === ' ' || e.key === 'Enter') && kbCursor) {
    e.preventDefault();
    handleTap(kbCursor.r, kbCursor.c);
    renderKBCursor();
    return;
  }
});

function renderKBCursor() {
  [...boardEl.children].forEach(el => el.classList.remove('kb-cursor'));
  if (kbCursor) {
    const idx = kbCursor.r * GRID_SIZE + kbCursor.c;
    const el = boardEl.children[idx];
    if (el) el.classList.add('kb-cursor');
  }
}

  { icon: '☕', title: 'Welcome to the <em>Cafe</em>', body: 'Match snacks to serve your guests. Swap two adjacent tiles to line up three or more of the same kind.' },
  { icon: '🦊', title: 'Guest <em>Cravings</em>', body: 'Each guest wants a specific snack. Match their favourite to fill their craving bar — and earn 2× coins! The snack icon in the HUD shows what they want.' },
  { icon: '⚡', title: '<em>Power-Ups</em>', body: 'Match 4 in a row for a striped tile that clears a whole line. Match 5 for a rainbow tile that clears every tile of one type. Swap two power-ups together for a super combo!' },
  { icon: '🛍️', title: 'The <em>Shop</em>', body: 'Spend coins on hats, accessories, backgrounds, trails, and tile skins. Tap a guest\'s avatar to learn about them. Your purchases are shared with other JVDesignStudio games.' },
  { icon: '✨', title: 'One more thing...', body: 'There are no fail states. No lives. No timers. The cafe is here whenever you need it. Enjoy.' }
];

let tutorialPage = 0;

function showTutorial() {
  tutorialPage = 0;
  renderTutorialPage();
  $('tutorialModal').classList.add('show');
}

function renderTutorialPage() {
  const page = TUTORIAL_PAGES[tutorialPage];
  $('tutorialContent').innerHTML = `
    <div class="tut-step">Step ${tutorialPage + 1} of ${TUTORIAL_PAGES.length}</div>
    <span class="tut-icon">${page.icon}</span>
    <h3>${page.title}</h3>
    <p>${page.body}</p>
  `;
  $('tutNext').textContent = tutorialPage < TUTORIAL_PAGES.length - 1 ? 'Next →' : 'Let\'s go! ☕';
}

$('tutNext').addEventListener('click', () => {
  tutorialPage++;
  if (tutorialPage >= TUTORIAL_PAGES.length) {
    $('tutorialModal').classList.remove('show');
    vault.tutorial_seen = true;
    saveVaultNow();
    return;
  }
  renderTutorialPage();
});

$('tutSkip').addEventListener('click', () => {
  $('tutorialModal').classList.remove('show');
  vault.tutorial_seen = true;
  saveVaultNow();
});

function init() {
  // Time-based secret achievement triggers
  const hour = new Date().getHours();
  if (hour >= 0 && hour < 4) vault.stats.played_at_night = true;
  if (hour >= 5 && hour < 7) vault.stats.played_at_dawn = true;

  createBoard();
  buildBoardOnce();
  refillQueue();
  nextGuest();
  render();
  updateHUD();
  applyCosmetics();
  applySeasonal();
  checkAchievements();
  startAmbientSystems();

  // Daily bonus check
  checkDailyBonus();

  // Tutorial on first ever visit
  if (!vault.tutorial_seen) {
    setTimeout(showTutorial, 600);
  }
}

init();
