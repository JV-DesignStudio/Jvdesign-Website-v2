<script src="../story-run.js"></script>
<script>
(function(){
const C = document.getElementById('game'), ctx = C.getContext('2d');
const $ = id => document.getElementById(id);
const audio = window.AudioEffects ? new AudioEffects(.5) : null;
const sys = window.GameSystem ? new GameSystem('lumo-run',"Lumo's Run",'lumo') : null;
const storyRun = window.StoryRun ? new StoryRun({
  id:'lumo-run', gameSystem:sys, title:"Lumo's Run", character:'Lumo',
  open:"Lumo's glow is fading and the only way to recharge is to keep running through the enchanted forest.",
  objective:'Run as far as you can, collect stardust, and dodge every obstacle.',
  beats:[{at:0,text:'The forest path opens and the first obstacles appear.'},{at:.45,text:'The canopy thickens and the pace quickens.'},{at:.82,text:'Deep forest now. Every jump counts.'}],
  cap:300,
  result:{
    success:"Lumo's glow is blazing and the forest opens to a clearing.",
    partial:'The glow holds, but barely. Lumo rests before the next run.',
    fail:"The glow flickers out, but Lumo knows the path better now."
  },
  onRestart:function(){ startGame(); }
}) : null;

let W, H, dpr;
const GROUND_RATIO = .78;
let groundY;

let running = false, dead = false;
let player, obstacles, dusts, bgTrees, particles;
let score, dist, dustCount, speed, best;
let last = 0, spawnTimer = 0;

best = (sys ? GameSystem.getBestScore('lumo-run') : 0) || 0;

function fit() {
  const r = C.getBoundingClientRect();
  dpr = Math.min(devicePixelRatio || 1, 2);
  W = Math.round(r.width * dpr);
  H = Math.round(r.height * dpr);
  C.width = W; C.height = H;
  groundY = H * GROUND_RATIO;
}

function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.classList.remove('show'), 800);
}

function burst(x, y, color, n) {
  for (let i = 0; i < n; i++) {
    particles.push({
      x, y, vx: (Math.random() - .5) * 200, vy: -Math.random() * 200,
      life: 1, color, size: 2 + Math.random() * 3
    });
  }
}

const obstacleTypes = [
  { type: 'gap', w: 60, h: 0 },
  { type: 'rock', w: 36, h: 42 },
  { type: 'log', w: 50, h: 36 },
  { type: 'branch', w: 80, h: 24 },
  { type: 'double', w: 40, h: 50 },
];

function makeObstacle() {
  const dFactor = Math.min(1, dist / 8000);
  const types = obstacleTypes.filter(t => {
    if (t.type === 'double' && dFactor < .3) return false;
    return true;
  });
  const tmpl = types[Math.floor(Math.random() * types.length)];
  const scale = dpr;
  return {
    type: tmpl.type,
    x: W + 50,
    y: tmpl.type === 'branch' ? groundY - 70 * scale : groundY,
    w: tmpl.w * scale,
    h: tmpl.h * scale,
    low: tmpl.type === 'branch',
    passed: false
  };
}

function makeDust() {
  const yOff = -20 - Math.random() * 80;
  return {
    x: W + 30 + Math.random() * 200,
    y: groundY + yOff * dpr,
    r: 10, collected: false, bob: Math.random() * 6
  };
}

function reset() {
  const scale = dpr;
  player = {
    x: W * .18,
    y: groundY,
    w: 28 * scale,
    h: 44 * scale,
    vy: 0,
    grounded: true,
    sliding: false,
    slideTimer: 0,
    glow: 1,
    runFrame: 0
  };
  obstacles = []; dusts = []; particles = [];
  bgTrees = [];
  for (let i = 0; i < 12; i++) {
    bgTrees.push({ x: Math.random() * W, h: 60 + Math.random() * 120, layer: Math.random() < .5 ? 0 : 1 });
  }
  score = 0; dist = 0; dustCount = 0; speed = 320;
  spawnTimer = 1;
}

function jump() {
  if (!running || dead) return;
  if (player.grounded) {
    player.vy = -580 * dpr;
    player.grounded = false;
    player.sliding = false;
    try { audio?.playPop?.(); } catch(e) {}
  }
}

function slide() {
  if (!running || dead) return;
  if (player.grounded && !player.sliding) {
    player.sliding = true;
    player.slideTimer = .45;
    try { audio?.playTap?.(); } catch(e) {}
  }
}

function startGame() {
  reset();
  running = true;
  dead = false;
  $('startScreen').classList.add('hidden');
  $('endScreen').classList.add('hidden');
  if ('ontouchstart' in window) $('touchControls').style.display = 'flex';
  sys?.beginRun?.();
  if (storyRun && !storyRun.running) storyRun.begin();
  last = performance.now();
  requestAnimationFrame(loop);
}

function endGame(reason) {
  dead = true;
  running = false;
  if (score > best) {
    best = score;
    if (sys) GameSystem.saveScore('lumo-run', best);
  }
  sys?.saveState?.();
  burst(player.x, player.y - player.h / 2, '#a78bfa', 24);
  try { audio?.playError?.(); } catch(e) {}
  toast(reason || 'Crashed!');
  if (storyRun) {
    storyRun.finish(score > 3000 ? 'success' : 'fail', score);
  } else {
    showEnd();
  }
}

function showEnd() {
  $('endTitle').textContent = score > 5000 ? 'Amazing Run!' : score > 2000 ? 'Good Run!' : 'Run Over';
  $('endStats').innerHTML = [
    ['Score', score], ['Distance', Math.floor(dist) + 'm'], ['Stardust', dustCount], ['Best', best]
  ].map(s => '<div><b>' + s[1] + '</b><small>' + s[0] + '</small></div>').join('');
  $('endScreen').classList.remove('hidden');
}

function hud() {
  $('scoreHud').textContent = score;
  $('distHud').textContent = Math.floor(dist) + 'm';
  $('dustHud').textContent = dustCount;
  $('bestHud').textContent = best;
  if (storyRun) storyRun.setScore(score);
}

function update(dt) {
  if (!running || dead) return;

  speed = 320 + dist * .025;
  dist += speed * dt * .01;
  score += Math.ceil(dt * speed * .08);

  player.runFrame += dt * speed * .02;
  player.vy += 1400 * dpr * dt;
  player.y += player.vy * dt;
  if (player.y >= groundY) {
    player.y = groundY;
    player.vy = 0;
    player.grounded = true;
  }

  if (player.sliding) {
    player.slideTimer -= dt;
    if (player.slideTimer <= 0) player.sliding = false;
  }

  spawnTimer -= dt;
  if (spawnTimer <= 0) {
    obstacles.push(makeObstacle());
    if (Math.random() < .6) dusts.push(makeDust());
    if (Math.random() < .3) dusts.push(makeDust());
    spawnTimer = Math.max(.55, 1.4 - dist * .0003) + Math.random() * .3;
  }

  const pH = player.sliding ? player.h * .4 : player.h;
  const pTop = player.y - pH;
  const pLeft = player.x - player.w / 2;
  const pRight = player.x + player.w / 2;

  for (let i = obstacles.length - 1; i >= 0; i--) {
    const o = obstacles[i];
    o.x -= speed * dt;
    if (o.x + o.w < -20) { obstacles.splice(i, 1); continue; }

    if (!o.passed && o.x + o.w < pLeft) {
      o.passed = true;
      score += 30;
    }

    if (o.type === 'gap') {
      if (player.grounded && pRight > o.x + 8 && pLeft < o.x + o.w - 8) {
        endGame('Fell in the gap!');
        return;
      }
      continue;
    }

    const oTop = o.low ? o.y - o.h : o.y - o.h;
    const oBot = o.low ? o.y : o.y;
    const oLeft = o.x;
    const oRight = o.x + o.w;

    if (pRight > oLeft + 4 && pLeft < oRight - 4) {
      if (o.low) {
        if (pTop < oBot && !player.sliding) {
          endGame('Hit the branch!');
          return;
        }
      } else {
        if (player.y > oTop + 6) {
          endGame('Hit a ' + o.type + '!');
          return;
        }
      }
    }
  }

  for (let i = dusts.length - 1; i >= 0; i--) {
    const d = dusts[i];
    d.x -= speed * dt;
    d.bob += dt * 4;
    if (d.x < -20) { dusts.splice(i, 1); continue; }
    if (!d.collected && Math.abs(player.x - d.x) < 28 * dpr && Math.abs((player.y - pH / 2) - d.y) < 28 * dpr) {
      d.collected = true;
      dustCount++;
      score += 75;
      burst(d.x, d.y, '#fde68a', 8);
      toast('+Stardust!');
      try { audio?.playSuccess?.(); } catch(e) {}
    }
  }
  dusts = dusts.filter(d => !d.collected);

  bgTrees.forEach(t => {
    t.x -= speed * dt * (t.layer === 0 ? .2 : .4);
    if (t.x < -40) t.x = W + 40 + Math.random() * 100;
  });

  particles.forEach(p => {
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 200 * dt;
    p.life -= dt * 2;
  });
  particles = particles.filter(p => p.life > 0);

  hud();
}

function drawBg() {
  const sky = ctx.createLinearGradient(0, 0, 0, groundY);
  sky.addColorStop(0, '#0c0d2c');
  sky.addColorStop(.6, '#1a1040');
  sky.addColorStop(1, '#2e1065');
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, groundY);

  for (let i = 0; i < 40; i++) {
    ctx.fillStyle = 'rgba(255,255,255,' + (.05 + (i % 6) * .015) + ')';
    ctx.fillRect((i * 97 + dist * 2) % W, 10 + (i * 31) % (groundY * .5), 2, 2);
  }

  ctx.fillStyle = '#c084fc';
  ctx.beginPath();
  ctx.arc(W * .8, groundY * .2, 40, 0, Math.PI * 2);
  ctx.fill();

  bgTrees.forEach(t => {
    const a = t.layer === 0 ? .15 : .3;
    ctx.globalAlpha = a;
    ctx.fillStyle = '#4c1d95';
    ctx.fillRect(t.x - 4, groundY - t.h, 8, t.h);
    ctx.beginPath();
    ctx.moveTo(t.x, groundY - t.h - 30);
    ctx.lineTo(t.x - 20, groundY - t.h + 10);
    ctx.lineTo(t.x + 20, groundY - t.h + 10);
    ctx.closePath();
    ctx.fill();
  });
  ctx.globalAlpha = 1;

  ctx.fillStyle = '#1e1b4b';
  ctx.fillRect(0, groundY, W, H - groundY);
  ctx.fillStyle = '#312e81';
  ctx.fillRect(0, groundY, W, 3);
}

function drawPlayer() {
  ctx.save();
  ctx.translate(player.x, player.y);
  const h = player.sliding ? player.h * .4 : player.h;
  const w = player.sliding ? player.w * 1.4 : player.w;

  ctx.shadowColor = '#a78bfa';
  ctx.shadowBlur = 20 + Math.sin(player.runFrame) * 8;

  ctx.fillStyle = '#7c3aed';
  ctx.beginPath();
  ctx.ellipse(0, -h / 2, w / 2, h / 2, 0, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#c4b5fd';
  ctx.beginPath();
  ctx.ellipse(0, -h / 2, w / 3, h / 3, 0, 0, Math.PI * 2);
  ctx.fill();

  if (!player.sliding) {
    ctx.fillStyle = '#1e1b4b';
    ctx.beginPath();
    ctx.arc(w * .12, -h * .6, 3 * dpr, 0, Math.PI * 2);
    ctx.arc(-w * .12, -h * .6, 3 * dpr, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#1e1b4b';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(0, -h * .42, 4 * dpr, 0, Math.PI);
    ctx.stroke();
  }

  ctx.shadowColor = '#fde68a';
  ctx.shadowBlur = 16;
  ctx.fillStyle = '#fde68a';
  const wingAngle = Math.sin(player.runFrame * 3) * .4;
  ctx.beginPath();
  ctx.ellipse(-w / 2 - 8, -h * .55, 14, 7, wingAngle, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(w / 2 + 8, -h * .55, 14, 7, -wingAngle, 0, Math.PI * 2);
  ctx.fill();

  ctx.shadowBlur = 0;

  if (player.grounded && !player.sliding) {
    const legOffset = Math.sin(player.runFrame * 4) * 6;
    ctx.strokeStyle = '#7c3aed';
    ctx.lineWidth = 3 * dpr;
    ctx.beginPath();
    ctx.moveTo(-6, 0);
    ctx.lineTo(-6 + legOffset, 8 * dpr);
    ctx.moveTo(6, 0);
    ctx.lineTo(6 - legOffset, 8 * dpr);
    ctx.stroke();
  }

  ctx.restore();
}

function drawObstacle(o) {
  ctx.save();
  if (o.type === 'gap') {
    ctx.fillStyle = '#0c0d2c';
    ctx.fillRect(o.x, groundY, o.w, H - groundY);
    ctx.strokeStyle = '#ef4444';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    ctx.strokeRect(o.x, groundY, o.w, 4);
    ctx.setLineDash([]);
  } else if (o.low) {
    ctx.fillStyle = '#92400e';
    ctx.fillRect(o.x, o.y - o.h, o.w, o.h);
    ctx.fillStyle = '#78350f';
    ctx.fillRect(o.x, o.y - o.h, o.w, 4);
    ctx.fillStyle = '#a16207';
    for (let lx = o.x + 8; lx < o.x + o.w - 6; lx += 14) {
      ctx.beginPath();
      ctx.arc(lx, o.y - o.h - 6, 6, 0, Math.PI * 2);
      ctx.fill();
    }
  } else {
    const color = o.type === 'rock' ? '#6b7280' : o.type === 'log' ? '#78350f' : '#dc2626';
    ctx.fillStyle = color;
    if (o.type === 'rock') {
      ctx.beginPath();
      ctx.moveTo(o.x + o.w / 2, o.y - o.h);
      ctx.lineTo(o.x + o.w, o.y);
      ctx.lineTo(o.x, o.y);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.fillRect(o.x, o.y - o.h, o.w, o.h);
    }
    ctx.fillStyle = 'rgba(0,0,0,.2)';
    ctx.fillRect(o.x, o.y - 4, o.w, 4);
  }
  ctx.restore();
}

function drawDust(d) {
  ctx.save();
  ctx.translate(d.x, d.y + Math.sin(d.bob) * 4);
  ctx.shadowColor = '#fde68a';
  ctx.shadowBlur = 12;
  ctx.fillStyle = '#fde68a';
  ctx.beginPath();
  ctx.arc(0, 0, d.r, 0, Math.PI * 2);
  ctx.fill();
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#fef9c3';
  ctx.font = (12 * dpr) + 'px system-ui';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('✦', 0, 1);
  ctx.restore();
}

function draw() {
  ctx.clearRect(0, 0, W, H);
  drawBg();
  obstacles.forEach(drawObstacle);
  dusts.forEach(drawDust);
  drawPlayer();

  particles.forEach(p => {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
  });
  ctx.globalAlpha = 1;
}

function loop(now) {
  const dt = Math.min(.05, (now - last) / 1000);
  last = now;
  fit();
  update(dt);
  draw();
  if (running || !dead) requestAnimationFrame(loop);
}

let touchStartY = 0;
C.addEventListener('pointerdown', e => {
  if (!running && !dead) { startGame(); return; }
  touchStartY = e.clientY;
  jump();
});
C.addEventListener('pointermove', e => {
  if (!running) return;
  if (e.clientY - touchStartY > 30) slide();
});

document.addEventListener('keydown', e => {
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW') {
    e.preventDefault();
    if (!running && !dead) startGame();
    else jump();
  }
  if (e.code === 'ArrowDown' || e.code === 'KeyS') { e.preventDefault(); slide(); }
});

$('playBtn').onclick = startGame;
$('againBtn').onclick = startGame;
$('jumpBtn').onclick = jump;
$('slideBtn').onclick = slide;
$('soundBtn').onclick = function() {
  const on = localStorage.getItem('soundEnabled') !== 'false';

};
