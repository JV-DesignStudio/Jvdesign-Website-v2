<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Beat Builder Battle | JVDesignStudio</title><link rel="manifest" href="../manifest.json"><meta name="theme-color" content="#4a3472"><meta name="description" content="Build a rhythm lane and tap beats in time against rival patterns."><script src="../game-system.js"></script><link rel="stylesheet" href="../game-system.css"><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#171322;color:#fff}.wrap{max-width:1150px;margin:auto;padding:16px 12px 80px}.pill{color:#fff;background:#0006;border-radius:8px;padding:9px 12px;text-decoration:none;font-weight:900}.top{display:flex;gap:10px;flex-wrap:wrap}.hero{border-bottom:3px solid #f2a541;margin:12px 0}.hero h1{font-size:clamp(2rem,7vw,4.2rem);margin:0}.hud,.game{display:grid;gap:10px}.hud{grid-template-columns:repeat(6,1fr)}.stat,.panel{background:#fff9f2;color:#171322;border:1px solid #d8c9df;border-radius:8px;padding:10px}.game{grid-template-columns:1.1fr .9fr}.lane{position:relative;height:210px;background:#281d3f;border-radius:8px;overflow:hidden;border:1px solid #d8c9df}.hit{position:absolute;left:18%;top:0;bottom:0;width:6px;background:#f2a541}.note{position:absolute;width:34px;height:34px;border-radius:50%;background:#a78bfa;top:40px;display:flex;align-items:center;justify-content:center;font-weight:900}.note.good{background:#6a994e}.note.miss{background:#bc4749}.pads,.build,.goals{display:grid;gap:8px}.pads{grid-template-columns:repeat(4,1fr);margin-top:10px}.pad,.step,.goal{border:1px solid #d8c9df;background:#fff;color:#171322;border-radius:8px;padding:9px;font-weight:900;cursor:pointer}.build{grid-template-columns:repeat(8,1fr);margin:10px 0}.step.on{background:#f7ddff}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}button{font:inherit;font-weight:900;min-height:42px;border-radius:8px;cursor:pointer}.primary{border:0;background:#4a3472;color:#fff}.secondary{border:1px solid #d8c9df;background:#fff;color:#171322}.goal{display:grid;grid-template-columns:auto 1fr;color:#6f6376}.goal.done{background:#eef7df;color:#171322}.log{max-height:230px;overflow:auto;color:#574a62}.result{display:none;background:#eef7df;border-radius:8px;padding:10px}.result.show{display:block}@media(max-width:820px){.game{grid-template-columns:1fr}.hud{grid-template-columns:repeat(3,1fr)}}@media(max-width:520px){.hud,.pads,.actions{grid-template-columns:1fr}.build{grid-template-columns:repeat(4,1fr)}}</style></head><body><div class="wrap"><div class="top"><a class="pill" href="../arcade.html">Back to Arcade</a><a class="pill" href="../games">All games</a></div><section class="hero"><p>Rhythm timing battle</p><h1>Beat Builder Battle</h1><p>Compose an eight-beat loop, press Start, then tap the pads as notes cross the golden hit line. Timing, not menus, wins.</p></section><section class="hud"><div class="stat"><b id="score"></b><span>Score</span></div><div class="stat"><b id="round"></b><span>Round</span></div><div class="stat"><b id="combo"></b><span>Combo</span></div><div class="stat"><b id="acc"></b><span>Accuracy</span></div><div class="stat"><b id="groove"></b><span>Groove</span></div><div class="stat"><b id="best"></b><span>Best</span></div></section><main class="game"><section class="panel"><div class="lane" id="lane"><i class="hit"></i></div><div class="pads" id="pads"></div><h3>Compose Loop</h3><div class="build" id="build"></div><div class="actions"><button class="primary" id="start">Start Round</button><button class="secondary" id="clear">Clear Loop</button><button class="secondary" id="restart">Restart</button></div></section><aside class="panel"><h2 id="rival"></h2><div class="goals" id="goals"></div><div class="result" id="result"></div><h2>Stage Log</h2><div class="log" id="log"></div></aside></main></div><script>
const GAME_ID='beat-builder-battle',runKey='jvds_beat_timing_run',metaKey='jvds_beat_timing_meta',gs=new GameSystem(GAME_ID,'Beat Builder Battle','ember');const sounds=['Kick','Clap','Bell','Chord'];const rivals=[['Pip Bounce',[0,2,4,6]],['Lumo Glow',[1,3,5,7]],['Ember Sync',[0,3,4,7]],['Echo Finale',[0,2,5,7]]];const goals=[['combo','Reach 8 combo',s=>s.bestCombo>=8],['acc','Hit 75 accuracy',s=>s.bestAcc>=75],['finish','Finish all rivals',s=>s.ended]];let meta=read(metaKey,{best:0,goals:{}}),s=read(runKey,null)||fresh(),lane,notes=[],timer=null,beat=Array(8).fill(false),step=0;function fresh(){return{score:0,round:0,combo:0,bestCombo:0,hits:0,total:0,bestAcc:0,groove:50,ended:false,log:['Build a loop, start the round, then tap notes on the hit line.']}}function read(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch(e){return f}}function save(){localStorage.setItem(runKey,JSON.stringify(s));localStorage.setItem(metaKey,JSON.stringify(meta))}function best(){try{return Math.max(meta.best,JSON.parse(localStorage.getItem('jvds_game_'+GAME_ID)||'{}').highScore||0)}catch(e){return meta.best}}function log(m){s.log.unshift(m);s.log=s.log.slice(0,10)}function acc(){return s.total?Math.round(s.hits/s.total*100):0}function scoreGoals(){goals.forEach(([id,,fn])=>{if(fn(s))meta.goals[id]=true})}
function start(){if(timer||s.ended)return;notes=[];step=0;lane.innerHTML='<i class="hit"></i>';const pattern=[...new Set(rivals[s.round][1].concat(beat.map((v,i)=>v?i:null).filter(v=>v!==null)))];pattern.forEach((b,i)=>setTimeout(()=>spawn(b),b*420));timer=setTimeout(endRound,3900);log('Round started. Tap when notes touch the line.')}function spawn(b){const n=document.createElement('button');n.className='note';n.textContent='●';n.style.left='100%';n.style.top=(35+(b%4)*38)+'px';lane.appendChild(n);const obj={el:n,x:100,hit:false};notes.push(obj);const id=setInterval(()=>{obj.x-=2.6;n.style.left=obj.x+'%';if(obj.x<0){clearInterval(id);if(!obj.hit)miss(obj)}},24);obj.id=id}function tap(){if(!timer)return;let target=notes.find(n=>!n.hit&&Math.abs(n.x-18)<9);s.total++;if(target){target.hit=true;target.el.classList.add('good');s.hits++;s.combo++;s.bestCombo=Math.max(s.bestCombo,s.combo);s.score+=120+s.combo*12;s.groove=Math.min(100,s.groove+2)}else{s.combo=0;s.groove=Math.max(0,s.groove-4);s.score=Math.max(0,s.score-20)}render()}function miss(n){n.el.classList.add('miss');s.total++;s.combo=0;s.groove=Math.max(0,s.groove-3);render()}function endRound(){timer=null;s.bestAcc=Math.max(s.bestAcc,acc());if(acc()>=45){s.round++;log('Rival cleared with '+acc()+' accuracy.')}else log('The crowd wants tighter timing. Try the round again.');if(s.round>=rivals.length)finish();scoreGoals();render()}function finish(){s.ended=true;scoreGoals();const final=s.score+s.groove*10+s.bestCombo*80+Object.keys(meta.goals).length*180;meta.best=Math.max(meta.best,final);s.score=final;save();gs.addScore(final);gs.recordGamePlay(Date.now());try{gs.saveState({best:meta.best})}catch(e){}window.jvdsCheckNewBest&&window.jvdsCheckNewBest();log('Set complete. Score '+final+' saved.')}function restart(){s=fresh();beat=Array(8).fill(false);clearTimeout(timer);timer=null;render()}function render(){scoreGoals();document.getElementById('score').textContent=s.score;document.getElementById('round').textContent=s.ended?'Done':(s.round+1)+'/'+rivals.length;document.getElementById('combo').textContent=s.combo;document.getElementById('acc').textContent=acc()+'%';document.getElementById('groove').textContent=s.groove+'%';document.getElementById('best').textContent=best();document.getElementById('rival').textContent=s.ended?'Set complete':rivals[s.round][0];document.getElementById('pads').innerHTML=sounds.map(x=>'<button class="pad">'+x+'</button>').join('');document.getElementById('build').innerHTML=beat.map((v,i)=>'<button class="step '+(v?'on':'')+'" data-step="'+i+'">'+(i+1)+'</button>').join('');document.getElementById('goals').innerHTML=goals.map(([id,t])=>'<div class="goal '+(meta.goals[id]?'done':'')+'"><b>'+(meta.goals[id]?'✓':'○')+'</b><span>'+t+'</span></div>').join('');document.getElementById('log').innerHTML=s.log.map(x=>'<p>'+x+'</p>').join('');document.getElementById('result').className='result'+(s.ended?' show':'');document.getElementById('result').textContent=s.ended?'Final score '+s.score+' - best '+meta.best:'';save()}lane=document.getElementById('lane');document.getElementById('pads').onclick=tap;document.getElementById('build').onclick=e=>{const b=e.target.closest('[data-step]');if(b){beat[+b.dataset.step]=!beat[+b.dataset.step];render()}};document.getElementById('start').onclick=start;document.getElementById('clear').onclick=()=>{beat=Array(8).fill(false);render()};document.getElementById('restart').onclick=restart;render();
</script><script src="../cookie-consent.js" defer></script></body></html>
