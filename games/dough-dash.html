<script>
const gameSystem = new GameSystem('dough-dash', 'Dough Dash', 'squirt');
const audioEffects = new AudioEffects(0.6);
if (localStorage.getItem('soundEnabled') === 'false') audioEffects.setMasterVolume(0);

const TILES = ['🍪', '🧁', '🥐', '🍰', '🍩'];
const TILE_COLORS = {'🍪':'#ff8c42','🧁':'#ff6b9d','🥐':'#ffd93d','🍰':'#6bcb77','🍩':'#a855f7'};
const COLS = 5, ROWS = 8;
const MOVES_LIMIT = 30;

let grid = [];
let state = 'menu';
let score = 0, moves = 0, best = 0;
let selected = null;
let busy = false;   // true while swaps/cascades animate
let startTime = 0;

function randomTileAvoiding(r, c) {
  let t;
  do {
    t = TILES[Math.floor(Math.random() * TILES.length)];
  } while (
    (c >= 2 && grid[r][c-1] && grid[r][c-1].type === t && grid[r][c-2] && grid[r][c-2].type === t) ||
    (r >= 2 && grid[r-1] && grid[r-2] && grid[r-1][c] && grid[r-1][c].type === t && grid[r-2][c] && grid[r-2][c].type === t)
  );
  return {type: t, special: null};
}

function initGrid() {
  grid = [];
  for (let r = 0; r < ROWS; r++) {
    grid[r] = [];
    for (let c = 0; c < COLS; c++) {
      grid[r][c] = randomTileAvoiding(r, c); // returns {type, special}
    }
  }
  score = 0;
  moves = 0;
  selected = null;
  busy = false;
}

function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const btn = document.createElement('button');
      btn.className = 'tile' + (selected && selected.r === r && selected.c === c ? ' selected' : '');
      const cell = grid[r][c];
      if (cell && cell.special === 'bomb') { btn.textContent = '💣'; btn.style.background = 'linear-gradient(145deg,#ff4444,#cc0000)'; }
      else if (cell && cell.special === 'rainbow') { btn.textContent = '🌈'; btn.style.background = 'linear-gradient(145deg,#a855f7,#6366f1)'; }
      else { btn.textContent = cell ? cell.type : ''; btn.style.background = ''; }
      btn.onclick = () => selectTile(r, c);
      board.appendChild(btn);
    }
  }
  updateHud();
}

function updateHud() {
  document.getElementById('scoreHud').textContent = score;
  const left = Math.max(0, MOVES_LIMIT - moves);
  const movesEl = document.getElementById('movesHud');
  movesEl.textContent = left;
  movesEl.parentElement.classList.toggle('low', left <= 5);
  movesDrama(left);
}

function floatText(txt, big) {
  floatTextAt(window.innerWidth / 2, window.innerHeight * 0.38, txt, big);
}
function floatTextAt(x, y, txt, big) {
  const div = document.createElement('div');
  div.className = 'float-pop' + (big ? ' big' : '');
  div.textContent = txt;
  div.style.left = x + 'px';
  div.style.top = y + 'px';
  document.getElementById('wrapper').appendChild(div);
  setTimeout(() => div.remove(), 900);
}

/* ── low-moves drama ── */
let lastMovesLeft = 999;
function movesDrama(left) {
  if (left === 3 && lastMovesLeft > 3) { floatText('3 MOVES LEFT!', true); audioEffects.playTap(300); }
  if (left === 1 && lastMovesLeft > 1) { floatText('LAST MOVE!', true); audioEffects.playTap(220); ScreenShake.shake(document.getElementById('board'), 5, 200); }
  lastMovesLeft = left;
}

/* ── idle hint: glow a valid swap after 7s ── */
let hintTimer = null, hintPair = null;
function clearHint() {
  if (hintTimer) { clearTimeout(hintTimer); hintTimer = null; }
  if (hintPair) {
    const boardEl = document.getElementById('board');
    hintPair.forEach(pt => {
      const el = boardEl.children[pt.r * COLS + pt.c];
      if (el) el.classList.remove('hint');
    });
    hintPair = null;
  }
}
function scheduleHint() {
  clearHint();
  hintTimer = setTimeout(() => {
    if (state !== 'playing' || busy) return;
    const pair = findHintPair();
    if (!pair) return;
    hintPair = pair;
    const boardEl = document.getElementById('board');
    pair.forEach(pt => {
      const el = boardEl.children[pt.r * COLS + pt.c];
      if (el) el.classList.add('hint');
    });
  }, 7000);
}
function findHintPair() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (c < COLS - 1) {
        [grid[r][c], grid[r][c + 1]] = [grid[r][c + 1], grid[r][c]];
        const found = findMatches().size > 0;
        [grid[r][c], grid[r][c + 1]] = [grid[r][c + 1], grid[r][c]];
        if (found) return [{ r, c }, { r, c: c + 1 }];
      }
      if (r < ROWS - 1) {
        [grid[r][c], grid[r + 1][c]] = [grid[r + 1][c], grid[r][c]];
        const found = findMatches().size > 0;
        [grid[r][c], grid[r + 1][c]] = [grid[r + 1][c], grid[r][c]];
        if (found) return [{ r, c }, { r: r + 1, c }];
      }
    }
  }
  return null;
}

function activateBomb(r, c) {
  // Clear 3x3 area around bomb
  for (let dr = -1; dr <= 1; dr++) {
    for (let dc = -1; dc <= 1; dc++) {
      const nr = r + dr, nc = c + dc;
      if (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS && grid[nr][nc]) {
        grid[nr][nc] = null;
      }
    }
  }
  audioEffects.playCombo(4);
  ScreenShake.shake(document.getElementById('board'), 8, 250);
}
function activateRainbow(r, c) {
  // Clear all tiles of the same color
  const targetType = grid[r][c] ? grid[r][c].type : null;
  if (!targetType) return;
  for (let rr = 0; rr < ROWS; rr++) {
    for (let cc = 0; cc < COLS; cc++) {
      if (grid[rr][cc] && grid[rr][cc].type === targetType) grid[rr][cc] = null;
    }
  }
  audioEffects.playCombo(5);
  ScreenShake.shake(document.getElementById('board'), 10, 300);
}
function selectTile(r, c) {
  clearHint(); scheduleHint();
  if (state !== 'playing' || busy || !grid[r][c]) return;
  if (selected && selected.r === r && selected.c === c) {
    selected = null;
    renderBoard();
    return;
  }
  if (!selected) {
    selected = { r, c };
    audioEffects.playTap(500);
    renderBoard();
    return;
  }
  const s = selected;
  const adjacent = (Math.abs(s.r - r) === 1 && s.c === c) || (Math.abs(s.c - c) === 1 && s.r === r);
  if (!adjacent) {
    selected = { r, c };
    audioEffects.playTap(500);
    renderBoard();
    return;
  }
  // Check if either tile is a special
  const sTile = grid[s.r][s.c];
  const tTile = grid[r][c];
  if (sTile && sTile.special === 'bomb') { activateBomb(s.r, s.c); grid[s.r][s.c] = null; selected = null; renderBoard(); return; }
  if (tTile && tTile.special === 'bomb') { activateBomb(r, c); grid[r][c] = null; selected = null; renderBoard(); return; }
  if (sTile && sTile.special === 'rainbow') { activateRainbow(s.r, s.c); grid[s.r][s.c] = null; selected = null; renderBoard(); return; }
  if (tTile && tTile.special === 'rainbow') { activateRainbow(r, c); grid[r][c] = null; selected = null; renderBoard(); return; }
  selected = null;
  doSwap(s, { r, c });
}

function doSwap(a, b) {
  busy = true;
  [grid[a.r][a.c], grid[b.r][b.c]] = [{...grid[b.r][b.c]}, {...grid[a.r][a.c]}];
  renderBoard();
  // swap pulse on both tiles so the exchange reads as a motion, not a teleport
  const board0 = document.getElementById('board');
  [a, b].forEach(pt => {
    const el = board0.children[pt.r * COLS + pt.c];
    if (el) { el.classList.add('swapping'); setTimeout(() => el.classList.remove('swapping'), 170); }
  });
  setTimeout(() => {
    if (resolveMatches(1)) {
      moves++;
      updateHud();
    } else {
      // no match: bounce the swap back, move is not spent
      [grid[a.r][a.c], grid[b.r][b.c]] = [grid[b.r][b.c], grid[a.r][a.c]];
      audioEffects.playError();
      renderBoard();
      const board = document.getElementById('board');
      [a, b].forEach(p => {
        const btn = board.children[p.r * COLS + p.c];
        if (btn) btn.classList.add('bad');
      });
      setTimeout(() => { busy = false; renderBoard(); }, 350);
    }
  }, 170);
}

function findMatches() {
  const toRemove = new Set();
  const specials = []; // {r, c, type}
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS - 2; c++) {
      if (grid[r][c] && grid[r][c+1] && grid[r][c+2] && grid[r][c].type === grid[r][c+1].type && grid[r][c].type === grid[r][c+2].type) {
        let end = c + 2;
        while (end + 1 < COLS && grid[r][end+1] && grid[r][end+1].type === grid[r][c].type) end++;
        for (let i = c; i <= end; i++) toRemove.add(`${r},${i}`);
        if (end - c + 1 >= 5) specials.push({r, c: Math.floor((c + end) / 2), special: 'rainbow'});
        else if (end - c + 1 >= 4) specials.push({r, c: Math.floor((c + end) / 2), special: 'bomb'});
      }
    }
  }
  for (let c = 0; c < COLS; c++) {
    for (let r = 0; r < ROWS - 2; r++) {
      if (grid[r][c] && grid[r+1][c] && grid[r+2][c] && grid[r][c].type === grid[r+1][c].type && grid[r][c].type === grid[r+2][c].type) {
        let end = r + 2;
        while (end + 1 < ROWS && grid[end+1][c] && grid[end+1][c].type === grid[r][c].type) end++;
        for (let i = r; i <= end; i++) toRemove.add(`${i},${c}`);
        if (end - r + 1 >= 5) specials.push({r: Math.floor((r + end) / 2), c, special: 'rainbow'});
        else if (end - r + 1 >= 4) specials.push({r: Math.floor((r + end) / 2), c, special: 'bomb'});
      }
    }
  }
  return {toRemove, specials};
}

function resolveMatches(chain) {
  const {toRemove, specials} = findMatches();
  if (!toRemove.size) return false;
  busy = true;

  // Combo multiplier
  const mult = chain >= 5 ? 3 : chain >= 3 ? 2 : chain >= 2 ? 1.5 : 1;
  const size = toRemove.size;
  let pts = Math.round(size * 10 * chain * mult);
  if (size >= 4) pts += (size - 3) * 20;
  score += pts;
  // float the points right where the match happened
  if (chain === 1) {
    let cx = 0, cy = 0;
    toRemove.forEach(k => { const [r, c] = k.split(',').map(Number); cx += c; cy += r; });
    cx /= size; cy /= size;
    const boardEl = document.getElementById('board');
    const br = boardEl.getBoundingClientRect();
    floatTextAt(br.left + (cx + 0.5) * br.width / COLS, br.top + (cy + 0.5) * br.height / ROWS, '+' + pts);
  }

  const board = document.getElementById('board');
  toRemove.forEach(k => {
    const [r, c] = k.split(',').map(Number);
    const btn = board.children[r * COLS + c];
    if (btn) {
      btn.classList.add('matched');
      const rect = btn.getBoundingClientRect();
      ParticleSystem.burst(rect.left + rect.width / 2, rect.top + rect.height / 2, '✨', 3);
    }
  });

  // Show combo multiplier
  if (mult > 1) {
    const cd = document.getElementById('comboDisplay');
    cd.textContent = '�-' + mult + ' COMBO!';
    cd.classList.add('show');
    setTimeout(() => cd.classList.remove('show'), 1500);
  }
  if (chain >= 2) {
    floatText('CHAIN �-' + chain + '  +' + pts, chain >= 3);
    audioEffects.playCombo(chain);
    if (chain >= 3) ScreenShake.shake(board, 6, 200);
  } else {
    audioEffects.playSuccess(600 + size * 40);
    if (size >= 4) floatText('SWEET! +' + pts, true);
  }
  updateHud();

  setTimeout(() => {
    toRemove.forEach(k => {
      const [r, c] = k.split(',').map(Number);
      grid[r][c] = null;
    });
    cascade();
    // Spawn special tiles from matches
    specials.forEach(sp => {
      if (grid[sp.r] && grid[sp.r][sp.c]) {
        grid[sp.r][sp.c].special = sp.special;
      }
    });
    renderBoard();
    if (!resolveMatches(chain + 1)) {
      busy = false;
      if (moves >= MOVES_LIMIT) endGame();
      else reshuffleIfStuck();
      scheduleHint();
    }
  }, 320);
  return true;
}

function hasAnyMove() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (c < COLS - 1) {
        [grid[r][c], grid[r][c+1]] = [grid[r][c+1], grid[r][c]];
        const found = findMatches().size > 0;
        [grid[r][c], grid[r][c+1]] = [grid[r][c+1], grid[r][c]];
        if (found) return true;
      }
      if (r < ROWS - 1) {
        [grid[r][c], grid[r+1][c]] = [grid[r+1][c], grid[r][c]];
        const found = findMatches().size > 0;
        [grid[r][c], grid[r+1][c]] = [grid[r+1][c], grid[r][c]];
        if (found) return true;
      }
    }
  }
  return false;
}

// Deadlock safety net: cascades/refills can settle into a board with no
// valid swap left. Reshuffle in place until a clean, playable layout
// turns up, rather than softlocking the session (same pattern as
// cozy-cafe-match-game.html's autoReshuffleIfStuck).
function reshuffleIfStuck() {
  if (hasAnyMove()) return;
  floatText('😅 No moves, shuffling!');
  let tries = 0, ok = false;
  do {
    const flat = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) flat.push(grid[r][c]);
    for (let i = flat.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [flat[i], flat[j]] = [flat[j], flat[i]]; }
    let k = 0;
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) grid[r][c] = flat[k++];
    tries++;
    ok = findMatches().size === 0 && hasAnyMove();
  } while (!ok && tries < 60);
  renderBoard();
}

function cascade() {
  for (let c = 0; c < COLS; c++) {
    let write = ROWS - 1;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (grid[r][c]) {
        if (r !== write) grid[write][c] = grid[r][c];
        write--;
      }
    }
    for (let r = 0; r <= write; r++) grid[r][c] = {type: TILES[Math.floor(Math.random() * TILES.length)], special: null};
  }
}

function startGame() {
  document.getElementById('startModal').classList.remove('show');
  document.getElementById('endModal').classList.remove('show');
  lastMovesLeft = 999;
  state = 'playing';
  initGrid();
  renderBoard();
  reshuffleIfStuck();
  startTime = performance.now();
}

function endGame() {
  state = 'over';
  gameSystem.addScore(score);
  gameSystem.addXP(Math.max(3, Math.floor(score / 30)));
  gameSystem.unlockAchievement('firstPlay');
  if (score >= 200) gameSystem.unlockAchievement('matchMaster');
  gameSystem.recordGamePlay(performance.now() - startTime);
  gameSystem.saveState();

  best = Math.max(best, score);
  if (score >= 200) ParticleSystem.confetti(window.innerWidth / 2, window.innerHeight / 3, 16);
  document.getElementById('endTitle').textContent = score >= 200 ? '🎉 Excellent!' : 'Game Over';
  document.getElementById('endSub').textContent = score >= 200 ? 'Master matcher!' : moves >= MOVES_LIMIT ? 'Out of moves!' : 'Nice score!';
  document.getElementById('finalScore').textContent = score.toLocaleString();
  GameUI.countUp(document.getElementById('finalScore'), score);
  document.getElementById('finalBest').textContent = best;
  GameUI.showMedal(document.getElementById('finalScore').closest('.stats'), score, [
    [100, '🥉', 'Bronze Crumb'],
    [250, '🥈', 'Silver Icing'],
    [500, '🥇', 'Gold Crust'],
  ]);
  document.getElementById('endModal').classList.add('show');
}

best = gameSystem.state.highScore || 0;
document.getElementById('bestStart').textContent = best;
document.getElementById('gamesStart').textContent = gameSystem.state.gamesPlayed || 0;
</script>
