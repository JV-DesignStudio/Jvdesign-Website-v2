<html lang="en">
<head>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: linear-gradient(135deg, #ff6b9d 0%, #ff8fab 100%); display: flex; align-items: center; justify-content: center; }
.wrapper { position: relative; width: 100%; height: 100vh; height: 100dvh; max-width: 500px; display: flex; flex-direction: column; padding: env(safe-area-inset-top,0px) env(safe-area-inset-right,0px) env(safe-area-inset-bottom,0px) env(safe-area-inset-left,0px); }

.hud { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; gap: 8px; }
.pills { display: flex; gap: 8px; }
.pill { background: rgba(255,255,255,.15); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 6px 13px; color: #fff; font-weight: 700; font-size: .78rem; display: flex; gap: 5px; align-items: center; }
.pill b { color: #fff; }
.home-btn { width: 42px; height: 42px; border-radius: 12px; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.1); color: #fff; font-size: 1.2rem; cursor: pointer; display: grid; place-items: center; }
.home-btn:active { transform: scale(.92); }

.board { flex: 1; display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 16px; align-content: start; justify-items: center; }
.tile { width: 100%; aspect-ratio: 1; border: none; border-radius: 10px; font-size: 2rem; background: linear-gradient(135deg, #ffe8ee 0%, #ffd1e0 100%); cursor: pointer; box-shadow: 0 4px 12px rgba(0,0,0,.1); transition: transform .1s; }
.tile:active { transform: scale(.92); }
.tile.selected { outline: 3px solid #fff; transform: scale(1.08); box-shadow: 0 0 18px rgba(255,255,255,.7); z-index: 2; }
.tile.matched { animation: pop .3s ease-out forwards; }
@keyframes pop { 0%{transform:scale(1);opacity:1;} 50%{transform:scale(1.25);} 100%{transform:scale(0);opacity:0;} }
.tile.bad { animation: badShake .35s; }
@keyframes badShake { 0%,100%{transform:translateX(0);} 25%{transform:translateX(-6px);} 50%{transform:translateX(6px);} 75%{transform:translateX(-4px);} }
.pill.low b { color: #ff5b6b; }
.float-pop { position: absolute; left: 50%; top: 38%; z-index: 15; pointer-events: none; font-weight: 900; font-size: 1.3rem; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.45); animation: floatPop .9s ease-out forwards; white-space: nowrap; }
.float-pop.big { font-size: 1.7rem; color: #ffd54f; }
@keyframes floatPop { 0%{opacity:0; transform:translate(-50%,-50%) scale(.6);} 20%{opacity:1; transform:translate(-50%,-70%) scale(1.15);} 100%{opacity:0; transform:translate(-50%,-160%) scale(1);} }

.modal { position: absolute; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; padding: 24px; background: rgba(40,10,30,.65); backdrop-filter: blur(5px); }
.modal.show { display: flex; }
.card-modal { background: linear-gradient(165deg, #c2185b, #880e4f); border: 1px solid rgba(255,107,157,.35); border-radius: 22px; padding: 28px 24px; width: 100%; max-width: 330px; text-align: center; box-shadow: 0 24px 60px rgba(0,0,0,.5); }
.card-modal h1 { font-family: 'Fredoka', cursive; font-size: 2rem; color: #fff; margin-bottom: 8px; }
.card-modal .sub { color: #ffb3d9; font-weight: 700; margin-bottom: 14px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 16px 0 18px; }
.stat { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); border-radius: 12px; padding: 10px; }
.stat .l { font-size: .62rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.5); }
.stat .v { font-size: 1.5rem; font-weight: 800; color: #ffb3d9; margin-top: 3px; }
.btn { width: 100%; border: none; border-radius: 14px; padding: 14px; font-weight: 800; font-size: 1rem; cursor: pointer; background: linear-gradient(90deg, #ff6b9d, #ff8fab); color: #fff; box-shadow: 0 8px 18px rgba(255, 107, 157, .4); margin-top: 10px; }
.btn:active { transform: scale(.97); }
.btn.ghost { background: rgba(255,255,255,.08); color: #fff; box-shadow: none; }
.how { text-align: left; background: rgba(255,255,255,.08); border-left: 4px solid #ffb3d9; border-radius: 8px; padding: 12px 14px; margin-bottom: 16px; font-size: .84rem; color: rgba(255,255,255,.85); line-height: 1.6; }
</style>
</head>
<body>
<div class="wrapper" id="wrapper">
  <div class="hud">
    <div class="pills">
      <div class="pill">SCORE <b id="scoreHud">0</b></div>
      <div class="pill">MOVES <b id="movesHud">0</b></div>
    </div>
    <button class="home-btn" onclick="location.href='mobile-games.html'">🏠</button>
  </div>

  <div class="board" id="board"></div>

  <div class="modal show" id="startModal">
    <div class="card-modal">
      <h1>🧁 Dough Dash</h1>
      <div class="sub">Match 3+ tiles to clear</div>
      <div class="how">
        <div>Tap a tile, then tap a neighbour to swap them. Match 3+ in a row or column.</div>
        <div style="margin-top:8px;">Swaps that don't match bounce back for free. Chain cascades for big multipliers — ×2, ×3, ×4! 🔥</div>
      </div>
      <div class="stats">
        <div class="stat"><div class="l">Best Score</div><div class="v" id="bestStart">0</div></div>
        <div class="stat"><div class="l">Games</div><div class="v" id="gamesStart">0</div></div>
      </div>
      <button class="btn" onclick="startGame()">Play</button>
      <button class="btn ghost" onclick="location.href='mobile-games.html'">Back</button>
    </div>
  </div>

  <div class="modal" id="endModal">
    <div class="card-modal">
      <h1 id="endTitle">Game Over</h1>
      <div class="sub" id="endSub">Nice try!</div>
      <div class="stats">
        <div class="stat"><div class="l">Score</div><div class="v" id="finalScore">0</div></div>
        <div class="stat"><div class="l">Best</div><div class="v" id="finalBest">0</div></div>
      </div>
      <button class="btn" onclick="startGame()">Play Again</button>
      <button class="btn ghost" onclick="location.href='mobile-games.html'">Back</button>
    </div>
  </div>
</div>

<script>
const gameSystem = new GameSystem('dough-dash', 'Dough Dash', 'squirt');
const audioEffects = new AudioEffects(0.6);
if (localStorage.getItem('soundEnabled') === 'false') audioEffects.setMasterVolume(0);

const TILES = ['🍪', '🧁', '🥐', '🍰', '🍩'];
const COLS = 5, ROWS = 8;
const MOVES_LIMIT = 30;

let grid = [];
let state = 'menu';
let score = 0, moves = 0, best = 0;
let selected = null;
let busy = false;   // true while swaps/cascades animate
let startTime = 0;

function randomTileAvoiding(r, c) {
  // avoid spawning a ready-made match when filling the board
  let t;
  do {
    t = TILES[Math.floor(Math.random() * TILES.length)];
  } while (
    (c >= 2 && grid[r][c-1] === t && grid[r][c-2] === t) ||
    (r >= 2 && grid[r-1] && grid[r-2] && grid[r-1][c] === t && grid[r-2][c] === t)
  );
  return t;
}

function initGrid() {
  grid = [];
  for (let r = 0; r < ROWS; r++) {
    grid[r] = [];
    for (let c = 0; c < COLS; c++) {
      grid[r][c] = randomTileAvoiding(r, c);
    }
  }
  score = 0;
  moves = 0;
  selected = null;
  busy = false;
}

function renderBoard() {
  const board = document.getElementById('board');
  board.innerHTML = '';
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      const btn = document.createElement('button');
      btn.className = 'tile' + (selected && selected.r === r && selected.c === c ? ' selected' : '');
      btn.textContent = grid[r][c] || '';
      btn.onclick = () => selectTile(r, c);
      board.appendChild(btn);
    }
  }
  updateHud();
}

function updateHud() {
  document.getElementById('scoreHud').textContent = score;
  const left = Math.max(0, MOVES_LIMIT - moves);
  const movesEl = document.getElementById('movesHud');
  movesEl.textContent = left;
  movesEl.parentElement.classList.toggle('low', left <= 5);
}

function floatText(txt, big) {
  const div = document.createElement('div');
  div.className = 'float-pop' + (big ? ' big' : '');
  div.textContent = txt;
  document.getElementById('wrapper').appendChild(div);
  setTimeout(() => div.remove(), 900);
}

function selectTile(r, c) {
  if (state !== 'playing' || busy || !grid[r][c]) return;
  if (selected && selected.r === r && selected.c === c) {
    selected = null;
    renderBoard();
    return;
  }
  if (!selected) {
    selected = { r, c };
    audioEffects.playTap(500);
    renderBoard();
    return;
  }
  const s = selected;
  const adjacent = (Math.abs(s.r - r) === 1 && s.c === c) || (Math.abs(s.c - c) === 1 && s.r === r);
  if (!adjacent) {
    selected = { r, c };
    audioEffects.playTap(500);
    renderBoard();
    return;
  }
  selected = null;
  doSwap(s, { r, c });
}

function doSwap(a, b) {
  busy = true;
  [grid[a.r][a.c], grid[b.r][b.c]] = [grid[b.r][b.c], grid[a.r][a.c]];
  renderBoard();
  setTimeout(() => {
    if (resolveMatches(1)) {
      moves++;
      updateHud();
    } else {
      // no match: bounce the swap back, move is not spent
      [grid[a.r][a.c], grid[b.r][b.c]] = [grid[b.r][b.c], grid[a.r][a.c]];
      audioEffects.playError();
      renderBoard();
      const board = document.getElementById('board');
      [a, b].forEach(p => {
        const btn = board.children[p.r * COLS + p.c];
        if (btn) btn.classList.add('bad');
      });
      setTimeout(() => { busy = false; renderBoard(); }, 350);
    }
  }, 170);
}

function findMatches() {
  const toRemove = new Set();
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS - 2; c++) {
      if (grid[r][c] && grid[r][c] === grid[r][c+1] && grid[r][c] === grid[r][c+2]) {
        for (let i = c; i <= c + 2; i++) toRemove.add(`${r},${i}`);
      }
    }
  }
  for (let c = 0; c < COLS; c++) {
    for (let r = 0; r < ROWS - 2; r++) {
      if (grid[r][c] && grid[r][c] === grid[r+1][c] && grid[r][c] === grid[r+2][c]) {
        for (let i = r; i <= r + 2; i++) toRemove.add(`${i},${c}`);
      }
    }
  }
  return toRemove;
}

function resolveMatches(chain) {
  const toRemove = findMatches();
  if (!toRemove.size) return false;
  busy = true;

  const size = toRemove.size;
  let pts = size * 10 * chain;
  if (size >= 4) pts += (size - 3) * 20;
  score += pts;

  const board = document.getElementById('board');
  toRemove.forEach(k => {
    const [r, c] = k.split(',').map(Number);
    const btn = board.children[r * COLS + c];
    if (btn) {
      btn.classList.add('matched');
      const rect = btn.getBoundingClientRect();
      ParticleSystem.burst(rect.left + rect.width / 2, rect.top + rect.height / 2, '✨', 3);
    }
  });

  if (chain >= 2) {
    floatText('CHAIN ×' + chain + '  +' + pts, chain >= 3);
    audioEffects.playCombo(chain);
    if (chain >= 3) ScreenShake.shake(board, 6, 200);
  } else {
    audioEffects.playSuccess(600 + size * 40);
    if (size >= 4) floatText('SWEET! +' + pts, true);
  }
  updateHud();

  setTimeout(() => {
    toRemove.forEach(k => {
      const [r, c] = k.split(',').map(Number);
      grid[r][c] = null;
    });
    cascade();
    renderBoard();
    if (!resolveMatches(chain + 1)) {
      busy = false;
      if (moves >= MOVES_LIMIT) endGame();
      else reshuffleIfStuck();
    }
  }, 320);
  return true;
}

function hasAnyMove() {
  for (let r = 0; r < ROWS; r++) {
    for (let c = 0; c < COLS; c++) {
      if (c < COLS - 1) {
        [grid[r][c], grid[r][c+1]] = [grid[r][c+1], grid[r][c]];
        const found = findMatches().size > 0;
        [grid[r][c], grid[r][c+1]] = [grid[r][c+1], grid[r][c]];
        if (found) return true;
      }
      if (r < ROWS - 1) {
        [grid[r][c], grid[r+1][c]] = [grid[r+1][c], grid[r][c]];
        const found = findMatches().size > 0;
        [grid[r][c], grid[r+1][c]] = [grid[r+1][c], grid[r][c]];
        if (found) return true;
      }
    }
  }
  return false;
}

// Deadlock safety net: cascades/refills can settle into a board with no
// valid swap left. Reshuffle in place until a clean, playable layout
// turns up, rather than softlocking the session (same pattern as
// cozy-cafe-match-game.html's autoReshuffleIfStuck).
function reshuffleIfStuck() {
  if (hasAnyMove()) return;
  floatText('😅 No moves, shuffling!');
  let tries = 0, ok = false;
  do {
    const flat = [];
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) flat.push(grid[r][c]);
    for (let i = flat.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [flat[i], flat[j]] = [flat[j], flat[i]]; }
    let k = 0;
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) grid[r][c] = flat[k++];
    tries++;
    ok = findMatches().size === 0 && hasAnyMove();
  } while (!ok && tries < 60);
  renderBoard();
}

function cascade() {
  for (let c = 0; c < COLS; c++) {
    let write = ROWS - 1;
    for (let r = ROWS - 1; r >= 0; r--) {
      if (grid[r][c]) {
        if (r !== write) grid[write][c] = grid[r][c];
        write--;
      }
    }
    for (let r = 0; r <= write; r++) grid[r][c] = TILES[Math.floor(Math.random() * TILES.length)];
  }
}

function startGame() {
  document.getElementById('startModal').classList.remove('show');
  document.getElementById('endModal').classList.remove('show');
  state = 'playing';
  initGrid();
  renderBoard();
  reshuffleIfStuck();
  startTime = performance.now();
}

function endGame() {
  state = 'over';
  gameSystem.addScore(score);
  gameSystem.addXP(Math.max(3, Math.floor(score / 30)));
  gameSystem.unlockAchievement('firstPlay');
  if (score >= 200) gameSystem.unlockAchievement('matchMaster');
  gameSystem.recordGamePlay(performance.now() - startTime);
  gameSystem.saveState();

  best = Math.max(best, score);
  if (score >= 200) ParticleSystem.confetti(window.innerWidth / 2, window.innerHeight / 3, 16);
  document.getElementById('endTitle').textContent = score >= 200 ? '🎉 Excellent!' : 'Game Over';
  document.getElementById('endSub').textContent = score >= 200 ? 'Master matcher!' : moves >= MOVES_LIMIT ? 'Out of moves!' : 'Nice score!';
  document.getElementById('finalScore').textContent = score.toLocaleString();
  GameUI.countUp(document.getElementById('finalScore'), score);
  document.getElementById('finalBest').textContent = best;
  GameUI.showMedal(document.getElementById('finalScore').closest('.stats'), score, [
    [100, '🥉', 'Bronze Crumb'],
    [250, '🥈', 'Silver Icing'],
    [500, '🥇', 'Gold Crust'],
  ]);
  document.getElementById('endModal').classList.add('show');
}

best = gameSystem.state.highScore || 0;
document.getElementById('bestStart').textContent = best;
document.getElementById('gamesStart').textContent = gameSystem.state.gamesPlayed || 0;
</script>
</body>
</html>
