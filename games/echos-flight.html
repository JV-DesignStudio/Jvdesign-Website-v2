<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: linear-gradient(180deg, #0d0d12 0%, #08080c 100%);
  display: flex;
  align-items: center;
  justify-content: center;
}

.wrapper { width: 100%; height: 100vh; height: 100dvh; display: flex; flex-direction: column; max-width: 600px; }
canvas { flex: 1; width: 100%; background: linear-gradient(180deg, #87CEEB 0%, #E0F6FF 100%); image-rendering: pixelated; }

.hud {
  position: fixed; top: 16px; left: 16px; right: 16px; z-index: 100;
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
}

.pill {
  background: rgba(20, 14, 38, 0.8); border: 1px solid rgba(112, 163, 167, 0.3);
  border-radius: 999px; padding: 8px 16px; font-size: 0.875rem; font-weight: 700;
  backdrop-filter: blur(8px); color: white; display: flex; gap: 6px; align-items: center;
}

.pill-label { font-size: 0.75rem; opacity: 0.6; text-transform: uppercase; }
.pill-value { font-size: 1.1rem; font-weight: 800; color: #3EC9A7; }

.modal {
  position: fixed; inset: 0; background: rgba(8, 8, 12, 0.85); backdrop-filter: blur(4px);
  display: flex; align-items: center; justify-content: center; z-index: 200;
  opacity: 0; pointer-events: none; transition: opacity 300ms;
}

.modal.show { opacity: 1; pointer-events: auto; }

.modal-box {
  background: #0d0d12; border: 1px solid rgba(62, 201, 167, 0.3); border-radius: 18px;
  padding: 32px 28px; max-width: 500px; width: 90%; text-align: center;
  box-shadow: 0 10px 40px rgba(8, 8, 12, 0.5); animation: pop 300ms ease-out;
}

@keyframes pop {
  from { opacity: 0; transform: scale(0.9); }
  to { opacity: 1; transform: scale(1); }
}

.title { font-family: 'Fredoka', cursive; font-size: 2rem; color: white; margin-bottom: 8px; }
.subtitle { font-size: 0.9rem; color: #3EC9A7; margin-bottom: 16px; }
.text { font-size: 0.9rem; color: rgba(255, 255, 255, 0.7); line-height: 1.6; margin-bottom: 16px; }

.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
.stat {
  background: rgba(62, 201, 167, 0.1); border: 1px solid rgba(62, 201, 167, 0.3);
  border-radius: 10px; padding: 12px;
}
.stat-label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: rgba(255, 255, 255, 0.4); }
.stat-value { font-size: 1.5rem; font-weight: 800; color: #3EC9A7; margin-top: 4px; }

.btn {
  display: inline-flex; align-items: center; justify-content: center;
  padding: 12px 24px; border-radius: 10px; font-weight: 700;
  border: none; cursor: pointer; text-transform: uppercase; margin: 6px;
  transition: all 150ms;
}

.btn-primary {
  background: linear-gradient(135deg, #3EC9A7, #2DB898);
  color: white; box-shadow: 0 4px 12px rgba(62, 201, 167, 0.3);
}

.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(62, 201, 167, 0.4); }

.btn-secondary {
  background: rgba(255, 255, 255, 0.08); color: white;
  border: 1px solid rgba(255, 255, 255, 0.1);
}

.btn-secondary:hover { background: rgba(255, 255, 255, 0.12); }

@media (max-width: 480px) {
  .modal-box { padding: 20px 16px; }
  .title { font-size: 1.5rem; }
}

<body>
<div class="wrapper">
  <div class="hud">
    <div style="display: flex; gap: 8px;">
      <div class="pill">
        <span class="pill-label">Score</span>
        <span class="pill-value" id="scoreHud">0</span>
      </div>
      <div class="pill">
        <span class="pill-label">Level</span>
        <span class="pill-value" id="levelHud">1</span>
      </div>
    </div>
    <button style="width: 48px; height: 48px; padding: 0; font-size: 1.5rem; background: rgba(62,201,167,0.2); border: 1px solid rgba(62,201,167,0.3); border-radius: 10px; cursor: pointer; color: white;" onclick="goHome()">🏠</button>
  </div>
  <canvas id="canvas"></canvas>
</div>

<div class="modal show" id="startModal">
  <div class="modal-box">
    <div class="title">🦗 Echo's Flight</div>
    <div class="subtitle">Help Echo dodge the pipes!</div>
    <div class="text">Tap to flap your wings and stay in the middle. Avoid the pipes and beat your high score!</div>
    <div class="stats">
      <div class="stat">
        <div class="stat-label">Best Score</div>
        <div class="stat-value" id="bestHud">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Games Played</div>
        <div class="stat-value" id="gamesHud">0</div>
      </div>
    </div>
    <button class="btn btn-primary" onclick="startGame()" style="width: 100%; margin-top: 16px;">Play Now</button>
  </div>
</div>

<div class="modal" id="gameOverModal">
  <div class="modal-box">
    <div class="title">Game Over!</div>
    <div class="subtitle" id="finalScore">Score: 0</div>
    <div class="stats">
      <div class="stat">
        <div class="stat-label">High Score</div>
        <div class="stat-value" id="highHud">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">XP Earned</div>
        <div class="stat-value" id="xpHud">0</div>
      </div>
    </div>
    <div>
      <button class="btn btn-primary" onclick="startGame()">Play Again</button>
      <button class="btn btn-secondary" onclick="goHome()">Home</button>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// Setup canvas
canvas.width = 400;
canvas.height = 600;

// Game vars
let isRunning = false;
let isGameStarting = true;
let startupDelay = 1500; // 1.5 second delay before first pipe
let score = 0;
let gameStartTime = 0;

// Player
const player = {
  x: 50,
  y: 200,
  w: 30,
  h: 30,
  vy: 0,
  gravity: 0.12,
  jumpPower: -5,
  maxFall: 7
};

// Pipes
let pipes = [];
const pipeGap = 180;
const pipeWidth = 70;
const pipeSpeed = 2.5;
const pipeInterval = 2500; // ms
let nextPipeTime = 0;

// Game system
const gameSystem = new GameSystem('echo-flight', 'Echo\'s Flight', 'echo');

function goHome() {
  window.location.href = '/games/mobile-games.html';
}

function startGame() {
  document.getElementById('startModal').classList.remove('show');
  document.getElementById('gameOverModal').classList.remove('show');

  isRunning = true;
  isGameStarting = true;
  score = 0;
  pipes = [];
  gameStartTime = Date.now();
  nextPipeTime = Date.now() + startupDelay + 1000; // Delay before first pipe

  player.y = 200;
  player.vy = 0;

  gameSystem.resetState();
  updateHud();
  gameLoop();
}

function endGame() {
  isRunning = false;

  const xpGained = Math.floor(score / 5);
  gameSystem.addScore(score);
  gameSystem.addXP(xpGained);
  gameSystem.unlockAchievement('firstFlight');
  if (score >= 50) gameSystem.unlockAchievement('score50');
  if (score >= 100) gameSystem.unlockAchievement('score100');
  gameSystem.checkAchievements();
  gameSystem.recordGamePlay(Date.now() - gameStartTime);
  gameSystem.saveState();

  document.getElementById('finalScore').textContent = `Score: ${score}`;
  document.getElementById('highHud').textContent = gameSystem.state.highScore;
  document.getElementById('xpHud').textContent = xpGained;
  document.getElementById('gameOverModal').classList.add('show');
}

function updateHud() {
  document.getElementById('scoreHud').textContent = score;
  document.getElementById('levelHud').textContent = gameSystem.state.level;
  document.getElementById('bestHud').textContent = gameSystem.state.highScore;
  document.getElementById('gamesHud').textContent = gameSystem.state.gamesPlayed;
}

// Handle input
document.addEventListener('click', () => {
  if (isRunning) player.vy = player.jumpPower;
});

document.addEventListener('touchstart', () => {
  if (isRunning) player.vy = player.jumpPower;
}, false);

canvas.addEventListener('click', () => {
  if (isRunning) player.vy = player.jumpPower;
});

function update() {
  if (!isRunning) return;

  // Physics
  player.vy += player.gravity;
  player.vy = Math.min(player.vy, player.maxFall);
  player.y += player.vy;

  // Bounds
  if (player.y + player.h > canvas.height || player.y < 0) {
    endGame();
    return;
  }

  // Check if startup delay has passed
  if (isGameStarting && Date.now() - gameStartTime > startupDelay) {
    isGameStarting = false;
  }

  // Generate pipes (but only after startup delay)
  if (!isGameStarting && Date.now() > nextPipeTime) {
    const minY = 60;
    const maxY = canvas.height - pipeGap - 60;
    const randomY = Math.random() * (maxY - minY) + minY;

    pipes.push({
      x: canvas.width,
      gapTop: randomY,
      gapBottom: randomY + pipeGap,
      scored: false
    });

    nextPipeTime = Date.now() + pipeInterval;
  }

  // Update pipes
  for (let i = pipes.length - 1; i >= 0; i--) {
    pipes[i].x -= pipeSpeed;

    // Scoring
    if (!pipes[i].scored && pipes[i].x + pipeWidth < player.x) {
      pipes[i].scored = true;
      score += 10;
      updateHud();
    }

    // Remove off-screen
    if (pipes[i].x + pipeWidth < 0) {
      pipes.splice(i, 1);
    }
  }

  // Collision
  for (let pipe of pipes) {
    const playerLeft = player.x;
    const playerRight = player.x + player.w;
    const playerTop = player.y;
    const playerBottom = player.y + player.h;

    const pipeLeft = pipe.x;
    const pipeRight = pipe.x + pipeWidth;

    // Check if player is in pipe's x range
    if (playerRight > pipeLeft && playerLeft < pipeRight) {
      // Check if player hits top or bottom pipe
      if (playerTop < pipe.gapTop || playerBottom > pipe.gapBottom) {
        endGame();
        return;
      }
    }
  }
}

function draw() {
  // Sky gradient
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, '#87CEEB');
  grad.addColorStop(1, '#E0F6FF');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Pipes
  ctx.fillStyle = '#2d5a2d';
  for (let pipe of pipes) {
    ctx.fillRect(pipe.x, 0, pipeWidth, pipe.gapTop);
    ctx.fillRect(pipe.x, pipe.gapBottom, pipeWidth, canvas.height - pipe.gapBottom);

    ctx.strokeStyle = '#1a3a1a';
    ctx.lineWidth = 2;
    ctx.strokeRect(pipe.x, 0, pipeWidth, pipe.gapTop);
    ctx.strokeRect(pipe.x, pipe.gapBottom, pipeWidth, canvas.height - pipe.gapBottom);
  }

  // Player
  ctx.font = '40px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🦗', player.x + player.w / 2, player.y + player.h / 2);

  // Score
  ctx.font = 'bold 24px Arial';
  ctx.fillStyle = '#000';
  ctx.textAlign = 'left';
  ctx.fillText(score, 20, 40);
}

function gameLoop() {
  update();
  draw();

  if (isRunning) {
    requestAnimationFrame(gameLoop);
  }
}

// Initial draw
updateHud();
draw();
</script>
</body>
