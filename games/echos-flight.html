      <div class="stats">
        <div class="stat"><div class="l">Score</div><div class="v" id="finalScore">0</div></div>
        <div class="stat"><div class="l">Best</div><div class="v" id="finalBest">0</div></div>
      </div>

<script>
const gameSystem = new GameSystem('echo-flight', "Echo's Flight", 'echo');
const audioEffects = new AudioEffects(0.7);
if (localStorage.getItem('soundEnabled') === 'false') audioEffects.setMasterVolume(0);

const wrap = document.getElementById('wrapper');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W = 0, H = 0, dpr = 1;
function resize() {
  W = wrap.clientWidth; H = wrap.clientHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ── Tunables (in CSS px & seconds; frame-rate independent) ──
const GRAVITY = 2100;      // px/s²
const FLAP_V = -560;       // px/s impulse
const MAX_FALL = 780;
const GROUND_H = 70;
let birdR = 17;

const bird = { x: 0, y: 0, vy: 0, rot: 0, wing: 0 };
let pipes = [];
let clouds = [];
let particles = [];
let collectibles = [];
let powerUps = [];
let activePowers = {shield:false,slowmo:false};
let powerTimer = null;
let combo = 0, comboTimer = 0;

let state = 'idle';        // idle | playing | dead
let score = 0, best = 0;
let streak = 0;
let pipeSpeed = 165;
let pipeGap = 0;
let spawnDist = 0;
let distSinceSpawn = 0;
const pipeMargin = 46;
let startedAt = 0;
let flashT = 0, shakeT = 0, shakeMag = 0;

function reset() {
  birdR = Math.max(14, Math.min(20, W * 0.045));
  bird.x = W * 0.30; bird.y = H * 0.42; bird.vy = 0; bird.rot = 0; bird.wing = 0;
  pipes = []; particles = []; collectibles = []; powerUps = []; combo = 0; comboTimer = 0;
  activePowers = {shield:false,slowmo:false}; if(powerTimer)clearTimeout(powerTimer);
  score = 0;
  streak = 0;
  pipeSpeed = 165;
  pipeGap = Math.max(H * 0.30, birdR * 7.5);
  spawnDist = Math.max(W * 0.62, 210);
  distSinceSpawn = spawnDist * 0.7;   // first pipe comes a touch sooner than a full gap
  best = gameSystem.state.highScore || 0;
  document.getElementById('scoreHud').textContent = '0';
  document.getElementById('bestHud').textContent = best;
  document.getElementById('streakPill').style.display = 'none';
  makeClouds();
}

function makeClouds() {
  clouds = [];
  for (let i = 0; i < 5; i++) clouds.push({ x: Math.random() * W, y: Math.random() * H * 0.5, s: 0.4 + Math.random() * 0.7, sp: 8 + Math.random() * 16 });
}

function spawnPipe() {
  // margin defined as pipeMargin
  const minTop = margin;
  const maxTop = H - GROUND_H - pipeGap - margin;
  const top = minTop + Math.random() * Math.max(20, maxTop - minTop);
  pipes.push({ x: W + 40, top: top, gap: pipeGap, scored: false });
}

function activatePower(type) {
  if (type === "shield") {
    activePowers.shield = true;
    if (powerTimer) clearTimeout(powerTimer);
    powerTimer = setTimeout(() => { activePowers.shield = false; }, 10000);
  } else if (type === "slowmo") {
    activePowers.slowmo = true;
    if (powerTimer) clearTimeout(powerTimer);
    powerTimer = setTimeout(() => { activePowers.slowmo = false; }, 8000);
  }
}
function flap() {
  if (state !== 'playing') return;
  bird.vy = FLAP_V;
  bird.wing = 1;
  audioEffects.playTap(680);
  for (let i = 0; i < 4; i++) particles.push({ x: bird.x - birdR, y: bird.y + birdR * 0.5, vx: -40 - Math.random() * 60, vy: 40 + Math.random() * 60, life: 0.4, r: 2 + Math.random() * 2, c: 'rgba(255,255,255,0.8)' });
}

function startGame() {
  document.getElementById('startModal').classList.remove('show');
  document.getElementById('overModal').classList.remove('show');
  resize();
  reset();
  state = 'playing';
  startedAt = performance.now();
  document.getElementById('tapHint').classList.add('show');
  bird.vy = FLAP_V * 0.6;
}

function die() {
  if (state !== 'playing') return;
  state = 'dead';
  flashT = 0.12; shakeT = 0.35; shakeMag = 10;
  audioEffects.playError();
  for (let i = 0; i < 16; i++) particles.push({ x: bird.x, y: bird.y, vx: (Math.random()-0.5)*360, vy: (Math.random()-0.5)*360, life: 0.6, r: 2 + Math.random()*3, c: 'rgba(255,120,150,0.9)' });

  const xp = Math.floor(score * 2);
  if (score > (gameSystem.state.highScore || 0)) gameSystem.state.highScore = score;
  window.__gsBestRun = Math.max(window.__gsBestRun || 0, score);
  GameUI.showMedal(document.querySelector('.medal'), score, [[5,'\uD83E\uDD49','Fledgling'],[15,'\uD83E\uDD48','Soarer'],[30,'\uD83C\uDFC6','Sky Legend']]);
  gameSystem.addXP(xp);
  gameSystem.unlockAchievement('firstFlight');
  if (score >= 10) gameSystem.unlockAchievement('score10');
  if (score >= 25) gameSystem.unlockAchievement('score25');
  if (score >= 50) gameSystem.unlockAchievement('score50');
  gameSystem.recordGamePlay(performance.now() - startedAt);
  gameSystem.saveState();

  const isBest = score >= (gameSystem.state.highScore || 0);
  let medal = '🥉', title = 'Nice flight!';
  if (score >= 40) { medal = '🏆'; title = 'Legendary!'; }
  else if (score >= 25) { medal = '🥇'; title = 'Gold!'; }
  else if (score >= 12) { medal = '🥈'; title = 'Silver!'; }
  else if (score >= 5) { medal = '🥉'; title = 'Bronze!'; }
  else { medal = '🪶'; title = 'Keep going!'; }

  setTimeout(() => {
    document.getElementById('medal').textContent = medal;
    document.getElementById('overTitle').textContent = 'Game Over';
    document.getElementById('overSub').textContent = isBest && score > 0 ? 'New best score! ' + title : title;
    document.getElementById('finalScore').textContent = score;
    document.getElementById('finalBest').textContent = gameSystem.state.highScore;
    document.getElementById('overModal').classList.add('show');
    if (score >= 12) ParticleSystem.confetti(window.innerWidth/2, window.innerHeight/3, 16);
  }, 550);
}

// ── input ── (only the play area flaps; buttons handle their own clicks)
function onPress(e) {
  if (state === 'playing') { e.preventDefault(); flap(); }
}
canvas.addEventListener('pointerdown', onPress);
window.addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); flap(); } });

// ── loop ──
let last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05;   // clamp after tab-switch/hitch
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

function update(dt) {
  // clouds always drift
  clouds.forEach(c => { c.x -= c.sp * dt; if (c.x < -60) { c.x = W + 40; c.y = Math.random() * H * 0.5; } });

  // particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 400 * dt; p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  if (flashT > 0) flashT -= dt;
  if (shakeT > 0) shakeT -= dt;

  if (state !== 'playing') { if (state === 'dead') { bird.vy = Math.min(bird.vy + GRAVITY*dt, MAX_FALL); bird.y = Math.min(bird.y + bird.vy*dt, H - GROUND_H - birdR); } return; }

  // hide hint after the first couple of seconds
  if (performance.now() - startedAt > 1600) document.getElementById('tapHint').classList.remove('show');

  // bird physics
  bird.vy = Math.min(bird.vy + GRAVITY * dt, MAX_FALL);
  bird.y += bird.vy * dt;
  bird.rot = Math.max(-0.5, Math.min(1.4, bird.vy / 620));
  if (bird.wing > 0) bird.wing = Math.max(0, bird.wing - dt * 5);

  // difficulty ramp
  let baseSpeed = 165 + Math.min(score * 4.5, 130);
  if (activePowers.slowmo) baseSpeed *= 0.55;
  pipeSpeed = baseSpeed;
  pipeGap = Math.max(H * 0.18, H * 0.30 - score * 1.2);

  // spawn pipes by distance
  distSinceSpawn += pipeSpeed * dt;
  if (distSinceSpawn >= spawnDist) { distSinceSpawn = 0; spawnPipe();
    if (Math.random() < 0.6 && pipes.length > 0) {
      const lastP = pipes[pipes.length-1];
      const gapCenter = lastP.top + lastP.gap/2;
      const fy = gapCenter + (Math.random()-0.5) * lastP.gap * 0.4;
      collectibles.push({x: W + 40 + lastP.gap/2, y: fy, type: Math.random()<0.15?"power":"fish", collected:false});
    }
    if (score > 10 && Math.random() < 0.1) {
      const py = 46 + Math.random() * (H - GROUND_H - 92);
      const ptypes = ["shield","slowmo"];
      powerUps.push({x: W + 40, y: py, type: ptypes[Math.floor(Math.random()*ptypes.length)]});
    }
  }

  for (let i = collectibles.length - 1; i >= 0; i--) {
    const c = collectibles[i];
    c.x -= pipeSpeed * dt;
    if (c.x < -30) { collectibles.splice(i,1); continue; }
    if (!c.collected) {
      const dx = bird.x - c.x, dy = bird.y - c.y;
      if (Math.hypot(dx,dy) < birdR + 12) {
        c.collected = true;
        if (c.type === "power") {
          activatePower("shield");
          audioEffects.playPowerup();
          ParticleSystem.burst(c.x, c.y, "star", 6);
        } else {
          const mult = activePowers.slowmo ? 2 : 1;
          score += 3 * mult;
          audioEffects.playTap(1100);
          ParticleSystem.burst(c.x, c.y, "coin", 4);
        }
        const hud=document.getElementById("scoreHud"); hud.textContent = score;
      }
    }
  }
  for (let i = powerUps.length - 1; i >= 0; i--) {
    const p = powerUps[i];
    p.x -= pipeSpeed * dt;
    if (p.x < -30) { powerUps.splice(i,1); continue; }
    const dx = bird.x - p.x, dy = bird.y - p.y;
    if (Math.hypot(dx,dy) < birdR + 16) {
      activatePower(p.type);
      audioEffects.playPowerup();
      ParticleSystem.burst(p.x, p.y, p.type==="shield"?"shield":"clock", 6);
      powerUps.splice(i,1);
    }
  }
  if (comboTimer > 0) { comboTimer -= dt; if (comboTimer <= 0) combo = 0; }

  // move pipes + scoring + collision
  for (let i = pipes.length - 1; i >= 0; i--) {
    const p = pipes[i];
    p.x -= pipeSpeed * dt;
    if (!p.scored && p.x + PIPE_W < bird.x - birdR) {
      p.scored = true;
      const gapCenter = p.top + p.gap / 2;
      const perfect = Math.abs(bird.y - gapCenter) < p.gap * 0.22;
      if (perfect) { combo++; comboTimer = 2.5; streak++; } else { combo = 0; streak = 0; }
      const mult = combo >= 10 ? 3 : combo >= 5 ? 2 : combo >= 3 ? 1.5 : 1;
      const pts = Math.round(1 * mult);
      score += pts;
      const streakPill = document.getElementById('streakPill');
      if (combo >= 3) { streakPill.style.display = ''; document.getElementById('streakHud').textContent = "x" + combo + " (" + mult + "x)"; }
      else if (streak >= 2) { streakPill.style.display = ''; document.getElementById('streakHud').textContent = streak; }
      else streakPill.style.display = 'none';
      const hud=document.getElementById('scoreHud'); hud.textContent = score; hud.animate([{transform:'scale(1.14)'},{transform:'scale(1)'}],{duration:140,easing:'ease-out'});
      audioEffects.playSuccess(880 + Math.min(score, 20) * 20);
      // Pipe-pass feedback: a small puff normally, a bigger gold burst on a
      // perfect (dead-center) pass, and a shake pulse once the streak is hot.
      const passN = perfect ? 8 : 3;
      const passColor = perfect ? 'rgba(255,215,90,0.9)' : 'rgba(62,201,167,0.75)';
      for (let k = 0; k < passN; k++) particles.push({ x: bird.x, y: bird.y, vx: (Math.random()-0.5)*160, vy: (Math.random()-0.5)*160, life: 0.35, r: 1.5 + Math.random()*2, c: passColor });
      if (streak >= 3) { shakeT = 0.12; shakeMag = 3; }
      if (score > (gameSystem.state.highScore || 0)) document.getElementById('bestHud').textContent = score;
    }
    if (p.x + PIPE_W < -20) pipes.splice(i, 1);
  }

  // collision: ground/ceiling
  if (bird.y + birdR >= H - GROUND_H) { bird.y = H - GROUND_H - birdR; die(); return; }
  if (bird.y - birdR <= 0) { bird.y = birdR; bird.vy = 0; }

  // collision: pipes (circle vs the two rects)
  for (const p of pipes) {
    if (bird.x + birdR > p.x && bird.x - birdR < p.x + PIPE_W) {
      if (bird.y - birdR < p.top || bird.y + birdR > p.top + p.gap) { die(); return; }
    }
  }
}

const PIPE_W = 66;
function draw() {
  ctx.save();
  if (shakeT > 0) { const k = shakeT / 0.35; ctx.translate((Math.random()-0.5)*shakeMag*k, (Math.random()-0.5)*shakeMag*k); }

  // deep water
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#08425e'); sky.addColorStop(0.55, '#0e6e8e'); sky.addColorStop(1, '#17a3ad');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);
  // vignette
  const vig = ctx.createRadialGradient(W/2, H/2, Math.min(W,H)*0.3, W/2, H/2, Math.max(W,H)*0.9);
  vig.addColorStop(0, 'rgba(0,0,0,0)'); vig.addColorStop(1, 'rgba(4,20,30,.42)'); ctx.fillStyle = vig; ctx.fillRect(0,0,W,H);

  // swaying light shafts from the surface
  const tNow = performance.now() * 0.001;
  for (let i = 0; i < 3; i++) {
    const bx = W * (0.18 + i * 0.3) + Math.sin(tNow * 0.35 + i * 2.1) * 26;
    ctx.save();
    ctx.globalAlpha = 0.12;
    ctx.fillStyle = '#bdf3e8';
    ctx.beginPath();
    ctx.moveTo(bx - 14, -10); ctx.lineTo(bx + 14, -10);
    ctx.lineTo(bx + 60 + i * 18, H); ctx.lineTo(bx - 60 - i * 18, H);
    ctx.closePath(); ctx.fill();
    ctx.restore();
  }

  // bubble clusters
  clouds.forEach(c => drawCloud(c.x, c.y, c.s));

  // collectibles
  collectibles.forEach(c => {
    if (c.collected) return;
    ctx.save();
    ctx.font = (c.type==="power"?"20":"16") + "px serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    if (c.type === "power") { ctx.shadowColor = "#ffd700"; ctx.shadowBlur = 12; }
    ctx.fillText(c.type==="power"?"🌟":"🐟", c.x, c.y);
    ctx.restore();
  });
  // power-ups
  powerUps.forEach(p => {
    ctx.save();
    ctx.font = "18px serif";
    ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.shadowColor = p.type==="shield"?"#64c8ff":"#c864ff";
    ctx.shadowBlur = 10;
    ctx.fillText(p.type==="shield"?"🛡️":"⏳", p.x, p.y);
    ctx.restore();
  });
  // pipes
  pipes.forEach(p => drawPipe(p));

  // ground
  drawGround();

  // particles with glow
  particles.forEach(p => { ctx.globalAlpha = Math.max(0, p.life * 1.6); ctx.fillStyle = p.c; ctx.shadowBlur = p.r*1.8; ctx.shadowColor = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill(); ctx.shadowBlur = 0; });
  ctx.globalAlpha = 1;

  // bird shadow
  ctx.fillStyle = 'rgba(0,0,0,.14)'; ctx.beginPath(); ctx.ellipse(bird.x+6, bird.y+birdR+8, birdR*0.7, birdR*0.18, 0,0,Math.PI*2); ctx.fill();
  // bird
  drawBird();

  // hit flash
  if (flashT > 0) { ctx.fillStyle = `rgba(190,245,255,${Math.max(0, flashT/0.12)*0.32})`; ctx.fillRect(0, 0, W, H); }

  ctx.restore();
}

function drawCloud(x, y, s) {
  // bubble cluster
  ctx.strokeStyle = 'rgba(190,240,230,0.5)'; ctx.lineWidth = 1.5;
  const bub = (bx, by, br) => {
    ctx.fillStyle = 'rgba(190,240,230,0.14)';
    ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(bx, by, br, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = 'rgba(255,255,255,0.55)';
    ctx.beginPath(); ctx.arc(bx - br*0.35, by - br*0.35, br*0.22, 0, Math.PI*2); ctx.fill();
  };
  bub(x, y, 12*s); bub(x + 22*s, y + 6*s, 8*s); bub(x + 12*s, y - 12*s, 6*s); bub(x + 34*s, y - 4*s, 5*s);
}

function drawPipe(p) {
  // kelp column: soft rounded pillar with leaf nubs (collision box unchanged)
  const grad = ctx.createLinearGradient(p.x, 0, p.x + PIPE_W, 0);
  grad.addColorStop(0, '#166357'); grad.addColorStop(0.5, '#2ea08a'); grad.addColorStop(1, '#124f46');
  const r = 14;
  ctx.fillStyle = grad;
  const by = p.top + p.gap;
  // top column (hangs from the surface, rounded tip at the bottom)
  ctx.beginPath();
  ctx.moveTo(p.x, -4); ctx.lineTo(p.x + PIPE_W, -4);
  ctx.lineTo(p.x + PIPE_W, p.top - r);
  ctx.quadraticCurveTo(p.x + PIPE_W/2, p.top + r*0.7, p.x, p.top - r);
  ctx.closePath(); ctx.fill();
  // bottom column (rounded tip at the top)
  ctx.beginPath();
  ctx.moveTo(p.x, H - GROUND_H + 4); ctx.lineTo(p.x + PIPE_W, H - GROUND_H + 4);
  ctx.lineTo(p.x + PIPE_W, by + r);
  ctx.quadraticCurveTo(p.x + PIPE_W/2, by - r*0.7, p.x, by + r);
  ctx.closePath(); ctx.fill();
  // leaf nubs
  ctx.fillStyle = 'rgba(94,214,178,0.55)';
  for (let k = 0; k < 3; k++) {
    const ly = (p.top * 0.3) + k * (Math.max(p.top, 60) * 0.22);
    ctx.beginPath(); ctx.ellipse(p.x + PIPE_W + 2, ly, 9, 4, -0.5, 0, Math.PI*2); ctx.fill();
    const by2 = by + p.gap * 0.25 + k * (Math.max(H - GROUND_H - by, 60) * 0.22);
    ctx.beginPath(); ctx.ellipse(p.x - 2, by2, 9, 4, 0.5, 0, Math.PI*2); ctx.fill();
  }
  // rim light
  ctx.strokeStyle = 'rgba(124,245,210,0.35)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(p.x + 4, 0); ctx.lineTo(p.x + 4, p.top - r*0.6); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(p.x + 4, by + r*0.6); ctx.lineTo(p.x + 4, H - GROUND_H); ctx.stroke();
}

function drawGround() {
  const gy = H - GROUND_H;
  const g = ctx.createLinearGradient(0, gy, 0, H);
  g.addColorStop(0, '#3a7d6f'); g.addColorStop(1, '#1e4f46');
  ctx.fillStyle = g; ctx.fillRect(0, gy, W, GROUND_H);
  // glowing water line
  ctx.fillStyle = 'rgba(124,245,210,0.5)'; ctx.fillRect(0, gy, W, 3);
  ctx.fillStyle = 'rgba(124,245,210,0.12)'; ctx.fillRect(0, gy + 3, W, 8);
  // drifting sand specks
  ctx.fillStyle = 'rgba(230,215,170,0.35)';
  const off = (performance.now() * 0.05 * (pipeSpeed/165)) % 24;
  for (let x = -off; x < W; x += 24) { ctx.fillRect(x, gy + 16, 10, 4); }
  for (let x = -off * 0.6; x < W; x += 36) { ctx.fillRect(x, gy + 34, 8, 3); }
}

function drawBird() {
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.rot);
  // tail
  ctx.fillStyle = '#ff9eb5';
  ctx.beginPath(); ctx.moveTo(-birdR*0.6, 0); ctx.bezierCurveTo(-birdR*1.3, -birdR*0.4, -birdR*1.5, birdR*0.3, -birdR*0.7, birdR*0.2); ctx.closePath(); ctx.fill();
  // body (pink axolotl)
  const bg = ctx.createRadialGradient(-birdR*0.3, -birdR*0.3, birdR*0.2, 0, 0, birdR);
  bg.addColorStop(0, '#ffc0d8'); bg.addColorStop(1, '#ff87b5');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.arc(0, 0, birdR, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = 'rgba(180,40,80,.22)'; ctx.lineWidth = 2; ctx.stroke();
  // belly
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.beginPath(); ctx.arc(birdR*0.15, birdR*0.35, birdR*0.55, 0, Math.PI*2); ctx.fill();
  // frilly gills wiggle
  ctx.strokeStyle = '#ff5f97'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  for (let i = -1; i <= 1; i++) { const wy = Math.sin(performance.now()*0.006 + i*1.2)*2; ctx.beginPath(); ctx.moveTo(-birdR*0.7, i*birdR*0.35+wy); ctx.lineTo(-birdR*1.25, i*birdR*0.6+wy); ctx.stroke(); }
  // wing (flaps)
  const wingUp = bird.wing > 0.4;
  ctx.fillStyle = '#fff0f6';
  ctx.beginPath();
  ctx.ellipse(-birdR*0.1, wingUp ? -birdR*0.5 : birdR*0.35, birdR*0.6, birdR*0.35, wingUp ? -0.5 : 0.5, 0, Math.PI*2);
  ctx.fill();
  // eye
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(birdR*0.4, -birdR*0.25, birdR*0.32, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(birdR*0.5, -birdR*0.25, birdR*0.16, 0, Math.PI*2); ctx.fill();
  // cheek
  ctx.fillStyle = 'rgba(255,120,170,0.6)'; ctx.beginPath(); ctx.arc(birdR*0.15, birdR*0.2, birdR*0.2, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

// init
best = gameSystem.state.highScore || 0;
document.getElementById('bestStart').textContent = best;
document.getElementById('gamesStart').textContent = gameSystem.state.gamesPlayed || 0;
document.getElementById('bestHud').textContent = best;
reset();
requestAnimationFrame(loop);

window.addEventListener('beforeunload', () => { gameSystem.saveState(); });
</script>
