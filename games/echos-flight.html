<html lang="en">

<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; touch-action: none; }
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: #63c7ff; display: flex; align-items: center; justify-content: center; }
.wrapper { position: relative; width: 100%; height: 100vh; height: 100dvh; max-width: 520px; overflow: hidden; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }

.hud { position: absolute; top: calc(env(safe-area-inset-top,0px) + 12px); left: 12px; right: 12px; z-index: 10; display: flex; justify-content: space-between; align-items: flex-start; pointer-events: none; }
.pills { display: flex; gap: 8px; }
.pill { background: rgba(10,20,40,.55); backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,.18); border-radius: 999px; padding: 6px 14px; color: #fff; font-weight: 700; font-size: .8rem; display: flex; gap: 6px; align-items: center; }
.pill b { color: #7CF5D2; font-size: 1rem; }
.home-btn { pointer-events: auto; width: 42px; height: 42px; border-radius: 12px; border: 1px solid rgba(255,255,255,.25); background: rgba(10,20,40,.55); backdrop-filter: blur(8px); color: #fff; font-size: 1.2rem; cursor: pointer; }
.home-btn:active { transform: scale(.92); }

.modal { position: absolute; inset: 0; z-index: 20; display: none; align-items: center; justify-content: center; padding: 24px; background: rgba(8,20,36,.55); backdrop-filter: blur(5px); }
.modal.show { display: flex; }
.card { background: linear-gradient(165deg,#123a52,#0b2436); border: 1px solid rgba(124,245,210,.28); border-radius: 22px; padding: 28px 24px; width: 100%; max-width: 330px; text-align: center; box-shadow: 0 24px 60px rgba(0,0,0,.45); }
.card h1 { font-family: 'Fredoka', cursive; font-size: 2rem; color: #fff; }
.card .sub { color: #7CF5D2; font-weight: 700; margin: 2px 0 14px; font-size: .95rem; }
.card p { color: rgba(255,255,255,.7); font-size: .88rem; line-height: 1.6; margin-bottom: 16px; }
.medal { font-size: 3rem; margin: 4px 0; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
.stat { background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); border-radius: 12px; padding: 10px; }
.stat .l { font-size: .62rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: rgba(255,255,255,.5); }
.stat .v { font-size: 1.5rem; font-weight: 800; color: #7CF5D2; }
.btn { width: 100%; border: none; border-radius: 14px; padding: 14px; font-weight: 800; font-size: 1rem; cursor: pointer; background: linear-gradient(90deg,#2ee6b6,#20b6d8); color: #06222f; box-shadow: 0 8px 18px rgba(46,230,182,.35); }
.btn:active { transform: scale(.97); }
.btn.ghost { background: rgba(255,255,255,.08); color: #fff; box-shadow: none; margin-top: 10px; }
.tap-hint { position: absolute; left: 0; right: 0; bottom: 22%; text-align: center; z-index: 8; color: #fff; font-weight: 800; font-size: 1.1rem; text-shadow: 0 2px 8px rgba(0,0,0,.4); pointer-events: none; animation: bob 1s ease-in-out infinite; display: none; }
.tap-hint.show { display: block; }
@keyframes bob { 50% { transform: translateY(-8px); } }
</style>
</head>
<body>
<div class="wrapper" id="wrapper">
  <canvas id="canvas"></canvas>
  <div class="hud">
    <div class="pills">
      <div class="pill">SCORE <b id="scoreHud">0</b></div>
      <div class="pill">BEST <b id="bestHud">0</b></div>
    </div>
    <button class="home-btn" onclick="location.href='mobile-games.html'">🏠</button>
  </div>
  <div class="tap-hint" id="tapHint">Tap to flap!</div>

  <div class="modal show" id="startModal">
    <div class="card">
      <h1>🩷 Echo's Flight</h1>
      <div class="sub">Tap to flap, weave the pipes</div>
      <p>Keep Echo in the air, glide through the gaps and chase your best score. One tap to flap that's it.</p>
      <div class="stats">
        <div class="stat"><div class="l">Best</div><div class="v" id="bestStart">0</div></div>
        <div class="stat"><div class="l">Flights</div><div class="v" id="gamesStart">0</div></div>
      </div>
      <button class="btn" onclick="startGame()">Play</button>
      <button class="btn ghost" onclick="location.href='mobile-games.html'">Back to Games</button>
    </div>
  </div>

  <div class="modal" id="overModal">
    <div class="card">
      <div class="medal" id="medal">🥉</div>
      <h1 id="overTitle">Game Over</h1>
      <div class="sub" id="overSub">Nice flight!</div>
      <div class="stats">
        <div class="stat"><div class="l">Score</div><div class="v" id="finalScore">0</div></div>
        <div class="stat"><div class="l">Best</div><div class="v" id="finalBest">0</div></div>
      </div>
      <button class="btn" onclick="startGame()">Play Again</button>
      <button class="btn ghost" onclick="location.href='mobile-games.html'">Back to Games</button>
    </div>
  </div>
</div>

<script>
const gameSystem = new GameSystem('echo-flight', "Echo's Flight", 'echo');
const audioEffects = new AudioEffects(0.7);
if (localStorage.getItem('soundEnabled') === 'false') audioEffects.setMasterVolume(0);

const wrap = document.getElementById('wrapper');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let W = 0, H = 0, dpr = 1;
function resize() {
  W = wrap.clientWidth; H = wrap.clientHeight;
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(W * dpr);
  canvas.height = Math.round(H * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

// ── Tunables (in CSS px & seconds; frame-rate independent) ──
const GRAVITY = 2100;      // px/s²
const FLAP_V = -560;       // px/s impulse
const MAX_FALL = 780;
const GROUND_H = 70;
let birdR = 17;

const bird = { x: 0, y: 0, vy: 0, rot: 0, wing: 0 };
let pipes = [];
let clouds = [];
let particles = [];

let state = 'idle';        // idle | playing | dead
let score = 0, best = 0;
let pipeSpeed = 165;
let pipeGap = 0;
let spawnDist = 0;
let distSinceSpawn = 0;
let startedAt = 0;
let flashT = 0, shakeT = 0, shakeMag = 0;

function reset() {
  birdR = Math.max(14, Math.min(20, W * 0.045));
  bird.x = W * 0.30; bird.y = H * 0.42; bird.vy = 0; bird.rot = 0; bird.wing = 0;
  pipes = []; particles = [];
  score = 0;
  pipeSpeed = 165;
  pipeGap = Math.max(H * 0.30, birdR * 7.5);
  spawnDist = Math.max(W * 0.62, 210);
  distSinceSpawn = spawnDist * 0.7;   // first pipe comes a touch sooner than a full gap
  best = gameSystem.state.highScore || 0;
  document.getElementById('scoreHud').textContent = '0';
  document.getElementById('bestHud').textContent = best;
  makeClouds();
}

function makeClouds() {
  clouds = [];
  for (let i = 0; i < 5; i++) clouds.push({ x: Math.random() * W, y: Math.random() * H * 0.5, s: 0.4 + Math.random() * 0.7, sp: 8 + Math.random() * 16 });
}

function spawnPipe() {
  const margin = 46;
  const minTop = margin;
  const maxTop = H - GROUND_H - pipeGap - margin;
  const top = minTop + Math.random() * Math.max(20, maxTop - minTop);
  pipes.push({ x: W + 40, top: top, gap: pipeGap, scored: false });
}

function flap() {
  if (state !== 'playing') return;
  bird.vy = FLAP_V;
  bird.wing = 1;
  audioEffects.playTap(680);
  for (let i = 0; i < 4; i++) particles.push({ x: bird.x - birdR, y: bird.y + birdR * 0.5, vx: -40 - Math.random() * 60, vy: 40 + Math.random() * 60, life: 0.4, r: 2 + Math.random() * 2, c: 'rgba(255,255,255,0.8)' });
}

function startGame() {
  document.getElementById('startModal').classList.remove('show');
  document.getElementById('overModal').classList.remove('show');
  resize();
  reset();
  state = 'playing';
  startedAt = performance.now();
  document.getElementById('tapHint').classList.add('show');
  bird.vy = FLAP_V * 0.6;
}

function die() {
  if (state !== 'playing') return;
  state = 'dead';
  flashT = 0.12; shakeT = 0.35; shakeMag = 10;
  audioEffects.playError();
  for (let i = 0; i < 16; i++) particles.push({ x: bird.x, y: bird.y, vx: (Math.random()-0.5)*360, vy: (Math.random()-0.5)*360, life: 0.6, r: 2 + Math.random()*3, c: 'rgba(255,120,150,0.9)' });

  const xp = Math.floor(score * 2);
  if (score > (gameSystem.state.highScore || 0)) gameSystem.state.highScore = score;
  gameSystem.addXP(xp);
  gameSystem.unlockAchievement('firstFlight');
  if (score >= 10) gameSystem.unlockAchievement('score10');
  if (score >= 25) gameSystem.unlockAchievement('score25');
  if (score >= 50) gameSystem.unlockAchievement('score50');
  gameSystem.recordGamePlay(performance.now() - startedAt);
  gameSystem.saveState();

  const isBest = score >= (gameSystem.state.highScore || 0);
  let medal = '🥉', title = 'Nice flight!';
  if (score >= 40) { medal = '🏆'; title = 'Legendary!'; }
  else if (score >= 25) { medal = '🥇'; title = 'Gold!'; }
  else if (score >= 12) { medal = '🥈'; title = 'Silver!'; }
  else if (score >= 5) { medal = '🥉'; title = 'Bronze!'; }
  else { medal = '🪶'; title = 'Keep going!'; }

  setTimeout(() => {
    document.getElementById('medal').textContent = medal;
    document.getElementById('overTitle').textContent = 'Game Over';
    document.getElementById('overSub').textContent = isBest && score > 0 ? 'New best score! ' + title : title;
    document.getElementById('finalScore').textContent = score;
    document.getElementById('finalBest').textContent = gameSystem.state.highScore;
    document.getElementById('overModal').classList.add('show');
    if (score >= 12) ParticleSystem.confetti(window.innerWidth/2, window.innerHeight/3, 16);
  }, 550);
}

// ── input ── (only the play area flaps; buttons handle their own clicks)
function onPress(e) {
  if (state === 'playing') { e.preventDefault(); flap(); }
}
canvas.addEventListener('pointerdown', onPress);
window.addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); flap(); } });

// ── loop ──
let last = performance.now();
function loop(now) {
  let dt = (now - last) / 1000; last = now;
  if (dt > 0.05) dt = 0.05;   // clamp after tab-switch/hitch
  update(dt);
  draw();
  requestAnimationFrame(loop);
}

function update(dt) {
  // clouds always drift
  clouds.forEach(c => { c.x -= c.sp * dt; if (c.x < -60) { c.x = W + 40; c.y = Math.random() * H * 0.5; } });

  // particles
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 400 * dt; p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }
  if (flashT > 0) flashT -= dt;
  if (shakeT > 0) shakeT -= dt;

  if (state !== 'playing') { if (state === 'dead') { bird.vy = Math.min(bird.vy + GRAVITY*dt, MAX_FALL); bird.y = Math.min(bird.y + bird.vy*dt, H - GROUND_H - birdR); } return; }

  // hide hint after the first couple of seconds
  if (performance.now() - startedAt > 1600) document.getElementById('tapHint').classList.remove('show');

  // bird physics
  bird.vy = Math.min(bird.vy + GRAVITY * dt, MAX_FALL);
  bird.y += bird.vy * dt;
  bird.rot = Math.max(-0.5, Math.min(1.4, bird.vy / 620));
  if (bird.wing > 0) bird.wing = Math.max(0, bird.wing - dt * 5);

  // difficulty ramp
  pipeSpeed = 165 + Math.min(score * 4.5, 130);

  // spawn pipes by distance
  distSinceSpawn += pipeSpeed * dt;
  if (distSinceSpawn >= spawnDist) { distSinceSpawn = 0; spawnPipe(); }

  // move pipes + scoring + collision
  for (let i = pipes.length - 1; i >= 0; i--) {
    const p = pipes[i];
    p.x -= pipeSpeed * dt;
    if (!p.scored && p.x + PIPE_W < bird.x - birdR) {
      p.scored = true; score++;
      document.getElementById('scoreHud').textContent = score;
      audioEffects.playSuccess(880 + Math.min(score, 20) * 20);
      if (score > (gameSystem.state.highScore || 0)) document.getElementById('bestHud').textContent = score;
    }
    if (p.x + PIPE_W < -20) pipes.splice(i, 1);
  }

  // collision: ground/ceiling
  if (bird.y + birdR >= H - GROUND_H) { bird.y = H - GROUND_H - birdR; die(); return; }
  if (bird.y - birdR <= 0) { bird.y = birdR; bird.vy = 0; }

  // collision: pipes (circle vs the two rects)
  for (const p of pipes) {
    if (bird.x + birdR > p.x && bird.x - birdR < p.x + PIPE_W) {
      if (bird.y - birdR < p.top || bird.y + birdR > p.top + p.gap) { die(); return; }
    }
  }
}

const PIPE_W = 66;
function draw() {
  ctx.save();
  if (shakeT > 0) { const k = shakeT / 0.35; ctx.translate((Math.random()-0.5)*shakeMag*k, (Math.random()-0.5)*shakeMag*k); }

  // sky
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, '#63c7ff'); sky.addColorStop(0.7, '#9fe0ff'); sky.addColorStop(1, '#d8f3ff');
  ctx.fillStyle = sky; ctx.fillRect(0, 0, W, H);

  // sun
  ctx.fillStyle = 'rgba(255,245,190,0.9)'; ctx.beginPath(); ctx.arc(W * 0.8, H * 0.16, 34, 0, Math.PI*2); ctx.fill();

  // clouds
  clouds.forEach(c => drawCloud(c.x, c.y, c.s));

  // pipes
  pipes.forEach(p => drawPipe(p));

  // ground
  drawGround();

  // particles
  particles.forEach(p => { ctx.globalAlpha = Math.max(0, p.life * 2); ctx.fillStyle = p.c; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI*2); ctx.fill(); });
  ctx.globalAlpha = 1;

  // bird
  drawBird();

  // hit flash
  if (flashT > 0) { ctx.fillStyle = `rgba(255,255,255,${Math.max(0, flashT/0.12)*0.7})`; ctx.fillRect(0, 0, W, H); }

  ctx.restore();
}

function drawCloud(x, y, s) {
  ctx.fillStyle = 'rgba(255,255,255,0.85)';
  ctx.beginPath();
  ctx.arc(x, y, 18*s, 0, Math.PI*2);
  ctx.arc(x + 20*s, y + 4*s, 22*s, 0, Math.PI*2);
  ctx.arc(x + 44*s, y, 16*s, 0, Math.PI*2);
  ctx.rect(x, y, 44*s, 18*s);
  ctx.fill();
}

function drawPipe(p) {
  const capH = 22, capOver = 5;
  const bodyGrad = ctx.createLinearGradient(p.x, 0, p.x + PIPE_W, 0);
  bodyGrad.addColorStop(0, '#5bbf4a'); bodyGrad.addColorStop(0.5, '#7ee06a'); bodyGrad.addColorStop(1, '#4aa23c');
  // top pipe
  ctx.fillStyle = bodyGrad;
  ctx.fillRect(p.x, 0, PIPE_W, p.top);
  ctx.fillRect(p.x - capOver, p.top - capH, PIPE_W + capOver*2, capH);
  // bottom pipe
  const by = p.top + p.gap;
  ctx.fillStyle = bodyGrad;
  ctx.fillRect(p.x, by, PIPE_W, H - GROUND_H - by);
  ctx.fillRect(p.x - capOver, by, PIPE_W + capOver*2, capH);
  // outline
  ctx.strokeStyle = 'rgba(40,110,35,0.5)'; ctx.lineWidth = 2;
  ctx.strokeRect(p.x, 0, PIPE_W, p.top);
  ctx.strokeRect(p.x, by, PIPE_W, H - GROUND_H - by);
}

function drawGround() {
  const gy = H - GROUND_H;
  const g = ctx.createLinearGradient(0, gy, 0, H);
  g.addColorStop(0, '#e6c56b'); g.addColorStop(1, '#c99b4a');
  ctx.fillStyle = g; ctx.fillRect(0, gy, W, GROUND_H);
  ctx.fillStyle = '#6fbf4a'; ctx.fillRect(0, gy, W, 10);
  ctx.fillStyle = 'rgba(255,255,255,0.15)';
  const off = (performance.now() * 0.05 * (pipeSpeed/165)) % 24;
  for (let x = -off; x < W; x += 24) { ctx.fillRect(x, gy + 16, 12, 5); }
}

function drawBird() {
  ctx.save();
  ctx.translate(bird.x, bird.y);
  ctx.rotate(bird.rot);
  // body (pink axolotl)
  const bg = ctx.createRadialGradient(-birdR*0.3, -birdR*0.3, birdR*0.2, 0, 0, birdR);
  bg.addColorStop(0, '#ffc0d8'); bg.addColorStop(1, '#ff87b5');
  ctx.fillStyle = bg;
  ctx.beginPath(); ctx.arc(0, 0, birdR, 0, Math.PI*2); ctx.fill();
  // belly
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.beginPath(); ctx.arc(birdR*0.15, birdR*0.35, birdR*0.55, 0, Math.PI*2); ctx.fill();
  // frilly gills
  ctx.strokeStyle = '#ff5f97'; ctx.lineWidth = 3; ctx.lineCap = 'round';
  for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(-birdR*0.7, i*birdR*0.35); ctx.lineTo(-birdR*1.25, i*birdR*0.6); ctx.stroke(); }
  // wing (flaps)
  const wingUp = bird.wing > 0.4;
  ctx.fillStyle = '#fff0f6';
  ctx.beginPath();
  ctx.ellipse(-birdR*0.1, wingUp ? -birdR*0.5 : birdR*0.35, birdR*0.6, birdR*0.35, wingUp ? -0.5 : 0.5, 0, Math.PI*2);
  ctx.fill();
  // eye
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(birdR*0.4, -birdR*0.25, birdR*0.32, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#222'; ctx.beginPath(); ctx.arc(birdR*0.5, -birdR*0.25, birdR*0.16, 0, Math.PI*2); ctx.fill();
  // cheek
  ctx.fillStyle = 'rgba(255,120,170,0.6)'; ctx.beginPath(); ctx.arc(birdR*0.15, birdR*0.2, birdR*0.2, 0, Math.PI*2); ctx.fill();
  ctx.restore();
}

// init
best = gameSystem.state.highScore || 0;
document.getElementById('bestStart').textContent = best;
document.getElementById('gamesStart').textContent = gameSystem.state.gamesPlayed || 0;
document.getElementById('bestHud').textContent = best;
reset();
requestAnimationFrame(loop);

window.addEventListener('beforeunload', () => { gameSystem.saveState(); });
</script>
</body>
</html>
