<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Backpack Quest | JVDesignStudio</title><link rel="manifest" href="../manifest.json"><meta name="theme-color" content="#283618"><meta name="description" content="A tiny shaped-inventory roguelite where loot placement changes combat."><script src="../game-system.js"></script><link rel="stylesheet" href="../game-system.css"><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#14170e;color:#fff}.wrap{max-width:1160px;margin:auto;padding:16px 12px 80px}.top{display:flex;gap:10px;flex-wrap:wrap}.pill{color:#fff;background:#0006;border-radius:8px;padding:9px 12px;text-decoration:none;font-weight:900}.hero{border-bottom:3px solid #dda15e;margin:12px 0}.hero h1{font-size:clamp(2rem,7vw,4.4rem);margin:0}.hud,.game{display:grid;gap:10px}.hud{grid-template-columns:repeat(6,1fr)}.stat,.panel{background:#fff8df;color:#202416;border:1px solid #d8c99d;border-radius:8px;padding:10px}.game{grid-template-columns:1fr .85fr}.bag{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.slot{aspect-ratio:1;border:1px solid #c7b985;border-radius:8px;background:#f7efd5;display:flex;align-items:center;justify-content:center;font-weight:900;cursor:pointer}.slot.filled{background:#fff}.loot,.map,.goals{display:grid;gap:8px}.loot{grid-template-columns:repeat(3,1fr)}.item,.node,.goal{border:1px solid #d8c99d;background:#fff;color:#202416;border-radius:8px;padding:9px;font-weight:900;text-align:left;cursor:pointer}.item.active,.goal.done{background:#eef7df}.preview{display:grid;grid-template-columns:repeat(3,42px);gap:5px;margin-top:8px}.mini{width:42px;height:42px;border:1px solid #d8c99d;border-radius:7px;background:#f7efd5;display:flex;align-items:center;justify-content:center}.mini.on{background:#fff}.fight{background:#f3e8cb;border-radius:8px;padding:10px;margin:10px 0}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}button{font:inherit;font-weight:900;min-height:42px;border-radius:8px;cursor:pointer}.primary{border:0;background:#283618;color:#fff}.secondary{border:1px solid #d8c99d;background:#fff;color:#202416}.track{height:10px;background:#e2d5aa;border-radius:99px;overflow:hidden}.track i{display:block;height:100%;background:#bc4749}.log{max-height:230px;overflow:auto;color:#4f5948}.result{display:none;background:#eef7df;border-radius:8px;padding:10px}.result.show{display:block}@media(max-width:820px){.game{grid-template-columns:1fr}.hud{grid-template-columns:repeat(3,1fr)}}@media(max-width:520px){.hud,.loot,.actions{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="top"><a class="pill" href="../arcade.html">Back to Arcade</a><a class="pill" href="../games">All games</a></div><section class="hero"><p>Shaped inventory roguelite</p><h1>Backpack Quest</h1><p>Pick loot, rotate its shape, fit it into the bag, then fight. Gems beside weapons create burst damage. Food beside shields makes survival builds.</p></section><section class="hud"><div class="stat"><b id="hp"></b><span>Health</span></div><div class="stat"><b id="room"></b><span>Room</span></div><div class="stat"><b id="gold"></b><span>Gold</span></div><div class="stat"><b id="power"></b><span>Power</span></div><div class="stat"><b id="score"></b><span>Score</span></div><div class="stat"><b id="best"></b><span>Best</span></div></section><main class="game"><section class="panel"><div class="bag" id="bag"></div><h3>Loot Choice</h3><div class="loot" id="loot"></div><div class="fight"><b>Shape Preview</b><div class="preview" id="preview"></div><p id="tip"></p></div><div class="actions"><button class="primary" id="rotate">Rotate</button><button class="primary" id="pack">Pack Loot</button><button class="secondary" id="restart">Restart</button></div></section><aside class="panel"><div class="map" id="map"></div><div class="fight"><b id="enemy"></b><p id="intent"></p><p id="breakdown"></p><div class="track"><i id="enemyBar"></i></div></div><div class="actions"><button class="primary" id="fight">Fight</button><button class="secondary" id="sell">Sell Loot</button><button class="secondary" id="sort">Sort Bag</button></div><h3>Goals</h3><div class="goals" id="goals"></div><div class="result" id="result"></div><h3>Run Log</h3><div class="log" id="log"></div></aside></main></div><script>
const GAME_ID='backpack-quest',runKey='jvds_backpack_fun_run',metaKey='jvds_backpack_fun_meta',gs=new GameSystem(GAME_ID,'Backpack Quest','echo');
const defs=[{id:'blade',e:'🗡️',n:'Blade',shape:[[0,0],[1,0]],atk:8,txt:'Weapon. Likes gems.'},{id:'shield',e:'🛡️',n:'Shield',shape:[[0,0],[0,1]],def:8,txt:'Guard. Likes apples.'},{id:'apple',e:'🍎',n:'Apple',shape:[[0,0]],heal:5,txt:'Small heal.'},{id:'gem',e:'💎',n:'Gem',shape:[[0,0]],gold:8,txt:'Boosts nearby weapons.'},{id:'bow',e:'🏹',n:'Longbow',shape:[[0,0],[1,0],[2,0]],atk:13,txt:'Big weapon, awkward shape.'},{id:'cloak',e:'🧥',n:'Cloak',shape:[[0,0],[1,0],[0,1]],def:5,heal:3,txt:'L shape support.'}];
const enemies=[['Dust Imp',20,5],['Lock Mimic',28,8],['Tunnel Knight',38,11],['Crown Shade',54,14]],nodes=['Fight','Treasure','Camp','Smith'],goalDefs=[['combo','Make an adjacency combo',s=>s.combo],['win','Beat the Crown Shade',s=>s.won],['rich','Earn 30 gold',s=>s.gold>=30]];let meta=read(metaKey,{best:0,goals:{}}),s=read(runKey,null)||fresh(),loot=roll(),pick=0,rot=0;
function fresh(){return{hp:34,max:34,room:0,gold:0,score:0,bag:Array(20).fill(null),enemy:{n:enemies[0][0],hp:20,max:20,hit:5},combo:false,won:false,ended:false,log:['Plan the bag before fighting. Empty space is a resource.']}}function read(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch(e){return f}}function save(){localStorage.setItem(runKey,JSON.stringify(s));localStorage.setItem(metaKey,JSON.stringify(meta))}function best(){try{return Math.max(meta.best,JSON.parse(localStorage.getItem('jvds_game_'+GAME_ID)||'{}').highScore||0)}catch(e){return meta.best}}function note(m){s.log.unshift(m);s.log=s.log.slice(0,10)}function roll(){return Array.from({length:3},()=>JSON.parse(JSON.stringify(defs[Math.floor(Math.random()*defs.length)])))}function cells(it){let a=it.shape;for(let i=0;i<rot;i++)a=a.map(([x,y])=>[y,-x]);let mx=Math.min(...a.map(p=>p[0])),my=Math.min(...a.map(p=>p[1]));return a.map(([x,y])=>[x-mx,y-my])}function adj(i){return[i-5,i+5,i%5?i-1:-1,i%5<4?i+1:-1].filter(n=>n>=0&&n<20)}function can(at,it){let x=at%5,y=Math.floor(at/5);return cells(it).every(([dx,dy])=>x+dx<5&&y+dy<4&&!s.bag[(y+dy)*5+x+dx])}function place(at){let it=loot[pick];if(!can(at,it)){note('That shape does not fit. Try rotating or another slot.');return render()}let x=at%5,y=Math.floor(at/5);cells(it).forEach(([dx,dy])=>s.bag[(y+dy)*5+x+dx]={id:it.id,e:it.e,n:it.n});note('Packed '+it.n+'.');loot=roll();pick=0;rot=0;scoreGoals();render()}
function stats(){let atk=0,def=0,heal=0,gold=0,combo=[];s.bag.forEach((it,i)=>{if(!it)return;let d=defs.find(x=>x.id===it.id);atk+=d.atk||0;def+=d.def||0;heal+=d.heal||0;gold+=d.gold||0;if(it.id==='gem'&&adj(i).some(n=>s.bag[n]&&['blade','bow'].includes(s.bag[n].id))){atk+=10;combo.push('gem weapon');s.combo=true}if(it.id==='apple'&&adj(i).some(n=>s.bag[n]&&s.bag[n].id==='shield')){def+=5;heal+=3;combo.push('apple shield');s.combo=true}});return{atk,def,heal,gold,total:atk+def+heal+gold,combo:combo.join(', ')||'none'}}function fight(){if(s.ended)return;let p=stats();s.enemy.hp=Math.max(0,s.enemy.hp-p.atk);s.hp=Math.min(s.max,s.hp+p.heal);s.gold+=Math.floor(p.gold/4);s.score+=p.atk*9+p.def*5+p.heal*6+p.gold*5;if(s.enemy.hp<=0){s.room++;s.gold+=10+s.room*5;s.score+=260;note('Room cleared. Reward earned.');if(s.room>=enemies.length)return finish(true);let e=enemies[s.room];s.enemy={n:e[0],hp:e[1],max:e[1],hit:e[2]};loot=roll()}else{let hurt=Math.max(0,s.enemy.hit-p.def);s.hp-=hurt;note('You deal '+p.atk+'. '+s.enemy.n+' hits for '+hurt+'.');if(s.hp<=0)return finish(false)}scoreGoals();render()}function node(n){if(n==='Treasure'){s.gold+=12;loot=roll();note('Treasure room: new loot and gold.')}if(n==='Camp'){s.hp=Math.min(s.max,s.hp+10);note('Camp: health restored.')}if(n==='Smith'){if(s.gold>=10){s.gold-=10;s.max+=4;s.hp+=4;note('Smith: max health improved.')}else note('Smith needs 10 gold.')}if(n==='Fight')fight();render()}function sell(){s.gold+=5;loot=roll();note('Loot sold for 5 gold.');render()}function sort(){s.bag=s.bag.filter(Boolean).concat(Array(20).fill(null)).slice(0,20);note('Bag sorted. Combos may change.');render()}function finish(w){s.ended=true;s.won=w;scoreGoals();let final=s.score+s.gold*12+s.hp*25+(w?1000:0)+Object.keys(meta.goals).length*200;s.score=final;meta.best=Math.max(meta.best,final);save();gs.addScore(final);gs.recordGamePlay(Date.now());try{gs.saveState({best:meta.best,won:w})}catch(e){}window.jvdsCheckNewBest&&window.jvdsCheckNewBest();note((w?'Victory. ':'Run over. ')+'Score '+final+' saved.');render()}function restart(){s=fresh();loot=roll();pick=0;rot=0;render()}function scoreGoals(){goalDefs.forEach(([id,,fn])=>{if(fn(s))meta.goals[id]=true})}
function render(){scoreGoals();let p=stats();hp.textContent=Math.max(0,s.hp)+'/'+s.max;room.textContent=s.ended?'Done':(s.room+1)+'/'+enemies.length;gold.textContent=s.gold;power.textContent=p.total;score.textContent=s.score;best.textContent=best();bag.innerHTML=s.bag.map((it,i)=>'<button class="slot '+(it?'filled':'')+'" data-i="'+i+'">'+(it?it.e:'+')+'</button>').join('');lootEl=document.getElementById('loot');lootEl.innerHTML=loot.map((it,i)=>'<button class="item '+(i===pick?'active':'')+'" data-pick="'+i+'"><b>'+it.e+' '+it.n+'</b><small>'+it.txt+'</small></button>').join('');preview.innerHTML=Array.from({length:9},(_,i)=>{let x=i%3,y=Math.floor(i/3),on=cells(loot[pick]).some(c=>c[0]===x&&c[1]===y);return '<span class="mini '+(on?'on':'')+'">'+(on?loot[pick].e:'')+'</span>'}).join('');tip.textContent=loot[pick].txt;map.innerHTML=nodes.map(n=>'<button class="node" data-node="'+n+'"><b>'+n+'</b><small>'+({Fight:'Use the bag now',Treasure:'Gold and new loot',Camp:'Heal up',Smith:'Buy max health'}[n])+'</small></button>').join('');enemy.textContent=s.enemy.n;intent.textContent='Intent: '+s.enemy.hit+' damage';breakdown.textContent='Next fight: '+p.atk+' attack, '+p.def+' guard, '+p.heal+' heal. Combo: '+p.combo;enemyBar.style.width=Math.max(0,s.enemy.hp/s.enemy.max*100)+'%';goals.innerHTML=goalDefs.map(([id,t])=>'<div class="goal '+(meta.goals[id]?'done':'')+'"><b>'+(meta.goals[id]?'✓':'○')+'</b><span>'+t+'</span></div>').join('');log.innerHTML=s.log.map(x=>'<p>'+x+'</p>').join('');result.className='result'+(s.ended?' show':'');result.textContent=s.ended?'Final score '+s.score+' - best '+meta.best:'';save()}
bag.onclick=e=>{let b=e.target.closest('[data-i]');if(b)place(+b.dataset.i)};document.getElementById('loot').onclick=e=>{let b=e.target.closest('[data-pick]');if(b){pick=+b.dataset.pick;render()}};map.onclick=e=>{let b=e.target.closest('[data-node]');if(b)node(b.dataset.node)};rotate.onclick=()=>{rot=(rot+1)%4;render()};pack.onclick=()=>{let i=s.bag.findIndex(x=>!x);if(i>=0)place(i)};fight.onclick=fight;sell.onclick=sell;sort.onclick=sort;restart.onclick=restart;render();
</script><script src="../cookie-consent.js" defer></script></body></html>
