<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="manifest" href="../manifest.json"><meta name="theme-color" content="#315d73"><meta name="description" content="Build a marble run on a canvas, launch it, and tune the physics path for challenge goals."><meta name="robots" content="index, follow"><link rel="canonical" href="https://jvdesignstudio.co.uk/games/marble-run-lab.html"><title>Marble Run Lab | JVDesignStudio</title><link rel="icon" href="../logo.png" type="image/png"><script src="../analytics-loader.js" defer></script><script src="../game-system.js"></script><link rel="stylesheet" href="../game-system.css"><script src="../player-profile.js" defer></script><style>
:root{--ink:#10212a;--panel:#f8fbff;--line:#b9c9d6;--muted:#5d6d78;--blue:#315d73;--cyan:#70a3a7;--gold:#f2a541;--green:#6a994e;--red:#bc4749;--shadow:0 16px 36px rgba(16,33,42,.2)}*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(circle at 20% 0,#d9f4f7 0,#70a3a7 34%,#203864 100%);color:#fff}button,a{font:inherit}.wrap{width:min(1180px,100%);margin:0 auto;padding:16px 14px 88px}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.pill{color:#fff;text-decoration:none;font-weight:950;background:rgba(0,0,0,.34);border:1px solid rgba(255,255,255,.26);border-radius:8px;padding:9px 12px}.hero{display:grid;grid-template-columns:1fr auto;gap:16px;align-items:end;border-bottom:3px solid var(--gold);padding:10px 0 16px}.hero h1{font-size:clamp(2rem,6vw,4.2rem);line-height:.98;margin:4px 0 7px;letter-spacing:0}.hero p{max-width:770px;color:rgba(255,255,255,.82);line-height:1.55;margin:0}.kicker{color:#ffe0a3;font-size:.78rem;font-weight:950;text-transform:uppercase}.emoji{font-size:4rem}.hud{display:grid;grid-template-columns:repeat(6,1fr);gap:10px;margin-top:12px}.stat,.panel{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}.stat{padding:10px}.stat b{display:block;font-size:1.16rem}.stat span{display:block;color:var(--muted);font-size:.72rem;font-weight:950;text-transform:uppercase}.game{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(320px,.8fr);gap:12px;margin-top:12px}.panel{padding:12px}.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.tool{border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);min-height:58px;font-weight:950;cursor:pointer}.tool.active{outline:3px solid rgba(49,93,115,.25)}canvas{width:100%;height:auto;aspect-ratio:16/10;background:#eef8fb;border:1px solid var(--line);border-radius:8px;margin-top:10px;touch-action:none}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}button.primary,button.secondary{border-radius:8px;min-height:44px;font-weight:950;cursor:pointer}.primary{border:0;background:var(--blue);color:#fff}.secondary{border:1px solid var(--line);background:#fff;color:var(--ink)}.goal{display:grid;grid-template-columns:auto 1fr;gap:8px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--muted);padding:8px;font-weight:850;margin-bottom:7px}.goal.done{background:#eef7df;color:var(--ink)}.log{min-height:150px;max-height:240px;overflow:auto;color:#4d5f68;line-height:1.45}.result{display:none;background:#eef7df;border:1px solid #aac58b;border-radius:8px;padding:10px;font-weight:850}.result.show{display:block}@media(max-width:900px){.hero,.game{grid-template-columns:1fr}.hud{grid-template-columns:repeat(3,1fr)}}@media(max-width:560px){.hud{grid-template-columns:repeat(2,1fr)}.tools,.actions{grid-template-columns:repeat(2,1fr)}.pill{flex:1;text-align:center}}
</style></head><body><div class="wrap"><div class="top"><a class="pill" href="../arcade.html">Back to Arcade</a><a class="pill" href="../games">All games</a><a class="pill" href="../tools/arcade-game-maker.html">Make your own</a></div><section class="hero"><div><div class="kicker">Canvas physics builder</div><h1>Marble Run Lab</h1><p>Tap the canvas to place ramps, bumpers, magnets and gems. Launch the marble and tune the real path until it lands in the cup.</p></div><div class="emoji">🧪</div></section><section class="hud"><div class="stat"><b id="score"></b><span>Score</span></div><div class="stat"><b id="level"></b><span>Lab</span></div><div class="stat"><b id="parts"></b><span>Parts</span></div><div class="stat"><b id="speed"></b><span>Speed</span></div><div class="stat"><b id="stars"></b><span>Stars</span></div><div class="stat"><b id="best"></b><span>Best</span></div></section><main class="game"><section class="panel"><div class="tools" id="tools"></div><canvas id="lab" width="800" height="500"></canvas><div class="actions"><button class="primary" id="launch">Launch</button><button class="secondary" id="undo">Undo</button><button class="secondary" id="next" disabled>Next</button><button class="secondary" id="restart">Restart</button></div></section><aside class="panel"><h2 id="brief"></h2><div id="goals"></div><div class="result" id="result"></div><h2>Lab Notes</h2><div class="log" id="log"></div></aside></main></div><script>
const GAME_ID='marble-run-lab',runKey='jvds_marble_canvas_run',metaKey='jvds_marble_canvas_meta';const gs=new GameSystem(GAME_ID,'Marble Run Lab','lumo');
const partDefs=[['ramp','↘','Ramp',1],['bumper','◎','Bumper',2],['boost','⚡','Boost',2],['magnet','🧲','Magnet',2],['gem','◆','Gem',1]];const levels=[['First Cup',720,420,5],['Gem Catch',690,390,4],['Speed Test',740,350,5]];let meta=read(metaKey,{best:0,goals:{}}),state=read(runKey,null)||fresh(),tool='ramp',marble=null,timer=null;
function fresh(){return{level:0,score:0,parts:10,speed:0,stars:0,placed:[],path:[],ended:false,log:['Place parts on the canvas, then launch. The marble is simulated, not guessed.']}}function read(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch(e){return f}}function save(){localStorage.setItem(runKey,JSON.stringify(state));localStorage.setItem(metaKey,JSON.stringify(meta));}function best(){try{return Math.max(meta.best,JSON.parse(localStorage.getItem('jvds_game_'+GAME_ID)||'{}').highScore||0)}catch(e){return meta.best}}function log(m){state.log.unshift(m);state.log=state.log.slice(0,10)}function lev(){return levels[state.level]}
function place(x,y){if(state.ended||state.parts<=0)return;const def=partDefs.find(p=>p[0]===tool);state.placed.push({t:tool,e:def[1],x,y});state.parts-=def[3];log('Placed '+def[2]+'.');save();draw();render()}function sim(){if(timer)clearInterval(timer);marble={x:45,y:50,vx:2.2,vy:0};state.path=[];state.speed=0;let steps=0,gems=0;timer=setInterval(()=>{steps++;marble.vy+=.18;for(const p of state.placed){const d=Math.hypot(marble.x-p.x,marble.y-p.y);if(d<34){if(p.t==='ramp'){marble.vx+=.45;marble.vy+=.25}if(p.t==='bumper'){marble.vx*=-.85;marble.vy-=1.4}if(p.t==='boost'){marble.vx+=1.2;marble.vy-=.6}if(p.t==='magnet'){marble.vx+=(p.x-marble.x)/80;marble.vy+=(p.y-marble.y)/100}if(p.t==='gem'&&!p.got){p.got=true;gems++;state.score+=120}}}marble.x+=marble.vx;marble.y+=marble.vy;if(marble.x<10||marble.x>790)marble.vx*=-.7;if(marble.y>485){marble.y=485;marble.vy*=-.45}state.path.push([marble.x,marble.y]);state.speed=Math.round(Math.hypot(marble.vx,marble.vy)*20);draw();const hit=Math.hypot(marble.x-lev()[1],marble.y-lev()[2])<35;if(hit||steps>260){clearInterval(timer);const fast=state.speed>=lev()[3]*10;state.stars=(hit?1:0)+(gems>0?1:0)+(fast?1:0);state.score+=state.stars*300+Math.max(0,300-steps);if(state.stars>=2){meta.goals['cup']=true;log('Cup reached with '+state.stars+' stars.')}else log('The marble missed the target. Move parts and try again.');save();render()}},24)}function next(){if(state.level>=levels.length-1){finish();return}state.level++;state.parts=10;state.placed=[];state.path=[];state.stars=0;log('New lab: '+lev()[0]);save();draw();render()}function finish(){state.ended=true;const final=state.score+state.stars*250+state.parts*40;state.score=final;meta.best=Math.max(meta.best,final);save();gs.addScore(final);gs.recordGamePlay(Date.now());try{gs.saveState({best:meta.best})}catch(e){}window.jvdsCheckNewBest&&window.jvdsCheckNewBest();log('Lab complete. Score '+final+' saved.');render()}function restart(){state=fresh();draw();render()}function draw(){const c=document.getElementById('lab'),x=c.getContext('2d');x.clearRect(0,0,800,500);x.fillStyle='#dff2f5';x.fillRect(0,0,800,500);x.fillStyle='#315d73';x.beginPath();x.arc(45,50,16,0,7);x.fill();x.fillStyle='#f2a541';x.beginPath();x.arc(lev()[1],lev()[2],28,0,7);x.fill();x.fillStyle='#10212a';x.font='22px system-ui';state.placed.forEach(p=>x.fillText(p.e,p.x-12,p.y+8));x.strokeStyle='#bc4749';x.beginPath();state.path.forEach((p,i)=>i?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));x.stroke();if(marble){x.fillStyle='#bc6c25';x.beginPath();x.arc(marble.x,marble.y,12,0,7);x.fill()}}
function render(){document.getElementById('score').textContent=state.score;document.getElementById('level').textContent=(state.level+1)+'/'+levels.length;document.getElementById('parts').textContent=state.parts;document.getElementById('speed').textContent=state.speed;document.getElementById('stars').textContent='★★★'.slice(0,state.stars)+'☆☆☆'.slice(state.stars);document.getElementById('best').textContent=best();document.getElementById('brief').textContent=lev()[0];document.getElementById('tools').innerHTML=partDefs.map(p=>'<button class="tool '+(tool===p[0]?'active':'')+'" data-tool="'+p[0]+'">'+p[1]+' '+p[2]+'<br><small>'+p[3]+' parts</small></button>').join('');document.getElementById('goals').innerHTML=['Reach the cup','Collect a gem','Keep good speed'].map((g,i)=>'<div class="goal '+(state.stars>i?'done':'')+'"><b>'+(state.stars>i?'✓':'○')+'</b><span>'+g+'</span></div>').join('');document.getElementById('next').disabled=state.stars<2;document.getElementById('log').innerHTML=state.log.map(m=>'<p>'+m+'</p>').join('');document.getElementById('result').className='result'+(state.ended?' show':'');document.getElementById('result').textContent=state.ended?'Final score '+state.score+' - best '+meta.best:'';save()}
document.getElementById('tools').onclick=e=>{const b=e.target.closest('[data-tool]');if(b){tool=b.dataset.tool;render()}};document.getElementById('lab').onclick=e=>{const r=e.target.getBoundingClientRect();place((e.clientX-r.left)*800/r.width,(e.clientY-r.top)*500/r.height)};document.getElementById('launch').onclick=sim;document.getElementById('undo').onclick=()=>{state.placed.pop();state.parts++;draw();render()};document.getElementById('next').onclick=next;document.getElementById('restart').onclick=restart;window.addEventListener('beforeunload',()=>{if(state.score>0)gs.recordGamePlay(Date.now())});draw();render();
</script><script src="../cookie-consent.js" defer></script></body></html>
