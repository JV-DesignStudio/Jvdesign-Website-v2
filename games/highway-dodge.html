<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a1a;color:#e2e8f0;font-family:system-ui,-apple-system,sans-serif;overflow:hidden;height:100dvh}
.game-wrap{display:flex;flex-direction:column;height:100dvh;max-width:520px;margin:0 auto;position:relative}
/* One slim bar, then the canvas takes every other pixel. */
.top-bar{display:flex;align-items:center;gap:10px;padding:6px 12px;background:rgba(0,0,0,.6);z-index:10}
.top-bar a{color:#cbd5e1;text-decoration:none;font-size:13px;white-space:nowrap}
.top-bar .title{display:none}
.hud{display:flex;flex:1;justify-content:center;gap:14px;min-width:0}
.hud>div{text-align:center;min-width:0}
.hud small{display:block;font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:#94a3b8}
.hud b{display:block;font-size:15px;color:#fbbf24;line-height:1.15}
/* Keep the strip clear of the floating Exit/menu chrome on phones. */
@media (max-width:560px){ .hud{gap:10px} .hud .hide-sm{display:none} .hud b{font-size:14px} }
.hud .fuel-track{display:block;width:42px;height:4px;margin:3px auto 0;border-radius:3px;background:rgba(255,255,255,.16);overflow:hidden}
.hud .fuel-fill{display:block;height:100%;width:100%;border-radius:3px;background:#22c55e;transition:width .12s linear}
.hud-fuel.low .fuel-fill{background:#ef4444}
.hud-fuel.low b{color:#f87171}
.btn-ghost{padding:4px 10px;font-size:13px}
canvas{flex:1;width:100%;min-height:0;min-width:0;display:block;touch-action:none}
.overlay{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.7);z-index:20;gap:16px;padding:24px;text-align:center}
.overlay h1,.overlay #endTitle{font-size:32px;color:#fbbf24}
.overlay p{color:#94a3b8;max-width:320px;line-height:1.5}
.overlay .stats{display:flex;gap:24px;margin:12px 0}
.overlay .stats div{text-align:center}
.overlay .stats b{display:block;font-size:22px;color:#fbbf24}
.overlay .stats small{color:#94a3b8;font-size:12px}
.btn{background:#f59e0b;color:#0a0a1a;border:none;padding:12px 32px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer}
.btn:hover{background:#fbbf24}
.overlay .btn-ghost{background:transparent;border:2px solid #475569;color:#94a3b8;padding:10px 24px;border-radius:12px;font-size:14px;cursor:pointer}
.hidden{display:none}
.toast{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(251,191,36,.9);color:#0a0a1a;padding:8px 20px;border-radius:8px;font-weight:700;font-size:18px;z-index:15;opacity:0;transition:opacity .15s;pointer-events:none}
.toast.show{opacity:1}
/* First-run steer tip, shown once for the first few seconds of the very first run. */
.tip{position:absolute;left:50%;top:22%;transform:translateX(-50%);background:rgba(251,191,36,.95);color:#0a0a1a;padding:10px 18px;border-radius:12px;font-weight:700;font-size:15px;line-height:1.35;z-index:16;text-align:center;max-width:88%;opacity:0;transition:opacity .25s;pointer-events:none;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.tip.show{opacity:1}
/* The StoryRun bar is hidden here: its beats surface as toasts and the timer
   lives in the HUD, so the run never pushes the play area off the screen. */
.game-wrap .storyrun{display:none}
/* Game-over modal must sit above the fullscreen game shell (game-shell.js uses z-index 99990). */
.storyrun.sr-modal{z-index:100050}
/* Keepsake export button injected into the game-over modal. */
.sr-keepsake{display:inline-flex;align-items:center;justify-content:center;gap:8px;margin:0 auto 10px;background:rgba(251,191,36,.16);color:#fbbf24;border:1px solid rgba(251,191,36,.5);border-radius:12px;padding:11px 20px;font:700 14px/1 system-ui,sans-serif;cursor:pointer}
.sr-keepsake:hover{background:rgba(251,191,36,.28)}
</style>
</head>
<body>
<div class="game-wrap" data-jvds-root data-storyrun-host>
  <div class="top-bar">
    <a href="../arcade.html">&larr; Arcade</a>
    <button class="btn-ghost" id="soundBtn">🔊</button>
    <div class="hud">
      <div><small>Score</small><b id="scoreHud">0</b></div>
      <div class="hud-fuel" id="fuelCell"><small>Fuel</small><b id="fuelHud">100</b><span class="fuel-track"><i class="fuel-fill" id="fuelFill"></i></span></div>
      <div><small>Combo</small><b id="comboHud">0</b></div>
      <div class="hide-sm"><small>Goal</small><b id="goalHud">500</b></div>
      <div class="hide-sm"><small>Best</small><b id="bestHud">0</b></div>
    </div>
  </div>
  <canvas id="game"></canvas>
  <div class="toast" id="toast"></div>
  <div class="tip" id="tip"></div>

  <div class="overlay" id="startScreen">
    <h1>🚗 Highway Dodge</h1>
    <p>Swerve through oncoming traffic. The longer you survive, the faster it gets. Chain near-misses for big bonus points and grab ⛽ fuel before the tank runs dry.</p>
    <p style="font-size:13px;color:#64748b">Swipe left/right, arrow keys, or A/D to steer. Tap to start.</p>
    <button class="btn" id="playBtn">Start Driving</button>
    <button class="btn-ghost" data-go="../arcade.html">Back to Games</button>
  </div>

  <div class="overlay hidden" id="endScreen">
    <h2 id="endTitle">Crashed!</h2>
    <div class="stats" id="endStats"></div>
    <button class="btn" id="againBtn">Drive Again</button>
    <button class="btn-ghost" data-go="../arcade.html">Back to Games</button>
  </div>
</div>

<script src="../story-run.js"></script>

</body>
</html>
