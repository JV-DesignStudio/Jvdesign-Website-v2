<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Stardust Ruins | JVDesignStudio</title><link rel="manifest" href="../manifest.json"><meta name="theme-color" content="#26335f"><meta name="description" content="Rotate corridor tiles, collect keys, dodge hazards and escape starlit rooms."><script src="../game-system.js"></script><link rel="stylesheet" href="../game-system.css"><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,sans-serif;background:#12172d;color:#fff}.wrap{max-width:1150px;margin:auto;padding:16px 12px 80px}.pill{color:#fff;background:#0006;border-radius:8px;padding:9px 12px;text-decoration:none;font-weight:900}.top{display:flex;gap:10px}.hero{border-bottom:3px solid #f2a541;margin:12px 0}.hero h1{font-size:clamp(2rem,7vw,4.2rem);margin:0}.hud,.game{display:grid;gap:10px}.hud{grid-template-columns:repeat(6,1fr)}.stat,.panel{background:#fff8eb;color:#171b30;border:1px solid #d8cba8;border-radius:8px;padding:10px}.game{grid-template-columns:1fr .8fr}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}.tile{aspect-ratio:1;border:1px solid #c7b985;border-radius:8px;background:#f4e2aa;font-size:1.4rem;font-weight:900;cursor:pointer;position:relative}.tile.wall{background:#817967;color:#fff}.tile.haz{background:#ffd7d2}.tile.exit{background:#ffe08a}.me{position:absolute;right:4px;top:4px;width:15px;height:15px;border-radius:50%;background:#315d73}.moves,.goals{display:grid;gap:8px}.moves{grid-template-columns:repeat(4,1fr);margin-top:10px}.goal{display:grid;grid-template-columns:auto 1fr;gap:8px;background:#fff;border:1px solid #d8cba8;border-radius:8px;padding:8px;color:#686a76}.goal.done{background:#eef7df;color:#171b30}button{font:inherit;font-weight:900;min-height:42px;border-radius:8px;cursor:pointer}.primary{border:0;background:#26335f;color:#fff}.secondary{border:1px solid #d8cba8;background:#fff;color:#171b30}.log{max-height:220px;overflow:auto;color:#535061}.result{display:none;background:#eef7df;border-radius:8px;padding:10px}.result.show{display:block}@media(max-width:820px){.game{grid-template-columns:1fr}.hud{grid-template-columns:repeat(3,1fr)}}@media(max-width:520px){.hud,.moves{grid-template-columns:repeat(2,1fr)}}</style></head><body><div class="wrap"><div class="top"><a class="pill" href="../arcade.html">Back to Arcade</a><a class="pill" href="../games">All games</a></div><section class="hero"><p>Corridor puzzle adventure</p><h1>Stardust Ruins</h1><p>Rotate corridor tiles so your explorer can move through connected paths. Keys open exits, hazards drain light, and each room changes the route puzzle.</p></section><section class="hud"><div class="stat"><b id="score"></b><span>Score</span></div><div class="stat"><b id="room"></b><span>Room</span></div><div class="stat"><b id="light"></b><span>Light</span></div><div class="stat"><b id="keys"></b><span>Keys</span></div><div class="stat"><b id="relics"></b><span>Relics</span></div><div class="stat"><b id="best"></b><span>Best</span></div></section><main class="game"><section class="panel"><div class="grid" id="grid"></div><div class="moves"><button class="primary" data-m="up">Up</button><button class="primary" data-m="down">Down</button><button class="primary" data-m="left">Left</button><button class="primary" data-m="right">Right</button></div><button class="secondary" id="restart">Restart</button></section><aside class="panel"><h2 id="brief"></h2><div class="goals" id="goals"></div><div class="result" id="result"></div><h2>Ruins Log</h2><div class="log" id="log"></div></aside></main></div><script>
const GAME_ID='stardust-ruins',runKey='jvds_ruins_corridor_run',metaKey='jvds_ruins_corridor_meta',gs=new GameSystem(GAME_ID,'Stardust Ruins','stardust');const rooms=[{exit:24,key:6,relic:18,walls:[4,9,14],haz:[8,19]},{exit:20,key:2,relic:12,walls:[1,7,13],haz:[11,17]},{exit:4,key:22,relic:16,walls:[5,10,15],haz:[6,18]}];const dirs={up:[0,-1,1],right:[1,0,2],down:[0,1,4],left:[-1,0,8]};const icons=['│','─','┐','└','┘','┌'];const goals=[['relic','Find 2 relics',s=>s.relics>=2],['light','Escape with 30 light',s=>s.ended&&s.light>=30],['clear','Clear all rooms',s=>s.ended&&s.room>=rooms.length]];let meta=read(metaKey,{best:0,goals:{}}),s=read(runKey,null)||fresh();function fresh(){return{room:0,pos:0,score:0,light:85,keys:0,relics:0,ended:false,tiles:Array.from({length:25},(_,i)=>i%6),found:{},log:['Rotate corridor tiles, then move only through connected openings.']}}function read(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch(e){return f}}function save(){localStorage.setItem(runKey,JSON.stringify(s));localStorage.setItem(metaKey,JSON.stringify(meta))}function best(){try{return Math.max(meta.best,JSON.parse(localStorage.getItem('jvds_game_'+GAME_ID)||'{}').highScore||0)}catch(e){return meta.best}}function log(m){s.log.unshift(m);s.log=s.log.slice(0,10)}function cur(){return rooms[Math.min(s.room,rooms.length-1)]}function openMask(i){return [5,10,6,3,9,12][s.tiles[i]%6]}function xy(i){return{x:i%5,y:Math.floor(i/5)}}function id(x,y){return y*5+x}function scoreGoals(){goals.forEach(([id,,fn])=>{if(fn(s))meta.goals[id]=true})}
function rot(i){if(cur().walls.includes(i)||s.ended)return;s.tiles[i]=(s.tiles[i]+1)%6;s.light=Math.max(0,s.light-1);s.score+=12;render()}function move(d){if(s.ended)return;const [dx,dy,bit]=dirs[d],p=xy(s.pos),nx=p.x+dx,ny=p.y+dy;if(nx<0||nx>4||ny<0||ny>4)return;const ni=id(nx,ny),opp={up:4,down:1,left:2,right:8}[d];if(!(openMask(s.pos)&bit)||!(openMask(ni)&opp)){log('The corridor does not connect.');return render()}if(cur().walls.includes(ni))return; s.pos=ni;s.light-=4;s.score+=40;if(cur().haz.includes(ni)){s.light-=9;log('Hazard dust drains the lantern.')}if(ni===cur().key&&!s.found[s.room+'k']){s.keys++;s.found[s.room+'k']=1;s.score+=160;log('Key found.')}if(ni===cur().relic&&!s.found[s.room+'r']){s.relics++;s.found[s.room+'r']=1;s.score+=260;log('Relic found.')}if(ni===cur().exit){if(s.keys>0){s.keys--;s.room++;s.score+=340;log('Exit opened.');if(s.room>=rooms.length)finish();else{s.pos=0;s.light+=10;s.tiles=Array.from({length:25},(_,i)=>(i+s.room)%6)}}else log('The exit needs a key.')}if(s.light<=0)finish();render()}function finish(){s.ended=true;scoreGoals();const final=s.score+s.relics*420+s.light*10+Object.keys(meta.goals).length*180;meta.best=Math.max(meta.best,final);s.score=final;save();gs.addScore(final);gs.recordGamePlay(Date.now());try{gs.saveState({best:meta.best})}catch(e){}window.jvdsCheckNewBest&&window.jvdsCheckNewBest();log('Expedition score '+final+' saved.')}function restart(){s=fresh();render()}function render(){scoreGoals();document.getElementById('score').textContent=s.score;document.getElementById('room').textContent=s.ended?'Done':(s.room+1)+'/'+rooms.length;document.getElementById('light').textContent=s.light+'%';document.getElementById('keys').textContent=s.keys;document.getElementById('relics').textContent=s.relics;document.getElementById('best').textContent=best();document.getElementById('brief').textContent=s.ended?'Ruins complete':'Room '+(s.room+1)+': rotate paths, find the key, reach the exit.';document.getElementById('grid').innerHTML=Array.from({length:25},(_,i)=>'<button class="tile '+(cur().walls.includes(i)?'wall ':cur().haz.includes(i)?'haz ':i===cur().exit?'exit ':'')+'" data-i="'+i+'">'+(cur().walls.includes(i)?'■':i===cur().key&&!s.found[s.room+'k']?'🔑':i===cur().relic&&!s.found[s.room+'r']?'⭐':i===cur().exit?'🚪':icons[s.tiles[i]%6])+(i===s.pos?'<i class="me"></i>':'')+'</button>').join('');document.getElementById('goals').innerHTML=goals.map(([id,t])=>'<div class="goal '+(meta.goals[id]?'done':'')+'"><b>'+(meta.goals[id]?'✓':'○')+'</b><span>'+t+'</span></div>').join('');document.getElementById('log').innerHTML=s.log.map(x=>'<p>'+x+'</p>').join('');document.getElementById('result').className='result'+(s.ended?' show':'');document.getElementById('result').textContent=s.ended?'Final score '+s.score+' - best '+meta.best:'';save()}document.getElementById('grid').onclick=e=>{const b=e.target.closest('[data-i]');if(b)rot(+b.dataset.i)};document.body.onclick=e=>{const b=e.target.closest('[data-m]');if(b)move(b.dataset.m)};document.getElementById('restart').onclick=restart;render();
</script><script src="../cookie-consent.js" defer></script></body></html>
