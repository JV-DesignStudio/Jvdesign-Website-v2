<style>
:root {
  --bg-office: #E8E6E1;
  --bg-wall: #D4D0C8;
  --accent: #FF6B6B;
  --accent-dark: #E63946;
  --text-dark: #2B2D42;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #E8E6E1 0%, #D4D0C8 100%);
  display: flex;
  align-items: center;
  justify-content: center;
}

.game-wrapper {
  width: 100%;
  height: 100vh;
  height: 100dvh;
  display: flex;
  flex-direction: column;
  max-width: 600px;
  position: relative;
}

canvas {
  display: block;
  flex: 1;
  width: 100%;
  background: linear-gradient(180deg, #F5F3F0 0%, #E8E6E1 100%);
  image-rendering: pixelated;
}

.hud-pill {
  background: rgba(43, 45, 66, 0.8);
  border: 1px solid rgba(255, 107, 107, 0.3);
  border-radius: 999px;
  padding: 8px 16px;
  font-size: 0.875rem;
  font-weight: 700;
  backdrop-filter: blur(8px);
  color: white;
  display: flex;
  gap: 6px;
  align-items: center;
}

.hud-label { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; opacity: 0.6; }
.hud-value { font-size: 1.1rem; font-weight: 800; color: var(--accent); }

.modal {
  position: fixed;
  inset: 0;
  background: rgba(43, 45, 66, 0.85);
  backdrop-filter: blur(4px);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  opacity: 0;
  pointer-events: none;
  transition: opacity 300ms;
}

.modal.show {
  opacity: 1;
  pointer-events: auto;
}

.modal-box {
  background: var(--bg-office);
  border: 2px solid var(--accent);
  border-radius: 16px;
  padding: 32px 28px;
  max-width: 500px;
  width: 90%;
  text-align: center;
  animation: slideUp 300ms ease-out;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.modal-title { font-size: 1.8rem; font-weight: 700; color: var(--text-dark); margin-bottom: 12px; }
.modal-subtitle { font-size: 0.95rem; color: var(--accent); margin-bottom: 16px; }
.modal-text { font-size: 0.85rem; color: var(--text-dark); line-height: 1.5; margin-bottom: 16px; }

.stat-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 16px 0; }
.stat-box { background: rgba(255, 107, 107, 0.1); border: 2px solid rgba(255, 107, 107, 0.3); border-radius: 10px; padding: 12px; }
.stat-label { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; color: rgba(43, 45, 66, 0.5); }
.stat-value { font-size: 1.5rem; font-weight: 800; color: var(--accent); margin-top: 4px; }

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 24px;
  border-radius: 10px;
  font-weight: 700;
  border: none;
  cursor: pointer;
  text-transform: uppercase;
  margin: 6px;
}

.btn-primary {
  background: var(--accent);
  color: white;
}

.btn-primary:hover {
  background: var(--accent-dark);
}

.btn-secondary {
  background: rgba(43, 45, 66, 0.1);
  color: var(--text-dark);
  border: 2px solid rgba(43, 45, 66, 0.2);
}

.controls {
  background: rgba(255, 107, 107, 0.1);
  border-left: 4px solid var(--accent);
  padding: 12px;
  border-radius: 6px;
  margin: 12px 0;
  text-align: left;
  font-size: 0.85rem;
  color: var(--text-dark);
}

@media (max-width: 480px) {
  .modal-box { padding: 20px 16px; }
  .modal-title { font-size: 1.4rem; }

<body>
<div class="game-wrapper">
  <div style="position: fixed; top: 16px; left: 16px; right: 16px; z-index: 100; display: flex; justify-content: space-between; gap: 12px;">
    <div style="display: flex; gap: 8px;">
      <div class="hud-pill">
        <span class="hud-label">Score</span>
        <span class="hud-value" id="scoreDisplay">0</span>
      </div>
      <div class="hud-pill">
        <span class="hud-label">Level</span>
        <span class="hud-value" id="levelDisplay">1</span>
      </div>
    </div>
    <button style="width: 48px; height: 48px; padding: 0; font-size: 1.5rem; background: rgba(43,45,66,0.8); border: none; border-radius: 10px; cursor: pointer; color: white;" onclick="window.location.href='/games/mobile-games.html'">🏠</button>
  </div>
  <canvas id="gameCanvas"></canvas>
</div>

<!-- Start Modal -->
<div class="modal show" id="startModal">
  <div class="modal-box">
    <div class="modal-title">📄 Paper Toss</div>
    <div class="modal-subtitle">Deluxe Edition</div>
    <div class="controls">
      <strong>How to Play:</strong><br>
      1. Drag from your position to aim<br>
      2. Release to throw<br>
      3. Hit the trash can for points<br>
      4. Level up with higher scores
    </div>
    <div class="stat-row">
      <div class="stat-box">
        <div class="stat-label">Best Score</div>
        <div class="stat-value" id="bestScoreStart">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Throws</div>
        <div class="stat-value" id="throwsStart">0</div>
      </div>
    </div>
    <button class="btn btn-primary" onclick="startGame()" style="width: 100%; margin-top: 16px;">Start Playing</button>
  </div>
</div>

<!-- Game Over Modal -->
<div class="modal" id="gameOverModal">
  <div class="modal-box">
    <div class="modal-title" id="resultTitle">Great Job!</div>
    <div class="modal-subtitle" id="resultScore">Score: 0</div>
    <div class="stat-row">
      <div class="stat-box">
        <div class="stat-label">Points</div>
        <div class="stat-value" id="pointsEarned">0</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">XP</div>
        <div class="stat-value" id="xpEarned">0</div>
      </div>
    </div>
    <div>
      <button class="btn btn-primary" onclick="startGame()">Play Again</button>
      <button class="btn btn-secondary" onclick="window.location.href='/games/mobile-games.html'">Home</button>
    </div>
  </div>
</div>

<script>
const CANVAS_WIDTH = 400;
const CANVAS_HEIGHT = 600;
const PLAYER_X = 50;
const PLAYER_Y = CANVAS_HEIGHT - 80;
const TRASH_X = 320;
const TRASH_Y = 100;

let gameRunning = false;
let score = 0;
let throws = 0;
let isDragging = false;
let dragStart = { x: PLAYER_X, y: PLAYER_Y };
let dragCurrent = { x: PLAYER_X, y: PLAYER_Y };
let paper = null;

const gameSystem = new GameSystem('paper-toss', 'Paper Toss Deluxe', 'squirt');
const soundManager = new SoundManager(gameSystem);

const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
canvas.width = CANVAS_WIDTH;
canvas.height = CANVAS_HEIGHT;

// Input handling
canvas.addEventListener('mousedown', (e) => {
  if (!gameRunning || paper) return;
  const rect = canvas.getBoundingClientRect();
  const x = (e.clientX - rect.left) * (canvas.width / rect.width);
  const y = (e.clientY - rect.top) * (canvas.height / rect.height);

  const dist = Math.hypot(x - PLAYER_X, y - PLAYER_Y);
  if (dist < 40) {
    isDragging = true;
    dragStart = { x: PLAYER_X, y: PLAYER_Y };
    dragCurrent = { x, y };
  }
});

canvas.addEventListener('mousemove', (e) => {
  if (!isDragging) return;
  const rect = canvas.getBoundingClientRect();
  dragCurrent.x = (e.clientX - rect.left) * (canvas.width / rect.width);
  dragCurrent.y = (e.clientY - rect.top) * (canvas.height / rect.height);
});

canvas.addEventListener('mouseup', () => {
  if (!isDragging) return;
  isDragging = false;
  throwPaper();
});

canvas.addEventListener('touchstart', (e) => {
  if (!gameRunning || paper) return;
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches[0];
  const x = (touch.clientX - rect.left) * (canvas.width / rect.width);
  const y = (touch.clientY - rect.top) * (canvas.height / rect.height);

  const dist = Math.hypot(x - PLAYER_X, y - PLAYER_Y);
  if (dist < 40) {
    isDragging = true;
    dragStart = { x: PLAYER_X, y: PLAYER_Y };
    dragCurrent = { x, y };
  }
});

canvas.addEventListener('touchmove', (e) => {
  if (!isDragging) return;
  const rect = canvas.getBoundingClientRect();
  const touch = e.touches[0];
  dragCurrent.x = (touch.clientX - rect.left) * (canvas.width / rect.width);
  dragCurrent.y = (touch.clientY - rect.top) * (canvas.height / rect.height);
}, false);

canvas.addEventListener('touchend', () => {
  if (!isDragging) return;
  isDragging = false;
  throwPaper();
}, false);

function throwPaper() {
  if (paper || !gameRunning) return;

  throws++;
  const power = Math.hypot(dragStart.x - dragCurrent.x, dragStart.y - dragCurrent.y) / 3;
  const angle = Math.atan2(dragStart.y - dragCurrent.y, dragStart.x - dragCurrent.x);

  paper = {
    x: PLAYER_X,
    y: PLAYER_Y,
    vx: Math.cos(angle) * power,
    vy: Math.sin(angle) * power,
    rotation: 0,
    life: 120
  };

  soundManager.playSound(500, 100, 'sine');
}

function checkHit() {
  if (!paper) return false;
  const dx = paper.x - TRASH_X;
  const dy = paper.y - TRASH_Y;
  return Math.hypot(dx, dy) < 35;
}

function startGame() {
  document.getElementById('startModal').classList.remove('show');
  document.getElementById('gameOverModal').classList.remove('show');

  gameRunning = true;
  score = 0;
  paper = null;
  isDragging = false;
  gameSystem.resetState();

  document.getElementById('scoreDisplay').textContent = '0';
  document.getElementById('levelDisplay').textContent = gameSystem.state.level;

  gameLoop();
}

function endGame() {
  gameRunning = false;

  const xpGained = Math.floor(score / 5);
  gameSystem.addScore(score);
  gameSystem.addXP(xpGained);
  gameSystem.unlockAchievement('firstThrow');
  gameSystem.checkAchievements();
  gameSystem.recordGamePlay(Date.now());
  gameSystem.saveState();

  document.getElementById('resultTitle').textContent = score > 300 ? '🎉 Excellent!' : score > 100 ? '👍 Nice!' : '📄 Good Try!';
  document.getElementById('resultScore').textContent = `Score: ${score}`;
  document.getElementById('pointsEarned').textContent = score;
  document.getElementById('xpEarned').textContent = xpGained;
  document.getElementById('gameOverModal').classList.add('show');

  soundManager.playSuccessSound();
}

function updateGame() {
  if (!paper) return;

  // Physics
  paper.vx *= 0.985;
  paper.vy += 0.3;
  paper.x += paper.vx;
  paper.y += paper.vy;
  paper.rotation += paper.vx * 0.1;
  paper.life--;

  // Check hit
  if (checkHit()) {
    score += 100;
    document.getElementById('scoreDisplay').textContent = score;
    document.getElementById('levelDisplay').textContent = gameSystem.state.level;
    soundManager.playSuccessSound();
    paper = null;
    return;
  }

  // Out of bounds
  if (paper.y > CANVAS_HEIGHT + 50 || paper.x < -50 || paper.x > CANVAS_WIDTH + 50 || paper.life <= 0) {
    paper = null;
  }
}

function drawGame() {
  // Background
  ctx.fillStyle = '#F5F3F0';
  ctx.fillRect(0, 0, CANVAS_WIDTH, CANVAS_HEIGHT);

  // Wall gradient
  const wallGrad = ctx.createLinearGradient(0, 0, CANVAS_WIDTH, 0);
  wallGrad.addColorStop(0, '#D4D0C8');
  wallGrad.addColorStop(1, '#E8E6E1');
  ctx.fillStyle = wallGrad;
  ctx.fillRect(0, 0, CANVAS_WIDTH, 120);

  // Trash can
  ctx.fillStyle = '#333';
  ctx.beginPath();
  ctx.ellipse(TRASH_X, TRASH_Y - 20, 25, 12, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillRect(TRASH_X - 25, TRASH_Y - 15, 50, 70);
  ctx.fillStyle = '#000';
  ctx.fillRect(TRASH_X - 22, TRASH_Y - 12, 44, 10);

  // Player
  ctx.font = '48px Arial';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🐿️', PLAYER_X, PLAYER_Y);

  // Drag preview line
  if (isDragging) {
    ctx.strokeStyle = 'rgba(255, 107, 107, 0.6)';
    ctx.lineWidth = 3;
    ctx.setLineDash([5, 5]);
    ctx.beginPath();
    ctx.moveTo(dragStart.x, dragStart.y);
    ctx.lineTo(dragCurrent.x, dragCurrent.y);
    ctx.stroke();
    ctx.setLineDash([]);

    // Power indicator
    const power = Math.hypot(dragStart.x - dragCurrent.x, dragStart.y - dragCurrent.y);
    ctx.fillStyle = `rgba(255, 107, 107, ${Math.min(power / 100, 1)})`;
    ctx.beginPath();
    ctx.arc(PLAYER_X, PLAYER_Y, Math.min(power / 4, 40), 0, Math.PI * 2);
    ctx.fill();
  }

  // Paper ball
  if (paper) {
    ctx.save();
    ctx.translate(paper.x, paper.y);
    ctx.rotate(paper.rotation);
    ctx.fillStyle = 'rgba(255, 200, 100, 0.95)';
    ctx.fillRect(-8, -12, 16, 24);
    ctx.strokeStyle = '#CCC';
    ctx.lineWidth = 1;
    ctx.strokeRect(-8, -12, 16, 24);
    ctx.restore();
  }

  // Score label
  ctx.font = 'bold 16px Arial';
  ctx.fillStyle = 'rgba(43, 45, 66, 0.6)';
  ctx.textAlign = 'left';
  ctx.fillText(`Throws: ${throws}`, 20, CANVAS_HEIGHT - 20);
  ctx.fillText(`Score: ${score}`, 20, CANVAS_HEIGHT - 40);
}

function gameLoop() {
  if (gameRunning) {
    updateGame();
  }
  drawGame();
  if (gameRunning) {
    requestAnimationFrame(gameLoop);
  }
}

// Initialize
const stats = gameSystem.getStats();
document.getElementById('bestScoreStart').textContent = stats.highScore;
document.getElementById('throwsStart').textContent = stats.gamesPlayed;

drawGame();
</script>
</body>
