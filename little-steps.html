<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Little Steps · Big Dreams</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#07091a;font-family:'Nunito',sans-serif;color:#f0eeff;overflow:hidden;width:100vw;height:100vh;touch-action:none}
canvas{position:absolute;top:0;left:0;display:block}

#hud{position:absolute;top:0;left:0;right:0;padding:16px 18px;display:flex;justify-content:space-between;pointer-events:none;z-index:5}
.hlabel{font-size:10px;letter-spacing:2px;opacity:.6;font-weight:700;text-transform:uppercase}
.hval{font-family:'Fredoka One',cursive;font-size:26px;line-height:1.1}
#hearts{display:flex;gap:4px;font-size:20px;margin-top:4px}
.heart.dead{filter:grayscale(1);opacity:.3}

#screen{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;background:radial-gradient(ellipse at 50% 55%,rgba(15,24,80,.97),rgba(7,9,26,.99))}
#screen.off{display:none}

.moon{font-size:58px;margin-bottom:6px;animation:bob 4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.title{font-family:'Fredoka One',cursive;font-size:clamp(34px,9vw,52px);color:#ffd966;text-shadow:0 0 28px rgba(255,180,0,.5);line-height:1}
.subtitle{font-family:'Fredoka One',cursive;font-size:clamp(14px,3.5vw,18px);color:#c8aaff;letter-spacing:2px;margin-top:4px;opacity:.85}
.rule{width:56px;height:3px;background:linear-gradient(90deg,transparent,#c8aaff,transparent);margin:14px auto;border-radius:2px}

.result-box{background:rgba(200,170,255,.07);border:1px solid rgba(200,170,255,.15);border-radius:14px;padding:12px 20px;margin-bottom:14px;display:none}
.result-box.show{display:flex;gap:24px;justify-content:center}
.ritem{display:flex;flex-direction:column;align-items:center}
.rnum{font-family:'Fredoka One',cursive;font-size:26px}
.rlbl{font-size:10px;opacity:.55;letter-spacing:1px;text-transform:uppercase;margin-top:1px}

.chars{display:flex;gap:10px;margin-bottom:14px;overflow-x:auto;max-width:100%;padding-bottom:2px;scrollbar-width:none}
.chars::-webkit-scrollbar{display:none}
.ccard{flex-shrink:0;width:66px;text-align:center;cursor:pointer}
.cbubble{width:58px;height:58px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:28px;border:3px solid transparent;background:rgba(255,255,255,.05);margin:0 auto 3px;position:relative;transition:border-color .2s,background .2s}
.cbubble.sel{border-color:#ffd966;background:rgba(255,215,0,.1);box-shadow:0 0 14px rgba(255,185,0,.4)}
.cbubble.locked{filter:grayscale(1);opacity:.4}
.lockbadge{position:absolute;bottom:-2px;right:-2px;font-size:12px}
.cname{font-size:10px;opacity:.6;font-weight:700}
.ccost{font-size:10px;color:#ffd966;font-weight:900}

.sparks-row{display:flex;align-items:center;gap:7px;background:rgba(255,215,0,.07);border:1px solid rgba(255,215,0,.2);border-radius:28px;padding:6px 16px;margin-bottom:16px;font-size:12px;opacity:.8}
.sval{font-family:'Fredoka One',cursive;font-size:18px;color:#ffd966}

.hint{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:14px}
.phone{font-size:32px;animation:tlt 2s ease-in-out infinite}
@keyframes tlt{0%{transform:rotate(-14deg)}50%{transform:rotate(14deg)}100%{transform:rotate(-14deg)}}
.hintlbl{font-size:11px;letter-spacing:2px;text-transform:uppercase;opacity:.55;font-weight:700}

.btn{background:linear-gradient(135deg,#ffd966,#ffb300);color:#07091a;border:none;padding:14px 42px;font-family:'Fredoka One',cursive;font-size:19px;border-radius:40px;cursor:pointer;letter-spacing:1px;box-shadow:0 4px 20px rgba(255,175,0,.4);transition:transform .12s}
.btn:active{transform:scale(.94)}

#toast{position:absolute;top:76px;left:50%;transform:translateX(-50%);font-family:'Fredoka One',cursive;font-size:19px;color:#ffd966;text-shadow:0 0 10px rgba(255,185,0,.7);pointer-events:none;z-index:8;opacity:0;transition:opacity .25s;white-space:nowrap}
#toast.show{opacity:1}
#mstn{position:absolute;bottom:140px;left:50%;transform:translateX(-50%) translateY(16px);font-family:'Fredoka One',cursive;font-size:14px;color:#7efff5;pointer-events:none;z-index:8;opacity:0;transition:opacity .3s,transform .3s;white-space:nowrap}
#mstn.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>

<canvas id="c"></canvas>

<div id="hud">
  <div>
    <div class="hlabel">Progress</div>
    <div class="hval" id="hdist" style="color:#7efff5">0m</div>
  </div>
  <div style="text-align:right">
    <div id="hearts" class="hearts">
      <span class="heart" id="h0">❤️</span>
      <span class="heart" id="h1">❤️</span>
      <span class="heart" id="h2">❤️</span>
    </div>
    <div style="display:flex;gap:5px;align-items:center;justify-content:flex-end;margin-top:3px">
      <span style="font-size:13px">✨</span>
      <div class="hval" id="hsparks" style="font-size:19px;color:#ffd966">0</div>
    </div>
  </div>
</div>

<div id="toast"></div>
<div id="mstn"></div>

<div id="screen">
  <div class="moon">🌙</div>
  <div class="title" id="stitle">LITTLE STEPS</div>
  <div class="subtitle" id="ssub">Big Dreams</div>
  <div class="rule"></div>
  <div class="result-box" id="rbox">
    <div class="ritem"><div class="rnum" id="rdist" style="color:#7efff5">0m</div><div class="rlbl">Traveled</div></div>
    <div class="ritem"><div class="rnum" id="rsparks" style="color:#ffd966">0</div><div class="rlbl">Sparks</div></div>
  </div>
  <div class="chars" id="chars"></div>
  <div class="sparks-row">✨ Banked Sparks: <span class="sval" id="banked">0</span></div>
  <div class="hint">
    <div class="phone">📱</div>
    <div class="hintlbl">Tilt · Drag · Arrow Keys</div>
  </div>
  <button class="btn" id="btn">Begin Journey</button>
</div>

<script>
const CHARS=[
  {id:'axolotl',name:'Axolotl', cost:0,   emoji:'🦎',color:'#ff9ecd',glow:'#ff6eb0',perk:null},
  {id:'turtle', name:'Turtle',  cost:250,  emoji:'🐢',color:'#6fcf57',glow:'#44b02c',perk:'lantern'},
  {id:'wolffox',name:'Wolf-Fox',cost:600,  emoji:'🦊',color:'#c8aaff',glow:'#9b70ff',perk:'drift'},
  {id:'tiger',  name:'Tiger',   cost:1200, emoji:'🐯',color:'#ffb347',glow:'#ff8c00',perk:'lucky'},
];

let banked   = +( localStorage.getItem('ls_sparks')||0);
let owned    = JSON.parse(localStorage.getItem('ls_owned')||'["axolotl"]');
let selected = localStorage.getItem('ls_char')||'axolotl';

const cv=document.getElementById('c');
const cx=cv.getContext('2d');
function resize(){cv.width=innerWidth;cv.height=innerHeight}
window.addEventListener('resize',resize);
resize();

// ── char strip ───────────────────────────────────
function buildChars(){
  const el=document.getElementById('chars');
  el.innerHTML='';
  CHARS.forEach(ch=>{
    const isOwned=owned.includes(ch.id);
    const d=document.createElement('div');
    d.className='ccard';
    d.innerHTML=`<div class="cbubble ${selected===ch.id?'sel':''} ${isOwned?'':'locked'}">${ch.emoji}${!isOwned?'<span class="lockbadge">🔒</span>':''}</div>
      <div class="cname">${ch.name}</div>
      ${!isOwned?`<div class="ccost">✨${ch.cost}</div>`:'<div class="ccost" style="color:#7efff5">✓</div>'}`;
    d.onclick=()=>{
      if(isOwned){selected=ch.id;localStorage.setItem('ls_char',selected);buildChars();}
      else if(banked>=ch.cost){if(confirm(`Unlock ${ch.name} for ✨${ch.cost}?`)){banked-=ch.cost;owned.push(ch.id);selected=ch.id;localStorage.setItem('ls_sparks',banked);localStorage.setItem('ls_owned',JSON.stringify(owned));localStorage.setItem('ls_char',selected);buildChars();}}
      else{alert(`Need ✨${ch.cost}. You have ✨${banked}.`);}
    };
    el.appendChild(d);
  });
  document.getElementById('banked').textContent=banked;
}
buildChars();

// ── input ─────────────────────────────────────────
let tilt=0,kL=false,kR=false,tx0=null,txN=null;
window.addEventListener('keydown',e=>{if(e.key==='ArrowLeft')kL=true;if(e.key==='ArrowRight')kR=true;});
window.addEventListener('keyup',  e=>{if(e.key==='ArrowLeft')kL=false;if(e.key==='ArrowRight')kR=false;});
window.addEventListener('touchstart',e=>{if(!running)return;tx0=e.touches[0].clientX;txN=tx0;},{passive:true});
window.addEventListener('touchmove', e=>{if(!running)return;txN=e.touches[0].clientX;},{passive:true});
window.addEventListener('touchend',  ()=>{tx0=txN=null;});
function setupTilt(){
  if(typeof DeviceOrientationEvent!=='undefined'){
    if(typeof DeviceOrientationEvent.requestPermission==='function'){
      DeviceOrientationEvent.requestPermission().then(r=>{if(r==='granted')window.addEventListener('deviceorientation',e=>{tilt=e.gamma||0;});}).catch(()=>{});
    } else {
      window.addEventListener('deviceorientation',e=>{tilt=e.gamma||0;});
    }
  }
}

// ── game vars ────────────────────────────────────
let running=false,score=0,sparks=0,lives=3,inv=0;
let px=0,py=0,drift=0,breath=0;
let obs=[],parts=[],floats=[];
let lastSpawn=0,combo=0,comboT=0,lastMS=0,bgOff=0,raf=0;
const MS=[50,100,200,350,500,750,1000];

function resetLives(){
  lives=3;inv=0;
  ['h0','h1','h2'].forEach(id=>{document.getElementById(id).className='heart';});
}
function loseLife(){
  if(inv>0)return;
  lives--;inv=90;
  const h=document.getElementById('h'+lives);
  if(h)h.className='heart dead';
  if(lives<=0){endGame();return;}
}
function checkMS(s){
  const m=MS.find(x=>x>lastMS&&s>=x);
  if(!m)return;lastMS=m;
  const el=document.getElementById('mstn');
  el.textContent=`✨ ${m}m reached!`;
  el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'),2200);
}
function showCombo(n){
  const el=document.getElementById('toast');
  el.textContent=`⭐ x${n} COMBO!`;
  el.classList.add('show');
  clearTimeout(el._t);
  el._t=setTimeout(()=>el.classList.remove('show'),1000);
}

// particles
function burst(x,y,col,n=8){
  for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,sp=1.5+Math.random()*3;parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-1,l:1,col,s:3+Math.random()*4});}
}
function floatTxt(x,y,t,col){floats.push({x,y,t,col,l:1,vy:-1.5});}

function spawnObs(perk){
  const cx2=cv.width/2;
  const spread=Math.min(cv.width*.42,130+score*.25);
  const x=cx2+(Math.random()-.5)*spread*2;
  const isSp=Math.random()<(perk==='lucky'?.18:.12);
  const isMo=!isSp&&Math.random()<.05;
  obs.push({x,y:-60,sz:isSp?12:isMo?16:16+Math.random()*26,isSp,isMo,
    spin:Math.random()*Math.PI*2,dSpin:(Math.random()-.5)*.06,wb:Math.random()*Math.PI*2});
}

// draw helpers
function drawStar(x,y,r,col){
  cx.save();cx.translate(x,y);cx.beginPath();
  for(let i=0;i<5;i++){
    const a=i*4*Math.PI/5-Math.PI/2,b=i*4*Math.PI/5+2*Math.PI/5-Math.PI/2;
    i===0?cx.moveTo(Math.cos(a)*r,Math.sin(a)*r):cx.lineTo(Math.cos(a)*r,Math.sin(a)*r);
    cx.lineTo(Math.cos(b)*r*.45,Math.sin(b)*r*.45);
  }
  cx.closePath();cx.fillStyle=col;cx.shadowBlur=16;cx.shadowColor=col;cx.fill();cx.restore();
}
function drawCrystal(sz){
  cx.beginPath();cx.moveTo(0,-sz);cx.lineTo(sz*.4,0);cx.lineTo(0,sz*.3);cx.lineTo(-sz*.4,0);cx.closePath();
  const g=cx.createLinearGradient(0,-sz,0,sz*.3);g.addColorStop(0,'#c084fc');g.addColorStop(1,'#7c3aed');
  cx.fillStyle=g;cx.shadowBlur=18;cx.shadowColor='#a855f7';cx.fill();
  cx.beginPath();cx.moveTo(sz*.3,-sz*.4);cx.lineTo(sz*.65,0);cx.lineTo(sz*.3,sz*.2);cx.closePath();cx.fillStyle='#9333ea';cx.fill();
}
function drawBg(spd){
  bgOff+=spd*.4;
  const sg=cx.createLinearGradient(0,0,0,cv.height);
  sg.addColorStop(0,'#07091a');sg.addColorStop(.5,'#0d1535');sg.addColorStop(1,'#1a1040');
  cx.fillStyle=sg;cx.fillRect(0,0,cv.width,cv.height);
  // nebula blobs
  [[cv.width*.2,(130-bgOff*.08)%cv.height,150,'rgba(120,60,200,0.055)'],
   [cv.width*.75,(310-bgOff*.06)%cv.height,190,'rgba(60,100,220,0.045)']].forEach(([nx,ny,nr,nc])=>{
    const nb=cx.createRadialGradient(nx,ny,0,nx,ny,nr);nb.addColorStop(0,nc);nb.addColorStop(1,'transparent');
    cx.fillStyle=nb;cx.beginPath();cx.ellipse(nx,ny,nr,nr*.6,0,0,Math.PI*2);cx.fill();
  });
  // path
  const mid=cv.width/2;
  const pg=cx.createLinearGradient(0,cv.height*.2,0,cv.height);
  pg.addColorStop(0,'rgba(100,80,180,0.06)');pg.addColorStop(1,'rgba(100,80,180,0.18)');
  cx.fillStyle=pg;cx.beginPath();cx.moveTo(mid-80,0);cx.lineTo(mid+80,0);
  cx.lineTo(mid+cv.width*.46,cv.height);cx.lineTo(mid-cv.width*.46,cv.height);cx.closePath();cx.fill();
  // dashes
  cx.save();cx.strokeStyle='rgba(200,170,255,0.05)';cx.lineWidth=1.5;cx.setLineDash([20,30]);cx.lineDashOffset=-bgOff;
  cx.beginPath();cx.moveTo(mid,0);cx.lineTo(mid,cv.height);cx.stroke();cx.restore();
}
function drawPlayer(ch,br){
  const r=22+Math.sin(br)*2;
  cx.save();cx.translate(px,py);
  const gg=cx.createRadialGradient(0,0,r*.2,0,0,r*2.4);gg.addColorStop(0,ch.glow+'44');gg.addColorStop(1,'transparent');
  cx.fillStyle=gg;cx.beginPath();cx.arc(0,0,r*2.4,0,Math.PI*2);cx.fill();
  cx.beginPath();cx.arc(0,0,r,0,Math.PI*2);
  const bg=cx.createRadialGradient(-r*.3,-r*.3,1,0,0,r);
  // lighten color
  const n=parseInt(ch.color.slice(1),16);
  const lr=`rgb(${Math.min(255,(n>>16)+40)},${Math.min(255,((n>>8)&255)+40)},${Math.min(255,(n&255)+40)})`;
  bg.addColorStop(0,lr);bg.addColorStop(1,ch.color);
  cx.fillStyle=bg;cx.shadowBlur=20;cx.shadowColor=ch.glow;cx.fill();
  cx.shadowBlur=0;cx.fillStyle='#fff';
  cx.beginPath();cx.arc(-7,-4,5,0,Math.PI*2);cx.fill();
  cx.beginPath();cx.arc(7,-4,5,0,Math.PI*2);cx.fill();
  cx.fillStyle='#1a0a2e';
  cx.beginPath();cx.arc(-6,-4,3,0,Math.PI*2);cx.fill();
  cx.beginPath();cx.arc(8,-4,3,0,Math.PI*2);cx.fill();
  cx.font=`${r*1.1}px serif`;cx.textAlign='center';cx.textBaseline='middle';cx.globalAlpha=.88;
  cx.fillText(ch.emoji,0,0);cx.restore();
}

// ── LOOP ───────────────────────────────────────────
function loop(ts){
  if(!running)return;
  raf=requestAnimationFrame(loop);

  const ch=CHARS.find(c=>c.id===selected)||CHARS[0];
  const spd=2.5+Math.sqrt(score/6);
  const si=Math.max(280,1100-score*2.2);

  drawBg(spd);

  // spawn
  if(ts-lastSpawn>si){spawnObs(ch.perk);lastSpawn=ts;}

  // move player
  let target=0;
  if(kL)target=-6;if(kR)target=6;
  if(tx0!==null&&txN!==null)target=(txN-tx0)*.14;
  if(Math.abs(tilt)>1)target=tilt*.7;
  drift+=(target-drift)*(ch.perk==='drift'?.07:.22);
  px=Math.max(28,Math.min(cv.width-28,px+drift));
  breath+=.06;

  const showP=inv<=0||Math.floor(inv/8)%2===0;
  if(inv>0)inv--;
  if(showP)drawPlayer(ch,breath);

  score+=spd*.012;
  document.getElementById('hdist').textContent=Math.floor(score)+'m';
  checkMS(Math.floor(score));

  // obstacles
  for(let i=obs.length-1;i>=0;i--){
    const o=obs[i];
    o.y+=spd;o.spin+=o.dSpin;o.wb+=.04;
    let alpha=1;
    if(ch.perk==='lantern'){const d=Math.hypot(px-o.x,py-o.y);if(d<130)alpha=.28+(d/130)*.72;}
    cx.save();cx.globalAlpha=alpha;
    if(o.isSp){
      drawStar(o.x,o.y,12*(1+.14*Math.sin(o.wb)),'#ffd966');
    } else if(o.isMo){
      cx.font='26px serif';cx.textAlign='center';cx.textBaseline='middle';
      cx.shadowBlur=14;cx.shadowColor='#fffde7';cx.fillText('🌙',o.x,o.y);
    } else {
      cx.translate(o.x,o.y);cx.rotate(o.spin);drawCrystal(o.sz);
    }
    cx.restore();

    const dist=Math.hypot(px-o.x,py-o.y);
    const hr=(o.isSp||o.isMo)?22:o.sz*.65;
    if(dist<hr+18){
      if(o.isSp){
        sparks++;combo++;comboT=90;if(combo>=3)showCombo(combo);
        burst(o.x,o.y,'#ffd966',10);floatTxt(o.x,o.y-22,'+1 ✨','#ffd966');
        document.getElementById('hsparks').textContent=sparks;obs.splice(i,1);
      } else if(o.isMo){
        sparks+=5;burst(o.x,o.y,'#fffde7',16);floatTxt(o.x,o.y-28,'+5 ✨','#fffde7');
        document.getElementById('hsparks').textContent=sparks;obs.splice(i,1);
      } else if(inv<=0){
        burst(px,py,ch.color,14);obs.splice(i,1);loseLife();
      }
    }
    if(o.y>cv.height+60)obs.splice(i,1);
  }

  if(comboT>0)comboT--;else combo=0;

  // particles
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i];p.x+=p.vx;p.y+=p.vy;p.vy+=.1;p.l-=.025;
    if(p.l<=0){parts.splice(i,1);continue;}
    cx.save();cx.globalAlpha=p.l;cx.fillStyle=p.col;cx.shadowBlur=10;cx.shadowColor=p.col;
    cx.beginPath();cx.arc(p.x,p.y,p.s*p.l,0,Math.PI*2);cx.fill();cx.restore();
  }
  // floats
  for(let i=floats.length-1;i>=0;i--){
    const f=floats[i];f.y+=f.vy;f.l-=.018;
    if(f.l<=0){floats.splice(i,1);continue;}
    cx.save();cx.globalAlpha=f.l;cx.font="bold 16px 'Fredoka One',cursive";cx.fillStyle=f.col;
    cx.shadowBlur=8;cx.shadowColor=f.col;cx.textAlign='center';cx.fillText(f.t,f.x,f.y);cx.restore();
  }
}

function startGame(){
  setupTilt();
  running=true;score=0;sparks=0;drift=0;breath=0;
  obs=[];parts=[];floats=[];lastSpawn=0;combo=0;comboT=0;lastMS=0;bgOff=0;
  resetLives();
  px=cv.width/2;py=cv.height-110;
  document.getElementById('hdist').textContent='0m';
  document.getElementById('hsparks').textContent='0';
  document.getElementById('screen').classList.add('off');
  cancelAnimationFrame(raf);
  raf=requestAnimationFrame(loop);
}

function endGame(){
  running=false;cancelAnimationFrame(raf);
  banked+=sparks;localStorage.setItem('ls_sparks',banked);
  document.getElementById('stitle').textContent='REST NOW';
  document.getElementById('ssub').textContent='Small steps count';
  document.getElementById('rdist').textContent=Math.floor(score)+'m';
  document.getElementById('rsparks').textContent=sparks;
  document.getElementById('rbox').className='result-box show';
  document.getElementById('btn').textContent='Try Again';
  document.getElementById('screen').classList.remove('off');
  buildChars();
}

document.getElementById('btn').addEventListener('click',()=>{
  document.getElementById('stitle').textContent='LITTLE STEPS';
  document.getElementById('ssub').textContent='Big Dreams';
  document.getElementById('rbox').className='result-box';
  document.getElementById('btn').textContent='Begin Journey';
  startGame();
});
</script>
</body>
</html>
