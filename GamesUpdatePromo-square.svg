<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" role="img">
<title>JVDesignStudio Games Update</title>
<desc>Square promotional graphic announcing 22+ games with a new XP, achievement, and character progression system</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0d0d12"/>
    <stop offset="100%" stop-color="#08080c"/>
  </linearGradient>
  <linearGradient id="xpfill" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#3EC9A7"/>
    <stop offset="100%" stop-color="#70A3A7"/>
  </linearGradient>
  <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#3EC9A7" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#3EC9A7" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#818CF8" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect width="1080" height="1080" fill="url(#bg)"/>
<circle cx="120" cy="80" r="280" fill="url(#glow1)"/>
<circle cx="960" cy="1000" r="300" fill="url(#glow2)"/>

<!-- Brand mark -->
<text x="60" y="80" font-family="'Fredoka', 'Segoe UI', sans-serif" font-size="28" font-weight="700" fill="#F0EAD6" letter-spacing="0.5">JVDesignStudio</text>
<rect x="60" y="96" width="46" height="4" rx="2" fill="#3EC9A7"/>

<!-- Headline -->
<text x="60" y="220" font-family="'Fredoka', 'Segoe UI', sans-serif" font-size="64" font-weight="800" fill="#ffffff">22+ Games.</text>
<text x="60" y="290" font-family="'Fredoka', 'Segoe UI', sans-serif" font-size="64" font-weight="800" fill="#3EC9A7">One Big</text>
<text x="60" y="360" font-family="'Fredoka', 'Segoe UI', sans-serif" font-size="64" font-weight="800" fill="#3EC9A7">Update.</text>

<text x="60" y="410" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="24" fill="rgba(255,255,255,0.65)">XP, achievements &amp; character</text>
<text x="60" y="440" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="24" fill="rgba(255,255,255,0.65)">unlocks — live across the arcade.</text>

<!-- Game grid teaser, centered -->
<g transform="translate(90,500)">
  <rect x="0" y="0" width="420" height="420" rx="30" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <g transform="translate(30,30)">
    <rect x="0"   y="0"   width="110" height="110" rx="18" fill="rgba(62,201,167,0.15)"/>
    <text x="55" y="68" font-size="46" text-anchor="middle">🎮</text>
    <rect x="124" y="0"   width="110" height="110" rx="18" fill="rgba(245,166,35,0.15)"/>
    <text x="179" y="68" font-size="46" text-anchor="middle">🍬</text>
    <rect x="248" y="0"   width="110" height="110" rx="18" fill="rgba(129,140,248,0.15)"/>
    <text x="303" y="68" font-size="46" text-anchor="middle">⚡</text>

    <rect x="0"   y="124" width="110" height="110" rx="18" fill="rgba(255,182,193,0.15)"/>
    <text x="55" y="192" font-size="46" text-anchor="middle">🏰</text>
    <rect x="124" y="124" width="110" height="110" rx="18" fill="rgba(167,139,250,0.15)"/>
    <text x="179" y="192" font-size="46" text-anchor="middle">✨</text>
    <rect x="248" y="124" width="110" height="110" rx="18" fill="rgba(62,201,167,0.15)"/>
    <text x="303" y="192" font-size="46" text-anchor="middle">🃏</text>

    <rect x="0"   y="248" width="110" height="110" rx="18" fill="rgba(245,166,35,0.15)"/>
    <text x="55" y="316" font-size="46" text-anchor="middle">🐍</text>
    <rect x="124" y="248" width="110" height="110" rx="18" fill="rgba(129,140,248,0.15)"/>
    <text x="179" y="316" font-size="46" text-anchor="middle">🦗</text>
    <rect x="248" y="248" width="110" height="110" rx="18" fill="rgba(255,182,193,0.15)"/>
    <text x="303" y="316" font-size="46" text-anchor="middle">🐾</text>
  </g>
</g>

<!-- XP bar mockup -->
<g transform="translate(60,960)">
  <rect width="600" height="16" rx="8" fill="rgba(255,255,255,0.08)"/>
  <rect width="400" height="16" rx="8" fill="url(#xpfill)"/>
  <text x="0" y="-14" font-family="-apple-system, sans-serif" font-size="16" font-weight="700" fill="rgba(255,255,255,0.5)" letter-spacing="1">LEVEL 7 · 2,340 / 3,000 XP</text>
</g>

<!-- CTA -->
<g transform="translate(60,1010)">
  <rect width="320" height="52" rx="26" fill="#3EC9A7"/>
  <text x="160" y="34" font-family="'Fredoka', sans-serif" font-size="20" font-weight="700" fill="#08080c" text-anchor="middle">Play Free →</text>
  <text x="350" y="34" font-family="-apple-system, sans-serif" font-size="19" fill="rgba(255,255,255,0.55)">jvdesignstudio.co.uk/games</text>
</g>
</svg>
