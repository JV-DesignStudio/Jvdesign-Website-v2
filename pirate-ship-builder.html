<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pirate Ship Shipyard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Pirata+One&family=IM+Fell+English+SC&family=Courier+Prime:wght@400;700&display=swap');

:root {
  --sea: #0a1628;
  --sea-mid: #132240;
  --sea-light: #1a3355;
  --gold: #d4a843;
  --gold-bright: #f0c850;
  --gold-dim: rgba(212,168,67,0.15);
  --parchment: #e8d5b0;
  --parchment-dim: #b8a580;
  --rust: #8b4513;
  --crimson: #8b1a1a;
  --wood-light: #a0784c;
  --plank: #2a1f14;
}

* { margin:0; padding:0; box-sizing:border-box; }
body { background:var(--sea); color:var(--parchment); font-family:'IM Fell English SC',serif; overflow:hidden; height:100vh; }

#app {
  display:grid;
  grid-template-columns:360px 1fr;
  grid-template-rows:56px 1fr;
  height:100vh;
}

/* ═══ HEADER ═══ */
header {
  grid-column:1/-1;
  background:linear-gradient(180deg,var(--sea-mid),var(--sea));
  border-bottom:2px solid var(--gold);
  display:flex; align-items:center; justify-content:space-between;
  padding:0 20px;
}
header h1 {
  font-family:'Pirata One',cursive;
  font-size:22px; color:var(--gold);
  text-shadow:0 0 20px rgba(212,168,67,0.25);
  letter-spacing:2px;
}
.hdr-btns { display:flex; gap:6px; }
.hdr-btns button {
  background:rgba(212,168,67,0.08);
  border:1px solid var(--gold);
  color:var(--gold); padding:5px 13px;
  font-family:'IM Fell English SC',serif;
  font-size:11px; cursor:pointer;
  transition:all .25s; letter-spacing:1px; border-radius:3px;
}
.hdr-btns button:hover { background:var(--gold); color:var(--sea); }

/* ═══ SIDEBAR ═══ */
#sidebar {
  background:linear-gradient(160deg,var(--sea-mid),var(--sea));
  border-right:1px solid rgba(212,168,67,0.15);
  display:flex; flex-direction:column; overflow:hidden;
}
.prog { padding:12px 14px 8px; border-bottom:1px solid rgba(212,168,67,0.12); }
.prog-label { font-size:10px; color:var(--gold); letter-spacing:2px; text-transform:uppercase; }
.prog-bar { width:100%; height:5px; background:rgba(212,168,67,0.1); border-radius:3px; margin-top:6px; }
.prog-fill { height:100%; background:linear-gradient(90deg,var(--gold),var(--gold-bright)); border-radius:3px; transition:width .4s; }
.prog-count { font-family:'Courier Prime',monospace; font-size:10px; color:var(--parchment-dim); margin-top:4px; }

.step-list { flex:1; overflow-y:auto; padding:6px; scrollbar-width:thin; scrollbar-color:var(--gold) transparent; }
.step-list::-webkit-scrollbar { width:4px; }
.step-list::-webkit-scrollbar-thumb { background:var(--gold); border-radius:2px; }

.si { padding:8px 10px; margin-bottom:3px; border-radius:5px; cursor:pointer; display:flex; align-items:center; gap:9px; border:1px solid transparent; transition:all .25s; }
.si:hover { background:rgba(212,168,67,0.05); }
.si.active { background:rgba(212,168,67,0.1); border-color:var(--gold); }
.si.done { opacity:.6; }
.si.done .sn { background:var(--gold); color:var(--sea); }
.sn { width:24px; height:24px; border-radius:50%; border:1.5px solid var(--gold); display:flex; align-items:center; justify-content:center; font-family:'Courier Prime',monospace; font-size:10px; flex-shrink:0; color:var(--gold); transition:all .25s; }
.sl { font-size:12px; color:var(--parchment); line-height:1.25; }
.si.active .sl { color:var(--gold-bright); }

/* Controls */
.cpanel { padding:12px; border-top:1px solid rgba(212,168,67,0.12); background:rgba(0,0,0,0.12); overflow-y:auto; max-height:45vh; }
.cpanel::-webkit-scrollbar { width:4px; }
.cpanel::-webkit-scrollbar-thumb { background:var(--gold); border-radius:2px; }
.ct { font-size:12px; color:var(--gold); margin-bottom:8px; letter-spacing:1px; }
.cg { margin-bottom:10px; }
.cg label { display:block; font-size:10px; color:var(--parchment-dim); margin-bottom:3px; letter-spacing:1px; }
.cg input[type="range"] { width:100%; -webkit-appearance:none; height:3px; background:rgba(212,168,67,0.2); border-radius:2px; outline:none; }
.cg input[type="range"]::-webkit-slider-thumb { -webkit-appearance:none; width:12px; height:12px; background:var(--gold); border-radius:50%; cursor:pointer; }
.cg .rv { font-family:'Courier Prime',monospace; font-size:10px; color:var(--gold-bright); float:right; margin-top:-14px; }
.cg select { width:100%; padding:5px 7px; background:rgba(0,0,0,0.3); border:1px solid rgba(212,168,67,0.25); color:var(--parchment); font-family:'IM Fell English SC',serif; font-size:11px; border-radius:3px; outline:none; }
.cg select option { background:var(--sea); }
input[type="color"] { width:100%; height:28px; border:1px solid rgba(212,168,67,0.25); background:transparent; cursor:pointer; border-radius:3px; }
.cg input[type="checkbox"] { accent-color:var(--gold); }

.snav { display:flex; gap:6px; padding:10px 12px; border-top:1px solid rgba(212,168,67,0.12); }
.snav button { flex:1; padding:7px; font-family:'IM Fell English SC',serif; font-size:12px; cursor:pointer; border-radius:3px; transition:all .25s; letter-spacing:1px; }
.bp { background:transparent; border:1px solid var(--gold); color:var(--gold); }
.bn { background:var(--gold); border:1px solid var(--gold); color:var(--sea); font-weight:700; }
.bp:hover { background:rgba(212,168,67,0.12); }
.bn:hover { background:var(--gold-bright); }
.bp:disabled,.bn:disabled { opacity:.3; cursor:default; }

/* ═══ VIEWPORT ═══ */
#viewport { position:relative; background:radial-gradient(ellipse at 50% 60%,#132a48 0%,var(--sea) 70%); overflow:hidden; }
#viewport canvas { display:block; }
.toast { position:absolute; top:14px; left:50%; transform:translateX(-50%); background:rgba(10,22,40,0.92); border:1px solid var(--gold); padding:8px 22px; font-family:'Pirata One',cursive; font-size:14px; color:var(--gold-bright); border-radius:5px; pointer-events:none; opacity:0; transition:opacity .35s; z-index:10; white-space:nowrap; }
.toast.show { opacity:1; }
.dims { position:absolute; top:12px; right:12px; background:rgba(10,22,40,0.85); border:1px solid rgba(212,168,67,0.25); border-radius:5px; padding:7px 12px; font-family:'Courier Prime',monospace; font-size:10px; color:var(--parchment-dim); z-index:5; }
.dims span { color:var(--gold-bright); }
.vhint { position:absolute; bottom:12px; left:50%; transform:translateX(-50%); font-size:10px; color:rgba(212,168,67,0.4); letter-spacing:2px; pointer-events:none; animation:fadeH 4s ease infinite; }
@keyframes fadeH { 0%,100%{opacity:.25} 50%{opacity:.6} }

/* ═══ MODAL ═══ */
.mo { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:100; align-items:center; justify-content:center; }
.mo.open { display:flex; }
.md { background:linear-gradient(145deg,var(--sea-mid),var(--sea)); border:1px solid var(--gold); border-radius:8px; padding:24px; width:380px; max-width:90vw; }
.md h2 { font-family:'Pirata One',cursive; font-size:18px; color:var(--gold); margin-bottom:14px; }
.md input[type="text"] { width:100%; padding:7px 10px; background:rgba(0,0,0,0.3); border:1px solid rgba(212,168,67,0.25); color:var(--parchment); font-family:'IM Fell English SC',serif; font-size:13px; border-radius:3px; outline:none; margin-bottom:12px; }
.saves-list { max-height:160px; overflow-y:auto; margin-bottom:12px; }
.se { display:flex; justify-content:space-between; align-items:center; padding:7px 8px; border-bottom:1px solid rgba(212,168,67,0.08); cursor:pointer; transition:background .2s; }
.se:hover { background:rgba(212,168,67,0.06); }
.se .sname { font-size:12px; color:var(--parchment); }
.se .sdate { font-family:'Courier Prime',monospace; font-size:9px; color:var(--parchment-dim); }
.se .dbtn { background:none; border:none; color:var(--crimson); cursor:pointer; font-size:13px; padding:2px 5px; }
.mb { display:flex; gap:6px; justify-content:flex-end; }
.mb button { padding:6px 16px; font-family:'IM Fell English SC',serif; font-size:12px; cursor:pointer; border-radius:3px; transition:all .25s; }
.mbs { background:var(--gold); border:1px solid var(--gold); color:var(--sea); }
.mbc { background:transparent; border:1px solid rgba(212,168,67,0.35); color:var(--parchment-dim); }

/* Water plane shimmer */
@keyframes waterShimmer {
  0%{opacity:.12} 50%{opacity:.22} 100%{opacity:.12}
}

/* ═══ MOBILE ═══ */
@media (max-width: 860px) {
  body { overflow:auto; height:auto; min-height:100vh; }
  #app {
    grid-template-columns: 1fr;
    grid-template-rows: auto auto auto;
    height: auto;
    min-height: 100vh;
  }
  header {
    grid-column: 1;
    flex-wrap: wrap;
    padding: 10px 14px;
    gap: 8px;
    height: auto;
  }
  header h1 {
    font-size: 15px;
    letter-spacing: 1.5px;
    flex: 1 1 100%;
    text-align: center;
  }
  .hdr-btns {
    flex-wrap: wrap;
    justify-content: center;
    width: 100%;
    gap: 6px;
  }
  .hdr-btns button {
    font-size: 11px;
    padding: 8px 10px;
    flex: 1 1 auto;
    min-width: 70px;
  }
  #viewport {
    order: 1;
    height: 55vh;
    min-height: 320px;
  }
  #sidebar {
    order: 2;
    border-right: none;
    border-top: 1px solid rgba(212,168,67,0.2);
    max-height: none;
    overflow: visible;
  }
  .step-list { max-height: none; overflow-y: visible; }
  .cpanel { padding: 14px; max-height: none; overflow-y: visible; }
  .snav {
    position: sticky;
    bottom: 0;
    background: var(--sea);
    padding: 10px;
    border-top: 1px solid rgba(212,168,67,0.2);
  }
  .snav button { font-size: 13px; padding: 12px 8px; }
  .vhint { font-size: 9px; }
  .dims { font-size: 9px; padding: 5px 9px; }
  .md { width: 92vw; max-width: 92vw; max-height: 85vh; overflow-y: auto; }
}
@media (max-width: 480px) {
  header h1 { font-size: 13px; }
  .hdr-btns button { font-size: 10px; padding: 7px 6px; }
  #viewport { height: 50vh; min-height: 280px; }
}
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>🏴‍☠️ Pirate Ship Shipyard</h1>
    <div class="hdr-btns">
      <button onclick="openSaveModal()">💾 Save</button>
      <button onclick="openLoadModal()">📂 Load</button>
      <button onclick="exportOBJ()">⬇ Export OBJ</button>
      <button onclick="resetAll()">🔄 Reset</button>
    </div>
  </header>
  <div id="sidebar">
    <div class="prog">
      <div class="prog-label">Shipyard Progress</div>
      <div class="prog-bar"><div class="prog-fill" id="progFill"></div></div>
      <div class="prog-count" id="progCount">Step 1 of 20</div>
    </div>
    <div class="step-list" id="stepList"></div>
    <div class="cpanel" id="cpanel"></div>
    <div class="snav">
      <button class="bp" id="bPrev" onclick="prev()">◀ Prev</button>
      <button class="bn" id="bNext" onclick="next()">Next ▶</button>
    </div>
  </div>
  <div id="viewport">
    <div class="toast" id="toast"></div>
    <div class="dims">Ship: <span id="dL">12</span>m × <span id="dW">4</span>m × <span id="dH">3</span>m</div>
    <div class="vhint">Drag to orbit · Scroll to zoom</div>
  </div>
</div>
<div class="mo" id="modalO"><div class="md" id="modalC"></div></div>

<script>
// ═══════════════════════════════════════
// DATA
// ═══════════════════════════════════════
const STEPS=[
  {id:'hull',name:'Hull Shape',d:'Length, beam width and depth of the hull'},
  {id:'hullCurve',name:'Hull Curvature',d:'Bow sharpness, stern width and keel depth'},
  {id:'deck',name:'Main Deck',d:'Deck thickness and plank style'},
  {id:'bowsprit',name:'Bowsprit',d:'The spar extending forward from the bow'},
  {id:'stern',name:'Stern Castle',d:'The raised platform at the rear'},
  {id:'forecastle',name:'Forecastle',d:'The raised section at the bow'},
  {id:'mainMast',name:'Main Mast',d:'The tallest central mast'},
  {id:'foreMast',name:'Fore Mast',d:'The forward mast'},
  {id:'mizzenMast',name:'Mizzen Mast',d:'The rear mast'},
  {id:'sails',name:'Sails',d:'Sail size and billowing'},
  {id:'crowsNest',name:"Crow's Nest",d:'Lookout platform on the main mast'},
  {id:'railings',name:'Railings & Gunwale',d:'Side railings and rail posts'},
  {id:'cannons',name:'Cannon Ports',d:'Gun ports along the hull'},
  {id:'rudder',name:'Rudder',d:'Steering rudder at the stern'},
  {id:'anchor',name:'Anchor',d:'The ship anchor'},
  {id:'figurehead',name:'Figurehead',d:'Decorative bow sculpture'},
  {id:'flags',name:'Flags & Jolly Roger',d:'Flags atop the masts'},
  {id:'windows',name:'Stern Windows',d:'Captain cabin windows'},
  {id:'colors',name:'Colors & Materials',d:'Paint and wood colors'},
  {id:'details',name:'Final Details',d:'Rope, lanterns, finishing touches'},
];

let P={
  // Hull
  hullLen:12, hullBeam:4, hullDepth:3,
  bowSharp:0.7, sternW:0.6, keelDepth:0.8,
  // Deck
  deckThick:0.15,
  // Bowsprit
  bspritLen:4, bspritR:0.08, bspritAngle:25,
  // Stern castle
  sternH:1.8, sternLen:3,
  // Forecastle
  fcH:1.2, fcLen:2,
  // Masts
  mainMastH:10, mainMastR:0.12, mainMastPos:0.05,
  foreMastH:8, foreMastR:0.1, foreMastPos:0.32,
  mizzenMastH:7, mizzenMastR:0.09, mizzenMastPos:-0.35,
  // Sails
  sailW:1.0, sailBillow:0.4, sailCount:2,
  // Crow's nest
  nestR:0.5, nestH:0.3, nestPos:0.7,
  // Railings
  railH:0.4, railPosts:12,
  // Cannons
  cannonCount:5, cannonR:0.06,
  // Rudder
  rudderW:1.0, rudderH:2.0,
  // Anchor
  anchorSize:0.8,
  // Figurehead
  figSize:0.6, showFigure:true,
  // Flags
  flagW:1.5, flagH:1.0, showJolly:true,
  // Windows
  winCount:3, winR:0.25,
  // Colors
  hullColor:'#3a2010', deckColor:'#8b6b3a', sailColor:'#e8dcc8',
  mastColor:'#6b4a2a', metalColor:'#555555', flagColor:'#1a1a1a',
  trimColor:'#c9a84c', waterColor:'#0a3060',
  // Details
  showRopes:true, showLanterns:true,
};

let curStep=0;
let scene,camera,renderer,shipGroup,waterMesh;
let isDrag=false,mX=0,mY=0,cTheta=0.5,cPhi=0.75,cDist=20;

// ═══════════════════════════════════════
// THREE SETUP
// ═══════════════════════════════════════
function initThree(){
  const vp=document.getElementById('viewport');
  scene=new THREE.Scene();
  scene.fog=new THREE.FogExp2(0x0a1628,0.012);
  camera=new THREE.PerspectiveCamera(40,vp.clientWidth/vp.clientHeight,0.1,200);
  renderer=new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(vp.clientWidth,vp.clientHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.toneMapping=THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure=1.0;
  vp.appendChild(renderer.domElement);

  // Lights
  scene.add(new THREE.AmbientLight(0x4466aa,0.45));
  const sun=new THREE.DirectionalLight(0xffeedd,0.9);
  sun.position.set(10,20,10); sun.castShadow=true;
  sun.shadow.mapSize.set(1024,1024);
  sun.shadow.camera.near=0.5; sun.shadow.camera.far=60;
  sun.shadow.camera.left=-20; sun.shadow.camera.right=20;
  sun.shadow.camera.top=20; sun.shadow.camera.bottom=-20;
  scene.add(sun);
  scene.add(new THREE.DirectionalLight(0x88aacc,0.25).position.set(-10,8,-5)||scene.children[scene.children.length-1]);
  const pl=new THREE.PointLight(0xffcc77,0.3,30); pl.position.set(0,10,0); scene.add(pl);

  // Water
  const wGeo=new THREE.PlaneGeometry(120,120,60,60);
  const wMat=new THREE.MeshStandardMaterial({color:0x0a3060,roughness:0.3,metalness:0.6,transparent:true,opacity:0.85});
  waterMesh=new THREE.Mesh(wGeo,wMat);
  waterMesh.rotation.x=-Math.PI/2;
  waterMesh.position.y=-0.1;
  waterMesh.receiveShadow=true;
  scene.add(waterMesh);

  shipGroup=new THREE.Group();
  scene.add(shipGroup);

  // Controls
  const c=renderer.domElement;
  c.addEventListener('mousedown',e=>{isDrag=true;mX=e.clientX;mY=e.clientY;});
  c.addEventListener('mousemove',e=>{if(!isDrag)return;cTheta-=(e.clientX-mX)*0.004;cPhi=Math.max(0.1,Math.min(Math.PI-0.1,cPhi-(e.clientY-mY)*0.004));mX=e.clientX;mY=e.clientY;});
  window.addEventListener('mouseup',()=>isDrag=false);
  c.addEventListener('wheel',e=>{cDist=Math.max(3,Math.min(50,cDist+e.deltaY*0.015));e.preventDefault();},{passive:false});
  let tX,tY,tD;
  c.addEventListener('touchstart',e=>{if(e.touches.length===1){tX=e.touches[0].clientX;tY=e.touches[0].clientY;}if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;tD=Math.sqrt(dx*dx+dy*dy);}});
  c.addEventListener('touchmove',e=>{e.preventDefault();if(e.touches.length===1){cTheta-=(e.touches[0].clientX-tX)*0.004;cPhi=Math.max(0.1,Math.min(Math.PI-0.1,cPhi-(e.touches[0].clientY-tY)*0.004));tX=e.touches[0].clientX;tY=e.touches[0].clientY;}if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY,d=Math.sqrt(dx*dx+dy*dy);cDist=Math.max(3,Math.min(50,cDist-(d-tD)*0.03));tD=d;}},{passive:false});
  window.addEventListener('resize',()=>{camera.aspect=vp.clientWidth/vp.clientHeight;camera.updateProjectionMatrix();renderer.setSize(vp.clientWidth,vp.clientHeight);});

  let time=0;
  (function anim(){
    requestAnimationFrame(anim);
    time+=0.01;
    // Animate water
    const wp=waterMesh.geometry.attributes.position;
    for(let i=0;i<wp.count;i++){
      const x=wp.getX(i),y=wp.getY(i);
      wp.setZ(i,Math.sin(x*0.3+time)*0.15+Math.cos(y*0.2+time*0.7)*0.1);
    }
    wp.needsUpdate=true;
    // Camera
    const cx=cDist*Math.sin(cPhi)*Math.cos(cTheta);
    const cy=cDist*Math.cos(cPhi);
    const cz=cDist*Math.sin(cPhi)*Math.sin(cTheta);
    camera.position.set(cx,cy+2,cz);
    camera.lookAt(0,1.5,0);
    renderer.render(scene,camera);
  })();
}

// ═══════════════════════════════════════
// SHIP BUILDER
// ═══════════════════════════════════════
function rebuildShip(){
  while(shipGroup.children.length)shipGroup.remove(shipGroup.children[0]);
  const p=P;
  const hullMat=new THREE.MeshStandardMaterial({color:p.hullColor,roughness:0.7,metalness:0.05});
  const deckMat=new THREE.MeshStandardMaterial({color:p.deckColor,roughness:0.8,metalness:0.02});
  const sailMat=new THREE.MeshStandardMaterial({color:p.sailColor,roughness:0.9,metalness:0,side:THREE.DoubleSide});
  const mastMat=new THREE.MeshStandardMaterial({color:p.mastColor,roughness:0.7,metalness:0.05});
  const metalMat=new THREE.MeshStandardMaterial({color:p.metalColor,roughness:0.35,metalness:0.85});
  const flagMat=new THREE.MeshStandardMaterial({color:p.flagColor,roughness:0.9,metalness:0,side:THREE.DoubleSide});
  const trimMat=new THREE.MeshStandardMaterial({color:p.trimColor,roughness:0.4,metalness:0.6});

  const HL=p.hullLen, HB=p.hullBeam, HD=p.hullDepth;

  // ─── HULL (custom shape using lathe-like cross sections) ───
  const hullG=new THREE.Group();
  shipGroup.add(hullG);

  // Build hull using extruded cross-sections
  const hullShape=new THREE.Shape();
  const slices=24;
  const hullVerts=[];
  const hullFaces=[];
  const rings=[];

  for(let i=0;i<=slices;i++){
    const t=i/slices; // 0=bow, 1=stern
    const z=(t-0.5)*HL; // centered
    // Width at this slice
    let w;
    if(t<0.3) w=HB*0.5*Math.pow(t/0.3,p.bowSharp);
    else if(t>0.75) w=HB*0.5*p.sternW+(HB*0.5*(1-p.sternW))*Math.pow(1-(t-0.75)/0.25,0.5);
    else w=HB*0.5;
    // Cross-section: U-shape
    const pts=[];
    const cSegs=12;
    for(let j=0;j<=cSegs;j++){
      const a=j/cSegs; // 0=port gunwale, 1=starboard gunwale
      let x,y;
      if(a<=0.15){
        // Port side upper
        x=-w+w*2*(a/0.15)*0;
        x=-w;
        y=0-(a/0.15)*0;
        y=0;
      }
      // Simpler: semicircle bottom + straight sides
      if(a<0.1){ x=-w; y=0-a/0.1*0; y=0; }
      else if(a<0.2){ x=-w; y=-(a-0.1)/0.1*HD*(0.5+0.5*p.keelDepth); }
      else if(a<=0.5){
        const ba=(a-0.2)/0.3;
        const angle=Math.PI*0.5+Math.PI*ba;
        const kw=w*0.8;
        const kd=HD*p.keelDepth;
        x=Math.cos(angle)*kw;
        y=-HD*0.5-Math.sin(angle)*kd*0.5+kd*0.2;
      }
      else if(a<=0.8){
        const ba=(a-0.5)/0.3;
        const angle=Math.PI*1.5+Math.PI*ba;
        const kw=w*0.8;
        const kd=HD*p.keelDepth;
        x=Math.cos(angle)*kw;
        y=-HD*0.5-Math.sin(angle)*kd*0.5+kd*0.2;
      }
      else if(a<0.9){ x=w; y=-(0.9-a)/0.1*HD*(0.5+0.5*p.keelDepth); y=-(1-(a-0.8)/0.1)*HD*(0.5+0.5*p.keelDepth); }
      else { x=w; y=0; }
      pts.push({x,y,z});
    }
    rings.push(pts);
  }

  // Build geometry from rings
  const hullGeo=new THREE.BufferGeometry();
  const verts=[],indices=[],normals=[];
  for(let i=0;i<rings.length;i++){
    for(let j=0;j<rings[i].length;j++){
      const pt=rings[i][j];
      verts.push(pt.x,pt.y,pt.z);
      normals.push(pt.x,pt.y*0.3,0); // rough normals
    }
  }
  const ringLen=rings[0].length;
  for(let i=0;i<rings.length-1;i++){
    for(let j=0;j<ringLen-1;j++){
      const a=i*ringLen+j, b=a+1, c=(i+1)*ringLen+j, d=c+1;
      indices.push(a,c,b, b,c,d);
    }
  }
  hullGeo.setAttribute('position',new THREE.Float32BufferAttribute(verts,3));
  hullGeo.setIndex(indices);
  hullGeo.computeVertexNormals();
  const hullMesh=new THREE.Mesh(hullGeo,hullMat);
  hullMesh.castShadow=true;
  hullMesh.receiveShadow=true;
  hullG.add(hullMesh);

  // Keel strip
  const keelGeo=new THREE.BoxGeometry(0.12,HD*p.keelDepth*0.3,HL*0.9);
  const keel=new THREE.Mesh(keelGeo,new THREE.MeshStandardMaterial({color:'#1a0e05',roughness:0.8}));
  keel.position.y=-HD*0.5-HD*p.keelDepth*0.15;
  hullG.add(keel);

  // ─── DECK ───
  const deckGeo=new THREE.BoxGeometry(HB*0.85,p.deckThick,HL*0.88);
  const deck=new THREE.Mesh(deckGeo,deckMat);
  deck.position.y=0;
  deck.castShadow=true;
  deck.receiveShadow=true;
  shipGroup.add(deck);

  // Deck plank lines
  for(let i=-4;i<=4;i++){
    const lineGeo=new THREE.BoxGeometry(0.02,p.deckThick+0.01,HL*0.85);
    const line=new THREE.Mesh(lineGeo,new THREE.MeshStandardMaterial({color:'#5a4020',roughness:0.9}));
    line.position.set(i*HB*0.09,0.001,0);
    shipGroup.add(line);
  }

  // ─── BOWSPRIT ───
  const bAng=p.bspritAngle*Math.PI/180;
  const bGeo=new THREE.CylinderGeometry(p.bspritR*0.5,p.bspritR,p.bspritLen,8);
  const bowsprit=new THREE.Mesh(bGeo,mastMat);
  bowsprit.rotation.z=Math.PI/2+bAng;
  bowsprit.position.set(0,0.3,HL*0.5+p.bspritLen*0.4*Math.cos(bAng));
  bowsprit.position.y+=p.bspritLen*0.4*Math.sin(bAng);
  bowsprit.castShadow=true;
  shipGroup.add(bowsprit);

  // ─── STERN CASTLE ───
  const scGeo=new THREE.BoxGeometry(HB*0.78,p.sternH,p.sternLen);
  const sc=new THREE.Mesh(scGeo,hullMat);
  sc.position.set(0,p.sternH/2,-HL*0.5+p.sternLen*0.5);
  sc.castShadow=true;
  shipGroup.add(sc);
  // Stern castle deck
  const scdGeo=new THREE.BoxGeometry(HB*0.82,p.deckThick,p.sternLen+0.1);
  const scd=new THREE.Mesh(scdGeo,deckMat);
  scd.position.set(0,p.sternH,-HL*0.5+p.sternLen*0.5);
  scd.castShadow=true;
  shipGroup.add(scd);
  // Stern railing
  const srGeo=new THREE.BoxGeometry(HB*0.82,p.railH*0.8,0.08);
  const sr=new THREE.Mesh(srGeo,trimMat);
  sr.position.set(0,p.sternH+p.railH*0.4,-HL*0.5);
  shipGroup.add(sr);

  // ─── FORECASTLE ───
  const fcGeo=new THREE.BoxGeometry(HB*0.7,p.fcH,p.fcLen);
  const fc=new THREE.Mesh(fcGeo,hullMat);
  fc.position.set(0,p.fcH/2,HL*0.5-p.fcLen*0.5);
  fc.castShadow=true;
  shipGroup.add(fc);
  const fcdGeo=new THREE.BoxGeometry(HB*0.74,p.deckThick,p.fcLen+0.1);
  const fcd=new THREE.Mesh(fcdGeo,deckMat);
  fcd.position.set(0,p.fcH,HL*0.5-p.fcLen*0.5);
  fcd.castShadow=true;
  shipGroup.add(fcd);

  // ─── MASTS ───
  function buildMast(height,radius,zPos,name){
    const mastG=new THREE.Group();
    // Main pole
    const mGeo=new THREE.CylinderGeometry(radius*0.4,radius,height,8);
    const mast=new THREE.Mesh(mGeo,mastMat);
    mast.position.y=height/2;
    mast.castShadow=true;
    mastG.add(mast);
    // Yards (horizontal spars)
    const yardCount=Math.min(p.sailCount,3);
    for(let i=0;i<yardCount;i++){
      const yh=height*(0.45+i*0.22);
      const yw=HB*(1.1-i*0.15)*p.sailW;
      const yGeo=new THREE.CylinderGeometry(0.03,0.03,yw,6);
      const yard=new THREE.Mesh(yGeo,mastMat);
      yard.rotation.z=Math.PI/2;
      yard.position.y=yh;
      yard.castShadow=true;
      mastG.add(yard);

      // Sail
      const sw=yw*0.9, sh=height*0.2;
      const sailGeo=new THREE.PlaneGeometry(sw,sh,8,4);
      // Billow the sail
      const sPos=sailGeo.attributes.position;
      for(let v=0;v<sPos.count;v++){
        const sx=sPos.getX(v), sy=sPos.getY(v);
        const billow=Math.sin((sx/sw+0.5)*Math.PI)*Math.sin((sy/sh+0.5)*Math.PI)*p.sailBillow;
        sPos.setZ(v,billow);
      }
      sailGeo.computeVertexNormals();
      const sail=new THREE.Mesh(sailGeo,sailMat);
      sail.position.y=yh-sh*0.5;
      sail.castShadow=true;
      mastG.add(sail);
    }
    mastG.position.z=HL*zPos;
    shipGroup.add(mastG);
    return mastG;
  }

  const mainM=buildMast(p.mainMastH,p.mainMastR,p.mainMastPos,'main');
  const foreM=buildMast(p.foreMastH,p.foreMastR,p.foreMastPos,'fore');
  const mizzenM=buildMast(p.mizzenMastH,p.mizzenMastR,p.mizzenMastPos,'mizzen');

  // ─── CROW'S NEST ───
  const nestY=p.mainMastH*p.nestPos;
  const nestGeo=new THREE.CylinderGeometry(p.nestR,p.nestR*0.85,p.nestH,12,1,true);
  const nest=new THREE.Mesh(nestGeo,mastMat);
  nest.position.set(0,nestY,HL*p.mainMastPos);
  shipGroup.add(nest);
  // Nest floor
  const nfGeo=new THREE.CylinderGeometry(p.nestR*0.95,p.nestR*0.95,0.05,12);
  const nf=new THREE.Mesh(nfGeo,deckMat);
  nf.position.set(0,nestY-p.nestH*0.4,HL*p.mainMastPos);
  shipGroup.add(nf);

  // ─── RAILINGS ───
  [-1,1].forEach(side=>{
    // Top rail
    const rGeo=new THREE.BoxGeometry(0.05,0.05,HL*0.7);
    const rail=new THREE.Mesh(rGeo,trimMat);
    rail.position.set(side*HB*0.43,p.railH,0);
    shipGroup.add(rail);
    // Posts
    for(let i=0;i<p.railPosts;i++){
      const t=i/(p.railPosts-1);
      const z=(t-0.5)*HL*0.65;
      const pGeo=new THREE.CylinderGeometry(0.02,0.02,p.railH,6);
      const post=new THREE.Mesh(pGeo,trimMat);
      post.position.set(side*HB*0.43,p.railH*0.5,z);
      shipGroup.add(post);
    }
  });

  // ─── CANNON PORTS ───
  [-1,1].forEach(side=>{
    for(let i=0;i<p.cannonCount;i++){
      const t=(i+1)/(p.cannonCount+1);
      const z=(t-0.5)*HL*0.6;
      // Port hole
      const phGeo=new THREE.BoxGeometry(0.02,0.22,0.22);
      const ph=new THREE.Mesh(phGeo,new THREE.MeshStandardMaterial({color:'#111'}));
      ph.position.set(side*HB*0.44,-HD*0.15,z);
      shipGroup.add(ph);
      // Cannon barrel
      const cbGeo=new THREE.CylinderGeometry(p.cannonR*0.6,p.cannonR,0.5,8);
      const cb=new THREE.Mesh(cbGeo,metalMat);
      cb.rotation.z=side*Math.PI/2;
      cb.position.set(side*(HB*0.44+0.15),-HD*0.15,z);
      cb.castShadow=true;
      shipGroup.add(cb);
    }
  });

  // ─── RUDDER ───
  const rudGeo=new THREE.BoxGeometry(0.12,p.rudderH,p.rudderW);
  const rudder=new THREE.Mesh(rudGeo,hullMat);
  rudder.position.set(0,-p.rudderH*0.3,-HL*0.5-0.1);
  rudder.castShadow=true;
  shipGroup.add(rudder);
  // Rudder post
  const rpGeo=new THREE.CylinderGeometry(0.04,0.04,p.rudderH*1.1,6);
  const rp=new THREE.Mesh(rpGeo,metalMat);
  rp.position.set(0,-p.rudderH*0.3+p.rudderH*0.55,-HL*0.5-0.05);
  shipGroup.add(rp);

  // ─── ANCHOR ───
  const aS=p.anchorSize;
  // Shank
  const ashGeo=new THREE.CylinderGeometry(0.03*aS,0.03*aS,1.2*aS,6);
  const ash=new THREE.Mesh(ashGeo,metalMat);
  ash.position.set(HB*0.35,-HD*0.3,HL*0.35);
  ash.castShadow=true;
  shipGroup.add(ash);
  // Ring
  const arGeo=new THREE.TorusGeometry(0.12*aS,0.025*aS,8,16);
  const ar=new THREE.Mesh(arGeo,metalMat);
  ar.position.set(HB*0.35,-HD*0.3+0.6*aS,HL*0.35);
  shipGroup.add(ar);
  // Arms
  [-1,1].forEach(s=>{
    const armGeo=new THREE.CylinderGeometry(0.025*aS,0.025*aS,0.5*aS,6);
    const arm=new THREE.Mesh(armGeo,metalMat);
    arm.rotation.z=s*Math.PI/4;
    arm.position.set(HB*0.35+s*0.15*aS,-HD*0.3-0.5*aS,HL*0.35);
    shipGroup.add(arm);
    // Fluke
    const flGeo=new THREE.ConeGeometry(0.08*aS,0.2*aS,6);
    const fl=new THREE.Mesh(flGeo,metalMat);
    fl.rotation.z=s*Math.PI/3;
    fl.position.set(HB*0.35+s*0.28*aS,-HD*0.3-0.65*aS,HL*0.35);
    shipGroup.add(fl);
  });

  // ─── FIGUREHEAD ───
  if(p.showFigure){
    const fhG=new THREE.Group();
    // Body
    const fbGeo=new THREE.CylinderGeometry(0.08*p.figSize,0.15*p.figSize,0.8*p.figSize,8);
    const fb=new THREE.Mesh(fbGeo,trimMat);
    fb.rotation.x=Math.PI/6;
    fhG.add(fb);
    // Head
    const fhdGeo=new THREE.SphereGeometry(0.1*p.figSize,8,8);
    const fhd=new THREE.Mesh(fhdGeo,trimMat);
    fhd.position.y=0.45*p.figSize;
    fhd.position.z=0.1*p.figSize;
    fhG.add(fhd);
    fhG.position.set(0,-HD*0.2,HL*0.52);
    fhG.rotation.x=-0.3;
    shipGroup.add(fhG);
  }

  // ─── FLAGS ───
  function addFlag(mastGroup,h,mat){
    const fGeo=new THREE.PlaneGeometry(p.flagW,p.flagH,6,3);
    const fPos=fGeo.attributes.position;
    for(let v=0;v<fPos.count;v++){
      const fx=fPos.getX(v);
      fPos.setZ(v,Math.sin((fx/p.flagW+0.5)*Math.PI*2)*0.15);
    }
    fGeo.computeVertexNormals();
    const flag=new THREE.Mesh(fGeo,mat);
    flag.position.set(p.flagW*0.5,h-p.flagH*0.5,0);
    mastGroup.add(flag);
  }
  if(p.showJolly) addFlag(mainM,p.mainMastH+0.2,flagMat);
  addFlag(foreM,p.foreMastH+0.2,new THREE.MeshStandardMaterial({color:p.trimColor,roughness:0.9,side:THREE.DoubleSide}));

  // ─── STERN WINDOWS ───
  for(let i=0;i<p.winCount;i++){
    const x=(i-(p.winCount-1)/2)*0.7;
    // Window frame
    const wfGeo=new THREE.TorusGeometry(p.winR,0.03,8,16);
    const wf=new THREE.Mesh(wfGeo,trimMat);
    wf.position.set(x,p.sternH*0.5,-HL*0.5-0.01);
    shipGroup.add(wf);
    // Glass
    const wgGeo=new THREE.CircleGeometry(p.winR*0.9,16);
    const wg=new THREE.Mesh(wgGeo,new THREE.MeshStandardMaterial({color:'#88aacc',roughness:0.1,metalness:0.3,transparent:true,opacity:0.6}));
    wg.position.set(x,p.sternH*0.5,-HL*0.5-0.005);
    shipGroup.add(wg);
  }

  // ─── ROPES (shrouds from mast to railings) ───
  if(p.showRopes){
    [
      {mz:p.mainMastPos,mh:p.mainMastH},
      {mz:p.foreMastPos,mh:p.foreMastH},
      {mz:p.mizzenMastPos,mh:p.mizzenMastH}
    ].forEach(m=>{
      [-1,1].forEach(side=>{
        const curve=new THREE.CatmullRomCurve3([
          new THREE.Vector3(side*HB*0.42,0.1,HL*m.mz),
          new THREE.Vector3(side*HB*0.25,m.mh*0.4,HL*m.mz),
          new THREE.Vector3(0,m.mh*0.75,HL*m.mz),
        ]);
        const rGeo=new THREE.TubeGeometry(curve,12,0.015,4,false);
        const rope=new THREE.Mesh(rGeo,new THREE.MeshStandardMaterial({color:'#8a7550',roughness:0.9}));
        shipGroup.add(rope);
      });
    });
  }

  // ─── LANTERNS ───
  if(p.showLanterns){
    [[-HL*0.48,p.sternH+0.5],[HL*0.48,p.fcH+0.5]].forEach(([z,y])=>{
      [-1,1].forEach(side=>{
        const lGeo=new THREE.CylinderGeometry(0.06,0.08,0.2,6);
        const lantern=new THREE.Mesh(lGeo,new THREE.MeshStandardMaterial({color:'#cc8800',emissive:'#aa6600',emissiveIntensity:0.5,roughness:0.4}));
        lantern.position.set(side*HB*0.38,y,z);
        shipGroup.add(lantern);
        // Hook
        const hGeo=new THREE.TorusGeometry(0.04,0.01,4,8,Math.PI);
        const hook=new THREE.Mesh(hGeo,metalMat);
        hook.position.set(side*HB*0.38,y+0.12,z);
        shipGroup.add(hook);
      });
    });
    // Stern lantern
    const slGeo=new THREE.CylinderGeometry(0.1,0.12,0.3,6);
    const sLantern=new THREE.Mesh(slGeo,new THREE.MeshStandardMaterial({color:'#cc8800',emissive:'#aa6600',emissiveIntensity:0.6,roughness:0.4}));
    sLantern.position.set(0,p.sternH+0.6,-HL*0.5);
    shipGroup.add(sLantern);
  }

  // Trim strip along hull
  [-1,1].forEach(side=>{
    const tsGeo=new THREE.BoxGeometry(0.04,0.08,HL*0.85);
    const ts=new THREE.Mesh(tsGeo,trimMat);
    ts.position.set(side*HB*0.44,-HD*0.05,0);
    shipGroup.add(ts);
  });

  // Update water color
  waterMesh.material.color.set(p.waterColor);

  // Update dims
  document.getElementById('dL').textContent=HL.toFixed(1);
  document.getElementById('dW').textContent=HB.toFixed(1);
  document.getElementById('dH').textContent=(HD+p.sternH).toFixed(1);
}

// STEP CONTROLS
// ═══════════════════════════════════════
function ctrlsFor(i){
  const s=STEPS[i].id;
  switch(s){
    case 'hull': return [
      {t:'range',k:'hullLen',l:'Length (m)',mn:5,mx:25,s:0.5},
      {t:'range',k:'hullBeam',l:'Beam Width (m)',mn:2,mx:8,s:0.2},
      {t:'range',k:'hullDepth',l:'Hull Depth (m)',mn:1,mx:6,s:0.2},
    ];
    case 'hullCurve': return [
      {t:'range',k:'bowSharp',l:'Bow Sharpness',mn:0.2,mx:1.5,s:0.05},
      {t:'range',k:'sternW',l:'Stern Width',mn:0.2,mx:1.0,s:0.05},
      {t:'range',k:'keelDepth',l:'Keel Depth',mn:0.2,mx:1.5,s:0.05},
    ];
    case 'deck': return [
      {t:'range',k:'deckThick',l:'Deck Thickness',mn:0.05,mx:0.4,s:0.02},
    ];
    case 'bowsprit': return [
      {t:'range',k:'bspritLen',l:'Bowsprit Length (m)',mn:1,mx:8,s:0.2},
      {t:'range',k:'bspritR',l:'Bowsprit Thickness',mn:0.03,mx:0.2,s:0.01},
      {t:'range',k:'bspritAngle',l:'Angle (°)',mn:5,mx:45,s:1},
    ];
    case 'stern': return [
      {t:'range',k:'sternH',l:'Stern Castle Height',mn:0.5,mx:4,s:0.1},
      {t:'range',k:'sternLen',l:'Stern Castle Length',mn:1,mx:6,s:0.2},
    ];
    case 'forecastle': return [
      {t:'range',k:'fcH',l:'Forecastle Height',mn:0.3,mx:3,s:0.1},
      {t:'range',k:'fcLen',l:'Forecastle Length',mn:0.5,mx:5,s:0.2},
    ];
    case 'mainMast': return [
      {t:'range',k:'mainMastH',l:'Height (m)',mn:4,mx:18,s:0.5},
      {t:'range',k:'mainMastR',l:'Thickness',mn:0.05,mx:0.25,s:0.01},
      {t:'range',k:'mainMastPos',l:'Position (bow↔stern)',mn:-0.2,mx:0.25,s:0.01},
    ];
    case 'foreMast': return [
      {t:'range',k:'foreMastH',l:'Height (m)',mn:3,mx:15,s:0.5},
      {t:'range',k:'foreMastR',l:'Thickness',mn:0.04,mx:0.2,s:0.01},
      {t:'range',k:'foreMastPos',l:'Position',mn:0.15,mx:0.45,s:0.01},
    ];
    case 'mizzenMast': return [
      {t:'range',k:'mizzenMastH',l:'Height (m)',mn:3,mx:14,s:0.5},
      {t:'range',k:'mizzenMastR',l:'Thickness',mn:0.04,mx:0.2,s:0.01},
      {t:'range',k:'mizzenMastPos',l:'Position',mn:-0.45,mx:-0.15,s:0.01},
    ];
    case 'sails': return [
      {t:'range',k:'sailW',l:'Sail Width',mn:0.4,mx:1.5,s:0.05},
      {t:'range',k:'sailBillow',l:'Billow Amount',mn:0,mx:1.2,s:0.05},
      {t:'range',k:'sailCount',l:'Sails per Mast',mn:1,mx:3,s:1},
    ];
    case 'crowsNest': return [
      {t:'range',k:'nestR',l:'Nest Radius',mn:0.2,mx:1.0,s:0.05},
      {t:'range',k:'nestH',l:'Nest Height',mn:0.15,mx:0.6,s:0.02},
      {t:'range',k:'nestPos',l:'Height on Mast',mn:0.5,mx:0.9,s:0.02},
    ];
    case 'railings': return [
      {t:'range',k:'railH',l:'Rail Height',mn:0.15,mx:0.8,s:0.02},
      {t:'range',k:'railPosts',l:'Number of Posts',mn:4,mx:24,s:1},
    ];
    case 'cannons': return [
      {t:'range',k:'cannonCount',l:'Cannons per Side',mn:1,mx:12,s:1},
      {t:'range',k:'cannonR',l:'Cannon Size',mn:0.03,mx:0.12,s:0.005},
    ];
    case 'rudder': return [
      {t:'range',k:'rudderW',l:'Rudder Width',mn:0.4,mx:2.0,s:0.1},
      {t:'range',k:'rudderH',l:'Rudder Height',mn:0.8,mx:4.0,s:0.1},
    ];
    case 'anchor': return [
      {t:'range',k:'anchorSize',l:'Anchor Scale',mn:0.3,mx:1.5,s:0.05},
    ];
    case 'figurehead': return [
      {t:'toggle',k:'showFigure',l:'Show Figurehead'},
      {t:'range',k:'figSize',l:'Figurehead Size',mn:0.2,mx:1.2,s:0.05},
    ];
    case 'flags': return [
      {t:'toggle',k:'showJolly',l:'Show Jolly Roger'},
      {t:'range',k:'flagW',l:'Flag Width',mn:0.5,mx:3,s:0.1},
      {t:'range',k:'flagH',l:'Flag Height',mn:0.3,mx:2,s:0.1},
    ];
    case 'windows': return [
      {t:'range',k:'winCount',l:'Window Count',mn:1,mx:7,s:1},
      {t:'range',k:'winR',l:'Window Size',mn:0.1,mx:0.5,s:0.02},
    ];
    case 'colors': return [
      {t:'color',k:'hullColor',l:'Hull'},
      {t:'color',k:'deckColor',l:'Deck'},
      {t:'color',k:'sailColor',l:'Sails'},
      {t:'color',k:'mastColor',l:'Masts'},
      {t:'color',k:'metalColor',l:'Metal'},
      {t:'color',k:'flagColor',l:'Flags'},
      {t:'color',k:'trimColor',l:'Trim / Gold'},
      {t:'color',k:'waterColor',l:'Water'},
    ];
    case 'details': return [
      {t:'toggle',k:'showRopes',l:'Show Rigging Ropes'},
      {t:'toggle',k:'showLanterns',l:'Show Lanterns'},
    ];
    default: return [];
  }
}

function renderCtrls(){
  const cp=document.getElementById('cpanel');
  const cs=ctrlsFor(curStep);
  let h=`<div class="ct">${STEPS[curStep].d}</div>`;
  cs.forEach(c=>{
    if(c.t==='range'){
      h+=`<div class="cg"><label>${c.l} <span class="rv" id="v_${c.k}">${P[c.k]}</span></label><input type="range" min="${c.mn}" max="${c.mx}" step="${c.s}" value="${P[c.k]}" oninput="upd('${c.k}',parseFloat(this.value))"></div>`;
    } else if(c.t==='color'){
      h+=`<div class="cg"><label>${c.l}</label><input type="color" value="${P[c.k]}" oninput="upd('${c.k}',this.value)"></div>`;
    } else if(c.t==='toggle'){
      h+=`<div class="cg"><label><input type="checkbox" ${P[c.k]?'checked':''} onchange="upd('${c.k}',this.checked)"> ${c.l}</label></div>`;
    }
  });
  cp.innerHTML=h;
}

function upd(k,v){
  P[k]=v;
  const ve=document.getElementById('v_'+k);
  if(ve) ve.textContent=typeof v==='number'?(Number.isInteger(v)?v:v.toFixed(3)):v;
  rebuildShip();
}

// ═══════════════════════════════════════
// STEP NAV
// ═══════════════════════════════════════
function renderSteps(){
  document.getElementById('stepList').innerHTML=STEPS.map((s,i)=>`<div class="si ${i===curStep?'active':''} ${i<curStep?'done':''}" onclick="go(${i})"><div class="sn">${i<curStep?'✓':(i+1)}</div><div class="sl">${s.name}</div></div>`).join('');
}
function go(i){curStep=i;updateUI();toast(STEPS[i].name);}
function next(){if(curStep<STEPS.length-1)go(curStep+1);}
function prev(){if(curStep>0)go(curStep-1);}
function updateUI(){
  renderSteps();renderCtrls();
  document.getElementById('progFill').style.width=((curStep+1)/STEPS.length*100)+'%';
  document.getElementById('progCount').textContent=`Step ${curStep+1} of ${STEPS.length}`;
  document.getElementById('bPrev').disabled=curStep===0;
  document.getElementById('bNext').disabled=curStep===STEPS.length-1;
  const ae=document.querySelector('.si.active');
  if(ae) ae.scrollIntoView({block:'nearest',behavior:'smooth'});
}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600);}

// ═══════════════════════════════════════
// SAVE / LOAD / EXPORT
// ═══════════════════════════════════════
function getSaves(){try{return JSON.parse(localStorage.getItem('shipSaves')||'{}');}catch{return {};}}
function setSaves(s){localStorage.setItem('shipSaves',JSON.stringify(s));}

function openSaveModal(){
  document.getElementById('modalC').innerHTML=`<h2>💾 Save Ship</h2><input type="text" id="saveName" placeholder="Name your vessel..."><div class="mb"><button class="mbc" onclick="closeModal()">Cancel</button><button class="mbs" onclick="doSave()">Save</button></div>`;
  document.getElementById('modalO').classList.add('open');
  setTimeout(()=>document.getElementById('saveName').focus(),100);
}
function openLoadModal(){
  const sv=getSaves(),ks=Object.keys(sv);
  let h='';
  if(!ks.length) h='<p style="color:var(--parchment-dim);font-size:12px;padding:8px 0">No saved ships yet.</p>';
  else h='<div class="saves-list">'+ks.map(k=>{const d=new Date(sv[k].date).toLocaleDateString();return `<div class="se" onclick="doLoad('${k.replace(/'/g,"\\'")}')"><div><div class="sname">${k}</div><div class="sdate">${d}</div></div><button class="dbtn" onclick="event.stopPropagation();doDel('${k.replace(/'/g,"\\'")}')">✕</button></div>`;}).join('')+'</div>';
  document.getElementById('modalC').innerHTML=`<h2>📂 Load Ship</h2>${h}<div class="mb"><button class="mbc" onclick="closeModal()">Close</button></div>`;
  document.getElementById('modalO').classList.add('open');
}
function closeModal(){document.getElementById('modalO').classList.remove('open');}
function doSave(){
  const n=document.getElementById('saveName').value.trim();
  if(!n)return;
  const sv=getSaves();sv[n]={params:{...P},step:curStep,date:Date.now()};setSaves(sv);
  closeModal();toast('Ship saved!');
}
function doLoad(n){
  const sv=getSaves();if(!sv[n])return;
  P={...sv[n].params};curStep=sv[n].step||0;
  closeModal();rebuildShip();updateUI();toast(`Loaded: ${n}`);
}
function doDel(n){const sv=getSaves();delete sv[n];setSaves(sv);openLoadModal();}

function resetAll(){
  if(!confirm('Reset all parameters to defaults?'))return;
  Object.assign(P,{hullLen:12,hullBeam:4,hullDepth:3,bowSharp:0.7,sternW:0.6,keelDepth:0.8,deckThick:0.15,bspritLen:4,bspritR:0.08,bspritAngle:25,sternH:1.8,sternLen:3,fcH:1.2,fcLen:2,mainMastH:10,mainMastR:0.12,mainMastPos:0.05,foreMastH:8,foreMastR:0.1,foreMastPos:0.32,mizzenMastH:7,mizzenMastR:0.09,mizzenMastPos:-0.35,sailW:1.0,sailBillow:0.4,sailCount:2,nestR:0.5,nestH:0.3,nestPos:0.7,railH:0.4,railPosts:12,cannonCount:5,cannonR:0.06,rudderW:1.0,rudderH:2.0,anchorSize:0.8,figSize:0.6,showFigure:true,flagW:1.5,flagH:1.0,showJolly:true,winCount:3,winR:0.25,hullColor:'#3a2010',deckColor:'#8b6b3a',sailColor:'#e8dcc8',mastColor:'#6b4a2a',metalColor:'#555555',flagColor:'#1a1a1a',trimColor:'#c9a84c',waterColor:'#0a3060',showRopes:true,showLanterns:true});
  curStep=0;rebuildShip();updateUI();toast('Reset to defaults');
}

function exportOBJ(){
  let obj='# Pirate Ship - Exported from Pirate Ship Shipyard\n';
  let vOff=0;
  shipGroup.traverse(child=>{
    if(child.isMesh&&child.geometry){
      const geo=child.geometry.clone();
      child.updateWorldMatrix(true,false);
      geo.applyMatrix4(child.matrixWorld);
      const pos=geo.attributes.position;
      const idx=geo.index;
      for(let i=0;i<pos.count;i++){
        obj+=`v ${pos.getX(i).toFixed(6)} ${pos.getY(i).toFixed(6)} ${pos.getZ(i).toFixed(6)}\n`;
      }
      if(idx){
        for(let i=0;i<idx.count;i+=3){
          obj+=`f ${idx.getX(i)+1+vOff} ${idx.getX(i+1)+1+vOff} ${idx.getX(i+2)+1+vOff}\n`;
        }
      }else{
        for(let i=0;i<pos.count;i+=3){
          obj+=`f ${i+1+vOff} ${i+2+vOff} ${i+3+vOff}\n`;
        }
      }
      vOff+=pos.count;
      geo.dispose();
    }
  });
  const blob=new Blob([obj],{type:'text/plain'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='pirate_ship.obj';
  a.click();
  URL.revokeObjectURL(a.href);
  toast('OBJ exported!');
}

// ═══════════════════════════════════════
// INIT
// ═══════════════════════════════════════
document.addEventListener('DOMContentLoaded',()=>{initThree();rebuildShip();updateUI();});
document.getElementById('modalO').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
document.addEventListener('keydown',e=>{if(e.target.tagName==='INPUT')return;if(e.key==='ArrowRight'||e.key==='ArrowDown')next();if(e.key==='ArrowLeft'||e.key==='ArrowUp')prev();});
</script>
