<script>
'use strict';

/* ===================================================
   Python-to-JS transpiler (light transform so Python
   syntax runs in the canvas iframe)
   =================================================== */
function pyToJs(code) {
  return code
    .replace(/\bTrue\b/g, 'true')
    .replace(/\bFalse\b/g, 'false')
    .replace(/\bNone\b/g, 'null')
    .replace(/\bprint\s*\(/g, 'console.log(')
    .replace(/\belif\b/g, 'else if')
    .replace(/\band\b/g, '&&')
    .replace(/\bor\b/g, '||')
    .replace(/\bnot\b/g, '!')
    .replace(/\blen\s*\(/g, '(')
    .replace(/\.append\s*\(/g, '.push(')
    .replace(/\brandom\.randint\s*\(\s*(\d+)\s*,\s*(\d+)\s*\)/g, '(Math.floor(Math.random()*($2-$1+1))+$1)')
    .replace(/#.*$/gm, '');
}

/* ===================================================
   IFRAME BUILDING BLOCKS (Python Breakout Part 2)
   =================================================== */

var CSS_GAME = '<style>body{display:flex;flex-direction:column;align-items:center;background:#0f0f1a;margin:0;overflow:hidden}canvas{display:block;cursor:pointer}</style>';

var CANVAS_TAG = '<canvas id="game" width="600" height="400"></canvas>';

var SETUP = 'const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");';

var PAD_VARS = 'let padX=225,padY=370,padW=150,padH=14,padBase=150,speed=7;';

var BALL_VARS = 'let balls=[{x:292,y:300,vx:3,vy:-3}];let bs=12;';

var BRICK_COLORS = 'var brickColors=["#f87171","#fb923c","#facc15","#4ade80","#60a5fa"];';

var BRICK_INIT = 'var bricks=[];function buildLevel(pattern){bricks=[];for(var r=0;r<pattern.length;r++)for(var c=0;c<pattern[r];c++){bricks.push({x:c*75+12,y:r*28+40,w:70,h:24,hp:1,color:brickColors[r%5],alive:true})}}buildLevel([8,8,8,8,8]);';

var SCORE_VARS = 'let score=0,lives=3,level=1;';

var POWERUP_VARS = 'let powerups=[];let wideTimer=0,slowTimer=0;';

var KEYS = 'let leftHeld=false,rightHeld=false;' +
  'document.addEventListener("keydown",function(e){' +
    'if(e.code==="ArrowLeft"||e.code==="KeyA")leftHeld=true;' +
    'if(e.code==="ArrowRight"||e.code==="KeyD")rightHeld=true;' +
    'e.preventDefault()});' +
  'document.addEventListener("keyup",function(e){' +
    'if(e.code==="ArrowLeft"||e.code==="KeyA")leftHeld=false;' +
    'if(e.code==="ArrowRight"||e.code==="KeyD")rightHeld=false});';

var PAD_MOVE = 'if(leftHeld)padX-=speed;if(rightHeld)padX+=speed;padX=Math.max(0,Math.min(600-padW,padX));';

var DRAW_BG = 'ctx.fillStyle="#0f0f1a";ctx.fillRect(0,0,600,400);';

var DRAW_PAD = 'ctx.fillStyle="#ff7700";ctx.fillRect(padX,padY,padW,padH);';

var DRAW_BALLS = 'for(var i=0;i<balls.length;i++){var bl=balls[i];ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(bl.x+bs/2,bl.y+bs/2,bs/2,0,Math.PI*2);ctx.fill()}';

var DRAW_BRICKS = 'for(var i=0;i<bricks.length;i++){var b=bricks[i];if(b.alive){ctx.fillStyle=b.hp>1?"#555":b.color;ctx.fillRect(b.x,b.y,b.w,b.h)}}';

var DRAW_SCORE = 'ctx.fillStyle="#fff";ctx.font="bold 18px monospace";ctx.textAlign="left";ctx.fillText("Score: "+score,12,24);';

var DRAW_LIVES = 'ctx.textAlign="right";ctx.fillStyle="#fff";ctx.fillText("Lives: "+lives,588,24);';

var DRAW_LEVEL = 'ctx.textAlign="center";ctx.fillStyle="#888";ctx.font="14px monospace";ctx.fillText("Level "+level,300,24);';

var BALL_MOVE = 'for(var i=0;i<balls.length;i++){var bl=balls[i];bl.x+=bl.vx;bl.y+=bl.vy;if(bl.x<=0||bl.x+bs>=600)bl.vx=-bl.vx;if(bl.y<=0)bl.vy=-bl.vy}';

var PAD_HIT = 'for(var i=0;i<balls.length;i++){var bl=balls[i];if(bl.x+bs>padX&&bl.x<padX+padW&&bl.y+bs>padY&&bl.y+bs<padY+padH&&bl.vy>0){bl.vy=-bl.vy;var hit=(bl.x+bs/2)-(padX+padW/2);bl.vx=hit/20}}';

var BRICK_HIT = 'for(var i=0;i<balls.length;i++){var bl=balls[i];for(var j=0;j<bricks.length;j++){var b=bricks[j];if(b.alive&&bl.x+bs>b.x&&bl.x<b.x+b.w&&bl.y+bs>b.y&&bl.y<b.y+b.h){b.hp--;if(b.hp<=0){b.alive=false;score+=10}bl.vy=-bl.vy;break}}}';

var BALL_LOST = 'for(var i=balls.length-1;i>=0;i--){if(balls[i].y>410)balls.splice(i,1)}if(balls.length===0){lives--;if(lives<=0){gameState="over"}else{balls=[{x:292,y:300,vx:3,vy:-3}]}}';

var STATE_VARS = 'let gameState="play";';

var DRAW_POWERUPS = 'for(var i=0;i<powerups.length;i++){var p=powerups[i];ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,8,0,Math.PI*2);ctx.fill()}';

var POWERUP_FALL = 'for(var i=powerups.length-1;i>=0;i--){powerups[i].y+=2;if(powerups[i].y>410)powerups.splice(i,1)}';

var TIMER_TICK = 'if(wideTimer>0){wideTimer--;if(wideTimer===0){padW=padBase}}if(slowTimer>0){slowTimer--}';

var SHAKE_VARS = 'let shakeFrames=0;';

var PARTICLES = 'let particles=[];';

var PARTICLE_UPDATE = 'for(var i=particles.length-1;i>=0;i--){var pt=particles[i];pt.x+=pt.vx;pt.y+=pt.vy;pt.life--;if(pt.life<=0)particles.splice(i,1)}';

var DRAW_PARTICLES = 'for(var i=0;i<particles.length;i++){var pt=particles[i];ctx.fillStyle=pt.color;ctx.globalAlpha=pt.life/pt.maxLife;ctx.fillRect(pt.x,pt.y,3,3);ctx.globalAlpha=1}';

function wrap(code) {
  return '<!DOCTYPE html><html><head><meta charset="UTF-8">' + CSS_GAME +
    '<\/head><body>' + CANVAS_TAG + '<script>' + code + '<\/script><\/body><\/html>';
}
