<script>
'use strict';

function p8ToJs(code) {
  return code
    .replace(/--.*$/gm, '')
    .replace(/\blocal\s+/g, 'let ')
    .replace(/\bthen\b/g, '{')
    .replace(/\belseif\b/g, '} else if')
    .replace(/\belse\b(?!\s*if)/g, '} else {')
    .replace(/\bend\b/g, '}')
    .replace(/~=/g, '!==')
    .replace(/\.\./g, '+')
    .replace(/#(\w+)/g, '$1.length')
    .replace(/\badd\((\w+),\s*([^)]+)\)/g, '$1.push($2)')
    .replace(/\bdel\((\w+),\s*([^)]+)\)/g, '$1.splice($1.indexOf($2),1)')
    .replace(/\brnd\(([^)]*)\)/g, 'Math.random()*($1)')
    .replace(/\bflr\(/g, 'Math.floor(')
    .replace(/\bbtn\(0\)/g, 'leftHeld')
    .replace(/\bbtn\(1\)/g, 'rightHeld')
    .replace(/\bbtn\(2\)/g, 'upHeld')
    .replace(/\bbtn\(3\)/g, 'downHeld')
    .replace(/\bbtn\(4\)/g, 'zHeld')
    .replace(/\bbtn\(5\)/g, 'xHeld')
    .replace(/\bbtnp\(0\)/g, 'leftPressed')
    .replace(/\bbtnp\(1\)/g, 'rightPressed')
    .replace(/\bbtnp\(2\)/g, 'upPressed')
    .replace(/\bbtnp\(3\)/g, 'downPressed')
    .replace(/\bbtnp\(4\)/g, 'zPressed')
    .replace(/\bbtnp\(5\)/g, 'xPressed')
    .replace(/\bprint\(([^,]+),\s*([^,]+),\s*([^,]+),\s*([^)]+)\)/g,
      'ctx.fillStyle=P8PAL[$4]||"#fff";ctx.fillText($1,$2*3,$3*3)')
    .replace(/\bnil\b/g, 'null')
    .replace(/\bfunction\s+(\w+)\(([^)]*)\)/g, 'function $1($2){')
    .replace(/\bnot\s+/g, '!')
    .replace(/\band\b/g, '&&')
    .replace(/\bor\b/g, '||');
}

/* ===================================================
   IFRAME BUILDING BLOCKS (PICO-8 Shooter)
   =================================================== */
var S = 3;

var P8PAL = '{0:"#000",1:"#1d2b53",2:"#7e2553",3:"#008751",4:"#ab5236",5:"#5f574f",6:"#c2c3c7",7:"#fff",8:"#ff004d",9:"#ffa300",10:"#ffec27",11:"#00e436",12:"#29adff",13:"#83769c",14:"#ff77a8",15:"#ffccaa"}';

var CSS_GAME = '<style>body{display:flex;flex-direction:column;align-items:center;background:#000;margin:0;overflow:hidden}canvas{display:block;image-rendering:pixelated;cursor:pointer}</style>';

var CANVAS_TAG = '<canvas id="game" width="384" height="384"></canvas>';

var SETUP = 'const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");ctx.font="bold 12px monospace";const S=3,P8PAL=' + P8PAL + ';';

var SHIP_VARS = 'let sx=60,sy=110,sw=8,sh=8,sspd=2;';

var BULLET_VARS = 'var bullets=[];let fireTimer=0,fireRate=8;';

var ENEMY_VARS = 'var enemies=[];let spawnTimer=0,spawnRate=40,wave=0;';

var SCORE_VARS = 'let score=0,lives=3;';

var STATE_VARS = 'let gameState="play";';

var STARS = 'var stars=[];for(var si=0;si<30;si++){stars.push({x:Math.random()*128,y:Math.random()*128,s:Math.random()*0.5+0.3})}';

var KEYS = 'let leftHeld=false,rightHeld=false,upHeld=false,downHeld=false,zHeld=false,xHeld=false;' +
  'document.addEventListener("keydown",function(e){' +
    'if(e.code==="ArrowLeft"||e.code==="KeyA")leftHeld=true;' +
    'if(e.code==="ArrowRight"||e.code==="KeyD")rightHeld=true;' +
    'if(e.code==="ArrowUp"||e.code==="KeyW")upHeld=true;' +
    'if(e.code==="ArrowDown"||e.code==="KeyS")downHeld=true;' +
    'if(e.code==="KeyZ")zHeld=true;if(e.code==="KeyX")xHeld=true;' +
    'e.preventDefault()});' +
  'document.addEventListener("keyup",function(e){' +
    'if(e.code==="ArrowLeft"||e.code==="KeyA")leftHeld=false;' +
    'if(e.code==="ArrowRight"||e.code==="KeyD")rightHeld=false;' +
    'if(e.code==="ArrowUp"||e.code==="KeyW")upHeld=false;' +
    'if(e.code==="ArrowDown"||e.code==="KeyS")downHeld=false;' +
    'if(e.code==="KeyZ")zHeld=false;if(e.code==="KeyX")xHeld=false});';

var MOVE_SHIP = 'if(leftHeld)sx-=sspd;if(rightHeld)sx+=sspd;if(upHeld)sy-=sspd;if(downHeld)sy+=sspd;' +
  'sx=Math.max(0,Math.min(128-sw,sx));sy=Math.max(0,Math.min(128-sh,sy));';

var FIRE_BULLET = 'if(fireTimer>0)fireTimer--;if(zHeld&&fireTimer===0){bullets.push({x:sx+sw/2-1,y:sy-4,w:2,h:4});fireTimer=fireRate}';

var MOVE_BULLETS = 'for(var bi=bullets.length-1;bi>=0;bi--){bullets[bi].y-=3;if(bullets[bi].y<-4)bullets.splice(bi,1)}';

var SPAWN_ENEMIES = 'spawnTimer++;if(spawnTimer>=spawnRate){spawnTimer=0;enemies.push({x:Math.floor(Math.random()*112)+8,y:-10,w:8,h:8,hp:1,dy:0.8+wave*0.1})}';

var MOVE_ENEMIES = 'for(var ei=enemies.length-1;ei>=0;ei--){enemies[ei].y+=enemies[ei].dy;if(enemies[ei].y>136)enemies.splice(ei,1)}';

var HIT_CHECK = 'for(var bi=bullets.length-1;bi>=0;bi--){for(var ei=enemies.length-1;ei>=0;ei--){var b=bullets[bi],en=enemies[ei];' +
  'if(b&&en&&b.x+b.w>en.x&&b.x<en.x+en.w&&b.y+b.h>en.y&&b.y<en.y+en.h){en.hp--;if(en.hp<=0){score++;enemies.splice(ei,1)}bullets.splice(bi,1);break}}}';

var ENEMY_HIT_SHIP = 'for(var ei=enemies.length-1;ei>=0;ei--){var en=enemies[ei];if(sx+sw>en.x&&sx<en.x+en.w&&sy+sh>en.y&&sy<en.y+en.h){lives--;enemies.splice(ei,1);if(lives<=0)gameState="over";break}}';

var DRAW_BG = 'ctx.fillStyle=P8PAL[0];ctx.fillRect(0,0,384,384);';

var DRAW_STARS = 'ctx.fillStyle=P8PAL[6];for(var si=0;si<stars.length;si++){stars[si].y+=stars[si].s;if(stars[si].y>128)stars[si].y=0;ctx.fillRect(Math.floor(stars[si].x)*S,Math.floor(stars[si].y)*S,S,S)}';

var DRAW_SHIP = 'ctx.fillStyle=P8PAL[12];ctx.fillRect(sx*S,sy*S,sw*S,sh*S);' +
  'ctx.fillStyle=P8PAL[7];ctx.fillRect((sx+3)*S,(sy-2)*S,2*S,3*S);';

var DRAW_BULLETS = 'ctx.fillStyle=P8PAL[10];for(var bi=0;bi<bullets.length;bi++){ctx.fillRect(bullets[bi].x*S,bullets[bi].y*S,bullets[bi].w*S,bullets[bi].h*S)}';

var DRAW_ENEMIES = 'ctx.fillStyle=P8PAL[8];for(var ei=0;ei<enemies.length;ei++){ctx.fillRect(enemies[ei].x*S,enemies[ei].y*S,enemies[ei].w*S,enemies[ei].h*S)}';

var DRAW_HUD = 'ctx.fillStyle=P8PAL[7];ctx.font="bold 12px monospace";ctx.textAlign="left";ctx.fillText("score "+score,6,14);' +
  'ctx.textAlign="right";ctx.fillText("lives "+lives,378,14);';

var WAVE_CHECK = 'if(score>0&&score%10===0&&wave<Math.floor(score/10)){wave=Math.floor(score/10);if(spawnRate>15)spawnRate-=5}';

function wrap(code) {
  return '<!DOCTYPE html><html><head><meta charset="UTF-8">' + CSS_GAME +
    '<\/head><body>' + CANVAS_TAG + '<script>' + code + '<\/script><\/body><\/html>';
}

window.CW_CONFIG = {
  storageKey: 'jvds-pico8-shooter-canvas',
  downloadName: 'my-pico8-shooter.html',

  hints: [
    'A blue ship at the bottom of a scrolling starfield',
    'The ship moves in all four directions with arrow keys',
    'Pressing Z fires yellow bullets upward',
    'Red enemies drift down from the top of the screen',
    'Bullets destroy enemies and add to the score',
    'Enemies speed up over time - game over when lives reach zero'
  ],

  templates: {
    1: function(u) {
      return wrap(
        SETUP + SHIP_VARS + STARS + KEYS +
        'try{' + p8ToJs(u) + '}catch(e){}' +
        'function loop(){' +
        MOVE_SHIP +
        DRAW_BG + DRAW_STARS + DRAW_SHIP +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    2: function(u) {
      return wrap(
        SETUP + SHIP_VARS + BULLET_VARS + STARS + KEYS +
        'function loop(){' +
        MOVE_SHIP +
        'try{' + p8ToJs(u) + '}catch(e){}' +
        MOVE_BULLETS +
        DRAW_BG + DRAW_STARS + DRAW_BULLETS + DRAW_SHIP +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    3: function(u) {
      return wrap(
        SETUP + SHIP_VARS + BULLET_VARS + ENEMY_VARS + STARS + KEYS +
        'function loop(){' +
        MOVE_SHIP + FIRE_BULLET + MOVE_BULLETS +
        'try{' + p8ToJs(u) + '}catch(e){}' +
        MOVE_ENEMIES +
        DRAW_BG + DRAW_STARS + DRAW_BULLETS + DRAW_ENEMIES + DRAW_SHIP +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    4: function(u) {
      return wrap(
        SETUP + SHIP_VARS + BULLET_VARS + ENEMY_VARS + SCORE_VARS + STARS + KEYS +
        'function loop(){' +
        MOVE_SHIP + FIRE_BULLET + MOVE_BULLETS + SPAWN_ENEMIES + MOVE_ENEMIES +
        'try{' + p8ToJs(u) + '}catch(e){}' +
        DRAW_BG + DRAW_STARS + DRAW_BULLETS + DRAW_ENEMIES + DRAW_SHIP + DRAW_HUD +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    5: function(u) {
      return wrap(
        SETUP + SHIP_VARS + BULLET_VARS + ENEMY_VARS + SCORE_VARS + STARS + KEYS +
        'function loop(){' +
        MOVE_SHIP + FIRE_BULLET + MOVE_BULLETS + SPAWN_ENEMIES + MOVE_ENEMIES + HIT_CHECK +
        'try{' + p8ToJs(u) + '}catch(e){}' +
        DRAW_BG + DRAW_STARS + DRAW_BULLETS + DRAW_ENEMIES + DRAW_SHIP + DRAW_HUD +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    6: function(u) {
      return wrap(
        SETUP + SHIP_VARS + BULLET_VARS + ENEMY_VARS + SCORE_VARS + STATE_VARS + STARS + KEYS +
        'document.addEventListener("keydown",function(e){if(e.code==="KeyR"&&gameState==="over"){score=0;lives=3;wave=0;spawnRate=40;enemies=[];bullets=[];sx=60;sy=110;gameState="play"}});' +
        'function loop(){' +
        'if(gameState==="play"){' +
        MOVE_SHIP + FIRE_BULLET + MOVE_BULLETS + SPAWN_ENEMIES + MOVE_ENEMIES + HIT_CHECK + ENEMY_HIT_SHIP +
        WAVE_CHECK +
        'try{' + p8ToJs(u) + '}catch(e){}' +
        '}' +
        DRAW_BG + DRAW_STARS + DRAW_BULLETS + DRAW_ENEMIES + DRAW_SHIP + DRAW_HUD +
        'if(gameState==="over"){ctx.fillStyle=P8PAL[8];ctx.font="bold 18px monospace";ctx.textAlign="center";ctx.fillText("game over",64*S,55*S);ctx.fillStyle=P8PAL[7];ctx.font="12px monospace";ctx.fillText("score: "+score,64*S,65*S);ctx.fillText("press r to restart",64*S,75*S)}' +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    }
  },

  steps: [
    {
      num: 1,
      title: 'Ship & Starfield',
      goal: 'Draw a ship at the bottom of a scrolling starfield.',
      points: [
        'The ship is an 8x8 blue square with a small white nose piece on top',
        'It starts near the bottom centre: (60, 110)',
        'Stars are tiny dots that scroll downward at varying speeds - creates parallax depth',
        'Move the ship in all 4 directions with btn(0-3), clamped to the screen'
      ],
      challenge: '🎮 Set up the ship:',
      starter: '-- ship starting position\nsx = ___\nsy = ___\nsw = 8\nsh = 8\nsspd = 2',
      solution: '-- ship starting position\nsx = 60\nsy = 110\nsw = 8\nsh = 8\nsspd = 2',
      checks: ['60', '110', '8', '2'],
      height: 140,
      fills: {
        text: 'The ship moves at ___ pixels per frame. The starfield creates a sense of ___.',
        answers: ['2', 'depth']
      },
      quiz: {
        question: 'Why do stars move at different speeds?',
        options: [
          'Random speed saves code',
          'Faster stars seem closer and slower stars seem farther away - this parallax effect creates depth on a flat screen',
          'They all move the same speed'
        ],
        correct: 1
      }
    },
    {
      num: 2,
      title: 'Firing Bullets',
      goal: 'Press Z to fire yellow bullets upward from the ship.',
      points: [
        'Bullets are {x, y, w, h} objects stored in an array',
        'Spawn at the ship nose: <code>x = sx + sw/2 - 1, y = sy - 4</code>',
        'Each frame: <code>bullet.y -= 3</code> (upward)',
        'Fire rate timer prevents holding Z from spraying 60 bullets per second'
      ],
      challenge: '🎮 Write the bullet firing:',
      starter: '-- fire a bullet\nif btn(4) and fireTimer == 0 then\n  add(bullets, {x=sx+sw/2-1, y=sy-___, w=2, h=4})\n  fireTimer = ___\nend\nif fireTimer > 0 then\n  fireTimer -= 1\nend',
      solution: '-- fire a bullet\nif btn(4) and fireTimer == 0 then\n  add(bullets, {x=sx+sw/2-1, y=sy-4, w=2, h=4})\n  fireTimer = 8\nend\nif fireTimer > 0 then\n  fireTimer -= 1\nend',
      checks: ['4', '8', 'firetimer', 'bullets'],
      height: 180,
      fills: {
        text: 'The fire rate allows one bullet every ___ frames. Bullets move ___ pixels upward per frame.',
        answers: ['8', '3']
      },
      quiz: {
        question: 'Why use a fire rate timer instead of one bullet per Z press?',
        options: [
          'More bullets look cool',
          'A timer lets the player hold Z for steady fire while controlling the rate - tap or hold both work naturally',
          'PICO-8 buttons cannot be held'
        ],
        correct: 1
      }
    },
    {
      num: 3,
      title: 'Enemy Waves',
      goal: 'Spawn red enemies that drift down from the top.',
      points: [
        'Enemies spawn on a timer: every <code>spawnRate</code> frames, add one at a random x',
        'Each enemy has {x, y, w, h, hp, dy} - dy is their fall speed',
        'Remove enemies that fall past the bottom to save memory',
        'Start with dy = 0.8 - slow enough to dodge and shoot'
      ],
      challenge: '🎮 Write the enemy spawning:',
      starter: '-- spawn enemies on timer\nspawnTimer += 1\nif spawnTimer >= spawnRate then\n  spawnTimer = 0\n  add(enemies, {\n    x = flr(rnd(112)) + 8,\n    y = -10,\n    w = 8, h = 8,\n    hp = 1,\n    dy = ___\n  })\nend',
      solution: '-- spawn enemies on timer\nspawnTimer += 1\nif spawnTimer >= spawnRate then\n  spawnTimer = 0\n  add(enemies, {\n    x = flr(rnd(112)) + 8,\n    y = -10,\n    w = 8, h = 8,\n    hp = 1,\n    dy = 0.8\n  })\nend',
      checks: ['0.8', 'spawnrate', 'spawntimer', 'enemies'],
      height: 220,
      fills: {
        text: 'A new enemy spawns every ___ frames. Enemies start above the screen at y = ___.',
        answers: ['40', '-10']
      },
      quiz: {
        question: 'Why spawn enemies off-screen at y = -10?',
        options: [
          'Negative numbers are required',
          'Starting above the visible area means enemies slide smoothly into view instead of popping in at the edge',
          'It gives the player more time to react'
        ],
        correct: 1
      }
    },
    {
      num: 4,
      title: 'Hit Detection',
      goal: 'Bullets destroy enemies and add to the score.',
      points: [
        'Check every bullet against every enemy: nested loop (AABB overlap)',
        'On hit: remove the bullet, reduce enemy hp. If hp reaches 0, remove enemy and score++',
        'Loop backward when removing from arrays to avoid skipping items',
        'Break after a bullet hits to prevent one bullet killing multiple enemies'
      ],
      challenge: '🎮 Write the hit check:',
      starter: '-- bullet hits enemy\nfor b = #bullets, 1, -1 do\n  for e = #enemies, 1, -1 do\n    -- if bullet overlaps enemy\n    if overlap then\n      enemies[e].hp -= ___\n      if enemies[e].hp <= 0 then\n        score += ___\n        del(enemies, enemies[e])\n      end\n      del(bullets, bullets[b])\n    end\n  end\nend',
      solution: '-- bullet hits enemy\nfor b = #bullets, 1, -1 do\n  for e = #enemies, 1, -1 do\n    -- if bullet overlaps enemy\n    if overlap then\n      enemies[e].hp -= 1\n      if enemies[e].hp <= 0 then\n        score += 1\n        del(enemies, enemies[e])\n      end\n      del(bullets, bullets[b])\n    end\n  end\nend',
      checks: ['score', 'hp', 'del'],
      height: 240,
      fills: {
        text: 'We loop ___ through arrays when removing items. Each enemy has ___ hit point.',
        answers: ['backward', '1']
      },
      quiz: {
        question: 'Why loop backward when removing items from an array?',
        options: [
          'Removing at index i shifts everything after it down - looping forward would skip the next item, but backward is safe because earlier indices are unchanged',
          'Backward loops are faster',
          'PICO-8 requires backward loops'
        ],
        correct: 0
      }
    },
    {
      num: 5,
      title: 'Lives & Collision',
      goal: 'Lose a life when an enemy touches the ship.',
      points: [
        'Check each enemy against the ship using AABB overlap',
        'On contact: <code>lives -= 1</code> and remove that enemy',
        'When lives reach 0: <code>gameState = "over"</code>',
        'Display lives in the top-right HUD next to the score'
      ],
      challenge: '🎮 Write the ship collision:',
      starter: '-- enemy hits ship\nfor e = #enemies, 1, -1 do\n  -- if enemy overlaps ship\n  if overlap then\n    lives -= ___\n    del(enemies, enemies[e])\n    if lives <= ___ then\n      gameState = "over"\n    end\n  end\nend',
      solution: '-- enemy hits ship\nfor e = #enemies, 1, -1 do\n  -- if enemy overlaps ship\n  if overlap then\n    lives -= 1\n    del(enemies, enemies[e])\n    if lives <= 0 then\n      gameState = "over"\n    end\n  end\nend',
      checks: ['lives', '0', 'over', 'del'],
      height: 200,
      fills: {
        text: 'The player starts with ___ lives. Each enemy contact costs ___ life.',
        answers: ['3', '1']
      },
      quiz: {
        question: 'Why remove the enemy on contact instead of leaving it?',
        options: [
          'Enemies are single-use',
          'Without removal the enemy stays overlapping the ship and subtracts a life every frame - the player would die instantly',
          'It saves memory'
        ],
        correct: 1
      }
    },
    {
      num: 6,
      title: 'Wave Difficulty & Restart',
      goal: 'Enemies spawn faster over time. Press R to restart after game over.',
      points: [
        'Every 10 kills: wave++, reduce spawnRate by 5 (minimum 15 frames)',
        'Each wave also increases enemy speed: <code>dy = 0.8 + wave * 0.1</code>',
        'R resets everything: score, lives, wave, arrays, ship position',
        'This escalating difficulty is the core of every arcade shooter from Galaga to Ikaruga'
      ],
      challenge: '🎮 Write the wave escalation:',
      starter: '-- increase difficulty\nif score > 0 and score % 10 == 0 then\n  wave = flr(score / ___)\n  if spawnRate > ___ then\n    spawnRate -= 5\n  end\nend',
      solution: '-- increase difficulty\nif score > 0 and score % 10 == 0 then\n  wave = flr(score / 10)\n  if spawnRate > 15 then\n    spawnRate -= 5\n  end\nend',
      checks: ['10', '15', 'spawnrate', 'wave'],
      height: 140,
      fills: {
        text: 'A new wave triggers every ___ kills. The minimum spawn rate is ___ frames.',
        answers: ['10', '15']
      },
      quiz: {
        question: 'Why cap the spawn rate at 15 instead of letting it reach 0?',
        options: [
          'Zero would crash the game',
          'At 15 frames between spawns the screen is already crowded - going lower would make the game impossible and the arrays too large',
          'PICO-8 timers cannot go below 15'
        ],
        correct: 1
      }
    }
  ]
};
</script>
