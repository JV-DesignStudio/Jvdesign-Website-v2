<body>

<div class="cw-header">
  <h1>GML Breakout Build Canvas <span class="cw-lang-tag">🎯 GML</span></h1>
  <p>Write GML game code step by step. The canvas shows what your code does.</p>
</div>

<div class="cw-layout">
  <div class="cw-steps" id="stepsPanel"></div>
  <div class="cw-canvas-panel" id="canvasPanel">
    <div class="cw-progress">
      <span id="cwProgressText">Step 1 / 6</span>
      <div class="cw-progress-bar"><div class="cw-progress-fill" id="cwProgressFill" style="width:0%"></div></div>
    </div>
    <div class="cw-canvas-frame">
      <iframe id="gameFrame" sandbox="allow-scripts" title="Your GML Breakout game"></iframe>
    </div>
    <div class="cw-canvas-hint" id="canvasHint">A mouse-controlled paddle at the bottom with a ball ready to serve</div>
    <button class="cw-btn-dl" data-on="CW.downloadGame" data-on-plain>Download My Game</button>
  </div>
</div>

<script src="/assets/js/inline/workshops-gml-breakout-canvas-1.js"></script>
