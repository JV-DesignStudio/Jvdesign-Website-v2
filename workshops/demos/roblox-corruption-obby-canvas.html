<!DOCTYPE html><html><head>
<title>Finished build: roblox-corruption-obby-canvas</title>
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="UTF-8"><style>body{display:flex;flex-direction:column;align-items:center;background:#0a0616;padding:8px;margin:0;font-family:system-ui,sans-serif;color:#e8eaf2;gap:6px;overflow:hidden}canvas{background:#060310;border:2px solid #2a1545;border-radius:8px;touch-action:none;max-width:100%}.row{display:flex;gap:12px;align-items:center;font-size:.8rem;flex-wrap:wrap;justify-content:center}</style></head><body><div class="row"><span>Lives: <b id="lives">3</b></span><span>Shards: <b id="shards">0</b></span><span>Time: <b id="timer">0s</b></span></div><canvas id="game" width="600" height="400"></canvas><div class="row" style="font-size:.7rem;opacity:.5">Auto-runner demo: the runner moves on its own, arrow keys work too</div><script>var canvas=document.getElementById("game"),ctx=canvas.getContext("2d");var W=600,H=400,GRAVITY=0.5,JUMP=-10,SPEED=2.2;var player={x:40,y:100,w:16,h:24,vx:0,vy:0,onGround:false,alive:true};var lives=3,shards=0,crumbled=0,startTime=Date.now(),won=false;var shardsArr=[],corruptionX=-80,flickerPhase=0,blades=[],autoJumpCd=0;var leftHeld=false,rightHeld=false,jumpHeld=false;function respawn(){player.x=40;player.y=100;player.vx=0;player.vy=0;player.alive=true;player.onGround=false;}var platforms=[{x:20,y:300,w:90,h:12,color:"#00e5ff",type:"start"},{x:150,y:280,w:44,h:10,color:"#00e5ff",type:"normal"},{x:230,y:260,w:44,h:10,color:"#ff2fd6",type:"normal"},{x:310,y:240,w:44,h:10,color:"#ff2fd6",type:"unstable"},{x:390,y:220,w:44,h:10,color:"#ff3131",type:"normal"},{x:470,y:200,w:44,h:10,color:"#ff3131",type:"unstable"},{x:540,y:180,w:50,h:12,color:"#48bb78",type:"finish"}];shardsArr=[{x:160,y:250,w:10,h:10},{x:240,y:230,w:10,h:10},{x:320,y:210,w:10,h:10},{x:400,y:190,w:10,h:10},{x:480,y:170,w:10,h:10}];blades=[{x:270,y:200,angle:0,speed:0.08},{x:430,y:160,angle:0,speed:-0.06}];document.addEventListener("keydown",function(e){if(e.code==="ArrowLeft"||e.code==="KeyA")leftHeld=true;if(e.code==="ArrowRight"||e.code==="KeyD")rightHeld=true;if(e.code==="Space"||e.code==="ArrowUp"||e.code==="KeyW"){jumpHeld=true;e.preventDefault()}});document.addEventListener("keyup",function(e){if(e.code==="ArrowLeft"||e.code==="KeyA")leftHeld=false;if(e.code==="ArrowRight"||e.code==="KeyD")rightHeld=false;if(e.code==="Space"||e.code==="ArrowUp"||e.code==="KeyW")jumpHeld=false;});function autoPlay(){if(!player.alive)return;player.vx=SPEED;var aheadX=player.x+player.w+16,footY=player.y+player.h+4,ground=false;for(var i=0;i<platforms.length;i++){var p=platforms[i];if(aheadX>p.x&&aheadX<p.x+p.w&&footY>=p.y&&footY<=p.y+30){ground=true;break}}if(!ground&&player.onGround&&autoJumpCd<=0){player.vy=JUMP;player.onGround=false;autoJumpCd=25}if(autoJumpCd>0)autoJumpCd--;}function movePlayer(){if(!player.alive)return;if(leftHeld)player.vx=-4;else if(rightHeld)player.vx=4;if((jumpHeld)&&player.onGround){player.vy=JUMP;player.onGround=false}player.vy+=GRAVITY;player.x+=player.vx;player.y+=player.vy;if(player.x<0)player.x=0;if(player.x+player.w>W)player.x=W-player.w;player.onGround=false;for(var i=0;i<platforms.length;i++){var p=platforms[i];if(player.vy>=0&&player.x+player.w>p.x&&player.x<p.x+p.w&&player.y+player.h>=p.y&&player.y+player.h<=p.y+p.h+player.vy+2){player.y=p.y-player.h;player.vy=0;player.onGround=true;if(p.type==="finish"&&!won){won=true}}}if(player.y>H&&player.alive){player.alive=false;lives--;document.getElementById("lives").textContent=lives;if(lives>0)setTimeout(respawn,800);}}function drawZones(){ctx.fillStyle="rgba(0,229,255,.10)";ctx.fillRect(0,0,200,H);ctx.fillStyle="rgba(255,47,214,.10)";ctx.fillRect(200,0,200,H);ctx.fillStyle="rgba(255,49,49,.12)";ctx.fillRect(400,0,200,H);ctx.fillStyle="rgba(232,234,242,.55)";ctx.font="bold 10px system-ui";ctx.textAlign="center";ctx.fillText("Boot Sequence",100,20);ctx.fillText("Memory Lane",300,20);ctx.fillText("Kernel Panic",500,20);}function collectShards(){for(var i=shardsArr.length-1;i>=0;i--){var s=shardsArr[i];if(player.alive&&player.x+player.w>s.x&&player.x<s.x+s.w&&player.y+player.h>s.y&&player.y<s.y+s.h){shardsArr.splice(i,1);shards++;document.getElementById("shards").textContent=shards;}}}function crumblePlatforms(){for(var i=platforms.length-1;i>=0;i--){if(platforms[i].x+platforms[i].w<player.x&&platforms[i].type==="normal"){platforms.splice(i,1);crumbled++;}}}function moveCorruption(){corruptionX+=0.35;if(corruptionX>W+40)corruptionX=-80;if(player.alive&&player.x<corruptionX){player.alive=false;lives--;document.getElementById("lives").textContent=lives;if(lives>0)setTimeout(respawn,800);}}function spinBlades(){for(var i=0;i<blades.length;i++){blades[i].angle+=blades[i].speed;if(player.alive&&Math.abs(player.x+8-blades[i].x)<16&&Math.abs(player.y+12-blades[i].y)<16){player.alive=false;lives--;document.getElementById("lives").textContent=lives;if(lives>0)setTimeout(respawn,800);}}flickerPhase+=0.1;}function drawBase(){ctx.fillStyle="#060310";ctx.fillRect(0,0,W,H);var i,p;for(i=0;i<platforms.length;i++){p=platforms[i];var alpha=1;if(p.type==="unstable"&&flickerPhase>0)alpha=0.4+0.6*Math.abs(Math.sin(flickerPhase));ctx.save();ctx.globalAlpha=alpha;ctx.shadowColor=p.color;ctx.shadowBlur=10;ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.w,p.h);ctx.restore();if(p.type==="finish"){ctx.fillStyle="rgba(72,187,120,.9)";ctx.font="bold 9px system-ui";ctx.textAlign="center";ctx.fillText("ESCAPE",p.x+p.w/2,p.y-4)}}for(i=0;i<shardsArr.length;i++){p=shardsArr[i];ctx.save();ctx.shadowColor="#7bf1a8";ctx.shadowBlur=12;ctx.fillStyle="#7bf1a8";ctx.fillRect(p.x,p.y,p.w,p.h);ctx.restore();}for(i=0;i<blades.length;i++){var b=blades[i];ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.angle);ctx.shadowColor="#ff2fd6";ctx.shadowBlur=14;ctx.fillStyle="#ff2fd6";ctx.fillRect(-22,-3,44,6);ctx.fillRect(-3,-22,6,44);ctx.restore();}if(player.alive){ctx.save();ctx.shadowColor="rgba(0,229,255,.9)";ctx.shadowBlur=12;ctx.fillStyle="#00e5ff";ctx.fillRect(player.x,player.y,player.w,player.h);ctx.restore();ctx.fillStyle="#fff";ctx.fillRect(player.x+4,player.y+6,4,4);ctx.fillRect(player.x+10,player.y+6,4,4);}else{ctx.save();ctx.fillStyle="rgba(255,47,214,.18)";ctx.fillRect(0,0,W,H);ctx.fillStyle="rgba(0,229,255,.5)";for(var g=0;g<8;g++){ctx.fillRect(Math.random()*W,Math.random()*H,60+Math.random()*120,3)}ctx.restore();}if(corruptionX>-40){var grad=ctx.createLinearGradient(corruptionX-70,0,corruptionX,0);grad.addColorStop(0,"rgba(255,47,214,0)");grad.addColorStop(1,"rgba(255,47,214,.85)");ctx.fillStyle=grad;ctx.fillRect(corruptionX-70,0,70,H);ctx.fillStyle="#ff2fd6";ctx.fillRect(corruptionX-4,0,8,H);}}try{function drawTimer() {
  var elapsed = Math.floor((Date.now() - startTime) / 1000);
  document.getElementById("timer").textContent = elapsed + "s";
  if (won) {
    ctx.fillStyle = "rgba(0,0,0,.6)";
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = "#48bb78";
    ctx.font = "bold 26px system-ui";
    ctx.textAlign = "center";
    ctx.fillText("ESCAPED!", W / 2, H / 2 - 10);
    ctx.fillStyle = "#e8eaf2";
    ctx.font = "15px system-ui";
    ctx.fillText("Shards: " + shards + "  Time: " + elapsed + "s", W / 2, H / 2 + 18);
  }
}}catch(e){}function loop(){autoPlay();movePlayer();drawZones();collectShards();crumblePlatforms();moveCorruption();spinBlades();if(typeof drawTimer==="function")drawTimer();drawBase();requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></body></html>
