<!DOCTYPE html><html><head>
<title>Finished build: js-memory-workshop</title>
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="UTF-8"><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:sans-serif;background:#1a1a2e;display:flex;flex-direction:column;align-items:center;min-height:100vh;color:#fff}.header{text-align:center;padding:12px 0 4px}.header h1{font-size:18px;color:#e2e2ff}.stats{display:flex;gap:20px;justify-content:center;padding:6px 0 10px;font-size:14px;color:#aab}.grid{display:grid;grid-template-columns:repeat(4,80px);gap:8px;perspective:600px}.card{width:80px;height:80px;cursor:pointer;position:relative;transform-style:preserve-3d;transition:transform 0.5s}.card.flipped{transform:rotateY(180deg)}.card.matched{transform:rotateY(180deg)}.card .front,.card .back{position:absolute;width:100%;height:100%;border-radius:10px;display:flex;align-items:center;justify-content:center;backface-visibility:hidden}.card .back{background:linear-gradient(135deg,#6c5ce7,#a29bfe);font-size:28px;color:#fff}.card .front{background:#2d2d5e;transform:rotateY(180deg);font-size:36px}.card.matched .front{background:#1e6e3e}.win-msg{margin-top:14px;font-size:18px;color:#ffd166;text-align:center;min-height:24px}.best-msg{font-size:13px;color:#aab;margin-top:4px;text-align:center;min-height:18px}</style></head><body><div class="header"><h1>Memory Match</h1></div><div class="stats"><span>Moves: <span id="moveCount">0</span></span><span>Time: <span id="timer">0</span>s</span><span>Pairs: <span id="pairCount">0</span> / <span id="totalPairs">8</span></span></div><div class="grid" id="grid"></div><div class="win-msg" id="winMsg"></div><div class="best-msg" id="bestMsg"></div><script>var emojis=['\ud83c\udf4e','\ud83c\udf4a','\ud83c\udf4b','\ud83c\udf47','\ud83d\udc31','\ud83d\udc36','\ud83d\udc38','\ud83e\udd8a'];var deck=emojis.concat(emojis);function shuffle(arr){for(var i=arr.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=arr[i];arr[i]=arr[j];arr[j]=t}return arr}shuffle(deck);var grid=document.getElementById("grid");deck.forEach(function(emoji,i){var card=document.createElement("div");card.className="card";card.dataset.index=i;card.dataset.emoji=emoji;card.innerHTML='<div class="back">?</div><div class="front">'+emoji+'</div>';grid.appendChild(card)});var flippedCards=[];var matchedPairs=0;var totalPairs=emojis.length;var moves=0;var timerStarted=false;var timerVal=0;var timerInterval=null;var locked=false;function startTimer(){if(!timerStarted){timerStarted=true;timerInterval=setInterval(function(){timerVal++;document.getElementById("timer").textContent=timerVal},1000)}}function updateMoves(){moves++;document.getElementById("moveCount").textContent=moves}function updatePairs(){document.getElementById("pairCount").textContent=matchedPairs}function checkWin(){if(matchedPairs===totalPairs){clearInterval(timerInterval);document.getElementById("winMsg").textContent="You won in "+moves+" moves and "+timerVal+"s!"}}document.getElementById("grid").addEventListener("click",function(e){var card=e.target.closest(".card");if(!card||card.classList.contains("flipped")||card.classList.contains("matched")||locked)return;startTimer();card.classList.add("flipped");flippedCards.push(card);if(flippedCards.length===2){updateMoves();locked=true;var a=flippedCards[0],b=flippedCards[1];if(a.dataset.emoji===b.dataset.emoji){a.classList.add("matched");b.classList.add("matched");matchedPairs++;updatePairs();flippedCards=[];locked=false;checkWin()}else{setTimeout(function(){a.classList.remove("flipped");b.classList.remove("flipped");flippedCards=[];locked=false},800)}}});try{var bestKey = "memoryBest";
var prevBest = localStorage.getItem(bestKey);
if (!prevBest || moves < Number(prevBest)) {
  localStorage.setItem(bestKey, moves);
  document.getElementById("bestMsg").textContent = "New best score!";
} else {
  document.getElementById("bestMsg").textContent = "Best: " + prevBest + " moves";
}}catch(e){}</script></body></html>
