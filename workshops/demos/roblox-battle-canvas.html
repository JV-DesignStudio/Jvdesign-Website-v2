<!DOCTYPE html><html><head>

<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="UTF-8"><style>body{display:flex;flex-direction:column;align-items:center;background:#0d1117;padding:8px;margin:0;font-family:system-ui,sans-serif;color:#e8eaf2;gap:6px;overflow:hidden}canvas{background:#0a0e14;border:2px solid #1e2733;border-radius:8px;touch-action:none;max-width:100%;cursor:crosshair}.row{display:flex;gap:12px;align-items:center;font-size:.8rem;flex-wrap:wrap}label{cursor:pointer}</style></head><body><div class="row"><span>HP: <b id="hp">100</b></span><span>Enemies: <b id="enemyCount">0</b></span><span>Kills: <b id="kills">0</b></span></div><canvas id="game" width="600" height="400"></canvas><div class="row" style="font-size:.7rem;opacity:.5">Arrow keys to move &middot; Click to attack</div><script>const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");const W=600,H=400,SPEED=3,ARENA_PAD=30;let player={x:W/2-10,y:H/2-10,w:20,h:24,vx:0,vy:0,hp:100,maxHp:100,alive:true,facing:1,attacking:false,attackTimer:0};let enemies=[],kills=0,gameWon=false,gameLost=false;let leftHeld=false,rightHeld=false,upHeld=false,downHeld=false;let walls=[{x:ARENA_PAD,y:ARENA_PAD,w:W-ARENA_PAD*2,h:4,color:"#4a5568"},{x:ARENA_PAD,y:H-ARENA_PAD,w:W-ARENA_PAD*2,h:4,color:"#4a5568"},{x:ARENA_PAD,y:ARENA_PAD,w:4,h:H-ARENA_PAD*2,color:"#4a5568"},{x:W-ARENA_PAD-4,y:ARENA_PAD,w:4,h:H-ARENA_PAD*2,color:"#4a5568"}];let pillars=[{x:150,y:120,w:16,h:16},{x:430,y:120,w:16,h:16},{x:150,y:270,w:16,h:16},{x:430,y:270,w:16,h:16},{x:290,y:195,w:20,h:20}];document.addEventListener("keydown",function(e){if(e.code==="ArrowLeft"||e.code==="KeyA")leftHeld=true;if(e.code==="ArrowRight"||e.code==="KeyD")rightHeld=true;if(e.code==="ArrowUp"||e.code==="KeyW"){upHeld=true;e.preventDefault()}if(e.code==="ArrowDown"||e.code==="KeyS")downHeld=true;});document.addEventListener("keyup",function(e){if(e.code==="ArrowLeft"||e.code==="KeyA")leftHeld=false;if(e.code==="ArrowRight"||e.code==="KeyD")rightHeld=false;if(e.code==="ArrowUp"||e.code==="KeyW")upHeld=false;if(e.code==="ArrowDown"||e.code==="KeyS")downHeld=false;});function movePlayer(){if(!player.alive)return;player.vx=0;player.vy=0;if(leftHeld){player.vx=-SPEED;player.facing=-1}if(rightHeld){player.vx=SPEED;player.facing=1}if(upHeld)player.vy=-SPEED;if(downHeld)player.vy=SPEED;player.x+=player.vx;player.y+=player.vy;if(player.x<ARENA_PAD+4)player.x=ARENA_PAD+4;if(player.x+player.w>W-ARENA_PAD-4)player.x=W-ARENA_PAD-4-player.w;if(player.y<ARENA_PAD+4)player.y=ARENA_PAD+4;if(player.y+player.h>H-ARENA_PAD)player.y=H-ARENA_PAD-player.h;for(let i=0;i<pillars.length;i++){let p=pillars[i];if(player.x+player.w>p.x&&player.x<p.x+p.w&&player.y+player.h>p.y&&player.y<p.y+p.h){if(player.vx>0)player.x=p.x-player.w;if(player.vx<0)player.x=p.x+p.w;if(player.vy>0)player.y=p.y-player.h;if(player.vy<0)player.y=p.y+p.h;}}}function spawnEnemies(){let spawns=[{x:60,y:60},{x:500,y:60},{x:60,y:320},{x:500,y:320},{x:280,y:60}];for(let i=0;i<spawns.length;i++){enemies.push({x:spawns[i].x,y:spawns[i].y,w:18,h:22,hp:40,maxHp:40,alive:true,vx:0,vy:0,speed:1.2,color:"#f56565",knockX:0,knockY:0});}}spawnEnemies();function moveEnemies(){for(let i=0;i<enemies.length;i++){let e=enemies[i];if(!e.alive)continue;e.knockX*=0.85;e.knockY*=0.85;let dx=player.x-e.x,dy=player.y-e.y;let dist=Math.sqrt(dx*dx+dy*dy);if(dist>0){e.vx=(dx/dist)*e.speed;e.vy=(dy/dist)*e.speed}e.x+=e.vx+e.knockX;e.y+=e.vy+e.knockY;if(e.x<ARENA_PAD+4)e.x=ARENA_PAD+4;if(e.x+e.w>W-ARENA_PAD-4)e.x=W-ARENA_PAD-4-e.w;if(e.y<ARENA_PAD+4)e.y=ARENA_PAD+4;if(e.y+e.h>H-ARENA_PAD)e.y=H-ARENA_PAD-e.h;}}canvas.addEventListener("click",function(e){if(!player.alive||player.attacking)return;player.attacking=true;player.attackTimer=12;});function processAttack(){if(!player.attacking)return;player.attackTimer--;if(player.attackTimer<=0){player.attacking=false;return}if(player.attackTimer===10){let sx=player.facing===1?player.x+player.w:player.x-30;let sy=player.y-4;let sw=30;let sh=player.h+8;for(let i=0;i<enemies.length;i++){let e=enemies[i];if(!e.alive)continue;if(sx+sw>e.x&&sx<e.x+e.w&&sy+sh>e.y&&sy<e.y+e.h){e.hp-=20;let kx=player.facing*6,ky=-2;e.knockX=kx;e.knockY=ky;if(e.hp<=0){e.alive=false;kills++;document.getElementById("kills").textContent=kills}}}}}function enemyAttack(){if(!player.alive)return;for(let i=0;i<enemies.length;i++){let e=enemies[i];if(!e.alive)continue;let dx=player.x-e.x,dy=player.y-e.y;let dist=Math.sqrt(dx*dx+dy*dy);if(dist<24){player.hp-=0.3;document.getElementById("hp").textContent=Math.ceil(player.hp);if(player.hp<=0){player.hp=0;player.alive=false}}}}function checkWinLose(){if(gameLost||gameWon)return;if(!player.alive){gameLost=true;return}let allDead=true;for(let i=0;i<enemies.length;i++){if(enemies[i].alive){allDead=false;break}}if(allDead&&enemies.length>0)gameWon=true;}function draw(){CWArt.bg(ctx,W,H,"#1a1020","#0d0814");CWArt.grid(ctx,W,H,40);for(let i=0;i<walls.length;i++){let w=walls[i];ctx.save();ctx.shadowColor="#718096";ctx.shadowBlur=6;ctx.fillStyle=w.color;ctx.fillRect(w.x,w.y,w.w,w.h);ctx.restore()}for(let i=0;i<pillars.length;i++){let p=pillars[i];ctx.save();ctx.shadowColor="rgba(160,140,100,.6)";ctx.shadowBlur=8;ctx.fillStyle="#8b7355";CWArt.roundRect(ctx,p.x,p.y,p.w,p.h,3);ctx.fill();ctx.restore()}for(let i=0;i<enemies.length;i++){let e=enemies[i];if(!e.alive)continue;ctx.save();ctx.shadowColor="rgba(245,101,101,.7)";ctx.shadowBlur=10;ctx.fillStyle=e.color;ctx.fillRect(e.x,e.y,e.w,e.h);ctx.restore();ctx.fillStyle="#fff";ctx.fillRect(e.x+4,e.y+5,3,3);ctx.fillRect(e.x+11,e.y+5,3,3);}if(player.alive){let pw=player.w+4,ph=3;let px=player.x-2,py=player.y-8;ctx.fillStyle="rgba(0,0,0,.5)";ctx.fillRect(px,py,pw,ph);let pct=player.hp/player.maxHp;ctx.fillStyle=pct>0.5?"#48bb78":pct>0.25?"#ecc94b":"#f56565";ctx.fillRect(px,py,pw*pct,ph)}for(let i=0;i<enemies.length;i++){let e=enemies[i];if(!e.alive)continue;let ew=e.w+4,eh=3;let ex=e.x-2,ey=e.y-7;ctx.fillStyle="rgba(0,0,0,.5)";ctx.fillRect(ex,ey,ew,eh);let epct=e.hp/e.maxHp;ctx.fillStyle="#f56565";ctx.fillRect(ex,ey,ew*epct,eh)}if(player.alive){ctx.save();ctx.shadowColor="rgba(99,179,237,.9)";ctx.shadowBlur=12;ctx.fillStyle="#63b3ed";ctx.fillRect(player.x,player.y,player.w,player.h);ctx.restore();let ex=player.facing===1?player.x+5:player.x+11;ctx.fillStyle="#fff";ctx.fillRect(ex,player.y+6,4,4);ctx.fillRect(ex+6*player.facing,player.y+6,4,4);if(player.attacking){let sx=player.facing===1?player.x+player.w:player.x-30;ctx.save();ctx.shadowColor="rgba(255,200,50,.9)";ctx.shadowBlur=14;ctx.fillStyle="#ecc94b";ctx.fillRect(sx,player.y-2,30,4);ctx.restore()}}document.getElementById("hp").textContent=Math.ceil(player.hp);let aliveCount=0;for(let i=0;i<enemies.length;i++){if(enemies[i].alive)aliveCount++}document.getElementById("enemyCount").textContent=aliveCount;document.getElementById("kills").textContent=kills;if(gameWon){ctx.fillStyle="rgba(0,0,0,.6)";ctx.fillRect(0,0,W,H);ctx.fillStyle="#48bb78";ctx.font="bold 28px system-ui";ctx.textAlign="center";ctx.fillText("YOU WIN!",W/2,H/2-20);ctx.fillStyle="#e8eaf2";ctx.font="16px system-ui";ctx.fillText("All enemies defeated! Kills: "+kills,W/2,H/2+15)}if(gameLost){ctx.fillStyle="rgba(0,0,0,.6)";ctx.fillRect(0,0,W,H);ctx.fillStyle="#f56565";ctx.font="bold 28px system-ui";ctx.textAlign="center";ctx.fillText("DEFEATED!",W/2,H/2-20);ctx.fillStyle="#e8eaf2";ctx.font="16px system-ui";ctx.fillText("Kills: "+kills+" | Click to retry",W/2,H/2+15)}}let touchStart=null,touchMoveDir=null;canvas.addEventListener("touchstart",function(e){let r=canvas.getBoundingClientRect();let tx=e.touches[0].clientX-r.left;let ty=e.touches[0].clientY-r.top;touchStart={x:tx,y:ty};e.preventDefault();if(!player.alive||player.attacking)return;player.attacking=true;player.attackTimer=12;});canvas.addEventListener("touchmove",function(e){if(!touchStart)return;e.preventDefault();let dx=e.touches[0].clientX-touchStart.x,dy=e.touches[0].clientY-touchStart.y;leftHeld=false;rightHeld=false;upHeld=false;downHeld=false;if(Math.abs(dx)>15){if(dx>0)rightHeld=true;else leftHeld=true}if(Math.abs(dy)>15){if(dy>0)downHeld=true;else upHeld=true}});canvas.addEventListener("touchend",function(e){leftHeld=false;rightHeld=false;upHeld=false;downHeld=false;touchStart=null;});canvas.addEventListener("click",function(e){if(gameLost){player.x=W/2-10;player.y=H/2-10;player.hp=100;player.alive=true;player.attacking=false;player.attackTimer=0;kills=0;gameLost=false;gameWon=false;enemies=[];spawnEnemies();}});function checkWinLose() {
  if (gameLost || gameWon) return;
  if (!player.alive) { gameLost = true; return; }
  let allDead = true;
  for (let i = 0; i < enemies.length; i++) {
    if (enemies[i].alive) { allDead = false; break; }
  }
  if (allDead && enemies.length > 0) gameWon = true;
}function loop(){movePlayer();moveEnemies();processAttack();enemyAttack();if(typeof checkWinLose==="function")checkWinLose();draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></body></html>
