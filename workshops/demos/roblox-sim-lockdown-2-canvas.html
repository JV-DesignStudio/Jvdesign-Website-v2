<!DOCTYPE html><html><head>
<title>Finished build: roblox-sim-lockdown-2-canvas</title>
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="UTF-8"><style>body{display:flex;flex-direction:column;align-items:center;background:#0d1117;padding:8px;margin:0;font-family:system-ui,sans-serif;color:#e8eaf2;gap:6px;overflow:hidden}canvas{background:#0a0e14;border:2px solid #1e2733;border-radius:8px;touch-action:none;max-width:100%}.row{display:flex;gap:12px;align-items:center;font-size:.8rem;flex-wrap:wrap;justify-content:center}#simLog{font-size:.7rem;opacity:.8;min-height:20px}</style></head><body><div class="row"><span>Theme: <b id="themeName">-</b></span><span>Builds: <b id="buildCount">0</b></span><span>Seed: <b id="seedNum">-</b></span></div><canvas id="game" width="600" height="400"></canvas><div class="row" id="simLog">Watch a fresh course generate</div><script>var canvas=document.getElementById("game"),ctx=canvas.getContext("2d");var W=600,H=400;var theme=null,nodes=[],obstacles=[],buildCount=0,seedUsed=0,walkerT=0;function srand(s){return function(){s|=0;s=s+0x6D2B79F5|0;var t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}function simLog(m){document.getElementById("simLog").textContent=m;}function drawCourse(){var g=ctx.createLinearGradient(0,0,0,H);if(theme){g.addColorStop(0,theme.sky[0]);g.addColorStop(1,theme.sky[1]);}else{g.addColorStop(0,"#1a1c2e");g.addColorStop(1,"#0d0f1a");}ctx.fillStyle=g;ctx.fillRect(0,0,W,H);var i,p;for(i=0;i<nodes.length;i++){p=nodes[i];ctx.save();ctx.shadowColor=theme?theme.ground:"#63b3ed";ctx.shadowBlur=8;ctx.fillStyle=theme?theme.ground:"#63b3ed";if(ctx.roundRect){ctx.beginPath();ctx.roundRect(p.x-32,p.y-6,64,12,4);ctx.fill();}else{ctx.fillRect(p.x-32,p.y-6,64,12);}ctx.restore();}for(i=0;i<obstacles.length;i++){p=obstacles[i];ctx.save();ctx.shadowColor=p.color;ctx.shadowBlur=12;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,7,0,Math.PI*2);ctx.fill();ctx.restore();}if(nodes.length){ctx.fillStyle="#48bb78";ctx.font="bold 10px system-ui";ctx.textAlign="center";ctx.fillText("START",nodes[0].x,nodes[0].y-14);var last=nodes[nodes.length-1];ctx.fillStyle="#ffd166";ctx.fillText("FINISH",last.x,last.y-14);if(nodes.length>1){walkerT=(walkerT+0.008)%1;var seg=Math.min(nodes.length-2,Math.floor(walkerT*(nodes.length-1)));var f=walkerT*(nodes.length-1)-seg;var wx=nodes[seg].x+(nodes[seg+1].x-nodes[seg].x)*f;var wy=nodes[seg].y+(nodes[seg+1].y-nodes[seg].y)*f-18;ctx.fillStyle="#fff";ctx.fillRect(wx-5,wy-8,10,14);}}document.getElementById("themeName").textContent=theme?theme.name:"-";document.getElementById("buildCount").textContent=buildCount;document.getElementById("seedNum").textContent=seedUsed||"-";}function getTheme(){return{name:"Neon Grid",sky:["#1a1c2e","#0d0f1a"],ground:"#63b3ed",obstacle:"#f56565"}}function makeNodes(seed,count){var r=srand(seed);var pts=[];for(var i=0;i<count;i++){pts.push({x:40+Math.floor(r()*520),y:60+Math.floor(r()*280)});}return pts;}function applyArchetype(nodes,type){var out=[];for(var i=0;i<nodes.length;i++){var t=nodes.length>1?i/(nodes.length-1):0;if(type===0)out.push({x:40+t*520,y:200});else if(type===1)out.push({x:40+t*520,y:(i%2===0?120:280)});else if(type===2){var a=t*Math.PI*2;out.push({x:300+Math.cos(a)*200*t+40,y:200+Math.sin(a)*120});}else if(type===3)out.push({x:40+t*520,y:320-t*260});else{var b=t*Math.PI*2;out.push({x:300+Math.cos(b)*180,y:200+Math.sin(b)*120});}}return out;}function scatterObstacles(nodes,theme){var obs=[];for(var i=2;i<nodes.length;i+=3){obs.push({x:nodes[i].x,y:nodes[i].y-24,color:theme.obstacle});}return obs;}function buildCourse(seed){nodes=[];obstacles=[];theme=getTheme();var raw=makeNodes(seed,8);nodes=applyArchetype(raw,seed%5);obstacles=scatterObstacles(nodes,theme);buildCount++;seedUsed=seed;simLog("Built course #"+buildCount+" from seed "+seed);return nodes.length;}try{function verifyVariety() {
  buildCourse(7);
  var a = JSON.stringify(nodes);
  buildCourse(8);
  var b = JSON.stringify(nodes);
  var different = (a !== b);
  simLog("Maps differ: " + different);
  return different;
}}catch(e){}if(typeof verifyVariety==="function")verifyVariety();function loop(){drawCourse();requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></body></html>
