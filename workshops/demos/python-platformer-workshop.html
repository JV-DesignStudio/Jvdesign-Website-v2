(){URL.revokeObjectURL(_cu);(function(){function loop(){if(gameState==="play"){if(leftHeld)px-=speed;if(rightHeld)px+=speed;px=Math.max(0,Math.min(600-pw,px));vy+=gravity;py+=vy;if(upPressed&&onGround){vy=jumpForce;onGround=false}onGround=false;for(var i=0;i<platforms.length;i++){var p=platforms[i];if(px+pw>p.x&&px<p.x+p.w&&py+ph>=p.y&&py+ph<=p.y+p.h+vy+2&&vy>=0){py=p.y-ph;vy=0;onGround=true}}for(var i=coins.length-1;i>=0;i--){var c=coins[i];if(px+pw>c.x-c.r&&px<c.x+c.r&&py+ph>c.y-c.r&&py<c.y+c.r){score+=10;coins.splice(i,1)}}if(window.cwStep)cwStep();}ctx.fillStyle="#111827";ctx.fillRect(0,0,600,400);ctx.fillStyle="#22c55e";for(var i=0;i<platforms.length;i++){var p=platforms[i];ctx.fillRect(p.x,p.y,p.w,p.h)}ctx.fillStyle="#facc15";for(var i=0;i<coins.length;i++){var c=coins[i];ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,Math.PI*2);ctx.fill()}ctx.fillStyle="#4ade80";ctx.fillRect(goalX,goalY,goalW,goalH);ctx.fillStyle="#16a34a";ctx.beginPath();ctx.moveTo(goalX,goalY);ctx.lineTo(goalX+24,goalY+10);ctx.lineTo(goalX,goalY+20);ctx.fill();ctx.fillStyle="#3b82f6";ctx.fillRect(px,py,pw,ph);ctx.fillStyle="#fff";ctx.font="bold 20px monospace";ctx.textAlign="left";ctx.fillText("Score: "+score,16,28);ctx.textAlign="right";ctx.fillText("Lives: "+lives,584,28);if(levelComplete){ctx.fillStyle="#fff";ctx.font="bold 36px monospace";ctx.textAlign="center";ctx.fillText("LEVEL COMPLETE!",300,180);ctx.font="20px monospace";ctx.fillText("Score: "+score,300,220);ctx.fillText("Press R to play again",300,260)}if(gameState==="dead"){ctx.fillStyle="#fff";ctx.font="bold 36px monospace";ctx.textAlign="center";ctx.fillText("GAME OVER",300,180);ctx.font="20px monospace";ctx.fillText("Score: "+score,300,220);ctx.fillText("Press R to restart",300,260)}requestAnimationFrame(loop)}requestAnimationFrame(loop);})();};_cs.onerror=function(){URL.revokeObjectURL(_cu);(function(){function loop(){if(gameState==="play"){if(leftHeld)px-=speed;if(rightHeld)px+=speed;px=Math.max(0,Math.min(600-pw,px));vy+=gravity;py+
