<!DOCTYPE html><html><head>
<title>Finished build: roblox-sim-lockdown-3-canvas</title>
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="UTF-8"><style>body{display:flex;flex-direction:column;align-items:center;background:#160f24;padding:8px;margin:0;font-family:system-ui,sans-serif;color:#e8eaf2;gap:6px;overflow:hidden}canvas{background:#0d0a18;border:2px solid #2c2140;border-radius:8px;touch-action:none;max-width:100%}.row{display:flex;gap:12px;align-items:center;font-size:.8rem;flex-wrap:wrap;justify-content:center}#msg{font-weight:800;color:#ffd166;min-height:20px}#rankList{font-size:.72rem;opacity:.85;min-height:20px}</style></head><body><div class="row"><span>Round <b id="roundNum">1</b></span><span>Tiles: <b id="tileCount">0</b></span><span>In game: <b id="leftCount">4</b></span></div><canvas id="game" width="600" height="400"></canvas><div class="row" id="msg">The final is coming</div><div class="row" id="rankList"></div><script>var canvas=document.getElementById("game"),ctx=canvas.getContext("2d");var W=600,H=400;var players=[],tiles=[],msg="The final is coming";function placePlayers(){players=[{name:"Ava",x:220,y:160,vx:0,vy:0,tool:null,glow:false,progress:0,out:false},{name:"Leo",x:380,y:160,vx:0,vy:0,tool:null,glow:false,progress:0,out:false},{name:"Mia",x:220,y:260,vx:0,vy:0,tool:null,glow:false,progress:0,out:false},{name:"Raj",x:380,y:260,vx:0,vy:0,tool:null,glow:false,progress:0,out:false}];}function driftPlayers(){for(var i=0;i<players.length;i++){var p=players[i];if(p.out)continue;p.vx+=(Math.random()-0.5)*0.4;p.vy+=(Math.random()-0.5)*0.4;p.vx*=0.96;p.vy*=0.96;p.x+=p.vx;p.y+=p.vy;if(p.x<120){p.x=120;p.vx=0}if(p.x>480){p.x=480;p.vx=0}if(p.y<60){p.y=60;p.vy=0}if(p.y>340){p.y=340;p.vy=0}}}var RING_COLORS=["#ffd166","#f5a623","#f56565","#9b2c2c"];function drawArena(){ctx.fillStyle="#0d0a18";ctx.fillRect(0,0,W,H);var i,t;for(i=0;i<tiles.length;i++){t=tiles[i];var px=300+t.gx*44,py=200+t.gz*44;ctx.fillStyle=RING_COLORS[t.ring%RING_COLORS.length];ctx.fillRect(px-20,py-20,40,40);ctx.fillStyle="rgba(0,0,0,.45)";ctx.font="bold 10px system-ui";ctx.textAlign="center";ctx.fillText("R"+t.ring,px,py+4);}for(i=0;i<players.length;i++){var p=players[i];if(p.out)continue;if(p.glow){ctx.save();ctx.shadowColor="#ffd166";ctx.shadowBlur=14;ctx.strokeStyle="#ffd166";ctx.lineWidth=2;ctx.beginPath();ctx.arc(p.x,p.y,11,0,Math.PI*2);ctx.stroke();ctx.restore();}ctx.fillStyle="#7bf1a8";ctx.beginPath();ctx.arc(p.x,p.y,7,0,Math.PI*2);ctx.fill();ctx.fillStyle="#e8eaf2";ctx.font="bold 9px system-ui";ctx.textAlign="center";ctx.fillText(p.name,p.x,p.y-14);}if(msg){ctx.fillStyle="rgba(0,0,0,.55)";ctx.fillRect(0,8,W,30);ctx.fillStyle="#ffd166";ctx.font="bold 15px system-ui";ctx.textAlign="center";ctx.fillText(msg,W/2,29);}document.getElementById("msg").textContent=msg;document.getElementById("tileCount").textContent=tiles.length;var left=players.filter(function(p){return!p.out}).length;document.getElementById("leftCount").textContent=left;var order=players.slice().sort(function(a,b){return b.progress-a.progress});document.getElementById("rankList").textContent=order.map(function(p,i){return((i+1)+". "+p.name+(p.out?" (out)":""));}).join("  ");}placePlayers();function giveGauntlet(players){for(var i=0;i<players.length;i++){players[i].tool="Glitch Gauntlet";players[i].glow=true;}return players.length;}giveGauntlet(players);function shove(player,others){var hits=0;for(var i=0;i<others.length;i++){var o=others[i];if(o===player||o.out)continue;var dx=o.x-player.x,dy=o.y-player.y;if(dx>0&&dx<120&&Math.abs(dy)<40){o.vx+=8;o.vy+=(Math.random()*4-2);hits++;}}return hits;}function rankPlayers(players){var ranked=players.slice().sort(function(a,b){return b.progress-a.progress});var out=ranked[ranked.length-1];out.out=true;return{ranked:ranked,out:out};}function buildArena(rings){var tiles=[];for(var gx=-rings+1;gx<rings;gx++){for(var gz=-rings+1;gz<rings;gz++){var ring=Math.max(Math.abs(gx),Math.abs(gz));tiles.push({gx:gx,gz:gz,ring:ring});}}return tiles;}function shrinkArena(tiles){var max=0,i;for(i=0;i<tiles.length;i++){if(tiles[i].ring>max)max=tiles[i].ring;}var left=[];for(var k=0;k<tiles.length;k++){if(tiles[k].ring<max)left.push(tiles[k]);}return left;}tiles=buildArena(2);players[0].progress=5;players[1].progress=3;players[2].progress=1;try{function crownChampion(players) {
  var best = null;
  for (var i = 0; i < players.length; i++) {
    if (!players[i].out && (!best || players[i].progress > best.progress)) best = players[i];
  }
  msg = "CHAMPION: " + best.name;
  return best.name;
}}catch(e){}if(typeof crownChampion==="function")crownChampion(players);function loop(){driftPlayers();drawArena();requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></body></html>
