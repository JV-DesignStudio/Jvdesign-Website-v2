<!DOCTYPE html><html><head>
<title>Finished build: js-snake-workshop</title>
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="UTF-8"><style>body{display:flex;flex-direction:column;align-items:center;background:#0d1117;padding:8px;margin:0;font-family:system-ui,sans-serif;color:#e8eaf2;gap:6px;overflow:hidden}canvas{background:#0a0e14;border:2px solid #1e2733;border-radius:8px;touch-action:none;max-width:100%}.row{display:flex;gap:12px;align-items:center;font-size:.8rem}label{display:flex;gap:4px;align-items:center;cursor:pointer}</style></head><body><div class="row"><span>Score: <b id="score">0</b></span><span>Best: <b id="best">0</b></span><label><input type="checkbox" id="wrap"> Wrap</label></div><canvas id="game" width="400" height="400"></canvas><div class="row" style="font-size:.7rem;opacity:.5">Arrows / Swipe &middot; Space restarts</div><script>const canvas=document.getElementById("game"),ctx=canvas.getContext("2d"),CELL=16,GRID=25;let snake,dir,inputQueue,food,dead,lastTick,score;let best=0;try{best=Number(localStorage.getItem("snakeBest")||0)}catch(x){}document.getElementById("best").textContent=best;function spawnFood(){while(true){var f={x:Math.floor(Math.random()*GRID),y:Math.floor(Math.random()*GRID)};if(!snake.some(function(c){return c.x===f.x&&c.y===f.y}))return f}}function updateScore(){score=snake.length-3;document.getElementById("score").textContent=score}function reset(){snake=[{x:12,y:12},{x:11,y:12},{x:10,y:12}];dir={x:1,y:0};inputQueue=[];dead=false;lastTick=0;score=0;food=spawnFood();updateScore()}document.addEventListener("keydown",function(e){if(e.key===" "&&dead){reset();return}var map={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0}};if(map[e.key])inputQueue.push(map[e.key])});function draw(t){ctx.fillStyle="#0a0e14";ctx.fillRect(0,0,400,400);var r=6+Math.sin((t||0)/150)*2;ctx.fillStyle="#ff5470";ctx.beginPath();ctx.arc(food.x*CELL+CELL/2,food.y*CELL+CELL/2,r,0,Math.PI*2);ctx.fill();snake.forEach(function(c, i) {
  const light = 55 - Math.min(35, i * 1.5);
  ctx.fillStyle = "hsl(155, 70%, " + light + "%)";
  ctx.fillRect(c.x*CELL+1, c.y*CELL+1, CELL-2, CELL-2);
});if(dead){ctx.fillStyle="rgba(0,0,0,.55)";ctx.fillRect(0,0,400,400);ctx.fillStyle="#fff";ctx.font="bold 26px system-ui";ctx.textAlign="center";ctx.fillText("Game Over",200,180);ctx.font="15px system-ui";ctx.fillText("Score "+score+" \u00b7 Space to restart",200,210)}}function step(){while(inputQueue.length){var want=inputQueue.shift();if(want.x!==-dir.x||want.y!==-dir.y){dir=want;break}}var head={x:snake[0].x+dir.x,y:snake[0].y+dir.y};var wrapMode=document.getElementById("wrap").checked;if(wrapMode){head.x=(head.x+GRID)%GRID;head.y=(head.y+GRID)%GRID}else if(head.x<0||head.x>GRID-1||head.y<0||head.y>GRID-1){dead=true;return}if(snake.some(function(c){return c.x===head.x&&c.y===head.y})){dead=true;return}if(dead)return;snake.unshift(head);if(head.x===food.x&&head.y===food.y){food=spawnFood();updateScore()}else snake.pop()}var touchStart=null;canvas.addEventListener("touchstart",function(e){touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY};e.preventDefault()});canvas.addEventListener("touchend",function(e){if(!touchStart)return;var dx=e.changedTouches[0].clientX-touchStart.x,dy=e.changedTouches[0].clientY-touchStart.y;if(Math.abs(dx)>Math.abs(dy))inputQueue.push({x:dx>0?1:-1,y:0});else inputQueue.push({x:0,y:dy>0?1:-1});touchStart=null});function loop(t){var tickTime=Math.max(60,120-snake.length*2);if(!dead&&t-lastTick>tickTime){lastTick=t;step();if(dead&&score>best){best=score;try{localStorage.setItem("snakeBest",best)}catch(x){}document.getElementById("best").textContent=best}}draw(t);requestAnimationFrame(loop)}reset();requestAnimationFrame(loop);</script></body></html>
