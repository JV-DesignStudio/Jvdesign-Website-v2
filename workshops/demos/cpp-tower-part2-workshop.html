<!DOCTYPE html><html><head>
<title>Finished build: cpp-tower-part2-workshop</title>
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="UTF-8"><style>body{display:flex;flex-direction:column;align-items:center;background:#18281c;margin:0;overflow:hidden}canvas{display:block;cursor:crosshair}</style></head><body><canvas id="game" width="600" height="400"></canvas><script>const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");const path=[{x:-20,y:120},{x:200,y:120},{x:200,y:280},{x:420,y:280},{x:420,y:120},{x:620,y:120}];function drawPath(){ctx.strokeStyle="#463e30";ctx.lineWidth=36;ctx.lineCap="round";ctx.lineJoin="round";ctx.beginPath();ctx.moveTo(path[0].x,path[0].y);for(var i=1;i<path.length;i++)ctx.lineTo(path[i].x,path[i].y);ctx.stroke();ctx.strokeStyle="#5a5040";ctx.lineWidth=30;ctx.beginPath();ctx.moveTo(path[0].x,path[0].y);for(var i=1;i<path.length;i++)ctx.lineTo(path[i].x,path[i].y);ctx.stroke()}function makeEnemy(hp,speed,bounty,isBoss){return{x:path[0].x,y:path[0].y,wp:1,hp:hp,maxHp:hp,speed:speed,bounty:bounty,alive:true,isBoss:isBoss||false}}function makeTower(x,y){return{x:x,y:y,range:110,damage:5,cooldown:0,maxCd:0.7,level:1}}var enemies=[],towers=[],bullets=[];var gold=150,lives=20,wave=0,toSpawn=0,spawnGap=0,restTimer=3;var gameState="play",lastTime=0;function nearPath(px,py,r){for(var i=0;i<path.length-1;i++){var ax=path[i].x,ay=path[i].y,bx=path[i+1].x,by=path[i+1].y;var abx=bx-ax,aby=by-ay,apx=px-ax,apy=py-ay;var t=Math.max(0,Math.min(1,(abx*apx+aby*apy)/(abx*abx+aby*aby)));var cx=ax+abx*t,cy=ay+aby*t;var dx=px-cx,dy=py-cy;if(Math.sqrt(dx*dx+dy*dy)<r)return true}return false}function nearestInRange(t){var best=null,bd=t.range;for(var i=0;i<enemies.length;i++){var e=enemies[i];if(!e.alive)continue;var dx=e.x-t.x,dy=e.y-t.y,d=Math.sqrt(dx*dx+dy*dy);if(d<bd){bd=d;best=e}}return best}canvas.addEventListener("click",function(ev){if(gameState!=="play")return;var rect=canvas.getBoundingClientRect();var mx=ev.clientX-rect.left,my=ev.clientY-rect.top;var gx=Math.floor(mx/40)*40+20,gy=Math.floor(my/40)*40+20;if(nearPath(gx,gy,35))return;if(gold<50)return;for(var i=0;i<towers.length;i++){var dx=towers[i].x-gx,dy=towers[i].y-gy;if(Math.sqrt(dx*dx+dy*dy)<30)return}towers.push(makeTower(gx,gy));gold-=50});function moveEnemies(dt){for(var i=0;i<enemies.length;i++){var e=enemies[i];if(!e.alive)continue;if(e.wp>=path.length){e.alive=false;lives--;if(e.isBoss)lives=0;continue}var tx=path[e.wp].x,ty=path[e.wp].y;var dx=tx-e.x,dy=ty-e.y;var len=Math.sqrt(dx*dx+dy*dy);if(len<4){e.wp++}else{e.x+=dx/len*e.speed*dt;e.y+=dy/len*e.speed*dt}}}function drawTowers(){for(var i=0;i<towers.length;i++){var t=towers[i];ctx.beginPath();ctx.arc(t.x,t.y,t.range,0,Math.PI*2);ctx.fillStyle="rgba(96,165,250,0.06)";ctx.fill();var colors=["#60a5fa","#3b82f6","#2563eb"];ctx.fillStyle=colors[Math.min(t.level-1,2)];ctx.fillRect(t.x-15,t.y-15,30,30);if(t.level>1){ctx.fillStyle="#fff";for(var p=0;p<t.level-1;p++)ctx.fillRect(t.x-8+p*10,t.y+10,6,4)}}}function drawEnemies(){for(var i=0;i<enemies.length;i++){var e=enemies[i];if(!e.alive)continue;var r=e.isBoss?18:10;ctx.beginPath();ctx.arc(e.x,e.y,r,0,Math.PI*2);ctx.fillStyle=e.isBoss?"#c83cc8":"#e65046";ctx.fill();var bw=e.isBoss?36:20;var bh=4;var bx=e.x-bw/2,by=e.y-r-8;ctx.fillStyle="#611";ctx.fillRect(bx,by,bw,bh);ctx.fillStyle="#4ade80";ctx.fillRect(bx,by,bw*(e.hp/e.maxHp),bh)}}function drawBullets(){ctx.fillStyle="#facc15";for(var i=0;i<bullets.length;i++){var b=bullets[i];ctx.beginPath();ctx.arc(b.x,b.y,4,0,Math.PI*2);ctx.fill()}}function drawHud(){ctx.fillStyle="#fff";ctx.font="bold 14px monospace";ctx.textAlign="left";ctx.fillText("Gold: "+gold,10,20);ctx.fillText("Lives: "+lives,10,38);ctx.fillText("Wave: "+wave,10,56);if(toSpawn===0&&wave>0){var alive=0;for(var i=0;i<enemies.length;i++)if(enemies[i].alive)alive++;if(alive===0&&restTimer>0)ctx.fillText("Next wave in "+Math.ceil(restTimer)+"s",10,74)}}function fireTowers(dt){for(var i=0;i<towers.length;i++){var t=towers[i];t.cooldown-=dt;if(t.cooldown<=0){var target=nearestInRange(t);if(target){bullets.push({x:t.x,y:t.y,target:target,speed:340,damage:t.damage,dead:false});t.cooldown=t.maxCd}}}}function moveBullets(dt){for(var i=0;i<bullets.length;i++){var b=bullets[i];if(!b.target||!b.target.alive){b.dead=true;continue}var dx=b.target.x-b.x,dy=b.target.y-b.y;var len=Math.sqrt(dx*dx+dy*dy);if(len<8){b.target.hp-=b.damage;if(b.target.hp<=0){b.target.alive=false;gold+=b.target.bounty}b.dead=true}else{b.x+=dx/len*b.speed*dt;b.y+=dy/len*b.speed*dt}}bullets=bullets.filter(function(b){return!b.dead})}canvas.addEventListener("contextmenu",function(ev){ev.preventDefault();if(gameState!=="play")return;var rect=canvas.getBoundingClientRect();var mx=ev.clientX-rect.left,my=ev.clientY-rect.top;for(var i=0;i<towers.length;i++){var t=towers[i];var dx=t.x-mx,dy=t.y-my;if(Math.sqrt(dx*dx+dy*dy)<20){var cost=40*t.level;if(gold>=cost&&t.level<3){gold-=cost;t.level++;t.damage+=4;t.range+=25;t.maxCd*=0.8}break}}});var MAX_WAVE=5;function waveSystem(dt){var cleared=true;for(var i=0;i<enemies.length;i++)if(enemies[i].alive)cleared=false;if(toSpawn===0&&cleared){restTimer-=dt;if(restTimer<=0){wave++;if(wave>MAX_WAVE){gameState="won";return}toSpawn=4+wave*2;restTimer=5}}else if(toSpawn>0){spawnGap-=dt;if(spawnGap<=0){if(wave===MAX_WAVE&&toSpawn===1){enemies.push(makeEnemy(600,40,200,true))}else{enemies.push(makeEnemy(20+wave*8,70+wave*4,5+wave*2))}toSpawn--;spawnGap=0.8}}}document.addEventListener("keydown",function(ev){if(ev.code==="KeyR"&&gameState!=="play"){enemies=[];towers=[];bullets=[];gold=150;lives=20;wave=0;toSpawn=0;spawnGap=0;restTimer=3;gameState="play"}});function loop(ts){var dt=(ts-lastTime)/1000;if(dt>0.05)dt=0.05;lastTime=ts;if(gameState==="play"){waveSystem(dt);moveEnemies(dt);fireTowers(dt);moveBullets(dt);var _cb=new Blob(["// Check for defeat\nif (lives <= 0) {\n    gameState = \"lost\";\n}\n\n// Check for victory (all waves done,\n// no enemies alive)\nif (wave > MAX_WAVE) {\n    let cleared = true;\n    for (const e of enemies)\n        if (e.alive) cleared = false;\n    if (cleared)\n        gameState = \"won\";\n}"],{type:"text/javascript"});var _cu=URL.createObjectURL(_cb);var _cs=document.createElement("script");_cs.src=_cu;_cs.onload=function(){URL.revokeObjectURL(_cu);(function(){}ctx.fillStyle="#18281c";ctx.fillRect(0,0,600,400);drawPath();drawTowers();drawEnemies();drawBullets();drawHud();if(gameState==="won"){ctx.fillStyle="#4ade80";ctx.font="bold 36px monospace";ctx.textAlign="center";ctx.fillText("VICTORY!",300,180);ctx.font="18px monospace";ctx.fillStyle="#fff";ctx.fillText("Boss defeated! Press R to restart",300,220)}if(gameState==="lost"){ctx.fillStyle="#ef4444";ctx.font="bold 36px monospace";ctx.textAlign="center";ctx.fillText("DEFEAT",300,180);ctx.font="18px monospace";ctx.fillStyle="#fff";ctx.fillText("Wave "+wave+" - Press R to restart",300,220)}requestAnimationFrame(loop)}requestAnimationFrame(loop);})();};_cs.onerror=function(){URL.revokeObjectURL(_cu);(function(){}ctx.fillStyle="#18281c";ctx.fillRect(0,0,600,400);drawPath();drawTowers();drawEnemies();drawBullets();drawHud();if(gameState==="won"){ctx.fillStyle="#4ade80";ctx.font="bold 36px monospace";ctx.textAlign="center";ctx.fillText("VICTORY!",300,180);ctx.font="18px monospace";ctx.fillStyle="#fff";ctx.fillText("Boss defeated! Press R to restart",300,220)}if(gameState==="lost"){ctx.fillStyle="#ef4444";ctx.font="bold 36px monospace";ctx.textAlign="center";ctx.fillText("DEFEAT",300,180);ctx.font="18px monospace";ctx.fillStyle="#fff";ctx.fillText("Wave "+wave+" - Press R to restart",300,220)}requestAnimationFrame(loop)}requestAnimationFrame(loop);})();};document.head.appendChild(_cs);</script></body></html>
