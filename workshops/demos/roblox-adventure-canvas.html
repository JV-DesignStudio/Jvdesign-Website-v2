<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="UTF-8"><style>body{display:flex;flex-direction:column;align-items:center;background:#0d1117;padding:8px;margin:0;font-family:system-ui,sans-serif;color:#e8eaf2;gap:6px;overflow:hidden}canvas{background:#0a0e14;border:2px solid #1e2733;border-radius:8px;touch-action:none;max-width:100%}.row{display:flex;gap:12px;align-items:center;font-size:.8rem;flex-wrap:wrap}label{cursor:pointer}.dialogue-box{position:fixed;bottom:60px;left:50%;transform:translateX(-50%);background:rgba(15,23,42,.92);border:2px solid #38bdf8;border-radius:12px;padding:12px 18px;max-width:340px;text-align:center;font-size:.82rem;color:#e2e8f0;pointer-events:none;z-index:10;display:none}.dialogue-box .npc-name{color:#38bdf8;font-weight:700;margin-bottom:4px;font-size:.75rem}</style></head><body><div class="row"><span>Room: <b id="roomName">Village</b></span><span>Keys: <b id="keyCount">0</b>/3</span><span>Crystals: <b id="crystalCount">0</b>/5</span></div><canvas id="game" width="600" height="400"></canvas><div class="row" style="font-size:.7rem;opacity:.5">Arrow keys / WASD to move &middot; E to interact</div><div class="dialogue-box" id="dialogueBox"><div class="npc-name" id="npcName"></div><div id="npcText"></div></div><script>const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");const W=600,H=400,TILE=40,SPEED=2.5;let player={x:80,y:180,w:16,h:16,dir:"down"};let upHeld=false,downHeld=false,leftHeld=false,rightHeld=false,interactHeld=false;let currentRoom=0,keysCollected=0,crystalsCollected=0,won=false;let rooms=[{name:"Village",bg:"#1a2a1a",walls:[{x:0,y:0,w:600,h:20},{x:0,y:380,w:600,h:20},{x:0,y:0,w:20,h:400},{x:580,y:0,w:20,h:400},{x:200,y:0,w:20,h:160},{x:200,y:220,w:20,h:180},{x:400,y:0,w:20,h:280},{x:400,y:340,w:20,h:60}],doors:[{x:200,y:160,w:20,h:60,to:1,color:"#f6ad55"},{x:400,y:280,w:20,h:60,to:2,color:"#68d391"}],npcs:[{x:100,y:100,w:16,h:16,name:"Village Elder",lines:["Welcome, brave adventurer!","Our island is in danger.","Find the 3 Ancient Keys to open the Volcano Gate."],color:"#38bdf8"}],items:[],crystals:[]},{name:"Ruins",bg:"#1a1a2a",walls:[{x:0,y:0,w:600,h:20},{x:0,y:380,w:600,h:20},{x:0,y:0,w:20,h:400},{x:580,y:0,w:20,h:400},{x:160,y:100,w:20,h:200},{x:340,y:100,w:20,h:200}],doors:[{x:0,y:160,w:20,h:60,to:0,color:"#f6ad55"}],npcs:[],items:[{x:80,y:300,w:14,h:14,type:"key",id:"k1",collected:false,color:"#ecc94b"}],crystals:[{x:260,y:80,w:10,h:10,id:"c1",collected:false},{x:500,y:300,w:10,h:10,id:"c2",collected:false}]},{name:"Jungle",bg:"#0a2a1a",walls:[{x:0,y:0,w:600,h:20},{x:0,y:380,w:600,h:20},{x:0,y:0,w:20,h:400},{x:580,y:0,w:20,h:400},{x:120,y:0,w:20,h:260},{x:300,y:140,w:20,h:260},{x:460,y:0,w:20,h:260}],doors:[{x:580,y:160,w:20,h:60,to:0,color:"#68d391"},{x:300,y:380,w:60,h:20,to:3,color:"#b794f4",needKeys:3}],npcs:[{x:540,y:80,w:16,h:16,name:"Merchant",lines:["Looking for keys? Check the ruins and the jungle paths!","Crystals glow cyan, collect them all for bonus XP!"],color:"#f6ad55"}],items:[{x:60,y:340,w:14,h:14,type:"key",id:"k2",collected:false,color:"#ecc94b"},{x:540,y:340,w:14,h:14,type:"key",id:"k3",collected:false,color:"#ecc94b"}],crystals:[{x:200,y:60,w:10,h:10,id:"c3",collected:false},{x:400,y:300,w:10,h:10,id:"c4",collected:false},{x:550,y:200,w:10,h:10,id:"c5",collected:false}]},{name:"Volcano",bg:"#2a0a0a",walls:[{x:0,y:0,w:600,h:20},{x:0,y:380,w:600,h:20},{x:0,y:0,w:20,h:400},{x:580,y:0,w:20,h:400},{x:200,y:100,w:200,h:20},{x:200,y:280,w:200,h:20},{x:200,y:100,w:20,h:80},{x:380,y:200,w:20,h:80}],doors:[{x:300,y:0,w:60,h:20,to:2,color:"#b794f4"}],npcs:[],items:[],crystals:[]}];document.addEventListener("keydown",function(e){if(e.code==="ArrowUp"||e.code==="KeyW"){upHeld=true;e.preventDefault()}if(e.code==="ArrowDown"||e.code==="KeyS"){downHeld=true;e.preventDefault()}if(e.code==="ArrowLeft"||e.code==="KeyA")leftHeld=true;if(e.code==="ArrowRight"||e.code==="KeyD")rightHeld=true;if(e.code==="KeyE")interactHeld=true;});document.addEventListener("keyup",function(e){if(e.code==="ArrowUp"||e.code==="KeyW")upHeld=false;if(e.code==="ArrowDown"||e.code==="KeyS")downHeld=false;if(e.code==="ArrowLeft"||e.code==="KeyA")leftHeld=false;if(e.code==="ArrowRight"||e.code==="KeyD")rightHeld=false;if(e.code==="KeyE")interactHeld=false;});function movePlayer(){if(won)return;let nx=player.x,ny=player.y;if(upHeld){ny-=SPEED;player.dir="up"}if(downHeld){ny+=SPEED;player.dir="down"}if(leftHeld){nx-=SPEED;player.dir="left"}if(rightHeld){nx+=SPEED;player.dir="right"}let room=rooms[currentRoom];let blocked=false;for(let i=0;i<room.walls.length;i++){let w=room.walls[i];if(nx+player.w>w.x&&nx<w.x+w.w&&ny+player.h>w.y&&ny<w.y+w.h){blocked=true;break}}if(!blocked){player.x=nx;player.y=ny}if(player.x<0)player.x=0;if(player.x+player.w>W)player.x=W-player.w;if(player.y<0)player.y=0;if(player.y+player.h>H)player.y=H-player.h;}function checkDoors(){let room=rooms[currentRoom];for(let i=0;i<room.doors.length;i++){let d=room.doors[i];if(player.x+player.w>d.x&&player.x<d.x+d.w&&player.y+player.h>d.y&&player.y<d.y+d.h){if(d.needKeys&&keysCollected<d.needKeys)continue;currentRoom=d.to;player.x=W/2-player.w/2;player.y=H/2-player.h/2;document.getElementById("roomName").textContent=rooms[currentRoom].name;break;}}}function checkItems(){let room=rooms[currentRoom];for(let i=0;i<room.items.length;i++){let it=room.items[i];if(it.collected)continue;if(player.x+player.w>it.x&&player.x<it.x+it.w&&player.y+player.h>it.y&&player.y<it.y+it.h){it.collected=true;if(it.type==="key"){keysCollected++;document.getElementById("keyCount").textContent=keysCollected}}}for(let i=0;i<room.crystals.length;i++){let c=room.crystals[i];if(c.collected)continue;if(player.x+player.w>c.x&&player.x<c.x+c.w&&player.y+player.h>c.y&&player.y<c.y+c.h){c.collected=true;crystalsCollected++;document.getElementById("crystalCount").textContent=crystalsCollected;}}}let dialogueTimer=0,dialogueLines=[],dialogueLine=0,dialogueActive=false;function checkNPCs(){if(dialogueActive)return;if(!interactHeld)return;let room=rooms[currentRoom];for(let i=0;i<room.npcs.length;i++){let n=room.npcs[i];let dx=player.x+player.w/2-(n.x+n.w/2),dy=player.y+player.h/2-(n.y+n.h/2);if(Math.abs(dx)<40&&Math.abs(dy)<40){dialogueLines=n.lines;dialogueLine=0;dialogueActive=true;dialogueTimer=0;let db=document.getElementById("dialogueBox");db.style.display="block";document.getElementById("npcName").textContent=n.name;document.getElementById("npcText").textContent=dialogueLines[0];break;}}}function updateDialogue(){if(!dialogueActive)return;dialogueTimer++;if(dialogueTimer>120){dialogueLine++;dialogueTimer=0;if(dialogueLine>=dialogueLines.length){dialogueActive=false;document.getElementById("dialogueBox").style.display="none";}else{document.getElementById("npcText").textContent=dialogueLines[dialogueLine]}}}let touchStart=null;canvas.addEventListener("touchstart",function(e){touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY};e.preventDefault()});canvas.addEventListener("touchend",function(e){if(!touchStart)return;let dx=e.changedTouches[0].clientX-touchStart.x,dy=e.changedTouches[0].clientY-touchStart.y;if(Math.abs(dx)<10&&Math.abs(dy)<10){interactHeld=true;setTimeout(function(){interactHeld=false},150)}else if(Math.abs(dx)>Math.abs(dy)){if(dx>0){rightHeld=true;setTimeout(function(){rightHeld=false},200)}else{leftHeld=true;setTimeout(function(){leftHeld=false},200)}}else{if(dy>0){downHeld=true;setTimeout(function(){downHeld=false},200)}else{upHeld=true;setTimeout(function(){upHeld=false},200)}}touchStart=null});function draw(){let room=rooms[currentRoom];CWArt.bg(ctx,W,H,room.bg,room.bg==="rgba(0,0,0,0)"?"#0d0f1a":"#0a0e14");CWArt.grid(ctx,W,H,TILE);for(let i=0;i<room.walls.length;i++){let w=room.walls[i];ctx.fillStyle="rgba(100,116,139,.6)";ctx.fillRect(w.x,w.y,w.w,w.h);ctx.strokeStyle="rgba(148,163,184,.3)";ctx.lineWidth=1;ctx.strokeRect(w.x,w.y,w.w,w.h);}for(let i=0;i<room.doors.length;i++){let d=room.doors[i];ctx.save();ctx.shadowColor=d.color;ctx.shadowBlur=d.needKeys&&keysCollected<d.needKeys?4:14;ctx.fillStyle=d.needKeys&&keysCollected<d.needKeys?"rgba(120,120,120,.5)":d.color;ctx.fillRect(d.x,d.y,d.w,d.h);ctx.restore();if(d.needKeys&&keysCollected<d.needKeys){ctx.fillStyle="rgba(255,255,255,.7)";ctx.font="bold 8px system-ui";ctx.textAlign="center";ctx.fillText(keysCollected+"/"+d.needKeys,d.x+d.w/2,d.y+d.h/2+3)}}for(let i=0;i<room.items.length;i++){let it=room.items[i];if(it.collected)continue;ctx.save();ctx.shadowColor=it.color;ctx.shadowBlur=10+Math.sin(Date.now()/300)*4;ctx.fillStyle=it.color;ctx.fillRect(it.x,it.y,it.w,it.h);ctx.restore();ctx.fillStyle="rgba(255,255,255,.8)";ctx.font="bold 8px system-ui";ctx.textAlign="center";ctx.fillText("KEY",it.x+it.w/2,it.y-3);}for(let i=0;i<room.crystals.length;i++){let c=room.crystals[i];if(c.collected)continue;ctx.save();ctx.shadowColor="rgba(0,229,255,.9)";ctx.shadowBlur=8+Math.sin(Date.now()/250)*3;ctx.fillStyle="#00e5ff";ctx.beginPath();ctx.moveTo(c.x+c.w/2,c.y);ctx.lineTo(c.x+c.w,c.y+c.h/2);ctx.lineTo(c.x+c.w/2,c.y+c.h);ctx.lineTo(c.x,c.y+c.h/2);ctx.closePath();ctx.fill();ctx.restore();}for(let i=0;i<room.npcs.length;i++){let n=room.npcs[i];ctx.save();ctx.shadowColor=n.color;ctx.shadowBlur=8;ctx.fillStyle=n.color;ctx.fillRect(n.x,n.y,n.w,n.h);ctx.restore();ctx.fillStyle="#fff";ctx.fillRect(n.x+3,n.y+4,3,3);ctx.fillRect(n.x+10,n.y+4,3,3);ctx.fillStyle="rgba(255,255,255,.7)";ctx.font="bold 7px system-ui";ctx.textAlign="center";ctx.fillText(n.name,n.x+n.w/2,n.y-4);let dx=player.x+player.w/2-(n.x+n.w/2),dy=player.y+player.h/2-(n.y+n.h/2);if(Math.abs(dx)<40&&Math.abs(dy)<40){ctx.fillStyle="rgba(56,189,248,.7)";ctx.font="bold 8px system-ui";ctx.fillText("[E] Talk",n.x+n.w/2,n.y+n.h+10)}}if(currentRoom===3){let bx=260,by=150,bw=80,bh=80;ctx.save();ctx.shadowColor="rgba(239,68,68,.8)";ctx.shadowBlur=20+Math.sin(Date.now()/200)*8;ctx.fillStyle="#ef4444";ctx.fillRect(bx,by,bw,bh);ctx.restore();ctx.fillStyle="#fff";ctx.fillRect(bx+18,by+20,12,12);ctx.fillRect(bx+50,by+20,12,12);ctx.fillStyle="rgba(239,68,68,.9)";ctx.font="bold 10px system-ui";ctx.textAlign="center";ctx.fillText("VOLCANO BEAST",bx+bw/2,by-6);}ctx.save();ctx.shadowColor="rgba(99,179,237,.9)";ctx.shadowBlur=10;ctx.fillStyle="#63b3ed";ctx.fillRect(player.x,player.y,player.w,player.h);ctx.restore();ctx.fillStyle="#fff";if(player.dir==="down"||player.dir==="up"){ctx.fillRect(player.x+3,player.y+5,3,3);ctx.fillRect(player.x+10,player.y+5,3,3)}if(player.dir==="left"){ctx.fillRect(player.x+2,player.y+5,3,3);ctx.fillRect(player.x+8,player.y+5,3,3)}if(player.dir==="right"){ctx.fillRect(player.x+5,player.y+5,3,3);ctx.fillRect(player.x+11,player.y+5,3,3)}document.getElementById("keyCount").textContent=keysCollected;document.getElementById("crystalCount").textContent=crystalsCollected;document.getElementById("roomName").textContent=rooms[currentRoom].name;if(won){ctx.fillStyle="rgba(0,0,0,.65)";ctx.fillRect(0,0,W,H);ctx.fillStyle="#48bb78";ctx.font="bold 26px system-ui";ctx.textAlign="center";ctx.fillText("ISLAND QUEST COMPLETE!",W/2,H/2-30);ctx.fillStyle="#e8eaf2";ctx.font="16px system-ui";ctx.fillText("You defeated the Volcano Beast!",W/2,H/2+5);ctx.fillText("Keys: "+keysCollected+"/3  Crystals: "+crystalsCollected+"/5",W/2,H/2+30)}}try{function checkWin() {
  if (won) return;
  if (currentRoom === 3 && keysCollected >= 3) {
    let bx = 260, by = 150, bw = 80, bh = 80;
    if (player.x+player.w > bx && player.x < bx+bw &&
        player.y+player.h > by && player.y < by+bh) {
      won = true;
    }
  }
}}catch(e){}function loop(){movePlayer();checkDoors();checkItems();checkNPCs();updateDialogue();if(typeof checkWin==="function")checkWin();draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></body></html>
