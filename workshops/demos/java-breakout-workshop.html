<!DOCTYPE html><html><head>
<title>Finished build: java-breakout-workshop</title>
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="UTF-8"><style>body{display:flex;align-items:center;justify-content:center;background:#0f1220;margin:0;overflow:hidden}canvas{display:block}</style></head><body><canvas id="game" width="700" height="520"></canvas><script>const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");let padX=295,padW=110,padH=14,padY=470;let leftHeld=false,rightHeld=false;let bx=340,by=300,bs=14,bvx=4,bvy=-4;document.addEventListener("keydown",function(e){if(e.code==="ArrowLeft"||e.code==="KeyA")leftHeld=true;if(e.code==="ArrowRight"||e.code==="KeyD")rightHeld=true;e.preventDefault()});document.addEventListener("keyup",function(e){if(e.code==="ArrowLeft"||e.code==="KeyA")leftHeld=false;if(e.code==="ArrowRight"||e.code==="KeyD")rightHeld=false});const bricks=[];const rowColors=["#f87171","#fb923c","#facc15","#4ade80","#60a5fa"];for(let r=0;r<5;r++)for(let c=0;c<10;c++)bricks.push({r:r,c:c,alive:true,x:c*68+12,y:r*26+50,w:64,h:22});let lives=3,gameOver=false,won=false;let score=0;function loop(){if(!gameOver&&!won){if(leftHeld)padX-=7;if(rightHeld)padX+=7;padX=Math.max(0,Math.min(700-padW,padX));bx+=bvx;by+=bvy;if(bx<=0||bx+bs>=700)bvx=-bvx;if(by<=0)bvy=-bvy;if(bx+bs>padX&&bx<padX+padW&&by+bs>padY&&by+bs<padY+padH&&bvy>0){bvy=-bvy;var hit=(bx+bs/2)-(padX+padW/2);bvx=hit/12;if(bvx===0)bvx=1}for(const b of bricks){if(b.alive&&bx+bs>b.x&&bx<b.x+b.w&&by+bs>b.y&&by<b.y+b.h){b.alive=false;score+=(5-b.r)*10;bvy=-bvy;break}}if(by>520){lives--;bx=340;by=300;bvx=4;bvy=-4;if(lives<=0)gameOver=true}if(!gameOver){let alive=0;for(const b of bricks)if(b.alive)alive++;if(alive===0)won=true}}try{let alive = 0;
for (let i = 0; i < bricks.length; i++) {
    if (bricks[i].alive) alive++;
}
if (alive === 0) won = true;}catch(e){}ctx.fillStyle="#0f1220";ctx.fillRect(0,0,700,520);for(const b of bricks){if(b.alive){ctx.fillStyle=rowColors[b.r];ctx.fillRect(b.x,b.y,b.w,b.h)}}ctx.fillStyle="#ff7700";ctx.beginPath();ctx.roundRect(padX,padY,padW,padH,4);ctx.fill();ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(bx+bs/2,by+bs/2,bs/2,0,Math.PI*2);ctx.fill();ctx.fillStyle="#fff";ctx.font="bold 16px sans-serif";ctx.textAlign="left";ctx.fillText("Score: "+score,12,30);ctx.fillStyle="#ff7700";ctx.textAlign="right";for(let i=0;i<lives;i++)ctx.fillText("\u2764",688-i*22,30);if(gameOver||won){ctx.fillStyle="rgba(0,0,0,0.7)";ctx.fillRect(0,0,700,520);ctx.fillStyle=won?"#4ade80":"#f87171";ctx.font="bold 36px Fredoka,sans-serif";ctx.textAlign="center";ctx.fillText(won?"YOU WIN!":"GAME OVER",350,240);ctx.fillStyle="#fff";ctx.font="22px Fredoka,sans-serif";ctx.fillText("Score: "+score,350,280)}requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></body></html>
