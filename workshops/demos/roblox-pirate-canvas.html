<!DOCTYPE html><html><head>
<title>Finished build: roblox-pirate-canvas</title>
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="UTF-8"><style>body{display:flex;flex-direction:column;align-items:center;background:#0d1117;padding:8px;margin:0;font-family:system-ui,sans-serif;color:#e8eaf2;gap:6px;overflow:hidden}canvas{background:#0a0e14;border:2px solid #1e2733;border-radius:8px;touch-action:none;max-width:100%}.row{display:flex;gap:12px;align-items:center;font-size:.8rem;flex-wrap:wrap}label{cursor:pointer}</style></head><body><div class="row"><span>HP: <b id="hp">100</b></span><span>Gold: <b id="gold">0</b></span><span>Enemies: <b id="enemies">0</b></span></div><canvas id="game" width="600" height="400"></canvas><div class="row" style="font-size:.7rem;opacity:.5">Arrow keys to sail &middot; Space to fire cannons</div><script>const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");const W=600,H=400,TURN=0.04,THRUST=0.15,FRICTION=0.98,BALL_SPEED=6;let ship={x:300,y:300,w:20,h:32,angle:-Math.PI/2,speed:0,hp:100,alive:true};let gold=0,won=false,canFire=true,cooldown=0;let upHeld=false,downHeld=false,leftHeld=false,rightHeld=false,fireHeld=false;let cannonballs=[];let waves=[];for(let i=0;i<60;i++){waves.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*3+1,s:Math.random()*0.005+0.002})}document.addEventListener("keydown",function(e){if(e.code==="ArrowUp"||e.code==="KeyW")upHeld=true;if(e.code==="ArrowDown"||e.code==="KeyS")downHeld=true;if(e.code==="ArrowLeft"||e.code==="KeyA")leftHeld=true;if(e.code==="ArrowRight"||e.code==="KeyD")rightHeld=true;if(e.code==="Space"){fireHeld=true;e.preventDefault()}});document.addEventListener("keyup",function(e){if(e.code==="ArrowUp"||e.code==="KeyW")upHeld=false;if(e.code==="ArrowDown"||e.code==="KeyS")downHeld=false;if(e.code==="ArrowLeft"||e.code==="KeyA")leftHeld=false;if(e.code==="ArrowRight"||e.code==="KeyD")rightHeld=false;if(e.code==="Space")fireHeld=false;});let enemies=[];function spawnEnemy(){let side=Math.floor(Math.random()*4);let ex=0,ey=0;if(side===0){ex=Math.random()*W;ey=-30}else if(side===1){ex=W+30;ey=Math.random()*H}else if(side===2){ex=Math.random()*W;ey=H+30}else{ex=-30;ey=Math.random()*H}enemies.push({x:ex,y:ey,angle:0,speed:0.6+Math.random()*0.4,hp:30,fireCd:0});}for(let i=0;i<3;i++)spawnEnemy();let treasures=[];function spawnTreasures(){let spots=[{x:80,y:60},{x:520,y:80},{x:500,y:340},{x:60,y:350},{x:300,y:50}];for(let i=0;i<spots.length;i++){treasures.push({x:spots[i].x,y:spots[i].y,collected:false})}}spawnTreasures();function moveShip(){if(!ship.alive)return;if(leftHeld)ship.angle-=TURN;if(rightHeld)ship.angle+=TURN;if(upHeld)ship.speed+=THRUST;if(downHeld)ship.speed-=THRUST*0.5;ship.speed*=FRICTION;if(ship.speed>4)ship.speed=4;if(ship.speed<-1)ship.speed=-1;ship.x+=Math.cos(ship.angle)*ship.speed;ship.y+=Math.sin(ship.angle)*ship.speed;if(ship.x<0)ship.x=W;if(ship.x>W)ship.x=0;if(ship.y<0)ship.y=H;if(ship.y>H)ship.y=0;}function fireCannon(){if(!ship.alive||!canFire||!fireHeld)return;canFire=false;cooldown=30;cannonballs.push({x:ship.x,y:ship.y,dx:Math.cos(ship.angle)*BALL_SPEED,dy:Math.sin(ship.angle)*BALL_SPEED,life:80,fromPlayer:true});}function updateBalls(){for(let i=cannonballs.length-1;i>=0;i--){let b=cannonballs[i];b.x+=b.dx;b.y+=b.dy;b.life--;if(b.life<=0||b.x<-10||b.x>W+10||b.y<-10||b.y>H+10){cannonballs.splice(i,1)}}}function updateCooldown(){if(!canFire){cooldown--;if(cooldown<=0)canFire=true}}function moveEnemies(){for(let i=0;i<enemies.length;i++){let e=enemies[i];let dx=ship.x-e.x,dy=ship.y-e.y;e.angle=Math.atan2(dy,dx);e.x+=Math.cos(e.angle)*e.speed;e.y+=Math.sin(e.angle)*e.speed;if(e.fireCd>0){e.fireCd--}else{e.fireCd=90+Math.floor(Math.random()*60);cannonballs.push({x:e.x,y:e.y,dx:Math.cos(e.angle)*3,dy:Math.sin(e.angle)*3,life:60,fromPlayer:false})}}}function checkBallHits(){for(let i=cannonballs.length-1;i>=0;i--){let b=cannonballs[i];if(b.fromPlayer){for(let j=enemies.length-1;j>=0;j--){let e=enemies[j];let dx=b.x-e.x,dy=b.y-e.y;if(Math.sqrt(dx*dx+dy*dy)<18){e.hp-=15;cannonballs.splice(i,1);if(e.hp<=0){enemies.splice(j,1);gold+=10;spawnEnemy()}break}}}else{let dx=b.x-ship.x,dy=b.y-ship.y;if(Math.sqrt(dx*dx+dy*dy)<16){ship.hp-=10;cannonballs.splice(i,1);if(ship.hp<=0){ship.alive=false}}}}}function checkTreasure(){for(let i=0;i<treasures.length;i++){let t=treasures[i];if(!t.collected){let dx=ship.x-t.x,dy=ship.y-t.y;if(Math.sqrt(dx*dx+dy*dy)<20){t.collected=true;gold+=25}}}}let touchStart=null;canvas.addEventListener("touchstart",function(e){touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY};e.preventDefault()});canvas.addEventListener("touchend",function(e){if(!touchStart)return;let dx=e.changedTouches[0].clientX-touchStart.x,dy=e.changedTouches[0].clientY-touchStart.y;if(Math.abs(dx)<15&&Math.abs(dy)<15){fireHeld=true;setTimeout(function(){fireHeld=false},100)}else if(Math.abs(dy)>Math.abs(dx)){if(dy<0){upHeld=true;setTimeout(function(){upHeld=false},200)}else{downHeld=true;setTimeout(function(){downHeld=false},200)}}else{if(dx<0){leftHeld=true;setTimeout(function(){leftHeld=false},200)}else{rightHeld=true;setTimeout(function(){rightHeld=false},200)}}touchStart=null});function draw(){CWArt.bg(ctx,W,H,"#0c2340","#061428");for(let i=0;i<waves.length;i++){let w=waves[i];ctx.fillStyle="rgba(30,90,160,"+(0.2+Math.sin(Date.now()*w.s)*0.15)+")";ctx.beginPath();ctx.arc(w.x,w.y,w.r,0,Math.PI*2);ctx.fill()}for(let i=0;i<treasures.length;i++){let t=treasures[i];if(!t.collected){ctx.save();ctx.shadowColor="rgba(255,215,0,.9)";ctx.shadowBlur=14+Math.sin(Date.now()/300)*4;ctx.fillStyle="#ffd700";CWArt.roundRect(ctx,t.x-8,t.y-6,16,12,3);ctx.fill();ctx.fillStyle="#b8860b";ctx.fillRect(t.x-2,t.y-6,4,3);ctx.restore()}}for(let i=0;i<cannonballs.length;i++){let b=cannonballs[i];ctx.save();ctx.shadowColor=b.fromPlayer?"rgba(255,180,50,.9)":"rgba(255,80,80,.9)";ctx.shadowBlur=8;ctx.fillStyle=b.fromPlayer?"#ffa500":"#ff4444";ctx.beginPath();ctx.arc(b.x,b.y,3,0,Math.PI*2);ctx.fill();ctx.restore()}for(let i=0;i<enemies.length;i++){let e=enemies[i];ctx.save();ctx.translate(e.x,e.y);ctx.rotate(e.angle+Math.PI/2);ctx.shadowColor="rgba(255,80,80,.7)";ctx.shadowBlur=10;ctx.fillStyle="#8B0000";ctx.beginPath();ctx.moveTo(0,-14);ctx.lineTo(-8,12);ctx.lineTo(8,12);ctx.closePath();ctx.fill();ctx.fillStyle="#222";ctx.fillRect(-1,-10,2,16);ctx.fillStyle="rgba(60,60,60,.8)";ctx.fillRect(-5,-8,10,7);ctx.restore();ctx.fillStyle="rgba(255,80,80,.8)";ctx.fillRect(e.x-12,e.y-20,24*(e.hp/30),3);}if(ship.alive){ctx.save();ctx.translate(ship.x,ship.y);ctx.rotate(ship.angle+Math.PI/2);ctx.shadowColor="rgba(200,160,80,.8)";ctx.shadowBlur=12;ctx.fillStyle="#8B4513";ctx.beginPath();ctx.moveTo(0,-16);ctx.lineTo(-10,14);ctx.lineTo(10,14);ctx.closePath();ctx.fill();ctx.fillStyle="#fff";ctx.fillRect(-1,-12,2,18);ctx.fillStyle="rgba(255,255,255,.85)";ctx.fillRect(-6,-10,12,8);ctx.restore();}document.getElementById("hp").textContent=Math.max(0,ship.hp);document.getElementById("gold").textContent=gold;document.getElementById("enemies").textContent=enemies.length;if(!ship.alive&&!won){ctx.fillStyle="rgba(0,0,0,.65)";ctx.fillRect(0,0,W,H);ctx.fillStyle="#f56565";ctx.font="bold 26px system-ui";ctx.textAlign="center";ctx.fillText("SHIP SUNK!",W/2,H/2-10);ctx.fillStyle="#e8eaf2";ctx.font="14px system-ui";ctx.fillText("Gold collected: "+gold,W/2,H/2+20)}if(won){ctx.fillStyle="rgba(0,0,0,.65)";ctx.fillRect(0,0,W,H);ctx.fillStyle="#ffd700";ctx.font="bold 28px system-ui";ctx.textAlign="center";ctx.fillText("TREASURE FOUND!",W/2,H/2-20);ctx.fillStyle="#e8eaf2";ctx.font="16px system-ui";ctx.fillText("Gold: "+gold+" | Enemies sunk: "+(3-enemies.length+gold/10),W/2,H/2+15)}}try{function checkWin() {
  let allCollected = true;
  for (let i = 0; i < treasures.length; i++) {
    if (!treasures[i].collected) allCollected = false;
  }
  if (allCollected && gold >= 125 && !won) {
    won = true;
  }
}
}catch(e){}function loop(){if(!won){moveShip();fireCannon();updateBalls();updateCooldown();moveEnemies();checkBallHits();checkTreasure();if(typeof checkWin==="function")checkWin();}draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></body></html>
