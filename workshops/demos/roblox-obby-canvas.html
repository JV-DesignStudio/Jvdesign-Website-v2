<!DOCTYPE html><html><head>
<title>Finished build: roblox-obby-canvas</title>
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="UTF-8"><style>body{display:flex;flex-direction:column;align-items:center;background:#0d1117;padding:8px;margin:0;font-family:system-ui,sans-serif;color:#e8eaf2;gap:6px;overflow:hidden}canvas{background:#0a0e14;border:2px solid #1e2733;border-radius:8px;touch-action:none;max-width:100%}.row{display:flex;gap:12px;align-items:center;font-size:.8rem;flex-wrap:wrap}label{cursor:pointer}</style></head><body><div class="row"><span>Lives: <b id="lives">3</b></span><span>Time: <b id="timer">0s</b></span></div><canvas id="game" width="600" height="400"></canvas><div class="row" style="font-size:.7rem;opacity:.5">Arrow keys to move &middot; Space to jump</div><script>const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");const W=600,H=400,GRAVITY=0.5,JUMP=-10,SPEED=4;let player={x:40,y:100,w:16,h:24,vx:0,vy:0,onGround:false,alive:true};let lives=3,startTime=Date.now(),won=false;let leftHeld=false,rightHeld=false,jumpHeld=false;let platforms=[{x:20,y:300,w:80,h:12,color:"#718096",type:"start"},{x:140,y:280,w:40,h:10,color:"#63b3ed",type:"normal"},{x:220,y:260,w:30,h:10,color:"#68d391",type:"normal"},{x:300,y:240,w:50,h:10,color:"#f6ad55",type:"normal"},{x:380,y:220,w:30,h:10,color:"#fc8181",type:"normal"},{x:450,y:200,w:40,h:10,color:"#b794f4",type:"normal"},{x:530,y:180,w:60,h:12,color:"#48bb78",type:"finish"}];let lavaY=380;let movePlat1={x:200,y:230,w:50,h:10,color:"#ecc94b",type:"moving",baseX:200,range:60,speed:0.02,axis:"x"};let movePlat2={x:400,y:190,w:50,h:10,color:"#ecc94b",type:"moving",baseX:400,range:40,speed:0.025,axis:"x"};platforms.push(movePlat1,movePlat2);let jumpPad={x:340,y:250,w:30,h:8,color:"#00e5ff",type:"jumppad"};platforms.push(jumpPad);document.addEventListener("keydown",function(e){if(e.code==="ArrowLeft"||e.code==="KeyA")leftHeld=true;if(e.code==="ArrowRight"||e.code==="KeyD")rightHeld=true;if(e.code==="Space"||e.code==="ArrowUp"||e.code==="KeyW"){jumpHeld=true;e.preventDefault()}});document.addEventListener("keyup",function(e){if(e.code==="ArrowLeft"||e.code==="KeyA")leftHeld=false;if(e.code==="ArrowRight"||e.code==="KeyD")rightHeld=false;if(e.code==="Space"||e.code==="ArrowUp"||e.code==="KeyW")jumpHeld=false;});function respawn(){player.x=40;player.y=100;player.vx=0;player.vy=0;player.alive=true;player.onGround=false;}function movePlayer(){if(!player.alive)return;if(leftHeld)player.vx=-SPEED;else if(rightHeld)player.vx=SPEED;else player.vx*=0.8;if(jumpHeld&&player.onGround){player.vy=JUMP;player.onGround=false}player.vy+=GRAVITY;player.x+=player.vx;player.y+=player.vy;if(player.x<0)player.x=0;if(player.x+player.w>W)player.x=W-player.w;player.onGround=false;for(let i=0;i<platforms.length;i++){let p=platforms[i];if(player.vy>=0&&player.x+player.w>p.x&&player.x<p.x+p.w&&player.y+player.h>=p.y&&player.y+player.h<=p.y+p.h+player.vy+2){player.y=p.y-player.h;player.vy=0;player.onGround=true;if(p.type==="finish"&&!won){won=true}}}}function checkLava(){if(player.y+player.h>=lavaY&&player.alive){player.alive=false;lives--;document.getElementById("lives").textContent=lives;if(lives>0)setTimeout(respawn,800);}}function moveMovingPlatforms(){for(let i=0;i<platforms.length;i++){let p=platforms[i];if(p.type==="moving"){p.x=p.baseX+Math.sin(Date.now()*p.speed)*p.range}}}function checkJumpPad(){let p=jumpPad;if(player.alive&&player.vy>=0&&player.x+player.w>p.x&&player.x<p.x+p.w&&player.y+player.h>=p.y&&player.y+player.h<=p.y+p.h+player.vy+2){player.vy=-14;player.onGround=false;}}let touchStart=null;canvas.addEventListener("touchstart",function(e){touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY};e.preventDefault()});canvas.addEventListener("touchend",function(e){if(!touchStart)return;let dx=e.changedTouches[0].clientX-touchStart.x,dy=e.changedTouches[0].clientY-touchStart.y;if(Math.abs(dy)>20&&dy<0){jumpHeld=true;setTimeout(function(){jumpHeld=false},150)}else if(Math.abs(dx)>20){if(dx>0){rightHeld=true;setTimeout(function(){rightHeld=false},200)}else{leftHeld=true;setTimeout(function(){leftHeld=false},200)}}touchStart=null});function draw(){CWArt.bg(ctx,W,H,"#1a1c2e","#0d0f1a");CWArt.grid(ctx,W,H,40);ctx.save();ctx.shadowColor="rgba(245,101,101,.8)";ctx.shadowBlur=20;ctx.fillStyle="#f56565";ctx.fillRect(0,lavaY,W,H-lavaY);ctx.restore();for(let i=0;i<W;i+=20){let h=4+Math.sin((Date.now()/200)+i)*3;ctx.fillStyle="rgba(255,160,0,.6)";ctx.fillRect(i,lavaY-h,10,h)}for(let i=0;i<platforms.length;i++){let p=platforms[i];ctx.save();ctx.shadowColor=p.color;ctx.shadowBlur=p.type==="finish"?16:8;ctx.fillStyle=p.color;CWArt.roundRect(ctx,p.x,p.y,p.w,p.h,4);ctx.fill();ctx.restore();if(p.type==="start"){ctx.fillStyle="rgba(255,255,255,.7)";ctx.font="bold 9px system-ui";ctx.textAlign="center";ctx.fillText("START",p.x+p.w/2,p.y-4)}if(p.type==="finish"){ctx.fillStyle="rgba(72,187,120,.9)";ctx.font="bold 9px system-ui";ctx.textAlign="center";ctx.fillText("FINISH",p.x+p.w/2,p.y-4)}}let jp=jumpPad;ctx.save();ctx.shadowColor="rgba(0,229,255,.9)";ctx.shadowBlur=20+Math.sin(Date.now()/200)*6;ctx.fillStyle="#00e5ff";CWArt.roundRect(ctx,jp.x,jp.y,jp.w,jp.h,3);ctx.fill();ctx.restore();ctx.fillStyle="rgba(255,255,255,.8)";ctx.font="bold 7px system-ui";ctx.textAlign="center";ctx.fillText("JUMP",jp.x+jp.w/2,jp.y-3);if(player.alive){ctx.save();ctx.shadowColor="rgba(99,179,237,.9)";ctx.shadowBlur=12;ctx.fillStyle="#63b3ed";ctx.fillRect(player.x,player.y,player.w,player.h);ctx.restore();ctx.fillStyle="#fff";ctx.fillRect(player.x+4,player.y+6,4,4);ctx.fillRect(player.x+10,player.y+6,4,4);}document.getElementById("lives").textContent=lives;let elapsed=Math.floor((Date.now()-startTime)/1000);document.getElementById("timer").textContent=elapsed+"s";if(won){ctx.fillStyle="rgba(0,0,0,.6)";ctx.fillRect(0,0,W,H);ctx.fillStyle="#48bb78";ctx.font="bold 28px system-ui";ctx.textAlign="center";ctx.fillText("YOU FINISHED!",W/2,H/2-20);ctx.fillStyle="#e8eaf2";ctx.font="16px system-ui";ctx.fillText("Time: "+elapsed+"s",W/2,H/2+15)}}if (won) {
  ctx.fillStyle = "rgba(0,0,0,.6)";
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#48bb78";
  ctx.font = "bold 28px system-ui";
  ctx.textAlign = "center";
  ctx.fillText("YOU FINISHED!", W/2, H/2 - 20);
  ctx.fillStyle = "#e8eaf2";
  ctx.font = "16px system-ui";
  let elapsed = Math.floor((Date.now() - startTime) / 1000);
  ctx.fillText("Time: " + elapsed + "s", W/2, H/2 + 15);
}function loop(){moveMovingPlatforms();movePlayer();checkLava();checkJumpPad();draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></body></html>
