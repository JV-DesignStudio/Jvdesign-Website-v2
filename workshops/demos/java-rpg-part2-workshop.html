<!DOCTYPE html><html><head>
<title>Finished build: java-rpg-part2-workshop</title>
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="UTF-8"><style>body{margin:0;overflow:hidden;background:#14100c;font-family:Arial,sans-serif}canvas{display:block;cursor:pointer}</style></head><body><canvas id="game" width="500" height="400"></canvas><script>const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");let hero={name:"Aria",hp:30,maxHp:30,attack:5,level:1,xp:0,xpToLevel:25,gold:0,defending:false};function createMonster(type){if(type==="slime")return{name:"Slime",hp:12,maxHp:12,attack:3,xpReward:8,goldReward:5,color:"#4ade80"};if(type==="wolf")return{name:"Wolf",hp:20,maxHp:20,attack:5,xpReward:15,goldReward:12,color:"#60a5fa"};if(type==="goblin")return{name:"Goblin",hp:28,maxHp:28,attack:7,xpReward:25,goldReward:20,color:"#a78bfa"};return createMonster("slime");}let monster=createMonster("slime");let battleLog="A wild "+monster.name+" appears!";let battleOver=false;let resultMsg="";let dmgText="";let dmgTimer=0;let dmgX=0;let dmgY=0;function monsterAttack(){if(monster.hp<=0)return;let dmg=monster.attack+Math.floor(Math.random()*3);if(hero.defending){dmg=Math.floor(dmg/2);hero.defending=false;}hero.hp=Math.max(0,hero.hp-dmg);battleLog+="  "+monster.name+" hits for "+dmg+"!";dmgText="-"+dmg;dmgX=60;dmgY=130;dmgTimer=30;if(hero.hp<=0){battleOver=true;resultMsg="Defeat! You fell in battle.";}}function gainXp(amount){hero.xp+=amount;while(hero.xp>=hero.xpToLevel){hero.xp-=hero.xpToLevel;hero.level++;hero.maxHp+=6;hero.attack+=2;hero.hp=hero.maxHp;hero.xpToLevel=hero.level*25;resultMsg+=" Level Up! Lv"+hero.level;}}function checkVictory(){if(monster.hp<=0){battleOver=true;resultMsg="Victory! +"+monster.xpReward+" XP, +"+monster.goldReward+" Gold";hero.gold+=monster.goldReward;gainXp(monster.xpReward);}}function respawn(){hero.hp=Math.floor(hero.maxHp/2);hero.gold=Math.floor(hero.gold/2);hero.defending=false;}try{hero.hp = hero.maxHp / 2;
hero.gold = hero.gold / 2;
hero.defending = false;

// Balance numbers to tune:
// encounter rate: 0.15
// potion heal: 12
// defend: halves damage
// flee odds: 0.6
}catch(e){}canvas.addEventListener("click",function(e){var rect=canvas.getBoundingClientRect();var mx=(e.clientX-rect.left)*(500/rect.width);var my=(e.clientY-rect.top)*(400/rect.height);if(battleOver){if(resultMsg.indexOf("Defeat")!==-1){respawn();}var types=["slime","wolf","goblin"];monster=createMonster(types[Math.floor(Math.random()*3)]);battleLog="A wild "+monster.name+" appears!";battleOver=false;resultMsg="";return;}if(my>=310&&my<=346){if(mx>=20&&mx<=125){let dmg=hero.attack+Math.floor(Math.random()*4)-1;monster.hp=Math.max(0,monster.hp-dmg);battleLog="You hit "+monster.name+" for "+dmg+"!";dmgText="-"+dmg;dmgX=395;dmgY=100;dmgTimer=30;checkVictory();if(!battleOver){monsterAttack()}}else if(mx>=140&&mx<=245){hero.defending=true;battleLog="You brace behind your shield.";monsterAttack()}else if(mx>=260&&mx<=365){if(hero.hp<hero.maxHp){hero.hp=Math.min(hero.maxHp,hero.hp+12);battleLog="Glug! Potion heals 12 HP!";monsterAttack()}else{battleLog="Already at full HP!"}}else if(mx>=380&&mx<=485){if(Math.random()<0.6){battleLog="You fled to safety!";battleOver=true;resultMsg="Escaped!"}else{battleLog="Could not escape!";monsterAttack()}}}});function draw(){ctx.fillStyle="#14100c";ctx.fillRect(0,0,500,400);ctx.fillStyle="#1a1520";ctx.fillRect(0,0,500,60);ctx.fillStyle="rgba(255,255,255,0.05)";ctx.fillRect(0,280,500,120);ctx.fillStyle="#ff7700";ctx.fillRect(30,130,60,80);ctx.fillStyle="#fff";ctx.font="bold 14px Arial";ctx.textAlign="left";ctx.fillText(hero.name,20,100);ctx.fillStyle="#333";ctx.fillRect(20,108,100,12);ctx.fillStyle="#06d6a0";ctx.fillRect(20,108,Math.max(0,100*hero.hp/hero.maxHp),12);ctx.fillStyle="#fff";ctx.font="11px Arial";ctx.fillText(hero.hp+"/"+hero.maxHp+" HP",22,118);ctx.fillText("Lv "+hero.level,20,240);ctx.fillStyle=monster.color;ctx.fillRect(350,100,90,80);ctx.fillStyle="#fff";ctx.font="bold 14px Arial";ctx.textAlign="right";ctx.fillText(monster.name,440,90);ctx.fillStyle="#333";ctx.fillRect(340,195,100,12);ctx.fillStyle="#ef4444";ctx.fillRect(340,195,Math.max(0,100*monster.hp/monster.maxHp),12);ctx.fillStyle="#fff";ctx.font="11px Arial";ctx.fillText(monster.hp+"/"+monster.maxHp+" HP",342,205);ctx.fillStyle="rgba(0,0,0,0.3)";ctx.fillRect(370,120,12,12);ctx.fillRect(408,120,12,12);ctx.fillRect(375,150,40,8);ctx.fillStyle="#ffd166";ctx.font="13px Arial";ctx.textAlign="center";ctx.fillText(battleLog,250,270);if(!battleOver){ctx.fillStyle="#2d2040";ctx.fillRect(20,310,105,36);ctx.fillRect(140,310,105,36);ctx.fillRect(260,310,105,36);ctx.fillRect(380,310,105,36);ctx.strokeStyle="#a78bfa";ctx.lineWidth=1;ctx.strokeRect(20,310,105,36);ctx.strokeRect(140,310,105,36);ctx.strokeRect(260,310,105,36);ctx.strokeRect(380,310,105,36);ctx.fillStyle="#fff";ctx.font="bold 13px Arial";ctx.textAlign="center";ctx.fillText("Attack",72,333);ctx.fillText("Defend",192,333);ctx.fillText("Potion",312,333);ctx.fillText("Flee",432,333);}ctx.fillStyle="#fff";ctx.font="11px Arial";ctx.textAlign="left";ctx.fillText("XP: "+hero.xp+"/"+hero.xpToLevel,20,380);ctx.fillStyle="#333";ctx.fillRect(20,384,120,8);ctx.fillStyle="#f59e0b";ctx.fillRect(20,384,Math.max(0,120*hero.xp/hero.xpToLevel),8);ctx.fillText("Gold: "+hero.gold,160,380);if(dmgTimer>0){ctx.fillStyle="rgba(255,100,100,"+(dmgTimer/30)+")";ctx.font="bold 20px Arial";ctx.textAlign="center";ctx.fillText(dmgText,dmgX,dmgY-30+dmgTimer);dmgTimer-=0.5;}if(battleOver){ctx.fillStyle="rgba(0,0,0,0.6)";ctx.fillRect(0,0,500,400);ctx.fillStyle=resultMsg.indexOf("Victory")!==-1?"#ffd166":"#ef4444";ctx.font="bold 28px Arial";ctx.textAlign="center";ctx.fillText(resultMsg,250,180);ctx.fillStyle="#fff";ctx.font="14px Arial";ctx.fillText("Click to fight again",250,220);}requestAnimationFrame(draw)}draw();</script></body></html>
