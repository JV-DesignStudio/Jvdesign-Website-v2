<!DOCTYPE html><html><head>
<title>Finished build: roblox-horror-canvas</title>
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="UTF-8"><style>body{display:flex;flex-direction:column;align-items:center;background:#000;padding:8px;margin:0;font-family:system-ui,sans-serif;color:#e8eaf2;gap:6px;overflow:hidden}canvas{background:#000;border:2px solid #1a0a2e;border-radius:8px;touch-action:none;max-width:100%}.row{display:flex;gap:12px;align-items:center;font-size:.8rem;flex-wrap:wrap}label{cursor:pointer}</style></head><body><div class="row"><span>Keys: <b id="keys">0/3</b></span><span>Timer: <b id="timer">3:00</b></span></div><canvas id="game" width="600" height="400"></canvas><div class="row" style="font-size:.7rem;opacity:.5">Arrow keys to move &middot; Collect keys, avoid ghost, find door</div><script>const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");const W=600,H=400,SPEED=3;let player={x:50,y:50,w:14,h:14,vx:0,vy:0,alive:true};let keysCollected=0,totalKeys=3,won=false,gameOver=false;let timeLeft=180,lastTick=Date.now();let leftHeld=false,rightHeld=false,upHeld=false,downHeld=false;let mouseX=W/2,mouseY=H/2;let walls=[{x:0,y:0,w:W,h:4},{x:0,y:H-4,w:W,h:4},{x:0,y:0,w:4,h:H},{x:W-4,y:0,w:4,h:H},{x:80,y:0,w:4,h:120},{x:160,y:60,w:4,h:180},{x:0,y:180,w:120,h:4},{x:240,y:0,w:4,h:140},{x:160,y:240,w:160,h:4},{x:320,y:60,w:4,h:120},{x:320,y:180,w:140,h:4},{x:400,y:0,w:4,h:130},{x:480,y:100,w:4,h:200},{x:400,y:280,w:120,h:4},{x:240,y:140,w:80,h:4},{x:80,y:280,w:4,h:120},{x:80,y:320,w:80,h:4},{x:240,y:320,w:4,h:80},{x:320,y:340,w:100,h:4},{x:540,y:200,w:4,h:100},];let items=[{x:130,y:100,w:10,h:10,type:"key",collected:false},{x:360,y:100,w:10,h:10,type:"key",collected:false},{x:200,y:350,w:10,h:10,type:"key",collected:false}];let door={x:550,y:350,w:20,h:30,locked:true};let ghost={x:300,y:200,w:16,h:16,speed:1.5,active:true};let ghostFlicker=0;document.addEventListener("keydown",function(e){if(e.code==="ArrowLeft"||e.code==="KeyA")leftHeld=true;if(e.code==="ArrowRight"||e.code==="KeyD")rightHeld=true;if(e.code==="ArrowUp"||e.code==="KeyW"){upHeld=true;e.preventDefault()}if(e.code==="ArrowDown"||e.code==="KeyS")downHeld=true;});document.addEventListener("keyup",function(e){if(e.code==="ArrowLeft"||e.code==="KeyA")leftHeld=false;if(e.code==="ArrowRight"||e.code==="KeyD")rightHeld=false;if(e.code==="ArrowUp"||e.code==="KeyW")upHeld=false;if(e.code==="ArrowDown"||e.code==="KeyS")downHeld=false;});canvas.addEventListener("mousemove",function(e){let r=canvas.getBoundingClientRect();mouseX=e.clientX-r.left;mouseY=e.clientY-r.top;});function drawDarkness(){ctx.fillStyle="#000";ctx.fillRect(0,0,W,H);}function drawFlashlight(){let cx=player.x+player.w/2,cy=player.y+player.h/2;let dx=mouseX-cx,dy=mouseY-cy;let angle=Math.atan2(dy,dx);let spread=0.4,radius=160;ctx.save();ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,radius,angle-spread,angle+spread);ctx.closePath();ctx.clip();ctx.fillStyle="#1a1a2e";ctx.fillRect(0,0,W,H);CWArt.grid(ctx,W,H,40);drawWalls();drawItems();drawDoor();if(typeof drawGhost==="function")drawGhost();drawPlayer();ctx.restore();let glow=ctx.createRadialGradient(cx,cy,0,cx,cy,40);glow.addColorStop(0,"rgba(255,220,160,.12)");glow.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=glow;ctx.fillRect(cx-40,cy-40,80,80);}function drawWalls(){ctx.fillStyle="#3a3a5c";for(let i=0;i<walls.length;i++){let w=walls[i];ctx.fillRect(w.x,w.y,w.w,w.h);}}function drawItems(){for(let i=0;i<items.length;i++){let it=items[i];if(it.collected)continue;ctx.save();ctx.shadowColor="rgba(255,220,50,.9)";ctx.shadowBlur=12+Math.sin(Date.now()/200)*4;ctx.fillStyle="#ffd700";ctx.fillRect(it.x,it.y,it.w,it.h);ctx.restore();ctx.fillStyle="#fff";ctx.font="bold 8px system-ui";ctx.textAlign="center";ctx.fillText("KEY",it.x+it.w/2,it.y-3);}}function drawDoor(){ctx.save();if(door.locked){ctx.shadowColor="rgba(255,60,60,.8)";ctx.fillStyle="#e53e3e";}else{ctx.shadowColor="rgba(72,187,120,.8)";ctx.fillStyle="#48bb78";}ctx.shadowBlur=16;CWArt.roundRect(ctx,door.x,door.y,door.w,door.h,4);ctx.fill();ctx.restore();ctx.fillStyle="#fff";ctx.font="bold 8px system-ui";ctx.textAlign="center";ctx.fillText(door.locked?"LOCKED":"EXIT",door.x+door.w/2,door.y-4);}function drawPlayer(){if(!player.alive)return;ctx.save();ctx.shadowColor="rgba(255,220,160,.7)";ctx.shadowBlur=10;ctx.fillStyle="#63b3ed";ctx.fillRect(player.x,player.y,player.w,player.h);ctx.restore();ctx.fillStyle="#fff";ctx.fillRect(player.x+3,player.y+3,3,3);ctx.fillRect(player.x+9,player.y+3,3,3);}function drawGhost(){if(!ghost.active)return;ghostFlicker=Math.sin(Date.now()/100)*0.3+0.5;ctx.save();ctx.globalAlpha=ghostFlicker;ctx.shadowColor="rgba(200,180,255,.9)";ctx.shadowBlur=20;ctx.fillStyle="#c8b4ff";ctx.beginPath();ctx.arc(ghost.x+ghost.w/2,ghost.y+ghost.h/2,ghost.w/2+2,0,Math.PI*2);ctx.fill();ctx.fillStyle="rgba(0,0,0,.6)";ctx.fillRect(ghost.x+4,ghost.y+4,3,4);ctx.fillRect(ghost.x+10,ghost.y+4,3,4);ctx.restore();}function movePlayer(){if(!player.alive||won||gameOver)return;let nx=player.x,ny=player.y;if(leftHeld)nx-=SPEED;if(rightHeld)nx+=SPEED;if(upHeld)ny-=SPEED;if(downHeld)ny+=SPEED;let blocked=false;for(let i=0;i<walls.length;i++){let w=walls[i];if(nx<w.x+w.w&&nx+player.w>w.x&&ny<w.y+w.h&&ny+player.h>w.y){blocked=true;break}}if(!blocked){player.x=nx;player.y=ny;}}function collectKeys(){for(let i=0;i<items.length;i++){let it=items[i];if(it.collected)continue;if(player.x<it.x+it.w&&player.x+player.w>it.x&&player.y<it.y+it.h&&player.y+player.h>it.y){it.collected=true;keysCollected++;if(keysCollected>=totalKeys)door.locked=false;}}}function checkDoor(){if(door.locked)return;if(player.x<door.x+door.w&&player.x+player.w>door.x&&player.y<door.y+door.h&&player.y+player.h>door.y){won=true;}}function moveGhost(){if(!ghost.active||!player.alive||won||gameOver)return;let dx=player.x-ghost.x,dy=player.y-ghost.y;let dist=Math.sqrt(dx*dx+dy*dy);if(dist>1){ghost.x+=dx/dist*ghost.speed;ghost.y+=dy/dist*ghost.speed;}if(dist<12){player.alive=false;setTimeout(function(){player.x=50;player.y=50;player.alive=true;ghost.x=300;ghost.y=200;},1200);}}function drawHud(){document.getElementById("keys").textContent=keysCollected+"/"+totalKeys;let mins=Math.floor(timeLeft/60),secs=timeLeft%60;let tEl=document.getElementById("timer");tEl.textContent=mins+":"+(secs<10?"0":"")+secs;if(timeLeft<=30)tEl.style.color="#f56565";if(won){ctx.fillStyle="rgba(0,0,0,.7)";ctx.fillRect(0,0,W,H);ctx.fillStyle="#48bb78";ctx.font="bold 28px system-ui";ctx.textAlign="center";ctx.fillText("YOU ESCAPED!",W/2,H/2-20);ctx.fillStyle="#e8eaf2";ctx.font="16px system-ui";ctx.fillText("Keys: "+keysCollected+"/"+totalKeys,W/2,H/2+15);}if(gameOver&&!won){ctx.fillStyle="rgba(0,0,0,.7)";ctx.fillRect(0,0,W,H);ctx.fillStyle="#f56565";ctx.font="bold 28px system-ui";ctx.textAlign="center";ctx.fillText("TIME'S UP!",W/2,H/2-20);ctx.fillStyle="#e8eaf2";ctx.font="16px system-ui";ctx.fillText("The ghost got you...",W/2,H/2+15);}}let touchStart=null;canvas.addEventListener("touchstart",function(e){touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY};e.preventDefault()});canvas.addEventListener("touchend",function(e){if(!touchStart)return;let dx=e.changedTouches[0].clientX-touchStart.x,dy=e.changedTouches[0].clientY-touchStart.y;if(Math.abs(dx)>Math.abs(dy)){if(dx>0){rightHeld=true;setTimeout(function(){rightHeld=false},200)}else{leftHeld=true;setTimeout(function(){leftHeld=false},200)}}else{if(dy<0){upHeld=true;setTimeout(function(){upHeld=false},200)}else{downHeld=true;setTimeout(function(){downHeld=false},200)}}touchStart=null});function draw(){drawDarkness();drawFlashlight();drawHud();}function updateTimer() {
  let now = Date.now();
  if (now - lastTick >= 1000 && !won && !gameOver && player.alive) {
    timeLeft--;
    lastTick = now;
    if (timeLeft <= 0) {
      gameOver = true;
      timeLeft = 0;
    }
  }
}function loop(){movePlayer();collectKeys();checkDoor();moveGhost();if(typeof updateTimer==="function")updateTimer();draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></body></html>
