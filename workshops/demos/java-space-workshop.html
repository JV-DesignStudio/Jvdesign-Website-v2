<!DOCTYPE html><html><head>
<title>Finished build: java-space-workshop</title>
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="UTF-8"><style>body{display:flex;flex-direction:column;align-items:center;background:#0a0c1a;margin:0;overflow:hidden}canvas{display:block;cursor:pointer}</style></head><body><canvas id="game" width="600" height="500"></canvas><script>const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");let shipX=280,shipW=40,shipH=30,shipSpeed=6;let leftHeld=false,rightHeld=false,spaceHeld=false;document.addEventListener("keydown",function(e){if(e.code==="ArrowLeft"||e.code==="KeyA")leftHeld=true;if(e.code==="ArrowRight"||e.code==="KeyD")rightHeld=true;if(e.code==="Space")spaceHeld=true;e.preventDefault()});document.addEventListener("keyup",function(e){if(e.code==="ArrowLeft"||e.code==="KeyA")leftHeld=false;if(e.code==="ArrowRight"||e.code==="KeyD")rightHeld=false;if(e.code==="Space")spaceHeld=false});let bullets=[];let fireCooldown=0;let aliens=[];let alienDir=1;let alienSpeed=2;let score=0;let wave=1;let lives=3;let gameOver=false;function spawnAliens(){aliens=[];for(let r=0;r<4;r++)for(let c=0;c<6;c++)aliens.push({x:60+c*80,y:50+r*50,w:36,h:26,alive:true})}spawnAliens();const stars=[];for(let i=0;i<60;i++)stars.push({x:Math.random()*600,y:Math.random()*500,s:Math.random()*2+0.5});canvas.addEventListener("click",function(){if(gameOver){gameOver=false;score=0;wave=1;lives=3;alienSpeed=2;alienDir=1;bullets=[];spawnAliens()}});function loop(){if(gameOver){ctx.fillStyle="rgba(0,0,0,0.7)";ctx.fillRect(0,0,600,500);ctx.fillStyle="#fff";ctx.font="bold 44px sans-serif";ctx.textAlign="center";ctx.fillText("GAME OVER",300,220);ctx.font="bold 20px sans-serif";ctx.fillText("Score: "+score+"   Wave: "+wave,300,260);ctx.fillText("Click to restart",300,300);ctx.textAlign="left";return}if(leftHeld)shipX-=shipSpeed;if(rightHeld)shipX+=shipSpeed;if(shipX<0)shipX=0;if(shipX+shipW>600)shipX=600-shipW;if(fireCooldown>0)fireCooldown--;if(spaceHeld&&fireCooldown<=0){bullets.push({x:shipX+shipW/2-2,y:448,w:4,h:12});fireCooldown=10}for(let i=bullets.length-1;i>=0;i--){bullets[i].y-=9;if(bullets[i].y+bullets[i].h<0)bullets.splice(i,1)}let hitWall=false;for(const a of aliens){if(!a.alive)continue;if(a.x+alienDir*alienSpeed<0||a.x+a.w+alienDir*alienSpeed>600)hitWall=true}if(hitWall){alienDir=-alienDir;for(const a of aliens){if(a.alive)a.y+=14}}else{for(const a of aliens){if(a.alive)a.x+=alienDir*alienSpeed}}for(let bi=bullets.length-1;bi>=0;bi--){let b=bullets[bi];for(const a of aliens){if(a.alive&&b.x+b.w>a.x&&b.x<a.x+a.w&&b.y+b.h>a.y&&b.y<a.y+a.h){a.alive=false;bullets.splice(bi,1);score+=20*wave;break}}}if(aliens.every(function(a){return!a.alive})){wave++;alienSpeed=2+wave;spawnAliens()}try{// Check if any alien reached the ship line
for (let i = 0; i < aliens.length; i++) {
    if (aliens[i].alive && aliens[i].y + aliens[i].h > 450) {
        gameOver = true;
    }
}

// Lose a life instead of instant game over
if (gameOver) {
    lives--;
    if (lives > 0) {
        gameOver = false;
        spawnAliens();
    }
}}catch(e){}ctx.fillStyle="#0a0c1a";ctx.fillRect(0,0,600,500);ctx.fillStyle="rgba(255,255,255,0.7)";for(const s of stars){ctx.fillRect(s.x,s.y,s.s,s.s)}ctx.fillStyle="#a358f5";for(const a of aliens){if(a.alive)ctx.fillRect(a.x,a.y,a.w,a.h)}ctx.fillStyle="#facc15";for(const b of bullets){ctx.fillRect(b.x,b.y,b.w,b.h)}ctx.fillStyle="#4dd9e0";ctx.beginPath();ctx.moveTo(shipX+shipW/2,450);ctx.lineTo(shipX,450+shipH);ctx.lineTo(shipX+shipW,450+shipH);ctx.closePath();ctx.fill();ctx.fillStyle="#fff";ctx.font="bold 18px sans-serif";ctx.textAlign="left";ctx.fillText("Score: "+score,10,24);ctx.fillText("Wave: "+wave,10,46);ctx.textAlign="right";ctx.fillStyle="#4dd9e0";for(var hi=0;hi<lives;hi++){ctx.fillText("\u2764",590-hi*22,24)}ctx.textAlign="left";requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></body></html>
