llRect(e.x-12,e.y-16,24*(e.hp/e.maxHp),4);ctx.strokeStyle="#225522";ctx.strokeRect(e.x-12,e.y-16,24,4)}}function drawTowers(){for(var i=0;i<towers.length;i++){var t=towers[i];ctx.fillStyle="#60a5fa";ctx.fillRect(t.x-15,t.y-15,30,30);ctx.strokeStyle="#3b82f6";ctx.strokeRect(t.x-15,t.y-15,30,30)}}function drawRanges(){for(var i=0;i<towers.length;i++){var t=towers[i];var dx=mouseX-t.x,dy=mouseY-t.y;if(Math.sqrt(dx*dx+dy*dy)<30){ctx.beginPath();ctx.arc(t.x,t.y,t.range,0,6.28);ctx.fillStyle="rgba(96,165,250,0.1)";ctx.fill();ctx.strokeStyle="rgba(96,165,250,0.3)";ctx.stroke()}}}function nearestInRange(t){var best=null,bestDist=t.range*t.range;for(var i=0;i<enemies.length;i++){var e=enemies[i];if(!e.alive)continue;var dx=e.x-t.x,dy=e.y-t.y;var d2=dx*dx+dy*dy;if(d2<=bestDist){bestDist=d2;best=e}}return best}var lastTime=performance.now();var _cb=new Blob(["window.cwStep=function(){// Enemy escaped past last waypoint\nif (e.wp >= path.length && e.alive) {\n    e.alive = false;\n    lives--;\n}\n\n// Game over check\nif (lives <= 0) {\n    gameState = \"over\";\n}};"],{type:"text/javascript"});var _cu=URL.createObjectURL(_cb);var _cs=document.createElement("script");_cs.src=_cu;_cs.onload=function(){URL.revokeObjectURL(_cu);(function(){function loop(){var now=performance.now(),dt=(now-lastTime)/1000;lastTime=now;if(dt>0.05)dt=0.05;spawnTimer-=dt;if(spawnTimer<=0&&toSpawn>0){spawnEnemy();toSpawn--;spawnTimer=spawnInterval}updateEnemies(dt);if(mouseDown){var gx=Math.floor(mouseX/40)*40,gy=Math.floor(mouseY/40)*40;if(!nearPath(gx+20,gy+20,30)&&!occupied(gx,gy)&&gold>=TOWER_COST){towers.push({x:gx+20,y:gy+20,gx:gx,gy:gy,range:110,damage:5,cooldown:0});gold-=TOWER_COST}mouseDown=false}for(var ti=0;ti<towers.length;ti++){var t=towers[ti];t.cooldown-=dt;if(t.cooldown<=0){var target=nearestInRange(t);if(target){target.hp-=t.damage;if(target.hp<=0){target.alive=false;gold+=target.bounty}t.cooldown=0.7}}}if(window.cwStep)cwStep();ctx.fillStyle="#2d5a27";ctx.fillRect(0,0,600,400);ctx.strokeStyle="#c2b280";ctx.lineWidth=36;ctx.lineCap="round";ctx.lineJoin="round";ctx.beginPath();ctx.moveTo(path[0].x,path[0].y);for(var pi=1;pi<path.length;pi++){ctx.lineTo(path[pi].x,path[pi].y)}ctx.stroke();drawEnemies();drawTowers();drawRanges();var gx=Math.floor(mouseX/40)*40,gy=Math.floor(mouseY/40)*40;var blocked=nearPath(gx+20,gy+20,30)||occupied(gx,gy);ctx.globalAlpha=0.45;ctx.fillStyle=blocked?"#f87171":"#06d6a0";ctx.fillRect(gx+2,gy+2,36,36);ctx.globalAlpha=1;ctx.fillStyle="#ffd166";ctx.font="bold 16px monospace";ctx.textAlign="left";ctx.fillText("Gold: "+gold,10,22);ctx.fillStyle=lives<=5?"#f87171":"#4ade80";ctx.fillText("Lives: "+lives,10,44);ctx.fillStyle="#c4b5fd";ctx.fillText("Wave: "+wave,10,66);if(lives<=0){ctx.fillStyle="rgba(0,0,0,0.7)";ctx.fillRect(0,0,600,400);ctx.fillStyle="#f87171";ctx.font="bold 36px monospace";ctx.textAlign="center";ctx.fillText("GAME OVER",300,190);ctx.fillStyle="#fff";ctx.font="18px monospace";ctx.fillText("The enemies broke through!",300,230)}requestAnimationFrame(loop)}requestAnimationFrame(loop);})();};_cs.onerror=function(){URL.revokeObjectURL(_cu);(function(){function loop(){var now=performance.now(),dt=(now-lastTime)/1000;lastTime=now;if(dt>0.05)dt=0.05;spawnTimer-=dt;if(spawnTimer<=0&&toSpawn>0){spawnEnemy();toSpawn--;spawnTimer=spawnInterval}updateEnemies(dt);if(mouseDown){var gx=Math.floor(mouseX/40)*40,gy=Math.floor(mouseY/40)*40;if(!nearPath(gx+20,gy+20,30)&&!occupied(gx,gy)&&gold>=TOWER_COST){towers.push({x:gx+20,y:gy+20,gx:gx,gy:gy,range:110,damage:5,cooldown:0});gold-=TOWER_COST}mouseDown=false}for(var ti=0;ti<towers.length;ti++){var t=towers[ti];t.cooldown-=dt;if(t.cooldown<=0){var target=nearestInRange(t);if(target){target.hp-=t.damage;if(target.hp<=0){target.alive=false;gold+=target.bounty}t.cooldown=0.7}}}if(window.cwStep)cwStep();ctx.fillStyle="#2d5a27";ctx.fillRect(0,0,600,400);ctx.strokeStyle="#c2b280";ctx.lineWidth=36;ctx.lineCap="round";ctx.lineJoin="round";ctx.beginPath();ctx.moveTo(path[0].x,path[0].y);for(var pi=1;pi<path.length;pi++){ctx.lineTo(path[pi].x,path[pi].y)}ctx.stroke();drawEnemies();drawTowers();drawRanges();var gx=Math.floor(mouseX/40)*40,gy=Math.floor(mouseY/40)*40;var blocked=nearPath(gx+20,gy+20,30)||occupied(gx,gy);ctx.globalAlpha=0.45;ctx.fillStyle=blocked?"#f87171":"#06d6a0";ctx.fillRect(gx+2,gy+2,36,36);ctx.globalAlpha=1;ctx.fillStyle="#ffd166";ctx.font="bold 16px monospace";ctx.textAlign="left";ctx.fillText("Gold: "+gold,10,22);ctx.fillStyle=lives<=5?"#f87171":"#4ade80";ctx.fillText("Lives: "+lives,10,44);ctx.fillStyle="#c4b5fd";ctx.fillText("Wave: "+wave,10,66);if(lives<=0){ctx.fillStyle="rgba(0,0,0,0.7)";ctx.fillRect(0,0,600,400);ctx.fillStyle="#f87171";ctx.font="bold 36px monospace";ctx.textAlign="center";ctx.fillText("GAME OVER",300,190);ctx.fillStyle="#fff";ctx.font="18px monospace";ctx.fillText("The enemies broke through!",300,230)}requestAnimationFrame(loop)}requestAnimationFrame(loop);})();};document.head.appendChild(_cs);</script></body></html>
