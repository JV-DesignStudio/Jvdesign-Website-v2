<!DOCTYPE html><html><head>
<title>Finished build: roblox-tycoon-canvas</title>
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="UTF-8"><style>body{display:flex;flex-direction:column;align-items:center;background:#0d1117;padding:8px;margin:0;font-family:system-ui,sans-serif;color:#e8eaf2;gap:6px;overflow:hidden}canvas{background:#0a0e14;border:2px solid #1e2733;border-radius:8px;touch-action:none;max-width:100%}.row{display:flex;gap:12px;align-items:center;font-size:.8rem;flex-wrap:wrap}.btn{background:#2d333b;border:1px solid #444c56;color:#e8eaf2;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:.75rem;transition:background .2s}.btn:hover{background:#3d444d}.btn.bought{background:#1a3a2a;border-color:#48bb78;color:#48bb78;cursor:default}</style></head><body><div class="row"><span>Cash: <b id="cash">$0</b></span><span>Bricks: <b id="brickCount">0</b></span></div><canvas id="game" width="600" height="400"></canvas><div class="row" id="upgrades"></div><script>const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");const W=600,H=400;let cash=0,totalBricks=0,brickValue=10,dropInterval=2000,lastDrop=0;let bricks=[];let dropper={x:W/2-20,y:30,w:40,h:30,color:"#63b3ed"};let collector={x:W/2-50,y:H-40,w:100,h:20,color:"#48bb78"};let upgrades=[];function spawnBrick(){bricks.push({x:dropper.x+dropper.w/2-8+Math.random()*16-8,y:dropper.y+dropper.h,w:16,h:16,vy:0,color:"#ecc94b",alive:true});totalBricks++;}function updateBricks(){for(let i=bricks.length-1;i>=0;i--){let b=bricks[i];if(!b.alive){bricks.splice(i,1);continue}b.vy+=0.15;b.y+=b.vy;if(b.y+b.h>=collector.y&&b.x+b.w>collector.x&&b.x<collector.x+collector.w){b.alive=false;if(typeof collectBrick==="function")collectBrick();}if(b.y>H+20){b.alive=false}}}upgrades=[{name:"Speed+",desc:"Drop every 1s",price:100,bought:false,action:function(){dropInterval=1000}},{name:"Value+",desc:"$25 per brick",price:200,bought:false,action:function(){brickValue=25}},{name:"Double",desc:"2 bricks at once",price:500,bought:false,action:function(){dropper.double=true}}];function renderUpgradeButtons(){let wrap=document.getElementById("upgrades");wrap.innerHTML="";for(let i=0;i<upgrades.length;i++){(function(idx){let u=upgrades[idx];let btn=document.createElement("button");btn.className="btn"+(u.bought?" bought":"");btn.textContent=u.bought?"Owned":u.name+" ($"+u.price+")";btn.title=u.desc;btn.onclick=function(){if(u.bought||cash<u.price)return;cash-=u.price;u.bought=true;u.action();renderUpgradeButtons();document.getElementById("cash").textContent="$"+cash};wrap.appendChild(btn);})(i)}}if(typeof particles==="undefined")window.particles=[];for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life--;if(p.life<=0){particles.splice(i,1);continue}ctx.save();ctx.globalAlpha=p.life/p.maxLife;ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,p.size,p.size);ctx.restore()}function spawnParticles(x,y,color){for(let i=0;i<5;i++){particles.push({x:x,y:y,vx:(Math.random()-0.5)*3,vy:(Math.random()-0.5)*3-1,life:20+Math.random()*15,maxLife:35,size:2+Math.random()*3,color:color})}}function collectBrick(){cash+=brickValue;if(typeof spawnParticles==="function")spawnParticles(collector.x+collector.w/2,collector.y,"#ecc94b");document.getElementById("cash").textContent="$"+cash;document.getElementById("brickCount").textContent=totalBricks;}function draw(){ctx.clearRect(0,0,W,H);CWArt.bg(ctx,W,H,"#1a1c2e","#0d0f1a");CWArt.grid(ctx,W,H,40);ctx.save();ctx.strokeStyle="rgba(99,179,237,.3)";ctx.lineWidth=2;ctx.setLineDash([4,4]);ctx.beginPath();ctx.moveTo(dropper.x+dropper.w/2,dropper.y+dropper.h);ctx.lineTo(collector.x+collector.w/2,collector.y);ctx.stroke();ctx.restore();let glowPhase=Math.sin(Date.now()/400)*0.3+0.7;ctx.save();ctx.globalAlpha=glowPhase*0.15;ctx.fillStyle="#ecc94b";ctx.beginPath();ctx.arc(dropper.x+dropper.w/2,dropper.y+dropper.h+6,20,0,Math.PI*2);ctx.fill();ctx.restore();ctx.save();ctx.globalAlpha=glowPhase*0.1;ctx.fillStyle="#48bb78";ctx.beginPath();ctx.arc(collector.x+collector.w/2,collector.y-4,30,0,Math.PI*2);ctx.fill();ctx.restore();ctx.save();ctx.shadowColor=dropper.color;ctx.shadowBlur=12;ctx.fillStyle=dropper.color;CWArt.roundRect(ctx,dropper.x,dropper.y,dropper.w,dropper.h,6);ctx.fill();ctx.restore();ctx.fillStyle="rgba(255,255,255,.8)";ctx.font="bold 9px system-ui";ctx.textAlign="center";ctx.fillText("DROPPER",dropper.x+dropper.w/2,dropper.y+dropper.h/2+3);ctx.save();ctx.shadowColor=collector.color;ctx.shadowBlur=14;ctx.fillStyle=collector.color;CWArt.roundRect(ctx,collector.x,collector.y,collector.w,collector.h,6);ctx.fill();ctx.restore();ctx.fillStyle="rgba(255,255,255,.8)";ctx.font="bold 9px system-ui";ctx.textAlign="center";ctx.fillText("COLLECTOR",collector.x+collector.w/2,collector.y+collector.h/2+3);for(let i=0;i<bricks.length;i++){let b=bricks[i];if(!b.alive)continue;ctx.save();ctx.shadowColor="rgba(236,201,75,.7)";ctx.shadowBlur=8;ctx.fillStyle=b.color;CWArt.roundRect(ctx,b.x,b.y,b.w,b.h,3);ctx.fill();ctx.restore();}ctx.fillStyle="rgba(236,201,75,.9)";ctx.font="bold 18px system-ui";ctx.textAlign="left";ctx.fillText("$"+cash,12,24);ctx.fillStyle="rgba(255,255,255,.5)";ctx.font="11px system-ui";ctx.fillText("Bricks: "+totalBricks,12,42);let padY=H-80;let padW=80;let gap=20;let startX=(W-(upgrades.length*padW+(upgrades.length-1)*gap))/2;for(let i=0;i<upgrades.length;i++){let u=upgrades[i];let px=startX+i*(padW+gap);ctx.save();ctx.shadowColor=u.bought?"rgba(72,187,120,.6)":"rgba(245,101,101,.6)";ctx.shadowBlur=10;ctx.fillStyle=u.bought?"#1a3a2a":"#3a1a1a";CWArt.roundRect(ctx,px,padY,padW,18,4);ctx.fill();ctx.restore();ctx.fillStyle=u.bought?"#48bb78":"#f56565";ctx.font="bold 8px system-ui";ctx.textAlign="center";ctx.fillText(u.bought?"OWNED":u.name+" $"+u.price,px+padW/2,padY+12);}}function spawnParticles(x, y, color) {
  for (let i = 0; i < 5; i++) {
    particles.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 3,
      vy: (Math.random() - 0.5) * 3 - 1,
      life: 20 + Math.random() * 15,
      maxLife: 35,
      size: 2 + Math.random() * 3,
      color: color
    });
  }
}renderUpgradeButtons();function loop(){let now=Date.now();if(now-lastDrop>=dropInterval){lastDrop=now;spawnBrick();if(dropper.double)spawnBrick()}updateBricks();draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></body></html>
