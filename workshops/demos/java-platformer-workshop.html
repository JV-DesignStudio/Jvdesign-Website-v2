<!DOCTYPE html><html><head>
<title>Finished build: java-platformer-workshop</title>
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="UTF-8"><style>body{display:flex;flex-direction:column;align-items:center;background:#191e3c;margin:0;overflow:hidden}canvas{display:block;cursor:pointer}</style></head><body><canvas id="game" width="600" height="400"></canvas><script>const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");let px=50,py=300,pw=34,ph=44,vx=0,vy=0,speed=5;let onGround=false;let leftHeld=false,rightHeld=false,upHeld=false;document.addEventListener("keydown",function(e){if(e.code==="ArrowLeft"||e.code==="KeyA")leftHeld=true;if(e.code==="ArrowRight"||e.code==="KeyD")rightHeld=true;if(e.code==="ArrowUp"||e.code==="KeyW"||e.code==="Space")upHeld=true;e.preventDefault()});document.addEventListener("keyup",function(e){if(e.code==="ArrowLeft"||e.code==="KeyA")leftHeld=false;if(e.code==="ArrowRight"||e.code==="KeyD")rightHeld=false;if(e.code==="ArrowUp"||e.code==="KeyW"||e.code==="Space")upHeld=false});const platforms=[{x:0,y:370,w:1200,h:30},{x:100,y:280,w:120,h:16},{x:300,y:220,w:120,h:16},{x:480,y:300,w:100,h:16},{x:50,y:160,w:100,h:16},{x:250,y:120,w:140,h:16},{x:450,y:160,w:120,h:16},{x:650,y:250,w:120,h:16},{x:850,y:180,w:140,h:16},{x:1050,y:280,w:100,h:16}];const coins=[{x:140,y:255,r:8,collected:false},{x:340,y:195,r:8,collected:false},{x:510,y:275,r:8,collected:false},{x:80,y:135,r:8,collected:false},{x:300,y:95,r:8,collected:false},{x:490,y:135,r:8,collected:false},{x:700,y:225,r:8,collected:false},{x:900,y:155,r:8,collected:false},{x:1080,y:255,r:8,collected:false}];let score=0;const enemies=[{x:130,y:260,w:20,h:20,speed:1,minX:100,maxX:200},{x:320,y:200,w:20,h:20,speed:0.8,minX:300,maxX:400},{x:270,y:100,w:20,h:20,speed:1.2,minX:250,maxX:370}];let health=3;let invuln=0;function handleInput(){if(leftHeld)px-=speed;if(rightHeld)px+=speed;if(upHeld&&onGround){vy=-14;onGround=false}}let camera=0;function loop(){handleInput();vy+=1;py+=vy;if(px<0)px=0;onGround=false;for(const p of platforms){if(px+pw>p.x&&px<p.x+p.w&&py+ph>p.y&&py+ph<p.y+p.h&&vy>=0){py=p.y-ph;vy=0;onGround=true}}for(const c of coins){if(!c.collected&&px+pw>c.x-c.r&&px<c.x+c.r&&py+ph>c.y-c.r&&py<c.y+c.r){c.collected=true;score++}}for(const e of enemies){e.x+=e.speed;if(e.x<=e.minX||e.x+e.w>=e.maxX)e.speed*=-1}if(invuln>0)invuln-=1/60;for(const e of enemies){if(invuln<=0&&px+pw>e.x&&px<e.x+e.w&&py+ph>e.y&&py<e.y+e.h){health--;invuln=1.5;vy=-6;if(health<=0){px=50;py=300;health=3;score=0;for(const c of coins)c.collected=false}}}try{camera = px - 200;
if (camera < 0) camera = 0;
if (camera > 600) camera = 600;}catch(e){}ctx.fillStyle="#191e3c";ctx.fillRect(0,0,600,400);ctx.save();ctx.translate(-camera,0);ctx.fillStyle="#06d6a0";for(const p of platforms){ctx.fillRect(p.x,p.y,p.w,p.h)}ctx.fillStyle="#ffd166";for(const c of coins){if(!c.collected){ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,Math.PI*2);ctx.fill()}}ctx.fillStyle="#4cc9f0";for(const e of enemies){ctx.fillRect(e.x,e.y,e.w,e.h)}if(invuln<=0||Math.floor(invuln*10)%2===0){ctx.fillStyle="#ff7700";ctx.fillRect(px,py,pw,ph)}ctx.restore();ctx.fillStyle="#fff";ctx.font="bold 18px sans-serif";ctx.textAlign="left";ctx.fillText("Score: "+score,10,24);ctx.fillStyle="#ff7700";for(var hi=0;hi<health;hi++){ctx.fillText("\u2764",520+hi*22,24)}requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></body></html>
