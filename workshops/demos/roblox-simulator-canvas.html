<!DOCTYPE html><html><head>
<title>Finished build: roblox-simulator-canvas</title>
<meta name="robots" content="noindex">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta charset="UTF-8"><style>body{display:flex;flex-direction:column;align-items:center;background:#0d1117;padding:8px;margin:0;font-family:system-ui,sans-serif;color:#e8eaf2;gap:6px;overflow:hidden}canvas{background:#0a0e14;border:2px solid #1e2733;border-radius:8px;touch-action:none;max-width:100%;cursor:pointer}.row{display:flex;gap:12px;align-items:center;font-size:.8rem;flex-wrap:wrap}.hud{display:flex;gap:16px;align-items:center;font-size:.85rem;flex-wrap:wrap}.hud b{color:#ffd166}.shop-panel{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:10px;padding:8px 14px;font-size:.75rem;display:flex;gap:10px;flex-wrap:wrap;align-items:center}.shop-btn{background:rgba(99,179,237,.15);border:1px solid rgba(99,179,237,.4);color:#63b3ed;padding:4px 10px;border-radius:6px;cursor:pointer;font-size:.75rem;font-family:inherit}.shop-btn:hover{background:rgba(99,179,237,.3)}.shop-btn.owned{opacity:.4;cursor:default}</style></head><body><div class="hud"><span>Coins: <b id="coins">0</b></span><span>Gems: <b id="gems">0</b></span><span>Backpack: <b id="backpack">0</b>/<b id="bpMax">10</b></span><span>Multiplier: <b id="multi">x1</b></span><span>Rebirths: <b id="rebirths">0</b></span></div><canvas id="game" width="600" height="400"></canvas><div class="shop-panel" id="shopPanel"><b>Shop:</b><button class="shop-btn" id="btnBP" onclick="buyUpgrade('backpack')">Bigger Backpack (25c)</button><button class="shop-btn" id="btnSpeed" onclick="buyUpgrade('speed')">Speed Boost (40c)</button><button class="shop-btn" id="btnAuto" onclick="buyUpgrade('auto')">Auto-Collect (60c)</button><button class="shop-btn" id="btnRebirth" onclick="doRebirth()" style="background:rgba(245,101,101,.15);border-color:rgba(245,101,101,.4);color:#f56565">Rebirth (100c)</button></div><div class="row" style="font-size:.7rem;opacity:.5">Arrow keys to move &middot; Walk over orbs to collect</div><script>const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");const W=600,H=400;let SPEED=3;let player={x:W/2-8,y:H/2-12,w:16,h:24,vx:0,vy:0};let coins=0,gems=0,backpackCount=0,backpackMax=10,multiplier=1,rebirthCount=0;let orbs=[];let autoCollect=false;let hasSpeedBoost=false;let hasBigBP=false;let leftHeld=false,rightHeld=false,upHeld=false,downHeld=false;const ORB_COLORS=["#ffd166","#06d6a0","#ef476f","#118ab2","#b794f4"];function spawnOrb(){if(orbs.length>=20)return;let kind=Math.random()<0.15?"gem":"coin";let r=kind==="gem"?8:6;orbs.push({x:30+Math.random()*(W-60),y:30+Math.random()*(H-60),r:r,color:kind==="gem"?"#b794f4":ORB_COLORS[Math.floor(Math.random()*3)],kind:kind,bob:Math.random()*Math.PI*2,alive:true});}for(let i=0;i<8;i++)spawnOrb();setInterval(spawnOrb,1200);document.addEventListener("keydown",function(e){if(e.code==="ArrowLeft"||e.code==="KeyA")leftHeld=true;if(e.code==="ArrowRight"||e.code==="KeyD")rightHeld=true;if(e.code==="ArrowUp"||e.code==="KeyW"){upHeld=true;e.preventDefault()}if(e.code==="ArrowDown"||e.code==="KeyS")downHeld=true;});document.addEventListener("keyup",function(e){if(e.code==="ArrowLeft"||e.code==="KeyA")leftHeld=false;if(e.code==="ArrowRight"||e.code==="KeyD")rightHeld=false;if(e.code==="ArrowUp"||e.code==="KeyW")upHeld=false;if(e.code==="ArrowDown"||e.code==="KeyS")downHeld=false;});function movePlayer(){if(leftHeld)player.vx=-SPEED;else if(rightHeld)player.vx=SPEED;else player.vx*=0.7;if(upHeld)player.vy=-SPEED;else if(downHeld)player.vy=SPEED;else player.vy*=0.7;player.x+=player.vx;player.y+=player.vy;if(player.x<0)player.x=0;if(player.x+player.w>W)player.x=W-player.w;if(player.y<0)player.y=0;if(player.y+player.h>H)player.y=H-player.h;}function collectOrbs(){let px=player.x+player.w/2,py=player.y+player.h/2;for(let i=orbs.length-1;i>=0;i--){let o=orbs[i];if(!o.alive)continue;let dx=px-o.x,dy=py-o.y,dist=Math.sqrt(dx*dx+dy*dy);if(dist<o.r+14){if(backpackCount>=backpackMax)continue;o.alive=false;orbs.splice(i,1);if(o.kind==="gem"){gems+=multiplier;if(document.getElementById("gems"))document.getElementById("gems").textContent=gems}else{coins+=multiplier;if(document.getElementById("coins"))document.getElementById("coins").textContent=coins}backpackCount++;if(document.getElementById("backpack"))document.getElementById("backpack").textContent=backpackCount;}}}canvas.addEventListener("click",function(e){let rect=canvas.getBoundingClientRect();let mx=(e.clientX-rect.left)*(W/rect.width),my=(e.clientY-rect.top)*(H/rect.height);for(let i=orbs.length-1;i>=0;i--){let o=orbs[i];if(!o.alive)continue;let dx=mx-o.x,dy=my-o.y;if(dx*dx+dy*dy<(o.r+8)*(o.r+8)){if(backpackCount>=backpackMax)break;o.alive=false;orbs.splice(i,1);if(o.kind==="gem"){gems+=multiplier;if(document.getElementById("gems"))document.getElementById("gems").textContent=gems}else{coins+=multiplier;if(document.getElementById("coins"))document.getElementById("coins").textContent=coins}backpackCount++;if(document.getElementById("backpack"))document.getElementById("backpack").textContent=backpackCount;break;}}});let sellZone={x:W-70,y:H-50,w:60,h:40};function checkSell(){let px=player.x+player.w/2,py=player.y+player.h/2;if(px>sellZone.x&&px<sellZone.x+sellZone.w&&py>sellZone.y&&py<sellZone.y+sellZone.h&&backpackCount>0){backpackCount=0;if(document.getElementById("backpack"))document.getElementById("backpack").textContent=0;}}function buyUpgrade(type){if(type==="backpack"&&!hasBigBP&&coins>=25){coins-=25;backpackMax=20;hasBigBP=true;document.getElementById("bpMax").textContent=backpackMax;document.getElementById("btnBP").classList.add("owned");document.getElementById("btnBP").textContent="Owned";}if(type==="speed"&&!hasSpeedBoost&&coins>=40){coins-=40;SPEED=5;hasSpeedBoost=true;document.getElementById("btnSpeed").classList.add("owned");document.getElementById("btnSpeed").textContent="Owned";}if(type==="auto"&&!autoCollect&&coins>=60){coins-=60;autoCollect=true;document.getElementById("btnAuto").classList.add("owned");document.getElementById("btnAuto").textContent="Owned";}document.getElementById("coins").textContent=coins;}function doAutoCollect(){if(!autoCollect)return;let px=player.x+player.w/2,py=player.y+player.h/2;for(let i=orbs.length-1;i>=0;i--){let o=orbs[i];if(!o.alive)continue;let dx=px-o.x,dy=py-o.y,dist=Math.sqrt(dx*dx+dy*dy);if(dist<80){o.x+=(px-o.x)*0.08;o.y+=(py-o.y)*0.08;}}}let touchStart=null;canvas.addEventListener("touchstart",function(e){touchStart={x:e.touches[0].clientX,y:e.touches[0].clientY};e.preventDefault()});canvas.addEventListener("touchmove",function(e){if(!touchStart)return;e.preventDefault();let dx=e.touches[0].clientX-touchStart.x,dy=e.touches[0].clientY-touchStart.y;leftHeld=dx<-15;rightHeld=dx>15;upHeld=dy<-15;downHeld=dy>15;});canvas.addEventListener("touchend",function(){leftHeld=false;rightHeld=false;upHeld=false;downHeld=false;touchStart=null});let particles=[];function addParticle(x,y,color){particles.push({x:x,y:y,vx:(Math.random()-0.5)*3,vy:-Math.random()*2-1,life:1,color:color})}function drawParticles(){for(let i=particles.length-1;i>=0;i--){let p=particles[i];p.x+=p.vx;p.y+=p.vy;p.life-=0.03;if(p.life<=0){particles.splice(i,1);continue}ctx.globalAlpha=p.life;ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,3*p.life,0,Math.PI*2);ctx.fill();ctx.globalAlpha=1;}}function draw(){CWArt.bg(ctx,W,H,"#1a2e1a","#0d1a0d");CWArt.grid(ctx,W,H,40);ctx.save();ctx.shadowColor="rgba(72,187,120,.7)";ctx.shadowBlur=14;ctx.fillStyle="rgba(72,187,120,.25)";CWArt.roundRect(ctx,sellZone.x,sellZone.y,sellZone.w,sellZone.h,6);ctx.fill();ctx.restore();ctx.fillStyle="rgba(72,187,120,.9)";ctx.font="bold 10px system-ui";ctx.textAlign="center";ctx.fillText("SELL",sellZone.x+sellZone.w/2,sellZone.y+sellZone.h/2+4);for(let i=0;i<orbs.length;i++){let o=orbs[i];if(!o.alive)continue;let bob=Math.sin(Date.now()/400+o.bob)*2;ctx.save();ctx.shadowColor=o.color;ctx.shadowBlur=o.kind==="gem"?14:10;ctx.fillStyle=o.color;ctx.beginPath();ctx.arc(o.x,o.y+bob,o.r,0,Math.PI*2);ctx.fill();ctx.restore();if(o.kind==="gem"){ctx.fillStyle="rgba(255,255,255,.5)";ctx.beginPath();ctx.arc(o.x-2,o.y+bob-2,2,0,Math.PI*2);ctx.fill()}}ctx.save();ctx.shadowColor="rgba(99,179,237,.9)";ctx.shadowBlur=12;ctx.fillStyle="#63b3ed";ctx.fillRect(player.x,player.y,player.w,player.h);ctx.restore();ctx.fillStyle="#fff";ctx.fillRect(player.x+4,player.y+6,4,4);ctx.fillRect(player.x+10,player.y+6,4,4);let bpPct=backpackCount/backpackMax;ctx.fillStyle="rgba(0,0,0,.4)";CWArt.roundRect(ctx,10,H-20,100,10,4);ctx.fill();ctx.fillStyle=bpPct>=1?"#f56565":"#48bb78";CWArt.roundRect(ctx,10,H-20,100*bpPct,10,4);ctx.fill();ctx.fillStyle="rgba(255,255,255,.6)";ctx.font="bold 8px system-ui";ctx.textAlign="left";ctx.fillText("BP: "+backpackCount+"/"+backpackMax,12,H-12);if(document.getElementById("coins"))document.getElementById("coins").textContent=coins;if(document.getElementById("gems"))document.getElementById("gems").textContent=gems;if(document.getElementById("multi"))document.getElementById("multi").textContent="x"+multiplier;if(document.getElementById("bpMax"))document.getElementById("bpMax").textContent=backpackMax;if(document.getElementById("backpack"))document.getElementById("backpack").textContent=backpackCount;drawParticles();}function doRebirth() {
  if (coins < 100) return;
  coins = 0; gems = 0;
  backpackCount = 0;
  backpackMax = 10;
  SPEED = 3;
  autoCollect = false;
  hasSpeedBoost = false;
  hasBigBP = false;
  rebirthCount++;
  multiplier = 1 + rebirthCount;
}function loop(){movePlayer();collectOrbs();doAutoCollect();checkSell();draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></body></html>
