<meta charset="UTF-8"><style>body{display:flex;flex-direction:column;align-items:center;background:#000;margin:0;overflow:hidden}canvas{display:block;image-rendering:pixelated;cursor:pointer}</style></head><body><canvas id="game" width="384" height="384"></canvas><script>const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");ctx.font="bold 12px monospace";const S=3,CELL=8,P8PAL={0:"#000",1:"#1d2b53",2:"#7e2553",3:"#008751",4:"#ab5236",5:"#5f574f",6:"#c2c3c7",7:"#fff",8:"#ff004d",9:"#ffa300",10:"#ffec27",11:"#00e436",12:"#29adff",13:"#83769c",14:"#ff77a8",15:"#ffccaa"};let snake=[{x:8,y:8}],dx=1,dy=0,ndx=1,ndy=0;let fx=4,fy=4;let score=0;let gameState="play",tick=0,moveRate=8;let leftHeld=false,rightHeld=false,upHeld=false,downHeld=false,zHeld=false,xHeld=false;let leftPressed=false,rightPressed=false,upPressed=false,downPressed=false,zPressed=false,xPressed=false;document.addEventListener("keydown",function(e){if(e.code==="ArrowLeft"||e.code==="KeyA"){leftHeld=true;leftPressed=true}if(e.code==="ArrowRight"||e.code==="KeyD"){rightHeld=true;rightPressed=true}if(e.code==="ArrowUp"||e.code==="KeyW"){upHeld=true;upPressed=true}if(e.code==="ArrowDown"||e.code==="KeyS"){downHeld=true;downPressed=true}if(e.code==="KeyZ"){zHeld=true;zPressed=true}if(e.code==="KeyX"){xHeld=true;xPressed=true}e.preventDefault()});document.addEventListener("keyup",function(e){if(e.code==="ArrowLeft"||e.code==="KeyA")leftHeld=false;if(e.code==="ArrowRight"||e.code==="KeyD")rightHeld=false;if(e.code==="ArrowUp"||e.code==="KeyW")upHeld=false;if(e.code==="ArrowDown"||e.code==="KeyS")downHeld=false;if(e.code==="KeyZ")zHeld=false;if(e.code==="KeyX")xHeld=false});function placeFood(){fx=Math.floor(Math.random()*16);fy=Math.floor(Math.random()*16)}document.addEventListener("keydown",function(e){if(e.code==="KeyR"&&gameState==="over"){snake=[{x:8,y:8}];dx=1;dy=0;ndx=1;ndy=0;score=0;moveRate=8;placeFood();gameState="play"}});function loop(){tick++;if(gameState==="play"){if(leftPressed&&dx!==1){ndx=-1;ndy=0}if(rightPressed&&dx!==-1){ndx=1;ndy=0}if(upPressed&&dy!==1){ndx=0;ndy=-1}if(downPressed&&dy!==-1){ndx=0;ndy=1}if(tick%moveRate===0){dx=ndx;dy=ndy;var head={x:(snake[0].x+dx+16)%16,y:(snake[0].y+dy+16)%16};for(var ci=0;ci<snake.length;ci++){if(snake[ci].x===head.x&&snake[ci].y===head.y){gameState="over"}}if(gameState==="play"){snake.unshift(head);if(head.x===fx&&head.y===fy){score++;placeFood()}else{snake.pop()}}var _cb=new Blob(["\nmoveRate = 8 - Math.floor(score / 3)\nif moveRate < 3 {\n  moveRate = 3\n}"],{type:"text/javascript"});var _cu=URL.createObjectURL(_cb);var _cs=document.createElement("script");_cs.src=_cu;_cs.onload=function(){URL.revokeObjectURL(_cu);(function(){}}leftPressed=false;rightPressed=false;upPressed=false;downPressed=false;zPressed=false;xPressed=false;ctx.fillStyle="#000";ctx.fillRect(0,0,384,384);ctx.strokeStyle="#111";for(var gi=0;gi<=16;gi++){ctx.beginPath();ctx.moveTo(gi*CELL*S,0);ctx.lineTo(gi*CELL*S,384);ctx.stroke();ctx.beginPath();ctx.moveTo(0,gi*CELL*S);ctx.lineTo(384,gi*CELL*S);ctx.stroke()}for(var si=0;si<snake.length;si++){ctx.fillStyle=si===0?P8PAL[11]:P8PAL[3];ctx.fillRect(snake[si].x*CELL*S,snake[si].y*CELL*S,CELL*S,CELL*S)}ctx.fillStyle=P8PAL[8];ctx.fillRect(fx*CELL*S,fy*CELL*S,CELL*S,CELL*S);ctx.fillStyle=P8PAL[7];ctx.font="bold 12px monospace";ctx.textAlign="left";ctx.fillText("score "+score,6,14);if(gameState==="over"){ctx.fillStyle=P8PAL[7];ctx.font="bold 24px monospace";ctx.textAlign="center";ctx.fillText("GAME OVER",192,170);ctx.font="14px monospace";ctx.fillText("Score: "+score,192,200);ctx.fillText("Press R to restart",192,224)}requestAnimationFrame(loop)}requestAnimationFrame(loop);})();};_cs.onerror=function(){URL.revokeObjectURL(_cu);(function(){}}leftPressed=false;rightPressed=false;upPressed=false;downPressed=false;zPressed=false;xPressed=false;ctx.fillStyle="#000";ctx.fillRect(0,0,384,384);ctx.strokeStyle="#111";for(var gi=0;gi<=16;gi++){ctx.beginPath();ctx.moveTo(gi*CELL*S,0);ctx.lineTo(gi*
