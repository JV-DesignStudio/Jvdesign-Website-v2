t selectedCard=-1;canvas.addEventListener("mousemove",function(e){let rect=canvas.getBoundingClientRect();let mx=e.clientX-rect.left,my=e.clientY-rect.top;recapHover=-1;for(let i=0;i<concepts.length;i++){let col=i%3,row=Math.floor(i/3);let cx=30+col*160,cy=75+row*155;if(mx>cx&&mx<cx+140&&my>cy&&my<cy+130)recapHover=i}});canvas.addEventListener("click",function(e){let rect=canvas.getBoundingClientRect();let mx=e.clientX-rect.left,my=e.clientY-rect.top;for(let i=0;i<concepts.length;i++){let col=i%3,row=Math.floor(i/3);let cx=30+col*160,cy=75+row*155;if(mx>cx&&mx<cx+140&&my>cy&&my<cy+130){selectedCard=selectedCard===i?-1:i}}});try{// The Monster.create method is a

}catch(e){}function loop(){drawRecap();if(selectedCard>=0){ctx.fillStyle="rgba(0,0,0,0.85)";ctx.fillRect(50,310,400,80);ctx.strokeStyle=concepts[selectedCard].color;ctx.lineWidth=2;ctx.strokeRect(50,310,400,80);ctx.fillStyle=concepts[selectedCard].color;ctx.font="bold 15px Arial";ctx.textAlign="center";ctx.fillText(concepts[selectedCard].icon+" "+concepts[selectedCard].title,250,340);ctx.fillStyle="#fff";ctx.font="13px Arial";ctx.fillText(concepts[selectedCard].desc,250,365);ctx.fillStyle="#aaa";ctx.font="11px Arial";ctx.fillText("Click card again to close",250,383)}requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></body></html>
