<body>

<div class="cw-header">
  <h1>Defold Pong Build Canvas <span class="cw-lang-tag">&#x1f3ae; Defold</span></h1>
  <p>Write Defold Lua game code step by step. The canvas shows what your code does.</p>
</div>

<div class="cw-layout">
  <div class="cw-steps" id="stepsPanel"></div>
  <div class="cw-canvas-panel" id="canvasPanel">
    <div class="cw-progress">
      <span id="cwProgressText">Step 1 / 6</span>
      <div class="cw-progress-bar"><div class="cw-progress-fill" id="cwProgressFill" style="width:0%"></div></div>
    </div>
    <div class="cw-canvas-frame">
      <iframe id="gameFrame" sandbox="allow-scripts" title="Your Defold Pong game"></iframe>
    </div>
    <div class="cw-canvas-hint" id="canvasHint">Two white paddles on a dark court with a dashed centre line</div>
    <button class="cw-btn-dl" onclick="CW.downloadGame()">Download My Game</button>
  </div>
</div>

<script>
'use strict';

/* ===================================================
   Defold Lua-to-JS transpiler
   =================================================== */
function defoldToJs(code) {
  return code
    .replace(/--(.*)$/gm, '//$1')
    .replace(/\blocal\s+/g, 'let ')
    .replace(/\bself\.(\w+)/g, 'self_$1')
    .replace(/\bthen\b/g, '{')
    .replace(/\belseif\b/g, '} else if')
    .replace(/\belse\b(?!\s*if)/g, '} else {')
    .replace(/\bend\b/g, '}')
    .replace(/~=/g, '!==')
    .replace(/\.\.\s*/g, '+ ')
    .replace(/#(\w+)/g, '$1.length')
    .replace(/\btable\.insert\s*\(\s*(\w+)\s*,\s*/g, '$1.push(')
    .replace(/\bmath\.random\s*\(\s*(\d+)\s*,\s*(\d+)\s*\)/g, '(Math.floor(Math.random()*($2-$1+1))+$1)')
    .replace(/\bmath\.floor\s*\(/g, 'Math.floor(')
    .replace(/\bmath\.abs\s*\(/g, 'Math.abs(')
    .replace(/\bprint\s*\(/g, 'console.log(')
    .replace(/\bnil\b/g, 'null')
    .replace(/\btrue\b/g, 'true')
    .replace(/\bfalse\b/g, 'false');
}

/* ===================================================
   IFRAME BUILDING BLOCKS (Defold Pong)
   =================================================== */

var CSS_GAME = '<style>body{display:flex;flex-direction:column;align-items:center;background:#1a1a2e;margin:0;overflow:hidden}canvas{display:block;cursor:pointer}</style>';

var CANVAS_TAG = '<canvas id="game" width="600" height="400"></canvas>';

var SETUP = 'const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");';

var PADDLE_VARS = 'let p1y=152,p2y=152;const padW=12,padH=80,padSpeed=5;';

var BALL_VARS = 'let bx=292,by=192,bs=12,bvx=4,bvy=3;';

var SCORE_VARS = 'let scoreL=0,scoreR=0;';

var STATE_VARS = 'let gameState="play";';

var AI_VARS = 'let aiSpeed=4,aiDeadZone=10;';

var KEYS = 'let wHeld=false,sHeld=false;' +
  'document.addEventListener("keydown",function(e){' +
    'if(e.code==="KeyW"||e.code==="ArrowUp")wHeld=true;' +
    'if(e.code==="KeyS"||e.code==="ArrowDown")sHeld=true;' +
    'e.preventDefault()});' +
  'document.addEventListener("keyup",function(e){' +
    'if(e.code==="KeyW"||e.code==="ArrowUp")wHeld=false;' +
    'if(e.code==="KeyS"||e.code==="ArrowDown")sHeld=false});';

var MOVE_P2 = 'if(wHeld)p2y-=padSpeed;if(sHeld)p2y+=padSpeed;p2y=Math.max(0,Math.min(320,p2y));';

var DRAW_BG = 'ctx.fillStyle="#1a1a2e";ctx.fillRect(0,0,600,400);';

var DRAW_NET = 'ctx.fillStyle="#334155";for(var ny=0;ny<400;ny+=20){ctx.fillRect(297,ny,6,12)}';

var DRAW_PADDLES = 'ctx.fillStyle="#fff";ctx.fillRect(16,p1y,padW,padH);ctx.fillRect(572,p2y,padW,padH);';

var DRAW_BALL = 'ctx.fillStyle="#fbbf24";ctx.fillRect(bx,by,bs,bs);';

var DRAW_SCORES = 'ctx.fillStyle="#fff";ctx.font="bold 40px monospace";ctx.textAlign="center";ctx.fillText(scoreL,220,55);ctx.fillText(scoreR,380,55);';

var BALL_MOVE = 'bx+=bvx;by+=bvy;';

var WALL_BOUNCE = 'if(by<=0||by+bs>=400)bvy=-bvy;';

var PADDLE_HIT = 'if(bx<=28&&bx+bs>=16&&by+bs>=p1y&&by<=p1y+padH&&bvx<0){bvx=-bvx*1.05;bvy=(by+bs/2-(p1y+40))/10}' +
  'if(bx+bs>=572&&bx<=584&&by+bs>=p2y&&by<=p2y+padH&&bvx>0){bvx=-bvx*1.05;bvy=(by+bs/2-(p2y+40))/10}' +
  'bvx=Math.max(-10,Math.min(10,bvx));';

var SERVE_FN = 'function serve(dir){bx=292;by=192;bvx=4*dir;bvy=[3,-3][Math.floor(Math.random()*2)]}';

var SCORING = 'if(bx<-20){scoreR++;serve(-1)}if(bx>620){scoreL++;serve(1)}';

var AI_LOGIC = 'var gap=by+bs/2-(p1y+40);if(Math.abs(gap)>aiDeadZone){p1y+=Math.sign(gap)*aiSpeed}p1y=Math.max(0,Math.min(320,p1y));';

function wrap(code) {
  return '<!DOCTYPE html><html><head><meta charset="UTF-8">' + CSS_GAME +
    '<\/head><body>' + CANVAS_TAG + '<script>' + code + '<\/script><\/body><\/html>';
}

/* ===================================================
   CW_CONFIG - Defold Pong steps + templates
   =================================================== */

window.CW_CONFIG = {
  storageKey: 'jvds-defold-pong-canvas',
  downloadName: 'my-defold-pong.html',

  hints: [
    'Two white paddles on a dark court with a dashed centre line',
    'The right paddle moves with W/S keys',
    'A yellow ball bounces off the top and bottom walls',
    'The ball rebounds off paddles with angle based on hit position',
    'The left paddle is AI-controlled and chases the ball',
    'First to 5 wins, with speed ramp and restart'
  ],

  templates: {
    1: function(u) {
      return wrap(
        SETUP + PADDLE_VARS + KEYS +
        'try{' + defoldToJs(u) + '}catch(e){}' +
        'function loop(){' +
        MOVE_P2 +
        DRAW_BG + DRAW_NET + DRAW_PADDLES +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    2: function(u) {
      return wrap(
        SETUP + PADDLE_VARS + BALL_VARS + KEYS +
        'function loop(){' +
        MOVE_P2 +
        'try{' + defoldToJs(u) + '}catch(e){}' +
        DRAW_BG + DRAW_NET + DRAW_PADDLES + DRAW_BALL +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    3: function(u) {
      return wrap(
        SETUP + PADDLE_VARS + BALL_VARS + KEYS +
        'function loop(){' +
        MOVE_P2 + BALL_MOVE + WALL_BOUNCE +
        'try{' + defoldToJs(u) + '}catch(e){}' +
        'bvx=Math.max(-10,Math.min(10,bvx));' +
        'if(bx<-20||bx>620){bx=292;by=192;bvx=4*(Math.random()<0.5?1:-1);bvy=[3,-3][Math.floor(Math.random()*2)]}' +
        DRAW_BG + DRAW_NET + DRAW_PADDLES + DRAW_BALL +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    4: function(u) {
      return wrap(
        SETUP + PADDLE_VARS + BALL_VARS + SCORE_VARS + KEYS +
        SERVE_FN +
        'function loop(){' +
        MOVE_P2 + BALL_MOVE + WALL_BOUNCE + PADDLE_HIT +
        'try{' + defoldToJs(u) + '}catch(e){}' +
        DRAW_BG + DRAW_NET + DRAW_PADDLES + DRAW_BALL + DRAW_SCORES +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    5: function(u) {
      return wrap(
        SETUP + PADDLE_VARS + BALL_VARS + SCORE_VARS + AI_VARS + KEYS +
        SERVE_FN +
        'function loop(){' +
        MOVE_P2 + BALL_MOVE + WALL_BOUNCE + PADDLE_HIT + SCORING +
        'try{' + defoldToJs(u) + '}catch(e){}' +
        'p1y=Math.max(0,Math.min(320,p1y));' +
        DRAW_BG + DRAW_NET + DRAW_PADDLES + DRAW_BALL + DRAW_SCORES +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    6: function(u) {
      return wrap(
        SETUP + PADDLE_VARS + BALL_VARS + SCORE_VARS + AI_VARS + STATE_VARS + KEYS +
        'document.addEventListener("keydown",function(e){if(e.code==="KeyR"&&gameState==="over"){scoreL=0;scoreR=0;serve(1);gameState="play"}});' +
        SERVE_FN +
        'function loop(){' +
        'if(gameState==="play"){' +
        MOVE_P2 + BALL_MOVE + WALL_BOUNCE + PADDLE_HIT + AI_LOGIC + SCORING +
        'try{' + defoldToJs(u) + '}catch(e){}' +
        '}' +
        DRAW_BG + DRAW_NET + DRAW_PADDLES + DRAW_BALL + DRAW_SCORES +
        'if(gameState==="over"){ctx.fillStyle="#fff";ctx.font="bold 32px monospace";ctx.textAlign="center";' +
        'ctx.fillText(scoreR>=5?"YOU WIN!":"AI WINS!",300,190);' +
        'ctx.font="18px monospace";ctx.fillText("Press R to play again",300,225)}' +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    }
  },

  steps: [
    {
      num: 1,
      title: 'The Paddles',
      goal: 'Draw two white paddles on a dark court and move the right one with W/S.',
      points: [
        'The court is 600x400. Each paddle is 12 wide and 80 tall',
        'Left paddle (AI) at x=16, right paddle (player) at x=572',
        'In Defold each paddle would be a game object with a sprite and a script component',
        'The player paddle moves with W/S keys at 5 pixels per frame'
      ],
      challenge: '🎮 Set the paddle dimensions and position:',
      starter: '-- Set up the paddles\nlocal padW = ___\nlocal padH = ___\nlocal p2y = 152  -- right paddle starts centred',
      solution: '-- Set up the paddles\nlocal padW = 12\nlocal padH = 80\nlocal p2y = 152  -- right paddle starts centred',
      checks: ['12', '80', '152'],
      height: 100,
      fills: {
        text: 'Each paddle is ___ pixels wide and ___ pixels tall. In Defold, each paddle is a separate game object.',
        answers: ['12', '80']
      },
      quiz: {
        question: 'In Defold, what is a game object?',
        options: [
          'A picture file',
          'A container that holds components like sprites, scripts, and collision shapes - the building block of every entity',
          'A type of variable'
        ],
        correct: 1
      }
    },
    {
      num: 2,
      title: 'The Ball',
      goal: 'Launch a ball with velocity and bounce it off the top and bottom walls.',
      points: [
        'The ball has velocity: bvx (horizontal) and bvy (vertical)',
        'Each frame: position += velocity. In Defold you would set this in <code>update(self, dt)</code>',
        'Wall bounce: when the ball hits top or bottom, flip bvy: <code>bvy = -bvy</code>',
        'In Defold the ball would be a game object with a kinematic collision object'
      ],
      challenge: '🎮 Write the ball movement and wall bounce:',
      starter: '-- Move the ball\nbx = bx + bvx\nby = by + ___\n\n-- Bounce off top and bottom walls\nif by <= 0 or by + bs >= 400 then\n    bvy = ___\nend',
      solution: '-- Move the ball\nbx = bx + bvx\nby = by + bvy\n\n-- Bounce off top and bottom walls\nif by <= 0 or by + bs >= 400 then\n    bvy = -bvy\nend',
      checks: ['bvy', '-bvy', '400'],
      height: 160,
      fills: {
        text: 'Flipping the vertical velocity with ___ makes the ball bounce. The court height is ___ pixels.',
        answers: ['-bvy', '400']
      },
      quiz: {
        question: 'In Defold, what collision object type moves by code but detects collisions?',
        options: [
          'Static',
          'Kinematic - it is moved by the script and triggers collision callbacks without physics simulation',
          'Dynamic'
        ],
        correct: 1
      }
    },
    {
      num: 3,
      title: 'Paddle Bounce & Spin',
      goal: 'Bounce the ball off paddles with angle based on where it hits.',
      points: [
        'Check if the ball overlaps a paddle using AABB collision',
        'Reverse horizontal speed and increase by 5%: <code>bvx = -bvx * 1.05</code>',
        'Spin: vertical speed based on hit offset: <code>(ball_centre - paddle_centre) / 10</code>',
        'In Defold you would handle this in <code>on_message(self, message_id, message)</code> for collision response'
      ],
      challenge: '🎮 Write the paddle bounce with spin:',
      starter: '-- Bounce off paddle and add spin\nbvx = -bvx * ___\n\n-- Spin from hit position\nlocal offset = (by + bs/2) - (paddleY + padH/2)\nbvy = offset / ___',
      solution: '-- Bounce off paddle and add spin\nbvx = -bvx * 1.05\n\n-- Spin from hit position\nlocal offset = (by + bs/2) - (paddleY + padH/2)\nbvy = offset / 10',
      checks: ['1.05', 'offset', '10'],
      height: 140,
      fills: {
        text: 'Each hit speeds the ball up by ___%. Hitting the paddle edge produces a ___ bounce angle.',
        answers: ['5', 'steep']
      },
      quiz: {
        question: 'Why does the spin formula divide by 10?',
        options: [
          'It is a magic number',
          'It scales the pixel offset (up to 40px) into a reasonable velocity range for smooth angles',
          'Defold requires division by 10'
        ],
        correct: 1
      }
    },
    {
      num: 4,
      title: 'Scoring',
      goal: 'Award a point when the ball passes a paddle and re-serve.',
      points: [
        'Ball past left edge (x < -20): right player scores, serve goes left',
        'Ball past right edge (x > 620): left player scores, serve goes right',
        'Serve resets ball to centre with a fresh velocity toward the scorer\'s opponent',
        'In Defold you would use <code>msg.post()</code> to notify a controller script about the score'
      ],
      challenge: '🎮 Write the scoring logic:',
      starter: '-- Ball exits left side\nif bx < -20 then\n    scoreR = scoreR + ___\n    serve(-1)\nend\n-- Ball exits right side\nif bx > 620 then\n    scoreL = scoreL + ___\n    serve(1)\nend',
      solution: '-- Ball exits left side\nif bx < -20 then\n    scoreR = scoreR + 1\n    serve(-1)\nend\n-- Ball exits right side\nif bx > 620 then\n    scoreL = scoreL + 1\n    serve(1)\nend',
      checks: ['scorer', 'scorel', 'serve'],
      height: 200,
      fills: {
        text: 'The serve direction is ___ toward the side that lost the point. In Defold, objects communicate with ___.',
        answers: ['-1', 'messages']
      },
      quiz: {
        question: 'In Defold, how do game objects communicate with each other?',
        options: [
          'Global variables only',
          'Message passing with msg.post() - each object has an address and handles messages in on_message',
          'They share a single script'
        ],
        correct: 1
      }
    },
    {
      num: 5,
      title: 'AI Paddle',
      goal: 'Make the left paddle chase the ball automatically with a dead zone.',
      points: [
        'Compare ball centre to paddle centre: <code>gap = ball_y - paddle_centre</code>',
        'Dead zone: only move if <code>math.abs(gap) > 10</code> pixels',
        'Move at fixed speed toward the ball - not instant tracking, so the player can score',
        'In Defold this AI logic would live in the left paddle\'s <code>update()</code> function'
      ],
      challenge: '🎮 Write the AI chase logic:',
      starter: '-- AI chases the ball\nlocal gap = by + bs/2 - (p1y + padH/2)\nif math.abs(gap) > ___ then\n    p1y = p1y + ___ * aiSpeed\nend',
      solution: '-- AI chases the ball\nlocal gap = by + bs/2 - (p1y + padH/2)\nif math.abs(gap) > 10 then\n    p1y = p1y + (gap > 0 and 1 or -1) * aiSpeed\nend',
      checks: ['math.abs', 'gap', 'aispeed', '10'],
      height: 140,
      fills: {
        text: 'The dead zone of ___ pixels adds human-like hesitation. The AI moves at ___ pixels per frame.',
        answers: ['10', '4']
      },
      quiz: {
        question: 'Why give the AI a dead zone?',
        options: [
          'To save CPU power',
          'Without one the AI vibrates in place - the dead zone creates natural pauses that make it beatable',
          'Defold requires dead zones'
        ],
        correct: 1
      }
    },
    {
      num: 6,
      title: 'Win Condition & Restart',
      goal: 'First to 5 wins. Show the winner and let R restart.',
      points: [
        'Check after each score: if either reaches 5, set <code>gameState = "over"</code>',
        'Display "YOU WIN!" or "AI WINS!" in the centre',
        'Press R to reset scores and re-serve',
        'In Defold you would swap to a game-over GUI screen or collection proxy'
      ],
      challenge: '🎮 Write the win check:',
      starter: '-- Check for winner\nif scoreL >= ___ or scoreR >= ___ then\n    gameState = "___"\nend',
      solution: '-- Check for winner\nif scoreL >= 5 or scoreR >= 5 then\n    gameState = "over"\nend',
      checks: ['5', 'over', 'gamestate'],
      height: 100,
      fills: {
        text: 'First to ___ points wins. In Defold, scene transitions use ___ proxies.',
        answers: ['5', 'collection']
      },
      quiz: {
        question: 'In Defold, how do you switch between game scenes?',
        options: [
          'Delete everything and recreate',
          'Use collection proxies to load and unload entire scenes with their game objects',
          'Scenes switch automatically'
        ],
        correct: 1
      }
    }
  ]
};
</script>
<script src="../workshop-canvas-engine.js"></script>
<script defer src="/feedback-widget.js"></script>
<script defer src="/jvds-funnel.js"></script>
</body>
