<script>
'use strict';

function gdscriptToJs(code) {
  return code
    .replace(/#.*$/gm, '')
    .replace(/\bprint\s*\(/g, 'console.log(')
    .replace(/\bVector2\(([^,]+),\s*([^)]+)\)/g, '{x:$1,y:$2}')
    .replace(/\brandf\(\)/g, 'Math.random()')
    .replace(/\brandi\(\)\s*%\s*(\w+)/g, 'Math.floor(Math.random()*$1)')
    .replace(/\babs\(/g, 'Math.abs(')
    .replace(/\bclamp\(([^,]+),\s*([^,]+),\s*([^)]+)\)/g, 'Math.max($2,Math.min($3,$1))')
    .replace(/\.position\.x/g, '.x')
    .replace(/\.position\.y/g, '.y')
    .replace(/\bInput\.is_action_pressed\("ui_left"\)/g, 'leftHeld')
    .replace(/\bInput\.is_action_pressed\("ui_right"\)/g, 'rightHeld')
    .replace(/\bInput\.is_action_pressed\("ui_up"\)/g, 'upHeld')
    .replace(/\bInput\.is_action_pressed\("ui_down"\)/g, 'downHeld')
    .replace(/\bfunc\s+(\w+)\s*\(([^)]*)\)\s*:/g, 'function $1($2){')
    .replace(/\belif\b/g, '} else if')
    .replace(/\bif\s+(.+):/g, 'if($1){')
    .replace(/\belse\s*:/g, '} else {')
    .replace(/\bfor\s+(\w+)\s+in\s+range\(([^)]+)\)\s*:/g, 'for(let $1=0;$1<$2;$1++){')
    .replace(/\bwhile\s+(.+):/g, 'while($1){')
    .replace(/\bvar\b/g, 'let')
    .replace(/\btrue\b/g, 'true')
    .replace(/\bfalse\b/g, 'false')
    .replace(/\bnull\b/g, 'null');
}

var CSS_GAME = '<style>body{display:flex;flex-direction:column;align-items:center;background:#1a1a2e;margin:0;overflow:hidden}canvas{display:block;cursor:pointer}</style>';
var CANVAS_TAG = '<canvas id="game" width="600" height="400"></canvas>';
var SETUP = 'const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");';

var CAR_VARS = 'let carX=270,carY=320,carW=60,carH=40,carSpeed=0,maxSpeed=7,drift=0;';
var ROAD_VARS = 'let roadOffset=0,laneW=240,roadX=180;';
var AI_VARS = 'let aiCars=[];for(let i=0;i<2;i++)aiCars.push({x:200+i*120,y:60+i*100,w:50,h:36,speed:2+Math.random()*2,lane:i});';
var POWER_VARS = 'let powerUp={x:250,y:-200,w:24,h:24,type:"boost",active:false};let boostTimer=0;';
var MINIMAP_VARS = 'let positions=[{y:0,color:"#60a5fa"},{y:100,color:"#f43f5e"},{y:200,color:"#fb923c"}];';
var SCORE_VARS = 'let place=3,distance=0,lapLength=4000,lap=0;';
var STATE_VARS = 'let gameState="play";';

var KEYS = 'let leftHeld=false,rightHeld=false,upHeld=false,downHeld=false;' +
  'document.addEventListener("keydown",function(e){' +
    'if(e.code==="ArrowLeft"||e.code==="KeyA")leftHeld=true;' +
    'if(e.code==="ArrowRight"||e.code==="KeyD")rightHeld=true;' +
    'if(e.code==="ArrowUp"||e.code==="KeyW")upHeld=true;' +
    'if(e.code==="ArrowDown"||e.code==="KeyS")downHeld=true;' +
    'e.preventDefault()});' +
  'document.addEventListener("keyup",function(e){' +
    'if(e.code==="ArrowLeft"||e.code==="KeyA")leftHeld=false;' +
    'if(e.code==="ArrowRight"||e.code==="KeyD")rightHeld=false;' +
    'if(e.code==="ArrowUp"||e.code==="KeyW")upHeld=false;' +
    'if(e.code==="ArrowDown"||e.code==="KeyS")downHeld=false});';

var DRAW_ROAD = 'ctx.fillStyle="#1a1a2e";ctx.fillRect(0,0,600,400);' +
  'ctx.fillStyle="#444";ctx.fillRect(roadX,0,laneW,400);' +
  'ctx.strokeStyle="#ffff00";ctx.setLineDash([20,20]);ctx.lineDashOffset=-roadOffset;' +
  'for(var li=1;li<3;li++){ctx.beginPath();ctx.moveTo(roadX+li*laneW/3,0);ctx.lineTo(roadX+li*laneW/3,400);ctx.stroke()}ctx.setLineDash([]);';

var DRAW_CAR = 'ctx.fillStyle=boostTimer>0?"#fbbf24":"#60a5fa";ctx.fillRect(carX,carY,carW,carH);';
var DRAW_AI = 'var aiColors=["#f43f5e","#fb923c"];for(var i=0;i<aiCars.length;i++){ctx.fillStyle=aiColors[i];ctx.fillRect(aiCars[i].x,aiCars[i].y,aiCars[i].w,aiCars[i].h)}';
var DRAW_POWER = 'if(!powerUp.active){ctx.fillStyle="#22c55e";ctx.fillRect(powerUp.x,powerUp.y,powerUp.w,powerUp.h);ctx.fillStyle="#fff";ctx.font="bold 14px monospace";ctx.textAlign="center";ctx.fillText("B",powerUp.x+12,powerUp.y+17)}';
var DRAW_HUD = 'ctx.fillStyle="#fff";ctx.font="bold 18px monospace";ctx.textAlign="left";' +
  'ctx.fillText("Place: "+place+"/3",10,24);ctx.fillText("Lap: "+lap+"/3",10,48);' +
  'if(boostTimer>0){ctx.fillStyle="#fbbf24";ctx.fillText("BOOST!",10,72)}';
var DRAW_MINIMAP = 'ctx.fillStyle="rgba(0,0,0,0.5)";ctx.fillRect(540,10,50,120);' +
  'for(var i=0;i<positions.length;i++){ctx.fillStyle=positions[i].color;ctx.fillRect(555,20+positions[i].y*0.03,20,8)}';

function wrap(code) {
  return '<!DOCTYPE html><html><head><meta charset="UTF-8">' + CSS_GAME +
    '<\/head><body>' + CANVAS_TAG + '<script>' + code + '<\/script><\/body><\/html>';
}

window.CW_CONFIG = {
  storageKey: 'jvds-godot-racing2-canvas',
  downloadName: 'my-godot-racing-2.html',

  hints: [
    'A blue player car with a red AI car on the road',
    'Two AI cars drive at different speeds in their lanes',

    'Collecting the boost turns the car gold and increases speed',
    'Drifting adds sideways slide when turning at speed',
    'A minimap shows positions and place ranking updates live'

  templates: {
    1: function(u) {
      return wrap(

        'try{' + gdscriptToJs(u) + '}catch(e){}' +

        'try{' + gdscriptToJs(u) + '}catch(e){}' +
        DRAW_ROAD + DRAW_CAR + DRAW_AI + DRAW_POWER +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    4: function(u) {

        'var effMax=boostTimer>0?maxSpeed+3:maxSpeed;' +

        'carX=Math.max(roadX,Math.min(roadX+laneW-carW,carX));roadOffset+=carSpeed;' +

        'if(!powerUp.active){powerUp.y+=carSpeed;if(powerUp.y>420){powerUp.y=-200;powerUp.x=roadX+Math.floor(Math.random()*(laneW-30))}}' +

      );
    },
    5: function(u) {
      return wrap(
        SETUP + CAR_VARS + ROAD_VARS + AI_VARS + POWER_VARS + KEYS +
        'function loop(){' +
        'var effMax=boostTimer>0?maxSpeed+3:maxSpeed;' +
        'if(upHeld)carSpeed+=0.15;else carSpeed*=0.98;carSpeed=Math.max(0,Math.min(effMax,carSpeed));' +
        'var steerAmt=3;if(carSpeed>4&&(leftHeld||rightHeld)){drift+=leftHeld?-0.5:0.5}else{drift*=0.9}' +
        'if(leftHeld)carX-=steerAmt;if(rightHeld)carX+=steerAmt;carX+=drift;' +
        'carX=Math.max(roadX,Math.min(roadX+laneW-carW,carX));roadOffset+=carSpeed;' +
        'if(boostTimer>0)boostTimer--;' +
        'for(var i=0;i<aiCars.length;i++){aiCars[i].y+=carSpeed-aiCars[i].speed;if(aiCars[i].y>400)aiCars[i].y=-60;if(aiCars[i].y<-60)aiCars[i].y=400}' +
        'if(!powerUp.active){powerUp.y+=carSpeed;if(powerUp.y>420){powerUp.y=-200;powerUp.x=roadX+Math.floor(Math.random()*(laneW-30))}}' +
        'if(!powerUp.active&&carX<powerUp.x+powerUp.w&&carX+carW>powerUp.x&&carY<powerUp.y+powerUp.h&&carY+carH>powerUp.y){powerUp.active=true;boostTimer=120}' +
        'try{' + gdscriptToJs(u) + '}catch(e){}' +
        DRAW_ROAD + DRAW_CAR + DRAW_AI + DRAW_POWER + DRAW_HUD +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    6: function(u) {
      return wrap(
        SETUP + CAR_VARS + ROAD_VARS + AI_VARS + POWER_VARS + MINIMAP_VARS + SCORE_VARS + STATE_VARS + KEYS +
        'document.addEventListener("keydown",function(e){if(e.code==="KeyR"&&gameState==="over"){carSpeed=0;distance=0;lap=0;place=3;boostTimer=0;drift=0;powerUp.active=false;powerUp.y=-200;gameState="play"}});' +
        'function loop(){' +
        'if(gameState==="play"){' +
        'var effMax=boostTimer>0?maxSpeed+3:maxSpeed;' +
        'if(upHeld)carSpeed+=0.15;else carSpeed*=0.98;carSpeed=Math.max(0,Math.min(effMax,carSpeed));' +
        'if(leftHeld)carX-=3;if(rightHeld)carX+=3;carX+=drift*0.9;drift*=0.92;' +
        'if(carSpeed>4&&(leftHeld||rightHeld))drift+=(leftHeld?-0.5:0.5);' +
        'carX=Math.max(roadX,Math.min(roadX+laneW-carW,carX));roadOffset+=carSpeed;distance+=carSpeed;' +
        'if(boostTimer>0)boostTimer--;' +
        'for(var i=0;i<aiCars.length;i++){aiCars[i].y+=carSpeed-aiCars[i].speed;if(aiCars[i].y>400)aiCars[i].y=-60;if(aiCars[i].y<-60)aiCars[i].y=400}' +
        'if(!powerUp.active){powerUp.y+=carSpeed;if(powerUp.y>420){powerUp.y=-200;powerUp.x=roadX+Math.floor(Math.random()*(laneW-30))}' +
        'if(carX<powerUp.x+powerUp.w&&carX+carW>powerUp.x&&carY<powerUp.y+powerUp.h&&carY+carH>powerUp.y){powerUp.active=true;boostTimer=120}}' +
        'if(distance>=lapLength){lap++;distance=0;powerUp.active=false;powerUp.y=-200;if(lap>=3)gameState="over"}' +
        'try{' + gdscriptToJs(u) + '}catch(e){}' +
        '}' +
        DRAW_ROAD + DRAW_CAR + DRAW_AI + DRAW_POWER + DRAW_HUD + DRAW_MINIMAP +
        'if(gameState==="over"){ctx.fillStyle="#fff";ctx.font="bold 32px monospace";ctx.textAlign="center";' +
        'ctx.fillText("RACE OVER!",300,180);ctx.font="20px monospace";ctx.fillText("Place: "+place+"/3",300,220);' +
        'ctx.fillText("Press R to race again",300,260)}' +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    }
  },
