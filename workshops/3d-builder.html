<script>
(function () {
  'use strict';
  var PRESETS = [
    ['rocket', 'Rocket'], ['robot', 'Robot'], ['pirate-ship', 'Pirate Ship'],
    ['steampunk-airship', 'Steampunk Airship'], ['race-car', 'Race Car'], ['submarine', 'Submarine'],
    ['castle', 'Castle'], ['fairy-tale', 'Fairy Tale Cottage'], ['pirate-cannon', 'Pirate Cannon'],
    ['phone-stand', 'Phone Stand'], ['space-station', 'Space Station']
  ];
  // Presets migrated to module hosts (A1618+). Others fall back to their page.
  var MODULES = {
    rocket: '/assets/js/builders/rocket.js', robot: '/assets/js/builders/robot.js',
    'race-car': '/assets/js/builders/race-car.js', submarine: '/assets/js/builders/submarine.js',
    castle: '/assets/js/builders/castle.js', 'phone-stand': '/assets/js/builders/phone-stand.js',
    'pirate-cannon': '/assets/js/builders/pirate-cannon.js', 'pirate-ship': '/assets/js/builders/pirate-ship.js',
    'space-station': '/assets/js/builders/space-station.js', 'steampunk-airship': '/assets/js/builders/steampunk-airship.js',
    'fairy-tale': '/assets/js/builders/fairy-tale.js'
  };
  var ids = PRESETS.map(function (p) { return p[0]; });
  var host = document.getElementById('bsHost');
  var select = document.getElementById('bsSelect');
  var chips = document.getElementById('bsChips');
  var dispose = null, styleLinks = [];

  function norm(id) { return ids.indexOf(id) >= 0 ? id : 'rocket'; }
  function wanted() {
    var m = /[?&]preset=([^&]+)/.exec(location.search);
    return norm(m ? decodeURIComponent(m[1]) : 'rocket');
  }
  function clearCurrent() {
    if (dispose) { try { dispose(); } catch (e) { /* already gone */ } dispose = null; }
    styleLinks.forEach(function (l) { l.remove(); });
    styleLinks = [];
    host.innerHTML = '';
  }
  function loadStyles(list) {
    return Promise.all((list || []).map(function (href) {
      return new Promise(function (resolve) {
        var l = document.createElement('link');
        l.rel = 'stylesheet'; l.href = href; l.setAttribute('data-bs-style', '1');
        l.onload = resolve;
        l.onerror = resolve;
        document.head.appendChild(l); styleLinks.push(l);
      });
    }));
  }
  function tidy(frame) {
    try {
      var d = frame.contentDocument;
      if (!d || d.getElementById('bs-tidy')) return;
      var s = d.createElement('style');
      s.id = 'bs-tidy';
      s.textContent = 'footer,.jvds-tools-footer,.main-nav,.nav-toggle,.logo-link,.back-link,#emberBar{display:none !important}';
      d.head.appendChild(s);
    } catch (e) { /* cross-origin: leave as-is */ }
  }
  function iframeFallback(id) {
    var f = document.createElement('iframe');
    f.className = 'bs-frame'; f.title = '3D builder'; f.src = id + '-builder.html';
    f.addEventListener('load', function () { tidy(f); });
    host.appendChild(f);
    dispose = function () { f.remove(); };
  }
  function mountPreset(id) {
    clearCurrent();
    var mod = MODULES[id];
    if (!mod) { iframeFallback(id); return; }
    import(/* webpackIgnore: true */ mod).then(function (m) {
      return loadStyles(m.STYLES).then(function () {
        dispose = m.mount(host);
      });
    }, function () { iframeFallback(id); });
  }
  function updateUI(id) {
    select.value = id;
    Array.prototype.forEach.call(chips.children, function (c) {
      var on = c.dataset.id === id;
      c.classList.toggle('on', on);
      c.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }
  function setPreset(id) {
    id = norm(id);
    mountPreset(id);
    updateUI(id);
    try { var u = new URL(location.href); u.searchParams.set('preset', id); history.replaceState(null, '', u); } catch (e) { /* older browsers */ }
  }
  PRESETS.forEach(function (p) {
    var o = document.createElement('option'); o.value = p[0]; o.textContent = p[1]; select.appendChild(o);
    var b = document.createElement('button');
    b.type = 'button'; b.className = 'bs-chip'; b.dataset.id = p[0]; b.textContent = p[1];
    b.setAttribute('aria-pressed', 'false');
    b.addEventListener('click', function () { setPreset(p[0]); });
    chips.appendChild(b);
  });
  select.addEventListener('change', function () { setPreset(select.value); });
  setPreset(wanted());
})();
</script>
