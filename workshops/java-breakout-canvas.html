<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com https://www.google-analytics.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https: blob:; media-src 'self' https: blob:; connect-src 'self' https://www.google-analytics.com https://region1.google-analytics.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://labs.phaser.io https://is.gd; frame-src 'self' blob: https://www.youtube.com https://www.youtube-nocookie.com https://itch.io; object-src 'none'; base-uri 'self'; form-action 'self' https://formspree.io; worker-src 'self' blob:; child-src 'self' blob:">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Java Breakout Build Canvas | JVDesignStudio</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<link rel="stylesheet" href="../workshop-canvas.css">
<style>.cw-lang-tag{display:inline-block;background:rgba(245,158,11,.15);color:#f59e0b;font-family:'Fredoka',cursive;font-size:.72rem;padding:2px 8px;border-radius:6px;margin-left:8px;vertical-align:middle}</style>
</head>
<body>

<div class="cw-header">
  <h1>Java Breakout Build Canvas <span class="cw-lang-tag">☕ Java</span></h1>
  <p>Write Java game code step by step. The canvas shows what your code does.</p>
</div>

<div class="cw-layout">
  <div class="cw-steps" id="stepsPanel"></div>
  <div class="cw-canvas-panel" id="canvasPanel">
    <div class="cw-progress">
      <span id="cwProgressText">Step 1 / 6</span>
      <div class="cw-progress-bar"><div class="cw-progress-fill" id="cwProgressFill" style="width:0%"></div></div>
    </div>
    <div class="cw-canvas-frame">
      <iframe id="gameFrame" sandbox="allow-scripts" title="Your Java Breakout game" style="width:416px;height:350px"></iframe>
    </div>
    <div class="cw-canvas-hint" id="canvasHint">Use arrow keys to move the paddle left and right</div>
    <button class="cw-btn-dl" onclick="CW.downloadGame()">Download My Game</button>
  </div>
</div>

<script>
'use strict';

function javaToJs(code) {
  return code
    .replace(/\b(int|boolean|double|float|long|char)\s+/g, 'let ')
    .replace(/\bString\s+/g, 'let ')
    .replace(/\.size\(\)/g, '.length')
    .replace(/\.get\(([^)]+)\)/g, '[$1]')
    .replace(/\.remove\(([^)]+)\)/g, '.splice($1, 1)');
}

/* ===================================================
   IFRAME BUILDING BLOCKS (breakout-specific)
   =================================================== */

var PREVIEW_CSS = '<style>body{display:flex;align-items:center;justify-content:center;background:#0f1220;margin:0;overflow:hidden}canvas{display:block}</style>';
var TAG = '<canvas id="game" width="700" height="520"></canvas>';
var SETUP = 'const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");';

var PAD_VARS = 'let padX=295,padW=110,padH=14,padY=470;let leftHeld=false,rightHeld=false;';
var KEYS = 'document.addEventListener("keydown",function(e){if(e.code==="ArrowLeft"||e.code==="KeyA")leftHeld=true;if(e.code==="ArrowRight"||e.code==="KeyD")rightHeld=true;e.preventDefault()});document.addEventListener("keyup",function(e){if(e.code==="ArrowLeft"||e.code==="KeyA")leftHeld=false;if(e.code==="ArrowRight"||e.code==="KeyD")rightHeld=false});';
var PAD_MOVE = 'if(leftHeld)padX-=7;if(rightHeld)padX+=7;padX=Math.max(0,Math.min(700-padW,padX));';
var DRAW_PAD = 'ctx.fillStyle="#ff7700";ctx.beginPath();ctx.roundRect(padX,padY,padW,padH,4);ctx.fill();';

var BALL_VARS = 'let bx=340,by=300,bs=14,bvx=4,bvy=-4;';
var BALL_MOVE = 'bx+=bvx;by+=bvy;if(bx<=0||bx+bs>=700)bvx=-bvx;if(by<=0)bvy=-bvy;';
var PAD_HIT = 'if(bx+bs>padX&&bx<padX+padW&&by+bs>padY&&by+bs<padY+padH&&bvy>0){bvy=-bvy;var hit=(bx+bs/2)-(padX+padW/2);bvx=hit/12;if(bvx===0)bvx=1}';
var DRAW_BALL = 'ctx.fillStyle="#fff";ctx.beginPath();ctx.arc(bx+bs/2,by+bs/2,bs/2,0,Math.PI*2);ctx.fill();';

var BRICK_INIT = 'const bricks=[];const rowColors=["#f87171","#fb923c","#facc15","#4ade80","#60a5fa"];for(let r=0;r<5;r++)for(let c=0;c<10;c++)bricks.push({r:r,c:c,alive:true,x:c*68+12,y:r*26+50,w:64,h:22});';
var DRAW_BRICKS = 'for(const b of bricks){if(b.alive){ctx.fillStyle=rowColors[b.r];ctx.fillRect(b.x,b.y,b.w,b.h)}}';

var BRICK_HIT = 'for(const b of bricks){if(b.alive&&bx+bs>b.x&&bx<b.x+b.w&&by+bs>b.y&&by<b.y+b.h){b.alive=false;score+=(5-b.r)*10;bvy=-bvy;break}}';

var LIVES_VARS = 'let lives=3,gameOver=false,won=false;let score=0;';
var DRAW_SCORE = 'ctx.fillStyle="#fff";ctx.font="bold 16px sans-serif";ctx.textAlign="left";ctx.fillText("Score: "+score,12,30);';
var DRAW_LIVES = 'ctx.fillStyle="#ff7700";ctx.textAlign="right";for(let i=0;i<lives;i++)ctx.fillText("\\u2764",688-i*22,30);';
var LIFE_LOST = 'if(by>520){lives--;bx=340;by=300;bvx=4;bvy=-4;if(lives<=0)gameOver=true}';
var WIN_CHECK = 'if(!gameOver){let alive=0;for(const b of bricks)if(b.alive)alive++;if(alive===0)won=true}';
var DRAW_END = 'if(gameOver||won){ctx.fillStyle="rgba(0,0,0,0.7)";ctx.fillRect(0,0,700,520);ctx.fillStyle=won?"#4ade80":"#f87171";ctx.font="bold 36px Fredoka,sans-serif";ctx.textAlign="center";ctx.fillText(won?"YOU WIN!":"GAME OVER",350,240);ctx.fillStyle="#fff";ctx.font="22px Fredoka,sans-serif";ctx.fillText("Score: "+score,350,280)}';

var DRAW_BG = 'ctx.fillStyle="#0f1220";ctx.fillRect(0,0,700,520);';

function wrap(code) {
  return '<!DOCTYPE html><html><head><meta charset="UTF-8">' + PREVIEW_CSS +
    '<\/head><body>' + TAG + '<script>' + code + '<\/script><\/body><\/html>';
}

/* ===================================================
   CW_CONFIG - Java breakout steps + templates
   =================================================== */
window.CW_CONFIG = {
  storageKey: 'jvds-java-breakout-canvas',
  downloadName: 'my-java-breakout.html',

  hints: [
    'Your paddle appears at the bottom - move it with arrow keys',
    'The ball bounces off walls and ceiling, catch it with the paddle',
    'A wall of colourful bricks fills the top of the screen',
    'Hit bricks to smash them and score points',
    'Three lives - miss the ball and you lose one',
    'Clear all bricks to win!'
  ],

  templates: {
    1: function(u) {
      return wrap(
        SETUP + PAD_VARS + KEYS +
        'function loop(){' +
        'try{eval(' + JSON.stringify(javaToJs(u)) + ')}catch(e){}' +
        DRAW_BG + DRAW_PAD +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    2: function(u) {
      return wrap(
        SETUP + PAD_VARS + BALL_VARS + KEYS +
        'function loop(){' + PAD_MOVE +
        'try{eval(' + JSON.stringify(javaToJs(u)) + ')}catch(e){}' +
        PAD_HIT +
        DRAW_BG + DRAW_PAD + DRAW_BALL +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    3: function(u) {
      return wrap(
        SETUP + PAD_VARS + BALL_VARS + KEYS + BRICK_INIT +
        'function loop(){' + PAD_MOVE + BALL_MOVE + PAD_HIT +
        'try{eval(' + JSON.stringify(javaToJs(u)) + ')}catch(e){}' +
        DRAW_BG + DRAW_BRICKS + DRAW_PAD + DRAW_BALL +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    4: function(u) {
      return wrap(
        SETUP + PAD_VARS + BALL_VARS + KEYS + BRICK_INIT + 'let score=0;' +
        'function loop(){' + PAD_MOVE + BALL_MOVE + PAD_HIT + BRICK_HIT +
        'try{eval(' + JSON.stringify(javaToJs(u)) + ')}catch(e){}' +
        DRAW_BG + DRAW_BRICKS + DRAW_PAD + DRAW_BALL + DRAW_SCORE +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    5: function(u) {
      return wrap(
        SETUP + PAD_VARS + BALL_VARS + KEYS + BRICK_INIT + LIVES_VARS +
        'function loop(){if(!gameOver&&!won){' + PAD_MOVE + BALL_MOVE + PAD_HIT + BRICK_HIT +
        'try{eval(' + JSON.stringify(javaToJs(u)) + ')}catch(e){}' +
        WIN_CHECK + '}' +
        DRAW_BG + DRAW_BRICKS + DRAW_PAD + DRAW_BALL + DRAW_SCORE + DRAW_LIVES + DRAW_END +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    6: function(u) {
      return wrap(
        SETUP + PAD_VARS + BALL_VARS + KEYS + BRICK_INIT + LIVES_VARS +
        'function loop(){if(!gameOver&&!won){' + PAD_MOVE + BALL_MOVE + PAD_HIT + BRICK_HIT + LIFE_LOST + WIN_CHECK + '}' +
        'try{eval(' + JSON.stringify(javaToJs(u)) + ')}catch(e){}' +
        DRAW_BG + DRAW_BRICKS + DRAW_PAD + DRAW_BALL + DRAW_SCORE + DRAW_LIVES + DRAW_END +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    }
  },

  steps: [
    {
      num: 1,
      title: 'The Paddle',
      goal: 'Draw a paddle that moves left and right with the arrow keys.',
      points: [
        'The paddle has position <code>padX</code>, width 110, height 14, fixed at y = 470',
        'Move it with booleans: <code>leftHeld</code> and <code>rightHeld</code> - same pattern as the platformer',
        'Clamp with <code>Math.max(0, Math.min(700 - padW, padX))</code> so it stays on screen'
      ],
      challenge: '☕ Write the paddle movement and clamping:',
      starter: '// Move the paddle\nif (leftHeld)  padX -= 7;\nif (rightHeld) padX += ___;\n\n// Clamp to screen edges\npadX = Math.max(___, Math.min(700 - padW, padX));',
      solution: 'if (leftHeld)  padX -= 7;\nif (rightHeld) padX += 7;\n\npadX = Math.max(0, Math.min(700 - padW, padX));',
      checks: ['leftheld', 'rightheld', 'math.max'],
      height: 150,
      fills: {
        text: 'Math.max(0, x) stops the paddle going past the ___ edge. Math.min(590, x) stops it past the ___.',
        answers: ['left', 'right']
      },
      quiz: {
        question: 'What does <code>Math.max(0, Math.min(590, padX))</code> guarantee?',
        options: [
          'padX is always exactly 0 or 590',
          'padX always stays between 0 and 590, clamped on screen',
          'padX moves faster near the edges'
        ],
        correct: 1
      }
    },
    {
      num: 2,
      title: 'The Bouncing Ball',
      goal: 'Get a ball bouncing off walls, ceiling and the paddle.',
      points: [
        'Ball variables: position <code>bx, by</code>, velocity <code>bvx, bvy</code>, size 14',
        'Each frame: add velocity to position. Side walls flip <code>bvx</code>, ceiling flips <code>bvy</code>',
        'Paddle hit: if overlapping and moving down (<code>bvy > 0</code>), flip bvy upward'
      ],
      challenge: '☕ Write the ball movement and wall bouncing:',
      starter: '// Move the ball\nbx += bvx;\nby += ___;\n\n// Bounce off side walls\nif (bx <= 0 || bx + bs >= 700)\n    bvx = ___;\n\n// Bounce off ceiling\nif (by <= 0)\n    bvy = -bvy;',
      solution: 'bx += bvx;\nby += bvy;\n\nif (bx <= 0 || bx + bs >= 700)\n    bvx = -bvx;\n\nif (by <= 0)\n    bvy = -bvy;',
      checks: ['bvx', 'bvy', '700'],
      height: 200,
      fills: {
        text: 'To bounce off a side wall we flip the ___ velocity. We only rebound off the paddle when bvy > 0, meaning the ball is moving ___.',
        answers: ['horizontal', 'down']
      },
      quiz: {
        question: 'The ball hits the RIGHT wall. Which value changes?',
        options: [
          'bvy flips to negative',
          'bvx flips sign so the ball travels left',
          'bx resets to 0'
        ],
        correct: 1
      }
    },
    {
      num: 3,
      title: 'The Brick Wall',
      goal: 'Fill the top of the screen with a grid of colourful bricks.',
      points: [
        'Bricks stored as objects with <code>alive</code> flag - like Java\'s <code>boolean[][] bricks</code>',
        '5 rows, 10 columns. Each brick is 64×22 pixels with spacing',
        'A different colour per row makes the wall look like classic arcade Breakout'
      ],
      challenge: '☕ Write the nested loop that builds the brick grid:',
      starter: '// Build the brick wall: 5 rows, 10 columns\nfor (int r = 0; r < 5; r++) {\n    for (int c = 0; c < ___; c++) {\n        bricks.push({\n            r: r, c: c,\n            alive: ___,\n            x: c * 68 + 12,\n            y: r * 26 + 50,\n            w: 64, h: 22\n        });\n    }\n}',
      solution: 'for (int r = 0; r < 5; r++) {\n    for (int c = 0; c < 10; c++) {\n        bricks.push({\n            r: r, c: c,\n            alive: true,\n            x: c * 68 + 12,\n            y: r * 26 + 50,\n            w: 64, h: 22\n        });\n    }\n}',
      checks: ['bricks', 'alive', '68'],
      height: 230,
      fills: {
        text: 'The grid has ___ rows and 10 columns. Each brick starts with alive set to ___.',
        answers: ['5', 'true']
      },
      quiz: {
        question: 'What does <code>bricks[2][7]</code> refer to in Java\'s 2D array?',
        options: [
          'Row 2, column 7 of the grid (counting from 0)',
          'The 27th brick',
          'A brick that is 2 wide and 7 tall'
        ],
        correct: 0
      }
    },
    {
      num: 4,
      title: 'Smashing Bricks',
      goal: 'Make the ball destroy bricks on contact and rack up score.',
      points: [
        'Loop over bricks: if alive and ball overlaps, set <code>alive = false</code>',
        'Flip <code>bvy</code> so the ball bounces off the brick',
        'Score more for higher rows: <code>score += (5 - r) * 10</code>'
      ],
      challenge: '☕ Write the brick collision and scoring:',
      starter: '// Check each brick for collision\nfor (int i = 0; i < bricks.length; i++) {\n    var b = bricks[i];\n    if (b.alive &&\n        bx + bs > b.x && bx < b.x + b.w &&\n        by + bs > b.y && by < b.y + b.h) {\n        b.___ = false;\n        score += (5 - b.r) * 10;\n        bvy = ___;\n        break;\n    }\n}',
      solution: 'for (int i = 0; i < bricks.length; i++) {\n    var b = bricks[i];\n    if (b.alive &&\n        bx + bs > b.x && bx < b.x + b.w &&\n        by + bs > b.y && by < b.y + b.h) {\n        b.alive = false;\n        score += (5 - b.r) * 10;\n        bvy = -bvy;\n        break;\n    }\n}',
      checks: ['alive', 'score', 'break'],
      height: 260,
      fills: {
        text: 'When the ball hits a brick we set alive to ___. The ___ statement exits the loop so only one brick dies per frame.',
        answers: ['false', 'break']
      },
      quiz: {
        question: 'Why flip <code>bvy</code> when a brick is destroyed?',
        options: [
          'To slow the ball down',
          'So the ball bounces off the brick instead of drilling through the whole wall',
          'To reset the ball position'
        ],
        correct: 1
      }
    },
    {
      num: 5,
      title: 'Lives & Losing',
      goal: 'Lose a life when the ball drops past the paddle.',
      points: [
        'Start with <code>int lives = 3</code> - drawn as hearts top-right',
        'If <code>by > 520</code> (ball fell off screen): lives--, reset ball to centre',
        'When lives reach 0: <code>gameOver = true</code> - freeze the game'
      ],
      challenge: '☕ Write the life-lost and game-over logic:',
      starter: '// Ball fell past the paddle?\nif (by > 520) {\n    ___--;\n    bx = 340;\n    by = 300;\n    bvx = 4;\n    bvy = -4;\n    if (lives <= ___) gameOver = true;\n}',
      solution: 'if (by > 520) {\n    lives--;\n    bx = 340;\n    by = 300;\n    bvx = 4;\n    bvy = -4;\n    if (lives <= 0) gameOver = true;\n}',
      checks: ['lives', 'gameover', '520'],
      height: 180,
      fills: {
        text: 'The ball is lost when by exceeds ___. The game ends when lives reaches ___.',
        answers: ['520', '0']
      },
      quiz: {
        question: 'Why does update() start with <code>if (gameOver) return;</code>?',
        options: [
          'To make the game faster',
          'To freeze all movement once the game has ended, while still drawing the final screen',
          'Java requires a return in every method'
        ],
        correct: 1
      }
    },
    {
      num: 6,
      title: 'Win Check & Polish',
      goal: 'Detect when all bricks are gone and show the victory screen.',
      points: [
        'Count alive bricks each frame - if zero, <code>won = true</code>',
        'Draw a big message on the game-over or win screen with the final score',
        'In Java this would use <code>g.drawString()</code> - the canvas uses <code>fillText()</code>'
      ],
      challenge: '☕ Write the win detection:',
      starter: '// Count remaining bricks\nlet alive = 0;\nfor (int i = 0; i < bricks.length; i++) {\n    if (bricks[i].___) alive++;\n}\nif (alive === ___) won = true;',
      solution: 'let alive = 0;\nfor (int i = 0; i < bricks.length; i++) {\n    if (bricks[i].alive) alive++;\n}\nif (alive === 0) won = true;',
      checks: ['alive', 'won'],
      height: 140,
      fills: {
        text: 'The player wins when the alive count reaches ___. The game draws a ___ screen with the final score.',
        answers: ['0', 'victory']
      },
      quiz: {
        question: 'How does the win check work across Java and JavaScript?',
        options: [
          'They use completely different approaches',
          'Both loop through the data structure and count alive items - the logic is identical, only the syntax differs',
          'JavaScript cannot count array items'
        ],
        correct: 1
      }
    }
  ]
};
</script>
<script src="../workshop-canvas-engine.js"></script>
<script defer src="/feedback-widget.js"></script>
<script defer src="/jvds-funnel.js"></script>
</body>
</html>
