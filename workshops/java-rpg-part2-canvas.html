<script>
'use strict';

/* ===================================================
   Java-to-JS transpiler (light transform so Java
   syntax runs in the canvas iframe)
   =================================================== */
function javaToJs(code) {
  return code
    .replace(/\b(int|boolean|double|float|long|char)\s+/g, 'let ')
    .replace(/\bString\s+/g, 'let ')
    .replace(/\bRectangle\s+/g, 'let ')
    .replace(/\bfor\s*\(\s*let\s+(\w+)\s*:\s*(\w+)\s*\)/g, 'for (const $1 of $2)')
    .replace(/\.size\(\)/g, '.length')
    .replace(/\.get\(([^)]+)\)/g, '[$1]')
    .replace(/\.remove\(([^)]+)\)/g, '.splice($1, 1)')
    .replace(/System\.out\.println\(/g, 'console.log(') + '\n';
}

/* ===================================================
   IFRAME BUILDING BLOCKS (RPG battle system)
   =================================================== */

var CSS_BATTLE = '<style>body{margin:0;overflow:hidden;background:#14100c;font-family:Arial,sans-serif}canvas{display:block;cursor:pointer}</style>';

var CANVAS_TAG = '<canvas id="game" width="500" height="400"></canvas>';

var SETUP = 'const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");';

/* Hero object */
var HERO_OBJ = 'let hero={name:"Aria",hp:30,maxHp:30,attack:5,level:1,xp:0,xpToLevel:25,gold:0,defending:false};';

/* Monster factory */

  'if(type==="slime")return{name:"Slime",hp:12,maxHp:12,attack:3,xpReward:8,goldReward:5,color:"#4ade80"};' +
  'if(type==="wolf")return{name:"Wolf",hp:20,maxHp:20,attack:5,xpReward:15,goldReward:12,color:"#60a5fa"};' +
  'if(type==="goblin")return{name:"Goblin",hp:28,maxHp:28,attack:7,xpReward:25,goldReward:20,color:"#a78bfa"};' +
  'return createMonster("slime");}';

var MONSTER_VAR = 'let monster=createMonster("slime");';

var DRAW_MONSTER = 'ctx.fillStyle=monster.color;ctx.fillRect(350,100,90,80);' +

/* Click handler for action buttons */

/* Monster attack logic */
var MONSTER_COUNTER = 'function monsterAttack(){' +
  'if(monster.hp<=0)return;' +
  'let dmg=monster.attack+Math.floor(Math.random()*3);' +
  'if(hero.defending){dmg=Math.floor(dmg/2);hero.defending=false;}' +
  'hero.hp=Math.max(0,hero.hp-dmg);' +
  'battleLog+="  "+monster.name+" hits for "+dmg+"!";' +

  'if(hero.hp<=0){battleOver=true;resultMsg="Defeat! You fell in battle.";}}';

  'hero.xp+=amount;' +
  'while(hero.xp>=hero.xpToLevel){' +
  'hero.xp-=hero.xpToLevel;hero.level++;hero.maxHp+=6;hero.attack+=2;hero.hp=hero.maxHp;' +
  'hero.xpToLevel=hero.level*25;' +
  'resultMsg+=" Level Up! Lv"+hero.level;}}';

/* Victory logic */
var VICTORY_CHECK = 'function checkVictory(){' +
  'if(monster.hp<=0){' +
  'battleOver=true;resultMsg="Victory! +"+monster.xpReward+" XP, +"+monster.goldReward+" Gold";' +
  'hero.gold+=monster.goldReward;gainXp(monster.xpReward);}}';

/* Defeat/respawn logic */
var RESPAWN_LOGIC = 'function respawn(){' +
  'hero.hp=Math.floor(hero.maxHp/2);hero.gold=Math.floor(hero.gold/2);hero.defending=false;}';

function wrap(code) {
  return '<!DOCTYPE html><html><head><meta charset="UTF-8">' + CSS_BATTLE +
    '<\/head><body>' + CANVAS_TAG + '<script>' + code + '<\/script><\/body><\/html>';
}

        'function draw(){' +
        DRAW_BG + DRAW_HERO_STATS + DRAW_MONSTER + DRAW_MONSTER_FACE + DRAW_LOG + DRAW_ACTIONS +

    },

        MONSTER_COUNTER + LEVELUP_LOGIC + VICTORY_CHECK + RESPAWN_LOGIC +
