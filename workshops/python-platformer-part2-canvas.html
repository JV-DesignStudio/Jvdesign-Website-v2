<script>
'use strict';

/* ===================================================
   Python-to-JS transpiler (light transform so Python
   syntax runs in the canvas iframe)
   =================================================== */
function pyToJs(code) {
  return code
    .replace(/\bTrue\b/g, 'true')
    .replace(/\bFalse\b/g, 'false')
    .replace(/\bNone\b/g, 'null')
    .replace(/\bprint\s*\(/g, 'console.log(')
    .replace(/\belif\b/g, 'else if')
    .replace(/\band\b/g, '&&')
    .replace(/\bor\b/g, '||')
    .replace(/\bnot\b/g, '!')
    .replace(/\blen\s*\(/g, '(')
    .replace(/\.append\s*\(/g, '.push(')
    .replace(/\brandom\.randint\s*\(\s*(\d+)\s*,\s*(\d+)\s*\)/g, '(Math.floor(Math.random()*($2-$1+1))+$1)')
    .replace(/#.*$/gm, '');
}

/* ===================================================
   IFRAME BUILDING BLOCKS (Python Platformer Part 2)
   =================================================== */

var CSS_GAME = '<style>body{display:flex;flex-direction:column;align-items:center;background:#111827;margin:0;overflow:hidden}canvas{display:block;cursor:pointer}</style>';

var CANVAS_TAG = '<canvas id="game" width="600" height="400"></canvas>';

var SETUP = 'const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");';

/* --- Player from Part 1 --- */
var PLAYER_VARS = 'let px=60,py=300,pw=24,ph=32,vx=0,vy=0,onGround=false,jumpsLeft=2;';

var KEYS = 'let leftHeld=false,rightHeld=false,jumpPressed=false;' +
  'document.addEventListener("keydown",function(e){' +
    'if(e.code==="ArrowLeft"||e.code==="KeyA")leftHeld=true;' +
    'if(e.code==="ArrowRight"||e.code==="KeyD")rightHeld=true;' +
    'if((e.code==="ArrowUp"||e.code==="Space"||e.code==="KeyW")&&!jumpPressed){jumpPressed=true;' +
      'if(jumpsLeft>0){vy=jumpsLeft===2?-10:-8;jumpsLeft--;onGround=false}}' +
    'e.preventDefault()});' +
  'document.addEventListener("keyup",function(e){' +
    'if(e.code==="ArrowLeft"||e.code==="KeyA")leftHeld=false;' +
    'if(e.code==="ArrowRight"||e.code==="KeyD")rightHeld=false;' +
    'if(e.code==="ArrowUp"||e.code==="Space"||e.code==="KeyW")jumpPressed=false});';

/* --- Platforms --- */
var PLATFORMS = 'var platforms=[{x:0,y:370,w:600,h:30},{x:120,y:290,w:100,h:14},{x:300,y:240,w:120,h:14},{x:480,y:310,w:100,h:14},{x:50,y:200,w:90,h:14},{x:220,y:150,w:100,h:14},{x:420,y:180,w:110,h:14}];';

var WIDE_PLATFORMS = 'var platforms=[{x:0,y:370,w:1800,h:30},{x:120,y:290,w:100,h:14},{x:300,y:240,w:120,h:14},{x:480,y:310,w:100,h:14},{x:50,y:200,w:90,h:14},{x:220,y:150,w:100,h:14},{x:420,y:180,w:110,h:14},{x:650,y:260,w:100,h:14},{x:820,y:200,w:120,h:14},{x:1000,y:280,w:100,h:14},{x:1150,y:220,w:110,h:14},{x:1350,y:300,w:100,h:14},{x:1500,y:240,w:120,h:14}];';

/* --- Moving platforms --- */
var MOVING_PLATS = 'var movingPlats=[{x:350,y:280,w:80,h:14,vx:0,vy:1,minY:220,maxY:320},{x:700,y:250,w:80,h:14,vx:1.5,vy:0,minX:650,maxX:820}];';

var MOVING_PLATS_WIDE = 'var movingPlats=[{x:350,y:280,w:80,h:14,vx:0,vy:1,minY:220,maxY:320},{x:700,y:250,w:80,h:14,vx:1.5,vy:0,minX:650,maxX:820},{x:1050,y:300,w:80,h:14,vx:0,vy:1.2,minY:230,maxY:340}];';

/* --- Player movement & physics --- */
var PLAYER_MOVE = 'vx=0;if(leftHeld)vx=-4;if(rightHeld)vx=4;px+=vx;vy+=0.45;py+=vy;';

var PLAYER_CLAMP = 'if(px<0)px=0;if(px+pw>600)px=600-pw;';

var PLAYER_CLAMP_WIDE = 'if(px<0)px=0;';

/* --- Platform collision --- */
var PLAT_COLLIDE = 'onGround=false;for(var i=0;i<platforms.length;i++){var p=platforms[i];' +
  'if(px+pw>p.x&&px<p.x+p.w&&py+ph>p.y&&py<p.y+p.h){' +
    'if(vy>0&&py+ph-vy<=p.y+4){py=p.y-ph;vy=0;onGround=true;jumpsLeft=2}' +
    'else if(vy<0&&py-vy>=p.y+p.h-4){py=p.y+p.h;vy=0}}}' +
  'if(py>420){py=300;px=60;vy=0;vx=0}';

var PLAT_COLLIDE_RESPAWN = 'onGround=false;for(var i=0;i<platforms.length;i++){var p=platforms[i];' +
  'if(px+pw>p.x&&px<p.x+p.w&&py+ph>p.y&&py<p.y+p.h){' +
    'if(vy>0&&py+ph-vy<=p.y+4){py=p.y-ph;vy=0;onGround=true;jumpsLeft=2}' +
    'else if(vy<0&&py-vy>=p.y+p.h-4){py=p.y+p.h;vy=0}}}' +
  'if(py>420)respawn();';

/* --- Enemy data --- */
var ENEMY_VARS = 'var enemies=[{x:300,y:346,w:24,h:24,vx:1.5,minX:260,maxX:420,alive:true},{x:480,y:286,w:24,h:24,vx:1,minX:460,maxX:560,alive:true}];';

var ENEMY_VARS_WIDE = 'var enemies=[{x:300,y:346,w:24,h:24,vx:1.5,minX:260,maxX:420,alive:true},{x:480,y:286,w:24,h:24,vx:1,minX:460,maxX:560,alive:true},{x:700,y:346,w:24,h:24,vx:1.2,minX:650,maxX:820,alive:true},{x:1050,y:346,w:24,h:24,vx:1.8,minX:1000,maxX:1200,alive:true}];';

/* --- Enemy patrol --- */
var ENEMY_PATROL = 'for(var i=0;i<enemies.length;i++){var en=enemies[i];if(!en.alive)continue;en.x+=en.vx;if(en.x<en.minX||en.x>en.maxX)en.vx=-en.vx}';

/* --- Stomp logic --- */
var STOMP_LOGIC = 'for(var i=0;i<enemies.length;i++){var en=enemies[i];if(!en.alive)continue;' +
  'if(px+pw>en.x&&px<en.x+en.w&&py+ph>en.y&&py<en.y+en.h){' +
    'if(vy>0&&py+ph-en.y<16){en.alive=false;vy=-8;score+=50}' +
    'else{respawn()}}}';

/* --- Score & lives --- */
var SCORE_VAR = 'let score=0;';

/* --- Respawn --- */
var RESPAWN_FN_SIMPLE = 'function respawn(){px=60;py=300;vx=0;vy=0}';

/* --- Camera --- */
var CAMERA_VARS = 'var camX=0;const LEVEL_W=1800;';

var CAMERA_UPDATE = 'camX=px-280;if(camX<0)camX=0;if(camX>LEVEL_W-600)camX=LEVEL_W-600;';

/* --- Spikes --- */
var SPIKE_DATA = 'var spikes=[{x:200,y:356,w:30,h:14},{x:550,y:356,w:40,h:14},{x:900,y:356,w:30,h:14},{x:1250,y:356,w:40,h:14}];';

/* --- Checkpoints --- */
var CHECKPOINT_DATA = 'var checkpoints=[{x:500,y:320,w:10,h:50,reached:false},{x:1100,y:320,w:10,h:50,reached:false}];';

/* ===================================================
   DRAWING HELPERS
   =================================================== */

var DRAW_BG = 'ctx.fillStyle="#111827";ctx.fillRect(0,0,600,400);';

var DRAW_PLATFORMS = 'ctx.fillStyle="#374151";for(var i=0;i<platforms.length;i++){var p=platforms[i];ctx.fillRect(p.x,p.y,p.w,p.h)}';

var DRAW_PLATFORMS_CAM = 'ctx.fillStyle="#374151";for(var i=0;i<platforms.length;i++){var p=platforms[i];ctx.fillRect(p.x-camX,p.y,p.w,p.h)}';

var DRAW_MOVING_PLATS = 'ctx.fillStyle="#6366f1";for(var i=0;i<movingPlats.length;i++){var mp=movingPlats[i];ctx.fillRect(mp.x,mp.y,mp.w,mp.h)}';

var DRAW_MOVING_PLATS_CAM = 'ctx.fillStyle="#6366f1";for(var i=0;i<movingPlats.length;i++){var mp=movingPlats[i];ctx.fillRect(mp.x-camX,mp.y,mp.w,mp.h)}';

var DRAW_PLAYER = 'ctx.fillStyle="#34d399";ctx.fillRect(px,py,pw,ph);';

var DRAW_PLAYER_CAM = 'ctx.fillStyle="#34d399";ctx.fillRect(px-camX,py,pw,ph);';

var DRAW_ENEMIES = 'ctx.fillStyle="#f87171";for(var i=0;i<enemies.length;i++){var en=enemies[i];if(en.alive)ctx.fillRect(en.x,en.y,en.w,en.h)}';

var DRAW_ENEMIES_CAM = 'ctx.fillStyle="#f87171";for(var i=0;i<enemies.length;i++){var en=enemies[i];if(en.alive)ctx.fillRect(en.x-camX,en.y,en.w,en.h)}';

var DRAW_SCORE = 'ctx.fillStyle="#fff";ctx.font="bold 16px monospace";ctx.textAlign="left";ctx.fillText("Score: "+score,10,24);';

var DRAW_SPIKES_CAM = 'ctx.fillStyle="#ff5470";for(var i=0;i<spikes.length;i++){var s=spikes[i];' +
  'ctx.beginPath();ctx.moveTo(s.x-camX,s.y+s.h);ctx.lineTo(s.x-camX+s.w/2,s.y);ctx.lineTo(s.x-camX+s.w,s.y+s.h);ctx.fill()}';

var DRAW_CHECKPOINTS_CAM = 'for(var i=0;i<checkpoints.length;i++){var cp=checkpoints[i];' +
  'ctx.fillStyle=cp.reached?"#4ade80":"#2dd4bf";' +
  'ctx.fillRect(cp.x-camX,cp.y,cp.w,cp.h);' +
  'ctx.fillRect(cp.x-camX-6,cp.y,22,12)}';

var DRAW_DOOR_CAM = 'ctx.fillStyle="#a78bfa";ctx.fillRect(door.x-camX,door.y,door.w,door.h);' +
  'ctx.fillStyle="#c4b5fd";ctx.fillRect(door.x-camX+4,door.y+4,16,20);';

var DRAW_HUD = 'ctx.fillStyle="#fff";ctx.font="bold 16px monospace";ctx.textAlign="left";' +
  'ctx.fillText("Score: "+score,10,24);ctx.fillText("Deaths: "+deaths,10,44);';

function wrap(code) {
  return '<!DOCTYPE html><html><head><meta charset="UTF-8">' + CSS_GAME +
    '<\/head><body>' + CANVAS_TAG + '<script>' + code + '<\/script><\/body><\/html>';
}

/* ===================================================
   CW_CONFIG - Python Platformer Part 2 steps + templates
   =================================================== */

window.CW_CONFIG = {
  storageKey: 'jvds-python-platformer2-canvas',
  downloadName: 'my-python-platformer-2.html',

  hints: [
    'A green player on platforms with a red patrolling enemy',
    'Stomp enemies from above to score points; touch their side and respawn',
    'The camera follows the player through the wider level',
    'Purple moving platforms carry the player along their path',
    'Red spike triangles kill on touch; teal flags save your respawn point',
    'Reach the purple door to beat each level and see YOU WIN'
  ],

  templates: {
    1: function(u) {
      return wrap(
        SETUP + PLAYER_VARS + PLATFORMS + ENEMY_VARS + KEYS +
        'try{' + pyToJs(u) + '}catch(e){}' +
        'function loop(){' +
        PLAYER_MOVE + PLAYER_CLAMP + PLAT_COLLIDE +
        ENEMY_PATROL +
        DRAW_BG + DRAW_PLATFORMS + DRAW_ENEMIES + DRAW_PLAYER +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    2: function(u) {
      return wrap(
        SETUP + PLAYER_VARS + PLATFORMS + ENEMY_VARS + SCORE_VAR + KEYS +
        RESPAWN_FN_SIMPLE +
        'function loop(){' +
        PLAYER_MOVE + PLAYER_CLAMP + PLAT_COLLIDE +
        ENEMY_PATROL +
        'try{' + pyToJs(u) + '}catch(e){}' +
        DRAW_BG + DRAW_PLATFORMS + DRAW_ENEMIES + DRAW_PLAYER + DRAW_SCORE +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    3: function(u) {
      return wrap(
        SETUP + PLAYER_VARS + WIDE_PLATFORMS + ENEMY_VARS_WIDE + SCORE_VAR + KEYS +
        RESPAWN_FN_SIMPLE +
        CAMERA_VARS +
        'function loop(){' +
        PLAYER_MOVE + PLAYER_CLAMP_WIDE + PLAT_COLLIDE_RESPAWN +
        ENEMY_PATROL + STOMP_LOGIC +
        'try{' + pyToJs(u) + '}catch(e){}' +
        DRAW_BG + DRAW_PLATFORMS_CAM + DRAW_ENEMIES_CAM + DRAW_PLAYER_CAM + DRAW_SCORE +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    4: function(u) {
      return wrap(
        SETUP + PLAYER_VARS + WIDE_PLATFORMS + ENEMY_VARS_WIDE + SCORE_VAR + KEYS +
        MOVING_PLATS_WIDE +
        'let deaths=0;var respawnX=60,respawnY=300;function respawn(){px=respawnX;py=respawnY;vx=0;vy=0;deaths++}' +
        CAMERA_VARS +
        'function loop(){' +
        PLAYER_MOVE + PLAYER_CLAMP_WIDE + PLAT_COLLIDE_RESPAWN +
        ENEMY_PATROL + STOMP_LOGIC +
        CAMERA_UPDATE +
        'try{' + pyToJs(u) + '}catch(e){}' +
        'for(var i=0;i<movingPlats.length;i++){var mp=movingPlats[i];' +
          'if(px+pw>mp.x&&px<mp.x+mp.w&&py+ph>mp.y&&py<mp.y+mp.h&&vy>=0&&py+ph-vy<=mp.y+4){py=mp.y-ph;vy=0;onGround=true;jumpsLeft=2;px+=mp.vx;py+=mp.vy}}' +
        DRAW_BG + DRAW_PLATFORMS_CAM + DRAW_MOVING_PLATS_CAM + DRAW_ENEMIES_CAM + DRAW_PLAYER_CAM +
        DRAW_HUD +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    5: function(u) {
      return wrap(
        SETUP + PLAYER_VARS + WIDE_PLATFORMS + ENEMY_VARS_WIDE + SCORE_VAR + KEYS +
        MOVING_PLATS_WIDE +
        'let deaths=0;var respawnX=60,respawnY=300;function respawn(){px=respawnX;py=respawnY;vx=0;vy=0;deaths++}' +
        CAMERA_VARS + SPIKE_DATA + CHECKPOINT_DATA +
        'function loop(){' +
        PLAYER_MOVE + PLAYER_CLAMP_WIDE + PLAT_COLLIDE_RESPAWN +
        ENEMY_PATROL + STOMP_LOGIC +
        'for(var i=0;i<movingPlats.length;i++){var mp=movingPlats[i];mp.x+=mp.vx;mp.y+=mp.vy;if(mp.vy!==0){if(mp.y<mp.minY||mp.y>mp.maxY)mp.vy=-mp.vy}if(mp.vx!==0){if(mp.x<mp.minX||mp.x>mp.maxX)mp.vx=-mp.vx}' +
          'if(px+pw>mp.x&&px<mp.x+mp.w&&py+ph>mp.y&&py<mp.y+mp.h&&vy>=0&&py+ph-vy<=mp.y+4){py=mp.y-ph;vy=0;onGround=true;jumpsLeft=2;px+=mp.vx;py+=mp.vy}}' +
        CAMERA_UPDATE +
        'try{' + pyToJs(u) + '}catch(e){}' +
        DRAW_BG + DRAW_PLATFORMS_CAM + DRAW_MOVING_PLATS_CAM + DRAW_SPIKES_CAM + DRAW_CHECKPOINTS_CAM + DRAW_ENEMIES_CAM + DRAW_PLAYER_CAM +
        DRAW_HUD +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    6: function(u) {
      return wrap(
        SETUP + KEYS + SCORE_VAR +
        'let deaths=0,gameWon=false;' +
        'var levels=[' +
          '{platforms:[{x:0,y:370,w:1200,h:30},{x:120,y:290,w:100,h:14},{x:300,y:240,w:120,h:14},{x:480,y:310,w:100,h:14},{x:700,y:260,w:100,h:14},{x:900,y:220,w:100,h:14}],' +
          'enemies:[{x:300,y:346,w:24,h:24,vx:1.5,minX:260,maxX:420,alive:true},{x:700,y:346,w:24,h:24,vx:1.2,minX:650,maxX:820,alive:true}],' +
          'movingPlats:[{x:350,y:280,w:80,h:14,vx:0,vy:1,minY:220,maxY:320}],' +
          'spikes:[{x:200,y:356,w:30,h:14},{x:550,y:356,w:40,h:14}],' +
          'checkpoints:[{x:500,y:320,w:10,h:50,reached:false}],' +
          'door:{x:1080,y:320,w:24,h:50},width:1200},' +
          '{platforms:[{x:0,y:370,w:1600,h:30},{x:150,y:280,w:110,h:14},{x:350,y:220,w:120,h:14},{x:550,y:290,w:100,h:14},{x:750,y:230,w:110,h:14},{x:950,y:270,w:100,h:14},{x:1150,y:210,w:120,h:14},{x:1350,y:280,w:100,h:14}],' +
          'enemies:[{x:350,y:346,w:24,h:24,vx:1.8,minX:300,maxX:470,alive:true},{x:750,y:346,w:24,h:24,vx:2,minX:700,maxX:870,alive:true},{x:1150,y:346,w:24,h:24,vx:1.5,minX:1100,maxX:1280,alive:true}],' +
          'movingPlats:[{x:450,y:260,w:80,h:14,vx:0,vy:1.2,minY:200,maxY:310},{x:850,y:240,w:80,h:14,vx:1.5,vy:0,minX:800,maxX:960}],' +
          'spikes:[{x:250,y:356,w:30,h:14},{x:650,y:356,w:40,h:14},{x:1050,y:356,w:30,h:14}],' +
          'checkpoints:[{x:600,y:320,w:10,h:50,reached:false},{x:1000,y:320,w:10,h:50,reached:false}],' +
          'door:{x:1480,y:320,w:24,h:50},width:1600}' +
        '];' +
        'var currentLevel=0,platforms,enemies,movingPlats,spikes,checkpoints,door,LEVEL_W;' +
        'var px=60,py=300,pw=24,ph=32,vx=0,vy=0,onGround=false,jumpsLeft=2;' +
        'var camX=0,respawnX=60,respawnY=300;' +
        'function respawn(){px=respawnX;py=respawnY;vx=0;vy=0;deaths++}' +
        'function loadLevel(n){var L=levels[n];platforms=L.platforms;enemies=JSON.parse(JSON.stringify(L.enemies));movingPlats=JSON.parse(JSON.stringify(L.movingPlats));spikes=L.spikes;checkpoints=JSON.parse(JSON.stringify(L.checkpoints));door=L.door;LEVEL_W=L.width;px=60;py=300;respawnX=60;respawnY=300;vx=0;vy=0}' +
        'loadLevel(0);' +
        'document.addEventListener("keydown",function(e){if(e.code==="KeyR"&&gameWon){deaths=0;score=0;gameWon=false;currentLevel=0;loadLevel(0)}});' +
        'try{' + pyToJs(u) + '}catch(e){}' +
        'function loop(){' +
        'if(!gameWon){' +
        'vx=0;if(leftHeld)vx=-4;if(rightHeld)vx=4;px+=vx;vy+=0.45;py+=vy;if(px<0)px=0;' +
        'onGround=false;for(var i=0;i<platforms.length;i++){var p=platforms[i];if(px+pw>p.x&&px<p.x+p.w&&py+ph>p.y&&py<p.y+p.h){if(vy>0&&py+ph-vy<=p.y+4){py=p.y-ph;vy=0;onGround=true;jumpsLeft=2}else if(vy<0&&py-vy>=p.y+p.h-4){py=p.y+p.h;vy=0}}}' +
        'if(py>420)respawn();' +
        'for(var i=0;i<enemies.length;i++){var en=enemies[i];if(!en.alive)continue;en.x+=en.vx;if(en.x<en.minX||en.x>en.maxX)en.vx=-en.vx;' +
