<body>

<div class="cw-header">
  <h1>Godot Basics Tutorial Build Canvas <span class="cw-lang-tag">&#x1f916; Godot</span></h1>
  <p>Learn Godot fundamentals: scenes, nodes, input and movement.</p>

<div class="cw-layout">
  <div class="cw-steps" id="stepsPanel"></div>
  <div class="cw-canvas-panel" id="canvasPanel">
    <div class="cw-progress">
      <span id="cwProgressText">Step 1 / 6</span>
      <div class="cw-progress-bar"><div class="cw-progress-fill" id="cwProgressFill" style="width:0%"></div></div>
    </div>

      <iframe id="gameFrame" sandbox="allow-scripts" title="Your Godot tutorial scene"></iframe>
    </div>

    <button class="cw-btn-dl" onclick="CW.downloadGame()">Download My Scene</button>
  </div>
</div>

<script>
'use strict';

function gdscriptToJs(code) {
  return code
    .replace(/#.*$/gm, '')
    .replace(/\bprint\s*\(/g, 'console.log(')
    .replace(/\bVector2\(([^,]+),\s*([^)]+)\)/g, '{x:$1,y:$2}')
    .replace(/\brandf\(\)/g, 'Math.random()')
    .replace(/\brandi\(\)\s*%\s*(\w+)/g, 'Math.floor(Math.random()*$1)')
    .replace(/\babs\(/g, 'Math.abs(')
    .replace(/\bclamp\(([^,]+),\s*([^,]+),\s*([^)]+)\)/g, 'Math.max($2,Math.min($3,$1))')
    .replace(/\.position\.x/g, '.x')
    .replace(/\.position\.y/g, '.y')
    .replace(/\bInput\.is_action_pressed\("ui_left"\)/g, 'leftHeld')
    .replace(/\bInput\.is_action_pressed\("ui_right"\)/g, 'rightHeld')
    .replace(/\bInput\.is_action_pressed\("ui_up"\)/g, 'upHeld')
    .replace(/\bInput\.is_action_pressed\("ui_down"\)/g, 'downHeld')
    .replace(/\bfunc\s+(\w+)\s*\(([^)]*)\)\s*:/g, 'function $1($2){')
    .replace(/\belif\b/g, '} else if')
    .replace(/\bif\s+(.+):/g, 'if($1){')
    .replace(/\belse\s*:/g, '} else {')
    .replace(/\bfor\s+(\w+)\s+in\s+range\(([^)]+)\)\s*:/g, 'for(let $1=0;$1<$2;$1++){')
    .replace(/\bwhile\s+(.+):/g, 'while($1){')
    .replace(/\bvar\b/g, 'let')
    .replace(/\btrue\b/g, 'true')
    .replace(/\bfalse\b/g, 'false')
    .replace(/\bnull\b/g, 'null');
}

var CSS_GAME = '<style>body{display:flex;flex-direction:column;align-items:center;background:#1a1a2e;margin:0;overflow:hidden}canvas{display:block;cursor:pointer}</style>';
var CANVAS_TAG = '<canvas id="game" width="400" height="400"></canvas>';
var SETUP = 'const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");';

var SPRITE_VARS = 'let sx=176,sy=176,sw=48,sh=48,rot=0,speed=4;';
var COLOR_VARS = 'let spriteColor="#22c55e",bgColor="#1a1a2e";';
var TRAIL_VARS = 'let trail=[];';
var COLLECT_VARS = 'let coins=[];for(let i=0;i<5;i++)coins.push({x:Math.floor(Math.random()*360)+20,y:Math.floor(Math.random()*360)+20,r:10,got:false});let collected=0;';
var STATE_VARS = 'let gameState="play";';

var KEYS = 'let leftHeld=false,rightHeld=false,upHeld=false,downHeld=false;' +
  'document.addEventListener("keydown",function(e){' +
    'if(e.code==="ArrowLeft"||e.code==="KeyA")leftHeld=true;' +
    'if(e.code==="ArrowRight"||e.code==="KeyD")rightHeld=true;' +
    'if(e.code==="ArrowUp"||e.code==="KeyW")upHeld=true;' +
    'if(e.code==="ArrowDown"||e.code==="KeyS")downHeld=true;' +
    'e.preventDefault()});' +
  'document.addEventListener("keyup",function(e){' +
    'if(e.code==="ArrowLeft"||e.code==="KeyA")leftHeld=false;' +
    'if(e.code==="ArrowRight"||e.code==="KeyD")rightHeld=false;' +
    'if(e.code==="ArrowUp"||e.code==="KeyW")upHeld=false;' +
    'if(e.code==="ArrowDown"||e.code==="KeyS")downHeld=false});';

var DRAW_BG = 'ctx.fillStyle=bgColor;ctx.fillRect(0,0,400,400);';
var DRAW_GRID = 'ctx.strokeStyle="rgba(255,255,255,0.05)";for(var gi=0;gi<400;gi+=40){ctx.beginPath();ctx.moveTo(gi,0);ctx.lineTo(gi,400);ctx.stroke();ctx.beginPath();ctx.moveTo(0,gi);ctx.lineTo(400,gi);ctx.stroke()}';

var DRAW_SPRITE = 'ctx.save();ctx.translate(sx+sw/2,sy+sh/2);ctx.rotate(rot);' +
  'ctx.fillStyle=spriteColor;ctx.fillRect(-sw/2,-sh/2,sw,sh);' +
  'ctx.fillStyle="#16a34a";ctx.fillRect(-sw/4,-sh/4,sw/2,sh/2);' +
  'ctx.restore();';

function wrap(code) {
  return '<!DOCTYPE html><html><head><meta charset="UTF-8">' + CSS_GAME +
    '<\/head><body>' + CANVAS_TAG + '<script>' + code + '<\/script><\/body><\/html>';
}

window.CW_CONFIG = {
  storageKey: 'jvds-godot-tutorial-canvas',
  downloadName: 'my-godot-tutorial.html',

  hints: [
    'A green square sprite in the centre of the scene',
    'The sprite moves in four directions with arrow keys',
    'The sprite rotates smoothly as it moves',
    'A trail of fading squares follows the sprite',
    'Golden coins appear for the sprite to collect',
    'Collecting all coins shows a victory message'
  ],

  templates: {
    1: function(u) {
      return wrap(
        SETUP + SPRITE_VARS + COLOR_VARS + KEYS +
        'try{' + gdscriptToJs(u) + '}catch(e){}' +
        'function loop(){' +
        DRAW_BG + DRAW_GRID + DRAW_SPRITE +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    2: function(u) {
      return wrap(
        SETUP + SPRITE_VARS + COLOR_VARS + KEYS +
        'function loop(){' +
        'try{' + gdscriptToJs(u) + '}catch(e){}' +
        'sx=Math.max(0,Math.min(400-sw,sx));sy=Math.max(0,Math.min(400-sh,sy));' +
        DRAW_BG + DRAW_GRID + DRAW_SPRITE +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    3: function(u) {
      return wrap(
        SETUP + SPRITE_VARS + COLOR_VARS + KEYS +
        'function loop(){' +
        'if(leftHeld)sx-=speed;if(rightHeld)sx+=speed;' +
        'if(upHeld)sy-=speed;if(downHeld)sy+=speed;' +
        'sx=Math.max(0,Math.min(400-sw,sx));sy=Math.max(0,Math.min(400-sh,sy));' +
        'try{' + gdscriptToJs(u) + '}catch(e){}' +
        DRAW_BG + DRAW_GRID + DRAW_SPRITE +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    4: function(u) {
      return wrap(
        SETUP + SPRITE_VARS + COLOR_VARS + TRAIL_VARS + KEYS +
        'var fc=0;function loop(){fc++;' +
        'if(leftHeld)sx-=speed;if(rightHeld)sx+=speed;' +
        'if(upHeld)sy-=speed;if(downHeld)sy+=speed;' +
        'sx=Math.max(0,Math.min(400-sw,sx));sy=Math.max(0,Math.min(400-sh,sy));' +
        'if(leftHeld||rightHeld||upHeld||downHeld){rot+=0.1}' +
        'if(fc%3===0)trail.push({x:sx,y:sy,a:1});' +
        'try{' + gdscriptToJs(u) + '}catch(e){}' +
        DRAW_BG + DRAW_GRID +
        'for(var ti=trail.length-1;ti>=0;ti--){trail[ti].a-=0.03;if(trail[ti].a<=0){trail.splice(ti,1)}else{ctx.globalAlpha=trail[ti].a;ctx.fillStyle=spriteColor;ctx.fillRect(trail[ti].x,trail[ti].y,sw,sh);ctx.globalAlpha=1}}' +
        DRAW_SPRITE +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    5: function(u) {
      return wrap(
        SETUP + SPRITE_VARS + COLOR_VARS + TRAIL_VARS + COLLECT_VARS + KEYS +
        'var fc=0;function loop(){fc++;' +
        'if(leftHeld)sx-=speed;if(rightHeld)sx+=speed;' +
        'if(upHeld)sy-=speed;if(downHeld)sy+=speed;' +
        'sx=Math.max(0,Math.min(400-sw,sx));sy=Math.max(0,Math.min(400-sh,sy));' +
        'if(leftHeld||rightHeld||upHeld||downHeld)rot+=0.1;' +
        'if(fc%3===0)trail.push({x:sx,y:sy,a:1});' +
        'try{' + gdscriptToJs(u) + '}catch(e){}' +
        DRAW_BG + DRAW_GRID +
        'for(var ti=trail.length-1;ti>=0;ti--){trail[ti].a-=0.03;if(trail[ti].a<=0)trail.splice(ti,1);else{ctx.globalAlpha=trail[ti].a;ctx.fillStyle=spriteColor;ctx.fillRect(trail[ti].x,trail[ti].y,sw,sh);ctx.globalAlpha=1}}' +
        'for(var ci=0;ci<coins.length;ci++){if(!coins[ci].got){ctx.fillStyle="#fbbf24";ctx.beginPath();ctx.arc(coins[ci].x,coins[ci].y,coins[ci].r,0,Math.PI*2);ctx.fill()}}' +
        DRAW_SPRITE +
        'ctx.fillStyle="#fff";ctx.font="bold 16px monospace";ctx.textAlign="left";ctx.fillText("Coins: "+collected+"/5",10,24);' +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    6: function(u) {
      return wrap(
        SETUP + SPRITE_VARS + COLOR_VARS + TRAIL_VARS + COLLECT_VARS + STATE_VARS + KEYS +
        'document.addEventListener("keydown",function(e){if(e.code==="KeyR"&&gameState==="win"){collected=0;for(var i=0;i<coins.length;i++){coins[i].got=false;coins[i].x=Math.floor(Math.random()*360)+20;coins[i].y=Math.floor(Math.random()*360)+20}sx=176;sy=176;gameState="play"}});' +
        'var fc=0;function loop(){fc++;' +
        'if(gameState==="play"){' +
        'if(leftHeld)sx-=speed;if(rightHeld)sx+=speed;' +
        'if(upHeld)sy-=speed;if(downHeld)sy+=speed;' +
        'sx=Math.max(0,Math.min(400-sw,sx));sy=Math.max(0,Math.min(400-sh,sy));' +
        'if(leftHeld||rightHeld||upHeld||downHeld)rot+=0.1;' +
        'if(fc%3===0)trail.push({x:sx,y:sy,a:1});' +
        'for(var ci=0;ci<coins.length;ci++){if(!coins[ci].got){var dx=sx+sw/2-coins[ci].x,dy=sy+sh/2-coins[ci].y;if(Math.sqrt(dx*dx+dy*dy)<sw/2+coins[ci].r){coins[ci].got=true;collected++}}}' +
        'try{' + gdscriptToJs(u) + '}catch(e){}' +
        '}' +
        DRAW_BG + DRAW_GRID +
        'for(var ti=trail.length-1;ti>=0;ti--){trail[ti].a-=0.03;if(trail[ti].a<=0)trail.splice(ti,1);else{ctx.globalAlpha=trail[ti].a;ctx.fillStyle=spriteColor;ctx.fillRect(trail[ti].x,trail[ti].y,sw,sh);ctx.globalAlpha=1}}' +
        'for(var ci=0;ci<coins.length;ci++){if(!coins[ci].got){ctx.fillStyle="#fbbf24";ctx.beginPath();ctx.arc(coins[ci].x,coins[ci].y,coins[ci].r,0,Math.PI*2);ctx.fill()}}' +
        DRAW_SPRITE +
        'ctx.fillStyle="#fff";ctx.font="bold 16px monospace";ctx.textAlign="left";ctx.fillText("Coins: "+collected+"/5",10,24);' +
        'if(gameState==="win"){ctx.fillStyle="#fff";ctx.font="bold 28px monospace";ctx.textAlign="center";ctx.fillText("ALL COINS COLLECTED!",200,180);ctx.font="18px monospace";ctx.fillText("Press R to play again",200,220)}' +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    }
  },

  steps: [
    {
      num: 1,
      title: 'Your First Scene',
      goal: 'Create a sprite in the centre of a 400x400 scene.',
      points: [
        'In Godot, everything is a <strong>Node</strong> arranged in a scene tree',
        'A Sprite2D node displays an image - here we draw a green square',
        'Position is set with <code>position = Vector2(x, y)</code>',
        'The scene is 400x400 pixels with a dark background and a subtle grid'
      ],
      challenge: '🤖 Set the sprite position and size:',
      starter: '# Place the sprite in the centre\nvar sprite_x = ___\nvar sprite_y = ___\nvar sprite_w = 48\nvar sprite_h = 48',
      solution: '# Place the sprite in the centre\nvar sprite_x = 176\nvar sprite_y = 176\nvar sprite_w = 48\nvar sprite_h = 48',
      checks: ['176', '48'],
      height: 120,
      fills: {
        text: 'The sprite is centred at x = ___. With a size of 48, the centre is (400 - 48) / 2 = ___.',
        answers: ['176', '176']
      },
      quiz: {
        question: 'What is a Node in Godot?',
        options: [
          'A type of variable',
          'The fundamental building block - everything in Godot (sprites, physics, UI, sound) is a node in a tree',
          'A drawing function'
        ],
        correct: 1
      }
    },
    {
      num: 2,
      title: 'Input & Movement',
      goal: 'Move the sprite with arrow keys, clamped to the screen edges.',
      points: [
        '<code>Input.is_action_pressed("ui_left")</code> checks if a key is held',
        'Move by speed pixels each frame: <code>position.x -= speed</code>',
        'Clamp to stay on screen: <code>clamp(x, 0, 400 - w)</code>',
        'In Godot the _process(delta) function runs every frame for input handling'
      ],
      challenge: '🤖 Write four-directional movement:',
      starter: '# Move in four directions\nif Input.is_action_pressed("ui_left"):\n    sprite_x -= ___\nif Input.is_action_pressed("ui_right"):\n    sprite_x += ___\nif Input.is_action_pressed("ui_up"):\n    sprite_y -= speed\nif Input.is_action_pressed("ui_down"):\n    sprite_y += speed',
      solution: '# Move in four directions\nif Input.is_action_pressed("ui_left"):\n    sprite_x -= speed\nif Input.is_action_pressed("ui_right"):\n    sprite_x += speed\nif Input.is_action_pressed("ui_up"):\n    sprite_y -= speed\nif Input.is_action_pressed("ui_down"):\n    sprite_y += speed',
      checks: ['is_action_pressed', 'speed', 'sprite_x', 'sprite_y'],
      height: 200,
      fills: {
        text: 'The sprite moves ___ pixels per frame. Godot\'s built-in action "ui_left" maps to the ___ arrow key.',
        answers: ['4', 'left']
      },
      quiz: {
        question: 'Why use action names like "ui_left" instead of key codes?',
        options: [
          'Action names are shorter to type',
          'Actions abstract input - you can remap keys, add gamepad support, or change bindings without touching game code',
          'Key codes are deprecated in Godot'
        ],
        correct: 1
      }
    },
    {
      num: 3,
      title: 'Rotation',
      goal: 'Make the sprite rotate smoothly while moving.',
      points: [
        'Rotation is measured in radians: a full turn is about 6.28 (2 * PI)',
        'Add a small amount each frame: <code>rotation += 0.1</code>',
        'Only rotate when the player is moving for a nice visual cue',
        'In Godot, every Node2D has a <code>rotation</code> property in radians'
      ],
      challenge: '🤖 Add rotation when moving:',
      starter: '# Rotate the sprite while any key is held\nvar is_moving = false\nif Input.is_action_pressed("ui_left") or Input.is_action_pressed("ui_right"):\n    is_moving = true\nif Input.is_action_pressed("ui_up") or Input.is_action_pressed("ui_down"):\n    is_moving = ___\n\nif is_moving:\n    rot += ___',
      solution: '# Rotate the sprite while any key is held\nvar is_moving = false\nif Input.is_action_pressed("ui_left") or Input.is_action_pressed("ui_right"):\n    is_moving = true\nif Input.is_action_pressed("ui_up") or Input.is_action_pressed("ui_down"):\n    is_moving = true\n\nif is_moving:\n    rot += 0.1',
      checks: ['is_moving', 'rot', '0.1', 'true'],
      height: 200,
      fills: {
        text: 'Rotation increases by ___ radians per frame. A full circle is about ___ radians.',
        answers: ['0.1', '6.28']
      },
      quiz: {
        question: 'Why measure rotation in radians instead of degrees?',
        options: [
          'Radians look more professional',
          'Math functions (sin, cos) expect radians - using them natively avoids conversion overhead in every frame',
          'Godot does not support degrees'
        ],
        correct: 1
      }
    },
    {
      num: 4,
      title: 'Motion Trail',
      goal: 'Leave a fading trail of ghost images behind the sprite.',
      points: [
        'Store past positions in an array: <code>trail.append(position)</code>',
        'Each trail entry has an alpha value that fades each frame',
        'Remove entries when alpha reaches 0 to keep the array small',
        'This technique is used for dash effects, bullet trails, and ghosts'
      ],
      challenge: '🤖 Manage the trail array:',
      starter: '# Fade each trail entry\nfor i in range(trail.length):\n    trail[i].a -= ___\n\n# Remove fully faded entries\nif trail.length > 0 and trail[0].a <= ___:\n    trail.remove(0)',
      solution: '# Fade each trail entry\nfor i in range(trail.length):\n    trail[i].a -= 0.03\n\n# Remove fully faded entries\nif trail.length > 0 and trail[0].a <= 0:\n    trail.remove(0)',
      checks: ['trail', '0.03', '0'],
      height: 140,
      fills: {
        text: 'Each trail ghost fades by ___ per frame. Removing spent entries prevents the array growing ___.',
        answers: ['0.03', 'forever']
      },
      quiz: {
        question: 'Why remove old trail entries instead of keeping them all?',
        options: [
          'Old entries change colour',
          'An ever-growing array wastes memory and makes the loop slower each frame - cleanup keeps performance constant',
          'GDScript arrays have a maximum size'
        ],
        correct: 1
      }
    },
    {
      num: 5,
      title: 'Collectibles',
      goal: 'Place golden coins for the sprite to collect on contact.',
      points: [
        'Five coins spawn at random positions across the scene',
        'Distance check: <code>sqrt(dx*dx + dy*dy) < radius</code> detects overlap',
        'On collect: mark the coin as got and increment the counter',
        'In Godot you would use Area2D.body_entered signal for pickup detection'
      ],
      challenge: '🤖 Write the coin collection check:',
      starter: '# Check each coin for pickup\nfor i in range(5):\n    if not coins[i].got:\n        var dx = sprite_x + sprite_w/2 - coins[i].x\n        var dy = sprite_y + sprite_h/2 - coins[i].y\n        if abs(dx) + abs(dy) < ___:\n            coins[i].got = ___\n            collected += 1',
      solution: '# Check each coin for pickup\nfor i in range(5):\n    if not coins[i].got:\n        var dx = sprite_x + sprite_w/2 - coins[i].x\n        var dy = sprite_y + sprite_h/2 - coins[i].y\n        if abs(dx) + abs(dy) < 40:\n            coins[i].got = true\n            collected += 1',
      checks: ['coins', 'got', 'collected', '40'],
      height: 180,
      fills: {
        text: 'The pickup radius of ___ pixels gives a generous hitbox. Manhattan distance (abs(dx) + abs(dy)) is ___ than Euclidean.',
        answers: ['40', 'faster']
      },
      quiz: {
        question: 'Why mark coins as "got" instead of removing them from the array?',
        options: [
          'Removing elements during iteration causes index bugs - a flag is safe and lets you reset all coins easily for replay',
          'GDScript cannot remove array items',
          'Flags use less memory'
        ],
        correct: 0
      }
    },
    {
      num: 6,
      title: 'Win Condition',
      goal: 'Show a victory message when all 5 coins are collected.',
      points: [
        'Check <code>collected >= 5</code> to trigger the win state',
        'Freeze player movement during the win screen',
        'Display a congratulations message with the option to restart',
        'Press R to reset coins and play again'
      ],
      challenge: '🤖 Write the win check:',
      starter: '# Check if all coins are collected\nif collected >= ___:\n    game_state = "___"\n\n# In Godot you would emit a signal:\n# signal all_coins_collected\n# emit_signal("all_coins_collected")',
      solution: '# Check if all coins are collected\nif collected >= 5:\n    game_state = "win"\n\n# In Godot you would emit a signal:\n# signal all_coins_collected\n# emit_signal("all_coins_collected")',
      checks: ['5', 'win', 'collected', 'game_state'],
      height: 160,
      fills: {
        text: 'The game ends when ___ coins are collected. The state changes to "___" to freeze movement.',
        answers: ['5', 'win']
      },
      quiz: {
        question: 'What is a state machine in game development?',
        options: [
          'A physical machine that runs the game',
          'A pattern where the game is always in one named state (play, win, menu) and each state has its own rules and transitions',
          'A type of AI algorithm'
        ],
        correct: 1
      }
    }
  ]
};
</script>
<script src="../workshop-canvas-engine.js"></script>
<script defer src="/feedback-widget.js"></script>
<script defer src="/jvds-funnel.js"></script>
