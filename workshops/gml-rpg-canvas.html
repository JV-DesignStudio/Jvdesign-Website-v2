<script>
'use strict';

/* ===================================================
   GML-to-JS transpiler (RPG edition)
   =================================================== */
function gmlToJs(code) {
  return code
    .replace(/\/\/\/.*/g, '//')
    .replace(/\bvar\b/g, 'let')
    .replace(/\bkeyboard_check\(vk_left\)/gi, 'leftHeld')
    .replace(/\bkeyboard_check\(vk_right\)/gi, 'rightHeld')
    .replace(/\bkeyboard_check\(vk_up\)/gi, 'upHeld')
    .replace(/\bkeyboard_check\(vk_down\)/gi, 'downHeld')
    .replace(/\bkeyboard_check_pressed\(vk_space\)/gi, 'spacePressed')
    .replace(/\bkeyboard_check_pressed\(ord\("(\w)"\)\)/g, function(_, k) { return k.toLowerCase() + 'Pressed'; })
    .replace(/\bkeyboard_check\(ord\("(\w)"\)\)/g, function(_, k) { return k.toLowerCase() + 'Held'; })
    .replace(/\bpoint_distance\(([^,]+),\s*([^,]+),\s*([^,]+),\s*([^)]+)\)/g,
      'Math.sqrt(($3-$1)*($3-$1)+($4-$2)*($4-$2))')
    .replace(/\bpoint_direction\(([^,]+),\s*([^,]+),\s*([^,]+),\s*([^)]+)\)/g,
      'Math.atan2(-($4-$2),$3-$1)')
    .replace(/\blengthdir_x\(([^,]+),\s*([^)]+)\)/g, '($1*Math.cos($2))')
    .replace(/\blengthdir_y\(([^,]+),\s*([^)]+)\)/g, '(-$1*Math.sin($2))')
    .replace(/\bclamp\(([^,]+),\s*([^,]+),\s*([^)]+)\)/g, 'Math.max($2, Math.min($3, $1))')
    .replace(/\babs\(/g, 'Math.abs(')
    .replace(/\bsign\(/g, 'Math.sign(')
    .replace(/\blerp\(([^,]+),\s*([^,]+),\s*([^)]+)\)/g, '($1+($2-$1)*$3)')
    .replace(/\bstring\(/g, 'String(')
    .replace(/\bjson_stringify\(/g, 'JSON.stringify(')
    .replace(/\bjson_parse\(/g, 'JSON.parse(')
    .replace(/\broom_height\b/g, '480')
    .replace(/\broom_width\b/g, '640')
    .replace(/\bglobal\.(\w+)/g, '$1')
    .replace(/\binstance_destroy\(\)/g, '/*destroy*/')
    .replace(/\broom_goto\([^)]*\)/g, '/*goto room*/')
    .replace(/\broom_goto_next\(\)/g, '/*next room*/');
}

/* ===================================================
   IFRAME BUILDING BLOCKS (top-down RPG)
   =================================================== */

var CSS_GAME = '<style>body{margin:0;overflow:hidden;background:#1a1a2e}canvas{display:block}</style>';
var CANVAS_TAG = '<canvas id="game" width="640" height="480"></canvas>';
var SETUP = 'const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");';

var KEYS = 'var leftHeld=false,rightHeld=false,upHeld=false,downHeld=false,spacePressed=false,zHeld=false,zPressed=false,rPressed=false;' +
  'document.addEventListener("keydown",function(e){' +
    'if(e.code==="ArrowLeft"||e.code==="KeyA")leftHeld=true;' +
    'if(e.code==="ArrowRight"||e.code==="KeyD")rightHeld=true;' +
    'if(e.code==="ArrowUp"||e.code==="KeyW")upHeld=true;' +
    'if(e.code==="ArrowDown"||e.code==="KeyS")downHeld=true;' +
    'if(e.code==="Space")spacePressed=true;' +
    'if(e.code==="KeyZ"){zHeld=true;zPressed=true}' +
    'if(e.code==="KeyR")rPressed=true;' +
    'e.preventDefault()});' +
  'document.addEventListener("keyup",function(e){' +
    'if(e.code==="ArrowLeft"||e.code==="KeyA")leftHeld=false;' +
    'if(e.code==="ArrowRight"||e.code==="KeyD")rightHeld=false;' +
    'if(e.code==="ArrowUp"||e.code==="KeyW")upHeld=false;' +
    'if(e.code==="ArrowDown"||e.code==="KeyS")downHeld=false;' +
    'if(e.code==="KeyZ")zHeld=false});';

var PLAYER_VARS = 'var px=320,py=380,pw=28,ph=28,spd=3,facing="down",hp=3,maxHp=3,iframes=0,attackTimer=0;';

var NPC = 'var npcs=[{x:300,y:160,w:28,h:28,msg:"The forest to the north is dangerous. Take this sword!",color:"#60a5fa"},' +
  '{x:500,y:300,w:28,h:28,msg:"Press Z to attack nearby enemies!",color:"#a78bfa"}];';

var ENEMIES = 'var enemies=[{x:200,y:100,w:28,h:28,hp:2,spd:1,state:"idle",timer:60,color:"#ef4444"},' +
  '{x:450,y:80,w:28,h:28,hp:2,spd:1,state:"idle",timer:90,color:"#ef4444"},' +
  '{x:100,y:200,w:28,h:28,hp:2,spd:1.2,state:"idle",timer:40,color:"#f97316"}];';

var WALLS = 'var walls=[{x:0,y:0,w:640,h:16},{x:0,y:464,w:640,h:16},{x:0,y:0,w:16,h:480},{x:624,y:0,w:16,h:480},' +
  '{x:100,y:240,w:80,h:16},{x:400,y:200,w:16,h:80},{x:250,y:380,w:120,h:16}];';

var TILES_BG = 'ctx.fillStyle="#2d5a27";ctx.fillRect(0,0,640,480);' +
  'ctx.fillStyle="#234d1e";for(var tx=0;tx<640;tx+=32)for(var ty=0;ty<480;ty+=32){if((tx+ty)%64===0)ctx.fillRect(tx,ty,32,32)}';

var DRAW_WALLS = 'ctx.fillStyle="#5c4033";walls.forEach(function(w){ctx.fillRect(w.x,w.y,w.w,w.h)});';
var DRAW_PLAYER = 'if(iframes>0&&Math.floor(iframes/3)%2===0){}else{ctx.fillStyle="#fb923c";ctx.fillRect(px-pw/2,py-ph/2,pw,ph);' +
  'ctx.fillStyle="#fff";var ex=facing==="left"?-5:facing==="right"?5:0,ey=facing==="up"?-5:facing==="down"?5:0;' +
  'ctx.fillRect(px+ex-2,py+ey-2,4,4)}';
var DRAW_NPCS = 'npcs.forEach(function(n){ctx.fillStyle=n.color;ctx.fillRect(n.x-n.w/2,n.y-n.h/2,n.w,n.h);' +
  'ctx.fillStyle="#fff";ctx.font="bold 10px monospace";ctx.textAlign="center";ctx.fillText("?",n.x,n.y-18)});';
var DRAW_ENEMIES = 'enemies.forEach(function(e){ctx.fillStyle=e.color;ctx.fillRect(e.x-e.w/2,e.y-e.h/2,e.w,e.h);' +
  'ctx.fillStyle="#222";ctx.fillRect(e.x-3,e.y-3,6,6);' +
  'ctx.fillStyle="#ef4444";for(var i=0;i<e.hp;i++){ctx.fillRect(e.x-8+i*10,e.y-e.h/2-6,8,3)}});';

var DRAW_HEARTS = 'for(var hi=0;hi<maxHp;hi++){ctx.fillStyle=hi<hp?"#ef4444":"#333";ctx.fillRect(20+hi*24,20,18,16)}';
var DRAW_ATTACK = 'if(attackTimer>0){var ax=px,ay=py;if(facing==="up")ay-=30;if(facing==="down")ay+=30;if(facing==="left")ax-=30;if(facing==="right")ax+=30;' +
  'ctx.strokeStyle="#fbbf24";ctx.lineWidth=3;ctx.beginPath();ctx.arc(ax,ay,16,0,Math.PI*2);ctx.stroke()}';

var WALL_COLLIDE = 'function wallCollide(tx,ty){for(var i=0;i<walls.length;i++){var w=walls[i];if(tx+pw/2>w.x&&tx-pw/2<w.x+w.w&&ty+ph/2>w.y&&ty-ph/2<w.y+w.h)return true}return false}';

var DIALOGUE = 'var dlgText="",dlgTimer=0,dlgChar=0,dlgFull="";' +
  'function startDialogue(msg){dlgFull=msg;dlgText="";dlgChar=0;dlgTimer=120}' +
  'function updateDialogue(){if(dlgTimer>0){dlgTimer--;if(dlgChar<dlgFull.length){dlgText+=dlgFull[dlgChar];dlgChar++}}}' +
  'function drawDialogue(){if(dlgTimer>0){ctx.fillStyle="rgba(0,0,0,0.85)";ctx.fillRect(40,380,560,80);ctx.strokeStyle="#fbbf24";ctx.lineWidth=2;ctx.strokeRect(40,380,560,80);' +
  'ctx.fillStyle="#fff";ctx.font="14px monospace";ctx.textAlign="left";ctx.fillText(dlgText,60,420)}}';

function wrap(code) {
  return '<!DOCTYPE html><html><head><meta charset="UTF-8">' + CSS_GAME +
    '<\/head><body>' + CANVAS_TAG + '<script>' + code + '<\/script><\/body><\/html>';
}


/* ===================================================

window.CW_CONFIG = {

        'function loop(){' +
        'var mx=(rightHeld?1:0)-(leftHeld?1:0),my=(downHeld?1:0)-(upHeld?1:0);' +
        'if(mx!==0&&my!==0){mx*=0.707;my*=0.707}' +
        'var nx=px+mx*spd,ny=py+my*spd;' +
        'if(!wallCollide(nx,py))px=nx;if(!wallCollide(px,ny))py=ny;' +
        'if(mx<0)facing="left";if(mx>0)facing="right";if(my<0)facing="up";if(my>0)facing="down";' +
        TILES_BG + DRAW_WALLS + DRAW_PLAYER +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    2: function(u) {
      return wrap(

        'try{' + gmlToJs(u) + '}catch(e){}' +
        'function loop(){' +
        'var mx=(rightHeld?1:0)-(leftHeld?1:0),my=(downHeld?1:0)-(upHeld?1:0);' +
        'if(mx!==0&&my!==0){mx*=0.707;my*=0.707}' +

        'if(!wallCollide(nx,py))px=nx;if(!wallCollide(px,ny))py=ny;' +

        'if(spacePressed){for(var ni=0;ni<npcs.length;ni++){var n=npcs[ni];if(Math.abs(px-n.x)<40&&Math.abs(py-n.y)<40){startDialogue(n.msg)}}}' +
        'updateDialogue();spacePressed=false;' +
        TILES_BG + DRAW_WALLS + DRAW_NPCS + DRAW_PLAYER + 'drawDialogue();' +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'

    },
    3: function(u) {
      return wrap(
        SETUP + KEYS + PLAYER_VARS + WALLS + NPC + ENEMIES + WALL_COLLIDE + DIALOGUE +
        'try{' + gmlToJs(u) + '}catch(e){}' +
        'function loop(){' +
        'var mx=(rightHeld?1:0)-(leftHeld?1:0),my=(downHeld?1:0)-(upHeld?1:0);' +
        'if(mx!==0&&my!==0){mx*=0.707;my*=0.707}' +
        'var nx=px+mx*spd,ny=py+my*spd;' +
        'if(!wallCollide(nx,py))px=nx;if(!wallCollide(px,ny))py=ny;' +
        'if(mx<0)facing="left";if(mx>0)facing="right";if(my<0)facing="up";if(my>0)facing="down";' +
        'enemies.forEach(function(e){var dist=Math.sqrt((px-e.x)*(px-e.x)+(py-e.y)*(py-e.y));' +
        'if(e.state==="idle"){e.timer--;if(e.timer<=0){e.timer=60+Math.random()*60;e.state="wander";e.wx=e.x+(Math.random()-0.5)*80;e.wy=e.y+(Math.random()-0.5)*80}' +
        'if(dist<120)e.state="chase"}' +
        'else if(e.state==="wander"){var dx=e.wx-e.x,dy=e.wy-e.y,d=Math.sqrt(dx*dx+dy*dy);if(d>2){e.x+=dx/d*e.spd*0.5;e.y+=dy/d*e.spd*0.5}else e.state="idle";' +
        'if(dist<120)e.state="chase"}' +

        'if(dist>200)e.state="idle"}});' +
        'if(spacePressed){for(var ni=0;ni<npcs.length;ni++){var n=npcs[ni];if(Math.abs(px-n.x)<40&&Math.abs(py-n.y)<40){startDialogue(n.msg)}}}' +
        'updateDialogue();spacePressed=false;' +
        TILES_BG + DRAW_WALLS + DRAW_NPCS + DRAW_ENEMIES + DRAW_PLAYER + 'drawDialogue();' +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    4: function(u) {
      return wrap(
        SETUP + KEYS + PLAYER_VARS + WALLS + NPC + ENEMIES + WALL_COLLIDE + DIALOGUE +
        'try{' + gmlToJs(u) + '}catch(e){}' +
        'function loop(){' +
        'var mx=(rightHeld?1:0)-(leftHeld?1:0),my=(downHeld?1:0)-(upHeld?1:0);' +
        'if(mx!==0&&my!==0){mx*=0.707;my*=0.707}' +
        'var nx=px+mx*spd,ny=py+my*spd;' +
        'if(!wallCollide(nx,py))px=nx;if(!wallCollide(px,ny))py=ny;' +
        'if(mx<0)facing="left";if(mx>0)facing="right";if(my<0)facing="up";if(my>0)facing="down";' +
        'if(iframes>0)iframes--;' +
        'if(attackTimer>0)attackTimer--;' +
        'if(zPressed&&attackTimer<=0){attackTimer=15;' +
        'var ax=px,ay=py;if(facing==="up")ay-=30;if(facing==="down")ay+=30;if(facing==="left")ax-=30;if(facing==="right")ax+=30;' +
        'for(var ei=enemies.length-1;ei>=0;ei--){var e=enemies[ei];if(Math.abs(ax-e.x)<24&&Math.abs(ay-e.y)<24){e.hp--;if(e.hp<=0)enemies.splice(ei,1)}}}' +

        'else if(e.state==="wander"){var dx=e.wx-e.x,dy=e.wy-e.y,d=Math.sqrt(dx*dx+dy*dy);if(d>2){e.x+=dx/d*e.spd*0.5;e.y+=dy/d*e.spd*0.5}else e.state="idle";' +
        'if(dist<120)e.state="chase"}' +
        'else if(e.state==="chase"){var dx=px-e.x,dy=py-e.y,d=Math.sqrt(dx*dx+dy*dy);if(d>2){e.x+=dx/d*e.spd;e.y+=dy/d*e.spd}' +
        'if(dist<20&&iframes<=0){hp--;iframes=45;if(hp<=0){px=320;py=380;hp=maxHp}}' +
        'if(dist>200)e.state="idle"}});' +
        'if(spacePressed){for(var ni=0;ni<npcs.length;ni++){var n=npcs[ni];if(Math.abs(px-n.x)<40&&Math.abs(py-n.y)<40){startDialogue(n.msg)}}}' +
        'updateDialogue();spacePressed=false;zPressed=false;' +
        TILES_BG + DRAW_WALLS + DRAW_NPCS + DRAW_ENEMIES + DRAW_PLAYER + DRAW_ATTACK + DRAW_HEARTS + 'drawDialogue();' +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    5: function(u) {
      return wrap(
        SETUP + KEYS + PLAYER_VARS + WALLS + NPC + ENEMIES + WALL_COLLIDE + DIALOGUE +
        'var warp={x:600,y:240,w:24,h:40,targetX:40,targetY:240,room:2,color:"#a855f7"};var currentRoom=1;' +
        'try{' + gmlToJs(u) + '}catch(e){}' +
        'function loop(){' +
        'var mx=(rightHeld?1:0)-(leftHeld?1:0),my=(downHeld?1:0)-(upHeld?1:0);' +
        'if(mx!==0&&my!==0){mx*=0.707;my*=0.707}' +
        'var nx=px+mx*spd,ny=py+my*spd;' +
        'if(!wallCollide(nx,py))px=nx;if(!wallCollide(px,ny))py=ny;' +
        'if(mx<0)facing="left";if(mx>0)facing="right";if(my<0)facing="up";if(my>0)facing="down";' +
        'if(iframes>0)iframes--;' +
        'if(attackTimer>0)attackTimer--;' +

        'var ax=px,ay=py;if(facing==="up")ay-=30;if(facing==="down")ay+=30;if(facing==="left")ax-=30;if(facing==="right")ax+=30;' +

    6: function(u) {
