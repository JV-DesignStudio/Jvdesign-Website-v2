'use strict';

/* ===================================================
   Java-to-JS transpiler (light transform so Java
   syntax runs in the canvas iframe)
   =================================================== */
function javaToJs(code) {
  return code
    // Java method declaration -> JS function: strip the return type plus any
    // Java parameter types, so "boolean hasItem(String itemName) {" becomes
    // "function hasItem(itemName) {". Must run before the type replacements.
    .replace(/\b(?:public\s+|private\s+|protected\s+|static\s+)*(?:int|boolean|double|float|long|char|void|String\[\]|String)\s+(\w+)\s*\(([^)]*)\)\s*\{/g,
      function (m, name, params) {
        var args = params.split(',').map(function (p) {
          return p.trim().replace(/^(?:int|boolean|double|float|long|char|String\[\]|String)\s+/, '');
        }).filter(Boolean).join(', ');
        return 'function ' + name + '(' + args + ') {';
      })
    .replace(/\bnew\s+String\[\]\s*\{([^}]*)\}/g, '[$1]')
    .replace(/\b(int|boolean|double|float|long|char)\s+/g, 'let ')
    .replace(/\bString\[\]\s+/g, 'let ')
    .replace(/\bString\s+/g, 'let ')
    .replace(/\bRectangle\s+/g, 'let ')
    // Java string equality -> strict JS equality: a.equals(b) -> (a === b)
    .replace(/([\w.\[\]()]+)\.equals\(([^()]*)\)/g, '($1 === $2)')
    // for-each with a declared type: for (Item it : inventory) -> for (const it of inventory)
    .replace(/\bfor\s*\(\s*(?:int|boolean|double|float|long|char|Item|String\[\]|String)\s+(\w+)\s*:\s*([\w.\[\]()]+)\s*\)/g, 'for (const $1 of $2)')
    .replace(/\bfor\s*\(\s*let\s+(\w+)\s*:\s*(\w+)\s*\)/g, 'for (const $1 of $2)')
    .replace(/\.size\(\)/g, '.length')
    .replace(/\.get\(([^)]+)\)/g, '[$1]')
    .replace(/\.remove\(([^)]+)\)/g, '.splice($1, 1)')
    .replace(/System\.out\.println\(/g, 'console.log(') + '\n';
}

/* ---- Gate & Key ---- */

/* ---- Boss fight ---- */
var BOSS_VARS =
  'let bossHp=80,bossMaxHp=80,bossAttack=9,heroHp=30,heroMaxHp=30,heroAttack=5;' +
  'let bossPhase=1,enraged=false;let bossTurn=false;' +
  'let battleLog="The Dragon roars!";let battleAnim=0;' +

var DRAW_BOSS_SCENE =
  'function drawBossScene(){' +
    'ctx.fillStyle="#1a0a14";ctx.fillRect(0,0,500,400);' +
    'ctx.fillStyle="#2d1520";for(let i=0;i<500;i+=50){ctx.fillRect(i,350,48,50)}' +
    'ctx.fillStyle="#331a00";ctx.fillRect(0,340,500,4);' +
    'for(let i=0;i<8;i++){ctx.fillStyle="rgba(255,80,0,"+(0.03+Math.random()*0.04)+")";ctx.fillRect(Math.random()*500,Math.random()*200+100,60,40)}' +
  '}';

var DRAW_BOSS =
  'function drawBoss(){' +
    'let bx=320,by=100,bw=80,bh=100;' +
    'ctx.fillStyle=bossFlash>0?(bossFlash%4<2?"#fff":"#ff4444"):(enraged?"#ff4400":"#cc2222");' +
    'ctx.fillRect(bx,by,bw,bh);' +
    'ctx.fillStyle="#ffcc00";ctx.beginPath();ctx.moveTo(bx+20,by+25);ctx.arc(bx+20,by+25,8,0,Math.PI*2);ctx.fill();' +
    'ctx.beginPath();ctx.moveTo(bx+60,by+25);ctx.arc(bx+60,by+25,8,0,Math.PI*2);ctx.fill();' +
    'ctx.fillStyle="#ff6600";ctx.beginPath();ctx.moveTo(bx+25,by+55);ctx.lineTo(bx+40,by+70);ctx.lineTo(bx+55,by+55);ctx.fill();' +
    'ctx.fillStyle=enraged?"#ff6600":"#fff";ctx.font="bold 14px Arial";ctx.textAlign="center";' +
    'ctx.fillText(enraged?"ENRAGED DRAGON":"Dragon",bx+bw/2,by-10);' +
    'if(enraged){ctx.fillStyle="#ff4400";ctx.font="bold 11px Arial";ctx.fillText("Phase "+bossPhase,bx+bw/2,by-24)}' +
    'ctx.fillStyle="#333";ctx.fillRect(bx,by+bh+8,bw,10);' +
    'ctx.fillStyle=enraged?"#ff6600":"#ef4444";ctx.fillRect(bx,by+bh+8,bw*(bossHp/bossMaxHp),10);' +
    'ctx.fillStyle="#fff";ctx.font="11px Arial";ctx.fillText(bossHp+"/"+bossMaxHp,bx+bw/2,by+bh+17);' +
    'if(bossFlash>0)bossFlash--;' +
  '}';

var DRAW_BATTLE_HERO =
  'function drawBattleHero(){' +
    'let hx=80,hy=220,hw=40,hh=50;' +
    'ctx.fillStyle=heroFlash>0?(heroFlash%4<2?"#fff":"#ff7700"):"#ff7700";' +
    'ctx.fillRect(hx,hy,hw,hh);' +
    'ctx.fillStyle="#ffaa44";ctx.fillRect(hx+10,hy+6,20,14);' +
    'ctx.fillStyle="#fff";ctx.font="bold 14px Arial";ctx.textAlign="center";ctx.fillText("Hero",hx+hw/2,hy-10);' +
    'ctx.fillStyle="#333";ctx.fillRect(hx,hy+hh+8,hw+40,10);' +
    'ctx.fillStyle="#06d6a0";ctx.fillRect(hx,hy+hh+8,(hw+40)*(heroHp/heroMaxHp),10);' +
    'ctx.fillStyle="#fff";ctx.font="11px Arial";ctx.fillText(heroHp+"/"+heroMaxHp,hx+40,hy+hh+17);' +

  'function drawBattleUI(){' +
    'ctx.fillStyle="rgba(0,0,0,0.8)";ctx.fillRect(20,320,460,70);' +
    'ctx.strokeStyle="#ffd166";ctx.lineWidth=1;ctx.strokeRect(20,320,460,70);' +

/* ---- Victory / ending ---- */
var VICTORY_VARS = 'let victoryTimer=0;let scrollY=0;';

var DRAW_VICTORY =
  'function drawVictory(stats){' +
    'victoryTimer++;scrollY=Math.min(victoryTimer*0.5,120);' +
    'ctx.fillStyle="#0f0a19";ctx.fillRect(0,0,500,400);' +
    'for(let i=0;i<30;i++){ctx.fillStyle="rgba(255,209,102,"+(0.2+Math.random()*0.3)+")";' +

    'ctx.fillText("THE REALM IS SAVED!",250,80-scrollY+120);' +
    'ctx.fillStyle="#fff";ctx.font="20px Arial";' +
    'ctx.fillText(stats.name+", Level "+stats.level,250,130-scrollY+120);' +
    'ctx.font="16px Arial";ctx.fillStyle="#ccc";' +

function wrap(code) {
  return '<!DOCTYPE html><html><head><meta charset="UTF-8">' + CSS_GAME +
    '<\/head><body>' + CANVAS_TAG + '<script>' + code + '<\/script><\/body><\/html>';
