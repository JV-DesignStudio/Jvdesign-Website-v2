<script>
'use strict';

/* ===================================================
   C++-to-JS transpiler (light transform so C++
   syntax runs in the canvas iframe)
   =================================================== */
function cppToJs(code) {
  return code
    .replace(/\b(int|float|double|bool|char|auto|unsigned|long)\s+/g, 'let ')
    .replace(/\bconst\s+let\s+/g, 'const ')
    .replace(/\bstd::string\s+/g, 'let ')
    .replace(/\bstd::cout\s*<<\s*/g, 'console.log(')
    .replace(/\bstd::endl/g, '"\\n")')
    .replace(/\bstd::abs\(/g, 'Math.abs(')
    .replace(/\bstd::max\(/g, 'Math.max(')
    .replace(/\bstd::min\(/g, 'Math.min(')
    .replace(/\.f\b/g, '')
    .replace(/\bfor\s*\(\s*let\s+(\w+)\s*:\s*(\w+)\s*\)/g, 'for (const $1 of $2)')
    .replace(/\.size\(\)/g, '.length')
    .replace(/\.push_back\(/g, '.push(');
}

/* ===================================================
   IFRAME BUILDING BLOCKS (C++ Platformer)
   =================================================== */

var CSS_GAME = '<style>body{display:flex;flex-direction:column;align-items:center;background:#191e3c;margin:0;overflow:hidden}canvas{display:block;cursor:pointer}</style>';

var CANVAS_TAG = '<canvas id="game" width="600" height="400"></canvas>';

var SETUP = 'const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");';

var PLAYER_VARS = 'let px=80,py=340,pw=30,ph=36,pvx=0,pvy=0,onGround=false;';

var GRAVITY = 'const GRAV=1200,JUMP_VEL=-460,MOVE_SPEED=220;';

var PLATFORMS = 'const platforms=[{x:0,y:380,w:600,h:20},{x:120,y:300,w:100,h:14},{x:300,y:240,w:120,h:14},{x:480,y:180,w:100,h:14},{x:200,y:140,w:100,h:14},{x:50,y:80,w:120,h:14}];';

var COINS = 'let coins=[{x:155,y:274,s:14},{x:345,y:214,s:14},{x:515,y:154,s:14},{x:235,y:114,s:14},{x:95,y:54,s:14}];';

var SCORE_VARS = 'let score=0;';

var STATE_VARS = 'let gameState="play";';

var KEYS = 'let leftHeld=false,rightHeld=false,spaceHeld=false;' +
  'document.addEventListener("keydown",function(e){' +
    'if(e.code==="ArrowLeft"||e.code==="KeyA")leftHeld=true;' +
    'if(e.code==="ArrowRight"||e.code==="KeyD")rightHeld=true;' +
    'if(e.code==="Space")spaceHeld=true;' +
    'e.preventDefault()});' +
  'document.addEventListener("keyup",function(e){' +
    'if(e.code==="ArrowLeft"||e.code==="KeyA")leftHeld=false;' +
    'if(e.code==="ArrowRight"||e.code==="KeyD")rightHeld=false;' +
    'if(e.code==="Space")spaceHeld=false});';

var MOVE_PLAYER = 'pvx=0;if(leftHeld)pvx=-MOVE_SPEED;if(rightHeld)pvx=MOVE_SPEED;';

var APPLY_GRAVITY = 'pvy+=GRAV/60;py+=pvy/60;px+=pvx/60;';

var CLAMP_X = 'if(px<0)px=0;if(px+pw>600)px=600-pw;';

var GROUND_CHECK = 'onGround=false;for(var i=0;i<platforms.length;i++){var p=platforms[i];if(px+pw>p.x&&px<p.x+p.w&&py+ph>=p.y&&py+ph<=p.y+p.h+pvy/60+2&&pvy>=0){py=p.y-ph;pvy=0;onGround=true;}}';

var JUMP_LOGIC = 'if(spaceHeld&&onGround){pvy=JUMP_VEL;spaceHeld=false;}';

var DRAW_BG = 'ctx.fillStyle="#191e3c";ctx.fillRect(0,0,600,400);';

var DRAW_PLATFORMS = 'ctx.fillStyle="#06d6a0";for(var i=0;i<platforms.length;i++){var p=platforms[i];ctx.fillRect(p.x,p.y,p.w,p.h);}';

var DRAW_PLAYER = 'ctx.fillStyle="#ff7700";ctx.fillRect(px,py,pw,ph);';

var DRAW_COINS = 'ctx.fillStyle="#ffd166";for(var i=0;i<coins.length;i++){var c=coins[i];ctx.fillRect(c.x,c.y,c.s,c.s);}';

var DRAW_SCORE = 'ctx.fillStyle="#fff";ctx.font="bold 20px monospace";ctx.textAlign="left";ctx.fillText("Score: "+score,16,30);';

var COIN_COLLECT = 'for(var i=coins.length-1;i>=0;i--){var c=coins[i];if(px+pw>c.x&&px<c.x+c.s&&py+ph>c.y&&py<c.y+c.s){coins.splice(i,1);score+=10;}}';

var RESPAWN = 'if(py>420){px=80;py=340;pvy=0;}';

function wrap(code) {
  return '<!DOCTYPE html><html><head><meta charset="UTF-8">' + CSS_GAME +
    '<\/head><body>' + CANVAS_TAG + '<script>' + code + '<\/script><\/body><\/html>';
}

/* ===================================================
   CW_CONFIG - C++ Platformer steps + templates
   =================================================== */

window.CW_CONFIG = {
  storageKey: 'jvds-cpp-platformer-canvas',
  downloadName: 'my-cpp-platformer.html',

  hints: [
    'An orange player standing on a green ground platform',
    'The player slides left and right, gravity pulls it down',
    'Press Space to jump up from the ground',
    'Floating green platforms the player can land on',
    'Gold coins appear above platforms with a score counter',
    'Collect all coins to win, fall off to respawn'

  templates: {
    1: function(u) {
      return wrap(
        SETUP + PLAYER_VARS + GRAVITY + PLATFORMS +
        'try{eval(' + JSON.stringify(cppToJs(u)) + ')}catch(e){}' +
        'function loop(){' +
        DRAW_BG + DRAW_PLATFORMS + DRAW_PLAYER +

    },
    2: function(u) {
      return wrap(
        SETUP + PLAYER_VARS + GRAVITY + PLATFORMS + KEYS +

        MOVE_PLAYER +

        CLAMP_X +
        GROUND_CHECK +
        DRAW_BG + DRAW_PLATFORMS + DRAW_PLAYER +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    3: function(u) {
      return wrap(
        SETUP + PLAYER_VARS + GRAVITY + PLATFORMS + KEYS +
        'function loop(){' +
        MOVE_PLAYER + APPLY_GRAVITY + CLAMP_X +
        GROUND_CHECK +
        'try{eval(' + JSON.stringify(cppToJs(u)) + ')}catch(e){}' +
        DRAW_BG + DRAW_PLATFORMS + DRAW_PLAYER +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    4: function(u) {
      return wrap(
        SETUP + PLAYER_VARS + GRAVITY + PLATFORMS + KEYS +
        'function loop(){' +
        MOVE_PLAYER + APPLY_GRAVITY + CLAMP_X +
        'try{eval(' + JSON.stringify(cppToJs(u)) + ')}catch(e){}' +
        JUMP_LOGIC + RESPAWN +
        DRAW_BG + DRAW_PLATFORMS + DRAW_PLAYER +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    5: function(u) {
      return wrap(
        SETUP + PLAYER_VARS + GRAVITY + PLATFORMS + COINS + SCORE_VARS + KEYS +
        'function loop(){' +
        MOVE_PLAYER + APPLY_GRAVITY + CLAMP_X +
        GROUND_CHECK + JUMP_LOGIC + RESPAWN +
        'try{eval(' + JSON.stringify(cppToJs(u)) + ')}catch(e){}' +
        DRAW_BG + DRAW_PLATFORMS + DRAW_PLAYER + DRAW_COINS + DRAW_SCORE +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    6: function(u) {
      return wrap(
        SETUP + PLAYER_VARS + GRAVITY + PLATFORMS + COINS + SCORE_VARS + STATE_VARS + KEYS +
        'document.addEventListener("keydown",function(e){if(e.code==="KeyR"&&gameState==="won"){score=0;px=80;py=340;pvy=0;pvx=0;coins=[{x:155,y:274,s:14},{x:345,y:214,s:14},{x:515,y:154,s:14},{x:235,y:114,s:14},{x:95,y:54,s:14}];gameState="play"}});' +
        'function loop(){' +
        'if(gameState==="play"){' +
        MOVE_PLAYER + APPLY_GRAVITY + CLAMP_X +
        GROUND_CHECK + JUMP_LOGIC + RESPAWN +
        COIN_COLLECT +
        'try{eval(' + JSON.stringify(cppToJs(u)) + ')}catch(e){}' +
        '}' +
        DRAW_BG + DRAW_PLATFORMS + DRAW_PLAYER + DRAW_COINS + DRAW_SCORE +
        'if(gameState==="won"){ctx.fillStyle="#fff";ctx.font="bold 32px monospace";ctx.textAlign="center";' +
        'ctx.fillText("YOU WIN!",300,180);' +
        'ctx.font="18px monospace";ctx.fillText("Score: "+score,300,215);' +
        'ctx.fillText("Press R to play again",300,245)}' +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    }
  },

  steps: [
    {
      num: 1,
      title: 'Player & Ground',
      goal: 'Draw an orange player rectangle standing on a green ground platform.',
      points: [
        'The canvas is 600×400 pixels with a dark blue background',
        'The ground platform spans the full width at y=380, 600 wide and 20 tall, drawn in green (#06d6a0)',
        'The player is an orange rectangle (#ff7700) at position (80, 340), 30 wide and 36 tall',
        'In real C++ you would use <code>sf::RectangleShape</code> for both  -  here the canvas engine draws them for you'
      ],
      challenge: '⚙️ Set the player’s starting position and size:',
      starter: '// Set the player starting position\nfloat px = ___;\nfloat py = ___;\n\n// Player dimensions\nint pw = 30;\nint ph = ___;',
      solution: '// Set the player starting position\nfloat px = 80;\nfloat py = 340;\n\n// Player dimensions\nint pw = 30;\nint ph = 36;',
      checks: ['80', '340', '36'],
      height: 160,
      fills: {
        text: 'The player starts at x=80, y=___ so it sits just above the ground platform at y=380. The player is ___ pixels tall.',
        answers: ['340', '36']
      },
      quiz: {
        question: 'Why is the player’s y position 340 when the ground is at 380?',
        options: [
          'It is a random number',
          'Ground y (380) minus player height (36) ≈ 344, so the player’s feet touch the ground  -  we use 340 for a small gap',
          'The player floats above the ground by design'
        ],
        correct: 1
      }
    },
    {
      num: 2,
      title: 'Movement & Gravity',
      goal: 'Move the player left and right with arrow keys while gravity pulls it down each frame.',
      points: [
        'Each frame: add gravity to vertical velocity <code>pvy += GRAV / 60</code>, then move the player by velocity / 60',
        'Left and right arrows set horizontal velocity to ±220 px/sec',
        'In real C++ you would multiply by <code>dt</code> (delta time)  -  here we divide by 60 for a fixed 60 fps timestep',
        'Clamp <code>px</code> between 0 and 570 so the player stays on screen'
      ],
      challenge: '⚙️ Write gravity and movement each frame:',
      starter: '// Apply gravity each frame\npvy += ___ / 60;\n\n// Move the player\npy += pvy / 60;\npx += ___ / 60;\n\n// Clamp to screen\nif (px < 0) px = 0;\nif (px + pw > 600) px = 600 - ___;',
      solution: '// Apply gravity each frame\npvy += GRAV / 60;\n\n// Move the player\npy += pvy / 60;\npx += pvx / 60;\n\n// Clamp to screen\nif (px < 0) px = 0;\nif (px + pw > 600) px = 600 - pw;',
      checks: ['grav', 'pvx', 'pw'],
      height: 220,
      fills: {
        text: 'Gravity is a constant acceleration of ___ px/sec². Dividing by 60 converts per-second values to per-___ values.',
        answers: ['1200', 'frame']
      },
      quiz: {
        question: 'Why divide velocity by 60 instead of using it directly?',
        options: [
          'To make the game slower',
          'Velocity is in pixels per SECOND but the loop runs 60 times per second  -  dividing converts to pixels per frame',
          'It prevents integer overflow'
        ],
        correct: 1
      }
    },
    {
      num: 3,
      title: 'Jumping',
      goal: 'Press Space to jump, but only when standing on the ground.',
      points: [
        'Jump: set <code>pvy = JUMP_VEL</code> (−460)  -  negative because up is negative y on canvas',
        'Only allow jumping when <code>onGround</code> is true, otherwise the player could fly',
        'After jumping, set <code>spaceHeld = false</code> to consume the input so holding Space doesn’t re-jump',
        'In real C++ you would check <code>sf::Keyboard::isKeyPressed(sf::Keyboard::Key::Space)</code> with a flag'
      ],
      challenge: '⚙️ Write the jump logic:',
      starter: '// Jump when Space pressed and on ground\nif (spaceHeld && ___) {\n    pvy = ___;\n    spaceHeld = ___;\n}',
      solution: '// Jump when Space pressed and on ground\nif (spaceHeld && onGround) {\n    pvy = JUMP_VEL;\n    spaceHeld = false;\n}',
      checks: ['onground', 'jump_vel', 'false'],
      height: 150,
      fills: {
        text: 'The jump velocity is ___ (negative means upward). Setting spaceHeld to false after jumping prevents ___ jumps.',
        answers: ['-460', 'double']
      },
      quiz: {
        question: 'Why must we check onGround before allowing a jump?',
        options: [
          'To save CPU time',
          'Without the check the player could press Space mid-air and jump again infinitely  -  flying instead of jumping',
          'The keyboard would break'
        ],
        correct: 1
      }
    },
    {
      num: 4,
      title: 'Platforms & Landing',
      goal: 'Add floating platforms and detect when the player lands on them from above.',
      points: [
        'Each platform is an object with x, y, w, h  -  the ground is just the first platform in the array',
        'Landing check: player overlaps platform horizontally AND player bottom reaches platform top AND player is falling (pvy ≥ 0)',
        'On landing: snap the player on top (<code>py = platform.y - ph</code>), zero vertical velocity, set <code>onGround = true</code>',
        'The <code>pvy >= 0</code> check lets the player jump UP through platforms  -  a classic one-way platform rule'
      ],
      challenge: '⚙️ Write the platform collision loop:',
      starter: '// Check each platform for landing\nonGround = false;\nfor (int i = 0; i < platforms.size(); i++) {\n    auto p = platforms[i];\n    if (px + pw > p.x && px < p.x + p.w &&\n        py + ph >= p.y && py + ph <= p.y + p.h + 4 &&\n        pvy >= ___) {\n        py = p.y - ___;\n        pvy = ___;\n        onGround = true;\n    }\n}',
      solution: '// Check each platform for landing\nonGround = false;\nfor (int i = 0; i < platforms.size(); i++) {\n    auto p = platforms[i];\n    if (px + pw > p.x && px < p.x + p.w &&\n        py + ph >= p.y && py + ph <= p.y + p.h + 4 &&\n        pvy >= 0) {\n        py = p.y - ph;\n        pvy = 0;\n        onGround = true;\n    }\n}',
      checks: ['onground', 'pvy', 'p.y', 'ph'],
      height: 280,
      fills: {
        text: 'Setting onGround to ___ at the start of each frame means the player is airborne unless a platform proves otherwise. The check <code>pvy >= 0</code> means landing only works while ___.',
        answers: ['false', 'falling']
      },
      quiz: {
        question: 'What does the pvy >= 0 check achieve for gameplay?',
        options: [
          'It makes the game harder',
          'It creates one-way platforms  -  the player can jump up through them but lands on top when falling',
          'It prevents horizontal movement'
        ],
        correct: 1
      }
    },
    {
      num: 5,
      title: 'Coins & Score',
      goal: 'Place collectible gold coins above platforms and track the score.',
      points: [
        'Coins are small gold squares (14×14) placed above each floating platform',
        'Collision: if the player rectangle overlaps a coin rectangle, remove the coin and add 10 points',
        'Loop backwards when removing items from an array to avoid skipping elements',
        'In real C++ you would use <code>std::erase_if</code> or the erase-remove idiom on a <code>std::vector</code>'
      ],
      challenge: '⚙️ Write the coin collection logic:',
      starter: '// Collect coins the player touches\nfor (int i = coins.size() - 1; i >= 0; i--) {\n    auto c = coins[i];\n    if (px + pw > c.x && px < c.x + c.s &&\n        py + ph > c.y && py < c.y + c.s) {\n        coins.erase(i);\n        score += ___;\n    }\n}',
      solution: '// Collect coins the player touches\nfor (int i = coins.size() - 1; i >= 0; i--) {\n    auto c = coins[i];\n    if (px + pw > c.x && px < c.x + c.s &&\n        py + ph > c.y && py < c.y + c.s) {\n        coins.erase(i);\n        score += 10;\n    }\n}',
      checks: ['coins', 'score', '10'],
      height: 220,
      fills: {
        text: 'Each coin is worth ___ points. We loop backwards so that removing a coin does not ___ the next index.',
        answers: ['10', 'skip']
      },
      quiz: {
        question: 'Why loop backwards (from length−1 down to 0) when removing items?',
        options: [
          'It is faster',
          'Removing an item shifts later items down  -  looping forward would skip the next item after a removal',
          'Arrays must be read in reverse'
        ],
        correct: 1
      }
    },
    {
      num: 6,
      title: 'Win & Restart',
      goal: 'Win when all coins are collected. Press R to play again.',
      points: [
        'After collecting all coins (<code>coins.size() == 0</code>), set <code>gameState = "won"</code>',
        'In the won state, display "YOU WIN!" with the final score, and stop updating the player',
        'Press R to restart: reset position, velocity, refill the coins array, score to 0, state to "play"',
        'This is the same state-machine pattern you would use with an <code>enum GameState</code> in real C++'
      ],
      challenge: '⚙️ Write the win condition and restart check:',
      starter: '// Win when all coins collected\nif (coins.size() == ___ && gameState == "play") {\n    gameState = "___";\n}\n\n// Fall off the bottom? Respawn\nif (py > ___) {\n    px = 80;\n    py = 340;\n    pvy = 0;\n}',
      solution: '// Win when all coins collected\nif (coins.size() == 0 && gameState == "play") {\n    gameState = "won";\n}\n\n// Fall off the bottom? Respawn\nif (py > 420) {\n    px = 80;\n    py = 340;\n    pvy = 0;\n}',
      checks: ['coins', 'won', '420', 'pvy'],
      height: 240,
      fills: {
        text: 'The game is won when the coins array has ___ items left. Falling past y=420 triggers a ___ at the start position.',
        answers: ['0', 'respawn']
      },
      quiz: {
        question: 'Which pattern from this platformer appears in almost every commercial game?',
        options: [
          'The green platforms',
          'The PLAY / WON state machine and restart loop  -  the same structure controls menus, cutscenes, and game-over screens',
          'The orange player colour'
        ],
        correct: 1
      }
    }
  ]
};

/* ===================================================
   CONTINUE IN C++ - export a real desktop project.
   The canvas runs a JavaScript version of the game.
   This writes the same game as real C++ you can build
   in SFML, so you can carry on in a desktop engine.
   =================================================== */
var PC_GAME_NAME = 'My C++ Platformer';
var PC_AUTHOR = 'Made in the JVDesignStudio C++ Platformer Build Canvas';
var PC_PLATFORMS = [[0,380,600,20],[120,300,100,14],[300,240,120,14],[480,180,100,14],[200,140,100,14],[50,80,120,14]];
var PC_COINS = [[155,274,14],[345,214,14],[515,154,14],[235,114,14],[95,54,14]];

function pcEscape(s) { return String(s).replace(/\\/g, '\\\\').replace(/"/g, '\\"'); }

function pcBuildMain() {
  var L = [];
  L.push('// ' + PC_GAME_NAME);
  L.push('// ' + PC_AUTHOR + '.');
  L.push('// This is real C++17 using SFML 2.6. Build it with the bundled CMakeLists.txt.');
  L.push('');
  L.push('#include <SFML/Graphics.hpp>');
  L.push('#include <string>');
  L.push('#include <vector>');
  L.push('');
  L.push('struct Platform { float x, y, w, h; };');
  L.push('struct Coin { float x, y, s; bool alive; };');
  L.push('');
  L.push('// The numbers you set in the canvas.');
  L.push('const float GRAVITY = 1200.f;');
  L.push('const float JUMP_VEL = -460.f;');
  L.push('const float MOVE_SPEED = 220.f;');
  L.push('const float DT = 1.f / 60.f;   // the canvas runs at a fixed 60 frames a second');
  L.push('');
  L.push('int main() {');
  L.push('    const unsigned WIDTH = 600, HEIGHT = 400;');
  L.push('    sf::RenderWindow window(sf::VideoMode(WIDTH, HEIGHT), "' + pcEscape(PC_GAME_NAME) + '");');
  L.push('    window.setFramerateLimit(60);');
  L.push('');
  L.push('    // The player: the orange box.');
  L.push('    float px = 80.f, py = 340.f, pvx = 0.f, pvy = 0.f;');
  L.push('    const float pw = 30.f, ph = 36.f;');
  L.push('    bool onGround = false;');
  L.push('    int score = 0;');
  L.push('    std::string gameState = "play";');
  L.push('');
  L.push('    // Platforms. The ground is just the first one.');
  L.push('    std::vector<Platform> platforms = {');
  PC_PLATFORMS.forEach(function (p) { L.push('        {' + p[0] + ', ' + p[1] + ', ' + p[2] + ', ' + p[3] + '},'); });
  L.push('    };');
  L.push('');
  L.push('    // Coins to collect.');
  L.push('    std::vector<Coin> coins = {');
  PC_COINS.forEach(function (c) { L.push('        {' + c[0] + ', ' + c[1] + ', ' + c[2] + ', true},'); });
  L.push('    };');
  L.push('');
  L.push('    // The score text needs a font. Drop a .ttf next to the game, or install one of these.');
  L.push('    sf::Font font;');
  L.push('    bool hasFont = false;');
  L.push('    const char* fontPaths[] = {"arial.ttf", "DejaVuSans.ttf", "C:/Windows/Fonts/arial.ttf",');
  L.push('        "/System/Library/Fonts/Supplemental/Arial.ttf", "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"};');
  L.push('    for (const char* path : fontPaths) { if (font.loadFromFile(path)) { hasFont = true; break; } }');
  L.push('');
  L.push('    sf::RectangleShape box;');
  L.push('    bool spaceWas = false;');
  L.push('');
  L.push('    while (window.isOpen()) {');
  L.push('        sf::Event event;');
  L.push('        while (window.pollEvent(event)) {');
  L.push('            if (event.type == sf::Event::Closed) window.close();');
  L.push('            if (event.type == sf::Event::KeyPressed && event.key.code == sf::Keyboard::R && gameState == "won") {');
  L.push('                score = 0; px = 80.f; py = 340.f; pvx = 0.f; pvy = 0.f; gameState = "play";');
  L.push('                for (auto& c : coins) c.alive = true;');
  L.push('            }');
  L.push('        }');
  L.push('');
  L.push('        bool leftHeld = sf::Keyboard::isKeyPressed(sf::Keyboard::Left) || sf::Keyboard::isKeyPressed(sf::Keyboard::A);');
  L.push('        bool rightHeld = sf::Keyboard::isKeyPressed(sf::Keyboard::Right) || sf::Keyboard::isKeyPressed(sf::Keyboard::D);');
  L.push('        bool spaceHeld = sf::Keyboard::isKeyPressed(sf::Keyboard::Space);');
  L.push('        bool spacePressed = spaceHeld && !spaceWas;');
  L.push('        spaceWas = spaceHeld;');
  L.push('');
  L.push('        if (gameState == "play") {');
  L.push('            // Movement and gravity (the same maths as the browser).');
  L.push('            pvx = 0.f;');
  L.push('            if (leftHeld) pvx = -MOVE_SPEED;');
  L.push('            if (rightHeld) pvx = MOVE_SPEED;');
  L.push('            pvy += GRAVITY * DT;');
  L.push('            py += pvy * DT;');
  L.push('            px += pvx * DT;');
  L.push('            if (px < 0.f) px = 0.f;');
  L.push('            if (px + pw > WIDTH) px = WIDTH - pw;');
  L.push('');
  L.push('            // One-way platforms: land on top only while falling.');
  L.push('            onGround = false;');
  L.push('            for (auto& p : platforms) {');
  L.push('                if (px + pw > p.x && px < p.x + p.w &&');
  L.push('                    py + ph >= p.y && py + ph <= p.y + p.h + pvy * DT + 2 && pvy >= 0) {');
  L.push('                    py = p.y - ph; pvy = 0.f; onGround = true;');
  L.push('                }');
  L.push('            }');
  L.push('');
  L.push('            if (spacePressed && onGround) pvy = JUMP_VEL;');
  L.push('            if (py > 420.f) { px = 80.f; py = 340.f; pvy = 0.f; }');
  L.push('');
  L.push('            // Collect the coins.');
  L.push('            for (int i = (int)coins.size() - 1; i >= 0; --i) {');
  L.push('                if (!coins[i].alive) continue;');
  L.push('                Coin c = coins[i];');
  L.push('                if (px + pw > c.x && px < c.x + c.s && py + ph > c.y && py < c.y + c.s) {');
  L.push('                    coins[i].alive = false; score += 10;');
  L.push('                }');
  L.push('            }');
  L.push('');
  L.push('            // Win when no coins are left.');
  L.push('            bool anyLeft = false;');
  L.push('            for (auto& c : coins) if (c.alive) anyLeft = true;');
  L.push('            if (!anyLeft) gameState = "won";');
  L.push('        }');
  L.push('');
  L.push('        // Draw everything again.');
  L.push('        window.clear(sf::Color(0x19, 0x1e, 0x3c));');
  L.push('        box.setFillColor(sf::Color(0x06, 0xd6, 0xa0));');
  L.push('        for (auto& p : platforms) { box.setPosition(p.x, p.y); box.setSize({p.w, p.h}); window.draw(box); }');
  L.push('        box.setFillColor(sf::Color(0xff, 0x77, 0x00));');
  L.push('        box.setPosition(px, py); box.setSize({pw, ph}); window.draw(box);');
  L.push('        box.setFillColor(sf::Color(0xff, 0xd1, 0x66));');
  L.push('        for (auto& c : coins) if (c.alive) { box.setPosition(c.x, c.y); box.setSize({c.s, c.s}); window.draw(box); }');
  L.push('');
  L.push('        if (hasFont) {');
  L.push('            sf::Text scoreText("Score: " + std::to_string(score), font, 20);');
  L.push('            scoreText.setPosition(16.f, 10.f);');
  L.push('            scoreText.setFillColor(sf::Color::White);');
  L.push('            window.draw(scoreText);');
  L.push('            if (gameState == "won") {');
  L.push('                sf::Text win("YOU WIN!", font, 32);');
  L.push('                win.setFillColor(sf::Color::White);');
  L.push('                win.setPosition((WIDTH - win.getLocalBounds().width) / 2.f, 150.f);');
  L.push('                window.draw(win);');
  L.push('                sf::Text finalScore("Score: " + std::to_string(score), font, 18);');
  L.push('                finalScore.setFillColor(sf::Color::White);');
  L.push('                finalScore.setPosition((WIDTH - finalScore.getLocalBounds().width) / 2.f, 210.f);');
  L.push('                window.draw(finalScore);');
  L.push('                sf::Text again("Press R to play again", font, 18);');
  L.push('                again.setFillColor(sf::Color::White);');
  L.push('                again.setPosition((WIDTH - again.getLocalBounds().width) / 2.f, 240.f);');
  L.push('                window.draw(again);');
  L.push('            }');
  L.push('        }');
  L.push('        window.display();');
  L.push('    }');
  L.push('    return 0;');
  L.push('}');
  return L.join('\n');
}

function pcBuildCMake() {
  return [
    'cmake_minimum_required(VERSION 3.16)',
    'project(my_cpp_platformer)',
    '',
    'set(CMAKE_CXX_STANDARD 17)',
    'set(CMAKE_CXX_STANDARD_REQUIRED ON)',
    '',
    '# SFML is a free library. Get it from sfml-dev.org.',
    'find_package(SFML 2.5 COMPONENTS graphics window system REQUIRED)',
    '',
    'add_executable(my_cpp_platformer main.cpp)',
    'target_link_libraries(my_cpp_platformer sfml-graphics sfml-window sfml-system)'
  ].join('\n');
}

function pcBuildReadme() {
  return PC_GAME_NAME + ' - made in the JVDesignStudio C++ Platformer Build Canvas.\n\n' +
    'You built this game in the browser. This is the same game as real C++ you can\n' +
    'build and run on your own computer.\n\n' +
    'HOW TO BUILD IT (a compiler and SFML are both free):\n' +
    '1. Install a C++ compiler (or Visual Studio) and the SFML library (sfml-dev.org).\n' +
    '2. Open a terminal in this folder and run:\n' +
    '     cmake -B build\n' +
    '     cmake --build build\n' +
    '3. Run the program from the build folder.\n\n' +
    'Controls\n' +
    '  Left / Right or A / D : move\n' +
    '  Space                 : jump\n' +
    '  R                     : play again after you win\n\n' +
    'The score text needs a font file. Copy a .ttf (for example arial.ttf) next to\n' +
    'the game, or it will run without the score text.\n\n' +
    'Full guide: https://jvdesignstudio.co.uk/workshops/cpp-world-workshop.html\n';
}

var PC_CRC_TABLE = (function () { var t = [], n, k, c; for (n = 0; n < 256; n++) { c = n; for (k = 0; k < 8; k++) { c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1); } t[n] = c >>> 0; } return t; })();
function pcCrc32(bytes) { var c = 0xFFFFFFFF; for (var i = 0; i < bytes.length; i++) { c = PC_CRC_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8); } return (c ^ 0xFFFFFFFF) >>> 0; }
function pcU16(v) { return [v & 0xFF, (v >> 8) & 0xFF]; }
function pcU32(v) { return [v & 0xFF, (v >> 8) & 0xFF, (v >> 16) & 0xFF, (v >>> 24) & 0xFF]; }
function pcMakeZip(files) {
  var enc = new TextEncoder(); var chunks = [], central = [], offset = 0;
  files.forEach(function (f) {
    var nameBytes = enc.encode(f.name), data = f.data, crc = pcCrc32(data);
    var local = [].concat(pcU32(0x04034b50), pcU16(20), pcU16(0), pcU16(0), pcU16(0), pcU16(0), pcU32(crc), pcU32(data.length), pcU32(data.length), pcU16(nameBytes.length), pcU16(0));
    var header = new Uint8Array(local.length + nameBytes.length); header.set(local, 0); header.set(nameBytes, local.length);
    chunks.push(header); chunks.push(data);
    var cd = [].concat(pcU32(0x02014b50), pcU16(20), pcU16(20), pcU16(0), pcU16(0), pcU16(0), pcU16(0), pcU32(crc), pcU32(data.length), pcU32(data.length), pcU16(nameBytes.length), pcU16(0), pcU16(0), pcU16(0), pcU16(0), pcU32(0), pcU32(offset));
    var cdh = new Uint8Array(cd.length + nameBytes.length); cdh.set(cd, 0); cdh.set(nameBytes, cd.length);
    central.push(cdh); offset += header.length + data.length;
  });
  var cdSize = central.reduce(function (s, c) { return s + c.length; }, 0);
  var eocd = new Uint8Array([].concat(pcU32(0x06054b50), pcU16(0), pcU16(0), pcU16(files.length), pcU16(files.length), pcU32(cdSize), pcU32(offset), pcU16(0)));
  var total = chunks.reduce(function (s, c) { return s + c.length; }, 0) + cdSize + eocd.length;
  var out = new Uint8Array(total), p = 0;
  chunks.forEach(function (c) { out.set(c, p); p += c.length; });
  central.forEach(function (c) { out.set(c, p); p += c.length; });
  out.set(eocd, p); return out;
}

function pcProjectFiles() {
  return [
    { name: 'my-cpp-platformer/main.cpp', text: pcBuildMain() + '\n' },
    { name: 'my-cpp-platformer/CMakeLists.txt', text: pcBuildCMake() + '\n' },
    { name: 'my-cpp-platformer/README.txt', text: pcBuildReadme() },

  ];
}

  try {
    return (window.CW && window.CW.getPassport ? JSON.stringify(window.CW.getPassport(), null, 2) : '{}') + '\n';
  } catch (e) { return '{}\n'; }
}

}
window.PC_projectFiles = pcProjectFiles;

function downloadCppProject() {
  var hint = document.getElementById('canvasHint');
  try {
    var enc = new TextEncoder();
    var files = pcProjectFiles().map(function (f) { return { name: f.name, data: enc.encode(f.text) }; });
    var zip = pcMakeZip(files);
    var blob = new Blob([zip], { type: 'application/zip' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'my-cpp-platformer.zip';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 1500);
    if (hint) hint.textContent = 'Downloaded my-cpp-platformer.zip. Build it with the bundled CMakeLists.txt.';
  } catch (e) {
    if (hint) hint.textContent = 'Could not make the zip in this browser. Try a different browser.';
  }
}
