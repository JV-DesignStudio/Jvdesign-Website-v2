<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Platformer Build Canvas | JVDesignStudio</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Inter:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../workshop-canvas.css">
<style>.cw-canvas-frame iframe{width:600px;height:420px}</style>
</head>
<body>

<div class="cw-header">
  <h1>Build a Platformer Step by Step</h1>
  <p>Each step adds a feature. Write the code, watch it come alive in the canvas.</p>
</div>

<div class="cw-layout">
  <div class="cw-steps" id="stepsPanel"></div>
  <div class="cw-canvas-panel" id="canvasPanel">
    <div class="cw-progress">
      <span id="progressText">Step 1 / 6</span>
      <div class="cw-progress-bar"><div class="cw-progress-fill" id="progressFill" style="width:0%"></div></div>
    </div>
    <div class="cw-canvas-frame">
      <iframe id="gameFrame" sandbox="allow-scripts" title="Your Platformer game" style="width:600px;height:420px"></iframe>
    </div>
    <div class="cw-canvas-hint" id="canvasHint">Use arrow keys to move and Up or Space to jump</div>
    <button class="cw-btn-dl" onclick="CW.downloadGame()">Download My Game</button>
  </div>
</div>

<script>
'use strict';

/* ===================================================
   IFRAME BUILDING BLOCKS (platformer-specific)
   =================================================== */

var CSS_GAME = '<style>body{display:flex;flex-direction:column;align-items:center;background:#222;margin:0;overflow:hidden}canvas{display:block;cursor:pointer}</style>';

var CANVAS_TAG = '<canvas id="game" width="600" height="400"></canvas>';

var SETUP_BASIC = 'const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");';

var PLAYER_OBJ = 'const player={x:50,y:300,w:24,h:32,vx:0,vy:0,onGround:false};const gravity=0.5;const jumpForce=-10;const moveSpeed=4;';

var KEYS_OBJ = 'const keys={};document.addEventListener("keydown",function(e){keys[e.code]=true;e.preventDefault()});document.addEventListener("keyup",function(e){keys[e.code]=false});';

var PLATFORMS_ARR = 'const platforms=[{x:0,y:370,w:600,h:30},{x:100,y:280,w:120,h:16},{x:300,y:220,w:120,h:16},{x:480,y:300,w:100,h:16},{x:50,y:160,w:100,h:16},{x:250,y:120,w:140,h:16},{x:450,y:160,w:120,h:16}];';

var COINS_ARR = 'const coins=[{x:140,y:255,r:8,collected:false},{x:340,y:195,r:8,collected:false},{x:510,y:275,r:8,collected:false},{x:80,y:135,r:8,collected:false},{x:300,y:95,r:8,collected:false},{x:490,y:135,r:8,collected:false}];let score=0;';

var ENEMIES_ARR = 'const enemies=[{x:130,y:260,w:20,h:20,speed:1,minX:100,maxX:200},{x:320,y:200,w:20,h:20,speed:0.8,minX:300,maxX:400},{x:270,y:100,w:20,h:20,speed:1.2,minX:250,maxX:370}];let health=3;let invuln=0;';

var DRAW_BG = 'ctx.fillStyle="#1a1a2e";ctx.fillRect(0,0,600,400);';

var DRAW_BG_CAMERA = 'ctx.save();ctx.translate(-camera,0);';

var DRAW_PLATFORMS = 'ctx.fillStyle="#06d6a0";for(const p of platforms){ctx.fillRect(p.x,p.y,p.w,p.h)}';

var DRAW_PLAYER = 'ctx.fillStyle="#ff6b6b";ctx.fillRect(player.x,player.y,player.w,player.h);';

var DRAW_PLAYER_BLINK = 'if(invuln<=0||Math.floor(invuln*10)%2===0){ctx.fillStyle="#ff6b6b";ctx.fillRect(player.x,player.y,player.w,player.h)}';

var DRAW_COINS = 'ctx.fillStyle="#ffd166";for(const c of coins){if(!c.collected){ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,Math.PI*2);ctx.fill()}}';

var DRAW_ENEMIES = 'ctx.fillStyle="#4cc9f0";for(const e of enemies){ctx.fillRect(e.x,e.y,e.w,e.h)}';

var DRAW_SCORE = 'ctx.fillStyle="#fff";ctx.font="bold 18px sans-serif";ctx.textAlign="left";ctx.fillText("Score: "+score,10,24);';

var DRAW_SCORE_CAMERA = 'ctx.restore();ctx.fillStyle="#fff";ctx.font="bold 18px sans-serif";ctx.textAlign="left";ctx.fillText("Score: "+score,10,24);';

var DRAW_HEALTH = 'ctx.fillStyle="#ff6b6b";for(var hi=0;hi<health;hi++){ctx.fillText("\\u2764",520+hi*22,24)}';

var DRAW_HEALTH_CAMERA = 'ctx.fillStyle="#ff6b6b";for(var hi=0;hi<health;hi++){ctx.fillText("\\u2764",520+hi*22,24)}';

var PLAT_COLLISION_FN = 'function checkPlatforms(){player.onGround=false;for(const p of platforms){if(player.x+player.w>p.x&&player.x<p.x+p.w&&player.y+player.h>p.y&&player.y+player.h<p.y+p.h&&player.vy>=0){player.y=p.y-player.h;player.vy=0;player.onGround=true}}}';

var MOVE_LOGIC = 'if(keys["ArrowLeft"]||keys["KeyA"])player.vx=-moveSpeed;else if(keys["ArrowRight"]||keys["KeyD"])player.vx=moveSpeed;else player.vx=0;if((keys["ArrowUp"]||keys["KeyW"]||keys["Space"])&&player.onGround){player.vy=jumpForce}';

var PHYSICS = 'player.vy+=gravity;player.x+=player.vx;player.y+=player.vy;if(player.x<0)player.x=0;if(player.x+player.w>600)player.x=600-player.w;';

var PHYSICS_WIDE = 'player.vy+=gravity;player.x+=player.vx;player.y+=player.vy;if(player.x<0)player.x=0;';

var COIN_COLLECT = 'for(const c of coins){if(!c.collected&&player.x+player.w>c.x-c.r&&player.x<c.x+c.r&&player.y+player.h>c.y-c.r&&player.y<c.y+c.r){c.collected=true;score++}}';

var ENEMY_PATROL = 'for(const e of enemies){e.x+=e.speed;if(e.x<=e.minX||e.x+e.w>=e.maxX)e.speed*=-1}';

var ENEMY_HIT = 'if(invuln>0)invuln-=1/60;for(const e of enemies){if(invuln<=0&&player.x+player.w>e.x&&player.x<e.x+e.w&&player.y+player.h>e.y&&player.y<e.y+e.h){health--;invuln=1.5;player.vy=-6;if(health<=0){player.x=50;player.y=300;health=3;score=0;for(const c of coins)c.collected=false}}}';


function wrap(code) {
  return '<!DOCTYPE html><html><head><meta charset="UTF-8">' + CSS_GAME +
    '<\/head><body>' + CANVAS_TAG + '<script>' + code + '<\/script><\/body><\/html>';
}


/* ===================================================
   CW_CONFIG - platformer-specific steps + templates
   =================================================== */

window.CW_CONFIG = {
  storageKey: 'jvds-platformer-canvas',
  downloadName: 'my-platformer-game.html',

  hints: [
    'Your player appears and falls with gravity - the ground catches them',
    'Arrow keys move left and right, Up or Space to jump',
    'Platforms appear - the player can land on them',
    'Golden coins sparkle - run into them to collect',
    'Blue enemies patrol the platforms - watch your hearts!',
    'The camera follows the player through a wider world'
  ],

  templates: {
    1: function(u) {
      return wrap(
        SETUP_BASIC + PLAYER_OBJ +
        'try{' + u + '}catch(e){}' +
        'function loop(){player.vy+=gravity;player.y+=player.vy;if(player.y+player.h>370){player.y=370-player.h;player.vy=0;player.onGround=true}' +
        DRAW_BG + DRAW_PLAYER +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    2: function(u) {
      return wrap(
        SETUP_BASIC + PLAYER_OBJ + KEYS_OBJ +
        'function loop(){' +
        'try{' + u + '}catch(e){}' +
        PHYSICS +
        'if(player.y+player.h>370){player.y=370-player.h;player.vy=0;player.onGround=true}else{player.onGround=false}' +
        DRAW_BG + DRAW_PLAYER +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    3: function(u) {
      return wrap(
        SETUP_BASIC + PLAYER_OBJ + KEYS_OBJ + PLATFORMS_ARR +
        MOVE_LOGIC.replace('if((keys','function handleInput(){if((keys') + '}' +
        'function loop(){handleInput();' +
        PHYSICS +
        'try{' + u + '}catch(e){}' +
        DRAW_BG + DRAW_PLATFORMS + DRAW_PLAYER +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    4: function(u) {
      return wrap(
        SETUP_BASIC + PLAYER_OBJ + KEYS_OBJ + PLATFORMS_ARR + COINS_ARR +
        PLAT_COLLISION_FN +
        'function handleInput(){' + MOVE_LOGIC + '}' +
        'function loop(){handleInput();' + PHYSICS +
        'checkPlatforms();' +
        'try{' + u + '}catch(e){}' +
        DRAW_BG + DRAW_PLATFORMS + DRAW_COINS + DRAW_PLAYER + DRAW_SCORE +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    5: function(u) {
      return wrap(
        SETUP_BASIC + PLAYER_OBJ + KEYS_OBJ + PLATFORMS_ARR + COINS_ARR + ENEMIES_ARR +
        PLAT_COLLISION_FN +
        'function handleInput(){' + MOVE_LOGIC + '}' +
        'function loop(){handleInput();' + PHYSICS +
        'checkPlatforms();' + COIN_COLLECT +
        'try{' + u + '}catch(e){}' +
        DRAW_BG + DRAW_PLATFORMS + DRAW_COINS + DRAW_ENEMIES + DRAW_PLAYER_BLINK + DRAW_SCORE + DRAW_HEALTH +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    6: function(u) {
      return wrap(
        SETUP_BASIC + PLAYER_OBJ + KEYS_OBJ +
        'const platforms=[{x:0,y:370,w:1200,h:30},{x:100,y:280,w:120,h:16},{x:300,y:220,w:120,h:16},{x:480,y:300,w:100,h:16},{x:50,y:160,w:100,h:16},{x:250,y:120,w:140,h:16},{x:450,y:160,w:120,h:16},{x:650,y:250,w:120,h:16},{x:850,y:180,w:140,h:16},{x:1050,y:280,w:100,h:16}];' +
        'const coins=[{x:140,y:255,r:8,collected:false},{x:340,y:195,r:8,collected:false},{x:510,y:275,r:8,collected:false},{x:80,y:135,r:8,collected:false},{x:300,y:95,r:8,collected:false},{x:490,y:135,r:8,collected:false},{x:700,y:225,r:8,collected:false},{x:900,y:155,r:8,collected:false},{x:1080,y:255,r:8,collected:false}];let score=0;' +
        ENEMIES_ARR +
        PLAT_COLLISION_FN +
        'function handleInput(){' + MOVE_LOGIC + '}' +
        'let camera=0;' +
        'function loop(){handleInput();' + PHYSICS_WIDE +
        'checkPlatforms();' + COIN_COLLECT + ENEMY_PATROL + ENEMY_HIT +
        'try{' + u + '}catch(e){}' +
        DRAW_BG + 'ctx.save();ctx.translate(-camera,0);' +
        DRAW_PLATFORMS + DRAW_COINS + DRAW_ENEMIES + DRAW_PLAYER_BLINK +
        DRAW_SCORE_CAMERA + DRAW_HEALTH_CAMERA +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    }
  },

  steps: [
    {
      num: 1,
      title: 'Player & Gravity',
      goal: 'Draw a player rectangle that falls with gravity and lands on the ground.',
      points: [
        'The player is an object: <code>{ x, y, w:24, h:32, vx, vy }</code>',
        'Each frame: <code>vy += gravity</code> pulls the player down',
        'When <code>player.y + player.h > 370</code> (the ground), stop falling'
      ],
      challenge: 'Write the gravity and ground collision logic:',
      starter: '// Apply gravity each frame\n// Step 1: velocity increases by gravity\nplayer.vy += ___;\n\n// Step 2: position changes by velocity\nplayer.y += ___;\n\n// Step 3: stop at ground (y = 370 is ground top)\nif (player.y + player.h > 370) {\n  player.y = 370 - player.h;\n  player.vy = 0;\n}',
      solution: 'player.vy += gravity;\nplayer.y += player.vy;\nif (player.y + player.h > 370) {\n  player.y = 370 - player.h;\n  player.vy = 0;\n}',
      checks: ['gravity', 'player.vy', 'player.y'],
      height: 180,
      fills: {
        text: 'Gravity increases the ___ each frame. When the player touches the ground, ___ is set to zero.',
        answers: ['velocity', 'vy']
      },
      quiz: {
        question: 'Why does gravity add to velocity instead of directly to position?',
        options: [
          'It saves memory',
          'Velocity accumulates over time - this creates natural acceleration, not instant teleportation',
          'Browsers require it'
        ],
        correct: 1
      }
    },
    {
      num: 2,
      title: 'Arrow Keys & Jump',
      goal: 'Move left/right with arrow keys and jump with Up or Space.',
      points: [
        'Track pressed keys in an object: <code>keys[e.code] = true</code> on keydown, false on keyup',
        'Each frame: read the keys object to set <code>player.vx</code>',
        'Jump only when <code>player.onGround</code> is true - no double-jumping'
      ],
      challenge: 'Write the input handler and jump logic:',
      starter: '// Read keys and move player\nif (keys["ArrowLeft"] || keys["KeyA"])\n  player.vx = -moveSpeed;\nelse if (keys["ArrowRight"] || keys["KeyD"])\n  player.vx = ___;\nelse\n  player.vx = 0;\n\n// Jump when on ground\nif ((keys["ArrowUp"] || keys["KeyW"] || keys["Space"]) && player.___) {\n  player.vy = ___;\n}',
      solution: 'if (keys["ArrowLeft"] || keys["KeyA"])\n  player.vx = -moveSpeed;\nelse if (keys["ArrowRight"] || keys["KeyD"])\n  player.vx = moveSpeed;\nelse\n  player.vx = 0;\n\nif ((keys["ArrowUp"] || keys["KeyW"] || keys["Space"]) && player.onGround) {\n  player.vy = jumpForce;\n}',
      checks: ['keydown', 'keyup', 'jump'],
      height: 210,
      fills: {
        text: 'The keys object tracks which keys are currently ___. Jumping only works when ___ is true.',
        answers: ['pressed', 'onGround']
      },
      quiz: {
        question: 'Why use a keys object instead of moving inside the keydown event directly?',
        options: [
          'It uses less memory',
          'The game loop runs 60 times per second but keydown only fires once - the keys object lets the loop read continuous held input',
          'JavaScript requires objects for events'
        ],
        correct: 1
      }
    },
    {
      num: 3,
      title: 'Platforms & Collision',
      goal: 'Define platform rectangles and make the player land on them.',
      points: [
        'Each platform is <code>{ x, y, w, h }</code> - a simple rectangle',
        'Check if the player overlaps a platform from above (falling down)',
        'When landing: snap <code>player.y</code> to platform top, set <code>vy = 0</code>, mark <code>onGround = true</code>'
      ],
      challenge: 'Write the platform collision check:',
      starter: '// Check each platform for landing\nplayer.onGround = false;\nfor (const p of platforms) {\n  // Is the player overlapping this platform?\n  if (player.x + player.w > p.x &&\n      player.x < p.x + p.w &&\n      player.y + player.h > p.y &&\n      player.y + player.h < p.y + p.h &&\n      player.vy >= 0) {\n    player.y = p.y - player.___;\n    player.vy = ___;\n    player.onGround = ___;\n  }\n}',
      solution: 'player.onGround = false;\nfor (const p of platforms) {\n  if (player.x + player.w > p.x &&\n      player.x < p.x + p.w &&\n      player.y + player.h > p.y &&\n      player.y + player.h < p.y + p.h &&\n      player.vy >= 0) {\n    player.y = p.y - player.h;\n    player.vy = 0;\n    player.onGround = true;\n  }\n}',
      checks: ['platforms', 'player.y', 'onground'],
      height: 260,
      fills: {
        text: 'The collision checks four edges for ___. The player only lands when falling ___ (vy >= 0).',
        answers: ['overlap', 'downward']
      },
      quiz: {
        question: 'Why check <code>player.vy >= 0</code> in the platform collision?',
        options: [
          'So the player can jump upward through platforms instead of bonking their head on every one',
          'It makes the game faster',
          'Platforms only exist when vy is positive'
        ],
        correct: 0
      }
    },
    {
      num: 4,
      title: 'Coins & Score',
      goal: 'Place collectible coins and track the player\'s score.',
      points: [
        'Coins are circles: <code>{ x, y, r:8, collected:false }</code>',
        'Each frame, check if player overlaps each coin - if so, mark it <code>collected</code>',
        'Draw uncollected coins as yellow circles with <code>ctx.arc()</code>'
      ],
      challenge: 'Write the coin collection logic:',
      starter: '// Check each coin for collection\nfor (const c of coins) {\n  if (!c.collected &&\n      player.x + player.w > c.x - c.r &&\n      player.x < c.x + c.r &&\n      player.y + player.h > c.y - c.r &&\n      player.y < c.y + c.r) {\n    c.___ = true;\n    ___++;\n  }\n}',
      solution: 'for (const c of coins) {\n  if (!c.collected &&\n      player.x + player.w > c.x - c.r &&\n      player.x < c.x + c.r &&\n      player.y + player.h > c.y - c.r &&\n      player.y < c.y + c.r) {\n    c.collected = true;\n    score++;\n  }\n}',
      checks: ['coins', 'score', 'collected'],
      height: 200,
      fills: {
        text: 'A coin disappears by setting ___ to true. The overlap test compares the player rectangle against the coin ___.',
        answers: ['collected', 'circle']
      },
      quiz: {
        question: 'Why use a <code>collected</code> flag instead of removing the coin from the array?',
        options: [
          'Arrays cannot have items removed',
          'The flag is simpler - no array splicing, and you can easily reset all coins by setting them back to false',
          'Flags are faster than arrays'
        ],
        correct: 1
      }
    },
    {
      num: 5,
      title: 'Enemies & Health',
      goal: 'Add patrolling enemies that cost a heart on contact.',
      points: [
        'Each enemy has <code>{ x, y, w, h, speed, minX, maxX }</code> - it walks back and forth',
        'Reverse <code>speed</code> when the enemy hits its minX or maxX boundary',
        'On player-enemy overlap: reduce health, give brief invulnerability, bounce the player up'
      ],
      challenge: 'Write the enemy patrol and damage logic:',
      starter: '// Move each enemy back and forth\nfor (const e of enemies) {\n  e.x += e.___;\n  if (e.x <= e.minX || e.x + e.w >= e.maxX)\n    e.speed *= -1;\n}\n\n// Check if player touches an enemy\nif (invuln > 0) invuln -= 1/60;\nfor (const e of enemies) {\n  if (invuln <= 0 &&\n      player.x + player.w > e.x &&\n      player.x < e.x + e.w &&\n      player.y + player.h > e.y &&\n      player.y < e.y + e.h) {\n    ___--;\n    invuln = 1.5;\n    player.vy = -6;\n  }\n}',
      solution: 'for (const e of enemies) {\n  e.x += e.speed;\n  if (e.x <= e.minX || e.x + e.w >= e.maxX)\n    e.speed *= -1;\n}\n\nif (invuln > 0) invuln -= 1/60;\nfor (const e of enemies) {\n  if (invuln <= 0 &&\n      player.x + player.w > e.x &&\n      player.x < e.x + e.w &&\n      player.y + player.h > e.y &&\n      player.y < e.y + e.h) {\n    health--;\n    invuln = 1.5;\n    player.vy = -6;\n  }\n}',
      checks: ['enemies', 'health', 'speed'],
      height: 320,
      fills: {
        text: 'Enemies reverse direction by multiplying speed by ___. Invulnerability prevents taking damage every ___.',
        answers: ['-1', 'frame']
      },
      quiz: {
        question: 'What would happen without the invulnerability timer after taking damage?',
        options: [
          'Nothing different',
          'The player would lose ALL hearts in a fraction of a second because collision triggers every frame they overlap',
          'The enemy would disappear'
        ],
        correct: 1
      }
    },
    {
      num: 6,
      title: 'Camera & Polish',
      goal: 'Make the camera follow the player through a wider level.',
      points: [
        'A camera is just an x offset: <code>ctx.translate(-camera, 0)</code> shifts all drawing',
        'Each frame: <code>camera = player.x - 200</code> keeps the player near the left',
        'Clamp camera to 0 at minimum so it does not scroll past the level start'
      ],
      challenge: 'Write the camera follow logic:',
      starter: '// Camera follows the player\ncamera = player.x - 200;\n\n// Do not scroll past the start\nif (camera < 0) camera = ___;\n\n// Do not scroll past the end\nif (camera > ___) camera = 600;',
      solution: 'camera = player.x - 200;\nif (camera < 0) camera = 0;\nif (camera > 600) camera = 600;',
      checks: ['camera', 'scroll', 'offset'],
      height: 140,
      fills: {
        text: 'The camera is a horizontal ___ applied with ctx.translate. Clamping stops it scrolling past the level ___.',
        answers: ['offset', 'edges']
      },
      quiz: {
        question: 'How does <code>ctx.translate(-camera, 0)</code> make the level scroll?',
        options: [
          'It moves the canvas element on the page',
          'It shifts every drawing operation left by the camera amount - objects at x=500 appear at x=500-camera on screen',
          'It changes the player position'
        ],
        correct: 1
      }
    }
  ]
};
</script>
<script src="../workshop-canvas-engine.js"></script>
<script defer src="/feedback-widget.js"></script>
<script defer src="/jvds-funnel.js"></script>
</body>
</html>
