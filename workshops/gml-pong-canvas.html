<body>

<div class="cw-header">
  <h1>GML Pong Build Canvas <span class="cw-lang-tag">🎯 GML</span></h1>
  <p>Write GML game code step by step. The canvas shows what your code does.</p>
</div>

<div class="cw-layout">
  <div class="cw-steps" id="stepsPanel"></div>
  <div class="cw-canvas-panel" id="canvasPanel">
    <div class="cw-progress">
      <span id="cwProgressText">Step 1 / 6</span>
      <div class="cw-progress-bar"><div class="cw-progress-fill" id="cwProgressFill" style="width:0%"></div></div>
    </div>

      <iframe id="gameFrame" sandbox="allow-scripts" title="Your GML Pong game"></iframe>
    </div>
    <div class="cw-canvas-hint" id="canvasHint">Two white paddles on a dark court with a dashed centre line</div>
    <button class="cw-btn-dl" onclick="CW.downloadGame()">Download My Game</button>
  </div>
</div>

<script>
'use strict';

/* ===================================================
   GML-to-JS transpiler (light transform so GML
   syntax runs in the canvas iframe)
   =================================================== */
function gmlToJs(code) {
  return code
    .replace(/\/\/\/.*/g, '//')
    .replace(/\bvar\b/g, 'let')
    .replace(/\bkeyboard_check\(ord\("(\w)"\)\)/g, function(_, k) {
      return k.toLowerCase() + 'Held';
    })
    .replace(/\bkeyboard_check_pressed\(ord\("(\w)"\)\)/g, function(_, k) {
      return k.toLowerCase() + 'Pressed';
    })
    .replace(/\bkeyboard_check\(vk_up\)/gi, 'upHeld')
    .replace(/\bkeyboard_check\(vk_down\)/gi, 'downHeld')
    .replace(/\bclamp\(([^,]+),\s*([^,]+),\s*([^)]+)\)/g, 'Math.max($2, Math.min($3, $1))')
    .replace(/\bchoose\(([^)]+)\)/g, function(_, args) {
      var items = args.split(',').map(function(s) { return s.trim(); });
      return '[' + items.join(',') + '][Math.floor(Math.random()*' + items.length + ')]';
    })
    .replace(/\babs\(/g, 'Math.abs(')
    .replace(/\bsign\(/g, 'Math.sign(')
    .replace(/\broom_height\b/g, '400')
    .replace(/\broom_width\b/g, '600')
    .replace(/\binstance_exists\(\w+\)/g, 'true')
    .replace(/\bglobal\.(\w+)/g, '$1')
    .replace(/\bstring\(/g, 'String(')
    .replace(/\bhspeed\b/g, 'bvx')
    .replace(/\bvspeed\b/g, 'bvy')
    .replace(/\bother\.y\b/g, 'otherY')
    .replace(/\bobj_ball\.y\b/g, 'by')
    .replace(/\bobj_ball\.x\b/g, 'bx')
    .replace(/\bdraw_set_halign\([^)]*\)/g, 'ctx.textAlign="center"')
    .replace(/\bdraw_text_transformed\(([^,]+),\s*([^,]+),\s*([^,]+),\s*[^,]+,\s*[^,]+,\s*[^)]+\)/g,
      'ctx.fillText($3,$1,$2)')
    .replace(/\bshow_debug_message\(/g, 'console.log(');
}

/* ===================================================
   IFRAME BUILDING BLOCKS (GML Pong)
   =================================================== */

var CSS_GAME = '<style>body{display:flex;flex-direction:column;align-items:center;background:#1a1a2e;margin:0;overflow:hidden}canvas{display:block;cursor:pointer}</style>';

var CANVAS_TAG = '<canvas id="game" width="600" height="400"></canvas>';

var SETUP = 'const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");';

var PADDLE_VARS = 'let p1Y=152,p2Y=152;const padW=16,padH=96,padSpeed=6;';

var BALL_VARS = 'let bx=292,by=192,bs=16,bvx=4,bvy=3;';

var SCORE_VARS = 'let score_l=0,score_r=0;';

var STATE_VARS = 'let gameState="play",flash=0;';

var AI_VARS = 'let aiSpeed=5,deadZone=12;';

var KEYS = 'let wHeld=false,sHeld=false;' +
  'document.addEventListener("keydown",function(e){' +
    'if(e.code==="KeyW"||e.code==="ArrowUp")wHeld=true;' +
    'if(e.code==="KeyS"||e.code==="ArrowDown")sHeld=true;' +
    'e.preventDefault()});' +
  'document.addEventListener("keyup",function(e){' +
    'if(e.code==="KeyW"||e.code==="ArrowUp")wHeld=false;' +
    'if(e.code==="KeyS"||e.code==="ArrowDown")sHeld=false});';

var MOVE_P1 = 'if(wHeld)p1Y-=padSpeed;if(sHeld)p1Y+=padSpeed;p1Y=Math.max(0,Math.min(304,p1Y));';

var DRAW_BG = 'ctx.fillStyle="#1a1a2e";ctx.fillRect(0,0,600,400);';

var DRAW_NET = 'ctx.fillStyle="#3c4260";for(var ny=0;ny<400;ny+=20){ctx.fillRect(297,ny,6,12)}';

var DRAW_PADDLES = 'ctx.fillStyle="#fff";ctx.fillRect(15,p1Y,padW,padH);ctx.fillRect(569,p2Y,padW,padH);';

var DRAW_BALL = 'ctx.fillStyle="#fff";ctx.fillRect(bx,by,bs,bs);';

var DRAW_SCORES = 'ctx.fillStyle="#fff";ctx.font="bold 48px monospace";ctx.textAlign="center";ctx.fillText(score_l,220,60);ctx.fillText(score_r,380,60);';

var BALL_MOVE = 'bx+=bvx;by+=bvy;';

var WALL_BOUNCE = 'if(by<=0||by+bs>=400)bvy=-bvy;';

var PADDLE_HIT = 'if(bx<=31&&bx+bs>=15&&by+bs>=p1Y&&by<=p1Y+padH&&bvx<0){bvx=-bvx*1.05;bvy=(by+bs/2-(p1Y+48))/12;if(bvy===0)bvy=1}' +
  'if(bx+bs>=569&&bx<=585&&by+bs>=p2Y&&by<=p2Y+padH&&bvx>0){bvx=-bvx*1.05;bvy=(by+bs/2-(p2Y+48))/12;if(bvy===0)bvy=1}' +
  'bvx=Math.max(-10,Math.min(10,bvx));';

var SERVE_FN = 'function serve(dir){bx=292;by=192;bvx=4*dir;bvy=[3,-3][Math.floor(Math.random()*2)]}';

var SCORING = 'if(bx<-20){score_r++;flash=12;serve(-1)}if(bx>620){score_l++;flash=12;serve(1)}';

var AI_LOGIC = 'var gap=by+bs/2-(p2Y+48);if(Math.abs(gap)>deadZone){p2Y+=Math.sign(gap)*aiSpeed}p2Y=Math.max(0,Math.min(304,p2Y));';

function wrap(code) {
  return '<!DOCTYPE html><html><head><meta charset="UTF-8">' + CSS_GAME +
    '<\/head><body>' + CANVAS_TAG + '<script>' + code + '<\/script><\/body><\/html>';
}

/* ===================================================
   CW_CONFIG - GML Pong steps + templates
   =================================================== */

window.CW_CONFIG = {
  storageKey: 'jvds-gml-pong-canvas',
  downloadName: 'my-gml-pong.html',

  hints: [
    'Two white paddles on a dark court with a dashed centre line',
    'The ball bounces off top and bottom walls with hspeed and vspeed',
    'The ball rebounds off paddles with spin from where it hits',
    'Scores appear at the top - the controller object draws them',
    'The right paddle chases the ball automatically with a dead zone',
    'Serve resets, rally speeds up, and first to 7 wins'
  ],

  templates: {
    1: function(u) {
      return wrap(
        SETUP + PADDLE_VARS + KEYS +
        'try{eval(' + JSON.stringify(gmlToJs(u)) + ')}catch(e){}' +
        'function loop(){' +
        MOVE_P1 +
        DRAW_BG + DRAW_NET + DRAW_PADDLES +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    2: function(u) {
      return wrap(
        SETUP + PADDLE_VARS + BALL_VARS + KEYS +
        'function loop(){' +
        MOVE_P1 +
        'try{eval(' + JSON.stringify(gmlToJs(u)) + ')}catch(e){}' +
        DRAW_BG + DRAW_NET + DRAW_PADDLES + DRAW_BALL +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    3: function(u) {
      return wrap(
        SETUP + PADDLE_VARS + BALL_VARS + KEYS +
        'let otherY=p1Y;' +
        'function loop(){' +
        MOVE_P1 +
        BALL_MOVE + WALL_BOUNCE +
        'otherY=bx<300?p1Y:p2Y;' +
        'try{eval(' + JSON.stringify(gmlToJs(u)) + ')}catch(e){}' +
        'bvx=Math.max(-10,Math.min(10,bvx));' +
        'if(bx<-20||bx>620){bx=292;by=192;bvx=4*(Math.random()<0.5?1:-1);bvy=[3,-3][Math.floor(Math.random()*2)]}' +
        DRAW_BG + DRAW_NET + DRAW_PADDLES + DRAW_BALL +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    4: function(u) {
      return wrap(
        SETUP + PADDLE_VARS + BALL_VARS + SCORE_VARS + KEYS +
        SERVE_FN +
        'function loop(){' +
        MOVE_P1 +
        BALL_MOVE + WALL_BOUNCE + PADDLE_HIT +
        'try{eval(' + JSON.stringify(gmlToJs(u)) + ')}catch(e){}' +
        DRAW_BG + DRAW_NET + DRAW_PADDLES + DRAW_BALL + DRAW_SCORES +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    5: function(u) {
      return wrap(
        SETUP + PADDLE_VARS + BALL_VARS + SCORE_VARS + AI_VARS + KEYS +
        SERVE_FN +
        'function loop(){' +
        MOVE_P1 +
        BALL_MOVE + WALL_BOUNCE + PADDLE_HIT + SCORING +
        'try{eval(' + JSON.stringify(gmlToJs(u)) + ')}catch(e){}' +
        'p2Y=Math.max(0,Math.min(304,p2Y));' +
        DRAW_BG + DRAW_NET + DRAW_PADDLES + DRAW_BALL + DRAW_SCORES +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    6: function(u) {
      return wrap(
        SETUP + PADDLE_VARS + BALL_VARS + SCORE_VARS + AI_VARS + STATE_VARS + KEYS +
        'let rPressed=false;document.addEventListener("keydown",function(e){if(e.code==="KeyR")rPressed=true});' +
        SERVE_FN +
        'function loop(){' +
        'if(gameState==="play"){' +
        MOVE_P1 +
        BALL_MOVE + WALL_BOUNCE + PADDLE_HIT +
        AI_LOGIC +
        'try{eval(' + JSON.stringify(gmlToJs(u)) + ')}catch(e){}' +
        'if(flash>0)flash--;' +
        '}else if(rPressed){score_l=0;score_r=0;flash=0;serve(1);gameState="play";rPressed=false}' +
        DRAW_BG +
        'if(flash>0){ctx.fillStyle="rgba(255,255,255,"+(flash/12*0.15)+")";ctx.fillRect(0,0,600,400)}' +
        DRAW_NET + DRAW_PADDLES + DRAW_BALL + DRAW_SCORES +
        'if(gameState==="over"){ctx.fillStyle="#fff";ctx.font="bold 36px monospace";ctx.textAlign="center";' +
        'ctx.fillText(score_l>=7?"PLAYER 1 WINS!":"PLAYER 2 WINS!",300,200);' +
        'ctx.font="18px monospace";ctx.fillText("Press R to play again",300,240)}' +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    }
  },

  steps: [
    {
      num: 1,
      title: 'Room, Sprite & First Object',
      goal: 'Set up the court: two paddles, dark background, dashed centre line. Move the left paddle with W/S.',
      points: [
        'GameMaker has three building blocks: <strong>Sprites</strong> (images), <strong>Objects</strong> (behaviour) and <strong>Rooms</strong> (levels)',
        'spr_paddle is 16x96 pixels, white. obj_paddle uses it and lives in Room1 (800x500, dark background)',
        'The <strong>Step event</strong> runs every frame (~60/s). <code>keyboard_check(ord("W"))</code> is true while held',
        '<code>clamp(y, 48, room_height - 48)</code> keeps the paddle on screen in one call'
      ],
      challenge: '🎯 Write the paddle Step event in GML:',
      starter: '// obj_paddle Step event\nif (keyboard_check(ord("W"))) y -= ___;\nif (keyboard_check(ord("S"))) y += ___;\n\n// Keep the paddle on screen\ny = clamp(y, 0, room_height - ___);',
      solution: '// obj_paddle Step event\nif (keyboard_check(ord("W"))) y -= 6;\nif (keyboard_check(ord("S"))) y += 6;\n\n// Keep the paddle on screen\ny = clamp(y, 0, room_height - 96);',
      checks: ['keyboard_check', 'ord', 'clamp'],
      height: 160,
      fills: {
        text: 'The three core GameMaker assets are sprites, ___ and rooms. The Step event runs every ___.',
        answers: ['objects', 'frame']
      },
      quiz: {
        question: 'The difference between an object and an instance is...',
        options: [
          'Spelling',
          'The object is the blueprint; instances are copies living in the room - one obj_paddle, two paddles',
          'Objects are bigger'
        ],
        correct: 1
      }
    },
    {
      num: 2,
      title: 'The Ball: hspeed & vspeed',
      goal: 'Launch a ball with built-in speed variables and bounce it off the top and bottom walls.',
      points: [
        'GameMaker objects have motion built in: set <code>hspeed</code> and <code>vspeed</code> in Create and the instance moves itself',
        '<code>choose(-4, 4)</code> is GML\'s coin-flip: a random serve direction each run',
        'Bounce off top/bottom: if the ball passes an edge, flip <code>vspeed</code>',
        'No position code needed in Step - the engine applies hspeed/vspeed to x/y every frame automatically'
      ],
      challenge: '🎯 Write the ball Create + Step events in GML:',
      starter: '/// Create Event\nhspeed = choose(-4, 4);\nvspeed = choose(-3, 3);\n\n/// Step Event\nif (y < 8 || y > room_height - ___) {\n    vspeed = ___;\n}',
      solution: '/// Create Event\nhspeed = choose(-4, 4);\nvspeed = choose(-3, 3);\n\n/// Step Event\nif (y < 8 || y > room_height - 8) {\n    vspeed = -vspeed;\n}',
      checks: ['hspeed', 'choose', 'vspeed', '-vspeed'],
      height: 180,
      fills: {
        text: 'GameMaker instances move themselves when ___ and vspeed are set. A random pick between listed values uses ___(-4, 4).',
        answers: ['hspeed', 'choose']
      },
      quiz: {
        question: 'Why does obj_ball move with NO movement code in Step?',
        options: [
          'A bug',
          'hspeed/vspeed are engine-integrated: GameMaker applies them to x/y automatically every frame',
          'The room moves instead'
        ],
        correct: 1
      }
    },
    {
      num: 3,
      title: 'Collision Events & Spin',
      goal: 'Bounce the ball off both paddles with position-based spin using GameMaker collision events.',
      points: [
        'Add a <strong>Collision event</strong> to obj_ball targeting obj_paddle - the code runs exactly when they touch',
        'Reverse and slightly grow <code>hspeed</code>: <code>hspeed = -hspeed * 1.05</code> for rally speed-up',
        'Spin: <code>vspeed = (y - other.y) / 12</code> - hit the edge for sharp angles',
        '<code>other</code> refers to the paddle instance in the collision - <code>other.y</code> is ITS position'
      ],
      challenge: '🎯 Write the collision event in GML:',
      starter: '// obj_ball Collision with obj_paddle\nhspeed = -hspeed * ___;\n\n// Spin from hit position\nvspeed = (y - other.y) / ___;\n\n// Never fully flat\nif (vspeed == 0) vspeed = ___;',
      solution: '// obj_ball Collision with obj_paddle\nhspeed = -hspeed * 1.05;\n\n// Spin from hit position\nvspeed = (y - other.y) / 12;\n\n// Never fully flat\nif (vspeed == 0) vspeed = 1;',
      checks: ['hspeed', 'other.y', 'vspeed'],
      height: 180,
      fills: {
        text: 'The keyword ___ refers to the specific instance you collided with. The rally grows ___% faster per hit.',
        answers: ['other', '5']
      },
      quiz: {
        question: 'In a collision event, "other" means...',
        options: [
          'Any random object',
          'The specific instance you collided with - here, exactly which paddle got hit',
          'The previous ball'
        ],
        correct: 1
      }
    },
    {
      num: 4,
      title: 'Scoring & the Controller Object',
      goal: 'Track score with global variables in a controller object and re-serve after points.',
      points: [
        'Create <strong>obj_game</strong> with no sprite - invisible manager objects are a core GameMaker pattern',
        '<code>global.score_l</code> and <code>global.score_r</code> are reachable from any object',
        'Ball past left edge: <code>global.score_r++</code>, re-serve toward the loser',
        '<strong>Draw GUI</strong> event draws both scores big and centred with <code>draw_text_transformed</code>'
      ],
      challenge: '🎯 Write the scoring logic in obj_ball Step:',
      starter: '// Ball exits left side\nif (x < -20) {\n    global.___ ++;\n    serve(-1);\n}\n// Ball exits right side\nif (x > 620) {\n    global.___ ++;\n    serve(1);\n}',
      solution: '// Ball exits left side\nif (x < -20) {\n    global.score_r ++;\n    serve(-1);\n}\n// Ball exits right side\nif (x > 620) {\n    global.score_l ++;\n    serve(1);\n}',
      checks: ['score_r', 'score_l', 'serve'],
      height: 200,
      fills: {
        text: 'Variables reachable from every object are prefixed ___. An invisible manager object like obj_game is a classic GameMaker ___ pattern.',
        answers: ['global', 'controller']
      },
      quiz: {
        question: 'Why put score in a controller object instead of inside the ball?',
        options: [
          'Balls cannot count',
          'The ball resets/respawns - data that must outlive gameplay objects belongs in a persistent manager',
          'GUI events need it'
        ],
        correct: 1
      }
    },
    {
      num: 5,
      title: 'AI Paddle with Dead Zone',
      goal: 'Replace player 2 with an AI that chases the ball but can be beaten.',
      points: [
        'Compare paddle centre to ball centre: <code>var gap = obj_ball.y - y</code>',
        '<code>abs(gap) > 12</code> is the dead zone - the AI ignores tiny differences, adding human-like hesitation',
        '<code>sign(gap)</code> gives pure direction (-1 or 1), letting you cap chase speed at exactly 5',
        '<code>instance_exists(obj_ball)</code> guards against the gap when the ball respawns'
      ],
      challenge: '🎯 Write the AI chase in obj_paddle_ai Step:',
      starter: 'if (instance_exists(obj_ball)) {\n    var gap = obj_ball.y - y;\n    if (___(gap) > 12) {\n        y += ___(gap) * 5;\n    }\n    y = clamp(y, 48, room_height - 48);\n}',
      solution: 'if (instance_exists(obj_ball)) {\n    var gap = obj_ball.y - y;\n    if (abs(gap) > 12) {\n        y += sign(gap) * 5;\n    }\n    y = clamp(y, 48, room_height - 48);\n}',
      checks: ['abs', 'sign', 'gap', 'clamp'],
      height: 200,
      fills: {
        text: 'The dead zone stops the AI reacting to gaps smaller than ___ pixels. sign() returns -1, 0 or ___, pure direction.',
        answers: ['12', '1']
      },
      quiz: {
        question: 'Why give the AI a speed limit and dead zone?',
        options: [
          'To save CPU power',
          'A flawless AI cannot be beaten - deliberate weakness is what makes it fun',
          'GML timers require it'
        ],
        correct: 1
      }
    },
    {
      num: 6,
      title: 'Win Screen & Polish',
      goal: 'Add a score flash, first-to-7 win condition, and a restart loop.',
      points: [
        'When either score reaches 7: set <code>gameState = "over"</code> and show the winner',
        'Flash effect: set <code>flash = 12</code> on every score - a white overlay fades each frame',
        'Rally speed-up is already built in from step 3 (hspeed * 1.05 per hit, capped at 10)',
        'Pressing R resets scores and serves fresh - the classic arcade loop via <code>keyboard_check_pressed(ord("R"))</code>'
      ],
      challenge: '🎯 Write the scoring with flash and win detection:',
      starter: '// Score with flash\nif (x < -20) {\n    global.score_r++;\n    flash = ___;\n    serve(-1);\n}\nif (x > 620) {\n    global.score_l++;\n    flash = ___;\n    serve(1);\n}\n\n// Win condition\nif (global.score_l >= ___ || global.score_r >= ___) {\n    gameState = "___";\n}',
      solution: '// Score with flash\nif (x < -20) {\n    global.score_r++;\n    flash = 12;\n    serve(-1);\n}\nif (x > 620) {\n    global.score_l++;\n    flash = 12;\n    serve(1);\n}\n\n// Win condition\nif (global.score_l >= 7 || global.score_r >= 7) {\n    gameState = "over";\n}',
      checks: ['flash', 'score_l', 'score_r', 'over'],
      height: 300,
      fills: {
        text: 'The flash counter starts at ___ and counts down each frame. Game developers call effects like flashes and screen shakes ___.',
        answers: ['12', 'juice']
      },
      quiz: {
        question: 'Which pattern from Pong appears in almost every commercial game?',
        options: [
          'The dashed centre line',
          'The MENU / PLAYING / GAME_OVER state machine and restart loop',
          'The beep sound'
        ],
        correct: 1
      }
    }
  ]
};
</script>
<script src="../workshop-canvas-engine.js"></script>
<script defer src="/feedback-widget.js"></script>
