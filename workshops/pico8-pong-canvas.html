<body>

<div class="cw-header">
  <h1>PICO-8 Pong Build Canvas <span class="cw-lang-tag">&#x1f3ae; PICO-8</span></h1>

  <div class="cw-canvas-panel" id="canvasPanel">

      <span id="cwProgressText">Step 1 / 6</span>

<script>
'use strict';

function p8ToJs(code) {
  return code
    .replace(/--.*$/gm, '')
    .replace(/\blocal\s+/g, 'let ')
    .replace(/\bthen\b/g, '{')
    .replace(/\belseif\b/g, '} else if')
    .replace(/\belse\b(?!\s*if)/g, '} else {')
    .replace(/\bend\b/g, '}')
    .replace(/~=/g, '!==')
    .replace(/\.\./g, '+')
    .replace(/#(\w+)/g, '$1.length')
    .replace(/\badd\((\w+),\s*([^)]+)\)/g, '$1.push($2)')
    .replace(/\bdel\((\w+),\s*([^)]+)\)/g, '$1.splice($1.indexOf($2),1)')
    .replace(/\brnd\(([^)]*)\)/g, 'Math.random()*($1)')
    .replace(/\bflr\(/g, 'Math.floor(')
    .replace(/\bbtn\(0\)/g, 'leftHeld')
    .replace(/\bbtn\(1\)/g, 'rightHeld')
    .replace(/\bbtn\(2\)/g, 'upHeld')
    .replace(/\bbtn\(3\)/g, 'downHeld')
    .replace(/\bbtn\(4\)/g, 'zHeld')
    .replace(/\bbtn\(5\)/g, 'xHeld')
    .replace(/\bbtnp\(0\)/g, 'leftPressed')
    .replace(/\bbtnp\(1\)/g, 'rightPressed')
    .replace(/\bbtnp\(2\)/g, 'upPressed')
    .replace(/\bbtnp\(3\)/g, 'downPressed')
    .replace(/\bbtnp\(4\)/g, 'zPressed')
    .replace(/\bbtnp\(5\)/g, 'xPressed')
    .replace(/\bprint\(([^,]+),\s*([^,]+),\s*([^,]+),\s*([^)]+)\)/g,
      'ctx.fillStyle=P8PAL[$4]||"#fff";ctx.fillText($1,$2*3,$3*3)')
    .replace(/\bnil\b/g, 'null')
    .replace(/\bfunction\s+(\w+)\(([^)]*)\)/g, 'function $1($2){')
    .replace(/\bnot\s+/g, '!')
    .replace(/\band\b/g, '&&')
    .replace(/\bor\b/g, '||');
}

/* ===================================================
   IFRAME BUILDING BLOCKS (PICO-8 Pong)
   =================================================== */
var S = 3;

var P8PAL = '{0:"#000",1:"#1d2b53",2:"#7e2553",3:"#008751",4:"#ab5236",5:"#5f574f",6:"#c2c3c7",7:"#fff",8:"#ff004d",9:"#ffa300",10:"#ffec27",11:"#00e436",12:"#29adff",13:"#83769c",14:"#ff77a8",15:"#ffccaa"}';

var CSS_GAME = '<style>body{display:flex;flex-direction:column;align-items:center;background:#000;margin:0;overflow:hidden}canvas{display:block;image-rendering:pixelated;cursor:pointer}</style>';

var CANVAS_TAG = '<canvas id="game" width="384" height="384"></canvas>';

var SETUP = 'const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");ctx.font="bold 12px monospace";const S=3,P8PAL=' + P8PAL + ';';

var PADDLE_VARS = 'let p1y=48,p2y=48;const pw=4,ph=24,pspd=2;';

var BALL_VARS = 'let bx=62,by=62,bvx=1,bvy=1,bsz=4;';

var SCORE_VARS = 'let s1=0,s2=0;';

var STATE_VARS = 'let gameState="play";';

var AI_VARS = 'let aiSpd=1.5,aiDead=6;';

var KEYS = 'let leftHeld=false,rightHeld=false,upHeld=false,downHeld=false,zHeld=false,xHeld=false;' +
  'document.addEventListener("keydown",function(e){' +
    'if(e.code==="ArrowLeft"||e.code==="KeyA")leftHeld=true;' +
    'if(e.code==="ArrowRight"||e.code==="KeyD")rightHeld=true;' +
    'if(e.code==="ArrowUp"||e.code==="KeyW")upHeld=true;' +
    'if(e.code==="ArrowDown"||e.code==="KeyS")downHeld=true;' +
    'if(e.code==="KeyZ")zHeld=true;if(e.code==="KeyX")xHeld=true;' +
    'e.preventDefault()});' +
  'document.addEventListener("keyup",function(e){' +
    'if(e.code==="ArrowLeft"||e.code==="KeyA")leftHeld=false;' +
    'if(e.code==="ArrowRight"||e.code==="KeyD")rightHeld=false;' +
    'if(e.code==="ArrowUp"||e.code==="KeyW")upHeld=false;' +
    'if(e.code==="ArrowDown"||e.code==="KeyS")downHeld=false;' +
    'if(e.code==="KeyZ")zHeld=false;if(e.code==="KeyX")xHeld=false});';

var MOVE_P1 = 'if(upHeld)p1y-=pspd;if(downHeld)p1y+=pspd;p1y=Math.max(0,Math.min(128-ph,p1y));';

var DRAW_BG = 'ctx.fillStyle=P8PAL[1];ctx.fillRect(0,0,384,384);';

var DRAW_NET = 'ctx.fillStyle=P8PAL[5];for(var ni=0;ni<128;ni+=8){ctx.fillRect(63*S,ni*S,2*S,4*S)}';

var DRAW_PADDLES = 'ctx.fillStyle=P8PAL[7];ctx.fillRect(4*S,p1y*S,pw*S,ph*S);ctx.fillRect(120*S,p2y*S,pw*S,ph*S);';

var DRAW_BALL = 'ctx.fillStyle=P8PAL[7];ctx.fillRect(bx*S,by*S,bsz*S,bsz*S);';

var DRAW_SCORES = 'ctx.fillStyle=P8PAL[7];ctx.font="bold 18px monospace";ctx.textAlign="center";ctx.fillText(s1,45*S,10*S);ctx.fillText(s2,83*S,10*S);';

var BALL_MOVE = 'bx+=bvx;by+=bvy;';

var WALL_BOUNCE = 'if(by<=0||by+bsz>=128)bvy=-bvy;';

var PADDLE_HIT = 'if(bx<=8&&bx+bsz>=4&&by+bsz>=p1y&&by<=p1y+ph&&bvx<0){bvx=-bvx*1.05;bvy=(by+bsz/2-(p1y+ph/2))/8}' +
  'if(bx+bsz>=120&&bx<=124&&by+bsz>=p2y&&by<=p2y+ph&&bvx>0){bvx=-bvx*1.05;bvy=(by+bsz/2-(p2y+ph/2))/8}' +
  'bvx=Math.max(-3,Math.min(3,bvx));';

var SERVE_FN = 'function serve(dir){bx=62;by=62;bvx=1*dir;bvy=Math.random()<0.5?1:-1}';

var SCORING = 'if(bx<-8){s2++;serve(-1)}if(bx>136){s1++;serve(1)}';

var AI_LOGIC = 'var ag=by+bsz/2-(p2y+ph/2);if(Math.abs(ag)>aiDead){p2y+=Math.sign(ag)*aiSpd}p2y=Math.max(0,Math.min(128-ph,p2y));';

function wrap(code) {
  return '<!DOCTYPE html><html><head><meta charset="UTF-8">' + CSS_GAME +
    '<\/head><body>' + CANVAS_TAG + '<script>' + code + '<\/script><\/body><\/html>';
}

window.CW_CONFIG = {
  storageKey: 'jvds-pico8-pong-canvas',
  downloadName: 'my-pico8-pong.html',

  hints: [
    'Two white paddles on a dark navy court',
    'The ball bounces off top and bottom walls',
    'The ball rebounds off paddles with angle spin',
    'Scores appear at the top centre',
    'The right paddle chases the ball as simple AI',
    'First to 5 wins - press R to restart'
  ],

  templates: {
    1: function(u) {
      return wrap(
        SETUP + PADDLE_VARS + KEYS +
        'try{eval(' + JSON.stringify(p8ToJs(u)) + ')}catch(e){}' +
        'function loop(){' +
        MOVE_P1 +
        DRAW_BG + DRAW_NET + DRAW_PADDLES +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    2: function(u) {
      return wrap(
        SETUP + PADDLE_VARS + BALL_VARS + KEYS +
        'function loop(){' +
        MOVE_P1 +
        'try{eval(' + JSON.stringify(p8ToJs(u)) + ')}catch(e){}' +
        DRAW_BG + DRAW_NET + DRAW_PADDLES + DRAW_BALL +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    3: function(u) {
      return wrap(
        SETUP + PADDLE_VARS + BALL_VARS + KEYS +
        'function loop(){' +
        MOVE_P1 + BALL_MOVE + WALL_BOUNCE +
        'try{eval(' + JSON.stringify(p8ToJs(u)) + ')}catch(e){}' +
        'bvx=Math.max(-3,Math.min(3,bvx));' +
        'if(bx<-8||bx>136){bx=62;by=62;bvx=Math.random()<.5?1:-1;bvy=Math.random()<.5?1:-1}' +
        DRAW_BG + DRAW_NET + DRAW_PADDLES + DRAW_BALL +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    4: function(u) {
      return wrap(
        SETUP + PADDLE_VARS + BALL_VARS + SCORE_VARS + KEYS +
        SERVE_FN +
        'function loop(){' +
        MOVE_P1 + BALL_MOVE + WALL_BOUNCE + PADDLE_HIT +
        'try{eval(' + JSON.stringify(p8ToJs(u)) + ')}catch(e){}' +
        DRAW_BG + DRAW_NET + DRAW_PADDLES + DRAW_BALL + DRAW_SCORES +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    5: function(u) {
      return wrap(
        SETUP + PADDLE_VARS + BALL_VARS + SCORE_VARS + AI_VARS + KEYS +
        SERVE_FN +
        'function loop(){' +
        MOVE_P1 + BALL_MOVE + WALL_BOUNCE + PADDLE_HIT + SCORING +
        'try{eval(' + JSON.stringify(p8ToJs(u)) + ')}catch(e){}' +
        'p2y=Math.max(0,Math.min(128-ph,p2y));' +
        DRAW_BG + DRAW_NET + DRAW_PADDLES + DRAW_BALL + DRAW_SCORES +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    },
    6: function(u) {
      return wrap(
        SETUP + PADDLE_VARS + BALL_VARS + SCORE_VARS + AI_VARS + STATE_VARS + KEYS +
        'document.addEventListener("keydown",function(e){if(e.code==="KeyR"&&gameState==="over"){s1=0;s2=0;serve(1);gameState="play"}});' +
        SERVE_FN +
        'function loop(){' +
        'if(gameState==="play"){' +
        MOVE_P1 + BALL_MOVE + WALL_BOUNCE + PADDLE_HIT + SCORING +
        AI_LOGIC +
        'try{eval(' + JSON.stringify(p8ToJs(u)) + ')}catch(e){}' +
        '}' +
        DRAW_BG + DRAW_NET + DRAW_PADDLES + DRAW_BALL + DRAW_SCORES +
        'if(gameState==="over"){ctx.fillStyle=P8PAL[7];ctx.font="bold 18px monospace";ctx.textAlign="center";' +
        'ctx.fillText(s1>=5?"you win!":"cpu wins!",64*S,60*S);ctx.font="12px monospace";ctx.fillText("press r to restart",64*S,72*S)}' +
        'requestAnimationFrame(loop)}requestAnimationFrame(loop);'
      );
    }
  },

  steps: [
    {
      num: 1,
      title: 'The Court & Paddles',
      goal: 'Draw two paddles and a dashed centre line on the PICO-8 screen.',
      points: [
        'The court is the full 128x128 PICO-8 screen with a dark navy background (colour 1)',
        'Each paddle is 4 pixels wide and 24 tall - small for the tiny screen',
        'Left paddle at x=4, right paddle at x=120. Both start at y=48 (centred)',
        'Move the left paddle with btn(2) up and btn(3) down'
      ],
      challenge: '🎮 Set up the paddle positions:',
      starter: '-- paddle size and position\npw = 4\nph = ___\np1y = ___\np2y = 48',
      solution: '-- paddle size and position\npw = 4\nph = 24\np1y = 48\np2y = 48',
      checks: ['24', '48'],
      height: 120,
      fills: {
        text: 'Each paddle is ___ pixels tall. They start at y = ___ to be vertically centred.',
        answers: ['24', '48']
      },
      quiz: {
        question: 'Why are the paddles only 4 pixels wide on a 128-pixel screen?',
        options: [
          'They are broken',
          'On a tiny screen every pixel counts - 4px is proportionally the same as 24px on a 768px screen',
          'PICO-8 limits sprite width to 4'
        ],
        correct: 1
      }
    },
    {
      num: 2,
      title: 'Ball Movement',
      goal: 'Launch a ball and bounce it off the top and bottom walls.',
      points: [
        'The ball starts at the centre: <code>bx=62, by=62</code> with velocity <code>bvx=1, bvy=1</code>',
        'Each frame: <code>bx += bvx</code> and <code>by += bvy</code>',
        'Wall bounce: if by touches 0 or 128, flip bvy: <code>bvy = -bvy</code>',
        'On PICO-8 scale, speed 1 pixel/frame feels like a real pong ball'
      ],
      challenge: '🎮 Write the ball movement and wall bounce:',
      starter: '-- move the ball\nbx += bvx\nby += ___\n\n-- bounce off top and bottom\nif by <= 0 or by + bsz >= ___ then\n  bvy = -bvy\nend',
      solution: '-- move the ball\nbx += bvx\nby += bvy\n\n-- bounce off top and bottom\nif by <= 0 or by + bsz >= 128 then\n  bvy = -bvy\nend',
      checks: ['bvy', '128', '-bvy'],
      height: 160,
      fills: {
        text: 'Flipping bvy means multiplying it by ___. The screen height is ___ pixels.',
        answers: ['-1', '128']
      },
      quiz: {
        question: 'Why check by + bsz instead of just by for the bottom wall?',
        options: [
          'bsz is the ball size - we need to check its bottom edge, not its top-left corner, or it clips through the wall',
          'It makes the ball faster',
          'PICO-8 measures from the centre'
        ],
        correct: 0
      }
    },
    {
      num: 3,
      title: 'Paddle Collision',
      goal: 'Bounce the ball off paddles with angle spin.',
      points: [
        'Check if the ball overlaps a paddle using edge comparisons (AABB)',
        'On hit: reverse bvx and multiply by 1.05 for slight rally speed-up',
        'Spin: <code>bvy = (ball_centre - paddle_centre) / 8</code> - hit the edge for steep angles',
        'Only bounce when the ball is moving TOWARD the paddle (bvx < 0 for left paddle)'
      ],
      challenge: '🎮 Write the paddle bounce:',
      starter: '-- left paddle hit\nif bx <= 8 and by + bsz >= p1y and by <= p1y + ph and bvx < 0 then\n  bvx = -bvx * ___\n  bvy = (by + bsz/2 - (p1y + ph/2)) / ___\nend',
      solution: '-- left paddle hit\nif bx <= 8 and by + bsz >= p1y and by <= p1y + ph and bvx < 0 then\n  bvx = -bvx * 1.05\n  bvy = (by + bsz/2 - (p1y + ph/2)) / 8\nend',
      checks: ['1.05', 'bvx', 'bvy', 'p1y'],
      height: 160,
      fills: {
        text: 'The rally speeds up ___% each hit. Dividing the offset by 8 controls the ___ angle.',
        answers: ['5', 'bounce']
      },
      quiz: {
        question: 'Why check bvx < 0 before bouncing off the left paddle?',
        options: [
          'Without it, a ball sitting inside the paddle would flip direction every frame and get stuck vibrating',
          'Negative speeds are faster',
          'PICO-8 requires direction checks'
        ],
        correct: 0
      }
    },
    {
      num: 4,
      title: 'Scoring',
      goal: 'Award points when the ball exits left or right and re-serve.',
      points: [
        'Ball past left edge (bx < -8): right player scores, serve goes left',
        'Ball past right edge (bx > 136): left player scores, serve goes right',
        'Serve resets the ball to centre with a fresh direction',
        'Scores display at the top in large text'
      ],
      challenge: '🎮 Write the scoring logic:',
      starter: '-- ball exits left\nif bx < -8 then\n  ___ += 1\n  serve(-1)\nend\n-- ball exits right\nif bx > 136 then\n  ___ += 1\n  serve(1)\nend',
      solution: '-- ball exits left\nif bx < -8 then\n  s2 += 1\n  serve(-1)\nend\n-- ball exits right\nif bx > 136 then\n  s1 += 1\n  serve(1)\nend',
      checks: ['s2', 's1', 'serve'],
      height: 180,
      fills: {
        text: 'When the ball exits the left side, player ___ scores. The serve direction is ___ (toward the loser).',
        answers: ['2', '-1']
      },
      quiz: {
        question: 'Why serve toward the player who just lost the point?',
        options: [
          'It is random',
          'Serving toward the loser gives them the first touch - a small fairness gesture borrowed from real table tennis',
          'The ball moves faster that way'
        ],
        correct: 1
      }
    },
    {
      num: 5,
      title: 'AI Paddle',
      goal: 'Make the right paddle chase the ball with a beatable AI.',
      points: [
        'Compare ball centre to paddle centre: <code>gap = by + bsz/2 - (p2y + ph/2)</code>',
        'Dead zone: only move if <code>abs(gap) > 6</code> - the AI ignores tiny differences',
        'Chase speed 1.5 is slower than the ball, so angled shots can beat it',
        'Clamp p2y to keep the AI paddle on screen'
      ],
      challenge: '🎮 Write the AI chase:',
      starter: '-- AI chases the ball\nlocal gap = by + bsz/2 - (p2y + ph/2)\nif flr(rnd(1)) == 0 or true then\n  if gap > ___ then\n    p2y += ___\n  elseif gap < -___ then\n    p2y -= ___\n  end\nend',
      solution: '-- AI chases the ball\nlocal gap = by + bsz/2 - (p2y + ph/2)\nif flr(rnd(1)) == 0 or true then\n  if gap > 6 then\n    p2y += 1.5\n  elseif gap < -6 then\n    p2y -= 1.5\n  end\nend',
      checks: ['gap', '6', '1.5', 'p2y'],
      height: 200,
      fills: {
        text: 'The dead zone is ___ pixels. The AI moves at ___ pixels per frame, slower than the ball.',
        answers: ['6', '1.5']
      },
      quiz: {
        question: 'What makes this AI beatable despite always chasing the ball?',
        options: [
          'It moves randomly',
          'Its speed (1.5) is slower than the ball and the dead zone adds reaction delay - steep angle shots outrun it',
          'It only works on easy mode'
        ],
        correct: 1
      }
    },
    {
      num: 6,
      title: 'Win Condition & Restart',
      goal: 'First to 5 wins. Show the winner and press R to restart.',
      points: [
        'Check after each score: <code>if s1 >= 5 or s2 >= 5 then gameState = "over" end</code>',
        'Display "you win!" or "cpu wins!" based on who reached 5 first',
        'R key resets both scores to 0 and re-serves',
        'This state machine pattern (play/over) appears in nearly every game'
      ],
      challenge: '🎮 Write the win check:',
      starter: '-- check for winner\nif s1 >= ___ or s2 >= ___ then\n  gameState = "___"\nend',
      solution: '-- check for winner\nif s1 >= 5 or s2 >= 5 then\n  gameState = "over"\nend',
      checks: ['5', 'over', 'gamestate'],
      height: 100,
      fills: {
        text: 'The game ends when either score reaches ___. The two game states are "play" and "___".',
        answers: ['5', 'over']
      },
      quiz: {
        question: 'Why use a gameState string instead of a boolean like gameOver?',
        options: [
          'Strings are faster',
          'A string state machine scales - you can add "menu", "paused", "win" without rewriting the logic',
          'Booleans do not work in Lua'
        ],
        correct: 1
      }
    }
  ]
};
</script>
<script src="../workshop-canvas-engine.js"></script>
<script defer src="/feedback-widget.js"></script>
<script defer src="/jvds-funnel.js"></script>
</body>
