<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Pips_Night_Sky | JVDesignStudio</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Nunito:wght@400;800&display=swap" rel="stylesheet">

<style>
:root {
    --night-deep: #080f18;
    --night-core: #0d1b2a;
    --night-lt:   #1b263b;
    --lantern:    #f5a623;
    --moon:       #e8d5a0;
    --beige:      #F0EAD6;
    --glass:      rgba(255, 255, 255, 0.05);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body, html { 
    margin: 0; padding: 0; width: 100%; height: 100%; 
    background: var(--night-deep); color: var(--beige);
    font-family: 'Fredoka', sans-serif; overflow: hidden;
}

/* ══ RESPONSIVE WRAPPER ══ */
.app-shell {
    width: 100%; max-width: 500px; height: 100dvh;
    margin: 0 auto; display: flex; flex-direction: column;
    position: relative; background: var(--night-core);
    box-shadow: 0 0 100px rgba(0,0,0,0.5);
}

/* ══ HUD ══ */
.hud-top {
    padding: calc(env(safe-area-inset-top) + 15px) 20px 10px;
    display: flex; justify-content: space-between; align-items: center; z-index: 10;
}
.stat-group { display: flex; gap: 10px; }
.pill {
    background: var(--glass); border: 1px solid rgba(232,213,160,0.2);
    padding: 6px 14px; border-radius: 100px; font-weight: 600;
}

/* ══ GAME CANVAS ══ */
.stage {
    flex: 1; position: relative; overflow: hidden;
    cursor: pointer; touch-action: none;
}
#starfield { position: absolute; inset: 0; z-index: 1; }
#gameCanvas { position: absolute; inset: 0; z-index: 2; }

/* ══ INFO CARD ══ */
.footer-card {
    background: var(--night-lt); border-radius: 30px 30px 0 0;
    padding: 25px 25px calc(env(safe-area-inset-bottom) + 20px);
    box-shadow: 0 -10px 30px rgba(0,0,0,0.3); z-index: 10;
}
.lvl-meta { color: var(--lantern); text-transform: uppercase; font-size: 12px; letter-spacing: 2px; margin-bottom: 5px; }
.const-name { font-size: 24px; font-weight: 700; margin-bottom: 15px; }

.audio-toggle {
    position: absolute; top: 80px; right: 20px;
    width: 40px; height: 40px; border-radius: 50%;
    background: var(--glass); border: none; color: white;
    cursor: pointer; z-index: 100;
}

/* ══ PROGRESS ══ */
.prog-container { height: 8px; background: rgba(0,0,0,0.3); border-radius: 10px; overflow: hidden; }
.prog-fill { height: 100%; background: var(--lantern); width: 0%; transition: width 0.4s cubic-bezier(0.17, 0.67, 0.83, 0.67); }
</style>
</head>
<body>

<div class="app-shell">
    <button class="audio-toggle" onclick="audio.toggle()">🎵</button>
    
    <div class="hud-top">
        <div style="font-size: 20px; font-weight: 700;">Pips_Sky</div>
        <div class="stat-group">
            <div class="pill">✨ <span id="star-total">0</span></div>
        </div>
    </div>

    <div class="stage" id="stage">
        <canvas id="starfield"></canvas>
        <canvas id="gameCanvas"></canvas>
    </div>

    <div class="footer-card">
        <div class="lvl-meta" id="lvl-tag">Constellation 1</div>
        <div class="const-name" id="const-name">Loading...</div>
        <div class="prog-container"><div class="prog-fill" id="prog-bar"></div></div>
    </div>
</div>

<script>
// ══ AUDIO ENGINE (Synthesized for zero-asset loading) ══
const audio = {
    ctx: null,
    enabled: false,
    init() {
        this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        this.enabled = true;
    },
    playPing(freq = 440) {
        if(!this.enabled) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
        gain.gain.setValueAtTime(0.1, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + 0.5);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start();
        osc.stop(this.ctx.currentTime + 0.5);
    },
    toggle() {
        if(!this.ctx) this.init();
        this.enabled = !this.enabled;
        document.querySelector('.audio-toggle').textContent = this.enabled ? '🎵' : '🔇';
    }
};

// ══ GAME DATA (Complex Shapes) ══
const LEVELS = [
    { name: "The Wandering Pip", seq: [0,1,2,3,4,0], stars: [[0.5, 0.2], [0.8, 0.4], [0.7, 0.8], [0.3, 0.8], [0.2, 0.4]] },
    { name: "Celestial Shell", seq: [0,1,2,3,4,5,1], stars: [[0.5,0.1], [0.5,0.4], [0.2,0.5], [0.3,0.8], [0.7,0.8], [0.8,0.5]] },
    { name: "The North Star", seq: [0,1,2,3,0,4,5], stars: [[0.5,0.5], [0.2,0.2], [0.8,0.2], [0.5,0.5], [0.5,0.8], [0.5,0.9]] }
];

// ══ STATE ══
let vault = { level: 0, stars: 0 };
let currentIndex = 0;
let lines = [];

const gCanvas = document.getElementById('gameCanvas');
const gCtx = gCanvas.getContext('2d');
const sCanvas = document.getElementById('starfield');
const sCtx = sCanvas.getContext('2d');

function init() {
    resize();
    window.addEventListener('resize', resize);
    
    // Pointer Events for PC + Mobile
    gCanvas.addEventListener('pointerdown', (e) => {
        if(!audio.ctx) audio.init();
        handleInput(e);
    });

    drawStarfield();
    loadLevel(vault.level);
}

function resize() {
    const parent = document.getElementById('stage');
    [gCanvas, sCanvas].forEach(c => {
        c.width = parent.clientWidth * window.devicePixelRatio;
        c.height = parent.clientHeight * window.devicePixelRatio;
    });
    drawStarfield();
    render();
}

function drawStarfield() {
    sCtx.clearRect(0,0,sCanvas.width,sCanvas.height);
    const w = sCanvas.width; const h = sCanvas.height;
    for(let i=0; i<100; i++) {
        sCtx.fillStyle = `rgba(232, 213, 160, ${Math.random() * 0.5})`;
        sCtx.beginPath();
        sCtx.arc(Math.random()*w, Math.random()*h, Math.random()*2, 0, Math.PI*2);
        sCtx.fill();
    }
}

function loadLevel(idx) {
    currentIndex = 0;
    lines = [];
    document.getElementById('const-name').textContent = LEVELS[idx].name;
    document.getElementById('lvl-tag').textContent = `Constellation ${idx + 1}`;
    updateUI();
    render();
}

function handleInput(e) {
    const rect = gCanvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width;
    const y = (e.clientY - rect.top) / rect.height;

    const level = LEVELS[vault.level];
    const targetIdx = level.seq[currentIndex + 1];
    const target = level.stars[targetIdx];

    const dist = Math.hypot(target[0] - x, target[1] - y);
    if(dist < 0.1) {
        lines.push([level.seq[currentIndex], targetIdx]);
        currentIndex++;
        audio.playPing(400 + (currentIndex * 50));
        
        if(currentIndex === level.seq.length - 1) {
            finishLevel();
        }
        updateUI();
        render();
    }
}

function render() {
    gCtx.clearRect(0,0,gCanvas.width,gCanvas.height);
    const w = gCanvas.width; const h = gCanvas.height;
    const level = LEVELS[vault.level];

    // Draw active lines
    gCtx.strokeStyle = '#f5a623';
    gCtx.lineWidth = 5 * window.devicePixelRatio;
    gCtx.shadowBlur = 20;
    gCtx.shadowColor = '#f5a623';
    
    gCtx.beginPath();
    lines.forEach(line => {
        const p1 = level.stars[line[0]];
        const p2 = level.stars[line[1]];
        gCtx.moveTo(p1[0]*w, p1[1]*h);
        gCtx.lineTo(p2[0]*w, p2[1]*h);
    });
    gCtx.stroke();
    gCtx.shadowBlur = 0;

    // Draw Stars
    level.stars.forEach((s, i) => {
        const isActive = level.seq.slice(0, currentIndex + 1).includes(i);
        gCtx.fillStyle = isActive ? '#f5a623' : 'rgba(232, 213, 160, 0.3)';
        gCtx.beginPath();
        gCtx.arc(s[0]*w, s[1]*h, 6 * window.devicePixelRatio, 0, Math.PI*2);
        gCtx.fill();
    });
}

function updateUI() {
    const prog = (currentIndex / (LEVELS[vault.level].seq.length - 1)) * 100;
    document.getElementById('prog-bar').style.width = prog + '%';
    document.getElementById('star-total').textContent = vault.stars;
}

function finishLevel() {
    vault.stars += 50;
    setTimeout(() => {
        vault.level = (vault.level + 1) % LEVELS.length;
        loadLevel(vault.level);
    }, 1000);
}

init();
</script>
</body>
</html>
