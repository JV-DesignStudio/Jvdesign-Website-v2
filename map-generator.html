<style>
:root{
  --bg:#08080f;--panel:#0f0f1e;--panel2:#161628;--panel3:#1e1e38;

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;overflow:hidden;}
body{display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:'JetBrains Mono',monospace;}

.hdr{height:46px;background:rgba(8,8,18,.98);border-bottom:1px solid var(--border2);display:flex;align-items:center;justify-content:space-between;padding:0 14px;flex-shrink:0;}

<script>
function id(x){return document.getElementById(x);}

let currentMode='dungeon';
let currentMap=null;
let zoom=1;

function setMode(m){
  currentMode=m;
  ['dungeon','world','island'].forEach(x=>{
    id('mode-'+x).classList.toggle('on',x===m);
    id(x+'Ctrls').style.display=x===m?'block':'none';
  });
  generate();
}

function randomSeed(){
  id('seedInput').value=Math.floor(Math.random()*99999);
  generate();
}

// ── Seeded RNG (mulberry32) ──
function seedRNG(seedStr){
  let h=0;
  for(let i=0;i<seedStr.length;i++){h=Math.imul(31,h)+seedStr.charCodeAt(i)|0;}
  let s=h>>>0;
  return ()=>{s+=0x6D2B79F5;let t=Math.imul(s^s>>>15,1|s);t^=t+Math.imul(t^t>>>7,61|t);return((t^t>>>14)>>>0)/4294967296;};
}

// ── Perlin-like noise (value noise) ──
function makeNoise(rng){
  const SIZE=256;
  const table=new Float32Array(SIZE*SIZE);
  for(let i=0;i<table.length;i++) table[i]=rng()*2-1;
  function lerp(a,b,t){return a+(b-a)*(t*t*(3-2*t));}
  function get(x,y){
    const ix=Math.floor(x)&(SIZE-1), iy=Math.floor(y)&(SIZE-1);
    const fx=x-Math.floor(x), fy=y-Math.floor(y);
    const a=table[iy*SIZE+ix], b=table[iy*SIZE+((ix+1)&(SIZE-1))];
    const c=table[((iy+1)&(SIZE-1))*SIZE+ix], d=table[((iy+1)&(SIZE-1))*SIZE+((ix+1)&(SIZE-1))];
    return lerp(lerp(a,b,fx),lerp(c,d,fx),fy);
  }
  function octave(x,y,octs=4,pers=.5,lac=2){
    let v=0,amp=1,freq=1,max=0;
    for(let i=0;i<octs;i++){v+=get(x*freq,y*freq)*amp;max+=amp;amp*=pers;freq*=lac;}
    return v/max;
  }
  return {get,octave};
}

// ── TILE TYPES ──
const T={
  VOID:0,WALL:1,FLOOR:2,CORRIDOR:3,DOOR:4,STAIRS_UP:5,STAIRS_DOWN:6,ENEMY:7,LOOT:8,BOSS_FLOOR:9,
  DEEP_WATER:10,SHALLOW_WATER:11,SAND:12,GRASS:13,FOREST:14,DIRT:15,MOUNTAIN_FOOT:16,MOUNTAIN:17,SNOW:18,
  CITY:19,DUNGEON_ENTRANCE:20,VILLAGE:21,
};

const TILE_COLORS={
  [T.VOID]:'#000000',[T.WALL]:'#3a3a5c',[T.FLOOR]:'#c8b89a',[T.CORRIDOR]:'#a8987a',
  [T.DOOR]:'#8b4513',[T.STAIRS_UP]:'#ffd700',[T.STAIRS_DOWN]:'#ff8c00',
  [T.ENEMY]:'#ef4444',[T.LOOT]:'#f59e0b',[T.BOSS_FLOOR]:'#4b0082',
  [T.DEEP_WATER]:'#1a3a6e',[T.SHALLOW_WATER]:'#2d6fa8',[T.SAND]:'#e4c97a',
  [T.GRASS]:'#3a7d44',[T.FOREST]:'#1e5c2a',[T.DIRT]:'#8b6f47',
  [T.MOUNTAIN_FOOT]:'#6b6b6b',[T.MOUNTAIN]:'#888888',[T.SNOW]:'#ddeeff',
  [T.CITY]:'#ff6b35',[T.DUNGEON_ENTRANCE]:'#7c3aed',[T.VILLAGE]:'#ff9900',
};

const LEGEND_DUNGEON=[
  {t:T.VOID,'label':'Void'},{t:T.WALL,'label':'Wall'},{t:T.FLOOR,'label':'Floor'},
  {t:T.CORRIDOR,'label':'Corridor'},{t:T.DOOR,'label':'Door'},
  {t:T.STAIRS_UP,'label':'Stairs Up'},{t:T.STAIRS_DOWN,'label':'Stairs Down'},
  {t:T.ENEMY,'label':'Enemy'},{t:T.LOOT,'label':'Loot'},{t:T.BOSS_FLOOR,'label':'Boss Room'},
];
const LEGEND_WORLD=[
  {t:T.DEEP_WATER,'label':'Deep Water'},{t:T.SHALLOW_WATER,'label':'Shallow Water'},
  {t:T.SAND,'label':'Sand/Beach'},{t:T.GRASS,'label':'Grass'},{t:T.FOREST,'label':'Forest'},
  {t:T.DIRT,'label':'Dirt/Plains'},{t:T.MOUNTAIN_FOOT,'label':'Mountain Foot'},
  {t:T.MOUNTAIN,'label':'Mountain'},{t:T.SNOW,'label':'Snow Peak'},
  {t:T.CITY,'label':'City'},{t:T.DUNGEON_ENTRANCE,'label':'Dungeon'},
];
const LEGEND_ISLAND=[
  {t:T.DEEP_WATER,'label':'Ocean'},{t:T.SHALLOW_WATER,'label':'Shallow Sea'},
  {t:T.SAND,'label':'Beach'},{t:T.GRASS,'label':'Grassland'},
  {t:T.FOREST,'label':'Forest'},{t:T.MOUNTAIN,'label':'Hills'},
  {t:T.VILLAGE,'label':'Village'},
];

function buildLegend(){
  const legends={dungeon:LEGEND_DUNGEON,world:LEGEND_WORLD,island:LEGEND_ISLAND};
  const l=id('legend');l.innerHTML='';
  legends[currentMode].forEach(({t,label})=>{
    const row=document.createElement('div');row.className='legend-row';
    const sw=document.createElement('div');sw.className='legend-swatch';sw.style.background=TILE_COLORS[t];
    const lb=document.createElement('div');lb.className='legend-label';lb.textContent=label;
    row.appendChild(sw);row.appendChild(lb);l.appendChild(row);
  });
}

// ── DUNGEON GENERATOR ──
function generateDungeon(rng){
  const W=+id('mapW').value, H=+id('mapH').value;
  const map=new Uint8Array(W*H);
  map.fill(T.WALL);
  const rooms=[];
  const count=+id('roomCount').value;
  const minS=+id('roomMin').value, maxS=+id('roomMax').value;
  const doCorridor=id('tCorridors').classList.contains('on');
  const doDoors=id('tDoors').classList.contains('on');
  const doEnemies=id('tEnemies').classList.contains('on');
  const doLoot=id('tLoot').classList.contains('on');
  const doBoss=id('tBoss').classList.contains('on');

  function set(x,y,t){if(x>=0&&x<W&&y>=0&&y<H) map[y*W+x]=t;}
  function get(x,y){if(x<0||x>=W||y<0||y>=H) return T.WALL; return map[y*W+x];}

  // Place rooms
  for(let attempt=0;attempt<200&&rooms.length<count;attempt++){
    const rw=Math.floor(rng()*(maxS-minS)+minS);
    const rh=Math.floor(rng()*(maxS-minS)+minS);
    const rx=Math.floor(rng()*(W-rw-2))+1;
    const ry=Math.floor(rng()*(H-rh-2))+1;
    // Check overlap
    const overlap=rooms.some(r=>rx<r.x+r.w+1&&rx+rw+1>r.x&&ry<r.y+r.h+1&&ry+rh+1>r.y);
    if(overlap) continue;
    rooms.push({x:rx,y:ry,w:rw,h:rh});
    for(let y=ry;y<ry+rh;y++) for(let x=rx;x<rx+rw;x++) set(x,y,T.FLOOR);
  }

  // Corridors
  if(doCorridor){
    for(let i=1;i<rooms.length;i++){
      const a=rooms[i-1],b=rooms[i];
      const ax=Math.floor(a.x+a.w/2),ay=Math.floor(a.y+a.h/2);
      const bx=Math.floor(b.x+b.w/2),by=Math.floor(b.y+b.h/2);
      let cx=ax,cy=ay;
      while(cx!==bx){
        if(get(cx,cy)===T.WALL) set(cx,cy,T.CORRIDOR);
        cx+=(bx>cx)?1:-1;
      }
      while(cy!==by){
        if(get(cx,cy)===T.WALL) set(cx,cy,T.CORRIDOR);
        cy+=(by>cy)?1:-1;
      }
    }
  }

  // Doors at room entrances
  if(doDoors){
    rooms.forEach(r=>{
      for(let x=r.x;x<r.x+r.w;x++){
        if(get(x,r.y-1)===T.CORRIDOR) set(x,r.y,T.DOOR);
        if(get(x,r.y+r.h)===T.CORRIDOR) set(x,r.y+r.h-1,T.DOOR);
      }
      for(let y=r.y;y<r.y+r.h;y++){
        if(get(r.x-1,y)===T.CORRIDOR) set(r.x,y,T.DOOR);
        if(get(r.x+r.w,y)===T.CORRIDOR) set(r.x+r.w-1,y,T.DOOR);
      }
    });
  }

  // Stairs
  if(rooms.length>=2){
    const sr=rooms[0];
    set(Math.floor(sr.x+sr.w/2),Math.floor(sr.y+sr.h/2),T.STAIRS_UP);
  }

  // Boss room (last/largest room)
  let bossRoom=null;
  if(doBoss&&rooms.length>=4){
    bossRoom=rooms.reduce((a,b)=>a.w*a.h>b.w*b.h?a:b);
    for(let y=bossRoom.y;y<bossRoom.y+bossRoom.h;y++)
      for(let x=bossRoom.x;x<bossRoom.x+bossRoom.w;x++)
        if(get(x,y)===T.FLOOR) set(x,y,T.BOSS_FLOOR);
    set(Math.floor(bossRoom.x+bossRoom.w/2),Math.floor(bossRoom.y+bossRoom.h/2),T.STAIRS_DOWN);
  } else if(rooms.length>=2){
    const sr=rooms[rooms.length-1];
    set(Math.floor(sr.x+sr.w/2),Math.floor(sr.y+sr.h/2),T.STAIRS_DOWN);
  }

  // Enemies & loot
  const floorRooms=rooms.filter(r=>r!==bossRoom&&rooms.indexOf(r)>0);
  if(doEnemies){
    floorRooms.forEach(r=>{
      const n=Math.floor(rng()*3)+1;
      for(let k=0;k<n;k++){
        const ex=r.x+1+Math.floor(rng()*(r.w-2));
        const ey=r.y+1+Math.floor(rng()*(r.h-2));
        if(get(ex,ey)===T.FLOOR) set(ex,ey,T.ENEMY);
      }
    });
  }
  if(doLoot){
    floorRooms.forEach(r=>{
      if(rng()<.4){
        const lx=r.x+1+Math.floor(rng()*(r.w-2));
        const ly=r.y+1+Math.floor(rng()*(r.h-2));
        if(get(lx,ly)===T.FLOOR) set(lx,ly,T.LOOT);
      }
    });
  }

  return {map,W,H,rooms,type:'dungeon'};
}

// ── WORLD GENERATOR ──
function generateWorld(rng){
  const W=+id('worldW').value, H=+id('worldH').value;
  const ns=+id('noiseScale').value;
  const bs=+id('biomeScale').value;
  const seaLvl=+id('seaLevel').value;
  const mtnLvl=+id('mtnLevel').value;
  const doCities=id('tCities').classList.contains('on');
  const doDungs=id('tDungeons').classList.contains('on');
  const noise=makeNoise(rng);

  const map=new Uint8Array(W*H);
  const height=new Float32Array(W*H);
  const moisture=new Float32Array(W*H);

  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    height[y*W+x]=(noise.octave(x*ns,y*ns,6,.5,2)+1)*.5;
    moisture[y*W+x]=(noise.octave(x*bs+100,y*bs+100,4,.5,2)+1)*.5;
  }

  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const h=height[y*W+x], m=moisture[y*W+x];
    let t;
    if(h<seaLvl-.08) t=T.DEEP_WATER;
    else if(h<seaLvl) t=T.SHALLOW_WATER;
    else if(h<seaLvl+.04) t=T.SAND;
    else if(h>mtnLvl+.1) t=T.SNOW;
    else if(h>mtnLvl) t=T.MOUNTAIN;
    else if(h>mtnLvl-.08) t=T.MOUNTAIN_FOOT;
    else if(m>.6) t=T.FOREST;
    else if(m>.35) t=T.GRASS;
    else t=T.DIRT;
    map[y*W+x]=t;
  }

  // Cities & dungeons on land
  const landCells=[];
  for(let i=0;i<W*H;i++) if(map[i]===T.GRASS||map[i]===T.DIRT) landCells.push(i);
  shuffle(landCells,rng);

  if(doCities){
    const nc=Math.floor(W*H/400)+2;
    for(let i=0;i<Math.min(nc,landCells.length);i++) map[landCells[i]]=T.CITY;
  }
  if(doDungs){
    const start=doCities?Math.floor(W*H/400)+2:0;
    const nd=Math.floor(W*H/600)+1;
    for(let i=start;i<Math.min(start+nd,landCells.length);i++) map[landCells[i]]=T.DUNGEON_ENTRANCE;
  }

  return {map,W,H,type:'world'};
}

// ── ISLAND GENERATOR ──
function generateIsland(rng){
  const S=+id('islandSize').value;
  const W=S, H=S;
  const ns=+id('islandNoiseScale').value;
  const shapeFactor=+id('islandShape').value;
  const beachW=+id('beachWidth').value;
  const doForest=id('tForest').classList.contains('on');
  const doVillage=id('tVillage').classList.contains('on');
  const noise=makeNoise(rng);

  const map=new Uint8Array(W*H);
  const cx=W/2, cy=H/2, r=W*.45;

  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const dx=(x-cx)/r, dy=(y-cy)/r;
    const dist=Math.sqrt(dx*dx+dy*dy);
    const n=(noise.octave(x*ns,y*ns,5,.5,2)+1)*.5;
    const h=n-(dist*shapeFactor);
    let t;
    if(h<0) t=T.DEEP_WATER;
    else if(h<.04) t=T.SHALLOW_WATER;
    else if(h<.04+beachW) t=T.SAND;
    else if(h>.7) t=T.MOUNTAIN;
    else if(doForest&&n>.6&&h>.15) t=T.FOREST;
    else t=T.GRASS;
    map[y*W+x]=t;
  }

  if(doVillage){
    const grassCells=[];
    for(let i=0;i<W*H;i++) if(map[i]===T.GRASS) grassCells.push(i);
    shuffle(grassCells,rng);
    for(let i=0;i<Math.min(3,grassCells.length);i++) map[grassCells[i]]=T.VILLAGE;
  }

  return {map,W,H,type:'island'};
}

function shuffle(arr,rng){
  for(let i=arr.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[arr[i],arr[j]]=[arr[j],arr[i]];}
}

// ── RENDER ──
const canvas=id('map-canvas');
const ctx=canvas.getContext('2d');

function render(mapData){
  const{map,W,H}=mapData;
  const tileSize=+id('tileSizeSlider').value;
  canvas.width=W*tileSize;canvas.height=H*tileSize;
  ctx.imageSmoothingEnabled=false;

  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    ctx.fillStyle=TILE_COLORS[map[y*W+x]]||'#000';
    ctx.fillRect(x*tileSize,y*tileSize,tileSize,tileSize);
  }

  // Grid overlay for dungeon (small tiles)
  if(mapData.type==='dungeon'&&tileSize>=6){
    ctx.strokeStyle='rgba(0,0,0,.15)';ctx.lineWidth=.5;
    for(let y=0;y<=H;y++){ctx.beginPath();ctx.moveTo(0,y*tileSize);ctx.lineTo(W*tileSize,y*tileSize);ctx.stroke();}
    for(let x=0;x<=W;x++){ctx.beginPath();ctx.moveTo(x*tileSize,0);ctx.lineTo(x*tileSize,H*tileSize);ctx.stroke();}
  }
}

// ── GENERATE ──
function generate(){
  const seedStr=id('seedInput').value||'42';
  const rng=seedRNG(seedStr);
  let mapData;
  if(currentMode==='dungeon') mapData=generateDungeon(rng);
  else if(currentMode==='world') mapData=generateWorld(rng);
  else mapData=generateIsland(rng);
  currentMap=mapData;
  render(mapData);
  buildLegend();
}

function zoomIn(){zoom=Math.min(4,zoom*1.5);applyZoom();}
function zoomOut(){zoom=Math.max(.25,zoom/1.5);applyZoom();}
function applyZoom(){canvas.style.transform=`scale(${zoom})`;canvas.style.transformOrigin='center center';}

// ── EXPORT ──
function exportPNG(){
  if(!currentMap){generate();}
  canvas.toBlob(blob=>{
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);
    a.download=`map_${currentMode}_${id('seedInput').value}.png`;a.click();
    setTimeout(()=>URL.revokeObjectURL(a.href),5000);
    toast('Map PNG downloaded!');
  });
}

function exportJSON(){
  if(!currentMap) return;
  const {map,W,H,type,rooms}=currentMap;
  const tileNames=Object.entries(T).reduce((o,[k,v])=>{o[v]=k;return o;},{});
  const tilemap={
    _note:'JVDS Map Generator export — compatible with Godot TileMap and Unity Tilemap',
    type,seed:id('seedInput').value,
    width:W,height:H,
    tileSize:+id('tileSizeSlider').value,
    tiles:Array.from(map),
    tileNames,
    rooms:rooms||[],
  };
  const blob=new Blob([JSON.stringify(tilemap,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download=`map_${type}_${id('seedInput').value}.json`;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  toast('JSON tilemap downloaded!');
}

// ── Init ──
generate();
let toastT;
function toast(msg){const el=id('toast');el.textContent=msg;el.style.opacity=1;clearTimeout(toastT);toastT=setTimeout(()=>el.style.opacity=0,2500);}
</script>
