<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <rect width="128" height="128" fill="#1a1d2a" rx="20"/>
  <!-- Car body -->
  <rect x="39" y="30" width="50" height="75" rx="12" fill="#ff6b35"/>
  <!-- Windscreen -->
  <rect x="45" y="37" width="38" height="22" rx="6" fill="#1a2a4a"/>
  <!-- Stripe -->
  <rect x="60" y="30" width="8" height="75" rx="4" fill="#ffd166" opacity="0.5"/>
  <!-- Front wheels -->
  <rect x="24" y="40" width="14" height="22" rx="5" fill="#111"/>
  <rect x="90" y="40" width="14" height="22" rx="5" fill="#111"/>
  <!-- Rear wheels -->
  <rect x="24" y="74" width="14" height="22" rx="5" fill="#111"/>
  <rect x="90" y="74" width="14" height="22" rx="5" fill="#111"/>
  <!-- Headlights -->
  <rect x="43" y="28" width="16" height="6" rx="3" fill="#ffe97a" opacity="0.9"/>
  <rect x="69" y="28" width="16" height="6" rx="3" fill="#ffe97a" opacity="0.9"/>
</svg>

