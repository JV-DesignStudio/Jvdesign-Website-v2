<h1>⚔️ Quest Board — Icon Generator</h1>
<p>Click the download buttons to save your icons, then put them in an <code>icons/</code> folder.</p>

<script>
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.lineTo(x + w - r, y);
  ctx.arcTo(x + w, y,     x + w, y + r,     r);
  ctx.lineTo(x + w, y + h - r);
  ctx.arcTo(x + w, y + h, x + w - r, y + h, r);
  ctx.lineTo(x + r, y + h);
  ctx.arcTo(x,     y + h, x,     y + h - r, r);
  ctx.lineTo(x,     y + r);
  ctx.arcTo(x,     y,     x + r, y,         r);
  ctx.closePath();
}

function drawIcon(canvas) {
  const ctx = canvas.getContext('2d');
  const S = canvas.width;

  ctx.clearRect(0, 0, S, S);

  // ── 1. Background with rounded corners ──────────────────────────────
  const R = S * 0.18;
  roundRect(ctx, 0, 0, S, S, R);
  const bgGrad = ctx.createRadialGradient(S * 0.4, S * 0.3, 0, S * 0.5, S * 0.5, S * 0.75);
  bgGrad.addColorStop(0,   '#200a3c');
  bgGrad.addColorStop(0.6, '#12052a');
  bgGrad.addColorStop(1,   '#06020f');
  ctx.fillStyle = bgGrad;
  ctx.fill();

  // ── 2. Subtle glow in centre ─────────────────────────────────────────
  const glowGrad = ctx.createRadialGradient(S*0.5, S*0.44, 0, S*0.5, S*0.44, S*0.38);
  glowGrad.addColorStop(0,   'rgba(245,200,66,0.14)');
  glowGrad.addColorStop(0.5, 'rgba(124,58,237,0.08)');
  glowGrad.addColorStop(1,   'rgba(0,0,0,0)');
  roundRect(ctx, 0, 0, S, S, R);
  ctx.fillStyle = glowGrad;
  ctx.fill();

  // ── 3. Tiny star particles ───────────────────────────────────────────
  const stars = [
    [0.13, 0.10], [0.83, 0.15], [0.08, 0.72],
    [0.89, 0.70], [0.20, 0.86], [0.78, 0.88],
    [0.91, 0.38], [0.06, 0.40], [0.50, 0.08]
  ];
  stars.forEach(([x, y]) => {
    ctx.beginPath();
    ctx.arc(x * S, y * S, S * 0.014, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(245,200,66,0.38)';
    ctx.fill();
  });

  // ── 4. Shield ────────────────────────────────────────────────────────
  const cx = S * 0.5;
  const cy = S * 0.5;
  const sw = S * 0.34;   // half width
  const sh = S * 0.40;   // half height

  // Shield path: classic kite / heater shape
  ctx.beginPath();
  ctx.moveTo(cx,          cy - sh);          // top centre
  ctx.lineTo(cx + sw,     cy - sh * 0.48);   // top right
  ctx.lineTo(cx + sw,     cy + sh * 0.10);   // right mid
  ctx.bezierCurveTo(
    cx + sw, cy + sh * 0.72,
    cx + sw * 0.30, cy + sh * 0.98,
    cx, cy + sh                              // bottom point
  );
  ctx.bezierCurveTo(
    cx - sw * 0.30, cy + sh * 0.98,
    cx - sw, cy + sh * 0.72,
    cx - sw, cy + sh * 0.10                  // left mid
  );
  ctx.lineTo(cx - sw,     cy - sh * 0.48);   // top left
  ctx.closePath();

  // Shield fill — subtle tinted glass
  const sfGrad = ctx.createLinearGradient(cx, cy - sh, cx, cy + sh);
  sfGrad.addColorStop(0,   'rgba(245,200,66,0.18)');
  sfGrad.addColorStop(0.45,'rgba(124,58,237,0.10)');
  sfGrad.addColorStop(1,   'rgba(245,200,66,0.04)');
  ctx.fillStyle = sfGrad;
  ctx.fill();

  // Shield border — gold
  ctx.strokeStyle = '#f5c842';
  ctx.lineWidth   = S * 0.022;
  ctx.lineJoin    = 'round';
  ctx.stroke();

  // ── 5. Sword through shield ──────────────────────────────────────────
  const bladeTop    = cy - sh * 0.70;
  const bladeBottom = cy + sh * 0.58;
  const guardY      = cy - sh * 0.08;
  const handleBottom= cy + sh * 0.50;
  const bw          = S * 0.025;

  // Blade (tapers to point)
  ctx.beginPath();
  ctx.moveTo(cx,         bladeTop);
  ctx.lineTo(cx + bw,    guardY);
  ctx.lineTo(cx + bw * 0.45, bladeBottom);
  ctx.lineTo(cx,         bladeBottom + S * 0.006); // point
  ctx.lineTo(cx - bw * 0.45, bladeBottom);
  ctx.lineTo(cx - bw,    guardY);
  ctx.closePath();
  const bladeGrad = ctx.createLinearGradient(cx - bw, 0, cx + bw, 0);
  bladeGrad.addColorStop(0,   'rgba(255,255,255,0.6)');
  bladeGrad.addColorStop(0.5, '#ffffff');
  bladeGrad.addColorStop(1,   'rgba(245,200,66,0.8)');
  ctx.fillStyle = bladeGrad;
  ctx.fill();

  // Crossguard
  const gw = sw * 0.72;
  ctx.beginPath();
  ctx.moveTo(cx - gw, guardY);
  ctx.lineTo(cx + gw, guardY);
  ctx.strokeStyle = '#f5c842';
  ctx.lineWidth   = S * 0.034;
  ctx.lineCap     = 'round';
  ctx.stroke();

  // Handle
  ctx.beginPath();
  ctx.moveTo(cx, guardY + S * 0.01);
  ctx.lineTo(cx, handleBottom - S * 0.032);
  ctx.strokeStyle = 'rgba(139,90,43,0.95)';
  ctx.lineWidth   = S * 0.040;
  ctx.lineCap     = 'round';
  ctx.stroke();

  // Pommel
  ctx.beginPath();
  ctx.arc(cx, handleBottom, S * 0.034, 0, Math.PI * 2);
  ctx.fillStyle = '#f5c842';
  ctx.fill();

  // ── 6. Small star above shield ───────────────────────────────────────
  const starY = cy - sh - S * 0.045;
  const starR = S * 0.038;
  ctx.beginPath();
  for (let i = 0; i < 5; i++) {
    const outer = (i * 4 * Math.PI / 5) - Math.PI / 2;
    const inner = outer + Math.PI / 5;
    const px = cx + Math.cos(outer) * starR;
    const py = starY + Math.sin(outer) * starR;
    const qx = cx + Math.cos(inner) * (starR * 0.42);
    const qy = starY + Math.sin(inner) * (starR * 0.42);
    if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    ctx.lineTo(qx, qy);
  }
  ctx.closePath();
  ctx.fillStyle = '#f5c842';
  ctx.shadowColor = 'rgba(245,200,66,0.9)';
  ctx.shadowBlur  = S * 0.06;
  ctx.fill();
  ctx.shadowBlur  = 0;
}

// Draw all three sizes
['c512', 'c192', 'c48'].forEach(id => {
  drawIcon(document.getElementById(id));
});

function download(id, filename) {
  const canvas = document.getElementById(id);
  const link   = document.createElement('a');
  link.download = filename;
  link.href     = canvas.toDataURL('image/png', 1.0);
  link.click();
}
</script>
