<script>
(function(){
    var page = location.pathname.split('/').pop() || 'index.html';
    document.querySelectorAll('.main-nav .nav-link[data-page]').forEach(function(a){
        if(a.getAttribute('data-page') === page) a.classList.add('active');
    });
    var btn = document.getElementById('navToggle');
    var nav = document.getElementById('mobileNav');
    if (!btn || !nav) return;
    function openNav()  { nav.classList.add('open');    btn.textContent = '✕'; }
    function closeNav() { nav.classList.remove('open'); btn.textContent = '☰'; }
    btn.addEventListener('click', function(e){ e.stopPropagation(); nav.classList.contains('open') ? closeNav() : openNav(); });
    nav.querySelectorAll('a').forEach(function(a){ a.addEventListener('click', closeNav); });
    document.addEventListener('click', function(e){ if(nav.classList.contains('open') && !nav.contains(e.target) && !btn.contains(e.target)) closeNav(); });
    document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeNav(); });
})();
</script>
