<link rel="stylesheet" href="../style-player-stats-widget.css?v=17">
<noscript><link rel="stylesheet" href="../style-player-stats-widget.css?v=17"></noscript>

<div class="player-stats-widget">
  <div class="xp-progress">
    <div class="xp-header">
      <span class="level-badge">
        <span id="playerLevel">Level 1</span>
      </span>
      <span class="xp-text">
        <span id="playerXP">0 / 1000</span> XP
      </span>
    </div>
    <div class="xp-bar">
      <div class="xp-fill" id="xpFill" style="width: 0%"></div>
    </div>
  </div>

  <div class="stats-row">
    <div class="stat-item">
      <span class="icon">📚</span>
      <span class="label"><span id="workshopCount">0</span> Workshops</span>
    </div>
    <div class="stat-item">
      <span class="icon">🎮</span>
      <span class="label"><span id="achievementCount">0</span> Achievements</span>
    </div>
    <div class="stat-item">
      <span class="icon">🔥</span>
      <span class="label"><span id="streakCount">0</span> Day Streak</span>
    </div>
  </div>
</div>

<script src="/assets/js/inline/partials-player-stats-widget-1.js"></script>
