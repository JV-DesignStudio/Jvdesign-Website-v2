<header class="jvds-site-nav" id="jvdsSiteNav">
    <div class="jvds-nav-inner">
        <a href="/" class="jvds-nav-logo">
            <img loading="lazy" src="/logo.png" alt="JVDesignStudio" onerror="this.style.display='none'">
            JVDesignStudio
        </a>
        <nav class="jvds-nav-links" id="jvdsNavLinks">
            <a href="/" data-page="index">Home</a>
            <a href="/games" data-page="games">🎮 Games</a>
            <a href="/books" data-page="books">📚 Books</a>
            <a href="/learn-hub" data-page="learn-hub">🎓 Learn</a>
            <a href="/workshop" data-page="workshop">🔧 Workshop</a>
            <a href="/dev-tools" data-page="dev-tools">🛠️ Tools</a>
            <a href="/freebies" data-page="freebies">🎁 Freebies</a>
            <a href="/downloads" data-page="downloads">📦 Downloads</a>
            <a href="/workshops/my-progress.html" data-page="my-progress">📊 Progress</a>
            <a href="/about" data-page="about">About</a>
            <a href="/search" data-page="search" aria-label="Search">🔍</a>
        </nav>
        <button class="jvds-nav-toggle" id="jvdsNavToggle" aria-label="Open menu" aria-expanded="false" aria-controls="jvdsNavLinks">☰</button>
    </div>
</header>
<script>
(function(){
    var seg = location.pathname.split('/').pop() || 'index.html';
    var page = seg.replace(/\.html$/, '');
    var links = document.querySelectorAll('.jvds-nav-links a[data-page]');
    var matched = false;
    links.forEach(function(a){ if(a.getAttribute('data-page') === page){ a.classList.add('active'); matched = true; } });
    if(!matched){
        var section = /\/tools\//.test(location.pathname) ? 'dev-tools'
                    : /\/workshops\//.test(location.pathname) ? 'workshop'
                    : /\/games\//.test(location.pathname) ? 'games'
                    : /\/books\//.test(location.pathname) ? 'books' : null;
        if(section) links.forEach(function(a){ if(a.getAttribute('data-page') === section) a.classList.add('active'); });
    }
    var btn = document.getElementById('jvdsNavToggle');
    var nav = document.getElementById('jvdsNavLinks');
    if(!btn || !nav) return;
    function openNav()  { nav.classList.add('open');    btn.textContent = '✕'; btn.setAttribute('aria-label','Close menu'); btn.setAttribute('aria-expanded','true'); }
    function closeNav() { nav.classList.remove('open'); btn.textContent = '☰'; btn.setAttribute('aria-label','Open menu');  btn.setAttribute('aria-expanded','false'); }
    btn.addEventListener('click', function(e){ e.stopPropagation(); nav.classList.contains('open') ? closeNav() : openNav(); });
    nav.querySelectorAll('a').forEach(function(a){ a.addEventListener('click', closeNav); });
    document.addEventListener('click', function(e){ if(nav.classList.contains('open') && !nav.contains(e.target) && !btn.contains(e.target)) closeNav(); });
    document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeNav(); });
})();
</script>
