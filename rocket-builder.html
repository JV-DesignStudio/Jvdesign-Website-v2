<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<style>
:root{
  --bg:#07090f;--bg2:#0c0e18;--bg3:#131624;
  --border:rgba(255,255,255,.07);
  --text:#e8eef8;--muted:rgba(232,238,248,.38);
  --acc:#e8543a;--acc-lt:#ff7a5c;--acc-dk:#b03020;
  --blue:#38bdf8;--green:#4ade80;--orange:#fb923c;--purple:#a78bfa;--gold:#f5c842;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;font-family:'Nunito',sans-serif;background:var(--bg);color:var(--text);overflow:hidden}

/* ── APP GRID ── */
#app{display:grid;grid-template-columns:370px 1fr;grid-template-rows:54px 1fr;height:100vh}

/* ── HEADER ── */
.hdr{grid-column:1/-1;background:rgba(7,9,15,.97);backdrop-filter:blur(16px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 18px;z-index:90;position:relative}
.hdr::after{content:'';position:absolute;bottom:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(232,84,58,.4),transparent)}
.logo{font-family:'Bebas Neue',sans-serif;font-size:1.15rem;letter-spacing:.06em;display:flex;align-items:center;gap:8px}
.hdr-right{display:flex;align-items:center;gap:10px}
.quick-btn{background:linear-gradient(135deg,var(--acc),#b03020);color:#fff;font-family:'Bebas Neue',sans-serif;font-size:.88rem;letter-spacing:.08em;padding:7px 16px;border-radius:8px;border:none;cursor:pointer;box-shadow:0 3px 0 var(--acc-dk);transition:filter .15s,transform .1s}
.quick-btn:hover{filter:brightness(1.15);transform:translateY(-1px)}
.back-link{font-family:'JetBrains Mono',monospace;font-size:.6rem;color:var(--muted);padding:5px 12px;border:1px solid var(--border);border-radius:6px;text-decoration:none;transition:color .15s,border-color .15s}
.back-link:hover{color:var(--text);border-color:rgba(255,255,255,.2)}

/* ── SIDEBAR ── */
#sidebar{background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden}

/* Progress */
.prog-section{padding:9px 12px 7px;border-bottom:1px solid var(--border);flex-shrink:0}
.prog-lbl{font-family:'JetBrains Mono',monospace;font-size:.52rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--acc)}
.prog-track{width:100%;height:4px;background:rgba(255,255,255,.07);border-radius:999px;margin-top:5px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--acc),var(--orange));border-radius:999px;transition:width .4s ease}
.prog-ct{font-family:'JetBrains Mono',monospace;font-size:.52rem;color:var(--muted);margin-top:3px}

/* Step list */
.slist{flex:1;overflow-y:auto;padding:4px 6px;min-height:0;scrollbar-width:thin;scrollbar-color:var(--acc-dk) transparent}
.slist::-webkit-scrollbar{width:3px}
.slist::-webkit-scrollbar-thumb{background:var(--acc-dk);border-radius:2px}
.si{padding:7px 9px;margin-bottom:2px;border-radius:5px;cursor:pointer;display:flex;align-items:center;gap:8px;border:1px solid transparent;transition:all .18s}
.si:hover{background:rgba(232,84,58,.04)}
.si.active{background:rgba(232,84,58,.1);border-color:var(--acc)}
.si.done{opacity:.55}
.si.done .sn{background:var(--acc);color:#fff;border-color:var(--acc)}
.sn{width:22px;height:22px;border-radius:50%;border:1.5px solid rgba(232,84,58,.45);display:flex;align-items:center;justify-content:center;font-family:'JetBrains Mono',monospace;font-size:9px;flex-shrink:0;color:var(--acc-lt);transition:all .2s}
.sl{font-size:11.5px;color:var(--text);line-height:1.2}
.si.active .sl{color:var(--acc-lt)}

/* Controls panel (step content) */
.cpan{padding:10px 12px 14px;border-top:1px solid var(--border);background:rgba(0,0,0,.12);overflow-y:auto;flex-shrink:0;max-height:48vh;scrollbar-width:thin;scrollbar-color:var(--acc-dk) transparent}
.cpan::-webkit-scrollbar{width:3px}
.cpan::-webkit-scrollbar-thumb{background:var(--acc-dk);border-radius:2px}

/* Sidebar nav */
.snav{display:flex;gap:6px;padding:8px 10px;border-top:1px solid var(--border);flex-shrink:0}
.snav button{flex:1;padding:8px;border-radius:7px;font-size:.8rem;font-weight:800;cursor:pointer;border:none;transition:background .15s;font-family:'Nunito',sans-serif}
.btn-p{background:rgba(255,255,255,.05);color:var(--muted);border:1px solid var(--border) !important}
.btn-n{background:rgba(232,84,58,.14);color:var(--acc-lt);border:1px solid rgba(232,84,58,.25) !important}
.btn-p:hover:not(:disabled){background:rgba(255,255,255,.1);color:var(--text)}
.btn-n:hover:not(:disabled){background:rgba(232,84,58,.24)}
.btn-p:disabled,.btn-n:disabled{opacity:.28;cursor:default}

/* ── VIEWPORT ── */
#viewport{position:relative;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}
.scene-top{padding:8px 13px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.scene-top-l{font-family:'JetBrains Mono',monospace;font-size:.58rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.scene-top-r{display:flex;align-items:center;gap:7px}
.live-wrap{display:flex;align-items:center;gap:4px;font-family:'JetBrains Mono',monospace;font-size:.56rem;color:var(--acc-lt)}
.live-dot{width:5px;height:5px;border-radius:50%;background:var(--acc);animation:blink 1.8s infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.14}}
.scene-wrap{flex:1;position:relative;overflow:hidden}
#rocketCanvas{display:block;width:100%;height:100%;touch-action:none}
.vhint{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-family:'JetBrains Mono',monospace;font-size:.5rem;color:var(--muted);background:rgba(0,0,0,.5);padding:3px 10px;border-radius:6px;pointer-events:none;white-space:nowrap}
.dims{position:absolute;top:10px;right:10px;background:rgba(7,9,15,.88);border:1px solid rgba(232,84,58,.22);border-radius:6px;padding:7px 11px;font-family:'JetBrains Mono',monospace;font-size:9px;color:var(--muted);z-index:5;line-height:1.8}
.dims span{color:var(--acc-lt)}
.obar{padding:5px 12px;border-top:1px solid var(--border);font-family:'JetBrains Mono',monospace;font-size:.58rem;color:var(--acc-lt);flex-shrink:0;min-height:26px}

/* ── STEP CONTENT STYLES ── */
.step-tag{font-family:'JetBrains Mono',monospace;font-size:.56rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--acc-lt);margin-bottom:3px}
.step-title{font-family:'Bebas Neue',sans-serif;font-size:1.55rem;letter-spacing:.04em;color:#fff;margin-bottom:5px;line-height:1}
.step-intro{font-size:.78rem;color:var(--muted);line-height:1.72;margin-bottom:9px}
.step-intro strong{color:var(--text)}

.box{border-radius:7px;padding:8px 11px;margin:5px 0;font-size:.72rem;line-height:1.55;display:flex;gap:7px;align-items:flex-start}
.box::before{flex-shrink:0;margin-top:1px}
.box-c{background:rgba(232,84,58,.05);border:1px solid rgba(232,84,58,.16);color:rgba(232,238,248,.7)}
.box-c::before{content:"📖"}
.box-t{background:rgba(74,222,128,.05);border:1px solid rgba(74,222,128,.14);color:rgba(232,238,248,.7)}
.box-t::before{content:"💡"}
.box-r{background:rgba(56,189,248,.05);border:1px solid rgba(56,189,248,.18);color:rgba(232,238,248,.8)}
.box-r::before{content:"🚀"}

.opt-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:7px;margin:8px 0}
.opt-btn{padding:9px 7px;border-radius:8px;border:2px solid var(--border);background:var(--bg3);cursor:pointer;font-family:'Nunito',sans-serif;font-size:.74rem;font-weight:700;color:var(--muted);text-align:center;transition:all .15s;line-height:1.3}
.opt-btn:hover{border-color:rgba(232,84,58,.4);color:var(--text);background:rgba(232,84,58,.05)}
.opt-btn.sel{border-color:var(--acc);color:var(--acc-lt);background:rgba(232,84,58,.08)}
.opt-icon{font-size:1.3rem;display:block;margin-bottom:3px}

.swatch-row{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0}
.swatch{width:28px;height:28px;border-radius:6px;cursor:pointer;border:2px solid transparent;transition:transform .12s,border-color .12s;flex-shrink:0}
.swatch:hover{transform:scale(1.15)}
.swatch.sel{border-color:#fff;transform:scale(1.18)}
.custom-colour{display:flex;align-items:center;gap:7px;margin-top:5px;font-size:.72rem;color:var(--muted)}
.custom-colour input[type=color]{width:32px;height:32px;border:2px solid var(--border);border-radius:6px;cursor:pointer;padding:2px;background:var(--bg2)}

.slider-row{display:flex;align-items:center;gap:9px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.slider-row:last-child{border:none}
.slider-lbl{font-family:'JetBrains Mono',monospace;font-size:.58rem;color:var(--muted);flex:1;text-transform:uppercase;letter-spacing:.05em}
.slider-val{font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--acc-lt);min-width:36px;text-align:right}
input[type=range]{flex:2;accent-color:var(--acc);cursor:pointer}

.task-list{margin:6px 0;display:flex;flex-direction:column;gap:3px}
.task-item{display:flex;align-items:center;gap:6px;font-size:.7rem;padding:4px 8px;border-radius:5px;background:rgba(255,255,255,.03);border:1px solid var(--border);color:var(--muted);transition:all .3s}
.task-item.done{background:rgba(74,222,128,.05);border-color:rgba(74,222,128,.18);color:var(--green)}
.task-dot{width:6px;height:6px;border-radius:50%;border:1.5px solid currentColor;flex-shrink:0;transition:background .3s}
.task-item.done .task-dot{background:var(--green)}

.name-input{width:100%;background:var(--bg3);border:1px solid rgba(232,84,58,.3);border-radius:7px;color:var(--acc-lt);font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:.08em;padding:8px 12px;outline:none;transition:border-color .2s;margin:7px 0}
.name-input:focus{border-color:var(--acc);box-shadow:0 0 0 2px rgba(232,84,58,.12)}
.name-input::placeholder{color:var(--muted);font-size:.95rem}

.run-btn{width:100%;margin-top:8px;padding:10px;background:var(--acc);color:#fff;font-family:'Bebas Neue',sans-serif;font-size:.9rem;letter-spacing:.1em;border:none;border-radius:8px;cursor:pointer;box-shadow:0 3px 0 var(--acc-dk);transition:transform .1s,filter .15s;display:flex;align-items:center;justify-content:center;gap:5px}
.run-btn:hover{filter:brightness(1.13);transform:translateY(-1px)}

/* ── MOBILE ── */
@media(max-width:860px){
  html,body{overflow:auto;height:auto}
  #app{grid-template-columns:1fr;grid-template-rows:54px auto auto;height:auto;min-height:100vh}
  .hdr{grid-column:1}
  #sidebar{max-height:55vh;border-right:none;border-bottom:1px solid var(--border)}
  .slist{min-height:60px}
  .cpan{max-height:36vh}
  #viewport{min-height:320px;height:56vw;max-height:520px}
}
@media(max-width:480px){
  .logo{font-size:1rem}
  .quick-btn{font-size:.78rem;padding:6px 12px}
  #viewport{min-height:260px;height:50vw;max-height:420px}
  .cpan{max-height:40vh}
  input[type=range]{height:28px}
  .snav button{padding:10px 6px;font-size:.75rem}
}
</style>
</head>
<body>

<div id="app">

  <!-- HEADER -->
  <header class="hdr">
    <div class="logo">🚀 Rocket Builder</div>
    <div class="hdr-right">
      <a href="workshop.html" class="back-link">← Workshop</a>
      <button class="quick-btn" onclick="quickBuild()">⚡ Quick Build</button>
    </div>
  </header>

  <!-- SIDEBAR -->
  <div id="sidebar">
    <div class="prog-section">
      <div class="prog-lbl">Build Progress</div>
      <div class="prog-track"><div class="prog-fill" id="progFill" style="width:3%"></div></div>
      <div class="prog-ct" id="progCt">0 / 15 steps</div>
    </div>
    <div class="slist" id="stepList"></div>
    <div class="cpan" id="stepBody"></div>
    <div class="snav">
      <button class="btn-p" id="navPrev" onclick="go(currentStep-1)" disabled>← Back</button>
      <button class="btn-n" id="navNext" onclick="go(currentStep+1)">Next →</button>
    </div>
  </div>

  <!-- VIEWPORT -->
  <div id="viewport">
    <div class="scene-top">
      <span class="scene-top-l">🛸 Live 3D Preview</span>
      <div class="scene-top-r">
        <div class="live-wrap"><span class="live-dot"></span><span id="liveStatus">Apply Step 1 to begin</span></div>
      </div>
    </div>
    <div class="scene-wrap">
      <canvas id="rocketCanvas"></canvas>
      <div class="vhint" id="sceneHint">Drag to orbit · Scroll to zoom</div>
      <div class="dims" id="dimsOverlay">
        <div style="font-family:'Bebas Neue',sans-serif;font-size:.95rem;letter-spacing:.06em;color:#fff;margin-bottom:2px" id="sName">UNNAMED</div>
        <div>Nose&nbsp;&nbsp;&nbsp;<span id="sNose">—</span></div>
        <div>Height&nbsp;<span id="sHeight">—</span></div>
        <div>Boost&nbsp;&nbsp;<span id="sBoosters">—</span></div>
        <div>Fins&nbsp;&nbsp;&nbsp;<span id="sFins">—</span></div>
        <div>Engines <span id="sEngines">—</span></div>
      </div>
    </div>
    <div class="obar" id="obar">▶ Choose a nosecone to start building</div>
  </div>

</div>

<script>
'use strict';

/* ═══════════════════════════════
   THREE.JS SCENE
═══════════════════════════════ */
const canvas = document.getElementById('rocketCanvas');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.setClearColor(0x07090f);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x07090f, 20, 60);

const camera = new THREE.PerspectiveCamera(45, 1, 0.1, 200);
camera.position.set(0, 3, 12);

// Lights
const ambient = new THREE.AmbientLight(0x334466, 0.6);
scene.add(ambient);
const sun = new THREE.DirectionalLight(0xfff5ee, 1.4);
sun.position.set(5, 10, 6);
sun.castShadow = true;
scene.add(sun);
const fill = new THREE.DirectionalLight(0x4466aa, 0.4);
fill.position.set(-6, 2, -4);
scene.add(fill);
const engineGlow = new THREE.PointLight(0xff5500, 0, 3);
scene.add(engineGlow);

// Stars background
(function(){
  const geo = new THREE.BufferGeometry();
  const verts = [];
  for (let i = 0; i < 1500; i++) {
    verts.push((Math.random()-0.5)*100, (Math.random()-0.5)*100, (Math.random()-0.5)*100);
  }
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  const mat = new THREE.PointsMaterial({ color: 0xffffff, size: 0.12 });
  scene.add(new THREE.Points(geo, mat));
})();

// Ground pad
const padGeo = new THREE.CylinderGeometry(2, 2, 0.15, 32);
const padMat = new THREE.MeshStandardMaterial({ color: 0x2a2a3a, roughness: 0.9 });
const pad = new THREE.Mesh(padGeo, padMat);
pad.position.y = -0.075;
pad.receiveShadow = true;
scene.add(pad);

/* ═══════════════════════════════
   ROCKET STATE
═══════════════════════════════ */
const R = {
  name: 'UNNAMED',
  nosecone: 'cone',
  bodyHeight: 3,
  bodyRadius: 0.35,
  primaryCol: '#e8543a',
  secondaryCol: '#ffffff',
  finStyle: 'delta',
  finCount: 4,
  boosters: 0,
  boosterSize: 0.6,
  engineCount: 1,
  fairing: 'none',
  stripeOn: false,
  stripeCol: '#ffffff',
  glowCol: '#ff6600',
  launched: false,
  launchY: 0,
};

let rocketGroup = null;
let exhaustParticles = [];

function hexToThree(hex) {
  return new THREE.Color(hex);
}

function buildRocket() {
  if (rocketGroup) scene.remove(rocketGroup);
  exhaustParticles = [];
  rocketGroup = new THREE.Group();
  rocketGroup.position.y = R.launchY;

  const pMat = new THREE.MeshStandardMaterial({ color: hexToThree(R.primaryCol), roughness: 0.35, metalness: 0.55 });
  const sMat = new THREE.MeshStandardMaterial({ color: hexToThree(R.secondaryCol), roughness: 0.4, metalness: 0.45 });
  const darkMat = new THREE.MeshStandardMaterial({ color: 0x1a1a2a, roughness: 0.6, metalness: 0.3 });
  const exhaustMat = new THREE.MeshStandardMaterial({ color: 0x333344, roughness: 0.8 });

  const bh = R.bodyHeight;
  const br = R.bodyRadius;
  const baseY = 0;

  // Body
  const bodyGeo = new THREE.CylinderGeometry(br, br, bh, 24);
  const body = new THREE.Mesh(bodyGeo, pMat);
  body.position.y = baseY + bh / 2;
  body.castShadow = true;
  rocketGroup.add(body);

  // Stripe band
  if (R.stripeOn) {
    const stripGeo = new THREE.CylinderGeometry(br + 0.005, br + 0.005, 0.22, 24);
    const stripMat = new THREE.MeshStandardMaterial({ color: hexToThree(R.stripeCol), roughness: 0.4, metalness: 0.5 });
    const strip = new THREE.Mesh(stripGeo, stripMat);
    strip.position.y = baseY + bh * 0.35;
    rocketGroup.add(strip);
  }

  // Nosecone
  const noseBase = baseY + bh;
  if (R.nosecone === 'cone') {
    const noseH = bh * 0.55;
    const noseGeo = new THREE.ConeGeometry(br, noseH, 24);
    const nose = new THREE.Mesh(noseGeo, sMat);
    nose.position.y = noseBase + noseH / 2;
    nose.castShadow = true;
    rocketGroup.add(nose);
  } else if (R.nosecone === 'ogive') {
    const noseH = bh * 0.65;
    const noseGeo = new THREE.ConeGeometry(br, noseH, 24);
    const nose = new THREE.Mesh(noseGeo, sMat);
    nose.position.y = noseBase + noseH / 2;
    nose.castShadow = true;
    rocketGroup.add(nose);
    const tipGeo = new THREE.SphereGeometry(br * 0.18, 10, 10);
    const tip = new THREE.Mesh(tipGeo, sMat);
    tip.position.y = noseBase + noseH;
    rocketGroup.add(tip);
    const shGeo = new THREE.CylinderGeometry(br * 1.06, br, noseH * 0.18, 24);
    const sh = new THREE.Mesh(shGeo, sMat);
    sh.position.y = noseBase + noseH * 0.09;
    rocketGroup.add(sh);
  } else { // blunt
    const noseH = bh * 0.28;
    const noseGeo = new THREE.CylinderGeometry(br * 0.55, br, noseH, 24);
    const nose = new THREE.Mesh(noseGeo, sMat);
    nose.position.y = noseBase + noseH / 2;
    nose.castShadow = true;
    rocketGroup.add(nose);
    const capGeo = new THREE.SphereGeometry(br * 0.55, 16, 10, 0, Math.PI * 2, 0, Math.PI / 2);
    const cap = new THREE.Mesh(capGeo, sMat);
    cap.position.y = noseBase + noseH;
    rocketGroup.add(cap);
  }

  // Payload fairing
  if (R.fairing !== 'none') {
    const fH = R.fairing === 'xl' ? bh * 0.7 : bh * 0.45;
    const fR = br * (R.fairing === 'xl' ? 1.28 : 1.18);
    const fGeo = new THREE.CylinderGeometry(br * 0.1, fR, fH, 16);
    const fMat = new THREE.MeshStandardMaterial({ color: hexToThree(R.secondaryCol), roughness: 0.5, metalness: 0.4, transparent: true, opacity: 0.85 });
    const fairing = new THREE.Mesh(fGeo, fMat);
    fairing.position.y = noseBase + fH / 2;
    rocketGroup.add(fairing);
  }

  // Engine interstage ring
  const ringGeo = new THREE.TorusGeometry(br, 0.04, 8, 24);
  const ring = new THREE.Mesh(ringGeo, darkMat);
  ring.position.y = baseY + 0.3;
  ring.rotation.x = Math.PI / 2;
  rocketGroup.add(ring);

  // Engine bells
  const enginePositions = [];
  if (R.engineCount === 1) {
    enginePositions.push([0, 0]);
  } else if (R.engineCount === 3) {
    for (let i = 0; i < 3; i++) {
      const a = (i / 3) * Math.PI * 2;
      enginePositions.push([Math.cos(a) * br * 0.45, Math.sin(a) * br * 0.45]);
    }
  } else {
    enginePositions.push([0, 0]);
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * Math.PI * 2;
      enginePositions.push([Math.cos(a) * br * 0.55, Math.sin(a) * br * 0.55]);
    }
  }

  const bellR = R.engineCount > 1 ? br * 0.28 : br * 0.42;
  enginePositions.forEach(([ex, ez]) => {
    const bellGeo = new THREE.CylinderGeometry(bellR * 1.5, bellR * 0.7, 0.35, 16);
    const bell = new THREE.Mesh(bellGeo, exhaustMat);
    bell.position.set(ex, baseY - 0.18, ez);
    rocketGroup.add(bell);
    const throatGeo = new THREE.CylinderGeometry(bellR * 0.7, bellR * 0.7, 0.08, 12);
    const throat = new THREE.Mesh(throatGeo, darkMat);
    throat.position.set(ex, baseY - 0.38, ez);
    rocketGroup.add(throat);
  });

  // Fins
  const finAngles = [];
  for (let i = 0; i < R.finCount; i++) finAngles.push((i / R.finCount) * Math.PI * 2);
  const finMat = new THREE.MeshStandardMaterial({ color: hexToThree(R.secondaryCol), roughness: 0.4, metalness: 0.55, side: THREE.DoubleSide });

  finAngles.forEach(angle => {
    let finMesh;
    if (R.finStyle === 'delta') {
      const shape = new THREE.Shape();
      shape.moveTo(0, 0); shape.lineTo(0, bh * 0.5); shape.lineTo(br * 2.2, 0); shape.closePath();
      const geo = new THREE.ExtrudeGeometry(shape, { depth: 0.03, bevelEnabled: false });
      finMesh = new THREE.Mesh(geo, finMat);
      finMesh.position.y = baseY;
    } else if (R.finStyle === 'swept') {
      const shape = new THREE.Shape();
      shape.moveTo(0, 0); shape.lineTo(br * 0.8, bh * 0.42); shape.lineTo(br * 2.0, bh * 0.42); shape.lineTo(br * 2.0, 0); shape.closePath();
      const geo = new THREE.ExtrudeGeometry(shape, { depth: 0.03, bevelEnabled: false });
      finMesh = new THREE.Mesh(geo, finMat);
      finMesh.position.y = baseY;
    } else { // grid
      const gGroup = new THREE.Group();
      const barMat = new THREE.MeshStandardMaterial({ color: hexToThree(R.secondaryCol), roughness: 0.5, metalness: 0.5 });
      const gW = br * 1.8, gH = bh * 0.38, gD = 0.06;
      [-gH * 0.33, 0, gH * 0.33].forEach(gy => {
        const g = new THREE.Mesh(new THREE.BoxGeometry(gD, gD, gW), barMat);
        g.position.set(gW * 0.5 + br, gy + baseY + gH * 0.5, 0);
        gGroup.add(g);
      });
      [-gW * 0.33, 0, gW * 0.33].forEach(gx => {
        const g = new THREE.Mesh(new THREE.BoxGeometry(gD, gH, gD), barMat);
        g.position.set(gx + gW * 0.5 + br, baseY + gH * 0.5, 0);
        gGroup.add(g);
      });
      gGroup.rotation.y = angle;
      rocketGroup.add(gGroup);
      return;
    }
    finMesh.castShadow = true;
    const wrapper = new THREE.Group();
    wrapper.add(finMesh);
    wrapper.rotation.y = angle;
    rocketGroup.add(wrapper);
  });

  // Side boosters
  if (R.boosters > 0) {
    const bsr = R.boosterSize * 0.16;
    const bsh = bh * R.boosterSize * 0.72;
    const bDist = br + bsr * 2.5;
    const boosterAngles = [];
    for (let i = 0; i < R.boosters; i++) boosterAngles.push((i / R.boosters) * Math.PI * 2);

    boosterAngles.forEach(a => {
      const bx = Math.cos(a) * bDist, bz = Math.sin(a) * bDist;
      const bBody = new THREE.Mesh(new THREE.CylinderGeometry(bsr, bsr, bsh, 16), pMat.clone());
      bBody.position.set(bx, baseY + bsh / 2, bz); bBody.castShadow = true; rocketGroup.add(bBody);
      const bNose = new THREE.Mesh(new THREE.ConeGeometry(bsr, bsh * 0.35, 16), sMat.clone());
      bNose.position.set(bx, baseY + bsh + bsh * 0.175, bz); rocketGroup.add(bNose);
      const bBell = new THREE.Mesh(new THREE.CylinderGeometry(bsr * 1.4, bsr * 0.7, 0.22, 12), exhaustMat.clone());
      bBell.position.set(bx, baseY - 0.11, bz); rocketGroup.add(bBell);
      const strutLen = bDist - br - bsr;
      const strutGeo = new THREE.CylinderGeometry(0.025, 0.025, strutLen, 6);
      const strut = new THREE.Mesh(strutGeo, darkMat);
      strut.rotation.set(0, a + Math.PI / 2, Math.PI / 2);
      strut.position.set((bx + Math.cos(a) * br) / 2, baseY + bsh * 0.55, (bz + Math.sin(a) * br) / 2);
      rocketGroup.add(strut);
    });
  }

  // Exhaust flame
  if (R.launched) {
    const glowColor = new THREE.Color(R.glowCol);
    engineGlow.color = glowColor;
    engineGlow.intensity = 2.5;
    engineGlow.position.y = baseY - 0.6 + R.launchY;
    enginePositions.forEach(([ex, ez]) => {
      for (let i = 0; i < 3; i++) {
        const fh = 0.3 + Math.random() * 0.5;
        const fGeo = new THREE.ConeGeometry(bellR * (0.6 + Math.random() * 0.6), fh, 8);
        const fMat = new THREE.MeshBasicMaterial({ color: glowColor, transparent: true, opacity: 0.6 + Math.random() * 0.3 });
        const flame = new THREE.Mesh(fGeo, fMat);
        flame.position.set(ex, baseY - 0.45 - fh / 2, ez);
        flame.rotation.x = Math.PI;
        rocketGroup.add(flame);
        exhaustParticles.push({ mesh: flame, baseY: baseY - 0.45 - fh / 2, phase: Math.random() * Math.PI * 2 });
      }
    });
  } else {
    engineGlow.intensity = 0;
  }

  scene.add(rocketGroup);
  updateSpecCard();
}

/* ═══════════════════════════════
   ORBIT CONTROLS
═══════════════════════════════ */
let orbit = { theta: 0.3, phi: 1.1, radius: 12, dragging: false, lastX: 0, lastY: 0 };

function updateCamera() {
  orbit.phi = Math.max(0.2, Math.min(Math.PI - 0.2, orbit.phi));
  orbit.radius = Math.max(4, Math.min(24, orbit.radius));
  camera.position.x = orbit.radius * Math.sin(orbit.phi) * Math.sin(orbit.theta);
  camera.position.y = orbit.radius * Math.cos(orbit.phi) + R.bodyHeight / 2 + 1;
  camera.position.z = orbit.radius * Math.sin(orbit.phi) * Math.cos(orbit.theta);
  camera.lookAt(0, R.bodyHeight / 2, 0);
}

canvas.addEventListener('mousedown', e => { orbit.dragging = true; orbit.lastX = e.clientX; orbit.lastY = e.clientY; });
window.addEventListener('mouseup', () => { orbit.dragging = false; });
window.addEventListener('mousemove', e => {
  if (!orbit.dragging) return;
  orbit.theta -= (e.clientX - orbit.lastX) * 0.007;
  orbit.phi   -= (e.clientY - orbit.lastY) * 0.007;
  orbit.lastX = e.clientX; orbit.lastY = e.clientY;
});
canvas.addEventListener('wheel', e => { orbit.radius += e.deltaY * 0.012; e.preventDefault(); }, { passive: false });

let pinchDist0 = 0;
canvas.addEventListener('touchstart', e => {
  if (e.touches.length === 1) { orbit.dragging = true; orbit.lastX = e.touches[0].clientX; orbit.lastY = e.touches[0].clientY; }
  if (e.touches.length === 2) { pinchDist0 = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY); }
  e.preventDefault();
}, { passive: false });
canvas.addEventListener('touchend', () => { orbit.dragging = false; });
canvas.addEventListener('touchmove', e => {
  if (e.touches.length === 1 && orbit.dragging) {
    orbit.theta -= (e.touches[0].clientX - orbit.lastX) * 0.007;
    orbit.phi   -= (e.touches[0].clientY - orbit.lastY) * 0.007;
    orbit.lastX = e.touches[0].clientX; orbit.lastY = e.touches[0].clientY;
  }
  if (e.touches.length === 2) {
    const d = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    orbit.radius *= pinchDist0 / d; pinchDist0 = d;
  }
  e.preventDefault();
}, { passive: false });

/* ═══════════════════════════════
   RESIZE + RENDER LOOP
═══════════════════════════════ */
function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (w === 0 || h === 0) return;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}

let frame = 0;
function animate() {
  requestAnimationFrame(animate);
  frame++;
  if (!orbit.dragging) orbit.theta += 0.003;
  updateCamera();

  exhaustParticles.forEach(p => {
    p.mesh.position.y = p.baseY + R.launchY - Math.abs(Math.sin(frame * 0.12 + p.phase)) * 0.15;
    p.mesh.material.opacity = 0.5 + Math.sin(frame * 0.18 + p.phase) * 0.3;
    const s = 0.85 + Math.sin(frame * 0.14 + p.phase) * 0.15;
    p.mesh.scale.setScalar(s);
  });

  if (R.launched && R.launchY < 80) {
    R.launchY += 0.07;
    if (rocketGroup) rocketGroup.position.y = R.launchY;
    if (R.launchY > 3) scene.fog.near = 20 - R.launchY * 0.2;
    engineGlow.position.y = R.launchY - 0.6;
    orbit.phi = Math.max(0.5, orbit.phi - 0.003);
  }

  resize();
  renderer.render(scene, camera);
}
animate();

    const o = `(function(v,el){R.engineCount=parseInt(v);el?.closest('.opt-grid')?.querySelectorAll('.opt-btn').forEach(b=>b.classList.remove('sel'));if(el)el.classList.add('sel');buildRocket();})`;
    return opts('eng', [
      { val:'1', icon:'🔵', label:'Single' },
      { val:'3', icon:'🔵🔵🔵', label:'Triple' },
      { val:'5', icon:'⚙️', label:'5-Engine' },
    ], String(R.engineCount), o);
  },
  onApply() { buildRocket(); sout(R.engineCount + ' engine' + (R.engineCount>1?'s':'')+' installed.'); document.getElementById('liveStatus').textContent = 'Engines set!'; }
},

/* 12 */ {
  title: 'Payload Fairing',
  tag: 'STEP 12 · PAYLOAD',
  intro: `The <strong>payload fairing</strong> is the nose shell that protects cargo during ascent. It splits and falls away once above the atmosphere. Standard for satellites. XL for large space telescopes.`,
  boxes: [
    { t:'box-c', tx:'Fairings cost millions and SpaceX actually catches them with nets on ships to reuse them. The fairing protects satellites from aerodynamic forces and heating during the first few minutes of flight.' },
  ],
  tasks: ['Add a payload fairing or leave bare'],
  html() {
    const o = `(function(v,el){R.fairing=v;el?.closest('.opt-grid')?.querySelectorAll('.opt-btn').forEach(b=>b.classList.remove('sel'));if(el)el.classList.add('sel');buildRocket();})`;
    return opts('fairing', [
      { val:'none',     icon:'❌', label:'None' },
      { val:'standard', icon:'📦', label:'Standard' },
      { val:'xl',       icon:'🏛️', label:'XL Fairing' },
    ], R.fairing, o);
  },
  onApply() { buildRocket(); sout(R.fairing==='none' ? 'No fairing — raw payload.' : 'Payload fairing: ' + R.fairing + '.'); document.getElementById('liveStatus').textContent = 'Payload set!'; }
},

/* 13 */ {
  title: 'Stripe Decal',
  tag: 'STEP 13 · MARKINGS',
  intro: `Add a <strong>colour stripe</strong> around the body — a classic rocket marking used to break up large surfaces and identify different sections of the fuel tank.`,
  boxes: [
    { t:'box-t', tx:'The Saturn V had black rollout stripes. Ariane 5 has a red band. Pick a contrasting stripe colour for best effect.' },
  ],
  tasks: ['Toggle stripe on/off', 'Choose a stripe colour'],
  html() {
    const o = `(function(c,el){R.stripeCol=c;el?.closest('.swatch-row')?.querySelectorAll('.swatch').forEach(s=>s.classList.remove('sel'));if(el)el.classList.add('sel');buildRocket();})`;
    return `<div style="display:flex;align-items:center;gap:9px;margin:8px 0">
      <span style="font-size:.78rem;color:var(--muted)">Stripe:</span>
      <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:.78rem;color:var(--text)">
        <input type="checkbox" ${R.stripeOn?'checked':''} style="width:16px;height:16px;accent-color:var(--acc)" onchange="R.stripeOn=this.checked;buildRocket()">
        Show stripe band
      </label>
    </div>` + swatchRow('stc', ['#ffffff','#f5c842','#38bdf8','#4ade80','#e8543a','#1a1a2a','#a78bfa','#fb923c'], R.stripeCol, o);
  },
  onApply() { buildRocket(); sout(R.stripeOn ? '🎨 Stripe added in ' + R.stripeCol : 'No stripe — clean body.'); document.getElementById('liveStatus').textContent = 'Markings set!'; }

/* 14 */ {
  title: 'Engine Glow',
  tag: 'STEP 14 · EXHAUST',
  intro: `Choose the colour of your <strong>engine exhaust flame</strong>. Kerosene engines burn orange-yellow. Hydrogen engines burn nearly invisible blue-white. Ion drives glow blue-violet.`,
  boxes: [
    { t:'box-c', tx:'Rocket exhaust colours depend entirely on propellant. LOX/kerosene = orange. LOX/hydrogen = blue-white, almost invisible. Methalox (Raptor) = tight blue diamond shocks. Ion drives = electric purple-blue glow.' },
    { t:'box-t', tx:'The glow appears when you launch in Step 15!' },
  ],
  tasks: ['Pick an exhaust glow colour'],
  html() {
    const o = `(function(c,el){R.glowCol=c;el?.closest('.swatch-row')?.querySelectorAll('.swatch').forEach(s=>s.classList.remove('sel'));if(el)el.classList.add('sel');})`;
    return swatchRow('gc', ['#ff6600','#ffcc00','#88ccff','#ffffff','#ff88ff','#44ffaa','#ff3300','#6666ff'], R.glowCol, o);
  },
  onApply() { sout('Exhaust colour set. Ready to launch!'); document.getElementById('liveStatus').textContent = 'Glow ready!'; }
},

/* 15 */ {
  title: 'Launch!',
  tag: 'STEP 15 · LIFTOFF',
  intro: `<strong>All systems are go.</strong> Your rocket is fully designed. Hit the launch button to ignite the engines and watch it lift off.`,
  boxes: [
    { t:'box-r', tx: '3… 2… 1… Ignition! The engines fire, the clamps release, and your rocket climbs into the void.' },
    { t:'box-c', tx: 'A complete launch vehicle needs: nosecone (aerodynamics), body (fuel/structure), fins (stability), engines (thrust), and a payload. You\'ve built all of them.' },
    { t:'box-t', tx: 'Hit Quick Build in the header to reset and try a completely different design.' },
  ],
  tasks: ['Press Launch and watch it go!'],
  html() {
    return `<div style="text-align:center;padding:8px 0">
      <div style="font-size:2.4rem;margin-bottom:7px">🚀</div>
      <div style="font-family:'Bebas Neue',sans-serif;font-size:1.5rem;color:var(--acc-lt);letter-spacing:.1em;margin-bottom:6px">${R.name || 'YOUR ROCKET'}</div>
      <div style="font-size:.76rem;color:var(--muted);margin-bottom:14px;line-height:1.7">All systems nominal.<br>Ready for launch.</div>
    </div>
    <button class="run-btn" style="font-size:1rem;padding:12px" onclick="launch()">🔥 IGNITION — LAUNCH!</button>`;
  },
  onApply() { launch(); }
},

];

function launch() {
  R.launched = true;
  R.launchY = 0;
  buildRocket();
  sout('🚀 IGNITION! ' + (R.name || 'ROCKET') + ' is lifting off!');
  document.getElementById('liveStatus').textContent = 'LIFTOFF! 🚀';
  document.getElementById('sceneHint').textContent = 'Drag to follow the rocket';
}

function go(i) {
  if (i < 0 || i >= STEPS.length) return;
  currentStep = i;
  renderStep();
  updateProgress();
  const items = document.querySelectorAll('.si');
  if (items[i]) items[i].scrollIntoView({ block: 'nearest' });
  document.getElementById('navPrev').disabled = (i === 0);
  document.getElementById('navNext').disabled = (i === STEPS.length - 1);
}

function renderStep() {
  const s = STEPS[currentStep];
  const body = document.getElementById('stepBody');
  let html = `<div class="step-tag">${s.tag}</div>
    <div class="step-title">${s.title}</div>
    <div class="step-intro">${s.intro}</div>`;
  (s.boxes || []).forEach(b => { html += `<div class="box ${b.t}">${b.tx}</div>`; });
  html += s.html ? s.html() : '';
  if (s.tasks) {
    html += `<div class="task-list">${s.tasks.map(t => {
      const done = stepDone[currentStep];
      return `<div class="task-item${done?' done':''}"><div class="task-dot"></div>${t}</div>`;
    }).join('')}</div>`;
  }
  // Add apply button unless the step provides its own run-btn
  if (!s.html || !s.html().includes('run-btn')) {
    html += `<button class="run-btn" onclick="applyStep(${currentStep})">▶ Apply to Rocket</button>`;
  }
  body.innerHTML = html;
  // Sync active state on step list
  document.querySelectorAll('.si').forEach((el, i) => el.classList.toggle('active', i === currentStep));
}

function applyStep(i) {
  STEPS[i].onApply();
  stepDone[i] = true;
  renderStep();
  updateProgress();
}

function updateProgress() {
  const done = stepDone.filter(Boolean).length;
  const pct = Math.max(3, Math.round((done / STEPS.length) * 100));
  document.getElementById('progFill').style.width = pct + '%';
  document.getElementById('progCt').textContent = done + ' / ' + STEPS.length + ' steps';
  document.querySelectorAll('.si').forEach((el, i) => {
    el.classList.toggle('done', stepDone[i]);
    el.classList.toggle('active', i === currentStep);
    const sn = el.querySelector('.sn');
    if (sn) sn.textContent = stepDone[i] ? '✓' : (i + 1);
  });
}

function quickBuild() {
  R.name = 'NOVA-7'; R.nosecone = 'ogive'; R.bodyHeight = 3.2; R.bodyRadius = 0.35;
  R.primaryCol = '#e8543a'; R.secondaryCol = '#ffffff'; R.finStyle = 'swept'; R.finCount = 4;
  R.boosters = 2; R.boosterSize = 0.7; R.engineCount = 3; R.fairing = 'standard';
  R.stripeOn = true; R.stripeCol = '#f5c842'; R.glowCol = '#ff6600';
  R.launched = false; R.launchY = 0;
  buildRocket();
  sout('⚡ Quick build: NOVA-7 is ready. Press Launch at Step 15!');
  document.getElementById('liveStatus').textContent = 'Quick build active!';
}

function init() {
  const listEl = document.getElementById('stepList');
  STEPS.forEach((s, i) => {
    const item = document.createElement('div');
    item.className = 'si' + (i === 0 ? ' active' : '');
    item.innerHTML = `<div class="sn">${i + 1}</div><div class="sl">${s.title}</div>`;
    item.onclick = () => go(i);
    listEl.appendChild(item);
  });

  document.getElementById('navPrev').disabled = true;
  document.getElementById('navNext').disabled = false;

  buildRocket();
  renderStep();
  updateSpecCard();
}

init();
</script>
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');</script>
