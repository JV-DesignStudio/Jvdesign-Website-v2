<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JVDesignStudio Workspace</title>
  <link rel="stylesheet" href="assets/css/variables.css">
  <link rel="stylesheet" href="assets/css/workspace.css">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

  <header class="hud-header">
    <a href="index.html" class="nav-back">← Skill Tree</a>
    <div id="quest-title" class="hud-title">Loading Quest...</div>
    <div class="hud-stats">
      <div class="hud-stat"><span class="icon">⚡</span> <span id="hud-xp">0 XP</span></div>
      <div class="hud-stat"><span class="icon">⭐</span> <span id="hud-level">Lvl 1</span></div>
      <div class="hud-stat"><span class="icon">🔥</span> <span id="hud-streak">0 Days</span></div>
    </div>
  </header>

  <main class="workspace-grid">

    <!-- Left: Briefing & Objectives -->
    <section class="pane pane-briefing">
      <div class="mascot-card">
        <span id="mascot-avatar" class="avatar">🦊</span>
        <div>
          <h3 id="mascot-name">Lumo</h3>
          <p id="mascot-role">Logic Guide</p>
        </div>
      </div>
      <div id="briefing-body" class="briefing-body"></div>
      <div class="tasks-container">
        <h4>Task Checkpoints:</h4>
        <ul id="task-list" class="task-list"></ul>
      </div>
    </section>

    <!-- Center: Monospace Editor -->
    <section class="pane pane-editor">
      <div class="pane-bar">
        <span>solution.js</span>
        <button id="btn-run" class="btn btn-teal">Run Tests (Ctrl+Enter)</button>
      </div>
      <textarea id="code-editor" class="code-editor" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
    </section>

    <!-- Right: Terminal Output & Execution Logs -->
    <section class="pane pane-terminal">
      <div class="pane-bar">
        <span>Test Console</span>
        <button onclick="document.getElementById('terminal-console').innerHTML=''" class="btn-clear">Clear</button>
      </div>
      <div id="terminal-console" class="terminal-console">
        <div class="log-info">// Run your code to see output here</div>
      </div>
    </section>

  </main>

  <!-- Overlay canvas for particle effects -->
  <canvas id="fx-canvas" class="fx-canvas"></canvas>

  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
