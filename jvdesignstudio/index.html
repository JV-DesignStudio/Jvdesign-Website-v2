<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JVDesignStudio - Learn to Make Games</title>
  <meta name="description" content="A gamified, serverless coding platform for game developers. Level up, earn XP, and build real games.">
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./assets/css/variables.css">
  <link rel="stylesheet" href="./assets/css/main.css">
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&family=Inter:wght@400;600&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- ── Top HUD ── -->
  <header class="hud-header">
    <a href="../index.html" class="nav-back">← Studio</a>
    <h1 class="site-title">JVDesignStudio</h1>
    <div class="hud-stats">
      <div class="hud-stat"><span class="icon">⚡</span> <span id="hud-xp">0 XP</span></div>
      <div class="hud-stat"><span class="icon">⭐</span> <span id="hud-level">Lvl 1</span></div>
      <div class="hud-stat"><span class="icon">🔥</span> <span id="hud-streak">0 Days</span></div>
      <button id="btn-vault"     class="hud-profile-btn" title="Mascot Vault">🦊</button>
      <button id="btn-profiles"  class="hud-profile-btn" title="Player Profiles">🎮</button>
      <button id="btn-profile"   class="hud-profile-btn" title="Save &amp; Settings">👤</button>
      <a href="./arcade.html" class="hud-profile-btn" title="Community Quests" style="display:grid;place-items:center;text-decoration:none">🕹️</a>
    </div>
  </header>

  <!-- ── Hero ── -->
  <section class="hero">
    <h2 class="hero-heading">Learn to <em>make games</em>.<br>Level up for real.</h2>
    <p class="hero-sub">Interactive quests, XP rewards and an unlockable skill tree — no sign-up, no server, zero setup.</p>
  </section>

  <!-- ── Track Tabs ── -->
  <div class="track-tabs-wrap container">
    <div id="track-tabs" class="track-tabs"></div>
    <p id="track-info" class="track-info"></p>
  </div>

  <!-- ── Skill Tree ── -->
  <div class="container">
    <div id="skill-tree-container" class="skill-tree-container">
      <p class="loading-msg">Loading skill tree...</p>
    </div>
  </div>

  <!-- ── Footer ── -->
  <footer class="site-footer">
    <span>© 2026 JVDesignStudio Ltd</span>
    <a href="../index.html">Back to Studio</a>
  </footer>

  <script type="module" src="./assets/js/app.js"></script>
</body>
</html>
