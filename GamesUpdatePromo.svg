<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img">
<title>JVDesignStudio Games Update</title>
<desc>Promotional graphic announcing 22+ games with a new XP, achievement, and character progression system</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#0d0d12"/>
    <stop offset="100%" stop-color="#08080c"/>
  </linearGradient>
  <linearGradient id="xpfill" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#3EC9A7"/>
    <stop offset="100%" stop-color="#70A3A7"/>
  </linearGradient>
  <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#3EC9A7" stop-opacity="0.35"/>
    <stop offset="100%" stop-color="#3EC9A7" stop-opacity="0"/>
  </radialGradient>
  <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#818CF8" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#818CF8" stop-opacity="0"/>
  </radialGradient>
</defs>

<rect width="1200" height="630" fill="url(#bg)"/>
<circle cx="120" cy="80" r="260" fill="url(#glow1)"/>
<circle cx="1080" cy="560" r="280" fill="url(#glow2)"/>

<!-- Brand mark -->
<text x="60" y="70" font-family="'Fredoka', 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#F0EAD6" letter-spacing="0.5">JVDesignStudio</text>
<rect x="60" y="84" width="44" height="4" rx="2" fill="#3EC9A7"/>

<!-- Headline -->
<text x="60" y="200" font-family="'Fredoka', 'Segoe UI', sans-serif" font-size="68" font-weight="800" fill="#ffffff">22+ Games.</text>
<text x="60" y="270" font-family="'Fredoka', 'Segoe UI', sans-serif" font-size="68" font-weight="800" fill="#3EC9A7">One Big Update.</text>

<text x="60" y="315" font-family="-apple-system, 'Segoe UI', sans-serif" font-size="22" fill="rgba(255,255,255,0.65)">XP, achievements &amp; character unlocks — now live across the whole arcade.</text>

<!-- XP bar mockup -->
<g transform="translate(60,360)">
  <rect width="430" height="14" rx="7" fill="rgba(255,255,255,0.08)"/>
  <rect width="290" height="14" rx="7" fill="url(#xpfill)"/>
  <text x="0" y="-12" font-family="-apple-system, sans-serif" font-size="14" font-weight="700" fill="rgba(255,255,255,0.5)" letter-spacing="1">LEVEL 7 · 2,340 / 3,000 XP</text>
</g>

<!-- Achievement badges -->
<g transform="translate(60,410)" font-family="-apple-system, sans-serif">
  <g>
    <rect width="120" height="46" rx="10" fill="rgba(245,166,35,0.12)" stroke="rgba(245,166,35,0.4)"/>
    <circle cx="28" cy="23" r="13" fill="#F5A623"/>
    <text x="28" y="28" font-size="14" text-anchor="middle">★</text>
    <text x="50" y="20" font-size="11" fill="#F5A623" font-weight="700">UNLOCKED</text>
    <text x="50" y="34" font-size="11" fill="rgba(255,255,255,0.6)">First Win</text>
  </g>
  <g transform="translate(132,0)">
    <rect width="120" height="46" rx="10" fill="rgba(62,201,167,0.12)" stroke="rgba(62,201,167,0.4)"/>
    <circle cx="28" cy="23" r="13" fill="#3EC9A7"/>
    <text x="28" y="28" font-size="14" text-anchor="middle">🔥</text>
    <text x="50" y="20" font-size="11" fill="#3EC9A7" font-weight="700">STREAK</text>
    <text x="50" y="34" font-size="11" fill="rgba(255,255,255,0.6)">7 Days</text>
  </g>
  <g transform="translate(264,0)">
    <rect width="120" height="46" rx="10" fill="rgba(129,140,248,0.12)" stroke="rgba(129,140,248,0.4)"/>
    <circle cx="28" cy="23" r="13" fill="#818CF8"/>
    <text x="28" y="28" font-size="14" text-anchor="middle">👑</text>
    <text x="50" y="20" font-size="11" fill="#818CF8" font-weight="700">HIGH SCORE</text>
    <text x="50" y="34" font-size="11" fill="rgba(255,255,255,0.6)">New Best</text>
  </g>
</g>

<!-- Character roster -->
<g transform="translate(60,492)">
  <text x="0" y="-14" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="rgba(255,255,255,0.45)" letter-spacing="1.5">UNLOCKABLE CHARACTERS</text>
  <circle cx="18" cy="20" r="18" fill="#3EC9A7"/>
  <circle cx="64" cy="20" r="18" fill="#F5A623"/>
  <circle cx="110" cy="20" r="18" fill="#818CF8"/>
  <circle cx="156" cy="20" r="18" fill="#FFB6C1"/>
  <circle cx="202" cy="20" r="18" fill="#A78BFA"/>
  <circle cx="248" cy="20" r="18" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.25)" stroke-dasharray="3 3"/>
  <text x="248" y="25" font-size="14" text-anchor="middle" fill="rgba(255,255,255,0.4)">+2</text>
</g>

<!-- Game grid teaser, right side -->
<g transform="translate(760,140)">
  <rect x="0" y="0" width="380" height="380" rx="28" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
  <g font-family="-apple-system, sans-serif">
    <!-- 3x3 game tile grid -->
    <g transform="translate(28,28)">
      <rect x="0"   y="0"   width="100" height="100" rx="16" fill="rgba(62,201,167,0.15)"/>
      <text x="50" y="62" font-size="40" text-anchor="middle">🎮</text>
      <rect x="112" y="0"   width="100" height="100" rx="16" fill="rgba(245,166,35,0.15)"/>
      <text x="162" y="62" font-size="40" text-anchor="middle">🍬</text>
      <rect x="224" y="0"   width="100" height="100" rx="16" fill="rgba(129,140,248,0.15)"/>
      <text x="274" y="62" font-size="40" text-anchor="middle">⚡</text>

      <rect x="0"   y="112" width="100" height="100" rx="16" fill="rgba(255,182,193,0.15)"/>
      <text x="50" y="174" font-size="40" text-anchor="middle">🏰</text>
      <rect x="112" y="112" width="100" height="100" rx="16" fill="rgba(167,139,250,0.15)"/>
      <text x="162" y="174" font-size="40" text-anchor="middle">✨</text>
      <rect x="224" y="112" width="100" height="100" rx="16" fill="rgba(62,201,167,0.15)"/>
      <text x="274" y="174" font-size="40" text-anchor="middle">🃏</text>

      <rect x="0"   y="224" width="100" height="100" rx="16" fill="rgba(245,166,35,0.15)"/>
      <text x="50" y="286" font-size="40" text-anchor="middle">🐍</text>
      <rect x="112" y="224" width="100" height="100" rx="16" fill="rgba(129,140,248,0.15)"/>
      <text x="162" y="286" font-size="40" text-anchor="middle">🦗</text>
      <rect x="224" y="224" width="100" height="100" rx="16" fill="rgba(255,182,193,0.15)"/>
      <text x="274" y="286" font-size="40" text-anchor="middle">🐾</text>
    </g>
  </g>
</g>

<!-- CTA -->
<g transform="translate(60,560)">
  <rect width="290" height="48" rx="24" fill="#3EC9A7"/>
  <text x="145" y="31" font-family="'Fredoka', sans-serif" font-size="18" font-weight="700" fill="#08080c" text-anchor="middle">Play Free →</text>
  <text x="312" y="31" font-family="-apple-system, sans-serif" font-size="18" fill="rgba(255,255,255,0.55)">jvdesignstudio.co.uk/games</text>
</g>
</svg>
