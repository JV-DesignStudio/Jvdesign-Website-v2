<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Audio & Visual Enhancements — Immersive Gameplay</title>

<!-- Background -->
<rect width="1080" height="1080" fill="#0d0d12"/>

<!-- Animated gradient accent -->
<defs>
  <linearGradient id="audioGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F5A623" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#F5A623" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect width="1080" height="1080" fill="url(#audioGrad)"/>

<!-- Top accent line -->
<rect x="0" y="0" width="1080" height="4" fill="#F5A623"/>

<!-- Title -->
<text x="60" y="100" font-family="'Fredoka', sans-serif" font-size="48" font-weight="700" fill="#F5A623">Feel the</text>
<text x="60" y="160" font-family="'Fredoka', sans-serif" font-size="48" font-weight="700" fill="#F0EAD6">Sound & Motion</text>
<text x="60" y="210" font-family="'Inter', sans-serif" font-size="16" fill="rgba(240, 234, 214, 0.6)">Immersive effects now live across all games</text>

<!-- Audio Effects -->
<g transform="translate(60, 280)">
  <text x="0" y="0" font-family="'Fredoka', sans-serif" font-size="24" font-weight="700" fill="#F5A623">AUDIO EFFECTS</text>

  <!-- Effect card 1 -->
  <rect x="0" y="40" width="400" height="160" rx="14" fill="rgba(245, 166, 35, 0.1)" stroke="#F5A623" stroke-width="2"/>
  <text x="30" y="85" font-family="sans-serif" font-size="40">🔊</text>
  <text x="110" y="87" font-family="'Fredoka', sans-serif" font-size="18" font-weight="700" fill="#F0EAD6">Tap Sounds</text>
  <text x="30" y="130" font-family="'Inter', sans-serif" font-size="13" fill="rgba(240, 234, 214, 0.7)">Instant audio feedback</text>
  <text x="30" y="155" font-family="'Inter', sans-serif" font-size="13" fill="rgba(240, 234, 214, 0.7)">on every interaction</text>

  <!-- Effect card 2 -->
  <rect x="470" y="40" width="400" height="160" rx="14" fill="rgba(245, 166, 35, 0.1)" stroke="#F5A623" stroke-width="2"/>
  <text x="500" y="85" font-family="sans-serif" font-size="40">🎵</text>
  <text x="580" y="87" font-family="'Fredoka', sans-serif" font-size="18" font-weight="700" fill="#F0EAD6">Combo Sounds</text>
  <text x="500" y="130" font-family="'Inter', sans-serif" font-size="13" fill="rgba(240, 234, 214, 0.7)">Pitch escalates</text>
  <text x="500" y="155" font-family="'Inter', sans-serif" font-size="13" fill="rgba(240, 234, 214, 0.7)">with skill growth</text>

  <!-- Effect card 3 -->
  <rect x="0" y="240" width="400" height="160" rx="14" fill="rgba(245, 166, 35, 0.1)" stroke="#F5A623" stroke-width="2"/>
  <text x="30" y="285" font-family="sans-serif" font-size="40">⭐</text>
  <text x="110" y="287" font-family="'Fredoka', sans-serif" font-size="18" font-weight="700" fill="#F0EAD6">Success Fanfare</text>
  <text x="30" y="330" font-family="'Inter', sans-serif" font-size="13" fill="rgba(240, 234, 214, 0.7)">Ascending tones on</text>
  <text x="30" y="355" font-family="'Inter', sans-serif" font-size="13" fill="rgba(240, 234, 214, 0.7)">level-ups & wins</text>

  <!-- Effect card 4 -->
  <rect x="470" y="240" width="400" height="160" rx="14" fill="rgba(245, 166, 35, 0.1)" stroke="#F5A623" stroke-width="2"/>
  <text x="500" y="285" font-family="sans-serif" font-size="40">🎚️</text>
  <text x="580" y="287" font-family="'Fredoka', sans-serif" font-size="18" font-weight="700" fill="#F0EAD6">Master Volume</text>
  <text x="500" y="330" font-family="'Inter', sans-serif" font-size="13" fill="rgba(240, 234, 214, 0.7)">Toggle on/off</text>
  <text x="500" y="355" font-family="'Inter', sans-serif" font-size="13" fill="rgba(240, 234, 214, 0.7)">any time you want</text>
</g>

<!-- Visual Effects -->
<g transform="translate(60, 600)">
  <text x="0" y="0" font-family="'Fredoka', sans-serif" font-size="24" font-weight="700" fill="#F5A623">VISUAL EFFECTS</text>

  <!-- Effect row 1 -->
  <g transform="translate(0, 40)">
    <!-- Screen Shake -->
    <rect x="0" y="0" width="300" height="120" rx="12" fill="rgba(245, 166, 35, 0.08)" stroke="rgba(245, 166, 35, 0.3)" stroke-width="1.5"/>
    <text x="150" y="35" font-family="sans-serif" font-size="40" text-anchor="middle">📳</text>
    <text x="150" y="75" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#F0EAD6" text-anchor="middle">Screen Shake</text>
    <text x="150" y="95" font-family="'Inter', sans-serif" font-size="10" fill="rgba(240, 234, 214, 0.5)" text-anchor="middle">Impact feedback</text>

    <!-- Particle Burst -->
    <rect x="350" y="0" width="300" height="120" rx="12" fill="rgba(245, 166, 35, 0.08)" stroke="rgba(245, 166, 35, 0.3)" stroke-width="1.5"/>
    <text x="500" y="35" font-family="sans-serif" font-size="40" text-anchor="middle">💥</text>
    <text x="500" y="75" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#F0EAD6" text-anchor="middle">Particle Burst</text>
    <text x="500" y="95" font-family="'Inter', sans-serif" font-size="10" fill="rgba(240, 234, 214, 0.5)" text-anchor="middle">Explosion effects</text>

    <!-- Confetti -->
    <rect x="700" y="0" width="280" height="120" rx="12" fill="rgba(245, 166, 35, 0.08)" stroke="rgba(245, 166, 35, 0.3)" stroke-width="1.5"/>
    <text x="840" y="35" font-family="sans-serif" font-size="40" text-anchor="middle">🎉</text>
    <text x="840" y="75" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#F0EAD6" text-anchor="middle">Confetti</text>
    <text x="840" y="95" font-family="'Inter', sans-serif" font-size="10" fill="rgba(240, 234, 214, 0.5)" text-anchor="middle">Celebrate wins</text>
  </g>
</g>

<!-- Stats section -->
<g transform="translate(60, 820)">
  <rect x="0" y="0" width="900" height="100" rx="14" fill="rgba(245, 166, 35, 0.08)" stroke="rgba(245, 166, 35, 0.2)" stroke-width="1"/>

  <!-- Stat 1 -->
  <text x="100" y="35" font-family="'Fredoka', sans-serif" font-size="32" font-weight="700" fill="#F5A623" text-anchor="middle">6</text>
  <text x="100" y="65" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#F0EAD6" text-anchor="middle">Sound Effects</text>

  <!-- Stat 2 -->
  <text x="350" y="35" font-family="'Fredoka', sans-serif" font-size="32" font-weight="700" fill="#F5A623" text-anchor="middle">5+</text>
  <text x="350" y="65" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#F0EAD6" text-anchor="middle">Visual Effects</text>

  <!-- Stat 3 -->
  <text x="600" y="35" font-family="'Fredoka', sans-serif" font-size="32" font-weight="700" fill="#F5A623" text-anchor="middle">20+</text>
  <text x="600" y="65" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#F0EAD6" text-anchor="middle">Games Enhanced</text>

  <!-- Stat 4 -->
  <text x="800" y="35" font-family="'Fredoka', sans-serif" font-size="32" font-weight="700" fill="#F5A623" text-anchor="middle">0ms</text>
  <text x="800" y="65" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#F0EAD6" text-anchor="middle">Latency</text>
</g>

</svg>
