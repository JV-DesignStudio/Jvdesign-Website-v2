<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Learn by Doing — Quizzes, XP and Certificates on Every Workshop</title>

<rect width="1080" height="1080" fill="#0d0d12"/>
<defs>
  <linearGradient id="bgGrad3" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#06d6a0" stop-opacity="0.22"/>
    <stop offset="55%" stop-color="#06d6a0" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="ctaGrad3" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#06d6a0"/>
    <stop offset="100%" stop-color="#4de3bb"/>
  </linearGradient>
</defs>
<rect width="1080" height="1080" fill="url(#bgGrad3)"/>
<rect x="0" y="0" width="1080" height="6" fill="#06d6a0"/>

<!-- Kicker -->
<text x="60" y="96" font-family="'Inter', sans-serif" font-size="22" font-weight="800" letter-spacing="3" fill="#06d6a0">NOT JUST READING — DOING</text>

<!-- Headline -->
<text x="60" y="180" font-family="'Fredoka', sans-serif" font-size="74" font-weight="700" fill="#F0EAD6">Learn by</text>
<text x="60" y="258" font-family="'Fredoka', sans-serif" font-size="74" font-weight="700" fill="#06d6a0">doing.</text>
<text x="60" y="318" font-family="'Inter', sans-serif" font-size="26" font-weight="500" fill="rgba(240,234,214,0.75)">Every workshop checks what you learned as you build.</text>

<!-- Mock quiz card -->
<g transform="translate(60, 368)">
  <rect width="960" height="330" rx="20" fill="#15151d" stroke="rgba(6,214,160,0.35)" stroke-width="2"/>
  <text x="40" y="66" font-family="'Fredoka', sans-serif" font-size="28" font-weight="700" fill="#06d6a0">🧠 Knowledge Check</text>
  <text x="920" y="66" font-family="'Inter', sans-serif" font-size="22" font-weight="700" fill="#F5A623" text-anchor="end">+15 XP</text>
  <text x="40" y="120" font-family="'Inter', sans-serif" font-size="24" font-weight="600" fill="#F0EAD6">What does Event BeginPlay do in a Blueprint?</text>

  <rect x="40" y="150" width="880" height="52" rx="12" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <text x="66" y="183" font-family="'Inter', sans-serif" font-size="21" fill="rgba(240,234,214,0.85)">A   Fires every single frame</text>

  <rect x="40" y="212" width="880" height="52" rx="12" fill="rgba(6,214,160,0.14)" stroke="#06d6a0" stroke-width="2"/>
  <text x="66" y="245" font-family="'Inter', sans-serif" font-size="21" font-weight="700" fill="#06d6a0">B   Fires once when the game starts  ✓</text>

  <rect x="40" y="274" width="880" height="40" rx="10" fill="rgba(6,214,160,0.06)"/>
  <text x="66" y="300" font-family="'Inter', sans-serif" font-size="18" fill="rgba(240,234,214,0.7)">✅ Correct! That is why all setup logic connects to it.</text>
</g>

<!-- 3 pillars -->
<g transform="translate(60, 728)">
  <rect width="300" height="150" rx="18" fill="rgba(245,166,35,0.10)" stroke="rgba(245,166,35,0.35)" stroke-width="2"/>
  <text x="150" y="66" font-family="sans-serif" font-size="44" text-anchor="middle">⚡</text>
  <text x="150" y="110" font-family="'Fredoka', sans-serif" font-size="22" font-weight="700" fill="#F0EAD6" text-anchor="middle">Earn XP</text>
  <text x="150" y="136" font-family="'Inter', sans-serif" font-size="16" fill="rgba(240,234,214,0.65)" text-anchor="middle">Level up as you go</text>

  <g transform="translate(330,0)">
    <rect width="300" height="150" rx="18" fill="rgba(248,113,113,0.10)" stroke="rgba(248,113,113,0.35)" stroke-width="2"/>
    <text x="150" y="66" font-family="sans-serif" font-size="44" text-anchor="middle">🔥</text>
    <text x="150" y="110" font-family="'Fredoka', sans-serif" font-size="22" font-weight="700" fill="#F0EAD6" text-anchor="middle">Build streaks</text>
    <text x="150" y="136" font-family="'Inter', sans-serif" font-size="16" fill="rgba(240,234,214,0.65)" text-anchor="middle">Bonus for a run</text>
  </g>

  <g transform="translate(660,0)">
    <rect width="300" height="150" rx="18" fill="rgba(167,139,250,0.12)" stroke="rgba(167,139,250,0.35)" stroke-width="2"/>
    <text x="150" y="66" font-family="sans-serif" font-size="44" text-anchor="middle">🏆</text>
    <text x="150" y="110" font-family="'Fredoka', sans-serif" font-size="22" font-weight="700" fill="#F0EAD6" text-anchor="middle">Certificates</text>
    <text x="150" y="136" font-family="'Inter', sans-serif" font-size="16" fill="rgba(240,234,214,0.65)" text-anchor="middle">Print when done</text>
  </g>
</g>

<!-- CTA -->
<rect x="60" y="952" width="960" height="68" rx="34" fill="url(#ctaGrad3)"/>
<text x="540" y="995" font-family="'Fredoka', sans-serif" font-size="24" font-weight="700" fill="#0d0d12" text-anchor="middle">Start a workshop FREE → jvdesignstudio.co.uk</text>
</svg>
