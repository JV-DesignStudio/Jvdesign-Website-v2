<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Cosmetic Unlocks & Customization — Express Yourself</title>

<!-- Background -->
<rect width="1080" height="1080" fill="#0d0d12"/>

<!-- Animated gradient accent -->
<defs>
  <linearGradient id="cosmeticGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F5A623" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#F5A623" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect width="1080" height="1080" fill="url(#cosmeticGrad)"/>

<!-- Top accent line -->
<rect x="0" y="0" width="1080" height="4" fill="#F5A623"/>

<!-- Title -->
<text x="60" y="100" font-family="'Fredoka', sans-serif" font-size="56" font-weight="700" fill="#F5A623">Unlock &amp;</text>
<text x="60" y="160" font-family="'Fredoka', sans-serif" font-size="56" font-weight="700" fill="#F0EAD6">Customize</text>

<!-- Character showcase -->
<g transform="translate(60, 230)">
  <text x="0" y="0" font-family="'Fredoka', sans-serif" font-size="22" font-weight="700" fill="#F5A623">PLAYABLE CHARACTERS</text>

  <!-- Character row 1 -->
  <g transform="translate(0, 50)">
    <!-- Tiger -->
    <rect x="0" y="0" width="200" height="200" rx="16" fill="rgba(245, 166, 35, 0.12)" stroke="#F5A623" stroke-width="2"/>
    <text x="100" y="85" font-family="sans-serif" font-size="80" text-anchor="middle">🐯</text>
    <text x="100" y="160" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#F0EAD6" text-anchor="middle">Tiger</text>
    <rect x="20" y="170" width="160" height="16" rx="8" fill="rgba(245, 166, 35, 0.15)" stroke="#F5A623" stroke-width="1"/>
    <rect x="20" y="170" width="112" height="16" rx="8" fill="#F5A623"/>

    <!-- Fox -->
    <rect x="230" y="0" width="200" height="200" rx="16" fill="rgba(245, 166, 35, 0.12)" stroke="#F5A623" stroke-width="2"/>
    <text x="330" y="85" font-family="sans-serif" font-size="80" text-anchor="middle">🦊</text>
    <text x="330" y="160" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#F0EAD6" text-anchor="middle">Fox</text>
    <rect x="250" y="170" width="160" height="16" rx="8" fill="rgba(245, 166, 35, 0.15)" stroke="#F5A623" stroke-width="1"/>
    <rect x="250" y="170" width="128" height="16" rx="8" fill="#F5A623"/>

    <!-- Lion -->
    <rect x="460" y="0" width="200" height="200" rx="16" fill="rgba(245, 166, 35, 0.12)" stroke="#F5A623" stroke-width="2"/>
    <text x="560" y="85" font-family="sans-serif" font-size="80" text-anchor="middle">🦁</text>
    <text x="560" y="160" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#F0EAD6" text-anchor="middle">Lion</text>
    <rect x="480" y="170" width="160" height="16" rx="8" fill="rgba(245, 166, 35, 0.15)" stroke="#F5A623" stroke-width="1"/>
    <rect x="480" y="170" width="96" height="16" rx="8" fill="#F5A623"/>

    <!-- Panda (Locked) -->
    <rect x="690" y="0" width="200" height="200" rx="16" fill="rgba(100, 100, 100, 0.08)" stroke="rgba(100, 100, 100, 0.2)" stroke-width="2"/>
    <text x="790" y="85" font-family="sans-serif" font-size="80" text-anchor="middle" opacity="0.4">🐼</text>
    <text x="790" y="160" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="rgba(240, 234, 214, 0.3)" text-anchor="middle">Panda</text>
    <text x="790" y="185" font-family="'Inter', sans-serif" font-size="11" fill="rgba(200, 200, 200, 0.4)" text-anchor="middle">Locked</text>
  </g>
</g>

<!-- Cosmetic Types -->
<g transform="translate(60, 540)">
  <text x="0" y="0" font-family="'Fredoka', sans-serif" font-size="22" font-weight="700" fill="#F5A623">COSMETIC TYPES</text>

  <!-- Type 1: Character Skins -->
  <rect x="0" y="40" width="210" height="140" rx="12" fill="rgba(245, 166, 35, 0.1)" stroke="rgba(245, 166, 35, 0.3)" stroke-width="2"/>
  <text x="105" y="75" font-family="sans-serif" font-size="36" text-anchor="middle">👕</text>
  <text x="105" y="115" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#F0EAD6" text-anchor="middle">Character Skins</text>

  <!-- Type 2: Colors -->
  <rect x="240" y="40" width="210" height="140" rx="12" fill="rgba(245, 166, 35, 0.1)" stroke="rgba(245, 166, 35, 0.3)" stroke-width="2"/>
  <text x="345" y="75" font-family="sans-serif" font-size="36" text-anchor="middle">🎨</text>
  <text x="345" y="115" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#F0EAD6" text-anchor="middle">Color Themes</text>

  <!-- Type 3: Accessories -->
  <rect x="480" y="40" width="210" height="140" rx="12" fill="rgba(245, 166, 35, 0.1)" stroke="rgba(245, 166, 35, 0.3)" stroke-width="2"/>
  <text x="585" y="75" font-family="sans-serif" font-size="36" text-anchor="middle">👑</text>
  <text x="585" y="115" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#F0EAD6" text-anchor="middle">Accessories</text>

  <!-- Type 4: Badges -->
  <rect x="720" y="40" width="210" height="140" rx="12" fill="rgba(245, 166, 35, 0.1)" stroke="rgba(245, 166, 35, 0.3)" stroke-width="2"/>
  <text x="825" y="75" font-family="sans-serif" font-size="36" text-anchor="middle">🏅</text>
  <text x="825" y="115" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#F0EAD6" text-anchor="middle">Badges</text>
</g>

<!-- Unlock Method -->
<g transform="translate(60, 780)">
  <rect x="0" y="0" width="900" height="130" rx="14" fill="rgba(245, 166, 35, 0.08)" stroke="rgba(245, 166, 35, 0.2)" stroke-width="2"/>

  <text x="40" y="40" font-family="'Fredoka', sans-serif" font-size="20" font-weight="700" fill="#F5A623">HOW TO UNLOCK</text>

  <!-- Method 1 -->
  <g transform="translate(40, 65)">
    <circle cx="8" cy="8" r="6" fill="#F5A623"/>
    <text x="25" y="13" font-family="'Inter', sans-serif" font-size="13" fill="#F0EAD6">Level Up</text>
  </g>

  <!-- Method 2 -->
  <g transform="translate(280, 65)">
    <circle cx="8" cy="8" r="6" fill="#F5A623"/>
    <text x="25" y="13" font-family="'Inter', sans-serif" font-size="13" fill="#F0EAD6">Earn Achievements</text>
  </g>

  <!-- Method 3 -->
  <g transform="translate(570, 65)">
    <circle cx="8" cy="8" r="6" fill="#F5A623"/>
    <text x="25" y="13" font-family="'Inter', sans-serif" font-size="13" fill="#F0EAD6">Complete Quests</text>
  </g>
</g>

</svg>
