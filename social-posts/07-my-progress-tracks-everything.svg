<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" role="img">
<title>My Progress — Every Workshop, Tracked</title>

<rect width="1080" height="1080" fill="#0d0d12"/>
<defs>
  <linearGradient id="bgGrad2" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.25"/>
    <stop offset="55%" stop-color="#a78bfa" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="xpFill" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#F5A623"/>
    <stop offset="100%" stop-color="#ffca55"/>
  </linearGradient>
  <linearGradient id="ctaGrad2" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#F5A623"/>
    <stop offset="100%" stop-color="#ffca55"/>
  </linearGradient>
</defs>
<rect width="1080" height="1080" fill="url(#bgGrad2)"/>
<rect x="0" y="0" width="1080" height="6" fill="#a78bfa"/>

<!-- Kicker -->
<text x="60" y="96" font-family="'Inter', sans-serif" font-size="22" font-weight="800" letter-spacing="3" fill="#a78bfa">PROGRESS, LEVELLED UP</text>

<!-- Headline -->
<text x="60" y="176" font-family="'Fredoka', sans-serif" font-size="70" font-weight="700" fill="#F0EAD6">One dashboard.</text>
<text x="60" y="250" font-family="'Fredoka', sans-serif" font-size="70" font-weight="700" fill="#F0EAD6">Every workshop</text>
<text x="60" y="310" font-family="'Inter', sans-serif" font-size="26" font-weight="500" fill="rgba(240,234,214,0.75)">XP, levels, streaks, badges and certificates, all in one place.</text>

<!-- Big stats row -->
<g transform="translate(60, 356)">
  <rect width="300" height="150" rx="18" fill="rgba(245,166,35,0.10)" stroke="rgba(245,166,35,0.4)" stroke-width="2"/>
  <text x="150" y="86" font-family="'Fredoka', sans-serif" font-size="60" font-weight="700" fill="#F5A623" text-anchor="middle">119</text>
  <text x="150" y="122" font-family="'Inter', sans-serif" font-size="19" font-weight="600" fill="#F0EAD6" text-anchor="middle">Workshops tracked</text>

  <g transform="translate(330,0)">
    <rect width="300" height="150" rx="18" fill="rgba(6,214,160,0.10)" stroke="rgba(6,214,160,0.4)" stroke-width="2"/>
    <text x="150" y="86" font-family="'Fredoka', sans-serif" font-size="60" font-weight="700" fill="#06d6a0" text-anchor="middle">17</text>
    <text x="150" y="122" font-family="'Inter', sans-serif" font-size="19" font-weight="600" fill="#F0EAD6" text-anchor="middle">Learning series</text>
  </g>

  <g transform="translate(660,0)">
    <rect width="300" height="150" rx="18" fill="rgba(167,139,250,0.12)" stroke="rgba(167,139,250,0.4)" stroke-width="2"/>
    <text x="150" y="86" font-family="'Fredoka', sans-serif" font-size="60" font-weight="700" fill="#a78bfa" text-anchor="middle">22</text>
    <text x="150" y="122" font-family="'Inter', sans-serif" font-size="19" font-weight="600" fill="#F0EAD6" text-anchor="middle">Badges to earn</text>
  </g>
</g>

<!-- Mock progress card -->
<g transform="translate(60, 540)">
  <rect width="960" height="230" rx="20" fill="#15151d" stroke="rgba(255,255,255,0.08)" stroke-width="2"/>
  <text x="40" y="62" font-family="'Fredoka', sans-serif" font-size="30" font-weight="700" fill="#F0EAD6">⭐ Level 9  ·  880 XP</text>
  <text x="880" y="62" font-family="'Inter', sans-serif" font-size="20" font-weight="600" fill="rgba(240,234,214,0.55)" text-anchor="end">🔥 8 streak</text>
  <!-- xp bar -->
  <rect x="40" y="92" width="880" height="20" rx="10" fill="#2a2a35"/>
  <rect x="40" y="92" width="700" height="20" rx="10" fill="url(#xpFill)"/>
  <text x="40" y="150" font-family="'Inter', sans-serif" font-size="19" fill="rgba(240,234,214,0.7)">🐱 Scratch  ✓ 6/6      🎮 Roblox  ✓ 8/8      🐍 Python  ✓ 6/6</text>
  <text x="40" y="190" font-family="'Inter', sans-serif" font-size="19" fill="rgba(240,234,214,0.7)">🏰 Builders  ▓ 2/8      🎯 Godot  ▓ 1/9      🏆 5 certificates</text>
</g>

<!-- Feature strip -->
<g transform="translate(60, 800)">
  <rect width="960" height="108" rx="18" fill="rgba(167,139,250,0.08)" stroke="rgba(167,139,250,0.3)" stroke-width="2"/>
  <text x="40" y="50" font-family="'Fredoka', sans-serif" font-size="27" font-weight="700" fill="#a78bfa">Pick up right where you left off</text>
  <text x="40" y="88" font-family="'Inter', sans-serif" font-size="20" fill="rgba(240,234,214,0.8)">Continue-where-you-left-off, per-series bars and printable certificates.</text>
</g>

<!-- CTA -->
<rect x="60" y="952" width="960" height="68" rx="34" fill="url(#ctaGrad2)"/>
<text x="540" y="995" font-family="'Fredoka', sans-serif" font-size="24" font-weight="700" fill="#0d0d12" text-anchor="middle">Track your progress FREE → jvdesignstudio.co.uk</text>
</svg>
