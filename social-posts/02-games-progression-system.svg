<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Games Progression System — XP, Achievements, Characters</title>

<!-- Background -->
<rect width="1080" height="1080" fill="#0d0d12"/>

<!-- Animated gradient accent -->
<defs>
  <linearGradient id="progressGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F5A623" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#F5A623" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="xpBar" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#F5A623"/>
    <stop offset="100%" stop-color="#FFD959"/>
  </linearGradient>
</defs>
<rect width="1080" height="1080" fill="url(#progressGrad)"/>

<!-- Top accent line -->
<rect x="0" y="0" width="1080" height="4" fill="#F5A623"/>

<!-- Title -->
<text x="60" y="100" font-family="'Fredoka', sans-serif" font-size="56" font-weight="700" fill="#F5A623">Level Up</text>
<text x="60" y="160" font-family="'Fredoka', sans-serif" font-size="56" font-weight="700" fill="#F0EAD6">Your Gaming</text>

<!-- Level display -->
<g transform="translate(60, 210)">
  <!-- Level circle -->
  <circle cx="120" cy="120" r="100" fill="rgba(245, 166, 35, 0.15)" stroke="#F5A623" stroke-width="3"/>
  <text x="120" y="145" font-family="'Fredoka', sans-serif" font-size="72" font-weight="700" fill="#F5A623" text-anchor="middle">12</text>

  <!-- XP Bar -->
  <g transform="translate(280, 80)">
    <rect x="0" y="0" width="520" height="40" rx="20" fill="rgba(255, 255, 255, 0.1)" stroke="rgba(245, 166, 35, 0.4)" stroke-width="2"/>
    <rect x="0" y="0" width="390" height="40" rx="20" fill="url(#xpBar)"/>
    <text x="260" y="28" font-family="'Inter', sans-serif" font-size="14" font-weight="600" fill="#0d0d12" text-anchor="middle">750/1000 XP</text>
  </g>

  <!-- Character unlock -->
  <text x="830" y="65" font-family="sans-serif" font-size="80" text-anchor="middle">🦁</text>
  <text x="830" y="140" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#F0EAD6" text-anchor="middle">Lion</text>
  <text x="830" y="158" font-family="'Inter', sans-serif" font-size="10" fill="rgba(240, 234, 214, 0.6)" text-anchor="middle">Unlocked</text>
</g>

<!-- Feature cards -->
<g transform="translate(60, 510)">
  <!-- Card 1: Achievements -->
  <rect x="0" y="0" width="420" height="150" rx="16" fill="rgba(245, 166, 35, 0.1)" stroke="#F5A623" stroke-width="2"/>
  <text x="30" y="50" font-family="sans-serif" font-size="48">🏆</text>
  <text x="110" y="52" font-family="'Fredoka', sans-serif" font-size="24" font-weight="700" fill="#F0EAD6">60+ Achievements</text>
  <text x="30" y="110" font-family="'Inter', sans-serif" font-size="14" fill="rgba(240, 234, 214, 0.7)">Common → Rare → Legendary</text>

  <!-- Card 2: Cross-Game Progress -->
  <rect x="480" y="0" width="420" height="150" rx="16" fill="rgba(245, 166, 35, 0.1)" stroke="#F5A623" stroke-width="2"/>
  <text x="510" y="50" font-family="sans-serif" font-size="48">🎮</text>
  <text x="590" y="52" font-family="'Fredoka', sans-serif" font-size="24" font-weight="700" fill="#F0EAD6">29 Games Arcade</text>
  <text x="510" y="110" font-family="'Inter', sans-serif" font-size="14" fill="rgba(240, 234, 214, 0.7)">Progress saved across all games</text>
</g>

<!-- Character collection preview -->
<g transform="translate(60, 740)">
  <text x="0" y="0" font-family="'Fredoka', sans-serif" font-size="24" font-weight="700" fill="#F5A623">UNLOCKABLE CHARACTERS</text>

  <!-- Characters in a row -->
  <g transform="translate(0, 40)">
    <!-- Character 1 -->
    <rect x="0" y="0" width="150" height="140" rx="12" fill="rgba(245, 166, 35, 0.08)" stroke="rgba(245, 166, 35, 0.3)" stroke-width="2"/>
    <text x="75" y="55" font-family="sans-serif" font-size="60" text-anchor="middle">🐯</text>
    <text x="75" y="105" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#F0EAD6" text-anchor="middle">Tiger</text>
    <text x="75" y="125" font-family="'Inter', sans-serif" font-size="10" fill="#F5A623" text-anchor="middle">Unlocked</text>

    <!-- Character 2 -->
    <rect x="190" y="0" width="150" height="140" rx="12" fill="rgba(245, 166, 35, 0.08)" stroke="rgba(245, 166, 35, 0.3)" stroke-width="2"/>
    <text x="265" y="55" font-family="sans-serif" font-size="60" text-anchor="middle">🦊</text>
    <text x="265" y="105" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#F0EAD6" text-anchor="middle">Fox</text>
    <text x="265" y="125" font-family="'Inter', sans-serif" font-size="10" fill="#F5A623" text-anchor="middle">Unlocked</text>

    <!-- Character 3 -->
    <rect x="380" y="0" width="150" height="140" rx="12" fill="rgba(245, 166, 35, 0.08)" stroke="rgba(245, 166, 35, 0.3)" stroke-width="2"/>
    <text x="455" y="55" font-family="sans-serif" font-size="60" text-anchor="middle">🦁</text>
    <text x="455" y="105" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#F0EAD6" text-anchor="middle">Lion</text>
    <text x="455" y="125" font-family="'Inter', sans-serif" font-size="10" fill="#F5A623" text-anchor="middle">Unlocked</text>

    <!-- Character 4 (Locked) -->
    <rect x="570" y="0" width="150" height="140" rx="12" fill="rgba(100, 100, 100, 0.1)" stroke="rgba(100, 100, 100, 0.3)" stroke-width="2"/>
    <text x="645" y="55" font-family="sans-serif" font-size="60" text-anchor="middle">🐉</text>
    <text x="645" y="105" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="rgba(240, 234, 214, 0.4)" text-anchor="middle">Dragon</text>
    <text x="645" y="125" font-family="'Inter', sans-serif" font-size="10" fill="rgba(200, 200, 200, 0.4)" text-anchor="middle">Locked</text>
  </g>
</g>

<!-- CTA Button -->
<rect x="140" y="960" width="800" height="60" rx="30" fill="#F5A623"/>
<text x="540" y="995" font-family="'Fredoka', sans-serif" font-size="22" font-weight="700" fill="#0d0d12" text-anchor="middle">Play & Progress FREE → jvdesignstudio.co.uk/games</text>

</svg>
