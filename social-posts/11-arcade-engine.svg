<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Arcade Engine Overhaul — Reliable Saves, Honest Progress, Share Your Score</title>

<!-- Background -->
<rect width="1080" height="1080" fill="#0d0d12"/>
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#A583CE" stop-opacity="0.30"/>
    <stop offset="55%" stop-color="#A583CE" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#A583CE"/>
    <stop offset="100%" stop-color="#63c7ff"/>
  </linearGradient>
</defs>
<rect width="1080" height="1080" fill="url(#bgGrad)"/>
<rect x="0" y="0" width="1080" height="6" fill="#A583CE"/>

<!-- Kicker -->
<text x="60" y="96" font-family="'Inter', sans-serif" font-size="22" font-weight="800" letter-spacing="3" fill="#A583CE">UNDER THE HOOD · JVDS ARCADE</text>

<!-- Headline -->
<text x="60" y="178" font-family="'Fredoka', sans-serif" font-size="72" font-weight="700" fill="#F0EAD6">Arcade Engine</text>
<text x="60" y="254" font-family="'Fredoka', sans-serif" font-size="72" font-weight="700" fill="#A583CE">Overhaul</text>
<text x="60" y="314" font-family="'Inter', sans-serif" font-size="26" font-weight="500" fill="rgba(240,234,214,0.75)">The shared brain behind every arcade game, rebuilt and honest.</text>

<!-- Fix grid: 4 tiles -->
<g transform="translate(60, 362)">
