    <text x="112" y="98" font-family="'Inter', sans-serif" font-size="19" fill="rgba(240,234,214,0.75)">Reliable now, even on phones.</text>
  </g>
  <g transform="translate(500,0)">
    <rect width="460" height="150" rx="20" fill="rgba(165,131,206,0.10)" stroke="#A583CE" stroke-width="2"/>
    <text x="44" y="70" font-family="sans-serif" font-size="44">🔥</text>
    <text x="112" y="60" font-family="'Fredoka', sans-serif" font-size="26" font-weight="700" fill="#F0EAD6">Streaks that count</text>
    <text x="112" y="98" font-family="'Inter', sans-serif" font-size="19" fill="rgba(240,234,214,0.75)">Play-time &amp; sound working again.</text>
  </g>
  <g transform="translate(0,172)">
    <rect width="460" height="150" rx="20" fill="rgba(165,131,206,0.10)" stroke="#A583CE" stroke-width="2"/>
    <text x="44" y="70" font-family="sans-serif" font-size="44">📊</text>
    <text x="112" y="60" font-family="'Fredoka', sans-serif" font-size="26" font-weight="700" fill="#F0EAD6">Honest progress</text>
    <text x="112" y="98" font-family="'Inter', sans-serif" font-size="19" fill="rgba(240,234,214,0.75)">Only what you really did.</text>
  </g>
  <g transform="translate(500,172)">
    <rect width="460" height="150" rx="20" fill="rgba(165,131,206,0.10)" stroke="#A583CE" stroke-width="2"/>
    <text x="44" y="70" font-family="sans-serif" font-size="44">📣</text>
    <text x="112" y="60" font-family="'Fredoka', sans-serif" font-size="26" font-weight="700" fill="#F0EAD6">Share your score</text>
    <text x="112" y="98" font-family="'Inter', sans-serif" font-size="19" fill="rgba(240,234,214,0.75)">One tap on a new best.</text>
