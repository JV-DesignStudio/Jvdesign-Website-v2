<!-- Feature strip -->
<g transform="translate(60, 776)">
  <rect width="960" height="132" rx="18" fill="rgba(165,131,206,0.08)" stroke="rgba(165,131,206,0.3)" stroke-width="2"/>
  <text x="40" y="58" font-family="'Fredoka', sans-serif" font-size="30" font-weight="700" fill="#A583CE">⚡ 19 games on one clean system</text>
  <text x="40" y="100" font-family="'Inter', sans-serif" font-size="21" fill="rgba(240,234,214,0.8)">Faster reporting, fewer missed scores, one profile across them all.</text>
</g>

<!-- CTA -->
<rect x="60" y="952" width="960" height="68" rx="34" fill="url(#ctaGrad)"/>
<text x="540" y="995" font-family="'Fredoka', sans-serif" font-size="24" font-weight="700" fill="#0d0d12" text-anchor="middle">Beat your best FREE → jvdesignstudio.co.uk</text>
