<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Workshop System Launch — 62 Interactive Learning Paths</title>

<!-- Background -->
<rect width="1080" height="1080" fill="#0d0d12"/>

<!-- Animated gradient accent -->
<defs>
  <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F5A623" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#F5A623" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect width="1080" height="1080" fill="url(#accentGrad)"/>

<!-- Top accent line -->
<rect x="0" y="0" width="1080" height="4" fill="#F5A623"/>

<!-- Header section -->
<text x="60" y="80" font-family="'Fredoka', sans-serif" font-size="48" font-weight="700" fill="#F5A623">62 NEW</text>
<text x="60" y="140" font-family="'Fredoka', sans-serif" font-size="48" font-weight="700" fill="#F0EAD6">Interactive</text>
<text x="60" y="200" font-family="'Fredoka', sans-serif" font-size="48" font-weight="700" fill="#F0EAD6">Workshops</text>

<!-- Learning tracks visualization -->
<g transform="translate(60, 280)">
  <!-- Track 1 - Web -->
  <circle cx="60" cy="60" r="50" fill="rgba(245, 166, 35, 0.2)" stroke="#F5A623" stroke-width="3"/>
  <text x="60" y="70" font-family="sans-serif" font-size="24" fill="#F5A623" text-anchor="middle">🌐</text>
  <text x="60" y="145" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#F0EAD6" text-anchor="middle">Web Dev</text>

  <!-- Track 2 - Minecraft -->
  <circle cx="250" cy="60" r="50" fill="rgba(245, 166, 35, 0.2)" stroke="#F5A623" stroke-width="3"/>
  <text x="250" y="70" font-family="sans-serif" font-size="24" fill="#F5A623" text-anchor="middle">⛏️</text>
  <text x="250" y="145" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#F0EAD6" text-anchor="middle">Minecraft</text>

  <!-- Track 3 - 3D -->
  <circle cx="440" cy="60" r="50" fill="rgba(245, 166, 35, 0.2)" stroke="#F5A623" stroke-width="3"/>
  <text x="440" y="70" font-family="sans-serif" font-size="24" fill="#F5A623" text-anchor="middle">🎲</text>
  <text x="440" y="145" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#F0EAD6" text-anchor="middle">3D Design</text>

  <!-- Track 4 - Music -->
  <circle cx="630" cy="60" r="50" fill="rgba(245, 166, 35, 0.2)" stroke="#F5A623" stroke-width="3"/>
  <text x="630" y="70" font-family="sans-serif" font-size="24" fill="#F5A623" text-anchor="middle">🎵</text>
  <text x="630" y="145" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#F0EAD6" text-anchor="middle">Music & Audio</text>
</g>

<!-- Feature highlights -->
<g transform="translate(60, 520)">
  <rect x="0" y="0" width="280" height="120" rx="16" fill="rgba(245, 166, 35, 0.1)" stroke="#F5A623" stroke-width="2"/>
  <text x="20" y="40" font-family="'Fredoka', sans-serif" font-size="28" font-weight="700" fill="#F5A623">✓</text>
  <text x="60" y="42" font-family="'Fredoka', sans-serif" font-size="20" font-weight="600" fill="#F0EAD6">Progress Tracking</text>
  <text x="20" y="85" font-family="'Inter', sans-serif" font-size="14" fill="rgba(240, 234, 214, 0.7)">Complete steps, earn XP</text>

  <rect x="360" y="0" width="280" height="120" rx="16" fill="rgba(245, 166, 35, 0.1)" stroke="#F5A623" stroke-width="2"/>
  <text x="380" y="40" font-family="'Fredoka', sans-serif" font-size="28" font-weight="700" fill="#F5A623">🚀</text>
  <text x="420" y="42" font-family="'Fredoka', sans-serif" font-size="20" font-weight="600" fill="#F0EAD6">Gamified Learning</text>
  <text x="380" y="85" font-family="'Inter', sans-serif" font-size="14" fill="rgba(240, 234, 214, 0.7)">Level up while learning</text>
</g>

<!-- Stats section -->
<g transform="translate(60, 720)">
  <rect x="0" y="0" width="900" height="180" rx="16" fill="rgba(245, 166, 35, 0.08)" stroke="rgba(245, 166, 35, 0.3)" stroke-width="2"/>

  <!-- Stat 1 -->
  <text x="50" y="50" font-family="'Fredoka', sans-serif" font-size="48" font-weight="700" fill="#F5A623">62</text>
  <text x="50" y="95" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#F0EAD6">Interactive</text>
  <text x="50" y="120" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#F0EAD6">Workshops</text>

  <!-- Stat 2 -->
  <text x="320" y="50" font-family="'Fredoka', sans-serif" font-size="48" font-weight="700" fill="#F5A623">5</text>
  <text x="320" y="95" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#F0EAD6">Learning</text>
  <text x="320" y="120" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#F0EAD6">Tracks</text>

  <!-- Stat 3 -->
  <text x="590" y="50" font-family="'Fredoka', sans-serif" font-size="48" font-weight="700" fill="#F5A623">100%</text>
  <text x="590" y="95" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#F0EAD6">Progress</text>
  <text x="590" y="120" font-family="'Inter', sans-serif" font-size="16" font-weight="600" fill="#F0EAD6">Tracked</text>
</g>

<!-- CTA Button -->
<rect x="140" y="960" width="800" height="60" rx="30" fill="#F5A623"/>
<text x="540" y="995" font-family="'Fredoka', sans-serif" font-size="22" font-weight="700" fill="#0d0d12" text-anchor="middle">Start Learning FREE → jvdesignstudio.co.uk</text>

</svg>
