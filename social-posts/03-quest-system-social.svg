<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Quest System & Social Features — Cooperative Gaming</title>

<!-- Background -->
<rect width="1080" height="1080" fill="#0d0d12"/>

<!-- Animated gradient accent -->
<defs>
  <linearGradient id="questGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F5A623" stop-opacity="0.3"/>
    <stop offset="100%" stop-color="#F5A623" stop-opacity="0"/>
  </linearGradient>
</defs>
<rect width="1080" height="1080" fill="url(#questGrad)"/>

<!-- Top accent line -->
<rect x="0" y="0" width="1080" height="4" fill="#F5A623"/>

<!-- Title -->
<text x="60" y="100" font-family="'Fredoka', sans-serif" font-size="56" font-weight="700" fill="#F5A623">Quest Board</text>
<text x="60" y="160" font-family="'Fredoka', sans-serif" font-size="56" font-weight="700" fill="#F0EAD6">Now Live</text>

<!-- Quest cards -->
<g transform="translate(60, 220)">
  <!-- Quest 1 -->
  <rect x="0" y="0" width="880" height="110" rx="12" fill="rgba(245, 166, 35, 0.12)" stroke="#F5A623" stroke-width="2"/>
  <text x="30" y="42" font-family="'Fredoka', sans-serif" font-size="20" font-weight="700" fill="#F0EAD6">⚔️ Master the Arcade</text>
  <text x="30" y="72" font-family="'Inter', sans-serif" font-size="13" fill="rgba(240, 234, 214, 0.7)">Complete 5 games and reach level 10</text>
  <rect x="740" y="35" width="110" height="40" rx="20" fill="rgba(245, 166, 35, 0.2)" stroke="#F5A623" stroke-width="1.5"/>
  <text x="795" y="58" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#F5A623" text-anchor="middle">+500 XP</text>

  <!-- Quest 2 -->
  <rect x="0" y="130" width="880" height="110" rx="12" fill="rgba(245, 166, 35, 0.12)" stroke="#F5A623" stroke-width="2"/>
  <text x="30" y="172" font-family="'Fredoka', sans-serif" font-size="20" font-weight="700" fill="#F0EAD6">🏆 Collector's Pride</text>
  <text x="30" y="202" font-family="'Inter', sans-serif" font-size="13" fill="rgba(240, 234, 214, 0.7)">Unlock 3 achievement badges</text>
  <rect x="740" y="165" width="110" height="40" rx="20" fill="rgba(245, 166, 35, 0.2)" stroke="#F5A623" stroke-width="1.5"/>
  <text x="795" y="188" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#F5A623" text-anchor="middle">+300 XP</text>

  <!-- Quest 3 -->
  <rect x="0" y="260" width="880" height="110" rx="12" fill="rgba(245, 166, 35, 0.12)" stroke="#F5A623" stroke-width="2"/>
  <text x="30" y="302" font-family="'Fredoka', sans-serif" font-size="20" font-weight="700" fill="#F0EAD6">🎓 Learn Something New</text>
  <text x="30" y="332" font-family="'Inter', sans-serif" font-size="13" fill="rgba(240, 234, 214, 0.7)">Complete 3 interactive workshops</text>
  <rect x="740" y="295" width="110" height="40" rx="20" fill="rgba(245, 166, 35, 0.2)" stroke="#F5A623" stroke-width="1.5"/>
  <text x="795" y="318" font-family="'Inter', sans-serif" font-size="12" font-weight="600" fill="#F5A623" text-anchor="middle">+400 XP</text>
</g>

<!-- Social Features Section -->
<text x="60" y="600" font-family="'Fredoka', sans-serif" font-size="28" font-weight="700" fill="#F5A623">SOCIAL FEATURES</text>

<!-- Feature cards -->
<g transform="translate(60, 640)">
  <!-- Feature 1: Leaderboards -->
  <rect x="0" y="0" width="410" height="140" rx="16" fill="rgba(245, 166, 35, 0.08)" stroke="rgba(245, 166, 35, 0.3)" stroke-width="2"/>
  <text x="30" y="45" font-family="sans-serif" font-size="44">🏅</text>
  <text x="100" y="47" font-family="'Fredoka', sans-serif" font-size="20" font-weight="700" fill="#F0EAD6">Leaderboards</text>
  <text x="30" y="90" font-family="'Inter', sans-serif" font-size="12" fill="rgba(240, 234, 214, 0.6)">Compete with friends</text>
  <text x="30" y="110" font-family="'Inter', sans-serif" font-size="12" fill="rgba(240, 234, 214, 0.6)">See top scores</text>

  <!-- Feature 2: Achievements -->
  <rect x="450" y="0" width="410" height="140" rx="16" fill="rgba(245, 166, 35, 0.08)" stroke="rgba(245, 166, 35, 0.3)" stroke-width="2"/>
  <text x="480" y="45" font-family="sans-serif" font-size="44">🎖️</text>
  <text x="550" y="47" font-family="'Fredoka', sans-serif" font-size="20" font-weight="700" fill="#F0EAD6">Achievements</text>
  <text x="480" y="90" font-family="'Inter', sans-serif" font-size="12" fill="rgba(240, 234, 214, 0.6)">Unlock badges</text>
  <text x="480" y="110" font-family="'Inter', sans-serif" font-size="12" fill="rgba(240, 234, 214, 0.6)">Show off progress</text>
</g>

<!-- Stats row -->
<g transform="translate(60, 850)">
  <!-- Stat 1: Quest board -->
  <rect x="0" y="0" width="280" height="80" rx="12" fill="rgba(245, 166, 35, 0.08)" stroke="rgba(245, 166, 35, 0.2)" stroke-width="1"/>
  <text x="140" y="30" font-family="'Fredoka', sans-serif" font-size="32" font-weight="700" fill="#F5A623" text-anchor="middle">8</text>
  <text x="140" y="60" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#F0EAD6" text-anchor="middle">Available Quests</text>

  <!-- Stat 2: Leaderboards -->
  <rect x="320" y="0" width="280" height="80" rx="12" fill="rgba(245, 166, 35, 0.08)" stroke="rgba(245, 166, 35, 0.2)" stroke-width="1"/>
  <text x="460" y="30" font-family="'Fredoka', sans-serif" font-size="32" font-weight="700" fill="#F5A623" text-anchor="middle">29</text>
  <text x="460" y="60" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#F0EAD6" text-anchor="middle">Games to Compete</text>

  <!-- Stat 3: Social -->
  <rect x="640" y="0" width="280" height="80" rx="12" fill="rgba(245, 166, 35, 0.08)" stroke="rgba(245, 166, 35, 0.2)" stroke-width="1"/>
  <text x="780" y="30" font-family="'Fredoka', sans-serif" font-size="32" font-weight="700" fill="#F5A623" text-anchor="middle">∞</text>
  <text x="780" y="60" font-family="'Inter', sans-serif" font-size="13" font-weight="600" fill="#F0EAD6" text-anchor="middle">Play with Friends</text>
</g>

</svg>
