<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Cozy Cafe — A Year at the Cafe, an 8-Chapter Story Update</title>

<!-- Background -->
<rect width="1080" height="1080" fill="#0d0d12"/>
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#BC4749" stop-opacity="0.32"/>
    <stop offset="55%" stop-color="#BC4749" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#BC4749"/>
    <stop offset="100%" stop-color="#D98C5F"/>
  </linearGradient>
</defs>
<rect width="1080" height="1080" fill="url(#bgGrad)"/>
<rect x="0" y="0" width="1080" height="6" fill="#BC4749"/>

<!-- Kicker -->
<text x="60" y="96" font-family="'Inter', sans-serif" font-size="22" font-weight="800" letter-spacing="3" fill="#BC4749">GAME UPDATE · COZY CAFE MATCH</text>

<!-- Headline -->
<text x="60" y="178" font-family="'Fredoka', sans-serif" font-size="70" font-weight="700" fill="#F0EAD6">A Year at</text>
<text x="60" y="252" font-family="'Fredoka', sans-serif" font-size="70" font-weight="700" fill="#D98C5F">the Cafe</text>
<text x="60" y="312" font-family="'Inter', sans-serif" font-size="26" font-weight="500" fill="rgba(240,234,214,0.75)">An 8-chapter story that unfolds while you match. Meet the crew.</text>

<!-- Chapter dots -->
<g transform="translate(60, 360)">
  <rect width="960" height="150" rx="20" fill="rgba(217,140,95,0.08)" stroke="rgba(217,140,95,0.3)" stroke-width="2"/>
  <text x="40" y="52" font-family="'Fredoka', sans-serif" font-size="24" font-weight="700" fill="#D98C5F">A year, four seasons, eight chapters</text>
  <g transform="translate(40, 88)" font-family="sans-serif" font-size="40" text-anchor="middle">
    <text x="30">🌱</text><text x="145">🌸</text><text x="260">☀️</text><text x="375">🌻</text>
    <text x="490">🍂</text><text x="605">🍁</text><text x="720">❄️</text><text x="835">✨</text>
  </g>
</g>

<!-- Feature grid: 4 tiles -->
<g transform="translate(60, 534)">
  <g transform="translate(0,0)">
    <rect width="460" height="112" rx="18" fill="rgba(240,234,214,0.05)" stroke="rgba(240,234,214,0.12)" stroke-width="2"/>
    <text x="40" y="66" font-family="sans-serif" font-size="40">🌙</text>
    <text x="100" y="56" font-family="'Fredoka', sans-serif" font-size="24" font-weight="700" fill="#F0EAD6">Cosy night mode</text>
    <text x="100" y="88" font-family="'Inter', sans-serif" font-size="18" fill="rgba(240,234,214,0.7)">A warmer palette for evenings.</text>
  </g>
  <g transform="translate(500,0)">
    <rect width="460" height="112" rx="18" fill="rgba(240,234,214,0.05)" stroke="rgba(240,234,214,0.12)" stroke-width="2"/>
    <text x="40" y="66" font-family="sans-serif" font-size="40">⚡</text>
    <text x="100" y="56" font-family="'Fredoka', sans-serif" font-size="24" font-weight="700" fill="#F0EAD6">Power-up boosters</text>
    <text x="100" y="88" font-family="'Inter', sans-serif" font-size="18" fill="rgba(240,234,214,0.7)">Daily &amp; weekly challenges too.</text>
  </g>
  <g transform="translate(0,126)">
    <rect width="460" height="112" rx="18" fill="rgba(240,234,214,0.05)" stroke="rgba(240,234,214,0.12)" stroke-width="2"/>
    <text x="40" y="66" font-family="sans-serif" font-size="40">🐱</text>
    <text x="100" y="56" font-family="'Fredoka', sans-serif" font-size="24" font-weight="700" fill="#F0EAD6">Hidden secrets</text>
    <text x="100" y="88" font-family="'Inter', sans-serif" font-size="18" fill="rgba(240,234,214,0.7)">There's a cat you can pet.</text>
  </g>
  <g transform="translate(500,126)">
    <rect width="460" height="112" rx="18" fill="rgba(240,234,214,0.05)" stroke="rgba(240,234,214,0.12)" stroke-width="2"/>
    <text x="40" y="66" font-family="sans-serif" font-size="40">🎭</text>
    <text x="100" y="56" font-family="'Fredoka', sans-serif" font-size="24" font-weight="700" fill="#F0EAD6">A named crew</text>
    <text x="100" y="88" font-family="'Inter', sans-serif" font-size="18" fill="rgba(240,234,214,0.7)">Each with their own quests.</text>
  </g>
</g>

<!-- Feature strip -->
<g transform="translate(60, 800)">
  <rect width="960" height="108" rx="18" fill="rgba(188,71,73,0.08)" stroke="rgba(188,71,73,0.3)" stroke-width="2"/>
  <text x="40" y="50" font-family="'Fredoka', sans-serif" font-size="28" font-weight="700" fill="#BC4749">☕ Free in your browser, soon on your phone</text>
  <text x="40" y="86" font-family="'Inter', sans-serif" font-size="20" fill="rgba(240,234,214,0.8)">Cozy Cafe is one of the six games becoming a mobile app.</text>
</g>

<!-- CTA -->
<rect x="60" y="952" width="960" height="68" rx="34" fill="url(#ctaGrad)"/>
<text x="540" y="995" font-family="'Fredoka', sans-serif" font-size="24" font-weight="700" fill="#0d0d12" text-anchor="middle">Play the story FREE → jvdesignstudio.co.uk</text>
</svg>
