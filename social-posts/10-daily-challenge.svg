<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Daily Challenge + Streaks — A Reason to Come Back Tomorrow</title>

<!-- Background -->
<rect width="1080" height="1080" fill="#0d0d12"/>
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#F2A541" stop-opacity="0.30"/>
    <stop offset="55%" stop-color="#F2A541" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#F2A541"/>
    <stop offset="100%" stop-color="#BC4749"/>
  </linearGradient>
</defs>
<rect width="1080" height="1080" fill="url(#bgGrad)"/>
<rect x="0" y="0" width="1080" height="6" fill="#F2A541"/>

<!-- Kicker -->
<text x="60" y="96" font-family="'Inter', sans-serif" font-size="22" font-weight="800" letter-spacing="3" fill="#F2A541">NEW ON JVDESIGNSTUDIO</text>

<!-- Headline -->
<text x="60" y="178" font-family="'Fredoka', sans-serif" font-size="72" font-weight="700" fill="#F0EAD6">Daily Challenge</text>
<text x="60" y="254" font-family="'Fredoka', sans-serif" font-size="72" font-weight="700" fill="#F2A541">+ Streaks</text>
<text x="60" y="314" font-family="'Inter', sans-serif" font-size="26" font-weight="500" fill="rgba(240,234,214,0.75)">One fresh pick every day. A flame that grows the more you show up.</text>

<!-- Big streak showpiece -->
<g transform="translate(60, 366)">
  <rect width="460" height="340" rx="24" fill="rgba(242,165,65,0.10)" stroke="rgba(242,165,65,0.4)" stroke-width="2"/>
  <text x="230" y="150" font-family="sans-serif" font-size="120" text-anchor="middle">🔥</text>
  <text x="230" y="250" font-family="'Fredoka', sans-serif" font-size="88" font-weight="700" fill="#F2A541" text-anchor="middle">5</text>
  <text x="230" y="300" font-family="'Inter', sans-serif" font-size="22" font-weight="700" letter-spacing="2" fill="rgba(240,234,214,0.7)" text-anchor="middle">DAY STREAK</text>
</g>

<!-- Bullet list -->
<g transform="translate(560, 366)">
  <g transform="translate(0,0)">
    <rect width="460" height="104" rx="18" fill="rgba(240,234,214,0.05)" stroke="rgba(240,234,214,0.12)" stroke-width="2"/>
    <text x="34" y="60" font-family="sans-serif" font-size="38">🎯</text>
    <text x="92" y="52" font-family="'Fredoka', sans-serif" font-size="24" font-weight="700" fill="#F0EAD6">One pick a day</text>
    <text x="92" y="82" font-family="'Inter', sans-serif" font-size="19" fill="rgba(240,234,214,0.7)">A game, a lesson or a tool to try.</text>
  </g>
  <g transform="translate(0,118)">
    <rect width="460" height="104" rx="18" fill="rgba(240,234,214,0.05)" stroke="rgba(240,234,214,0.12)" stroke-width="2"/>
    <text x="34" y="60" font-family="sans-serif" font-size="38">🏆</text>
    <text x="92" y="52" font-family="'Fredoka', sans-serif" font-size="24" font-weight="700" fill="#F0EAD6">Keep the flame</text>
    <text x="92" y="82" font-family="'Inter', sans-serif" font-size="19" fill="rgba(240,234,214,0.7)">Show up on consecutive days.</text>
  </g>
  <g transform="translate(0,236)">
    <rect width="460" height="104" rx="18" fill="rgba(240,234,214,0.05)" stroke="rgba(240,234,214,0.12)" stroke-width="2"/>
    <text x="34" y="60" font-family="sans-serif" font-size="38">🌿</text>
    <text x="92" y="52" font-family="'Fredoka', sans-serif" font-size="24" font-weight="700" fill="#F0EAD6">Gentle, not pushy</text>
    <text x="92" y="82" font-family="'Inter', sans-serif" font-size="19" fill="rgba(240,234,214,0.7)">No punishment for taking a break.</text>
  </g>
</g>

<!-- Feature strip -->
<g transform="translate(60, 776)">
  <rect width="960" height="132" rx="18" fill="rgba(242,165,65,0.08)" stroke="rgba(242,165,65,0.3)" stroke-width="2"/>
  <text x="40" y="58" font-family="'Fredoka', sans-serif" font-size="30" font-weight="700" fill="#F2A541">✦ Live on Games, Arcade &amp; Learn</text>
  <text x="40" y="100" font-family="'Inter', sans-serif" font-size="21" fill="rgba(240,234,214,0.8)">A warmer front door, everything behind it is still free.</text>
</g>

<!-- CTA -->
<rect x="60" y="952" width="960" height="68" rx="34" fill="url(#ctaGrad)"/>
<text x="540" y="995" font-family="'Fredoka', sans-serif" font-size="24" font-weight="700" fill="#0d0d12" text-anchor="middle">Play today's pick → jvdesignstudio.co.uk</text>
</svg>
