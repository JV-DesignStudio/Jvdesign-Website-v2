<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Sky High Squirt — now with XP and achievements</title>
<defs>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#0d0d12" stop-opacity="1"/>
    <stop offset="38%" stop-color="#0d0d12" stop-opacity="1"/>
    <stop offset="68%" stop-color="#0d0d12" stop-opacity="0.55"/>
    <stop offset="100%" stop-color="#0d0d12" stop-opacity="0"/>
  </linearGradient>
  <clipPath id="imgclip"><rect x="0" y="0" width="1200" height="630"/></clipPath>
</defs>

<rect width="1200" height="630" fill="#0d0d12"/>
<g clip-path="url(#imgclip)">
  <image href="https://jvdesignstudio.co.uk/SkyHighCover.png" x="380" y="0" width="820" height="630" preserveAspectRatio="xMidYMid slice"/>
  <rect x="380" y="0" width="820" height="630" fill="url(#fade)"/>
</g>

<text x="56" y="62" font-family="'Fredoka','Segoe UI',sans-serif" font-size="22" font-weight="700" fill="#F0EAD6">JVDesignStudio</text>
<rect x="56" y="74" width="40" height="3" rx="1.5" fill="#FFB6C1"/>

<g transform="translate(56,110)">
  <rect width="200" height="34" rx="17" fill="rgba(255,182,193,0.18)" stroke="#FFB6C1"/>
  <text x="100" y="22" font-family="-apple-system,sans-serif" font-size="13" font-weight="700" fill="#FFB6C1" text-anchor="middle" letter-spacing="0.5">★ NEW PROGRESSION</text>
</g>

<text x="56" y="220" font-family="'Fredoka','Segoe UI',sans-serif" font-size="56" font-weight="800" fill="#ffffff">Sky High</text>
<text x="56" y="282" font-family="'Fredoka','Segoe UI',sans-serif" font-size="56" font-weight="800" fill="#ffffff">Squirt</text>

<text x="56" y="328" font-family="-apple-system,sans-serif" font-size="20" fill="rgba(255,255,255,0.6)">Tilt, bounce, climb — height now</text>
<text x="56" y="356" font-family="-apple-system,sans-serif" font-size="20" fill="rgba(255,255,255,0.6)">converts straight to XP.</text>

<g transform="translate(56,395)" font-family="-apple-system,sans-serif" font-size="13" font-weight="700">
  <rect width="64" height="30" rx="15" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
  <text x="32" y="20" text-anchor="middle" fill="rgba(255,255,255,0.75)">XP</text>
  <rect x="74" width="140" height="30" rx="15" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
  <text x="144" y="20" text-anchor="middle" fill="rgba(255,255,255,0.75)">Achievements</text>
  <rect x="224" width="110" height="30" rx="15" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.15)"/>
  <text x="279" y="20" text-anchor="middle" fill="rgba(255,255,255,0.75)">Unlocks</text>
</g>

<g transform="translate(56,520)">
