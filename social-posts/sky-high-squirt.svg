  <text x="115" y="32" font-family="'Fredoka',sans-serif" font-size="18" font-weight="700" fill="#08080c" text-anchor="middle">Play Free →</text>
  <text x="250" y="32" font-family="-apple-system,sans-serif" font-size="17" fill="rgba(255,255,255,0.55)">jvdesignstudio.co.uk/games</text>
