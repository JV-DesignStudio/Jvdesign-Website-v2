<svg viewBox="0 0 1080 1080" xmlns="http://www.w3.org/2000/svg" role="img">
<title>The Studio Goes Mobile — Six Free Apps in the Making</title>

<!-- Background -->
<rect width="1080" height="1080" fill="#0d0d12"/>
<defs>
  <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#BC4749" stop-opacity="0.30"/>
    <stop offset="55%" stop-color="#BC4749" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="ctaGrad" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#BC4749"/>
    <stop offset="100%" stop-color="#70A3A7"/>
  </linearGradient>
</defs>
<rect width="1080" height="1080" fill="url(#bgGrad)"/>
<rect x="0" y="0" width="1080" height="6" fill="#BC4749"/>

<!-- Kicker -->
<text x="60" y="96" font-family="'Inter', sans-serif" font-size="22" font-weight="800" letter-spacing="3" fill="#BC4749">NEW ON JVDESIGNSTUDIO</text>

<!-- Headline -->
<text x="60" y="178" font-family="'Fredoka', sans-serif" font-size="72" font-weight="700" fill="#F0EAD6">The Studio</text>
<text x="60" y="254" font-family="'Fredoka', sans-serif" font-size="72" font-weight="700" fill="#70A3A7">Goes Mobile</text>
<text x="60" y="314" font-family="'Inter', sans-serif" font-size="26" font-weight="500" fill="rgba(240,234,214,0.75)">Six of our games &amp; tools are becoming real installable apps.</text>

<!-- App grid: 6 tiles -->
<g transform="translate(60, 362)">
  <!-- row 1 -->
  <g transform="translate(0,0)">
    <rect width="300" height="150" rx="20" fill="rgba(188,71,73,0.10)" stroke="#BC4749" stroke-width="2"/>
    <text x="150" y="74" font-family="sans-serif" font-size="46" text-anchor="middle">🍪</text>
    <text x="150" y="120" font-family="'Inter', sans-serif" font-size="19" font-weight="700" fill="#F0EAD6" text-anchor="middle">Biscuit Tin</text>
  </g>
  <g transform="translate(330,0)">
    <rect width="300" height="150" rx="20" fill="rgba(112,163,167,0.10)" stroke="#70A3A7" stroke-width="2"/>
    <text x="150" y="74" font-family="sans-serif" font-size="46" text-anchor="middle">☕</text>
    <text x="150" y="120" font-family="'Inter', sans-serif" font-size="19" font-weight="700" fill="#F0EAD6" text-anchor="middle">Cozy Cafe</text>
  </g>
  <g transform="translate(660,0)">
    <rect width="300" height="150" rx="20" fill="rgba(165,131,206,0.10)" stroke="#A583CE" stroke-width="2"/>
    <text x="150" y="74" font-family="sans-serif" font-size="46" text-anchor="middle">🕹️</text>
    <text x="150" y="120" font-family="'Inter', sans-serif" font-size="19" font-weight="700" fill="#F0EAD6" text-anchor="middle">JVDS Arcade</text>
  </g>
  <!-- row 2 -->
  <g transform="translate(0,172)">
    <rect width="300" height="150" rx="20" fill="rgba(99,199,255,0.10)" stroke="#63c7ff" stroke-width="2"/>
    <text x="150" y="74" font-family="sans-serif" font-size="46" text-anchor="middle">💦</text>
    <text x="150" y="120" font-family="'Inter', sans-serif" font-size="19" font-weight="700" fill="#F0EAD6" text-anchor="middle">Sky High Squirt</text>
  </g>
  <g transform="translate(330,172)">
    <rect width="300" height="150" rx="20" fill="rgba(242,165,65,0.10)" stroke="#F2A541" stroke-width="2"/>
    <text x="150" y="74" font-family="sans-serif" font-size="46" text-anchor="middle">🏮</text>
    <text x="150" y="120" font-family="'Inter', sans-serif" font-size="19" font-weight="700" fill="#F0EAD6" text-anchor="middle">Pocket Crew</text>
  </g>
  <g transform="translate(660,172)">
    <rect width="300" height="150" rx="20" fill="rgba(107,203,119,0.10)" stroke="#6BCB77" stroke-width="2"/>
    <text x="150" y="74" font-family="sans-serif" font-size="46" text-anchor="middle">🛠️</text>
    <text x="150" y="120" font-family="'Inter', sans-serif" font-size="19" font-weight="700" fill="#F0EAD6" text-anchor="middle">Game Maker</text>
  </g>
</g>

<!-- Feature strip -->
<g transform="translate(60, 776)">
  <rect width="960" height="132" rx="18" fill="rgba(112,163,167,0.08)" stroke="rgba(112,163,167,0.3)" stroke-width="2"/>
  <text x="40" y="58" font-family="'Fredoka', sans-serif" font-size="30" font-weight="700" fill="#70A3A7">📴 Free, and playable offline</text>
  <text x="40" y="100" font-family="'Inter', sans-serif" font-size="21" fill="rgba(240,234,214,0.8)">Saves on your device, works with no signal. Coming to Google Play.</text>
</g>

<!-- CTA -->
<rect x="60" y="952" width="960" height="68" rx="34" fill="url(#ctaGrad)"/>
<text x="540" y="995" font-family="'Fredoka', sans-serif" font-size="24" font-weight="700" fill="#0d0d12" text-anchor="middle">Follow along → jvdesignstudio.co.uk</text>
</svg>
