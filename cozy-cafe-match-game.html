<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FBF4E8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cozy Cafe">
<title>Cozy Cafe Match</title>
<meta name="description" content="A cozy match-3 puzzle game. Match snacks, fill cravings, no rush.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,700;9..144,900&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --cream:        #FBF4E8;
    --cream-deep:  #F5E9D3;
    --milk:        #FFFDF8;
    --rose:        #F4B6C2;
    --rose-deep:   #E48BA0;
    --mint:        #B8DDC8;
    --mint-deep:   #6FB89A;
    --cocoa:       #4A3528;
    --cocoa-soft:  #6B4F3E;
    --sun:         #F5C76A;
    --lavender:    #C9B8E0;

    --scene-morning:   linear-gradient(180deg, #FFE8D6 0%, #F5C76A 50%, #E8B894 100%);
    --scene-afternoon: linear-gradient(180deg, #F5E0D8 0%, #F4B6C2 50%, #E8C4A8 100%);
    --scene-evening:   linear-gradient(180deg, #C9B8E0 0%, #E48BA0 50%, #6B4F3E 100%);

    --shadow-soft:   0 4px 16px rgba(74, 53, 40, 0.08);
    --shadow-card:   0 8px 28px rgba(74, 53, 40, 0.14);
    --shadow-tile:   0 3px 8px rgba(74, 53, 40, 0.18);

    --safe-top:    env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  html, body {
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
  }

  body {
    font-family: 'Nunito', system-ui, sans-serif;
    color: var(--cocoa);
    background: var(--cream);
    -webkit-user-select: none;
    user-select: none;
    background-image:
      radial-gradient(circle at 20% 30%, rgba(244, 182, 194, 0.10) 0%, transparent 45%),
      radial-gradient(circle at 80% 70%, rgba(184, 221, 200, 0.10) 0%, transparent 45%);
    touch-action: manipulation;
  }

  .app {
    height: 100vh;
    height: 100dvh;
    max-width: 540px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding: calc(var(--safe-top) + 8px) 12px calc(var(--safe-bottom) + 8px);
    position: relative;
  }

  /* TOP BAR */
  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 6px 4px 10px;
    flex-shrink: 0;
  }
  .brand {
    font-family: 'Fraunces', serif;
    font-weight: 900;
    font-size: 22px;
    line-height: 1;
    letter-spacing: -0.02em;
  }
  .brand em { font-style: italic; font-weight: 400; color: var(--rose-deep); }
  .topbar-stats { display: flex; gap: 6px; }
  .stat-pill {
    background: var(--milk);
    border: 2px solid var(--cream-deep);
    padding: 5px 11px;
    border-radius: 100px;
    font-size: 12px;
    font-weight: 800;
    display: flex;
    align-items: center;
    gap: 4px;
    box-shadow: var(--shadow-soft);
  }

  /* GUEST HUD */
  .guest-hud {
    background: var(--milk);
    border: 2px dashed var(--cream-deep);
    border-radius: 18px;
    padding: 12px 14px;
    margin-bottom: 10px;
    box-shadow: var(--shadow-soft);
    flex-shrink: 0;
  }
  .guest-row { display: flex; align-items: center; gap: 12px; }
  .guest-avatar {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    background: var(--cream-deep);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    flex-shrink: 0;
    border: 3px solid var(--rose);
    transition: border-color 0.4s ease;
    position: relative;
  }
  .guest-avatar.happy { animation: bounce 0.6s ease; border-color: var(--mint-deep); }
  .guest-avatar.sad   { animation: shake 0.4s ease; }
  .guest-hat {
    position: absolute;
    top: -10px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 20px;
    pointer-events: none;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    30%      { transform: translateY(-8px) scale(1.1); }
    60%      { transform: translateY(0) scale(1); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25%      { transform: translateX(-4px) rotate(-3deg); }
    75%      { transform: translateX(4px) rotate(3deg); }
  }
  .guest-info { flex: 1; min-width: 0; }
  .guest-name { font-family: 'Fraunces', serif; font-weight: 700; font-size: 15px; line-height: 1.1; }
  .guest-craving { font-size: 12px; color: var(--cocoa-soft); margin-top: 2px; }
  .guest-craving strong { color: var(--cocoa); }
  .craving-bar {
    margin-top: 6px;
    height: 7px;
    background: var(--cream-deep);
    border-radius: 100px;
    overflow: hidden;
  }
  .craving-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--rose), var(--sun));
    border-radius: 100px;
    width: 0%;
    transition: width 0.4s ease;
  }
  .order-board {
    display: flex;
    gap: 8px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--cream-deep);
    align-items: center;
    font-size: 11px;
    color: var(--cocoa-soft);
  }
  .order-label { font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
  .order-queue { display: flex; gap: 6px; flex: 1; }
  .order-chip {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    background: var(--cream);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 17px;
    border: 2px solid var(--cream-deep);
  }
  .streak-badge {
    background: var(--sun);
    color: var(--cocoa);
    padding: 3px 9px;
    border-radius: 100px;
    font-weight: 800;
    font-size: 11px;
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  .streak-badge.active { opacity: 1; }

  /* BOARD */
  .board-wrap {
    flex: 1;
    position: relative;
    border-radius: 22px;
    overflow: hidden;
    box-shadow: var(--shadow-card);
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .cafe-scene {
    position: absolute;
    inset: 0;
    background: var(--scene-afternoon);
    z-index: 0;
    transition: background 1.5s ease;
  }
  .cafe-scene.morning   { background: var(--scene-morning); }
  .cafe-scene.afternoon { background: var(--scene-afternoon); }
  .cafe-scene.evening   { background: var(--scene-evening); }
  .cafe-scene svg { width: 100%; height: 100%; display: block; }
  .sparkle-layer { position: absolute; inset: 0; pointer-events: none; z-index: 5; }
  .board {
    position: relative;
    z-index: 2;
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 3px;
    padding: 10px;
    background: rgba(251, 244, 232, 0.85);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border-radius: 18px;
    width: min(96%, 96vw);
    max-width: 480px;
    aspect-ratio: 1;
    touch-action: none;
  }
  .tile {
    position: relative;
    background: var(--milk);
    border-radius: 10px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: var(--shadow-tile);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
    aspect-ratio: 1;
  }
  .tile:hover { transform: translateY(-1px); }
  .tile.selected {
    transform: scale(1.08);
    box-shadow: 0 0 0 3px var(--rose-deep), var(--shadow-tile);
    z-index: 3;
  }
  .tile.matching { animation: pop 0.4s ease forwards; }
  .tile.falling { animation: fall 0.35s ease; }
  @keyframes pop {
    0%   { transform: scale(1); opacity: 1; }
    50%  { transform: scale(1.25) rotate(8deg); }
    100% { transform: scale(0); opacity: 0; }
  }
  @keyframes fall {
    0%   { transform: translateY(-30px); opacity: 0; }
    100% { transform: translateY(0); opacity: 1; }
  }
  .tile svg { width: 72%; height: 72%; pointer-events: none; }
  .tile * { pointer-events: none; }

  .tile.striped-h::before, .tile.striped-v::before {
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(90deg, transparent 0, transparent 4px, rgba(255,255,255,0.55) 4px, rgba(255,255,255,0.55) 6px);
    border-radius: 10px;
    pointer-events: none;
  }
  .tile.striped-v::before {
    background: repeating-linear-gradient(0deg, transparent 0, transparent 4px, rgba(255,255,255,0.55) 4px, rgba(255,255,255,0.55) 6px);
  }
  .tile.bomb::after {
    content: '✦';
    position: absolute;
    font-size: 22px;
    color: white;
    text-shadow: 0 0 4px rgba(0,0,0,0.4);
    pointer-events: none;
  }
  .tile.rainbow {
    background: conic-gradient(from 0deg, #F4B6C2, #F5C76A, #B8DDC8, #C9B8E0, #F4B6C2);
  }

  /* BOTTOM BAR */
  .bottombar {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    flex-shrink: 0;
  }
  .bb-btn {
    flex: 1;
    background: var(--milk);
    border: 2px solid var(--cream-deep);
    color: var(--cocoa);
    font-family: 'Nunito', sans-serif;
    font-weight: 700;
    font-size: 11px;
    padding: 10px 6px;
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.2s ease;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    box-shadow: var(--shadow-soft);
  }
  .bb-btn:active { transform: scale(0.96); }
  .bb-btn.active { background: var(--cocoa); color: var(--cream); border-color: var(--cocoa); }
  .bb-icon { font-size: 18px; line-height: 1; }

  /* TOAST */
  .toast {
    position: fixed;
    top: calc(var(--safe-top) + 16px);
    left: 50%;
    transform: translateX(-50%) translateY(-120px);
    background: var(--cocoa);
    color: var(--cream);
    padding: 12px 22px;
    border-radius: 100px;
    font-family: 'Fraunces', serif;
    font-weight: 700;
    font-size: 14px;
    box-shadow: var(--shadow-card);
    transition: transform 0.4s ease;
    z-index: 100;
    pointer-events: none;
    max-width: 88vw;
    text-align: center;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.achievement { background: var(--sun); color: var(--cocoa); }
  .toast.combo { background: var(--rose-deep); color: var(--cream); }

  /* MODAL */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(74, 53, 40, 0.5);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: 20px;
  }
  .modal-backdrop.show { display: flex; }
  .modal {
    background: var(--cream);
    border-radius: 24px;
    padding: 24px 22px;
    max-width: 420px;
    width: 100%;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: var(--shadow-card);
    border: 2px dashed var(--cream-deep);
  }
  .modal-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 18px;
  }
  .modal-title { font-family: 'Fraunces', serif; font-size: 24px; font-weight: 900; }
  .modal-title em { font-style: italic; color: var(--rose-deep); font-weight: 400; }
  .modal-close {
    background: var(--milk);
    border: 2px solid var(--cream-deep);
    width: 36px;
    height: 36px;
    border-radius: 50%;
    font-size: 18px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .achievement-list, .shop-list { display: flex; flex-direction: column; gap: 10px; }
  .ach-item, .shop-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: var(--milk);
    border-radius: 14px;
    border: 2px solid var(--cream-deep);
  }
  .ach-item.locked { opacity: 0.5; }
  .ach-item.unlocked { border-color: var(--mint-deep); }
  .ach-icon, .shop-icon {
    font-size: 28px;
    width: 44px;
    height: 44px;
    background: var(--cream);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  .ach-text { flex: 1; min-width: 0; }
  .ach-name { font-family: 'Fraunces', serif; font-weight: 700; font-size: 15px; }
  .ach-desc { font-size: 12px; color: var(--cocoa-soft); }
  .shop-buy {
    background: var(--cocoa);
    color: var(--cream);
    border: none;
    padding: 8px 14px;
    border-radius: 100px;
    font-family: 'Nunito', sans-serif;
    font-weight: 800;
    font-size: 12px;
    cursor: pointer;
  }
  .shop-buy:disabled { background: var(--cream-deep); color: var(--cocoa-soft); cursor: not-allowed; }
  .shop-buy.owned { background: var(--mint-deep); }
  .shop-buy.equipped { background: var(--rose-deep); }
</style>
</head>
<body>

<div class="app">

  <div class="topbar">
    <div class="brand">Cozy <em>Cafe</em></div>
    <div class="topbar-stats">
      <div class="stat-pill">🪙 <span id="coinCount">0</span></div>
      <div class="stat-pill">✨ <span id="happyCount">0</span></div>
    </div>
  </div>

  <div class="guest-hud">
    <div class="guest-row">
      <div class="guest-avatar" id="guestAvatar">
        <span id="guestEmoji">🦊</span>
        <span class="guest-hat" id="guestHat"></span>
      </div>
      <div class="guest-info">
        <div class="guest-name" id="guestName">The Fox</div>
        <div class="guest-craving" id="guestCraving">wants <strong>0 / 0</strong></div>
        <div class="craving-bar"><div class="craving-fill" id="cravingFill"></div></div>
      </div>
    </div>
    <div class="order-board">
      <span class="order-label">Next:</span>
      <div class="order-queue" id="orderQueue"></div>
      <span class="streak-badge" id="streakBadge">🔥 0</span>
    </div>
  </div>

  <div class="board-wrap">
    <div class="cafe-scene afternoon" id="cafeScene">
      <svg viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice">
        <rect x="40" y="50" width="120" height="140" rx="8" fill="#FFFDF8" opacity="0.5"/>
        <rect x="40" y="50" width="120" height="140" rx="8" fill="none" stroke="#4A3528" stroke-width="3" opacity="0.3"/>
        <line x1="100" y1="50" x2="100" y2="190" stroke="#4A3528" stroke-width="2" opacity="0.3"/>
        <line x1="40" y1="120" x2="160" y2="120" stroke="#4A3528" stroke-width="2" opacity="0.3"/>
        <line x1="240" y1="0" x2="240" y2="60" stroke="#4A3528" stroke-width="1.5" opacity="0.4"/>
        <circle cx="240" cy="75" r="14" fill="#F5C76A" opacity="0.7"/>
        <circle cx="240" cy="75" r="14" fill="none" stroke="#4A3528" stroke-width="1.5" opacity="0.4"/>
        <line x1="320" y1="0" x2="320" y2="40" stroke="#4A3528" stroke-width="1.5" opacity="0.4"/>
        <circle cx="320" cy="55" r="11" fill="#F4B6C2" opacity="0.7"/>
        <circle cx="320" cy="55" r="11" fill="none" stroke="#4A3528" stroke-width="1.5" opacity="0.4"/>
        <rect x="195" y="160" width="30" height="30" rx="4" fill="#D49B6F" opacity="0.6"/>
        <circle cx="200" cy="155" r="10" fill="#6FB89A" opacity="0.7"/>
        <circle cx="215" cy="150" r="12" fill="#6FB89A" opacity="0.7"/>
        <circle cx="225" cy="158" r="9"  fill="#6FB89A" opacity="0.7"/>
        <ellipse cx="80"  cy="320" rx="55" ry="10" fill="#4A3528" opacity="0.15"/>
        <rect x="55" y="280" width="50" height="40" rx="6" fill="#D49B6F" opacity="0.7"/>
        <rect x="68" y="265" width="24" height="18" rx="3" fill="#FFFDF8" opacity="0.85"/>
        <ellipse cx="320" cy="320" rx="55" ry="10" fill="#4A3528" opacity="0.15"/>
        <rect x="295" y="280" width="50" height="40" rx="6" fill="#D49B6F" opacity="0.7"/>
        <rect x="308" y="265" width="24" height="18" rx="3" fill="#F4B6C2" opacity="0.85"/>
      </svg>
    </div>
    <div class="board" id="board"></div>
    <div class="sparkle-layer" id="sparkleLayer"></div>
  </div>

  <div class="bottombar">
    <button class="bb-btn" id="audioBtn"><span class="bb-icon">🎵</span>Music</button>
    <button class="bb-btn" id="hapticBtn"><span class="bb-icon">📳</span>Haptic</button>
    <button class="bb-btn" id="shopBtn"><span class="bb-icon">🛍️</span>Shop</button>
    <button class="bb-btn" id="achBtn"><span class="bb-icon">🏆</span>Goals</button>
    <button class="bb-btn" id="resetBtn"><span class="bb-icon">↻</span>New</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-backdrop" id="achModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Little <em>Goals</em></div>
      <button class="modal-close" data-close>×</button>
    </div>
    <div class="achievement-list" id="achList"></div>
  </div>
</div>

<div class="modal-backdrop" id="shopModal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title">Cosy <em>Shop</em></div>
      <button class="modal-close" data-close>×</button>
    </div>
    <p style="font-size: 12px; color: var(--cocoa-soft); margin-bottom: 14px; font-style: italic;">
      Hats unlocked here also appear in Sky High Squirt.
    </p>
    <div class="shop-list" id="shopList"></div>
  </div>
</div>

<audio id="lofiAudio" loop preload="none"><source src="" type="audio/mpeg"></audio>

<script>
const GRID_SIZE = 8;
const TILE_TYPES = ['berry', 'strawb', 'algae', 'mush', 'marsh'];

const TILE_DATA = {
  berry:  { color: '#9B6BC4', shape: 'circle',  label: 'blueberries' },
  strawb: { color: '#E8617A', shape: 'heart',   label: 'strawberry tarts' },
  algae:  { color: '#6FB89A', shape: 'square',  label: 'algae crackers' },
  mush:   { color: '#D49B6F', shape: 'dome',    label: 'mushrooms' },
  marsh:  { color: '#F5C76A', shape: 'diamond', label: 'marshmallows' }
};

const GUESTS = [
  { id: 'fox',    name: 'The Fox',     emoji: '🦊', favourite: 'berry',  hated: 'algae' },
  { id: 'tiger',  name: 'The Tiger',   emoji: '🐯', favourite: 'strawb', hated: 'mush'  },
  { id: 'axo',    name: 'The Axolotl', emoji: '🌸', favourite: 'marsh',  hated: 'algae' },
  { id: 'turtle', name: 'The Turtle',  emoji: '🐢', favourite: 'algae',  hated: 'strawb'}
];

const ACHIEVEMENTS = [
  { id: 'first_match', name: 'First Bite',     desc: 'Make your first match',         icon: '🍓', check: v => v.stats.matches >= 1 },
  { id: 'first_serve', name: 'First Order Up', desc: 'Serve your first guest',        icon: '☕', check: v => v.stats.guests_served >= 1 },
  { id: 'served_10',   name: 'Cozy Regular',   desc: 'Serve 10 guests',               icon: '🌿', check: v => v.stats.guests_served >= 10 },
  { id: 'served_50',   name: 'Cafe Favourite', desc: 'Serve 50 guests',               icon: '🌷', check: v => v.stats.guests_served >= 50 },
  { id: 'matches_100', name: 'Snack Master',   desc: 'Match 100 tiles',               icon: '✨', check: v => v.stats.matches >= 100 },
  { id: 'combo_3',     name: 'Cascade!',       desc: 'Hit a 3x combo',                icon: '💫', check: v => v.stats.max_combo >= 3 },
  { id: 'combo_5',     name: 'Sparkle Storm',  desc: 'Hit a 5x combo',                icon: '🌟', check: v => v.stats.max_combo >= 5 },
  { id: 'streak_5',    name: 'Soft Streak',    desc: 'Serve 5 guests in a row clean', icon: '🔥', check: v => v.stats.max_streak >= 5 },
  { id: 'all_guests',  name: 'Full Family',    desc: 'Serve all four friends',        icon: '🏡', check: v => Object.keys(v.stats.guests_each || {}).length >= 4 },
  { id: 'coins_500',   name: 'Tip Jar',        desc: 'Earn 500 coins total',          icon: '🪙', check: v => v.stats.lifetime_coins >= 500 }
];

const SHOP_ITEMS = [
  { id: 'wizard_hat', name: 'Wizard Hat',   emoji: '🎩', price: 50  },
  { id: 'flower',     name: 'Flower Crown', emoji: '🌸', price: 80  },
  { id: 'party',      name: 'Party Hat',    emoji: '🎉', price: 100 },
  { id: 'crown',      name: 'Tiny Crown',   emoji: '👑', price: 150 },
  { id: 'chef',       name: 'Chef Toque',   emoji: '🍳', price: 200 }
];

const VAULT_KEY = 'jvds_player_vault';
const VAULT_SCHEMA = 2;

function defaultVault() {
  return {
    schema: VAULT_SCHEMA,
    coins: 0,
    happiness: 0,
    haptic: true,
    unlocked_items: [],
    equipped: {},
    achievements: [],
    stats: {
      matches: 0,
      guests_served: 0,
      max_combo: 0,
      max_streak: 0,
      lifetime_coins: 0,
      guests_each: {}
    }
  };
}

function loadVault() {
  try {
    const raw = localStorage.getItem(VAULT_KEY);
    if (!raw) return defaultVault();
    const v = JSON.parse(raw);
    if (!v.schema || v.schema < VAULT_SCHEMA) {
      const fresh = defaultVault();
      fresh.coins = v.coins || 0;
      fresh.happiness = v.happiness || 0;
      fresh.unlocked_items = v.unlocked_items || [];
      fresh.equipped = v.equipped || {};
      return fresh;
    }
    if (typeof v.haptic === 'undefined') v.haptic = true;
    if (!v.stats) v.stats = defaultVault().stats;
    if (!v.stats.guests_each) v.stats.guests_each = {};
    return v;
  } catch (e) { return defaultVault(); }
}

function saveVault() {
  try { localStorage.setItem(VAULT_KEY, JSON.stringify(vault)); }
  catch (e) {}
}

let vault = loadVault();
let board = [];
let selected = null;
let busy = false;
let currentGuest = null;
let guestQueue = [];
let cravingTarget = 0;
let cravingProgress = 0;
let comboCount = 0;
let currentStreak = 0;
let cleanServe = true;
let timeOfDay = 'afternoon';

const sleep = (ms) => new Promise(r => setTimeout(r, ms));
const $ = (id) => document.getElementById(id);

function buzz(ms = 15) {
  if (!vault.haptic) return;
  if (navigator.vibrate) navigator.vibrate(ms);
}

function randomTileType(exclude = []) {
  const choices = TILE_TYPES.filter(t => !exclude.includes(t));
  return choices[Math.floor(Math.random() * choices.length)];
}

function newCell(type, power = null) { return { type, power }; }

function createBoard() {
  board = [];
  for (let r = 0; r < GRID_SIZE; r++) {
    board[r] = [];
    for (let c = 0; c < GRID_SIZE; c++) {
      const exclude = [];
      if (c >= 2 && board[r][c-1].type === board[r][c-2].type) exclude.push(board[r][c-1].type);
      if (r >= 2 && board[r-1][c].type === board[r-2][c].type) exclude.push(board[r-1][c].type);
      board[r][c] = newCell(randomTileType(exclude));
    }
  }
  if (!hasAnyMove()) createBoard();
}

const boardEl = $('board');

function renderTileSVG(type) {
  const data = TILE_DATA[type];
  const c = data.color;
  switch (data.shape) {
    case 'circle':
      return `<svg viewBox="0 0 40 40"><circle cx="20" cy="20" r="15" fill="${c}"/><circle cx="15" cy="15" r="3" fill="white" opacity="0.6"/></svg>`;
    case 'heart':
      return `<svg viewBox="0 0 40 40"><path d="M20 33 C 8 25, 5 15, 12 10 C 16 8, 20 11, 20 14 C 20 11, 24 8, 28 10 C 35 15, 32 25, 20 33 Z" fill="${c}"/></svg>`;
    case 'square':
      return `<svg viewBox="0 0 40 40"><rect x="7" y="7" width="26" height="26" rx="5" fill="${c}"/><circle cx="14" cy="14" r="2" fill="white" opacity="0.5"/><circle cx="26" cy="20" r="2" fill="white" opacity="0.5"/><circle cx="18" cy="28" r="2" fill="white" opacity="0.5"/></svg>`;
    case 'dome':
      return `<svg viewBox="0 0 40 40"><path d="M8 26 Q 20 6, 32 26 Z" fill="${c}"/><rect x="14" y="26" width="12" height="6" rx="2" fill="${c}" opacity="0.7"/><circle cx="16" cy="18" r="2" fill="white" opacity="0.7"/><circle cx="24" cy="22" r="2" fill="white" opacity="0.7"/></svg>`;
    case 'diamond':
      return `<svg viewBox="0 0 40 40"><path d="M20 6 L 34 20 L 20 34 L 6 20 Z" fill="${c}"/><path d="M20 6 L 34 20 L 20 12 Z" fill="white" opacity="0.3"/></svg>`;
  }
}

function render() {
  boardEl.innerHTML = '';
  for (let r = 0; r < GRID_SIZE; r++) {
    for (let c = 0; c < GRID_SIZE; c++) {
      const cell = board[r][c];
      const tile = document.createElement('div');
      tile.className = 'tile';
      if (cell.power) tile.classList.add(cell.power);
      tile.dataset.r = r;
      tile.dataset.c = c;
      if (cell.power !== 'rainbow') tile.innerHTML = renderTileSVG(cell.type);
      if (selected && selected.r === r && selected.c === c) tile.classList.add('selected');
      boardEl.appendChild(tile);
    }
  }
}

let dragStart = null;

boardEl.addEventListener('pointerdown', (e) => {
  if (busy) return;
  const tileEl = e.target.closest('.tile');
  if (!tileEl) return;
  e.preventDefault();
  dragStart = {
    r: parseInt(tileEl.dataset.r),
    c: parseInt(tileEl.dataset.c),
    x: e.clientX, y: e.clientY,
    moved: false
  };
});

boardEl.addEventListener('pointermove', (e) => {
  if (!dragStart || busy) return;
  const dx = e.clientX - dragStart.x;
  const dy = e.clientY - dragStart.y;
  if (Math.hypot(dx, dy) < 18) return;
  dragStart.moved = true;
  let target;
  if (Math.abs(dx) > Math.abs(dy)) {
    target = { r: dragStart.r, c: dragStart.c + (dx > 0 ? 1 : -1) };
  } else {
    target = { r: dragStart.r + (dy > 0 ? 1 : -1), c: dragStart.c };
  }
  if (target.r >= 0 && target.r < GRID_SIZE && target.c >= 0 && target.c < GRID_SIZE) {
    const start = { r: dragStart.r, c: dragStart.c };
    dragStart = null;
    selected = null;
    attemptSwap(start, target);
  }
});

boardEl.addEventListener('pointerup', () => {
  if (!dragStart) return;
  if (!dragStart.moved && !busy) handleTap(dragStart.r, dragStart.c);
  dragStart = null;
});

boardEl.addEventListener('pointercancel', () => { dragStart = null; });

function handleTap(r, c) {
  if (!selected) { selected = { r, c }; render(); return; }
  if (selected.r === r && selected.c === c) { selected = null; render(); return; }
  const dr = Math.abs(selected.r - r);
  const dc = Math.abs(selected.c - c);
  if (dr + dc === 1) {
    const a = selected;
    selected = null;
    attemptSwap(a, { r, c });
  } else {
    selected = { r, c };
    render();
  }
}

async function attemptSwap(a, b) {
  busy = true;
  try {
    swapCells(a, b);
    render();
    await sleep(180);

    const ca = board[a.r][a.c], cb = board[b.r][b.c];
    if (ca.power === 'rainbow' || cb.power === 'rainbow') {
      const targetType = ca.power === 'rainbow' ? cb.type : ca.type;
      const matches = activateRainbow(a, b, targetType);
      comboCount = 0;
      await resolveMatches(matches);
      return;
    }

    const matches = findMatches();
    if (matches.length === 0) {
      swapCells(a, b);
      render();
      buzz(8);
      return;
    }
    comboCount = 0;
    await resolveMatches(matches);
  } catch (err) {
    console.error('swap failed:', err);
  } finally {
    busy = false;
  }
}

function swapCells(a, b) {
  const t = board[a.r][a.c];
  board[a.r][a.c] = board[b.r][b.c];
  board[b.r][b.c] = t;
}

function findMatches() {
  const runs = [];
  for (let r = 0; r < GRID_SIZE; r++) {
    let runStart = 0;
    for (let c = 1; c <= GRID_SIZE; c++) {
      if (c === GRID_SIZE || board[r][c].type !== board[r][runStart].type) {
        if (c - runStart >= 3) {
          const cells = [];
          for (let k = runStart; k < c; k++) cells.push({ r, c: k });
          runs.push({ cells, dir: 'h', length: c - runStart, type: board[r][runStart].type });
        }
        runStart = c;
      }
    }
  }
  for (let c = 0; c < GRID_SIZE; c++) {
    let runStart = 0;
    for (let r = 1; r <= GRID_SIZE; r++) {
      if (r === GRID_SIZE || board[r][c].type !== board[runStart][c].type) {
        if (r - runStart >= 3) {
          const cells = [];
          for (let k = runStart; k < r; k++) cells.push({ r: k, c });
          runs.push({ cells, dir: 'v', length: r - runStart, type: board[runStart][c].type });
        }
        runStart = r;
      }
    }
  }
  return runs;
}

function runsToCellSet(runs) {
  const set = new Set();
  for (const run of runs) {
    for (const cell of run.cells) set.add(`${cell.r},${cell.c}`);
  }
  return set;
}

function activateRainbow(a, b, targetType) {
  const cells = [];
  for (let r = 0; r < GRID_SIZE; r++) {
    for (let c = 0; c < GRID_SIZE; c++) {
      if (board[r][c].type === targetType) cells.push({ r, c });
    }
  }
  cells.push(a, b);
  return [{ cells, dir: 'rainbow', length: cells.length, type: targetType }];
}

async function resolveMatches(runs) {
  comboCount++;
  const cellSet = runsToCellSet(runs);
  const triggered = new Set([...cellSet]);
  let added = true;
  while (added) {
    added = false;
    for (const key of [...triggered]) {
      const [r, c] = key.split(',').map(Number);
      const cell = board[r][c];
      if (!cell || !cell.power) continue;
      const power = cell.power;
      board[r][c] = { ...cell, power: null };
      if (power === 'striped-h') {
        for (let cc = 0; cc < GRID_SIZE; cc++) {
          const k = `${r},${cc}`; if (!triggered.has(k)) { triggered.add(k); added = true; }
        }
      } else if (power === 'striped-v') {
        for (let rr = 0; rr < GRID_SIZE; rr++) {
          const k = `${rr},${c}`; if (!triggered.has(k)) { triggered.add(k); added = true; }
        }
      } else if (power === 'bomb') {
        for (let rr = Math.max(0, r-1); rr <= Math.min(GRID_SIZE-1, r+1); rr++) {
          for (let cc = Math.max(0, c-1); cc <= Math.min(GRID_SIZE-1, c+1); cc++) {
            const k = `${rr},${cc}`; if (!triggered.has(k)) { triggered.add(k); added = true; }
          }
        }
      }
    }
  }

  scoreMatches(triggered);

  const powerSpawns = [];
  for (const run of runs) {
    if (run.dir === 'rainbow') continue;
    const spawnCell = run.cells[Math.floor(run.cells.length / 2)];
    if (run.length >= 5) {
      powerSpawns.push({ r: spawnCell.r, c: spawnCell.c, power: 'rainbow', type: run.type });
    } else if (run.length === 4) {
      const power = run.dir === 'h' ? 'striped-h' : 'striped-v';
      powerSpawns.push({ r: spawnCell.r, c: spawnCell.c, power, type: run.type });
    }
  }

  triggered.forEach(key => {
    const [r, c] = key.split(',').map(Number);
    const idx = r * GRID_SIZE + c;
    const el = boardEl.children[idx];
    if (el) el.classList.add('matching');
  });
  buzz(20);
  await sleep(380);

  triggered.forEach(key => {
    const [r, c] = key.split(',').map(Number);
    board[r][c] = null;
  });

  for (const spawn of powerSpawns) {
    if (board[spawn.r][spawn.c] === null) {
      board[spawn.r][spawn.c] = newCell(spawn.type, spawn.power);
    }
  }

  for (let c = 0; c < GRID_SIZE; c++) {
    const col = [];
    for (let r = GRID_SIZE - 1; r >= 0; r--) {
      if (board[r][c] !== null) col.push(board[r][c]);
    }
    while (col.length < GRID_SIZE) col.push(newCell(randomTileType()));
    for (let r = GRID_SIZE - 1; r >= 0; r--) {
      board[r][c] = col[GRID_SIZE - 1 - r];
    }
  }
  render();
  [...boardEl.children].forEach(el => el.classList.add('falling'));
  await sleep(340);

  if (comboCount >= 2) {
    showToast(`Combo x${comboCount}! 💫`, 'combo');
  }

  const next = findMatches();
  if (next.length > 0) {
    await resolveMatches(next);
    return;
  }

  if (comboCount > vault.stats.max_combo) vault.stats.max_combo = comboCount;
  saveVault();
  checkAchievements();

  if (!hasAnyMove()) {
    showToast('No moves — reshuffling ✨');
    await sleep(800);
    do { createBoard(); } while (!hasAnyMove());
    render();
  }
}

function scoreMatches(triggered) {
  vault.stats.matches += triggered.size;

  let coinsEarned = 0;
  let cravingDelta = 0;

  triggered.forEach(key => {
    const [r, c] = key.split(',').map(Number);
    const cell = board[r][c];
    if (!cell) return;
    let coin = 1;
    if (currentGuest) {
      if (cell.type === currentGuest.favourite) {
        coin = 2;
        cravingDelta += 1;
      }
      if (cell.type === currentGuest.hated) {
        cleanServe = false;
        $('guestAvatar').classList.add('sad');
        setTimeout(() => $('guestAvatar').classList.remove('sad'), 500);
      }
    }
    coinsEarned += coin;
  });

  if (comboCount > 1) coinsEarned = Math.round(coinsEarned * (1 + (comboCount - 1) * 0.25));

  vault.coins += coinsEarned;
  vault.stats.lifetime_coins += coinsEarned;
  cravingProgress += cravingDelta;

  if (triggered.size >= 4) burstSparkles();
  if (currentGuest && cravingProgress >= cravingTarget) fulfilGuest();

  saveVault();
  updateHUD();
}

function fulfilGuest() {
  vault.happiness += 1;
  vault.stats.guests_served += 1;
  vault.stats.guests_each[currentGuest.id] = (vault.stats.guests_each[currentGuest.id] || 0) + 1;
  vault.coins += 10;
  vault.stats.lifetime_coins += 10;

  if (cleanServe) {
    currentStreak++;
    if (currentStreak > vault.stats.max_streak) vault.stats.max_streak = currentStreak;
    if (currentStreak >= 3) {
      const bonus = currentStreak * 5;
      vault.coins += bonus;
      vault.stats.lifetime_coins += bonus;
      showToast(`${currentGuest.name} happy! Streak ${currentStreak} → +${10 + bonus} 🪙`);
    } else {
      showToast(`${currentGuest.name} is happy! +10 🪙`);
    }
  } else {
    currentStreak = 0;
    showToast(`${currentGuest.name} is happy! +10 🪙`);
  }
  cleanServe = true;

  const cycle = vault.stats.guests_served % 15;
  let newTod = 'afternoon';
  if (cycle < 5) newTod = 'morning';
  else if (cycle < 10) newTod = 'afternoon';
  else newTod = 'evening';
  if (newTod !== timeOfDay) {
    timeOfDay = newTod;
    $('cafeScene').className = 'cafe-scene ' + timeOfDay;
  }

  $('guestAvatar').classList.add('happy');
  setTimeout(() => $('guestAvatar').classList.remove('happy'), 700);
  burstSparkles();

  saveVault();
  checkAchievements();
  setTimeout(nextGuest, 1300);
}

function refillQueue() {
  while (guestQueue.length < 3) {
    const last = guestQueue[guestQueue.length - 1] || currentGuest;
    const others = GUESTS.filter(g => !last || g.id !== last.id);
    guestQueue.push(others[Math.floor(Math.random() * others.length)]);
  }
}

function nextGuest() {
  refillQueue();
  currentGuest = guestQueue.shift();
  cravingTarget = 6 + Math.floor(Math.random() * 6);
  cravingProgress = 0;
  cleanServe = true;
  refillQueue();
  updateHUD();
}

function updateHUD() {
  if (!currentGuest) return;
  $('guestEmoji').textContent = currentGuest.emoji;
  $('guestName').textContent = currentGuest.name;
  const favLabel = TILE_DATA[currentGuest.favourite].label;
  $('guestCraving').innerHTML = `wants <strong>${cravingProgress} / ${cravingTarget}</strong> ${favLabel}`;
  $('cravingFill').style.width = Math.min(100, (cravingProgress / cravingTarget) * 100) + '%';
  $('coinCount').textContent = vault.coins;
  $('happyCount').textContent = vault.happiness;

  const q = $('orderQueue');
  q.innerHTML = '';
  guestQueue.slice(0, 2).forEach(g => {
    const chip = document.createElement('div');
    chip.className = 'order-chip';
    chip.textContent = g.emoji;
    q.appendChild(chip);
  });

  const sb = $('streakBadge');
  if (currentStreak >= 2) {
    sb.textContent = `🔥 ${currentStreak}`;
    sb.classList.add('active');
  } else {
    sb.classList.remove('active');
  }

  const hatItem = SHOP_ITEMS.find(i => i.id === vault.equipped.hat);
  $('guestHat').textContent = hatItem ? hatItem.emoji : '';
}

function hasAnyMove() {
  for (let r = 0; r < GRID_SIZE; r++) {
    for (let c = 0; c < GRID_SIZE; c++) {
      if (c < GRID_SIZE - 1) {
        swapCells({r,c}, {r, c: c+1});
        if (findMatches().length > 0) { swapCells({r,c}, {r, c: c+1}); return true; }
        swapCells({r,c}, {r, c: c+1});
      }
      if (r < GRID_SIZE - 1) {
        swapCells({r,c}, {r: r+1, c});
        if (findMatches().length > 0) { swapCells({r,c}, {r: r+1, c}); return true; }
        swapCells({r,c}, {r: r+1, c});
      }
    }
  }
  return false;
}

function checkAchievements() {
  for (const ach of ACHIEVEMENTS) {
    if (vault.achievements.includes(ach.id)) continue;
    if (ach.check(vault)) {
      vault.achievements.push(ach.id);
      saveVault();
      showToast(`${ach.icon} ${ach.name} unlocked!`, 'achievement');
      buzz(40);
    }
  }
}

function renderAchievements() {
  const list = $('achList');
  list.innerHTML = '';
  for (const ach of ACHIEVEMENTS) {
    const unlocked = vault.achievements.includes(ach.id);
    const item = document.createElement('div');
    item.className = 'ach-item ' + (unlocked ? 'unlocked' : 'locked');
    item.innerHTML = `
      <div class="ach-icon">${unlocked ? ach.icon : '🔒'}</div>
      <div class="ach-text">
        <div class="ach-name">${ach.name}</div>
        <div class="ach-desc">${ach.desc}</div>
      </div>
    `;
    list.appendChild(item);
  }
}

function renderShop() {
  const list = $('shopList');
  list.innerHTML = '';
  for (const item of SHOP_ITEMS) {
    const owned = vault.unlocked_items.includes(item.id);
    const equipped = vault.equipped.hat === item.id;
    const canAfford = vault.coins >= item.price;
    const row = document.createElement('div');
    row.className = 'shop-item';
    let btnLabel, btnClass = '', btnDisabled = '';
    if (equipped) { btnLabel = 'Equipped'; btnClass = 'equipped'; }
    else if (owned) { btnLabel = 'Wear'; btnClass = 'owned'; }
    else if (canAfford) { btnLabel = `${item.price} 🪙`; }
    else { btnLabel = `${item.price} 🪙`; btnDisabled = 'disabled'; }
    row.innerHTML = `
      <div class="shop-icon">${item.emoji}</div>
      <div class="ach-text">
        <div class="ach-name">${item.name}</div>
        <div class="ach-desc">${owned ? 'Owned' : 'Cosmetic hat'}</div>
      </div>
      <button class="shop-buy ${btnClass}" data-id="${item.id}" ${btnDisabled}>${btnLabel}</button>
    `;
    list.appendChild(row);
  }
  list.querySelectorAll('.shop-buy').forEach(btn => {
    btn.addEventListener('click', () => handleShopAction(btn.dataset.id));
  });
}

function handleShopAction(itemId) {
  const item = SHOP_ITEMS.find(i => i.id === itemId);
  if (!item) return;
  const owned = vault.unlocked_items.includes(itemId);
  const equipped = vault.equipped.hat === itemId;

  if (equipped) {
    delete vault.equipped.hat;
  } else if (owned) {
    vault.equipped.hat = itemId;
  } else if (vault.coins >= item.price) {
    vault.coins -= item.price;
    vault.unlocked_items.push(itemId);
    vault.equipped.hat = itemId;
    showToast(`${item.name} unlocked!`, 'achievement');
    buzz(30);
  }
  saveVault();
  renderShop();
  updateHUD();
}

function burstSparkles() {
  const layer = $('sparkleLayer');
  for (let i = 0; i < 12; i++) {
    const s = document.createElement('div');
    s.textContent = ['✨','⭐','💫','🌟'][Math.floor(Math.random()*4)];
    s.style.cssText = `
      position: absolute;
      left: ${20 + Math.random() * 60}%;
      top: ${20 + Math.random() * 60}%;
      font-size: ${16 + Math.random() * 14}px;
      animation: sparkleFloat 1.2s ease-out forwards;
      pointer-events: none;
    `;
    layer.appendChild(s);
    setTimeout(() => s.remove(), 1300);
  }
}

const sparkleStyle = document.createElement('style');
sparkleStyle.textContent = `
  @keyframes sparkleFloat {
    0%   { opacity: 0; transform: translateY(0) scale(0.5) rotate(0deg); }
    20%  { opacity: 1; }
    100% { opacity: 0; transform: translateY(-60px) scale(1.3) rotate(180deg); }
  }
`;
document.head.appendChild(sparkleStyle);

let toastTimer;
function showToast(msg, kind = '') {
  const t = $('toast');
  t.textContent = msg;
  t.className = 'toast show ' + kind;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 2400);
}

$('resetBtn').addEventListener('click', () => {
  if (busy) return;
  createBoard();
  render();
  showToast('Fresh board ✨');
});

const audioBtn = $('audioBtn');
const lofi = $('lofiAudio');
audioBtn.addEventListener('click', () => {
  if (audioBtn.classList.contains('active')) {
    lofi.pause();
    audioBtn.classList.remove('active');
  } else {
    lofi.play().catch(() => {});
    audioBtn.classList.add('active');
  }
});

const hapticBtn = $('hapticBtn');
if (vault.haptic) hapticBtn.classList.add('active');
hapticBtn.addEventListener('click', () => {
  vault.haptic = !vault.haptic;
  hapticBtn.classList.toggle('active', vault.haptic);
  saveVault();
  if (vault.haptic) buzz(30);
});

$('shopBtn').addEventListener('click', () => {
  renderShop();
  $('shopModal').classList.add('show');
});
$('achBtn').addEventListener('click', () => {
  renderAchievements();
  $('achModal').classList.add('show');
});
document.querySelectorAll('[data-close]').forEach(btn => {
  btn.addEventListener('click', (e) => {
    e.target.closest('.modal-backdrop').classList.remove('show');
  });
});
document.querySelectorAll('.modal-backdrop').forEach(bd => {
  bd.addEventListener('click', (e) => {
    if (e.target === bd) bd.classList.remove('show');
  });
});

function init() {
  createBoard();
  refillQueue();
  nextGuest();
  render();
  updateHUD();
  checkAchievements();
}
