<div id="empty" style="display:none;">

  <div class="btn-row">

<input type="file" id="fileIn" accept=".json,application/json" style="display:none;">
<div id="toast" style="position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel2);border:1px solid var(--accent);color:var(--accent2);padding:6px 16px;border-radius:8px;font-size:.72rem;z-index:900;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap;"></div>

<script>
// ══════════════════════════════════════════════════
// STATE
// ══════════════════════════════════════════════════
let nodes = [], chars = [], varsDef = [], storyName = 'Untitled Story';
let currentId = null;
let V = {};   // runtime variables (numeric internally; flags are 0/1)

const esc = s => String(s ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const safeColour = c => /^#[0-9a-f]{3,8}$/i.test(c||'') ? c : '#64748b';
const tagColour = t => { let h=0; for(let i=0;i<t.length;i++) h=(h*31+t.charCodeAt(i))%360; return `hsl(${h},65%,55%)`; };

function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.style.opacity=1;
  clearTimeout(t._t); t._t=setTimeout(()=>t.style.opacity=0,2400);
}

// ══════════════════════════════════════════════════
// LOADING (shared link hash OR local .json)
// ══════════════════════════════════════════════════
function decodePayload(b64url){
  let b64=b64url.replace(/-/g,'+').replace(/_/g,'/');
  while(b64.length%4) b64+='=';
  return decodeURIComponent(escape(atob(b64)));
}
function loadFromData(d){
  const nn=Array.isArray(d.nodes)?d.nodes:null;
  if(!nn||!nn.length) throw new Error('Story has no nodes.');
  storyName=d.meta?.name||d.title||'Untitled Story';
  chars=Array.isArray(d.characters)?d.characters:(Array.isArray(d.chars)?d.chars:[]);
  varsDef=Array.isArray(d.variables)?d.variables:(Array.isArray(d.vars)?d.vars:[]);
  nodes=nn.map(n=>({
    id:String(n.id), type:['start','dialogue','choice','end'].includes(n.type)?n.type:'dialogue',
    char:n.char||'Narrator', text:n.text||'', tag:n.tag||'', to:n.to||null,
    fx:Array.isArray(n.fx)?n.fx:[],
    choices:(Array.isArray(n.choices)?n.choices:[]).map(c=>({
      text:c.text||'', to:c.to||'', cond:c.cond||null, fx:Array.isArray(c.fx)?c.fx:[]
    }))
  }));
  document.getElementById('empty').style.display='none';
  document.getElementById('card').style.display='block';
  document.getElementById('stTitle').textContent=storyName;
  restart();
}
function boot(){
  const m=location.hash.match(/^#s=(.+)$/);
  if(m){
    try{
      const d=JSON.parse(decodePayload(m[1]));
      loadFromData(d);
      history.replaceState(null,'',location.pathname+location.search);
    }catch(e){
      showEmpty();
      showErr('That story link looks broken or was cut short. Ask for a fresh link, or open a story .json below.');
    }
  } else showEmpty();
}
function showEmpty(){ document.getElementById('empty').style.display='block'; document.getElementById('card').style.display='none'; }
function showErr(msg){ const b=document.getElementById('errBox'); b.textContent=msg; b.style.display='block'; }

document.getElementById('fileIn').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0];
  if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ loadFromData(JSON.parse(r.result)); }catch(err){ showErr('Could not read that file as a story.'); } };
  r.readAsText(f);
});
const dz=document.getElementById('dropzone');
dz.addEventListener('click',()=>document.getElementById('fileIn').click());
['dragover','dragenter'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.add('over');}));
['dragleave','drop'].forEach(ev=>dz.addEventListener(ev,e=>{e.preventDefault();dz.classList.remove('over');}));
dz.addEventListener('drop',e=>{
  const f=e.dataTransfer.files&&e.dataTransfer.files[0];
  if(!f) return;
  const r=new FileReader();
  r.onload=()=>{ try{ loadFromData(JSON.parse(r.result)); }catch(err){ showErr('Could not read that file as a story.'); } };
  r.readAsText(f);
});

// ══════════════════════════════════════════════════
// ENGINE
// ══════════════════════════════════════════════════
const find=id=>nodes.find(n=>n.id===id)||null;

function evalCond(c){
  if(!c||!c.v) return true;
  const cur=Number(V[c.v]??0), val=Number(c.val??0);
  switch(c.op){
    case 'true':return cur>=1; case 'false':return cur<1;
    case '==':return cur===val; case '!=':return cur!==val;
    case '>=':return cur>=val; case '<=':return cur<=val;
    case '>':return cur>val;   case '<':return cur<val;
    default:return true;
  }
}
function condLabel(c){
  if(!c||!c.v) return '';
  const sym={'true':'is set','false':'is not set','==':'==','!=':'!=','>=':'≥','<=':'≤','>':'>','<':'<'}[c.op]??'?';
  return sym.startsWith('is ') ? `${c.v} ${sym}` : `${c.v} ${sym} ${c.val}`;
}
function applyFx(list){
  (list||[]).forEach(f=>{
    if(!f||!f.v) return;
    const amt=Number(f.val??0);
    V[f.v]= f.op==='add' ? Number(V[f.v]??0)+amt : amt;
  });
}
const isFlag=name=>{ const d=varsDef.find(v=>v.name===name); return d?typeof d.start==='boolean':false; };

function restart(){
  V={};
  varsDef.forEach(v=>{ V[v.name]=typeof v.start==='boolean'?(v.start?1:0):Number(v.start||0); });
  const start=find((nodes.find(n=>n.type==='start')||nodes[0]||{}).id);
  if(start){ currentId=start.id; applyFx(start.fx); renderScene(); }
}

function go(toId){
  if(toId && find(toId)){ currentId=toId; applyFx(find(toId).fx); }
  else currentId=null;
  renderScene();
}
function pick(i){
  const n=find(currentId);
  if(!n||!n.choices[i]) return;
  applyFx(n.choices[i].fx);
  go(n.choices[i].to);
}

function varChips(){
  const keys=Object.keys(V);
  if(!keys.length) return '';
  return '<div class="pv-vars">'+keys.map(k=>{
    const flag=isFlag(k), on=Number(V[k])>=1;
    return `<span class="fx-chip" style="${flag&&!on?'opacity:.45;':''}">${flag?(on?'🚩 ':'· '):''}${esc(k)}${flag?'':': '+V[k]}</span>`;
  }).join('')+'</div>';
}

function renderScene(){
  const scene=document.getElementById('scene');
  const n=currentId?find(currentId):null;
  if(!n){ scene.innerHTML='<div class="sc-end">— The End —</div>'+varChips(); return; }

  const ch=chars.find(c=>c.name===n.char)||{colour:'#64748b',emoji:'✨',name:n.char||'?'};
  const avatar=ch.img?`<img src="${ch.img}" alt="">`:`<span class="emoji">${esc(ch.emoji)}</span>`;

  if(n.type==='end'){
    scene.innerHTML=`<div class="sc-end">${avatar} <br><br>"${esc(n.text||'The End.')}"<br><br>— The End —</div>${varChips()}`;
    return;
  }

  let choicesHTML='';
  if(n.type==='choice'&&n.choices.some(c=>c.text)){
    choicesHTML='<div class="sc-choices">'+n.choices.map((c,i)=>{
      if(!c.text) return '';
      const ok=evalCond(c.cond);
      if(ok&&c.to) return `<button class="sc-choice" onclick="pick(${i})">${esc(c.text)}</button>`;
      if(ok&&!c.to) return `<button class="sc-choice" disabled title="Writer forgot to connect this choice">🔒 ${esc(c.text)}</button>`;
      return `<button class="sc-choice" disabled title="Requires ${esc(condLabel(c.cond))}">🔒 ${esc(c.text)} <small>(${esc(condLabel(c.cond))})</small></button>`;
    }).join('')+'</div>';
  } else if(n.to&&find(n.to)){
    choicesHTML=`<div class="sc-choices"><button class="sc-choice" onclick="go('${n.to}')">Continue →</button></div>`;
  } else {
    choicesHTML='<div class="sc-end">The End.</div>';
  }

  scene.innerHTML=`
    <div class="sc-head">
      ${avatar}
      <span class="sc-name" style="color:${safeColour(ch.colour)}">${esc(ch.name)}</span>
      ${n.tag?`<span class="tag-chip" style="background:${tagColour(n.tag)}26;color:${tagColour(n.tag)};border:1px solid ${tagColour(n.tag)}66;">${esc(n.tag)}</span>`:''}
    </div>
    <div class="sc-text">${n.text?esc(n.text):'…'}</div>
    ${choicesHTML}
    ${varChips()}
  `;
}

function showShare(){
  const url=location.href.split('#')[0]+location.hash;
  if(location.hash&&location.hash.startsWith('#s=')){
    if(navigator.clipboard&&navigator.clipboard.writeText)
      navigator.clipboard.writeText(url).then(()=>showToast('Link copied!'),()=>prompt('Copy this link:',url));
    else prompt('Copy this link:',url);
  } else {
    prompt('Save this story as JSON and share a link made in the Story Editor:',storyName);
  }
}

boot();
// Seen-key + ? help (full standard)
(function(){
  var SEEN='jvds_storyplayer_seen';
  try{ if(localStorage.getItem(SEEN)!=='1'){ showToast('✨ Open a shared play-link, or drop a story .json'); localStorage.setItem(SEEN,'1'); } }catch(e){}
  document.addEventListener('keydown',function(e){
    if(e.key==='?'&&!e.ctrlKey&&!e.metaKey){
      var tag=(e.target.tagName||'').toLowerCase();
      if(tag==='input'||tag==='textarea'||tag==='select') return;
      e.preventDefault();
      showToast('✨ Play a story from a link, or drop a .json — Story Editor →');
    }
  });
})();
// ── AUTOSAVE (save story state per-story) ──
var _storySaveKey='jvds_story_state';
function saveStoryState(){try{localStorage.setItem(_storySaveKey,JSON.stringify({currentId,vars:V,storyName}));}catch(e){}}
function loadStoryState(){try{var r=localStorage.getItem(_storySaveKey);if(r){var d=JSON.parse(r);if(d.currentId){currentId=d.currentId;V=d.vars||{};storyName=d.storyName||storyName;renderScene();return true;}}}catch(e){}return false;}
window.addEventListener('beforeunload',saveStoryState);
// Override go() to save state (deferred to ensure go() exists)
setTimeout(function(){try{var origGo=window.go;window.go=function(id){origGo(id);saveStoryState();};}catch(e){}},100);
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');
</script>
