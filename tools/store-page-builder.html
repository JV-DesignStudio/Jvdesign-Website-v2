<body>
<div class="header">
  <a href="/index.html"><img src="/logo.png" alt="" height="28" style="border-radius:6px"></a>
  <h1>Store Page Builder</h1>
  <button class="btn btn-primary" onclick="exportHTML()">📥 Export HTML</button>
  <button class="btn btn-secondary" onclick="copyBBCode()">📋 Copy BBCode</button>
</div>
<div class="wrap">
  <div class="preview-area">
    <div class="preview-card" id="previewCard">
      <div class="preview-header">
        <h2 id="previewTitle">My Game</h2>
        <p id="previewTagline">A subtitle or tagline</p>
      </div>
      <div class="preview-screenshots" id="previewScreenshots">
        <div style="height:120px;width:200px;background:#222;border-radius:8px;display:flex;align-items:center;justify-content:center;color:#666;font-size:.8rem">No screenshots</div>
      </div>
      <div class="preview-body">
        <h3>About this game</h3>
        <p id="previewDesc">Write your game description here...</p>
        <div class="preview-tags" id="previewTags"></div>
      </div>
    </div>
  </div>
  <div class="sidebar">
    <div class="sidebar-section">
      <h3>Game Info</h3>
      <div class="form-group">
        <label>Game Title</label>
        <input type="text" id="gameTitle" placeholder="My Awesome Game" oninput="renderPreview()">
      </div>
      <div class="form-group">
        <label>Tagline</label>
        <input type="text" id="tagline" placeholder="A short tagline" oninput="renderPreview()">
      </div>
      <div class="form-group">
        <label>Description</label>
        <textarea id="description" placeholder="Write your game description..." oninput="renderPreview()"></textarea>
      </div>
      <div class="form-group">
        <label>Tags (comma-separated)</label>
        <input type="text" id="tags" placeholder="Action, Indie, Pixel Art" oninput="renderPreview()">
      </div>
    </div>
    <div class="sidebar-section">
      <h3>Screenshots</h3>
      <div class="form-group">
        <label>Upload Screenshots</label>
        <input type="file" id="screenshotsInput" accept="image/*" multiple onchange="loadScreenshots(this)">
      </div>
    </div>
    <div class="sidebar-section">
      <h3>Links</h3>
      <div class="form-group">
        <label>Steam URL</label>
        <input type="url" id="steamUrl" placeholder="https://store.steampowered.com/app/...">
      </div>
      <div class="form-group">
        <label>itch.io URL</label>
        <input type="url" id="itchUrl" placeholder="https://yourname.itch.io/game">
      </div>
    </div>
  </div>
</div>
<div id="toast" class="toast"></div>
<script>
let screenshots = [];

function loadScreenshots(input) {
  Array.from(input.files).forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      screenshots.push(e.target.result);
      renderPreview();
    };
    reader.readAsDataURL(file);
  });
  input.value = '';
}

function renderPreview() {
  document.getElementById('previewTitle').textContent = document.getElementById('gameTitle').value || 'My Game';
  document.getElementById('previewTagline').textContent = document.getElementById('tagline').value || '';
  document.getElementById('previewDesc').textContent = document.getElementById('description').value || 'Write your game description here...';
  
  // Screenshots
  const container = document.getElementById('previewScreenshots');
  if (screenshots.length) {
    container.innerHTML = screenshots.map(s => '<img src="' + s + '" alt="Screenshot">').join('');
  }
  
  // Tags
  const tags = document.getElementById('tags').value.split(',').map(t => t.trim()).filter(Boolean);
  document.getElementById('previewTags').innerHTML = tags.map(t => '<span class="preview-tag">' + t + '</span>').join('');
}

function exportHTML() {
  const title = document.getElementById('gameTitle').value || 'My Game';
  const tagline = document.getElementById('tagline').value || '';
  const desc = document.getElementById('description').value || '';
  const tags = document.getElementById('tags').value.split(',').map(t => t.trim()).filter(Boolean);
  const steamUrl = document.getElementById('steamUrl').value;
  const itchUrl = document.getElementById('itchUrl').value;
  
  let html = '<!DOCTYPE html>\n<html lang="en">\n<head>\n<meta charset="UTF-8">\n';
  html += '<meta name="viewport" content="width=device-width, initial-scale=1.0">\n';
  html += '<title>' + title + '</title>\n';
  html += '\n</head>\n<body>\n';
  html += '<h1>' + title + '</h1>\n';
  if (tagline) html += '<p class="tagline">' + tagline + '</p>\n';
  if (screenshots.length) {
    html += '<div class="screenshots">\n';
    screenshots.forEach(s => html += '  <img src="' + s + '" alt="Screenshot">\n');
    html += '</div>\n';
  }
  if (desc) html += '<p>' + desc.replace(/\n/g, '<br>') + '</p>\n';
  if (tags.length) {
    html += '<div class="tags">\n';
    tags.forEach(t => html += '  <span class="tag">' + t + '</span>\n');
    html += '</div>\n';
  }
  html += '<div class="cta">\n';
  if (steamUrl) html += '  <a href="' + steamUrl + '" class="steam">Buy on Steam</a>\n';
  if (itchUrl) html += '  <a href="' + itchUrl + '" class="itch">Buy on itch.io</a>\n';
  html += '</div>\n</body>\n</html>';
  
  const blob = new Blob([html], { type: 'text/html' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = (title.replace(/\s+/g, '-').toLowerCase()) + '-store.html';
  a.click();
  showToast('HTML exported!');
}

function copyBBCode() {
  const title = document.getElementById('gameTitle').value || 'My Game';
  const desc = document.getElementById('description').value || '';
  const tags = document.getElementById('tags').value.split(',').map(t => t.trim()).filter(Boolean);
  const itchUrl = document.getElementById('itchUrl').value;
  
  let bb = '[h1]' + title + '[/h1]\n\n';
  if (desc) bb += desc + '\n\n';
  if (tags.length) bb += '[b]Tags:[/b] ' + tags.join(', ') + '\n\n';
  if (itchUrl) bb += '[url=' + itchUrl + ']Buy on itch.io[/url]\n';
  
  navigator.clipboard.writeText(bb).then(() => showToast('BBCode copied!')).catch(() => prompt('Copy:', bb));
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.opacity = 1;
  clearTimeout(t._t); t._t = setTimeout(() => t.style.opacity = 0, 2000);
}

// ── AUTOSAVE / RESTORE ──
const LS_KEY = 'jvds_store_page';
function saveToLS() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      gameTitle: document.getElementById('gameTitle').value,
      tagline: document.getElementById('tagline').value,
      description: document.getElementById('description').value,
      tags: document.getElementById('tags').value,
      steamUrl: document.getElementById('steamUrl').value,
      itchUrl: document.getElementById('itchUrl').value
    }));
  } catch(e) {}
}
function loadFromLS() {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    if (data.gameTitle) document.getElementById('gameTitle').value = data.gameTitle;
    if (data.tagline) document.getElementById('tagline').value = data.tagline;
    if (data.description) document.getElementById('description').value = data.description;
    if (data.tags) document.getElementById('tags').value = data.tags;
    if (data.steamUrl) document.getElementById('steamUrl').value = data.steamUrl;
    if (data.itchUrl) document.getElementById('itchUrl').value = data.itchUrl;
    renderPreview();
  } catch(e) {}
}
let autosaveTimer = null;
function scheduleAutosave() { clearTimeout(autosaveTimer); autosaveTimer = setTimeout(saveToLS, 500); }
document.querySelectorAll('input,select,textarea').forEach(el => el.addEventListener('input', scheduleAutosave));

// ── HELP ──
document.addEventListener('keydown', e => {
  if (e.key === '?' && !e.ctrlKey && !e.metaKey) {
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea') return;
    e.preventDefault();
    showToast('Tip: Fill in game info, upload screenshots, export as HTML or copy BBCode');
  }
});

loadFromLS();
renderPreview();
</script>

</body>
</html>
