  <rect x="10" y="2" width="12" height="10" rx="2" fill="#5B8DEF"/>
  <rect x="12" y="4" width="3" height="3" fill="#fff"/>
  <rect x="17" y="4" width="3" height="3" fill="#fff"/>
  <rect x="12" y="5" width="2" height="2" fill="#1a1a2e"/>
