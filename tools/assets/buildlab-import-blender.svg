<svg xmlns="http://www.w3.org/2000/svg" width="120" height="72" viewBox="0 0 120 72" role="img" aria-labelledby="blenderTitle">
  <title id="blenderTitle">Blender: import a glTF or OBJ file</title>
  <rect width="120" height="72" rx="9" fill="#1b1408"/>
  <rect x="10" y="9" width="100" height="15" rx="3" fill="#3a2a10"/>
  <text x="16" y="20" font-family="Inter,Arial,sans-serif" font-size="8" fill="#f5a623">File</text>
  <text x="44" y="20" font-family="Inter,Arial,sans-serif" font-size="8" fill="#f5a623">Import</text>
  <rect x="16" y="30" width="88" height="12" rx="2" fill="#4a3514"/>
  <text x="21" y="38.5" font-family="Inter,Arial,sans-serif" font-size="7" fill="#ffe6bd">glTF (.glb) / Wavefront (.obj)</text>
  <g transform="translate(14,44)">
    <path d="M0 8 H14" stroke="#f5a623" stroke-width="1.6"/>
