    <path d="M22 2 L31 6 L31 15 L22 19 L13 15 L13 6 Z" fill="#f5a623" fill-opacity=".35" stroke="#ffd07a" stroke-width="1"/>
    <path d="M22 2 L31 6 L22 10 L13 6 Z" fill="#ffd07a" fill-opacity=".7"/>
  </g>
  <text x="52" y="60" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="700" fill="#ffe6bd">Blender</text>
