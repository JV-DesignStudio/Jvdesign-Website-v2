<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 96" width="192" height="96" shape-rendering="crispEdges">
  <!-- Tileset grid: 6 tiles (32x32 each) in a 3x2 layout -->

  <!-- Tile 1: Ground -->
  <rect x="0" y="0" width="32" height="32" fill="#8B6914"/>
  <rect x="0" y="0" width="32" height="4" fill="#9B7924"/>
  <rect x="3" y="2" width="4" height="2" fill="#AB8934" opacity="0.5"/>
  <rect x="12" y="1" width="5" height="2" fill="#AB8934" opacity="0.4"/>
  <rect x="0" y="4" width="32" height="28" fill="#7B5910"/>
  <rect x="6" y="8" width="3" height="3" fill="#6B4908" opacity="0.4"/>
  <rect x="18" y="6" width="4" height="2" fill="#6B4908" opacity="0.3"/>
  <rect x="24" y="10" width="3" height="3" fill="#6B4908" opacity="0.4"/>

  <!-- Tile 2: Grass platform -->
  <rect x="32" y="0" width="32" height="32" fill="#8B6914"/>
  <rect x="32" y="0" width="32" height="8" fill="#4CAF50"/>
  <rect x="32" y="4" width="32" height="4" fill="#388E3C"/>
  <rect x="34" y="1" width="4" height="3" fill="#66BB6A"/>
  <rect x="42" y="0" width="3" height="4" fill="#66BB6A"/>
  <rect x="50" y="2" width="5" height="2" fill="#66BB6A"/>
  <rect x="32" y="8" width="32" height="4" fill="#7B5B10"/>
  <rect x="32" y="12" width="32" height="20" fill="#6B4B0A"/>

  <!-- Tile 3: Wall -->
  <rect x="64" y="0" width="32" height="32" fill="#6B6B6B"/>
  <rect x="64" y="0" width="32" height="2" fill="#7B7B7B"/>
  <rect x="64" y="2" width="16" height="15" fill="#5B5B5B"/>
  <rect x="80" y="2" width="16" height="15" fill="#5B5B5B"/>
  <rect x="64" y="17" width="16" height="15" fill="#5B5B5B"/>
  <rect x="80" y="17" width="16" height="15" fill="#5B5B5B"/>
  <rect x="65" y="3" width="14" height="13" fill="#707070" rx="1"/>
  <rect x="81" y="3" width="14" height="13" fill="#707070" rx="1"/>
  <rect x="65" y="18" width="14" height="13" fill="#707070" rx="1"/>
  <rect x="81" y="18" width="14" height="13" fill="#707070" rx="1"/>

  <!-- Tile 4: Corner -->
  <rect x="96" y="0" width="32" height="32" fill="#8B6914"/>
  <rect x="96" y="0" width="32" height="4" fill="#4CAF50"/>
  <rect x="96" y="4" width="32" height="4" fill="#388E3C"/>
  <rect x="96" y="0" width="4" height="32" fill="#388E3C"/>
  <rect x="96" y="0" width="4" height="8" fill="#4CAF50"/>
  <rect x="98" y="1" width="2" height="3" fill="#66BB6A"/>
  <rect x="100" y="8" width="28" height="24" fill="#6B4B0A"/>
  <rect x="96" y="8" width="4" height="24" fill="#5B3B08"/>

  <!-- Tile 5: Spike -->
  <rect x="128" y="0" width="32" height="32" fill="#0d1117"/>
  <polygon points="128,32 136,16 144,32" fill="#FF4757"/>
  <polygon points="144,32 152,16 160,32" fill="#FF6B81"/>
  <polygon points="160,32 168,16 176,32" fill="#FF4757"/>
  <polygon points="176,32 184,16 192,32" fill="#FF6B81"/>

  <!-- Tile 6: Coin block -->
  <rect x="160" y="0" width="32" height="32" fill="#FFC107"/>
  <rect x="160" y="0" width="32" height="2" fill="#FFD93D"/>
  <rect x="160" y="2" width="32" height="28" fill="#FF9800"/>
  <rect x="164" y="4" width="24" height="24" rx="2" fill="#FFD93D"/>
  <text x="176" y="22" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="14" fill="#FF9800">?</text>
  <rect x="165" y="5" width="2" height="8" rx="1" fill="#FFE082" opacity="0.4"/>
</svg>
