<style>
:root{--bg:#101522;--ink:#f7f3e8;--muted:#9faac0;--panel:#182235;--panel2:#202d44;--line:#31435f;--gold:#f5c842;--mint:#42d3b2;--rose:#ef7182;--shadow:0 24px 60px #05091470}*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;min-height:100vh;color:var(--ink);font:15px/1.45 "Trebuchet MS",Verdana,sans-serif;background:radial-gradient(circle at 16% 0,#31415f 0,#101522 42%),linear-gradient(135deg,#101522,#151a2c 58%,#10241f)}button,input,textarea,select{font:inherit}button{border:0;cursor:pointer}.app{width:min(1240px,calc(100% - 32px));margin:auto;padding:22px 0 34px}.top{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:start;margin-bottom:16px}.brand-row{display:flex;gap:12px;align-items:center}.brand-mark{width:44px;height:44px;border-radius:10px;background:linear-gradient(135deg,var(--gold),var(--mint));display:grid;place-items:center;color:#101522;font-weight:900;box-shadow:0 12px 30px #0005}.eyebrow{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mint);font-weight:900}.brand h1{margin:0;font-size:2.1rem;line-height:1;letter-spacing:0}.brand p{margin:6px 0 0;color:var(--muted);max-width:700px}.top-actions,.tabs,.sheet-actions,.filters{display:flex;gap:8px;flex-wrap:wrap}.btn,.tab,.chip{min-height:38px;border-radius:8px;padding:9px 13px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-weight:800;text-decoration:none}.btn.primary{background:var(--gold);border-color:#ffe17a;color:#231b07}.btn.danger{background:#3a202c;border-color:#713340;color:#ffd8dc}.btn.ghost{background:#142036}.tab{color:var(--muted);background:#121c2f}.tab.active,.chip.active{background:var(--mint);border-color:var(--mint);color:#06211d}.hero{display:grid;grid-template-columns:1.4fr .8fr;gap:14px;margin:14px 0 16px}.progress,.quick-panel,.column,.modal-card{background:rgba(24,34,53,.88);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow)}.progress{padding:18px}.progress-head{display:flex;align-items:end;gap:16px}.progress-head strong{display:block;font-size:1.45rem}.progress-head small,.stat small,.field label{display:block;color:var(--muted);font-size:.74rem;text-transform:uppercase;letter-spacing:.09em;font-weight:900}.stats{display:flex;gap:12px;margin-left:auto}.stat{text-align:right;min-width:76px}.stat b{display:block;font-size:1.35rem;color:var(--gold)}.xp{height:11px;background:#0b1220;border-radius:99px;overflow:hidden;margin-top:14px}.xp i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--mint),var(--gold));transition:width .25s}.quick-panel{padding:14px}.quick-panel form{display:grid;grid-template-columns:1fr auto;gap:8px}.quick-panel input,.toolbar input,.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);background:#0e1727;color:var(--ink);border-radius:8px;padding:11px}.toolbar{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:12px 0}.toolbar input{max-width:420px}.view{display:none}.view.active{display:block}.board{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.column{padding:12px;min-height:420px}.column-head{display:flex;align-items:center;gap:9px;margin-bottom:10px}.dot{width:10px;height:10px;border-radius:50%}.column-head strong{flex:1}.count{color:var(--muted);font-size:.82rem}.quest-list{display:grid;gap:9px}.quest{background:var(--panel2);border:1px solid #3a4a65;border-left:4px solid var(--mint);border-radius:8px;padding:11px;display:grid;gap:8px}.quest.done{opacity:.58}.quest-title{font-weight:900;overflow-wrap:anywhere}.quest-desc{color:var(--muted);font-size:.86rem;overflow-wrap:anywhere}.quest-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.pill{font-size:.74rem;padding:3px 7px;border-radius:99px;background:#31415d;color:#dfe8f6}.quest-actions{display:flex;gap:6px;margin-left:auto}.icon{min-width:32px;height:32px;border-radius:8px;background:#142036;border:1px solid var(--line);color:var(--ink);padding:0 8px}.empty{padding:18px;border:1px dashed var(--line);border-radius:8px;text-align:center;color:var(--muted)}.settings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.settings-card{padding:16px}.settings-card h2{margin:0 0 8px;font-size:1.1rem}.settings-card p{color:var(--muted);margin:0 0 14px}.modal{position:fixed;inset:0;background:#050811bb;display:none;align-items:center;justify-content:center;padding:16px;z-index:20}.modal.open{display:flex}.modal-card{width:min(620px,100%);padding:18px}.modal-card h2{margin:0 0 14px}.field{display:grid;gap:6px;margin:11px 0}.sheet-actions{margin-top:15px}.sheet-actions .btn{flex:1}.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(8px);opacity:0;background:#f7f3e8;color:#101522;padding:10px 14px;border-radius:8px;font-weight:900;transition:.2s;pointer-events:none;z-index:30}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}#mobileNav{display:none}@media(max-width:820px){.app{width:min(100% - 24px,760px);padding-bottom:92px}.top,.hero,.settings-grid{grid-template-columns:1fr}.top-actions{justify-content:flex-start}.board{grid-template-columns:1fr}.toolbar{align-items:stretch;flex-direction:column}.toolbar input{max-width:none}.quick-panel form{grid-template-columns:1fr}.tabs{display:none}#mobileNav{position:fixed;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:#101522ee;border-top:1px solid var(--line);padding:9px 10px calc(9px + env(safe-area-inset-bottom));backdrop-filter:blur(12px);z-index:10}#mobileNav .tab{min-height:42px;padding:7px 6px;font-size:.78rem}.progress-head{align-items:flex-start;flex-direction:column}.stats{margin-left:0}.modal{align-items:end}.modal-card{border-radius:8px 8px 0 0}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important}}
</style>

<body>
<main class="app">
  <header class="top">
    <div class="brand">
      <div class="brand-row"><div class="brand-mark">GP</div><div><div class="eyebrow">QuestLog desktop twin</div><h1>Game Planner</h1></div></div>
      <p>Plan game ideas as quests, push them across the board, then carry the same backup into the portable QuestLog app.</p>
    </div>
    <div class="top-actions">
      <a class="btn ghost" href="../dev-tools.html">Tools</a>
      <button class="btn ghost" id="exportBtn" onclick="exportData()">Export</button>
      <button class="btn ghost" id="importBtn" onclick="importData()">Import</button>
      <input id="importFile" type="file" accept="application/json" hidden>
      <button class="btn primary" id="newQuest" onclick="openCardModal()">+ New Quest</button>
    </div>
  </header>
  <section class="hero">
    <div class="progress" aria-label="Player progress">
      <div class="progress-head">
        <div><small id="playerClass">Game Planner</small><strong id="playerName">The Novice</strong></div>
        <div class="stats"><div class="stat"><small>Level</small><b id="level">1</b></div><div class="stat"><small>XP</small><b id="xp">0</b></div><div class="stat"><small>Active</small><b id="activeCount">0</b></div></div>
      </div>
      <div class="xp"><i id="xpBar"></i></div>
    </div>
    <aside class="quick-panel">
      <form id="quickForm"><input id="quickTitle" maxlength="120" autocomplete="off" placeholder="Quick capture a game task"><button class="btn primary">Add</button></form>
      <div class="filters" style="margin-top:10px"><button class="chip active" data-filter="all">All</button><button class="chip" data-filter="high">Main</button><button class="chip" data-filter="med">Side</button><button class="chip" data-filter="low">Guild</button></div>
    </aside>
  </section>
  <nav class="tabs" aria-label="Game Planner views"><button class="tab active" data-view="board">Board</button><button class="tab" data-view="today">Today</button><button class="tab" data-view="done">Archive</button><button class="tab" data-view="settings">Settings</button></nav>
  <div class="toolbar"><input id="searchInput" type="search" placeholder="Search quests" oninput="render()"><span class="count" id="statusLine">0 quests</span></div>
  <section class="view active" id="view-board"><div class="board" id="board"></div></section>
  <section class="view" id="view-today"></section>
  <section class="view" id="view-done"></section>
  <section class="view" id="view-settings"></section>
</main>
<nav id="mobileNav" aria-label="Mobile views"><button class="tab active" data-view="board">Board</button><button class="tab" data-view="today">Today</button><button class="tab" data-view="done">Archive</button><button class="tab" data-view="settings">Settings</button></nav>
<div class="modal" id="cardModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><form class="modal-card" id="questForm"><h2 id="modalTitle">New Quest</h2><div class="field"><label for="title">Quest</label><input id="title" required maxlength="120" autocomplete="off"></div><div class="field"><label for="description">Notes</label><textarea id="description" rows="4" maxlength="800"></textarea></div><div class="field"><label for="column">Stage</label><select id="column"></select></div><div class="field"><label for="priority">Quest Type</label><select id="priority"><option value="high">Main Quest</option><option value="med" selected>Side Quest</option><option value="low">Guild Quest</option></select></div><div class="sheet-actions"><button type="button" class="btn ghost" id="cancelBtn">Cancel</button><button class="btn primary">Save Quest</button></div></form></div>
<div class="modal" id="projectSheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle"><div class="modal-card"><h2 id="sheetTitle">Quest Details</h2><div id="sheetBody"></div><div class="sheet-actions"><button class="btn ghost" onclick="closeProjectSheet()">Close</button><button class="btn primary" id="sheetEdit">Edit</button></div></div></div>
<div class="toast" id="toast" role="status"></div>
<script>
const DATA_KEY='qb-data-v1', RPG_KEY='qb-rpg-v1';
const seedColumns=[{id:'todo',title:'To Do',colour:'#42d3b2'},{id:'doing',title:'In Progress',colour:'#f5c842'},{id:'done',title:'Complete',colour:'#9eacc4'}];
let data={columns:structuredClone(seedColumns),cards:[],nextId:1};
let rpg={level:1,xp:0};
let activeView='board', filter='all';
const $=s=>document.querySelector(s);
const $$=s=>Array.from(document.querySelectorAll(s));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function normalise(){if(!Array.isArray(data.columns)||!data.columns.length)data.columns=structuredClone(seedColumns);if(!Array.isArray(data.cards))data.cards=[];data.cards=data.cards.map((c,i)=>({id:c.id||'q'+(i+1),title:c.title||'Untitled quest',desc:c.desc||c.description||'',colId:c.colId||'todo',priority:c.priority||'med',createdAt:c.createdAt||new Date().toISOString()}));data.nextId=Math.max(Number(data.nextId)||1,...data.cards.map(c=>Number(String(c.id).replace(/\D/g,''))||0))+1}
function save(){normalise();localStorage.setItem(DATA_KEY,JSON.stringify(data));localStorage.setItem(RPG_KEY,JSON.stringify(rpg))}
function load(){try{const saved=JSON.parse(localStorage.getItem(DATA_KEY)||'null');if(saved?.cards)data={...data,...saved};const savedRpg=JSON.parse(localStorage.getItem(RPG_KEY)||'null');if(savedRpg)rpg={...rpg,...savedRpg}}catch{}normalise()}
function levelXp(){return Math.max(100,rpg.level*100)}
function reward(){rpg.xp+=50;while(rpg.xp>=levelXp()){rpg.xp-=levelXp();rpg.level++}save();toast('Quest complete +50 XP')}
function switchView(view){activeView=view;$$('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));$$('.view').forEach(v=>v.classList.toggle('active',v.id==='view-'+view));render()}
function setFilter(next){filter=next;$$('[data-filter]').forEach(b=>b.classList.toggle('active',b.dataset.filter===next));render()}
function filteredCards(){const q=$('#searchInput').value.trim().toLowerCase();return data.cards.filter(c=>(filter==='all'||c.priority===filter)&&(!q||(c.title+' '+(c.desc||'')).toLowerCase().includes(q)))}
function renderHeader(){const active=data.cards.filter(c=>c.colId!=='done').length;$('#level').textContent=rpg.level;$('#xp').textContent=rpg.xp;$('#activeCount').textContent=active;$('#xpBar').style.width=Math.min(100,rpg.xp/levelXp()*100)+'%';$('#statusLine').textContent=data.cards.length+' quests · '+active+' active'}
function render(){renderHeader();if(activeView==='settings')return renderSettings();if(activeView==='today')return renderList('#view-today',filteredCards().filter(c=>c.colId!=='done'),'Today');if(activeView==='done')return renderList('#view-done',filteredCards().filter(c=>c.colId==='done'),'Archive');renderBoard()}
function renderBoard(){const root=$('#board');const cards=filteredCards();root.innerHTML=data.columns.map(col=>{const list=cards.filter(c=>c.colId===col.id);return '<section class="column"><div class="column-head"><i class="dot" style="background:'+col.colour+'"></i><strong>'+esc(col.title)+'</strong><span class="count">'+list.length+'</span></div><div class="quest-list">'+(list.length?list.map(cardHtml).join(''):'<div class="empty">Nothing here yet</div>')+'</div></section>'}).join('');bindCards(root)}
function renderList(sel,cards,title){const root=$(sel);root.innerHTML='<div class="column"><div class="column-head"><strong>'+esc(title)+'</strong><span class="count">'+cards.length+'</span></div><div class="quest-list">'+(cards.length?cards.map(cardHtml).join(''):'<div class="empty">No quests here yet</div>')+'</div></div>';bindCards(root)}
function renderSettings(){const root=$('#view-settings');root.innerHTML='<div class="settings-grid"><section class="column settings-card"><h2>Portable Data</h2><p>Exports use the shared questlog-v1 format, so backups can move between this desktop planner and the QuestLog app.</p><button class="btn ghost" onclick="exportData()">Export Backup</button> <button class="btn ghost" onclick="importData()">Import Backup</button></section><section class="column settings-card"><h2>Local Reset</h2><p>This only clears the planner data stored in this browser.</p><button class="btn danger" id="clearData">Clear Local Data</button></section></div>';$('#clearData').onclick=()=>{if(confirm('Clear this browser data?')){localStorage.removeItem(DATA_KEY);localStorage.removeItem(RPG_KEY);location.reload()}}}
function cardHtml(c){const label={high:'Main Quest',med:'Side Quest',low:'Guild Quest'}[c.priority]||'Quest';const colour={high:'#ef7182',med:'#f5c842',low:'#42d3b2'}[c.priority]||'#42d3b2';return '<article class="quest '+(c.colId==='done'?'done':'')+'" style="border-left-color:'+colour+'"><div class="quest-title">'+esc(c.title)+'</div>'+(c.desc?'<div class="quest-desc">'+esc(c.desc.slice(0,180))+'</div>':'')+'<div class="quest-meta"><span class="pill">'+label+'</span><span class="pill">'+new Date(c.createdAt).toLocaleDateString()+'</span><span class="quest-actions"><button class="icon" data-move="'+c.id+'" title="Move quest">→</button><button class="icon" data-edit="'+c.id+'" title="Edit quest">Edit</button><button class="icon" data-delete="'+c.id+'" title="Delete quest">×</button></span></div></article>'}
function bindCards(root){root.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>openCardModal(b.dataset.edit));root.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>deleteCard(b.dataset.delete));root.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>moveCard(b.dataset.move))}
function openCardModal(id){const c=id&&data.cards.find(x=>x.id===id);$('#column').innerHTML=data.columns.map(col=>'<option value="'+col.id+'">'+esc(col.title)+'</option>').join('');$('#modalTitle').textContent=c?'Edit Quest':'New Quest';$('#title').value=c?.title||'';$('#description').value=c?.desc||'';$('#column').value=c?.colId||'todo';$('#priority').value=c?.priority||'med';$('#questForm').dataset.edit=c?.id||'';$('#cardModal').classList.add('open');setTimeout(()=>$('#title').focus(),30)}
function closeCardModal(){$('#cardModal').classList.remove('open')}
function openProjectSheet(id){const c=data.cards.find(x=>x.id===id);if(!c)return;$('#sheetTitle').textContent=c.title;$('#sheetBody').innerHTML='<p class="quest-desc">'+esc(c.desc||'No notes yet.')+'</p><p><span class="pill">'+esc(c.priority||'med')+'</span> <span class="pill">'+esc(c.colId)+'</span></p>';$('#sheetEdit').onclick=()=>{closeProjectSheet();openCardModal(id)};$('#projectSheet').classList.add('open')}
function closeProjectSheet(){$('#projectSheet').classList.remove('open')}
function moveCard(id){const c=data.cards.find(x=>x.id===id);if(!c)return;const i=data.columns.findIndex(col=>col.id===c.colId);const next=data.columns[Math.min(i+1,data.columns.length-1)];if(next.id===c.colId)return;c.colId=next.id;if(next.id==='done')reward();save();render()}
function deleteCard(id){if(!confirm('Delete this quest?'))return;data.cards=data.cards.filter(c=>c.id!==id);save();render();toast('Quest deleted')}
function toast(text){const el=$('#toast');el.textContent=text;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),1800)}
$('#questForm').onsubmit=e=>{e.preventDefault();const title=$('#title').value.trim();if(!title)return;const id=$('#questForm').dataset.edit;const c=id&&data.cards.find(x=>x.id===id);if(c){c.title=title;c.desc=$('#description').value.trim();c.colId=$('#column').value;c.priority=$('#priority').value}else{data.cards.push({id:'q'+data.nextId++,title,desc:$('#description').value.trim(),colId:$('#column').value,priority:$('#priority').value,createdAt:new Date().toISOString()})}save();closeCardModal();render();toast(c?'Quest updated':'Quest added')};
$('#quickForm').onsubmit=e=>{e.preventDefault();const title=$('#quickTitle').value.trim();if(!title)return;data.cards.push({id:'q'+data.nextId++,title,desc:'',colId:'todo',priority:'med',createdAt:new Date().toISOString()});$('#quickTitle').value='';save();render();toast('Quest added')};
$('#cancelBtn').onclick=closeCardModal;$('#cardModal').onclick=e=>{if(e.target.id==='cardModal')closeCardModal()};$('#projectSheet').onclick=e=>{if(e.target.id==='projectSheet')closeProjectSheet()};
$$('[data-view]').forEach(b=>b.onclick=()=>switchView(b.dataset.view));$$('[data-filter]').forEach(b=>b.onclick=()=>setFilter(b.dataset.filter));
function exportData(){const state={columns:data.columns,cards:data.cards,nextId:data.nextId};const blob=new Blob([JSON.stringify({state,data:state,rpg,format:'questlog-v1'},null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='game-planner-backup.json';a.click();URL.revokeObjectURL(a.href);toast('Backup exported')}
function importData(){const input=$('#importFile');input.onchange=e=>{const f=e.target.files[0];if(!f)return;const reader=new FileReader();reader.onload=()=>{try{const x=JSON.parse(reader.result);const incoming=x.state||x.data||x;if(!incoming.cards)throw Error();data={...data,...incoming};rpg={...rpg,...(x.rpg||{})};normalise();save();render();toast('Backup imported')}catch{toast('That is not a Game Planner backup')}};reader.readAsText(f);input.value=''};input.click()}
load();render();
</script>
<script defer src="/mascots.js"></script>
