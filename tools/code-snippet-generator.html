const SNIPPETS=[
  {cat:'Movement',lang:'gdscript',title:'2D Character Movement',desc:'GDScript character body with WASD/arrow input',
   code:`extends CharacterBody2D

const SPEED = 300.0
const JUMP_VELOCITY = -400.0
var gravity = ProjectSettings.get_setting("physics/2d/default_gravity")

func _physics_process(delta):
    if not is_on_floor():
        velocity.y += gravity * delta
    if Input.is_action_just_pressed("ui_accept") and is_on_floor():
        velocity.y = JUMP_VELOCITY
    var direction = Input.get_axis("ui_left","ui_right")
    velocity.x = direction * SPEED
    move_and_slide()`},
  {cat:'Movement',lang:'csharp',title:'Unity Player Controller',desc:'CharacterController with input, gravity and jump',
   code:`using UnityEngine;

public class PlayerController : MonoBehaviour {
    public float speed = 6f;
    public float jumpHeight = 2f;
    CharacterController cc;
    float gravity = -9.81f;
    float yVelocity;

    void Start() => cc = GetComponent<CharacterController>();

    void Update() {
        float h = Input.GetAxis("Horizontal");
        float v = Input.GetAxis("Vertical");
        Vector3 move = new Vector3(h, 0, v);
        cc.SimpleMove(move * speed);
        if (Input.GetButtonDown("Jump") && cc.isGrounded)
            yVelocity = Mathf.Sqrt(jumpHeight * -2f * gravity);
        yVelocity += gravity * Time.deltaTime;
        cc.Move(Vector3.up * yVelocity * Time.deltaTime);
    }
}`},
  {cat:'Movement',lang:'js',title:'Canvas 2D Movement',desc:'Arrow key movement for a 2D canvas game',
   code:`const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const keys = {};
document.addEventListener('keydown', e => keys[e.key] = true);
document.addEventListener('keyup', e => keys[e.key] = false);

const player = { x: 100, y: 100, w: 32, h: 32, speed: 4 };

function update() {
  if (keys['ArrowLeft']) player.x -= player.speed;
  if (keys['ArrowRight']) player.x += player.speed;
  if (keys['ArrowUp']) player.y -= player.speed;
  if (keys['ArrowDown']) player.y += player.speed;
}

function draw() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#7c3aed';
  ctx.fillRect(player.x, player.y, player.w, player.h);
}

function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
gameLoop();`},
  {cat:'Movement',lang:'py',title:'Pygame Movement',desc:'Basic player movement with Pygame',
   code:`import pygame

pygame.init()
screen = pygame.display.set_mode((800, 600))
clock = pygame.time.Clock()

player = pygame.Rect(400, 300, 40, 40)
speed = 5

running = True
while running:

         a.x + a.w > b.x &&

  {cat:'Spawning',lang:'csharp',title:'Unity Object Pool',desc:'Reuse objects instead of instantiating',
   code:`using UnityEngine;
using System.Collections.Generic;

public class ObjectPool : MonoBehaviour {
    public GameObject prefab;
    public int poolSize = 10;
    List<GameObject> pool = new List<GameObject>();

    void Awake() {
        for (int i = 0; i < poolSize; i++) {
            var obj = Instantiate(prefab, transform);
            obj.SetActive(false);
            pool.Add(obj);
        }
    }

    public GameObject Get() {
        foreach (var obj in pool)
            if (!obj.activeSelf) { obj.SetActive(true); return obj; }
        var newObj = Instantiate(prefab, transform);
        pool.Add(newObj);
        return newObj;
    }
}`},

  {cat:'State',lang:'gdscript',title:'Simple State Machine',desc:'Finite state pattern for enemies',
   code:`extends CharacterBody2D

enum State { IDLE, CHASE, ATTACK }
var current_state = State.IDLE

func _physics_process(delta):
    match current_state:
        State.IDLE:
            if can_see_player():
                current_state = State.CHASE
        State.CHASE:
            chase_player(delta)

  {cat:'State',lang:'csharp',title:'Unity State Pattern',desc:'Interface-based state machine',
   code:`public interface IState {
    void Enter();
    void Update();
    void Exit();
}

public class StateMachine {
    IState currentState;
    public void ChangeState(IState newState) {
        currentState?.Exit();
        currentState = newState;
        currentState.Enter();
    }
    public void Update() => currentState?.Update();
}`},

   code:`using UnityEngine;

public class GameManager : MonoBehaviour {
    public static GameManager Instance { get; private set; }

    void Awake() {
        if (Instance != null && Instance != this) { Destroy(gameObject); return; }

  {cat:'Pattern',lang:'js',title:'Event Emitter',desc:'Simple pub/sub for game events',
   code:`class EventEmitter {
  constructor() { this.listeners = {}; }
  on(event, fn) {
    (this.listeners[event] = this.listeners[event] || []).push(fn);
  }
  emit(event, data) {
    (this.listeners[event] || []).forEach(fn => fn(data));
  }
  off(event, fn) {
    this.listeners[event] = (this.listeners[event] || []).filter(f => f !== fn);
  }
}

// Usage
const events = new EventEmitter();
events.on('enemyKilled', score => console.log('Killed:', score));
events.emit('enemyKilled', 100);`},
  {cat:'Pattern',lang:'py',title:'Pygame Game Loop',desc:'Structured game loop with states',
   code:`import pygame

class Game:
    def __init__(self):
        pygame.init()
        self.screen = pygame.display.set_mode((800, 600))
        self.clock = pygame.time.Clock()
        self.state = 'menu'
        self.running = True

    def run(self):
        while self.running:
            if self.state == 'menu': self.menu()
            elif self.state == 'play': self.play()
            elif self.state == 'over': self.game_over()

    def menu(self):
        for event in pygame.event.get():
            if event.type == pygame.QUIT: self.running = False
            if event.type == pygame.KEYDOWN: self.state = 'play'
        self.screen.fill((30, 30, 40))
        pygame.display.flip()
        self.clock.tick(60)

    def play(self):
        for event in pygame.event.get():
            if event.type == pygame.QUIT: self.running = False
        self.screen.fill((10, 10, 20))
        pygame.display.flip()
        self.clock.tick(60)

    def game_over(self):
        for event in pygame.event.get():
            if event.type == pygame.QUIT: self.running = False
            if event.type == pygame.KEYDOWN: self.state = 'menu'
        self.screen.fill((40, 10, 10))
        pygame.display.flip()
        self.clock.tick(60)

Game().run()`},
  {cat:'Saving',lang:'gdscript',title:'Save/Load JSON',desc:'Save game data to file',
   code:`const SAVE_PATH = "user://savegame.json"

func save_game(data: Dictionary):
    var file = FileAccess.open(SAVE_PATH, FileAccess.WRITE)
    file.store_string(JSON.stringify(data))

func load_game() -> Dictionary:
    if not FileAccess.file_exists(SAVE_PATH):
        return {}
    var file = FileAccess.open(SAVE_PATH, FileAccess.READ)
    return JSON.parse_string(file.get_as_text())`},
  {cat:'Saving',lang:'js',title:'LocalStorage Save',desc:'Save/load with localStorage',
   code:`function saveGame(data) {
  localStorage.setItem('gameSave', JSON.stringify(data));
}

function loadGame() {
  const raw = localStorage.getItem('gameSave');
  return raw ? JSON.parse(raw) : null;
}

// Usage
saveGame({ score: 1200, level: 5, inventory: ['sword', 'shield'] });
const save = loadGame();
console.log(save.score); // 1200`},
];
const cats=[...new Set(SNIPPETS.map(s=>s.cat))];
let currentLang='all';
function buildCats(){
  const el=document.getElementById('cats');
  el.innerHTML='<button class="cat-btn active" onclick="filterCat(\'all\',this)">All</button>';
  cats.forEach(c=>{el.innerHTML+=`<button class="cat-btn" onclick="filterCat('${c}',this)">${c}</button>`;});
}
let currentCat='all';
function filterCat(cat,btn){
  currentCat=cat;
  document.querySelectorAll('.cat-btn').forEach(b=>b.classList.remove('active'));
  if(btn)btn.classList.add('active');
  renderSnippets();
}
function filterLang(){
  currentLang=document.getElementById('langSel').value;
  renderSnippets();
}
function renderSnippets(){
  const el=document.getElementById('snippets');
  const filtered=SNIPPETS.filter(s=>(currentCat==='all'||s.cat===currentCat)&&(currentLang==='all'||s.lang===currentLang));
  el.innerHTML=filtered.map(s=>`
    <div class="snippet-card">
      <div class="snippet-head">
        <span class="snippet-title">${s.title}</span>
        <div style="display:flex;gap:8px;align-items:center">
          <span class="lang-badge">${s.lang.toUpperCase()}</span>
          <button class="copy-btn" onclick="copyCode(this,${JSON.stringify(s.code).replace(/"/g,'&quot;')})">Copy</button>
        </div>
      </div>
      <div class="snippet-desc">${s.desc}</div>
      <div class="code-block">${escapeHtml(s.code)}</div>
    </div>
  `).join('');
  if(!filtered.length) el.innerHTML='<div style="text-align:center;padding:40px;color:var(--muted)">No snippets match</div>';
}
function escapeHtml(t){return t.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function copyCode(btn,code){
  navigator.clipboard.writeText(code).then(()=>{btn.textContent='Copied!';setTimeout(()=>btn.textContent='Copy',1500);}).catch(()=>{});
}
buildCats();renderSnippets();
</script>
