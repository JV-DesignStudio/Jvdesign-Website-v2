<style>
:root {
  --cream:#FBF4E8; --cream-deep:#F5E9D3; --milk:#FFFDF8;
  --rose:#F4B6C2; --rose-deep:#E48BA0; --mint:#B8DDC8; --mint-deep:#6FB89A;
  --cocoa:#4A3528; --cocoa-soft:#6B4F3E; --sun:#F5C76A; --lavender:#C9B8E0;
  --shadow-soft:0 4px 16px rgba(74,53,40,0.08); --shadow-card:0 8px 28px rgba(74,53,40,0.14);
  --safe-top:env(safe-area-inset-top,0px); --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--cocoa);background:var(--cream);-webkit-user-select:none;user-select:none;background-image:radial-gradient(circle at 20% 30%,rgba(244,182,194,.10) 0%,transparent 45%),radial-gradient(circle at 80% 70%,rgba(184,221,200,.10) 0%,transparent 45%);touch-action:manipulation}
.app{height:100vh;height:100dvh;max-width:540px;margin:0 auto;display:flex;flex-direction:column;padding:calc(var(--safe-top) + 8px) 12px calc(var(--safe-bottom) + 8px)}

/* TOP BAR */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:6px 4px 8px;flex-shrink:0}
.brand{font-family:'Fraunces',serif;font-weight:900;font-size:22px;line-height:1;letter-spacing:-.02em}
.brand em{font-style:italic;font-weight:400;color:var(--rose-deep)}
.topbar-stats{display:flex;gap:6px}
.stat-pill{background:var(--milk);border:2px solid var(--cream-deep);padding:5px 11px;border-radius:100px;font-size:12px;font-weight:800;display:flex;align-items:center;gap:4px;box-shadow:var(--shadow-soft)}
.prestige-badge{background:var(--sun);border:2px solid #E8B840;color:var(--cocoa);padding:5px 10px;border-radius:100px;font-size:12px;font-weight:800;display:none;align-items:center;gap:3px;box-shadow:var(--shadow-soft);cursor:pointer}
.prestige-badge.visible{display:flex}

/* SCENE */
.scene-wrap{position:relative;flex-shrink:0;border-radius:22px;overflow:hidden;box-shadow:var(--shadow-card);background:linear-gradient(180deg,#F5E0D8 0%,#F4B6C2 50%,#E8C4A8 100%);height:175px}
.scene-svg{position:absolute;inset:0;width:100%;height:100%}
.scene-rain{position:absolute;inset:0;pointer-events:none;z-index:2;opacity:0;transition:opacity 2s}
.scene-rain.active{opacity:1}
.raindrop{position:absolute;width:1.5px;background:linear-gradient(180deg,transparent,rgba(200,220,240,.6));border-radius:100px;animation:raindrop linear infinite}
@keyframes raindrop{0%{transform:translateY(-20px)}100%{transform:translateY(102%)}}

/* CHARACTERS */
.char-row{position:absolute;bottom:0;left:0;right:0;display:flex;align-items:flex-end;justify-content:space-around;padding:0 8px 4px;z-index:3}
.char-seat{display:flex;flex-direction:column;align-items:center;cursor:pointer;position:relative;transition:transform .15s}
.char-seat.on-cooldown{cursor:not-allowed}
.char-seat:not(.on-cooldown):active{transform:scale(.93)}
@keyframes readyBounce{0%,100%{transform:translateY(0) scale(1)}25%{transform:translateY(-10px) scale(1.15)}55%{transform:translateY(2px) scale(.95)}75%{transform:translateY(-5px) scale(1.08)}}
.char-seat.just-ready{animation:readyBounce .7s ease}
.cooldown-ring{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:52px;height:52px;pointer-events:none;opacity:0;transition:opacity .2s}
.char-seat.on-cooldown .cooldown-ring{opacity:1}
.cooldown-track{fill:none;stroke:var(--cream-deep);stroke-width:3}
.cooldown-fill{fill:none;stroke:var(--rose-deep);stroke-width:3;stroke-linecap:round;transform-origin:26px 26px;transform:rotate(-90deg);transition:stroke-dashoffset .25s linear}
.cooldown-timer{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:800;color:var(--rose-deep);background:rgba(255,253,248,.9);border-radius:100px;padding:1px 5px;pointer-events:none;opacity:0;white-space:nowrap}
.char-seat.on-cooldown .cooldown-timer{opacity:1}
.char-seat.on-cooldown .char-emoji{opacity:.45;filter:grayscale(.4)}
.char-emoji{font-size:36px;line-height:1;filter:drop-shadow(0 3px 6px rgba(74,53,40,.2));animation:charBob 3s ease-in-out infinite}
.char-seat:nth-child(1) .char-emoji{animation-delay:0s}
.char-seat:nth-child(2) .char-emoji{animation-delay:.7s}
.char-seat:nth-child(3) .char-emoji{animation-delay:1.4s}
.char-seat:nth-child(4) .char-emoji{animation-delay:2.1s}
@keyframes charBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.char-seat.excited .char-emoji{animation:charPop .45s ease}
@keyframes charPop{0%,100%{transform:scale(1)}40%{transform:scale(1.28) rotate(-8deg)}70%{transform:scale(1.15) rotate(5deg)}}
.char-label{font-size:9px;font-weight:800;color:var(--cocoa-soft);background:rgba(255,253,248,.75);border-radius:100px;padding:1px 6px;margin-top:1px}
.char-hat{position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:18px;pointer-events:none}

/* PETALS */
.petal-layer{position:absolute;inset:0;pointer-events:none;z-index:4;overflow:hidden}
.petal{position:absolute;pointer-events:none;opacity:0;font-size:14px}
@keyframes petalDrift{0%{transform:translate(0,0) rotate(0deg);opacity:0}10%{opacity:.8}90%{opacity:.6}100%{transform:translate(var(--dx,40px),110px) rotate(360deg);opacity:0}}

/* CLICKER */
.clicker-area{flex-shrink:0;display:flex;flex-direction:column;align-items:center;padding:8px 0 5px}
.biscuit-tin{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;width:100px;height:100px}
.tin-glow{position:absolute;inset:-10px;border-radius:50%;background:radial-gradient(circle,rgba(244,182,194,.35) 0%,transparent 70%);animation:glowPulse 2.8s ease-in-out infinite;pointer-events:none}
@keyframes glowPulse{0%,100%{transform:scale(1);opacity:.6}50%{transform:scale(1.2);opacity:1}}
.tin-emoji{font-size:72px;line-height:1;animation:tinFloat 3.5s ease-in-out infinite;filter:drop-shadow(0 6px 14px rgba(74,53,40,.18));pointer-events:none}
@keyframes tinFloat{0%,100%{transform:translateY(0) rotate(-1deg)}50%{transform:translateY(-6px) rotate(1deg)}}
.biscuit-tin.tapped .tin-emoji{animation:none;transform:scale(.88) rotate(-6deg) !important}
.biscuits-label{font-family:'Fraunces',serif;font-weight:700;font-size:15px;color:var(--cocoa);letter-spacing:-.01em;margin-top:3px}
.biscuits-label span{color:var(--rose-deep);font-style:italic;font-weight:400}
.rate-label{font-size:11px;color:var(--cocoa-soft);font-weight:700;margin-top:1px}

/* CLICK FX */
.click-pop{position:fixed;pointer-events:none;font-family:'Fraunces',serif;font-size:17px;font-weight:700;color:var(--rose-deep);animation:clickPop .75s ease-out forwards;z-index:999}
@keyframes clickPop{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-55px) scale(.7)}}
.click-biscuit{position:fixed;pointer-events:none;font-size:22px;animation:biscuitFly .85s ease-out forwards;z-index:999}
@keyframes biscuitFly{0%{opacity:1;transform:translate(0,0) scale(1) rotate(0deg)}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4) rotate(var(--rot))}}

/* TABS */
.tabs{display:flex;gap:4px;flex-shrink:0;padding:0 2px}
.tab-btn{flex:1;background:var(--milk);border:2px solid var(--cream-deep);color:var(--cocoa-soft);font-family:'Nunito',sans-serif;font-size:10px;font-weight:800;padding:7px 2px;border-radius:14px 14px 0 0;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;transition:all .2s}
.tab-btn .tab-icon{font-size:16px}
.tab-btn.active{background:var(--milk);color:var(--cocoa);border-color:var(--cocoa-soft);border-bottom-color:var(--milk);box-shadow:0 -2px 8px rgba(74,53,40,.06)}

/* PANEL */
.panel{flex:1;background:var(--milk);border:2px solid var(--cocoa-soft);border-radius:0 0 18px 18px;overflow-y:auto;overflow-x:hidden;padding:10px 12px;-webkit-overflow-scrolling:touch;min-height:0}
.panel::-webkit-scrollbar{display:none}

/* HELPERS */
.helper-list{display:flex;flex-direction:column;gap:7px}
.helper-row{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--cream);border:2px solid var(--cream-deep);border-radius:14px;cursor:pointer;transition:border-color .2s,background .15s,transform .1s;position:relative;overflow:hidden}
.helper-row::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(244,182,194,.06) 0%,transparent 60%);pointer-events:none}
.helper-row.affordable{border-color:var(--rose-deep)}
.helper-row.affordable:active{transform:scale(.98);background:#FFF0F4}
.helper-row.cant-afford{opacity:.6}
.helper-emoji{font-size:30px;flex-shrink:0;line-height:1}
.helper-body{flex:1;min-width:0}
.helper-name{font-family:'Fraunces',serif;font-weight:700;font-size:14px;color:var(--cocoa)}
.helper-desc{font-size:11px;color:var(--cocoa-soft);margin-top:1px}
.helper-right{display:flex;flex-direction:column;align-items:flex-end;gap:2px;flex-shrink:0}
.helper-count{font-family:'Fraunces',serif;font-size:20px;font-weight:700;color:var(--rose-deep);line-height:1}
.helper-cost{font-size:11px;font-weight:800;color:var(--cocoa-soft)}
.helper-cost.too-much{color:var(--cream-deep)}

/* UPGRADES */
.upgrade-list{display:flex;flex-direction:column;gap:7px}
.upgrade-row{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--cream);border:2px solid var(--cream-deep);border-radius:14px;cursor:pointer;transition:border-color .2s,transform .1s;position:relative}
.upgrade-row.affordable{border-color:var(--mint-deep)}
.upgrade-row.affordable:active{transform:scale(.98)}
.upgrade-row.bought{opacity:.45;pointer-events:none}
.upgrade-row.cant-afford{opacity:.55}
.upgrade-emoji{font-size:32px;flex-shrink:0}
.upgrade-body{flex:1;min-width:0}
.upgrade-name{font-family:'Fraunces',serif;font-weight:700;font-size:14px;color:var(--cocoa)}
.upgrade-desc{font-size:11px;color:var(--cocoa-soft);margin-top:1px}
.upgrade-cost{font-size:12px;font-weight:800;color:var(--cocoa-soft);flex-shrink:0}
.upgrade-cost.too-much{color:var(--cream-deep)}
.upgrade-tick{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:18px}
.upgrade-lvl{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-family:'Fraunces',serif;font-size:12px;font-weight:700;color:var(--mint-deep);background:var(--mint);border-radius:100px;padding:2px 8px}
.event-banner{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);background:linear-gradient(135deg,var(--sun),#E8A830);border:3px solid #C88A10;border-radius:22px;padding:18px 24px;text-align:center;z-index:400;box-shadow:0 12px 40px rgba(74,53,40,.3);cursor:pointer;transition:transform .3s cubic-bezier(.34,1.56,.64,1);max-width:300px;width:88vw}
.event-banner.show{transform:translate(-50%,-50%) scale(1)}
.event-banner-emoji{font-size:48px;margin-bottom:6px}
.event-banner-title{font-family:'Fraunces',serif;font-size:20px;font-weight:900;color:var(--cocoa);margin-bottom:4px}
.event-banner-desc{font-size:13px;color:var(--cocoa-soft);margin-bottom:12px;line-height:1.5}
.event-banner-btn{background:var(--cocoa);color:var(--cream);border:none;border-radius:100px;padding:10px 22px;font-family:'Fraunces',serif;font-size:14px;font-weight:700;cursor:pointer}

/* ACHIEVEMENTS */
.ach-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.ach-card{background:var(--cream);border:2px solid var(--cream-deep);border-radius:14px;padding:10px;text-align:center}
.ach-card.unlocked{border-color:var(--mint-deep)}
.ach-card.locked{opacity:.45}
.ach-card-icon{font-size:28px;margin-bottom:3px}
.ach-card-name{font-family:'Fraunces',serif;font-weight:700;font-size:12px;color:var(--cocoa);line-height:1.2}
.ach-card-desc{font-size:10px;color:var(--cocoa-soft);margin-top:2px;line-height:1.3}
.ach-card-badge{font-size:11px;color:var(--mint-deep);font-weight:800;margin-top:3px}

/* STATS */
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.stat-card{background:var(--cream);border:2px solid var(--cream-deep);border-radius:14px;padding:12px 10px;text-align:center}
.stat-card-value{font-family:'Fraunces',serif;font-size:20px;font-weight:900;color:var(--rose-deep);line-height:1.1;word-break:break-all}
.stat-card-label{font-size:11px;color:var(--cocoa-soft);margin-top:4px;font-weight:700}
.stats-section-title{font-family:'Fraunces',serif;font-size:13px;font-weight:700;color:var(--cocoa-soft);text-transform:uppercase;letter-spacing:.08em;margin:12px 0 6px}
.stats-section-title:first-child{margin-top:0}
.prestige-panel{background:linear-gradient(135deg,#FFF9E8,#FFF0D8);border:2px solid var(--sun);border-radius:16px;padding:14px;text-align:center;margin-top:10px}
.prestige-panel h3{font-family:'Fraunces',serif;font-size:18px;font-weight:900;margin-bottom:6px}
.prestige-panel p{font-size:12px;color:var(--cocoa-soft);line-height:1.6;margin-bottom:8px}
.prestige-btn{background:linear-gradient(135deg,var(--sun),#E8A830);border:none;border-radius:100px;padding:10px 24px;font-family:'Fraunces',serif;font-size:15px;font-weight:700;color:var(--cocoa);cursor:pointer;box-shadow:0 4px 12px rgba(245,199,106,.4);transition:transform .15s}
.prestige-btn:active{transform:scale(.97)}
.prestige-btn:disabled{opacity:.4;pointer-events:none}

/* TOAST */
.toast{position:fixed;top:calc(var(--safe-top) + 16px);left:50%;transform:translateX(-50%) translateY(-120px);background:var(--cocoa);color:var(--cream);padding:11px 22px;border-radius:100px;font-family:'Fraunces',serif;font-weight:700;font-size:14px;box-shadow:var(--shadow-card);transition:transform .35s ease;z-index:500;pointer-events:none;max-width:88vw;text-align:center}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.achievement{background:var(--sun);color:var(--cocoa)}
.toast.milestone{background:var(--rose-deep);color:var(--milk)}

/* MODAL */
.modal-backdrop{position:fixed;inset:0;background:rgba(74,53,40,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:300;padding:20px}
.modal-backdrop.show{display:flex}
.modal{background:var(--cream);border-radius:24px;padding:22px 20px;max-width:420px;width:100%;max-height:85vh;overflow-y:auto;-webkit-overflow-scrolling:touch;box-shadow:var(--shadow-card);border:2px dashed var(--cream-deep)}
.modal-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.modal-title{font-family:'Fraunces',serif;font-size:22px;font-weight:900}
.modal-title em{font-style:italic;color:var(--rose-deep);font-weight:400}
.modal-close{background:var(--milk);border:2px solid var(--cream-deep);width:34px;height:34px;border-radius:50%;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.char-bio{text-align:center;padding:4px 0 12px}
.char-bio-avatar{font-size:56px;margin-bottom:8px}
.char-bio-name{font-family:'Fraunces',serif;font-size:20px;font-weight:900;margin-bottom:3px}
.char-bio-role{font-size:12px;color:var(--cocoa-soft);margin-bottom:12px}
.char-bio-biscuit{background:var(--milk);border:2px dashed var(--cream-deep);border-radius:14px;padding:10px 14px;text-align:left;margin-bottom:10px}
.char-bio-biscuit strong{color:var(--cocoa)}
.char-bio-biscuit p{font-size:12px;color:var(--cocoa-soft);line-height:1.6;margin-top:4px}
.offline-modal{text-align:center;padding:8px 0}
.offline-modal .big-emoji{font-size:56px;margin-bottom:12px}
.offline-modal h3{font-family:'Fraunces',serif;font-size:22px;font-weight:900;margin-bottom:6px}
.offline-modal p{font-size:13px;color:var(--cocoa-soft);line-height:1.7;margin-bottom:12px}
.offline-amount{font-family:'Fraunces',serif;font-size:32px;font-weight:900;color:var(--rose-deep);margin:8px 0}
.offline-collect-btn{background:var(--cocoa);color:var(--cream);border:none;border-radius:100px;padding:12px 28px;font-family:'Fraunces',serif;font-size:16px;font-weight:700;cursor:pointer;transition:transform .15s}
.offline-collect-btn:active{transform:scale(.97)}

/* BOTTOMBAR */
.bottombar{display:flex;gap:6px;padding-top:6px;flex-shrink:0}
.bb-btn{flex:1;background:var(--milk);border:2px solid var(--cream-deep);color:var(--cocoa);font-family:'Nunito',sans-serif;font-weight:700;font-size:10px;padding:8px 5px;border-radius:14px;cursor:pointer;transition:all .2s;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:var(--shadow-soft)}
.bb-btn:active{transform:scale(.96)}
.bb-btn.active-audio{background:var(--cocoa);color:var(--cream);border-color:var(--cocoa)}
.bb-icon{font-size:17px;line-height:1}

/* ══ SITE BACK STRIP ═══════════════════════════════════════ */
.jvds-strip{
  position:fixed;top:0;left:0;right:0;z-index:9999;
  height:0;overflow:hidden;
  transition:height .25s ease;
  background:rgba(10,10,18,0.97);
  backdrop-filter:blur(12px);
  border-bottom:1px solid rgba(240,234,214,.08);
  font-family:'Inter','Segoe UI',sans-serif;
}
.jvds-strip.open{height:48px;}
.jvds-strip-inner{
  height:48px;display:flex;align-items:center;
  padding:0 14px;gap:8px;
}
.jvds-strip-logo{
  font-size:.82rem;font-weight:800;
  color:#F0EAD6;text-decoration:none;
  font-family:'Fredoka',cursive;
  margin-right:auto;
}
.jvds-strip-links{display:flex;align-items:center;gap:2px;}
.jvds-strip-links a{
  font-size:.72rem;font-weight:600;
  color:rgba(240,234,214,.65);
  padding:4px 8px;border-radius:6px;
  text-decoration:none;white-space:nowrap;
  transition:background .15s,color .15s;
}
.jvds-strip-links a:hover{background:rgba(255,255,255,.08);color:#F0EAD6;}
.jvds-strip-links a.hl{
  background:rgba(112,163,167,.18);color:#93d8d0;
  border:1px solid rgba(112,163,167,.25);
}
.jvds-strip-close{
  background:none;border:none;
  color:rgba(240,234,214,.5);
  font-size:1rem;cursor:pointer;
  padding:4px 6px;line-height:1;
  flex-shrink:0;
}
/* Tab that peeks out when strip is closed */
.jvds-tab{
  position:fixed;top:0;left:50%;transform:translateX(-50%);
  z-index:9999;
  background:rgba(10,10,18,0.9);
  border:1px solid rgba(240,234,214,.1);
  border-top:none;border-radius:0 0 8px 8px;
  padding:3px 14px 4px;
  font-size:.6rem;font-weight:700;
  letter-spacing:.08em;text-transform:uppercase;
  color:rgba(240,234,214,.5);
  cursor:pointer;transition:color .15s,background .15s;
  font-family:'Inter','Segoe UI',sans-serif;
}
.jvds-tab:hover{color:#F0EAD6;background:rgba(10,10,18,.98);}
.jvds-tab.hidden{display:none;}
/* Nudge game canvas down when strip is open */
.jvds-strip.open ~ * { transition: margin-top .25s ease; }

// ══ AUDIO ENGINE (ported from Cozy Cafe) ══
const Audio = (() => {
  let ctx=null,masterGain=null,musicGain=null,sfxGain=null,musicPlaying=false,musicTimer=null;
  function init(){
    if(ctx)return;
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
    ctx=new AC();
    masterGain=ctx.createGain(); masterGain.gain.value=0.6; masterGain.connect(ctx.destination);
    musicGain=ctx.createGain(); musicGain.gain.value=0; musicGain.connect(masterGain);
    sfxGain=ctx.createGain(); sfxGain.gain.value=0.5; sfxGain.connect(masterGain);
  }
  function tone({freq=440,dur=0.15,type='sine',vol=0.3,attack=0.01}){
    if(!ctx)return;
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type=type; o.frequency.setValueAtTime(freq,ctx.currentTime);
    g.gain.setValueAtTime(0,ctx.currentTime);
    g.gain.linearRampToValueAtTime(vol,ctx.currentTime+attack);
    g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+dur);
    o.connect(g); g.connect(sfxGain); o.start(); o.stop(ctx.currentTime+dur+0.05);
  }
  function sfxTap(){
    tone({freq:520,dur:0.09,type:'sine',vol:0.13,attack:0.005});
    tone({freq:380,dur:0.12,type:'triangle',vol:0.07,attack:0.005});
  }
  function sfxCharDrop(semi=0){
    const b=523.25*Math.pow(2,semi/12);
    [b,b*1.25,b*1.5].forEach((f,i)=>setTimeout(()=>tone({freq:f,dur:0.4,type:'sine',vol:0.17,attack:0.01}),i*70));
  }
  function sfxAchievement(){
    [659,784,987,1175].forEach((n,i)=>setTimeout(()=>tone({freq:n,dur:0.3,type:'triangle',vol:0.19}),i*90));
  }
  function sfxPrestige(){
    [523,659,784,1047,1319].forEach((n,i)=>setTimeout(()=>tone({freq:n,dur:0.5,type:'sine',vol:0.21}),i*100));
  }
  function startMusic(){
    if(!ctx||musicPlaying)return;
    musicPlaying=true;
    musicGain.gain.cancelScheduledValues(ctx.currentTime);
    musicGain.gain.setValueAtTime(musicGain.gain.value,ctx.currentTime);
    musicGain.gain.linearRampToValueAtTime(0.28,ctx.currentTime+1.5);
    const prog=[[261.63,329.63,392,493.88],[220,261.63,329.63,392],[174.61,220,261.63,329.63],[196,246.94,293.66,349.23]];
    let ci=0; const bl=2.4;
    function chord(){
      if(!musicPlaying)return;
      const ch=prog[ci],st=ctx.currentTime;
      ch.forEach(fr=>{
        const o=ctx.createOscillator(),g=ctx.createGain(),f=ctx.createBiquadFilter();
        o.type='sine'; o.frequency.value=fr; f.type='lowpass'; f.frequency.value=1400;
        g.gain.setValueAtTime(0,st); g.gain.linearRampToValueAtTime(0.052,st+0.4);
        g.gain.linearRampToValueAtTime(0.032,st+bl-0.3); g.gain.linearRampToValueAtTime(0,st+bl);
        o.connect(f); f.connect(g); g.connect(musicGain); o.start(st); o.stop(st+bl+0.1);
      });
      ch.forEach((fr,i)=>{
        const t=st+i*(bl/8)+Math.random()*0.04;
        const o=ctx.createOscillator(),g=ctx.createGain();
        o.type='triangle'; o.frequency.value=fr*2;
        g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(0.032,t+0.02); g.gain.exponentialRampToValueAtTime(0.001,t+0.5);
        o.connect(g); g.connect(musicGain); o.start(t); o.stop(t+0.6);
      });
      ci=(ci+1)%prog.length; musicTimer=setTimeout(chord,bl*1000);
    }
    chord();
  }
  function stopMusic(){
    if(!ctx||!musicPlaying)return; musicPlaying=false;
    musicGain.gain.cancelScheduledValues(ctx.currentTime);
    musicGain.gain.linearRampToValueAtTime(0,ctx.currentTime+0.8);
    if(musicTimer)clearTimeout(musicTimer);
  }
  function isMusicPlaying(){return musicPlaying}
  return{init,sfxTap,sfxCharDrop,sfxAchievement,sfxPrestige,startMusic,stopMusic,isMusicPlaying};
})();

}
function loadVault(){
  try{
    const raw=localStorage.getItem(VAULT_KEY); if(!raw)return defaultVault();
    const v=JSON.parse(raw);
    if(!v.biscuit)v.biscuit=defaultVault().biscuit;
    const db=defaultVault().biscuit;
    for(const k of Object.keys(db))if(v.biscuit[k]===undefined)v.biscuit[k]=db[k];
    if(!v.biscuit.charTaps)v.biscuit.charTaps={fox:0,tiger:0,turtle:0,axolotl:0};
    if(!v.stats)v.stats=defaultVault().stats;
    if(!v.stats.guests_each)v.stats.guests_each={};
    if(!v.unlocked_items)v.unlocked_items=['cafe_default','trail_petal','skin_default'];
    if(!v.equipped)v.equipped={background:'cafe_default',trail:'trail_petal',skin:'skin_default'};
    return v;
  }catch{return defaultVault();}
}

// ══ RUNTIME ══
let clickPower=1,productionRate=0,lastTick=Date.now(),activeTab='helpers';
const charReady={fox:0,tiger:0,turtle:0,axolotl:0};
const charWasCD={fox:false,tiger:false,turtle:false,axolotl:false};
const CIRC=138.2;
let milestonesHit=new Set();

function fmt(n){
  n=Math.floor(n);
  if(n>=1e9)return(n/1e9).toFixed(1)+'B';
  if(n>=1e6)return(n/1e6).toFixed(1)+'M';
  if(n>=1e3)return(n/1e3).toFixed(1)+'K';
  return n.toString();
}

function recalc(){
  let cp=1;
  for(const up of UPGRADES){
    if(up.type==='click'&&bv().upgrades.includes(up.id))cp*=up.mult;
    if(up.type==='repeat_click'){const lvl=bv().repeatUpgrades?.[up.id]||0;if(lvl>0)cp*=Math.pow(up.mult,lvl);}
  }
  clickPower=cp*(bv().prestigeBonus||1);
  let gm=1;
  for(const up of UPGRADES){
    if(up.type==='global'&&bv().upgrades.includes(up.id))gm*=up.mult;
    if(up.type==='repeat_global'){const lvl=bv().repeatUpgrades?.[up.id]||0;if(lvl>0)gm*=Math.pow(up.mult,lvl);}
  }
  let rate=0;
  for(const h of HELPERS){
    const cnt=bv().helpers[h.id]||0; if(!cnt)continue;
    let hm=1;
    for(const up of UPGRADES)if(up.type==='helper'&&up.target===h.id&&bv().upgrades.includes(up.id))hm*=up.mult;
    rate+=h.baseRate*cnt*hm;
  }
  productionRate=rate*gm*(bv().prestigeBonus||1);
}

// ══ TICK ══
function tick(){
  const now=Date.now(),dt=Math.min((now-lastTick)/1000,5);
  lastTick=now;
  if(productionRate>0){
    const g=productionRate*dt;
    bv().total+=g; bv().lifetime+=g;
    vault.coins+=g*0.1;
    vault.stats.lifetime_coins=(vault.stats.lifetime_coins||0)+g*0.1;
    trackDailyProgress('earn',g);
  }
  checkMilestones(); updateHUD(); checkAchievements();
  requestAnimationFrame(tick);
}

// ══ MILESTONES ══
function checkMilestones(){
  for(const m of MILESTONES){
    if(!milestonesHit.has(m.n)&&bv().lifetime>=m.n){
      milestonesHit.add(m.n); showToast(m.msg,'milestone');
    }
  }
}
function seedMilestones(){for(const m of MILESTONES)if(bv().lifetime>=m.n)milestonesHit.add(m.n);}

// ══ HUD ══
function updateHUD(){
  const total=Math.floor(bv().total);
  document.getElementById('coinCount').textContent=fmt(total);
  document.getElementById('happyCount').textContent=vault.happiness;
  document.getElementById('biscuitsLabel').innerHTML=fmt(total)+' <span>biscuits</span>';
  const prestige=bv().prestige||0;
  const badge=document.getElementById('prestigeBadge');
  badge.classList.toggle('visible',prestige>0);
  document.getElementById('prestigeCount').textContent=prestige;
  const rps=productionRate;
  document.getElementById('rateLabel').textContent=rps>0?(rps>=1?fmt(rps):rps.toFixed(1))+' biscuits / sec':'tap the tin!';
  // Hat on all four characters from shared vault
  const hat=vault.equipped&&vault.equipped.hat;
  const hatEmoji=hat?(HAT_EMOJIS[hat]||''):'';
  ['fox','tiger','turtle','axolotl'].forEach(id=>{
    const el=document.getElementById('hat-'+id);
    if(el)el.textContent=hatEmoji;
  });
}

// ══ COOLDOWN RINGS + READY BOUNCE ══
function updateCooldownRings(){
  const now=Date.now();
  for(const id of Object.keys(charReady)){
    const seat=document.getElementById('cs-'+id);
    const ring=document.getElementById('ring-'+id);
    const timer=document.getElementById('timer-'+id);
    if(!seat||!ring||!timer)continue;
    const readyAt=charReady[id],char=CHARACTERS[id],totalMs=char.cooldown*1000;
    if(now>=readyAt){
      if(charWasCD[id]){
        charWasCD[id]=false;
        seat.classList.add('just-ready');
        setTimeout(()=>seat.classList.remove('just-ready'),700);
      }
      seat.classList.remove('on-cooldown'); ring.style.strokeDashoffset=0; timer.textContent='';
    } else {
      charWasCD[id]=true; seat.classList.add('on-cooldown');
      const rem=readyAt-now,prog=rem/totalMs;
      ring.style.strokeDashoffset=CIRC*(1-prog);
      const s=Math.ceil(rem/1000);
      timer.textContent=s>=60?Math.ceil(s/60)+'m':s+'s';
    }
  }
}
setInterval(updateCooldownRings,250);

// ══ CLICK ══
function doClick(x,y){
  Audio.init(); Audio.sfxTap();
  const gained=clickPower;
  bv().total+=gained; bv().lifetime+=gained; bv().clicks=(bv().clicks||0)+1;
  const tin=document.getElementById('tinBtn');
  tin.classList.add('tapped'); setTimeout(()=>tin.classList.remove('tapped'),140);
  spawnClickPop(x,y,'+'+fmt(gained));
  for(let i=0;i<Math.min(3,Math.ceil(gained));i++)spawnBiscuit(x,y);
  trackDailyProgress('earn',gained);
  updateHUD(); saveVault(); checkAchievements(); trackDailyProgress('tap');
  if(activeTab==='helpers'||activeTab==='upgrades')renderPanel();
}
function spawnClickPop(x,y,text){
  const el=document.createElement('div'); el.className='click-pop'; el.textContent=text;
  el.style.left=(x-20)+'px'; el.style.top=(y-20)+'px';
  document.body.appendChild(el); setTimeout(()=>el.remove(),750);
}
function spawnBiscuit(x,y){
  const el=document.createElement('div'); el.className='click-biscuit'; el.textContent='🍪';
  const a=Math.random()*Math.PI*2,d=35+Math.random()*50;
  el.style.setProperty('--dx',Math.cos(a)*d+'px'); el.style.setProperty('--dy',Math.sin(a)*d-20+'px');
  el.style.setProperty('--rot',(Math.random()*360-180)+'deg');
  el.style.left=x+'px'; el.style.top=y+'px';
  document.body.appendChild(el); setTimeout(()=>el.remove(),850);
}
function spawnCharBiscuit(x,y,emoji,color){
  const el=document.createElement('div'); el.className='click-biscuit'; el.textContent=emoji;
  el.style.fontSize='24px'; el.style.filter=`drop-shadow(0 0 6px ${color}88)`;
  const a=Math.random()*Math.PI*2,d=45+Math.random()*70;
  el.style.setProperty('--dx',Math.cos(a)*d+'px'); el.style.setProperty('--dy',Math.sin(a)*d-30+'px');
  el.style.setProperty('--rot',(Math.random()*360-180)+'deg');
  el.style.left=x+'px'; el.style.top=y+'px';
  document.body.appendChild(el); setTimeout(()=>el.remove(),1000);
}

// ══ CHARACTER TAPS ══
document.querySelectorAll('.char-seat').forEach(el=>{
  let pressTimer;
  el.addEventListener('click',()=>{
    Audio.init();
    const id=el.dataset.char;
    if(Date.now()<charReady[id])return;
    const char=CHARACTERS[id];
    charReady[id]=Date.now()+char.cooldown*1000; charWasCD[id]=true;
    bv().charTaps[id]=(bv().charTaps[id]||0)+1;
    const gained=char.biscuitValue*(bv().prestigeBonus||1);
    bv().total+=gained; bv().lifetime+=gained;
    el.classList.add('excited'); setTimeout(()=>el.classList.remove('excited'),500);
    const r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
    spawnClickPop(cx,cy,'+'+fmt(gained)+' '+char.biscuitEmoji);
    for(let i=0;i<6;i++)spawnCharBiscuit(cx,cy,char.biscuitEmoji,char.color);
    Audio.sfxCharDrop(char.semi);
    showToast(`${char.emoji} ${char.biscuitEmoji} ${char.biscuit}! +${fmt(gained)}`);
    trackDailyProgress('earn',gained); trackDailyProgress('char');
    updateHUD(); updateCooldownRings(); saveVault(); checkAchievements();
  });
  el.addEventListener('touchstart',()=>{pressTimer=setTimeout(()=>showBio(el.dataset.char),600);});
  el.addEventListener('touchend',()=>clearTimeout(pressTimer));
  el.addEventListener('mousedown',()=>{pressTimer=setTimeout(()=>showBio(el.dataset.char),600);});
  el.addEventListener('mouseup',()=>clearTimeout(pressTimer));
  el.addEventListener('mouseleave',()=>clearTimeout(pressTimer));
});

function showBio(id){
  const c=CHARACTERS[id],taps=bv().charTaps[id]||0,now=Date.now();
  const ready=charReady[id]<=now,rem=ready?0:Math.ceil((charReady[id]-now)/1000);
  const cdText=ready?'Ready to bake!':''+( rem>=60?Math.ceil(rem/60)+'min':rem+'s')+' remaining';
  document.getElementById('bioTitle').innerHTML=c.emoji+' '+c.name;
  document.getElementById('bioContent').innerHTML=`<div class="char-bio"><div class="char-bio-avatar">${c.emoji}</div><div class="char-bio-name">${c.name}</div><div class="char-bio-role">${c.role}</div><div class="char-bio-biscuit"><strong>${c.biscuitEmoji} ${c.biscuit} — ${c.biscuitValue} biscuits per tap</strong><p>${cdText} · ${c.cooldown>=60?c.cooldown/60+'min cooldown':c.cooldown+'s cooldown'}</p></div><div class="char-bio-biscuit"><strong>About</strong><p>${c.desc}</p></div><div class="char-bio-biscuit"><strong>🍪 Times helped: ${taps}</strong><p>${c.facts.join('<br>')}</p></div></div>`;
  document.getElementById('bioModal').classList.add('show');
}

function renderHelpers(el){
  el.innerHTML='';
  const list=document.createElement('div'); list.className='helper-list';
  HELPERS.forEach(h=>{
    const cnt=bv().helpers[h.id]||0,cost=Math.floor(h.baseCost*Math.pow(h.costMult,cnt)),canAfford=Math.floor(bv().total)>=cost;
    let hm=1,gm=1;
    for(const up of UPGRADES){if(up.type==='helper'&&up.target===h.id&&bv().upgrades.includes(up.id))hm*=up.mult;if(up.type==='global'&&bv().upgrades.includes(up.id))gm*=up.mult;}
    const eff=h.baseRate*hm*gm*(bv().prestigeBonus||1);
    const row=document.createElement('div'); row.className='helper-row '+(canAfford?'affordable':'cant-afford');
    row.innerHTML=`<div class="helper-emoji">${h.emoji}</div><div class="helper-body"><div class="helper-name">${h.name}</div><div class="helper-desc">${h.desc} · ${eff>=1?fmt(eff):eff.toFixed(1)}/sec each</div></div><div class="helper-right"><div class="helper-count">${cnt}</div><div class="helper-cost ${canAfford?'':'too-much'}">🍪 ${fmt(cost)}</div></div>`;
    row.addEventListener('click',()=>{
      if(Math.floor(bv().total)<cost)return;
      bv().total-=cost; bv().helpers[h.id]=(bv().helpers[h.id]||0)+1; bv().helpersOwned=(bv().helpersOwned||0)+1;
      recalc(); renderPanel(); showToast(h.emoji+' '+h.name+' joined the cafe!'); trackDailyProgress('buy'); saveVault(); checkAchievements();
    });
    list.appendChild(row);
  });
  el.appendChild(list);
}
function renderUpgrades(el){
  el.innerHTML='';
  const list=document.createElement('div'); list.className='upgrade-list';
  UPGRADES.forEach(up=>{
    const isRepeat=up.type==='repeat_click'||up.type==='repeat_global';
    if(isRepeat){
      if(!bv().repeatUpgrades)bv().repeatUpgrades={};
      const lvl=bv().repeatUpgrades[up.id]||0;
      const cost=Math.floor(up.cost*Math.pow(up.costMult,lvl));
      const canAfford=Math.floor(bv().total)>=cost;
      const row=document.createElement('div'); row.className='upgrade-row '+(canAfford?'affordable':'cant-afford');
      row.innerHTML=`<div class="upgrade-emoji">${up.emoji}</div><div class="upgrade-body"><div class="upgrade-name">${up.name} <span style="font-size:10px;color:var(--mint-deep);font-weight:800">REPEATABLE</span></div><div class="upgrade-desc">${up.desc}</div></div><div class="upgrade-cost ${canAfford?'':'too-much'}">🍪 ${fmt(cost)}</div>${lvl>0?`<div class="upgrade-lvl">Lv ${lvl}</div>`:''}`;
      row.addEventListener('click',()=>{
        if(!bv().repeatUpgrades)bv().repeatUpgrades={};
        const curLvl=bv().repeatUpgrades[up.id]||0;
        const curCost=Math.floor(up.cost*Math.pow(up.costMult,curLvl));
        if(Math.floor(bv().total)<curCost)return;
        bv().total-=curCost; bv().repeatUpgrades[up.id]=(curLvl+1);
        recalc(); renderPanel(); showToast(up.emoji+' '+up.name+' Lv '+(curLvl+1)+'!'); trackDailyProgress('buy'); saveVault(); checkAchievements();
      });
      list.appendChild(row);
    } else {
      const bought=bv().upgrades.includes(up.id),canAfford=!bought&&Math.floor(bv().total)>=up.cost;
      const row=document.createElement('div'); row.className='upgrade-row '+(bought?'bought':canAfford?'affordable':'cant-afford');
      row.innerHTML=`<div class="upgrade-emoji">${up.emoji}</div><div class="upgrade-body"><div class="upgrade-name">${up.name}</div><div class="upgrade-desc">${up.desc}</div></div><div class="upgrade-cost ${(!bought&&!canAfford)?'too-much':''}">🍪 ${fmt(up.cost)}</div>${bought?'<div class="upgrade-tick">✅</div>':''}`;
      if(!bought)row.addEventListener('click',()=>{
        if(Math.floor(bv().total)<up.cost)return;
        bv().total-=up.cost; bv().upgrades.push(up.id);
        recalc(); renderPanel(); showToast(up.emoji+' '+up.name+' unlocked!'); trackDailyProgress('buy'); saveVault(); checkAchievements();
      });
      list.appendChild(row);
    }
  });
  el.appendChild(list);
}
function renderAchievements(el){
  el.innerHTML='';
  const grid=document.createElement('div'); grid.className='ach-grid';
  ACHIEVEMENTS.forEach(a=>{
    const unlocked=vault.achievements.includes(a.id);
    const card=document.createElement('div'); card.className='ach-card '+(unlocked?'unlocked':'locked');
    card.innerHTML=`<div class="ach-card-icon">${a.emoji}</div><div class="ach-card-name">${a.name}</div><div class="ach-card-desc">${a.desc}</div>${unlocked?'<div class="ach-card-badge">Earned!</div>':''}`;
    grid.appendChild(card);
  });
  el.appendChild(grid);
}
function getDailyChallenge(){
  const today=new Date().toISOString().slice(0,10);
  const seed=today.split('-').reduce((a,b)=>a*31+parseInt(b),0);
  const pool=DAILY_POOL,p=pool[seed%pool.length];
  const tier=(seed>>4)%3;
  return{...p,today,target:p.amounts[tier],reward:p.rewards[tier]};
}
function trackDailyProgress(key,amount=1){
  const ch=getDailyChallenge();
  if(ch.key!==key)return;
  if(!bv().dailyChallenge||bv().dailyChallenge.date!==ch.today){
    bv().dailyChallenge={date:ch.today,progress:0,claimed:false};
  }
  const dc=bv().dailyChallenge;
  if(dc.claimed)return;
  dc.progress=(dc.progress||0)+amount;
  if(activeTab==='daily')renderPanel();
}
function renderDaily(el){
  const ch=getDailyChallenge();
  const dc=bv().dailyChallenge||{};
  const todayDone=dc.date===ch.today&&dc.claimed;
  const progress=dc.date===ch.today?(dc.progress||0):0;
  const pct=Math.min(100,Math.floor((progress/ch.target)*100));
  const canClaim=progress>=ch.target&&!todayDone;

  el.innerHTML='';

  const title=document.createElement('div');
  title.style.cssText='padding:4px 0 10px;font-family:Fraunces,serif;font-size:17px;font-weight:900;color:var(--cocoa)';
  title.textContent='📅 Today\'s Challenge';
  el.appendChild(title);

  const card=document.createElement('div');
  card.style.cssText='background:linear-gradient(135deg,#FFF9E8,#FFF0D8);border:2px solid var(--sun);border-radius:18px;padding:16px 14px;margin-bottom:14px';
  el.appendChild(card);

  card.innerHTML=`
    <div style="font-size:32px;margin-bottom:6px">${ch.emoji}</div>
    <div style="font-family:Fraunces,serif;font-weight:700;font-size:17px;color:var(--cocoa);margin-bottom:4px">${ch.name}</div>
    <div style="font-size:12px;color:var(--cocoa-soft);line-height:1.6;margin-bottom:12px">${ch.desc.replace('{n}',ch.target.toLocaleString())}</div>
    <div style="background:var(--cream-deep);border-radius:100px;height:10px;margin-bottom:6px;overflow:hidden">
      <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,var(--sun),#E8A830);border-radius:100px;transition:width .5s"></div>
    </div>
    <div style="font-size:11px;font-weight:800;color:var(--cocoa-soft);margin-bottom:12px">${Math.floor(progress).toLocaleString()} / ${ch.target.toLocaleString()} · ${pct}%</div>
    <div style="background:var(--milk);border:2px dashed var(--cream-deep);border-radius:12px;padding:8px 12px;font-size:12px;font-weight:800;color:var(--cocoa-soft);margin-bottom:12px">🎁 Reward: +${fmt(ch.reward)} biscuits</div>`;

  if(todayDone){
    const done=document.createElement('div');
    done.style.cssText='text-align:center;font-family:Fraunces,serif;font-size:14px;font-weight:700;color:var(--mint-deep)';
    done.textContent='✅ Claimed! Come back tomorrow.';
    card.appendChild(done);
  } else {
    const btn=document.createElement('button');
    btn.textContent=canClaim?'🎁 Claim Reward!':'Keep baking...';
    btn.style.cssText=`width:100%;background:${canClaim?'linear-gradient(135deg,var(--sun),#E8A830)':'var(--cream-deep)'};border:none;border-radius:100px;padding:11px;font-family:Fraunces,serif;font-size:15px;font-weight:700;color:var(--cocoa);cursor:${canClaim?'pointer':'default'};opacity:${canClaim?1:.5};box-shadow:${canClaim?'0 4px 12px rgba(245,199,106,.4)':'none'}`;
    btn.addEventListener('click',()=>{
      if(!canClaim)return;
      if(!bv().dailyChallenge)bv().dailyChallenge={date:ch.today,progress:0,claimed:false};
      const dc2=bv().dailyChallenge;
      if(dc2.date!==ch.today||dc2.claimed||(dc2.progress||0)<ch.target)return;
      dc2.claimed=true;
      bv().total+=ch.reward; bv().lifetime+=ch.reward;
      showToast('🎉 Challenge complete! +'+fmt(ch.reward)+' 🍪','achievement');
      saveNow(); renderPanel(); updateHUD(); checkAchievements();
    });
    card.appendChild(btn);
  }

  const howTitle=document.createElement('div');
  howTitle.style.cssText='font-family:Fraunces,serif;font-size:13px;font-weight:700;color:var(--cocoa-soft);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px';
  howTitle.textContent='How to earn';
  el.appendChild(howTitle);

  const howBox=document.createElement('div');
  howBox.style.cssText='font-size:12px;color:var(--cocoa-soft);line-height:1.9;background:var(--cream);border:2px solid var(--cream-deep);border-radius:14px;padding:12px 14px';
  howBox.innerHTML=(ch.key==='tap'?'Tap the biscuit tin. Every tap counts!':
    ch.key==='earn'?'Bake biscuits by tapping, helpers, or tapping characters.':
    ch.key==='char'?'Tap any of the four friends in the scene above.':
    'Buy helpers from the Helpers tab or upgrades from the Upgrades tab.')+
    '<br>A new challenge unlocks every day at midnight. 🌙';
  el.appendChild(howBox);
}

  {id:'golden',  emoji:'✨',title:'Golden Biscuit!',   desc:'A shimmering biscuit appeared! Tap to collect a bonus.',   reward:()=>Math.floor((clickPower||1)*50+bv().lifetime*0.001+100)},
  {id:'rush',    emoji:'🔥',title:'Baking Rush!',      desc:'Everyone\'s hungry! Double biscuits for 30 seconds.',      reward:null, duration:30},
  {id:'cat',     emoji:'🐈',title:'The Cat Helped!',   desc:'The cafe cat knocked over the flour. Bonus biscuits!',     reward:()=>Math.floor(productionRate*45+500)},
  {id:'recipe',  emoji:'📖',title:'Secret Recipe Found!',desc:'An ancient recipe was discovered in the tin!',           reward:()=>Math.floor(bv().lifetime*0.005+1000)},
  {id:'rain',    emoji:'🌧️',title:'Biscuit Rain!',     desc:'It\'s raining biscuits! Collect them all!',               reward:()=>Math.floor(productionRate*60+200)},
  {id:'visitor', emoji:'🦊',title:'Special Visitor!',  desc:'A mysterious guest left a gift in the tin!',              reward:()=>Math.floor(Math.random()*5000+500)},
];
let eventActive=false,rushActive=false,rushTimer=null;
function maybeSpawnEvent(){
  if(eventActive||bv().lifetime<100)return;
  if(Math.random()>0.18)return; // ~18% chance each interval
  const ev=RANDOM_EVENTS[Math.floor(Math.random()*RANDOM_EVENTS.length)];
  spawnEvent(ev);
}
function spawnEvent(ev){
  eventActive=true;
  document.getElementById('eventEmoji').textContent=ev.emoji;
  document.getElementById('eventTitle').textContent=ev.title;
  document.getElementById('eventDesc').textContent=ev.desc;
  const btn=document.getElementById('eventBtn');
  btn.textContent='Collect!';
  document.getElementById('eventBanner').classList.add('show');
  // auto-dismiss after 20s
  const autoClose=setTimeout(()=>dismissEvent(),20000);
  btn.onclick=()=>{
    clearTimeout(autoClose);
    dismissEvent();
    if(ev.id==='rush'){
      rushActive=true;
      const prevRate=productionRate;
      productionRate*=2; clickPower*=2;
      showToast('🔥 Baking Rush! 2x for 30 seconds!','achievement');
      if(rushTimer)clearTimeout(rushTimer);
      rushTimer=setTimeout(()=>{rushActive=false;recalc();showToast('🔥 Baking Rush ended!');},30000);
    } else {
      const amount=ev.reward();
      bv().total+=amount; bv().lifetime+=amount;
      updateHUD(); saveVault();
      showToast(ev.emoji+' +'+fmt(amount)+' biscuits!','achievement');
    }
  };
}
function dismissEvent(){
  document.getElementById('eventBanner').classList.remove('show');
  setTimeout(()=>{eventActive=false;},400);
}
setInterval(maybeSpawnEvent,90000); // check every 90s
function renderStats(el){

  const prestige=bv().prestige||0;
  el.innerHTML=`
    <div class="stats-section-title">🍪 Biscuits</div>
    <div class="stats-grid">
      <div class="stat-card"><div class="stat-card-value">${fmt(bv().total)}</div><div class="stat-card-label">In the tin</div></div>
      <div class="stat-card"><div class="stat-card-value">${fmt(bv().lifetime)}</div><div class="stat-card-label">Baked lifetime</div></div>
      <div class="stat-card"><div class="stat-card-value">${productionRate>=1?fmt(productionRate):productionRate.toFixed(1)}</div><div class="stat-card-label">Per second</div></div>
      <div class="stat-card"><div class="stat-card-value">${fmt(bv().clicks||0)}</div><div class="stat-card-label">Total taps</div></div>

      <button class="prestige-btn" id="prestigeBtn" ${bv().lifetime>=100000?'':'disabled'}>🌟 Start a New Season</button>

  document.getElementById('prestigeBtn')?.addEventListener('click',doPrestige);

// ══ PRESTIGE ══
function doPrestige(){
  if(bv().lifetime<100000)return;
  Audio.sfxPrestige();
  bv().prestige=(bv().prestige||0)+1;
  bv().prestigeBonus=(bv().prestigeBonus||1)+0.5;
  bv().total=0; bv().lifetime=0; bv().helpers={}; bv().upgrades=[]; bv().helpersOwned=0;
  recalc(); renderPanel(); updateHUD();
  showToast('🌟 Season '+(bv().prestige+1)+' begins! x'+bv().prestigeBonus.toFixed(1)+' bonus','achievement');
  saveNow(); checkAchievements();
}

// ══ ACHIEVEMENTS ══
function checkAchievements(){
  for(const a of ACHIEVEMENTS){
    if(vault.achievements.includes(a.id))continue;
    if(a.check(vault)){
      vault.achievements.push(a.id); Audio.sfxAchievement();
      const coinReward=a.coins||10;
      vault.coins+=coinReward; vault.happiness+=1;
      showToast(a.emoji+' '+a.name+' +'+coinReward+'✨','achievement');
      saveVault();
      if(activeTab==='achievements')renderPanel();
    }
  }
}

// ══ TOAST ══
let toastQueue=[],toastBusy=false;
function showToast(msg,kind=''){
  if(kind==='achievement'||kind==='milestone')toastQueue.unshift({msg,kind});
  else toastQueue.push({msg,kind});
  processToasts();
}
function processToasts(){
  if(toastBusy||!toastQueue.length)return;
  toastBusy=true;
  const{msg,kind}=toastQueue.shift();
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='toast show '+kind;
  setTimeout(()=>{t.classList.remove('show');setTimeout(()=>{toastBusy=false;processToasts();},380);},kind==='achievement'?2800:2000);
}

// ══ OFFLINE EARNINGS ══
function checkOffline(){
  const lastSave=bv().lastSave||Date.now(),elapsed=(Date.now()-lastSave)/1000;
  if(elapsed<60||productionRate<=0)return;
  const eff=Math.min(elapsed,4*3600),earned=Math.floor(productionRate*eff);
  if(earned<1)return;
  bv().total+=earned; bv().lifetime+=earned;
  const h=Math.floor(eff/3600),m=Math.floor((eff%3600)/60);
  document.getElementById('offlineMsg').textContent=`You were away for ${h>0?h+'h '+m+'m':m+'m'} and your helpers kept baking!`;
  document.getElementById('offlineAmount').textContent='+'+fmt(earned)+' 🍪';
  document.getElementById('offlineModal').classList.add('show');
  saveVault();
}
document.getElementById('offlineCollect').addEventListener('click',()=>{
  document.getElementById('offlineModal').classList.remove('show'); updateHUD();
});

const TRAIL_EMOJIS={trail_petal:['🌸','🌼','✿','❀'],trail_star:['⭐','✨','🌟','💫'],trail_heart:['💗','💕','💖','♡'],trail_bubble:['🫧','○','◯','⚪'],trail_leaf:['🍃','🌿','☘️','🍀'],trail_snow:['❄️','❅','❆','✻'],trail_fire:['🔥','✨','💥','⭐']};
