name: Validate site

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 6 * * *' # daily 06:00 UTC audit — board-data freshness + drift

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Keep private planning out of the public site
        run: npm run validate:public

      - name: Check em dashes (public)
        run: node scripts/check-dashes-ci.js

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Performance budget (school-device profile)
        run: node scripts/check-performance.js

      - name: Validate internal links
        run: npm run validate:links

      - name: Shared resources and challenge regression
        run: npm run test:resources

      - name: Workshop answers and saved completion
        run: npm run test:workshop-answers

      - name: Offline cache and update regression
        run: npm run test:offline

      - name: Offline core hubs and tools (service worker CORE)
        run: npm run test:offline-tools

      - name: Validate CSS
        run: npm run validate:css

      - name: Validate JS
        run: npm run validate:js

      - name: Validate contrast (AA strict)
        run: node validate-contrast.js --strict

      - name: Validate accessibility (strict)
        run: node validate-a11y.js --strict

      - name: Validate workshops
        run: npm run validate:workshops

      - name: Workshop catalogue sync (hub links every workshop)
        run: npm run test:workshop-hub-qa

      - name: Workshop key coverage (every completion key is consumed)
        run: npm run test:workshop-key-coverage

      - name: Workshop hub filters, search and safe resume
        run: npm run test:workshop-hub

      - name: Canvas workshop build-along pages
        run: npm run test:canvas-workshops

      - name: Canvas build-alongs render clean (all pages, 390/1440)
        run: npm run test:canvas-workshops-all

      - name: Canvas preview runs learner code
        run: npm run test:canvas-preview-runtime

      - name: Canvas next-step map integrity
        run: npm run test:canvas-next-integrity

      - name: Non-canvas workshop pages render clean (all pages, 390/1440)
        run: npm run test:workshops-pages-all

      - name: Build a Game in 15 Minutes demo + editor
        run: npm run test:build-a-game-15-min

      - name: Progress + save honesty (progress indicator and where it is saved)
        run: npm run test:progress-save

      - name: Security headers + redirects gate
        run: npm run test:security-headers

      - name: Shared workshop action delegator guard
        run: node tests/workshop-actions.js

      - name: Full regression audit
        run: npm run audit:site

      - name: Games catalog gate (32 curated vs filesystem)
        run: node tests/games-qa.js

      - name: Game quality labels (READY / BETA / EXPERIMENT)
        run: node tests/game-quality.js

      - name: Flagship game quality gate
        run: node scripts/validate-game-quality.js

      - name: Games keep-rule playtest (all listed games, phone + desktop)
        run: node tests/games-keep-rule.js

      - name: Cover art exists
        run: node validate-covers.js

      - name: Workshop tool callouts
        run: node scripts/validate-workshop-callouts.js

      - name: Tools catalog gate (40 indexable vs 61 raw)
        run: node tests/tools-qa.js

      - name: Human review gate (SHIPPED is live)
        run: node scripts/check-human-review-gate.js

      - name: Check generated content drift (A13 guard)
        run: node scripts/check-generated-drift.js

      - name: Quality gate wiring guard
        run: node tests/validate-wiring.js

      - name: CSP sync guard (page metas match the shared policy)
        run: npm run check:csp-sync

      - name: Board drift + schema gate (private, skipped in CI if no tasks.json)
        run: |
          if [ -f "F:/Website/studio-workspace/tasks.json" ] || [ -f "../studio-workspace/tasks.json" ] || [ -f "$HOME/studio-workspace/tasks.json" ]; then
            node "F:/Website/studio-workspace/board-keeper.cjs" --check --no-auto || node "../studio-workspace/board-keeper.cjs" --check --no-auto || echo "board drift check skipped - no private tasks.json in this runner"
          else
            echo "private board not in CI (expected) - skip drift check, board-data.json freshness covered by drift guard above"
          fi

      - name: Smoke tests (headless Chrome)
        run: npm run test:smoke
