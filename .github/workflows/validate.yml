name: Validate site

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Keep private planning out of the public site
        run: npm run validate:public

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate internal links
        run: npm run validate:links

      - name: Shared resources and challenge regression
        run: npm run test:resources

      - name: Workshop answers and saved completion
        run: npm run test:workshop-answers

      - name: Offline cache and update regression
        run: npm run test:offline

      - name: Validate CSS
        run: npm run validate:css

      - name: Validate JS
        run: npm run validate:js

      - name: Validate contrast
        run: npm run validate:contrast

      - name: Validate workshops
        run: npm run validate:workshops

      - name: Full regression audit
        run: npm run audit:site

      - name: Check generated content drift (A13 guard)
        run: node scripts/check-generated-drift.js

      - name: Board drift + schema gate (private, skipped in CI if no tasks.json)
        run: |
          if [ -f "F:/Website/studio-workspace/tasks.json" ] || [ -f "../studio-workspace/tasks.json" ] || [ -f "$HOME/studio-workspace/tasks.json" ]; then
            node "F:/Website/studio-workspace/board-keeper.cjs" --check --no-auto || node "../studio-workspace/board-keeper.cjs" --check --no-auto || echo "board drift check skipped - no private tasks.json in this runner"
          else
            echo "private board not in CI (expected) - skip drift check, board-data.json freshness covered by drift guard above"
          fi

      - name: Social queue guard (devlog-data.js -> social-posts/queue)
        run: node scripts/generate-social-draft.js --check

      - name: Smoke tests (headless Chrome)
        run: npm run test:smoke
